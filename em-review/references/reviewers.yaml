# reviewers.yaml - Review-perspective registry (em-review SSOT)
#
# em-review uses a Claude generic reviewer agent (em-review:reviewer) plus one
# cross-validation reviewer agent per HARNESS, and injects the perspective as
# a skill:
#   - codex   → em-review:codex-reviewer (Codex CLI via the wrapper script;
#               the model is Codex's own recommended default)
#   - litellm → vertex-review:vertex-reviewer (`codex exec -p litellm -m
#               <model>`; an independently-installed plugin that fronts
#               Vertex AI MaaS and Meta Muse behind one LiteLLM proxy)
#
# Responsibility split: the harness plugin owns WHICH MODELS EXIST and how to
# reach them; this registry owns WHICH MODEL EACH PERSPECTIVE GETS. The
# `model` value below is handed to the reviewer verbatim — the reviewer never
# picks one on its own. Valid litellm model names are defined by the
# vertex-review plugin's `litellm-harness` skill:
#   vertex-deepseek-v3.2 | vertex-glm-5 | muse-spark
#
# The review phase reads this file to drive fan-out:
# - For each SELECTED perspective (per review-rules.yaml + discretion), launch
#   em-review:reviewer with instructions to load `claude_skill` via the
#   Skill tool.
# - When cross-validation fires (review-rules.yaml), ALSO launch ONE
#   cross-model reviewer per selected perspective: the FIRST entry in that
#   perspective's `cross_validation` chain whose harness is available
#   (codex_available / litellm_available, per review-phase.md Phase R0). No
#   available entry → no cross-model run for that perspective; the Claude
#   reviewer output stands alone.
# - A retryable skip advances along the chain in Phase R2b:
#   `rate_limited` → next entry; `budget_exhausted` / `harness_unavailable` →
#   next entry of a DIFFERENT harness. Budget is per harness, not per model:
#   every litellm entry draws on one virtual key with one monthly cap, so
#   another model on it fails identically.
#
# requires_spec: perspective only runs when a SPEC.md is available.
# cross_validation: ordered fallback chain for this perspective (empty =
#   Claude-only by design — comprehensive's value is breadth inside one
#   context, which a second model can't add).
#   security keeps codex in front (existing track record) and falls back to
#   muse-spark, whose upstream is Meta rather than Vertex. The other
#   perspectives take the cheap Vertex model first, muse-spark second (still
#   cheap, different upstream), and codex last — the only entry that survives
#   a LiteLLM budget wipeout.

version: 2

perspectives:
  - perspective: security
    claude_skill: review-security
    requires_spec: false
    cross_validation:
      - {harness: codex}
      - {harness: litellm, model: muse-spark}
  - perspective: performance
    claude_skill: review-performance
    requires_spec: false
    cross_validation:
      - {harness: litellm, model: vertex-deepseek-v3.2}
      - {harness: litellm, model: muse-spark}
      - {harness: codex}
  - perspective: architecture
    claude_skill: review-architecture
    requires_spec: false
    cross_validation:
      - {harness: litellm, model: vertex-glm-5}
      - {harness: litellm, model: muse-spark}
      - {harness: codex}
  - perspective: spec
    claude_skill: review-spec
    requires_spec: true
    cross_validation:
      - {harness: litellm, model: vertex-deepseek-v3.2}
      - {harness: litellm, model: muse-spark}
      - {harness: codex}
  - perspective: comprehensive
    claude_skill: review-comprehensive
    requires_spec: false
    cross_validation: []
