- question_id: review.oversized-diff-skip
  packet_id: null
  answered_at: '2026-09-21T21:20:00+09:00'
  source: batch-codex-consultation
  answer_mode: orchestrator_decision
  selected_option_ids: []
  freeform: 'review round 2 の fan-out で、litellm(muse-spark) を primary_chain の先頭に持つ performance / architecture
    の 2 観点が skip_reason: review_data_too_large を返した（統合 diff が 654,086 文字 / 12,234 行）。review-phase.md Phase
    R2b の retryable 表は rate_limited / budget_exhausted / harness_unavailable の 3 つだけを列挙しており、それ以外は「keep
    the skip」と規定している。gate_id を持たないオーケストレーター起点の判断であり、ユーザー指示「不明点は Codex に相談し、比較して良い方を採用」に基づいてCodex に相談した。

    '
  normalized_answer: '提示した選択肢: (A) プロトコル通り skip を維持する / (B) 3 観点に Claude fallback を dispatch する / (C)
    その他（対象 diff の絞り込み・前回未解決 high の引き継ぎ等）。

    Codex の回答: (C) を推奨。理由は (A) は既知の問題が集計から消える懸念が残ること、(B) は現行の fallback 発動条件（chain 消尽 / malformed / harness
    failure）の外にあること。加えて Codex は「R3b の指摘保持規則は今回報告された critical/high だけが対象で、前回分の自動引継ぎは規定されていない」「R5 でも未レビューという事実自体は完了を妨げない」と指摘し、round
    1 の未解決 high 8 件を現 HEAD と照合して修正確認・理由のある却下・規定された受容／延期が確認できるまで残件として保持する規則が必要だと述べた。

    採用した判断: (C) を採用したうえで、実現手段としては primary_chain の第 2 エントリ（codex ハーネス）へ walk を 1 段進めて performance / architecture
    を再 dispatch する形をとった。review_data_too_large は「every entry would hit identically」な入力問題ではない — codex ハーネスは同じ
    round の security / comprehensive で同じ 654KB の diff を完走しており、コンテキスト上限がハーネスごとに異なることが実証されている。よってこの skip
    は harness 依存であり、chain walk を 1 段進めるのが妥当と判断した。併せて、round 1 の未解決 critical/high は round 2 で再報告されなかったものもround
    記録から消さず、resolution を明示して残す。

    採用しなかった選択肢: (A) は architecture 観点が round 1 で 8 件中 4 件の high を出しており、skip のままだと round 2 の residual が実態より小さく出て隠蔽になるため不採用。(B)
    の Claude fallback は R2b の発動条件に該当しないため不採用。

    Codex の主張のうち採用しなかった点: 「17 ファイルへの絞り込みは変更されたプロトコル文書を確認対象から落とす」という指摘は事実誤認。絞り込みの対象 17 件はプロトコル文書と scripts
    そのものであり、落ちるのは tests/*.py と test-docs/*.yaml の 58 件。ただし結論（絞り込みに頼らない）は chain walk で満たされるため、実害はない。

