schema_version: 1
feature: self-write-digest-path-normalization
created: '2026-10-24'
base_branch: em-workflow/worker-self-write-digest/integration
goal: '# self-write-digest.py の self-write set の包含判定が validate-worker-output.py と違うパス正規化を使い、./
  で始まる allowed_write_roots の正当な自己書き込みを stale と判定する



  ## 現象 (必須)


  <code>em-workflow/scripts/self-write-digest.py</code> の <code>_segments</code>（249-252
  行付近）は空の要素だけを落とし、<code>.</code> の要素を残す。既存の <code>em-workflow/scripts/validate-worker-output.py</code>
  の <code>path_segments</code>（357-362 行付近）は空の要素と <code>.</code> を落とし、<code>\</code>
  も区切りとして扱う。


  このため <code>allowed_write_roots</code> が <code>./feature-docs/example/tasks/</code>
  のように <code>./</code> で始まると、既存の範囲検証は新しいタスクファイルの作成を許可する一方、self-write-digest.py では
  root が <code>(''.'', ''feature-docs'', ''example'', ''tasks'')</code> になり、self\_write\_set
  から漏れる。置換されないので digest が一致せず、worker 自身の正当な書き込みが stale と判定される。空の root と <code>.</code>
  だけの root でも同じ向きの食い違いがある。


  ## 再現手順 (必須)


  1. <code>allowed_write_roots</code> に <code>./feature-docs/example/tasks/</code>
  を持つ write\_policy で planner を dispatch する

  2. planner が <code>feature-docs/example/tasks/task0004.md</code> を作成して戻る

  3. self-write-digest.py で R1 の返却後比較を行うと、task0004.md が self\_write\_set に入らず stale
  と判定される


  ## 期待する挙動 (必須)


  self-write-digest.py の包含判定が validate-worker-output.py の範囲検証と同じパス正規化を使い、範囲検証が許可した書き込みは
  self\_write\_set に入る。


  ## 完了の定義 (必須)


  - [ ] 再現手順で現象が起きない

  - [ ] 再発を検出するテストがある


  ## 該当箇所 (任意)


  - <code>em-workflow/scripts/self-write-digest.py:249</code>

  - <code>em-workflow/scripts/validate-worker-output.py:357</code>

  - <code>em-workflow/references/contracts/worker-envelope.md</code>（R1 の self-write
  set の包含規則）


  ## 実害・発生条件 (任意)


  feature worker-self-write-digest の review round 1（comprehensive 観点、medium）で見つかった。食い違いは厳しい側（偽の
  stale）に倒れるため見逃しの方向の安全性は保たれるが、無人実行で正当な結果が棄却され続ける。<code>./</code> 付きや空の root を書く dispatch
  でだけ起きる。

  '
