- stable_id: 02ffeea89c656388
  severity: medium
  category: security
  file: em-workflow/scripts/codex-hook-interactive-guard.py
  line: 1018
  title: "TM-1: リダイレクトだけのコマンドで対話起動の拒否を回避できる"
  description: "`_flush`（1011-1027 行）は語のあるコマンドを終えたとき（`if made:`）だけ `list_pending` を下ろす。リダイレクト先は語にならないので、`&&` / `||` の右辺がリダイレクトだけ（`< /dev/null`、`> /dev/null`、`<<EOF` など）のとき、そのコマンドが終わっても `list_pending` は True のまま残る。改行分岐のチェックポイント条件（`not self.list_pending`）が満たされず、`python3 -i &&\\n< /dev/null\\necho '` はチェックポイントが (0, 0) のまま `_Undecidable` に達し、何も出力しない。bash はリダイレクトだけの単純コマンドでリストを完結させ、後ろの構文エラーより先に 1 行目を実行する。SPEC FR2 のチェックポイントの定義からのずれ。`pipe_pending` は `_separator` の `elif sep != \"\\n\" or redirected`（1050 行）でリダイレクトだけのコマンドでも下ろしている。em-review のコピーも同一。変更前は判定不能な文字列がすべて無出力だったので後退ではない。"
  suggestion: "`_separator` で `list_pending` を `pipe_pending` と同じ規則で扱う。`&&` / `||` なら True、それ以外は `sep != \"\\n\" or redirected` のとき False。両コピーを同じ変更で直し、CASES に deny の行を足す: `python3 -i &&\\n< /dev/null\\necho '`、`python3 -i || > /dev/null\\necho '`、`python3 -i && > /dev/null;\\necho '`、`python3 -i &&\\n<<EOF\\nx\\nEOF\\necho '`、およびこれらを `bash -c` の中に入れた行。"
  reproduction: "両スクリプトをそれぞれ python3 -B で実行し、標準入力に {\"tool_input\":{\"command\":\"python3 -i &&\\n< /dev/null\\necho '\"}} を渡すと、終了コード0、標準出力なしとなる。比較として `< /dev/null` を `: < /dev/null` に変更すると deny が返る。"
  reproduction_alternates: []
  reproduction_overflow: false
