    resolution_note: 'gate: create-spec.requirement-clarification; codex_consulted:
      true; Codex: 指定された6箇所を、コメントと説明文だけ修正する方がよい。3箇所だけでは、公式抜粋の deny > defer > ask >
      allow と矛盾する同じ説明が、同じ2ファイルに残る / options not chosen: listed_only; replacement guidance
      per location: em-workflow/hooks/destructive-guard.py:349-354: プロセス対象の判定は kill-guard
      が担当し、この hook は自身の破壊的操作の検査を続けながら、該当時の末尾の allow だけを控える、と記載する。kill-guard は実際には
      deny/ask を出力し、安全な対象などでは無出力で終了する（kill-guard.py:330-369）。他 hook の deny/ask を保護するために
      allow を控える、という理由は削除する; em-workflow/hooks/destructive-guard.py:8855-8857: matches_target_shape
      が True になる対象でも自身の検査は続け、末尾の allow は返さない、と記載する（destructive-guard.py:9101-9134）。failed-run-cleanup-guard
      は failed がなければ無出力になるため、その場合にもこの hook が追加の許可を与えない、という実際の動作を説明できる（failed-run-cleanup-guard.py:684-695）。当初の設計理由は補わない;
      em-workflow/hooks/destructive-guard.py:8981-8985: コマンド文字列が直後の KILL_WORDS の検索条件に一致すると末尾の
      allow を控えるが、複合コマンドの他の破壊的操作に対する検査は続ける、と記載する（destructive-guard.py:8986-8988,9107-9134）。この検索は文字列に対する判定なので、kill-guard
      が実際に判定を返すことまでは保証しない; em-workflow/README.md:139: 10本の並びは hooks.json:5-65 で確認できる登録順として記載する。判定の優先順位は
      deny > defer > ask > allow とし、allow が他 hook の deny/ask を上書きするという順序の理由を削除する。bash_guard
      は未承認の対象に deny を返す（bash_guard.py:200-219）。heredoc-stdin-guard は許可判定を返さず updatedInput
      を出力する、とだけ説明する（heredoc-stdin-guard.py:463-474）。提供された根拠から実行順の保証や末尾配置の必要性は断定しない'
