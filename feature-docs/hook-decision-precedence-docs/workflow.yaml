base_branch: main
goal: |-
  em-workflow: フック文書の「allow が別フックの判定を上書きする」記述を公式の判定優先順位（deny > defer > ask > allow）に合わせて直す
  
  ## やりたいこと (必須)
  em-workflow のフック関連文書にある「hook の allow が別フックの判定を上書きする」旨の記述を、公式仕様の判定優先順位に合わせて直す。
  ## 背景・なぜ (必須)
  公式ドキュメント（ https://code.claude.com/docs/en/hooks ）では、複数の PreToolUse フックが異なる判定を返したときの優先順位は deny \> defer \> ask \> allow と定められている。
  一方、次の箇所には allow が別フックの deny を上書きする、または hook の判定が permissions.deny より優先される、という趣旨の記述がある。
  - `em-workflow/hooks/destructive-guard.py` の docstring（30-31 行付近、349-355 行付近）
  - `em-workflow/README.md` の 148 行付近
  feature cross-repo-write-guard の create-spec で Codex に相談した際に食い違いが判明した。この feature では destructive-guard.py を変更しないと決めたため、別タスクとして残す。
  ## 受け入れ条件 / 完了の定義 (必須)
  - [ ] 上記の記述が公式仕様の判定優先順位と食い違わない
  - [ ] destructive-guard.py の判定処理（コード）は変更しない
  - [ ] `python3 em-workflow/hooks/tests/run-destructive-guard.py` が通る
  ## スコープ外 (任意)
  destructive-guard.py の委譲（defer_to_kill_guard 等）の挙動の見直し。
  ## 制約・前提 (任意)
  \<触ってほしくない箇所 / 使う技術 / 互換性など。あれば\>
