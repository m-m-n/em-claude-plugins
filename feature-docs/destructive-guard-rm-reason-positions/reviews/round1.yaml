  title: _register_marker_positions() の int() が偽造マーカーで ValueError を出してフックがクラッシュする（fail-open への後退、FR5 違反）
  description: 今回の差分で新しく入った _register_marker_positions() は、マーカーを消す前のトークンに _MARK_RE を当て、int(m.group(1)) を例外処理なしで呼んでいる。\x00 + 4301 桁以上の数字 + \x02 の偽造マーカーで Python の整数文字列変換の桁数上限に当たり ValueError になり、例外は statements() から main() まで伝わってフックは exit 1 で終わる（判定が出ない＝fail-open）。ベース 94875785 は同じ入力を deny / rm-recursive と判定する。偽造マーカーを別の文に置いても同じコマンドの rm 判定がすべて出なくなる。既存の _strip_unresolved_marks() は同じ入力を try/except ValueError で防いでいる。既存スイートにも新しい unittest にも偽造マーカーのケースは無い。
  suggestion: _register_marker_positions() の int() を _strip_unresolved_marks() と同じく try/except ValueError で囲み、解析できないマーカーは continue で飛ばす。.claude/rules/hook-tests.md に従い、直す前に deny の回帰ケース（rm -rf /var/x + NUL + '1'*5000 + STX、echo NUL + '9'*5000 + STX; rm -rf /var/x → いずれも deny / rm-recursive）を足す。
