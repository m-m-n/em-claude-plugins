  title: bash の読みの区切り語で、本文の継続行をつながずに終端を判定して誤って拒否する
  description: '_read_heredocs（1902〜1915 行）は本文を物理行ごとに区切り語と比べ、バックスラッシュ＋改行の継続をつながない。bash は引用が ${ ... } の中にしか無い区切り語を引用なしの語として扱うため、本文の継続行をつないでから終端と比べる。例: `false && cat <<${v:-"x"}` / `prefix\` / `${v:-"x"}`
    / `python3 -i` / `${v:-"x"}` の 5 行で、bash では python3 -i は本文に残るが、この実装は 3 行目で本文を閉じて拒否する（誤拒否）。同じ食い違いは `cat <<EOF` のような引用の無い区切り語では変更前からあり、この変更は ${ ... } 形をその仲間に加えた。両コピーで同じ。'
  suggestion: FR4（区切り語の位置にない読みは変えない）の範囲を超えるため、この SPEC では直さず別の課題にする。直すときは、引用の無い区切り語の本文でバックスラッシュ＋改行をつないでから終端と比べ、EOF 形と ${ ... } 形の両方のケースを両コピーに流す CASES に足す。
