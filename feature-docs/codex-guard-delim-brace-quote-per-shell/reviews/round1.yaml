- stable_id: ee093cf2056107da
  severity: medium
  category: security
  file: em-workflow/scripts/codex-hook-interactive-guard.py
  line: 3546
  title: sh / ksh の二重読みで入れ子の -c 文字列が 2^深さ 回たどられ、NESTED_READ_LIMIT を使い切って後続の対話起動を素通しにする
  description: parse の二重読みは、読み A と読み B の単純コマンドをつなげて返す（3546 行）。sh / ksh が持つ文字列で区切り語の 2 つの形が違うと、その中の入れ子の sh -c は両方の読みから 1 回ずつたどられ、FR5 どおり 2 回数えられる。これが入れ子の段ごとに重なるので、深さ d の文字列は 2^d 回たどられる。6 段の入れ子では合計約 150 万文字で
    NESTED_READ_LIMIT（1,000,000）を途中で超え、後にある第 2 階層の sh -c 'python3 -i' は読まれずに素通りする。変更前は同じ入力を拒否していた。実装は FR5 / A-2 の文言どおりだが、NFR2 の「1 つの文字列を読む回数は定数回」の意図とずれる。両コピーに同じ形で出る。
  suggestion: 'FR5 / A-2 と AC6 のテストが固定している「両方の読みが届く入れ子は 2 回数える」が変わるため、先に SPEC の判断を要する。案: 二重読みで、読み A と同じ文字列・同じ種類・同じ区切り語の読み・同じ接続の入れ子の -c 文字列は 1 回だけ読み、2^深さ の増幅を止める。再現入力を拒否する回帰テストを両コピーに足す。'
  reproduction: "作業ディレクトリで、以下を Python 3 の非対話実行に渡す。生成した command 自体は実行せず、フックへの入力としてのみ使用する。\n\nimport json, shlex, subprocess\nunit = 'false && cat <<${v:-\"x\"}\\n${v:-\"x\"}\\n${v:-x}\\n'\ns = ': ' + 'x'\
    \ * 12000\nfor _ in range(6):\n    s = 'sh -c ' + shlex.quote(s) + '\\n' + unit\ns = 'sh -c ' + shlex.quote(s) + '\\nsh -c ' + shlex.quote('python3 -i')\ncommand = 'sh -c ' + shlex.quote(s)\nfor plugin\
    \ in ('em-workflow', 'em-review'):\n    path = plugin + '/scripts/codex-hook-interactive-guard.py'\n    r = subprocess.run(['python3', '-B', path], input=json.dumps({'tool_input': {'command': command}}),\
    \ text=True, capture_output=True, timeout=10)\n    print(path, r.returncode, repr(r.stdout))\n\n両コピーとも終了コード0、標準出力は空になり、拒否を返さない。変更前のコードでは同じ入力を拒否する。また、s 内の python3 -i を printf REACHED に置き換えた安全な実行では REACHED\
    \ が出力され、後続コマンドに実際に到達することを確認した。"
