  title: "TM-5: 複数のオプションを含む行の -r を辿らず、直接依存を黙って推移的依存として扱う"
  description: "`_requirements_option` は行の先頭のオプションしか見ない。`-c constraints.txt -r deps.txt` や `--index-url https://x/simple -r deps.txt` では、pip は deps.txt を読むが、直接依存の集合は空のまま complete=True になる。deps.txt で宣言した直接依存の high/critical の advisory は推移的依存として捨てられ、finding にも判定不能の件数にも残らない（TB-1 / TM-5）。評価者が再現済み。"
  suggestion: "オプション部分を shlex で分割し、位置に関係なく `-r`/`--requirement`（`=` 形式も含む）の値をすべて辿る。解釈できないときは complete=False にする。`-c a -r b` と `--index-url URL -r b` の 2 形式のテストを足す。"
  sources: ["codex:security"]
  confidence: 90
  resolution: unresolved
  resolution_reason: "medium のため auto-fix 対象外（R4 は critical/high のみ）"
- stable_id: b34e1e48141a9af9
  severity: medium
  category: security
  file: em-workflow/scripts/scan-dependencies.py
  line: 1669
  title: "TM-5: path 依存による暗黙のワークスペースメンバーがあっても集合を完全として扱う"
  description: "`_cargo_workspace_view` は `[workspace]` に members が無い・空配列のとき complete=True を返す。Cargo ではワークスペース配下の path 依存は自動でメンバーになり、その依存は Cargo.lock に入るがマニフェストは読まれない。members を省いた `[workspace]` と `member = { path = \"member\" }` では {'member'} のまま complete=True となり、member の直接依存の advisory が黙って捨てられる。SPEC FR5 の文言の範囲外だが、FR5 の意図と TM-5 に反する。評価者が再現済み。"
  suggestion: "`[workspace]` があり、ルートの依存テーブル（target 配下も含む）に `path` を持つエントリがあるときは complete=False にする。members の省略・空配列と path 依存の組み合わせのテストを足す。"
  sources: ["codex:security"]
  confidence: 85
  resolution: unresolved
