schema_version: 1
feature: wake-task-cleanup-script
created: '2026-11-27'
base_branch: main
goal: |
  # em-workflow: implement の wake のタスク後片付けをスクリプトにまとめ、オーケストレーターがコマンドを組み立てないようにする

  種別: 改善

  ## やりたいこと

  em-workflow の implement の wake で行うタスクの後片付け（タスクの worktree の削除とタスクブランチの削除）を、スクリプトにまとめて実行する。オーケストレーターがその場でコマンドを組み立てないようにする。

  ## 背景・なぜ

  `references/implement-phase.md` の wake の手順 4（Clean up）は、タスクブランチを `git -C {integration_worktree} branch -d "em-workflow/{feature}/{T}"` で消すと定めている。`-d` は今チェックアウトしているブランチに取り込まれているかで判定するため、integration の worktree から実行する必要がある。

  check-dispatch-config の batch 実行で、オーケストレーターはこの手順に従わず、メインのツリー（main）から `git branch -d` を実行した。main には取り込まれていないので失敗し、続けて手順が禁じている `-D` を試してガードに止められた。タスクブランチ `em-workflow/check-dispatch-config/task0001` は integration に取り込み済みなのに残った。

  手順書に正しいコマンドがあっても、オーケストレーターが自分で書き直すと同じことが起きる。

  ## 受け入れ条件 / 完了の定義

  - wake の手順 4 の後片付けを行うスクリプトが `em-workflow/scripts/` にある。入力は integration の worktree、feature、タスク ID など、後片付けに必要な値だけ
  - スクリプトは `git worktree remove` と、integration の worktree を基準にした `git branch -d` を実行する。`-D` や `--force` は使わない
  - ブランチを消せなかったときは、残したブランチ名と理由を機械で読める形で返す。wake の報告にはその値を書く
  - `references/implement-phase.md` の手順 4 が、コマンドを直接書かずにこのスクリプトを呼ぶ形になっている
  - メインのツリーなど integration 以外の場所から呼んでも、取り込み済みのタスクブランチを消せることをテストで確かめる

  ## スコープ外

  - integration ブランチ自体の削除（Step C / merge スキル）は対象外

  ## 制約・前提

  - プラグインの中身を変えるので、plugin.json の version を上げる（リポジトリの決まりに従う）

  ## 追加指示

  - Once the implementation is finished, push the integration branch to the remote and create a Pull Request against base_branch with gh pr create. Keep the integration branch both locally and on the remote (do not auto-merge it into base_branch).
  - Consult Codex on any unclear points and adopt the option judged to be comparatively better.
  - Record the content of that discussion in Notion.
