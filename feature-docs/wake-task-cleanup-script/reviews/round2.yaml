  title: GIT_CONFIG を継承すると has_upstream() と branch -d で追跡先の見え方が食い違う
  description: Git クラス（216-222行）が子プロセスの環境から取り除くのは REPO_LOCATION_VARS だけ。GIT_CONFIG=/dev/null のとき `git config --get branch.<b>.remote` は終了値1を返すが、for-each-ref は同じ追跡先を返す。呼び出し元の環境に GIT_CONFIG があると、has_upstream() は False を返し、`git branch -d` は設定済みの追跡先を基準に判定する。その結果「追跡先があれば保持」を素通りする。ただし先端はロックの中で integration に含まれることを確かめており、-d は追跡先への取り込みも求めるため、コミットが失われることはない。
  suggestion: 子プロセスの環境から GIT_CONFIG を取り除く（REPO_LOCATION_VARS と同じ扱い）。そのうえで、追跡先のあるブランチに GIT_CONFIG=/dev/null を渡しても branch.result が kept になる試験を追加する。
