    を基準にした `git branch -d` を順に直接実行する。削除に失敗した場合は強制削除を禁じ、wake の報告には残したブランチ名を書く規定がある。失敗理由を機械で読める形で返す処理はない（em-workflow/references/implement-phase.md:971、em-workflow/references/implement-phase.md:1151）。

    既存の文面テストは Git コマンドの直接記載と順序を検査し、ガードのテストは手順 4 から両コマンドを抽出して判定する。メインの worktree から後片付けを呼び、実際にタスクブランチが消えることを確かめるテストは確認できなかった（tests/test_implement_phase_guard_compatible_wording.py:123、tests/test_implement_phase_guard_compatible_wording.py:170、tests/test_protocol_git_ops_pass_destructive_guard.py:382、tests/test_protocol_git_ops_pass_destructive_guard.py:472）。呼び出し・依存の
