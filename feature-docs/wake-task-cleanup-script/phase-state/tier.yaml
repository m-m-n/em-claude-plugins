    2 件。既存の wake 用ヘルパーに JSON 出力の先例があり、テスト規則は標準ライブラリの unittest と一時 Git リポジトリを使う（em-workflow/scripts/recover-orphaned-task.py:99、test/README.md:5、test/README.md:36）。

