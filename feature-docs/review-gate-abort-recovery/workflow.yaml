schema_version: 1
feature: review-gate-abort-recovery
created: '2026-10-05'
base_branch: main
goal: '# em-workflow: rework.spec-change ゲート中断が review.status に failed を書き、停止条件 3 で feature が復旧不能になる


  Notion task: https://www.notion.so/3d53509ec8ee81de95c5fd4aed538494


  ## 現象 (必須)

  `rework.spec-change` の fail-closed ゲートで review フェーズが中断したとき、オーケストレーターが `workflow[review].status` に `failed`
  を書き込む。その結果、その feature は develop の停止条件 3 に永久に掛かり、batch でも interactive でも先へ進めなくなる。

  2 点の食い違いがある。

  1. `em-workflow/references/review-phase.md` の 848 行目付近は `status: failed` を「two structural degradation」ケースに予約すると宣言している。ゲート中断はそのどちらでもない。

  2. develop の停止条件 3 の carve-out は `implement` の `failed_kind` と `verify` の cap 到達の 2 つだけ。`review: failed`
  はどちらにも当たらないため、`/em-workflow:develop <feature>` を interactive で叩いても Step B が step を特定した時点で停止する。申し送りが想定した「interactive
  で再開すればゲートに答えられる」経路は成立しない。

  復旧には `workflow[review].status` とトップレベル `review.status` を人手で `pending` に戻す手編集が要る。この手順はどの SSOT にも書かれていない。

  ## 再現手順 (必須)

  1. batch 実行で review フェーズが residual critical/high を残し、rework-planner が `gate_id: rework.spec-change`
  の question packet を返す

  2. その feature の `workflow.yaml` に `goal` ブロックが無いため、`references/question-resolution.md` の Classification
  gate が inapplicable となり run が停止する

  3. 停止時にオーケストレーターが `workflow[review].status: failed` を書き、コミットする

  4. 同じ feature を interactive で `/em-workflow:develop <feature>` として再開する

  5. Step B が最初の未完了 step として `review`（`failed`）を特定し、停止条件 3 で即停止することを確認する

  実例: `em-workflow/exit4-tip-argument/integration`（PR #17）。コミット `5dc0f6c docs(exit4-tip-argument): review
  aborted at rework.spec-change fail-closed gate`。

  ## 期待する挙動 (必須)

  ゲート中断で停止した review から、手編集なしに正規手順で復帰できること。次のいずれか。

  - (a) ゲート中断時に `review.status` を `failed` にせず、`pending` のまま（`needs_rework: true` と中断記録を伴って）残す。`status:
  failed` は review-phase.md が予約する 2 つの structural degradation ケース専用に戻す

  - (b) `review: failed` に対する停止条件 3 の carve-out を定義し、再エントリ時にゲートを再提示する経路を SSOT に書く

  - (c) ゲート中断からの復旧手順（どのフィールドをどの値に戻すか）を SSOT に明記し、オーケストレーター自身が実行できるようにする

  ## 完了の定義 (必須)

  - [ ] 再現手順で現象が起きない

  - [ ] 再発を検出するテストがある

  - [ ] `review.status: failed` の意味が review-phase.md の予約宣言と一致している

  - [ ] `python3 -m unittest discover -s tests` が通る

  ## 該当箇所 (任意)

  - `em-workflow/references/review-phase.md` — 848 行目付近の `status: failed` 予約宣言、および Rework path / Batch
  mode 節

  - `em-workflow/skills/develop/SKILL.md` — 停止条件 3 と、その carve-out（`implement` の `failed_kind` / `verify`
  の cap 到達）

  - `em-workflow/references/question-resolution.md` — Classification gate の Applicability（`goal` ブロック欠如時の
  inapplicable 停止）

  - `em-workflow/references/rework-task-synthesis.md` — Section 10 の SPEC-change transition

  ## 実害・発生条件 (任意)

  `goal` ブロックを持たない古い feature が SPEC 変更を要する review 指摘を受けると、確定的にこの状態になる。`exit4-tip-argument` は 2026-08-18
  の停止以降 3 週間動かせていない。子 feature `tip-capture-idiom-unification` はこの feature を親ブランチにしているため、同時に止まっている。

  Codex 相談（2026-09-08）でも「interactive に切り替えるだけで再開できるとは保証できない。停止条件 3 は対話にも適用される」と独立に指摘されている。


  ## 追加指示（起動者）

  Once the implementation is finished, push the integration branch to the remote and create a Pull Request
  against base_branch with gh pr create. Keep the integration branch both locally and on the remote (do
  not auto-merge it into base_branch).

  Consult Codex on any unclear points and adopt the option judged to be comparatively better.

  Record the content of that discussion in Notion.

  '
