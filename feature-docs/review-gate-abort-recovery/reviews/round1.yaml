    にしなかった軽い観察が 3 つある。(1) Legacy review-failure recovery は「orchestrator が復旧する」と書く一方で、Step B の分岐を足さない。そのため、いつ・誰の指示で適用するかは、停止報告と resume_conditions を経由すると読むしかない。(2) classification は追記型なので、古い decision: stop が末尾に残ったまま別の理由で review が failed になった場合にも、条件が成り立ちうる。その結果は review の再実行なので、害は小さい。(3) interactive での Precedence reservation（reversible: false）による中断は 4 種に入っていないが、SPEC FR1 の対象の列挙とは一致している。'
