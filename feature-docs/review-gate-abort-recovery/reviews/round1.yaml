  description: Spec-change gate abort (review-sourced rework) ブロックは、4 種の中断すべてに同じ再開経路を当てている（新しいラウンド → Completion gate → 通常の rework → interactive で spec-change の質問）。停止報告にも「interactive で /em-workflow:develop を実行すれば spec-change の判断に進む」と書かせている（1065-1076 行）。一方、packet を obsolete に閉じるのは Classification gate の Stop と Inapplicable だけ（question-resolution.md Classification gate step 11）。origin-membership failure と malformed spec-change pairing abort の後に packet がどの状態で残るかは、このブロックにも引用先にも書かれていない。E8f のテストも、obsolete の主張をこの 2 種に広げないよう意図的に絞っている。phase-state.md の Resume decision table は、phase-state が awaiting_answers の phase で未回答の question を再提示する。rework に再び入ったときに旧 packet の question が再提示されると、malformed pairing は両モードで final な abort なので同じ中断を繰り返す。その場合、停止報告が約束する経路には届かない。前提のうち「rework に再び入るとき既存の rework.yaml を再開するのか、新しく始めるのか」（rework-task-synthesis.md 側）は、読み取り予算 10 件を使い切ったため確認していない。そのため確信度は低めにしている。SPEC FR3 も obsolete の packet にしか触れておらず、実装は SPEC には沿っている。
  suggestion: 2 種の abort の後に残る packet を再開時にどう扱うかを SSOT のどこかで明記する（obsolete にする / supersede する / 再提示しない のいずれか）。または、SC1 ブロックの再開経路と停止報告（E8・E9）の記述を Stop と Inapplicable に限る。どちらも SPEC の範囲を超える設計判断なので、直すかどうかは人が決める。
