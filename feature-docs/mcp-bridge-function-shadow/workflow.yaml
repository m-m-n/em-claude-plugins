goal: '# destructive-guard: 同名のシェル関数で mcp-bridge を上書きした場合の notion 除外判定


  ## 脆弱性の概要 (必須)


  destructive-guard の notion ペア除外判定が、同じチャンク内で mcp-bridge という名前のシェル関数を定義して呼び出す形を見分けられない。除外が維持されたまま関数本体が実行され得る。


  ## 参照 (必須)


  - CVE / GHSA ID: 該当なし

  - アドバイザリ URL: 該当なし

  - severity: medium

  - 該当パッケージ: 該当なし

  - 現在のバージョン: 該当なし

  - 修正済みバージョン: 無し


  ## 攻撃シナリオ (必須)


  Bash コマンドの中で mcp-bridge と同名の関数を定義し、続けて notion 呼び出しの形をとる。ガードは notion ペアとして検査対象から外すが、実際には関数本体が実行される。


  ## 影響範囲 (必須)


  destructive-guard が拒否すべき破壊的コマンドが、notion 呼び出しの除外を経由して素通りし得る。


  ## 完了の定義 (必須)


  - [ ] 攻撃シナリオが成立しない

  - [ ] 修正版に追随している（修正版が無い場合は暫定緩和策の欄に対応を記載）


  ## 該当箇所 (任意)


  <code>em-workflow/hooks/destructive-guard.py</code> の notion ペア除外判定。args-json-deferred-eval-bypass のレビュー round 1（stable\_id 4a4542dc55b04a23）で指摘され、その脅威モデルではスコープ外と判断した。


  ## 暫定緩和策 (任意)


  \<修正までの回避手段。あれば>

  '
