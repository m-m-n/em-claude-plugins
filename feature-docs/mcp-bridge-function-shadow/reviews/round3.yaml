  title: env 経由の子シェルで -c をまとめた短いオプション(-xec など)にすると、notion 呼び出しの本文を読まない(c5004b080dd84304 と同根)
  description: 読解で再現した。_args_json_has_dash_c()(9639-9650)と子コマンド以降の -c の探索(9706-9711)は、ちょうど `-c` の語しか受け付けない。そのため
    `/usr/bin/env 'BASH_FUNC_mcp-bridge%%=() { :; }' bash -xec "<notion 呼び出し>"` では env 経路が _ARGS_JSON_NOTHING
    を返し、本文は派生チャンクにならない。ただし、通常のシェル本文の取り出し(4460-4461 の `"-c" in args`)にも同じ制限があり、基準版でも変更後でも `bash -xec "git
    branch -D example"` の本文は検査されない。この迂回には notion ペアも BASH_FUNC_ も要らない。変更が持ち込んだ欠落ではなく、フック全体の既存の欠落で、round
    1 の ae32730787ed203e(4455)と round 2 の c5004b080dd84304(9644)で deferred として記録済み。env 経路は設計上この取り出しに合わせているので、medium
    に下げた。なお `-cPAYLOAD`(-c に本文をつなげる形)は bash がコマンド文字列として受け付ける形ではない。実在するのは、まとめた短いオプションの中に c を含む形(-xec、-ec、-lc、-cx)。
  suggestion: 既存の後続タスク(ae32730787ed203e / c5004b080dd84304)で扱う。シェルのオプションを読む共通処理を作り、まとめた短いオプションの中の c を見つけて本文を取り出す。そのうえで、通常の本文の取り出しと
    env 経路(_args_json_has_dash_c() と 9706 の探索)の両方からその処理を使う。この機能の範囲では直さない。
  reproduction: 'input: /usr/bin/env ''BASH_FUNC_mcp-bridge%%=() { :; }'' bash -xec "mcp-bridge run --mcp
    notion --tool notion-create-comment --args-json ''{\"command\":\"git branch -D example\"}''" | path:
