  description: _args_json_payload_chunk()(9573-9574)は、head() が env を読み違える形の静的な -c 本文すべてに対し、notion 呼び出しを含むかを確かめる前に
    lex_shell(payload, "shell") を呼ぶ。lex_shell() はモジュールの大域変数 _lex_unreadable_met を立て(3366、3522)、run() はそれが立っていると
    ask 未満の判定を ask に上げる(13464)。無人実行ではそれが deny に降格する。そのため、変更前は本文を読まず allow だった `/usr/bin/env bash -c '<区切り語が
    ${tag} の cat のヒアドキュメント>'` が、ask / deny になる。これは docstring(9680-9683「the notion-pair path 以外はこの本文を見ない」)と、THREAT-MODEL
    の TM-4(task0002 が足した読み取りは notion ペアの経路だけに効く)、FR7 に反する。TS-25 は `/usr/bin/env bash -c "git branch -D
    example"` を allow に固定しているが、このフラグの漏れは固定していない。判定は通常の `bash -c` の形が既に受けるものと同じなので、影響は無人実行で止まる回数が 1 つ増える程度。
  suggestion: env 経路の本文の字句解析では、lex_shell() が立てる大域フラグ(_lex_unreadable_met、同じ形の _lex_extglob_met)を呼び出しの前後で保存し、元に戻す。または、本文の文字列が
