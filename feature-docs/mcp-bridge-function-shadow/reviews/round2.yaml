  description: _skip_assignments_and_wrappers() の env のオプション読みは単独の `-` で止まり、head() は `-` を実行名として返す。WRAPPERS との照合は完全一致なので `/usr/bin/env` も env として読まれず、head() は `env` を実行名として返す。このため `env - git branch -D example` や `/usr/bin/env bash -c "git branch -D example"` は通常の破壊操作検査と -c 本文の取り出しを通らない。基準版から同じ欠落で、round 1 の c0598deb75b9d2c7 / 8ec945002f0cf118 の rework は notion ペアの経路（_args_json_env_payload_values()）だけを直し、一般の経路は残した。今回の差分はこの関数に after_env を足しているが、この欠落には触れていない。notion 経路の追加の穴（字句解析の上限、入れ子、代入値の展開、`-ec`、代入値の basename 誤認など）はどれもこの一般の欠落より攻撃が簡単にならないため、本ラウンドでは medium とした。SPEC の範囲（notion ペアの除外）の外なので、別タスクで直すことを推奨する。
  suggestion: 別タスクで、env のオプション読みが単独の `-` を消費し、ラッパーの照合を basename で行うようにする（failed-run-cleanup-guard.py の head() は既に basename で照合している）。直すときは TS-25 の該当ケース（destructive-guard-cases.json 1538〜1541 行）を deny に改め、誤爆が無いことを runner で確かめる。
