    title: "パイプや入力リダイレクトを受けた匿名関数の本体を「プログラムなし」で誤って拒否する"
    description: "_open_group(\"(\") が _names_function([function]) を呼び、新しい 441 行目の分岐で False が返る。続く _flush() は [function] を 1 つの単純コマンドとして出力し、その時点の pipe_pending と self.stdin をこの [function] が受け取る。空の `()` グループは pipe=False で作られ、fn_head も立たないため、続く `{` グループも pipe=False・stdin=False・connected=False になる。本体の `python3` はオペランドなし・未接続と判定され、noprogram で deny になる。変更前は本体が skip され何も出力しなかった。zsh はパイプラインの入力を匿名関数の本体に渡すので、python3 はプログラムをパイプから読み対話にならない。今回の変更で生まれた誤検知（拒否側）。em-review 側のコピーも同一。オーケストレーターも zsh -c 'printf \"print(1)\\n\" | function () { python3; }' と zsh -c 'function < /dev/null () { python3; }' で deny になることを確認した。"
    suggestion: "_open_group で、head が匿名関数（予約語を除いた残りが bare な function 1 語）になったときは、flush する前の pipe_pending / self.stdin を `()` グループに持たせ、空の `()` が閉じたら次に開くグループ（本体）に接続を引き継ぐ。CASES に silent の zsh -c 'printf \"print(1)\\n\" | function () { python3; }' と deny の '... | function () { python3 -i; }' を追加し、両コピーをバイト単位で一致させる。"
    reproduction: null
    reproduction_alternates: []
    reproduction_overflow: false
