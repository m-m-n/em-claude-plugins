goal: '# codex-hook-interactive-guard: 予約語の直後の zsh 匿名関数 function () { ... } の本体を判定せず、対話起動を見逃す


  Notion: <notion-url>  (種別: バグ)


  ## 現象

  `codex-hook-interactive-guard.py`（em-workflow / em-review の両コピー）が、予約語の直後に書いた zsh の匿名関数 `function ()
  { ... }` を関数定義とみなし、本体を判定しない。zsh ではこの構文は定義した匿名関数をその場で実行するため、本体の対話起動を見逃す。

  feature `codex-guard-reserved-word-funcdef`（先頭に続く予約語を取り除いてから関数名を判定する修正）の review round 1 で、security 観点のレビュアーが報告した。evaluator
  はコードを読んで再現を確認し、重大度を low とした。

  - 変更前: `! function () { python3 -i; }` は語の並び `[!, function]` が 2 語で関数名にならず、本体を判定して deny していた

  - 変更後: `!` を取り除いた残りの 1 語 `function` を関数名とみなし、本体を判定しない（silent）

  - `then function () { python3 -i; }` も同じ動きになる

  - 前置のない `function () { python3 -i; }` は変更前から silent


  ## 再現手順

  1. コマンド `zsh -c ''! function () { python3 -i; }''` を `{"tool_input": {"command": "..."}}` として hook の標準入力に渡す

  2. 何も出力されない（silent）

  3. 参考: `zsh -c ''! function () { builtin printf "BODY\n"; }''` を実行すると本体がその場で実行される


  ## 期待する挙動

  名前のない `function ()` は zsh の匿名関数として、実行されるグループと同じく本体を判定し、deny する。予約語の直後でも、前置がなくても同じ扱いにする。


  ## 完了の定義

  - [ ] 再現手順で現象が起きない

  - [ ] 再発を検出するテストがある

  - [ ] `tests/test_codex_hook_interactive_guard.py` の `CASES` に `zsh -c ''! function () { python3 -i;
  }''`、`zsh -c ''if true; then function () { python3 -i; }; fi''`、`zsh -c ''function () { python3 -i;
  }''` を deny として追加

  - [ ] 両コピーがバイト単位で同一のまま


  ## 該当箇所

  - `em-workflow/scripts/codex-hook-interactive-guard.py:380`（`_names_function`: 予約語を取り除いた後に残った 1 語が `function`
  のときも関数名として扱っている）

  - `em-review/scripts/codex-hook-interactive-guard.py`（同一内容）

  - 記録: `feature-docs/codex-guard-reserved-word-funcdef/reviews/round1.yaml` の `evaluation.round_summary`（ブランチ
  `em-workflow/codex-guard-reserved-word-funcdef/integration`）


  ## 実害・発生条件

  見逃し側（fail-open）。zsh -c の中で匿名関数を使って対話プログラムを起動すると、ガードを通り抜けて対話待ちの孤児プロセスが残りうる。前置のない形は以前から同じ穴があり、今回の変更で新しく生まれた回避手段ではない。


  ## 追加指示（起動時）

  - 実装完了後、integration ブランチを remote に push し、gh pr create で base_branch への PR を作る。integration ブランチはローカル・リモートとも残す（自動マージしない）

  - 不明点は Codex に相談し、比較的よいと判断した案を採用する

  - その議論内容を Notion に記録する

  '
