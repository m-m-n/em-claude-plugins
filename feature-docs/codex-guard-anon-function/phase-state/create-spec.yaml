answers:
  assumption.a1.quoted-function:
    selected_option_ids:
    - track_quotedness
    normalized_answer: '引用・エスケープを含む `function`（例: `''function'' ()`）は zsh では予約語にならず
      function という名前の関数定義になり本体は実行されない（zsh 5.9 で確認）。名前のない匿名関数として扱うのは、予約語を取り除いた後に残った
      1 語が引用もエスケープも含まない `function` のときに限る。引用の有無は既存の `_Parser.bare` を `_Word` に引き継いで判定する。`zsh
      -c "''function'' () { python3 -i; }"` は silent のまま（回帰ケースとして CASES に silent で追加）。'
    answer_mode: select_or_freeform
    freeform: null
    source: codex
    packet_id: create-spec-q0001
    answered_at: '2026-10-11T23:10:16+09:00'
  assumption.a4.out-of-scope-forms:
    selected_option_ids:
    - exclude
    normalized_answer: '`function { python3 -i; }`（括弧なし）と `function () { python3 -i;
      } arg`（閉じ波括弧の後に引数）は zsh では本体をその場で実行するが、関数名判定の修正では直らない（波括弧の認識と閉じた後の引数処理の変更が要る）。今回は対象外とし、残存する見逃しとして記録する。'
    answer_mode: select_or_freeform
    freeform: null
    source: codex
    packet_id: create-spec-q0001
    answered_at: '2026-10-11T23:10:16+09:00'
  assumption.a2.function-function:
    selected_option_ids:
    - keep_definition
    normalized_answer: '`function function () { ... }` は zsh 5.9 / bash 5.3 とも function
      という名前の関数定義で本体は実行されない。従来どおり関数定義として扱う。除外条件は、2 語の `function` 前置の処理より前に、予約語除去後に残った
      1 語に対してだけ適用する。'
    answer_mode: select_or_freeform
    freeform: null
    source: codex
    packet_id: create-spec-q0001
    answered_at: '2026-10-11T23:10:16+09:00'
