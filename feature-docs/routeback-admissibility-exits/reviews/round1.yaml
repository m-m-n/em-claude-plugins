      I.2.b step 1 に新設された recovery は「wake phase が recorded agent を harness
      stop tool で止める → stop-tool recorder が terminal `failed` を記録する」という
      連鎖に依存している。しかし FR3 が定義する対象状態は「no task worktree, no task
      branch, no live agent」（SPEC.md 95-101 行）であり、Defect 2 では subagent が
      そもそも起動していない。止める agent が存在しなければ TaskStop は何も止めず、
      PostToolUse の queue_taskstop_net.py は agent index から task を解決できず
      fail-open の no-op になる。agent index の entry は launch の tool_response から
      書かれるため、起動しなかった launch には entry 自体が無い可能性が高い。
      したがって常に Residual 分岐（journal 不変・task は in-flight のまま・route-back
      gate は block・gate-rejected terminal）に落ち、これは変更前と同じ abort 相当の
      終端で、FR3 が要求する「abort 以外の protocol-defined recovery path」が実質的に
      提供されていない。

      同一サイトに統合した 2 件（same_site dedupe）:
      (a) line 355-358 / high: 存在チェックの FAIL 条件が「journal last event が
      `launched` かつ worktree と branch の *どちらも* 存在しない」という AND のため、
      SPEC の Defect 2（launch は許可されたが起動しなかった = worktree も branch も
      残っている）では決して真にならず、recovery が 1 件も発火しない。片方だけ消えた
      状態も AND のため素通りする。Supporting cast の stale-`launched` caveat が
      「triggers I.2.b step 1's recovery on the next reconcile pass」と主張する根拠も
      同じ理由で成立しない。
      (b) line 362-364 / medium: 「that task's recorded agent」の取得元が未定義。
      task id から harness agent identifier を引く方法をどこも規定していない。唯一
      その対応を持つ agents.jsonl は「it exists solely so the stop-tool recorder can
      resolve a stop back to a task」と agent→task の一方向に限定されており、逆引きは
      定義されていない。1 entry が複数候補を持ち得るためどれを TaskStop に渡すかも未定義。
    suggestion: |
      live agent の存在に依存しない terminalize 経路を定義する。
      (a) 存在チェックが FAIL した task について、wake phase 自身が I.2.a の last-event
