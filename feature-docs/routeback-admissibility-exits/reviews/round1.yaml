      （journal は append-only のまま、解釈側だけを変える）。
      (b) stop-tool 経路は live agent があるときの最適化として位置づけ、agent を解決
      できない場合の既定経路を主経路として書く。
      あわせて FAIL 条件の AND を実際に起こり得る状態に合わせ（OR 化、または agent の
      生存確認ベースへ）、recovery が使う agent 逆引きの出典を citation として足す。
      Residual は例外ケースに限定し、Defect 2 の既定経路にしないこと。
