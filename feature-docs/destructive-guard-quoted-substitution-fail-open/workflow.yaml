schema_version: 1
feature: destructive-guard-quoted-substitution-fail-open
created: 2026-09-14
base_branch: main
goal: |
  Notion タスク: https://www.notion.so/3d93509ec8ee81abb694d100b865ae9a
  種別: セキュリティ / 優先度: 高

  タイトル: destructive-guard: 引用符付きコマンド置換が D7 の unresolved マーキングを迂回して fail-open になる

  ## 脆弱性の概要
  destructive-guard.py の _mark_substitutions() が、両隣が引用符のコマンド置換を「語全体を占める置換」と誤分類して UNRESOLVED_MARK ではなく空白に置き換えるため、未解決の証跡が消える。結果として親参照が畳まれて safe スクラッチルートに着地し、main が deny を返す形が allow になる。

  ## 参照
  - severity: critical
  - 現在のバージョン: em-workflow（ブランチ em-workflow/destructive-guard-safe-delete-traversal/integration / PR 30）
  - 修正済みバージョン: 無し

  ## 攻撃シナリオ
  CLAUDE_BATCH 未設定で main 版とブランチ版に同一コマンド列を通した実測で、裸形のコマンド置換 + 親参照 + safe ルートは両方 deny だが、同じ形を二重引用符で囲んだもの・単一引用符で囲んだもの・バッククォート + 二重引用符で書いたもの・着地先を dist / node_modules / .cache に変えた形・置換の前後に文字を密着させた形は、ブランチ版で allow になる。allow は CLAUDE_BATCH でも降格されないため、無人実行ではゲート無しで再帰削除が実行される。

  ## 影響範囲
  削除先は置換が実行時に決める場所の親配下であり、ファイルシステム上の任意の位置になりうる。フックは実行前に阻止できる唯一の層。SPEC FR6（変数展開・コマンド置換を含む対象は safe 例外に到達せず ask(rm-unresolvable) に落ちる）に正面から違反する。

  ## 完了の定義
  - 攻撃シナリオが成立しない（上記 allow 5 形が deny になる）
  - 修正版に追随している（修正版が無い場合は暫定緩和策の欄に対応を記載）
  - 引用符付きの各形（二重引用符・単一引用符・バッククォート・前後密着）を、裸形の双子が持つのと同じ deny としてケース表に追加する
  - python3 em-workflow/hooks/tests/run-destructive-guard.py が全件通る

  ## 該当箇所
  em-workflow/hooks/destructive-guard.py の WORD_BOUNDARY_CHARS と _mark_substitutions()。

  ## 補足
  feature destructive-guard-safe-delete-traversal の review round 2 で検出（finding stable_id: f00270f6f04523c0、severity critical）。batch の review rework cap 到達により deferred のまま残した。round 1 の項目 4318c9f53a9d2ca3 は閉じていない。

  ---
  起動時の追加指示:
  Once the implementation is finished, push the integration branch to the remote and create a Pull Request against base_branch with gh pr create. Keep the integration branch both locally and on the remote (do not auto-merge it into base_branch).
  Consult Codex on any unclear points and adopt the option judged to be comparatively better.
  Record the content of that discussion in Notion.

  ---
  起動時点で確定済みの調査結果（オーケストレーターによる実測、main HEAD fba3d7e）:
  - PR 30 は CLOSED でマージされていない。main の destructive-guard.py は別実装に置き換わっており、報告された WORD_BOUNDARY_CHARS は存在しない。_mark_substitutions() は SUBSTITUTION.sub(UNRESOLVED_MARK, chunk) のみ。
  - 攻撃シナリオの 5 形を含む 9 形を main の実装に通した結果は全て deny。fail-open は main では再現しない。
  - 一方 em-workflow/hooks/tests/destructive-guard-cases.json には引用符付きコマンド置換の deny ケースが 1 件も無く、同じ穴が再び開いても検知できない。
  - スコープは第二意見（LiteLLM 経由 vertex-glm-5、Codex CLI は利用上限で不可）と合意のうえ「コード修正はせず、引用符付き各形の deny ケースをケース表に追加する回帰テストのみ」とした。
