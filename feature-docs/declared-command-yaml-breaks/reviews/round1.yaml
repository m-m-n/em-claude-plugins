  file: em-workflow/hooks/bash_guard.py
  line: 227
  title: 端の改行文字の種類が混在・連続すると YAML 解析後の形が宣言集合から漏れ、未承認の拒否を回避できる
  description: declared_commands は値ごとに 2 つの形だけを入れる（227-229 行）。(a) trim_blanks(value) と、(b) value.strip(DECLARED_END_STRIP) の 2 つ。hook_main は受け取ったコマンドからスペースとタブだけを除いて照合する（500 行）。PyYAML の flow scalar は、両端の改行文字を端ごとに別々に畳む。単独の U+0085 は空白 1 つになり、U+2028 / U+2029 はそのまま残る。そのため、先頭が U+0085 で末尾が U+2028 / U+2029 の宣言（またはその逆）では、解析結果「空白+X+U+2028」がトリム後に「X+U+2028」になる。これは (a)「U+0085+X+U+2028」にも (b)「X」にも一致しない。is_matchable も偽なので exact と cd 前置形は成り立たず、527 行で判定なしに戻る。同じ端に改行文字が連続する場合も同様に漏れる（U+0085 U+0085 → LF、U+0085 U+2028 → U+2028、U+2028 U+0085 → U+2028 LF）。シングルクォートも同じ折り畳みを受ける。この組み合わせでは、SPEC の Objective と THREAT-MODEL TM-1 の『生の形・YAML 解析後の形・端を除いた形をすべて未承認として拒否する』が成り立たない。FR1 は書かれたとおりに実装されており、穴は FR1 が 2 つの形しか定めていない設計そのものにある。許可の範囲は広がっておらず、TM-2 は維持されている。帰結は通常の権限確認への素通りで、既存の Bash 許可や auto モードの判定によっては承認記録なしに実行され得る。comprehensive#0 も同じ箇所を独立に指摘している。
  suggestion: '端の改行文字の折り畳みは、拒否する側だけで吸収する。案1: hook_main で宣言集合と照合する箇所（519 / 527 / 546 行）で、受け取ったコマンドの両端から U+0020・U+0009・LF・U+0085・U+2028・U+2029 を除いた形も declared と照合する。案2: declared_commands で、PyYAML と同じ端ごとの折り畳みを当てた 3 つ目の形を入れる。exact と cd 前置形による許可、trim_blanks、is_matchable は変えない（FR3）。先頭 U+0085 と末尾 U+2028 / U+2029、その逆、同じ端での U+0085 U+0085 と U+0085 U+2028 の各宣言について、YAML 解析結果の形が未承認として deny されるサブプロセステストを足す。あわせて、SPEC FR1 の『2 つの形』、approval-unicode-whitespace FR8 / TM-5 の注記、docstring を更新する。'
  reproduction: 'ファイル読み取りをメモリ上で置き換え、feature-docs/demo/workflow.yaml の内容を build_command: "<U+0085>printf REVIEW_OK #<U+2028>" とする。山括弧部分には YAML エスケープではなく実際の文字を使う。承認ストアには /usr/bin/true だけを登録した状態を与える。yaml.safe_load の解析結果である " printf REVIEW_OK #\u2028" を PreToolUse JSON の tool_input.command に渡して hook_main を呼ぶと、終了値は 0、出力は空になる。同じ宣言の元の値と両端除去後の値は deny になる。解析後の文字列を Bash で実行すると REVIEW_OK が出力される。末尾を U+2029 に変えても同じ結果を確認した。検証ではファイルを作成・変更していない'
