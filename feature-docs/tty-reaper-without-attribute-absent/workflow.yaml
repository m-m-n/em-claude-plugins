schema_version: 1
feature: tty-reaper-without-attribute-absent
created: '2026-10-27'
base_branch: main
goal: '# tests/test_codex_hook_tty_reaper.py の without_attribute() が、pidfd 関数がもともと無い Python で AttributeError になり、関数欠落の試験が動かない


  種別: バグ


  ## 現象

  tests/test_codex_hook_tty_reaper.py のテスト補助関数 without_attribute() は、既定値なしで getattr(module, name) を呼ぶ。そのため os.pidfd_open または signal.pidfd_send_signal がもともと無い Python では、関数が無い場合を検証するテスト（test_ac5_ts5_a_missing_pidfd_open_function_leaves_a_default_that_stops_nothing と test_ac5_ts5_a_missing_pidfd_send_signal_function_leaves_a_default_that_stops_nothing）が準備の段階で AttributeError になる。フック本体は getattr(..., None) で関数が無い場合を扱っている。


  ## 再現手順

  1. os.pidfd_open を削除した状態で `with without_attribute(os, "pidfd_open"):` を実行する。

  2. AttributeError が出る。signal.pidfd_send_signal でも同じ。


  ## 期待する挙動

  属性がもともと無い環境でも、without_attribute() はエラーにならず、ブロックの中で属性が無い状態を作る。


  ## 完了の定義

  - 再現手順で現象が起きない

  - 再発を検出するテストがある


  ## 該当箇所

  - tests/test_codex_hook_tty_reaper.py:153（without_attribute()）


  修正案（レビューでの提案）: sentinel を使って saved = getattr(module, name, sentinel) とし、属性があったときだけ削除・復元する。


  ## 実害・発生条件

  影響はテストだけ。関数が無いのは Linux 以外のビルドに限られ、リポジトリが使う Linux の Python には両方の関数がある。em-workflow の feature codex-hook-tty-reaper-pid-reuse のレビュー（round 1、comprehensive 観点）で見つかった。low のためこの feature では直していない。


  ## 追加指示（起動者より）

  - 実装完了後、integration ブランチを remote に push し、base_branch への PR を gh pr create で作成する。integration ブランチはローカル・リモートともに残す（base_branch へ自動マージしない）

  - 不明点は Codex に相談し、比較的良いと判断した選択肢を採用する

  - その議論の内容を Notion に記録する

  '
