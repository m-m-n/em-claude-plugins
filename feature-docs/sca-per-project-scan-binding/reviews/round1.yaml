findings:
  - stable_id: f7a5bd6dae54d451
    severity: medium
    category: security
    file: em-workflow/scripts/scan-dependencies.py
    line: 919
    title: "相対パスで解決された実行ファイルが、入れ子のプロジェクトを基準に解決し直される"
    description: "resolve_executable()（717-718 行）は shutil.which() の結果をそのまま返す。PATH に相対の項目（例: tools、./node_modules/.bin）があると、argv[0] が相対パスになる。今回の変更で npm / cargo / go の cwd が入れ子のプロジェクトに移った。subprocess.run は相対の argv[0] を新しい cwd を基準に解決するため、which が確認した <起動時の cwd>/tools/npm ではなく <root>/services/api/tools/npm が実行される。この状態では SPEC FR3 の「argv[0] は実行ファイルの絶対パス」も満たさない。子プロセスの PATH にも相対の項目がそのまま渡る。発生には利用者の PATH に相対の項目があることが前提で、ルートのプロジェクトでは変更前から同じ種類の露出があったため、evaluator が high から medium に下げた。"
    suggestion: "resolve_executable() の結果を os.path.abspath() で絶対パスに固定する。build_child_env() では PATH の相対の項目を除くか、絶対パスに直す。cwd が入れ子のジョブでも argv[0] が絶対パスになることを確かめるテストを足す。"
    sources: [codex:security]
    confidence: 85
    resolution: unresolved
    resolution_reason: "medium のため Phase R4 の自動修正候補外。Codex 相談の結果、別タスクとして起票する"
  - stable_id: 714fd6313e25071f
    severity: medium
    category: comprehensive
    file: em-workflow/scripts/scan-dependencies.py
    line: 808
    title: "GOFLAGS=-mod=readonly の固定で Go の vendor モードが使えなくなる"
    description: "Go は go.mod の go の値が 1.14 以上で vendor ディレクトリがあると自動で -mod=vendor を選ぶ。それ以外の既定はすでに -mod=readonly なので、固定値が実際に変えるのは vendor モードを止めることだけになる。vendor を使うプロジェクトでは go.sum がない場合・オフライン・非公開モジュールで読み込みに失敗し、変更前に完了していた走査が not_completed の skip になる。値は SPEC FR11 / AC-10 が指定したもので、直すには仕様判断が要る。"
    suggestion: "(a) 束縛したディレクトリに vendor/modules.txt があれば run_scan 側で -mod=vendor、それ以外は -mod=readonly にする。(b) GOFLAGS を空の固定値に戻す。どちらでも FR11 / AC-10、固定値の表のテスト、task0001 のテスト記録を合わせて更新する。"
    sources: [codex:comprehensive]
    confidence: 70
    resolution: unresolved
    resolution_reason: "medium のため Phase R4 の自動修正候補外。SPEC FR11/AC-10 の判断が要るため、別タスクとして起票する"
