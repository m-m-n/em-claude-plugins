schema_version: 1
feature: sca-per-project-scan-binding
created: '2026-10-04'
base_branch: main
goal: |
  # SCA 軸: npm / cargo / go のスキャンがリポジトリルート固定で、エコシステムごとに 1 プロジェクトしか見ない

  ## 現象 (必須)
  `build_scan_job` はターゲットを追加するのが `name == 'pip'` のときだけで、npm / cargo / go では argv が `[executable] + args`、cwd が `project_root` 固定になる。`manifest_file` は finding のファイルラベルを変えるだけで、実際に何が走査されるかには影響しない。
  `services/api/package.json` の変更に対して `npm audit` がリポジトリルートで走り、まったく別の依存集合を監査した結果に、ネストしたパスのラベルが付く。
  さらに `manifest_file_for` は最初にマッチした変更ファイルだけを返し、エコシステムごとに 1 ジョブしか作らないため、別ディレクトリにある 2 つ目の `package.json` の変更はまったく走査されない。`skip_reason` も出ず `skipped: false` になる。
  round 1 の未解決 finding `9a56747dc5389bdb` / `6e8a02d94f7b3c15`（ターゲット束縛）の残件。
  ## 再現手順 (必須)
  1. モノレポで `services/api/package.json` を変更する
  2. その変更ファイルを `changed_files` として `scan-dependencies.py scan` を実行する
  3. `npm audit` がリポジトリルートで実行され、`services/api` の依存集合は監査されない
  4. さらに `services/web/package.json` も同時に変更すると、そちらは走査対象にすらならず skip_reason も出ない
  ## 期待する挙動 (必須)
  変更されたマニフェスト / lockfile をそれを含むプロジェクトディレクトリごとにグループ化し、distinct なプロジェクト 1 つにつき 1 ジョブを作って、各スキャナをそのプロジェクトに束縛する。束縛できないプロジェクトは、ルートレベルのスキャンに畳み込まず、機械可読で安定した `skip_reason` を返す。
  ## 完了の定義 (必須)
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある
  ## 該当箇所 (任意)
  `em-workflow/scripts/scan-dependencies.py:1648`（`build_scan_job`）、`manifest_file_for`
  ## 実害・発生条件 (任意)
  モノレポおよびネストしたプロジェクトを持つリポジトリで、SCA 軸の結果が「別のプロジェクトを監査した結果」になる。ラベルが正しいパスを指すため、誤りに気づけない。
  ---
  出典: em-workflow レビュー round 2 の finding `20f7f988c9400af6`（severity: high, category: comprehensive, confidence: 90, source: codex:comprehensive）。無人実行の rework cap 到達により `deferred` になった残件。
  関連 PR: https://github.com/m-m-n/em-claude-plugins/pull/27
