  requirement.anchor-validation-strictness:
    packet_id: null
    source: batch-codex-consultation
    answer_mode: freeform
    selected_option_ids: []
    freeform: 'strict_all_paths: for npm/cargo/go, run_scan validates (realpath confinement under project_root,
      no absolute path, no ".." escape, no resolution exception) every changed file of the group, the
      project directory, the anchor and the required sibling manifest (npm package.json, cargo Cargo.toml,
      go go.mod). Anchor and manifest must be regular files resolving inside the SAME project directory;
      a symlink resolving to another directory -> unbindable. A deleted selected target or missing directory
      -> unbindable; never fall back to an ancestor directory. pip keeps its existing validation and in-project
      symlink allowance.'
