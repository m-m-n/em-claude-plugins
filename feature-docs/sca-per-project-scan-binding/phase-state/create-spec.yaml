  requirement.binding-precondition:
    packet_id: create-spec-q0001
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids:
    - require_anchor_file
    freeform: null
    normalized_answer: 'require_anchor_file: a project is bindable only when its directory is confined
      under project_root (realpath) AND holds the ecosystem anchor: npm package-lock.json or npm-shrinkwrap.json
      (shrinkwrap preferred when both), cargo Cargo.lock, go go.mod. Missing anchor -> scanner not launched,
      skip_reason <ecosystem>_project_unbindable. Applies to the root project too. Checks live in run_scan;
      build_scan_job / build_scan_jobs stay pure. Existing run_scan fixtures that launch npm/cargo without
      a lockfile are updated to create the manifest + anchor.'
    resolution_note: 'Codex (run_codex_exec.sh readonly, entry codex, turn 1) chose require_anchor_file
      over the analyst-recommended confined_existing_dir: cargo-audit generates Cargo.lock when only Cargo.toml
      exists (rustsec cargo-audit/src/lockfile.rs), which breaks the read-only promise (vuln-scanners.yaml:24).
      Orchestrator adopted Codex choice (comparatively better: keeps the read-only invariant). Opus escalation
      not run.'
    answered_at: '2026-10-04T20:13:05+09:00'
  requirement.skip-reason-shape:
