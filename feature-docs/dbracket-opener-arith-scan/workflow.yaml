schema_version: 1
feature: dbracket-opener-arith-scan
created: '2026-11-26'
base_branch: main
goal: 'destructive-guard が [[ ]] を開いた区間の算術比較を見落とし --args-json の検査を省く


  ## 現象

  [[ ]] を開いた区間の中にある算術比較を destructive-guard が見落とし、後続の Notion 呼び出しが KIND_NOTHING になって
  --args-json の検査が省かれる。


  ## 再現手順

  1. [[ を開く文の中に算術比較（-eq など）を置き、その後に --session "$SID" 付きの標準形の Notion 呼び出しを続けたコマンドを静的判定にかける

  2. 演算子の走査が、前の区間で条件式がすでに開いていた場合だけ行われるため、比較が数えられない


  ## 期待する挙動

  SPEC FR1 のとおり、[[ ]] 内の算術比較と -v を構文上の位置にかかわらず検出し、後続の呼び出しを検査対象にする。


  ## 完了の定義

  - 再現手順で現象が起きない

  - 再発を検出するテストがある


  ## 該当箇所

  em-workflow/hooks/destructive-guard.py の _args_json_conditional_step() 周辺（args-json-deferred-eval-bypass
  の integration ブランチで 8728 行付近）


  ## 実害・発生条件

  args-json-deferred-eval-bypass のレビュー第2ラウンドで spec 観点が high として報告し、batch の rework
  上限で deferred にした。

  '
