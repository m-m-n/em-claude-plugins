  title: 末尾に復帰文字が付いた `]]` を閉じ括弧と読み、後続の算術比較が走査されない
  description: '`_args_json_word_source()` は語末から外された復帰文字（U+000D）を除いた書かれ方を返すため、`_args_json_conditional_step()`
    の閉じ括弧判定（開始文・継続文）が `]]<CR>` も閉じ括弧と読む。Bash では比較の右辺のまま残り、後ろの `&&` / `||` の先の算術比較は条件式の中で評価されるが、フックは条件式の外と読み、後続の
    notion 呼び出しの `--args-json` が判定されない。'
  suggestion: 開始文と継続文の両方で、`trailing_cr` を持つ語を閉じ括弧と読まない。
  reproduction: 比較の右辺を `]]` の直後に実際の U+000D を1文字置いた語にする。Bash で `[[ $sample == <右辺> ]]` を評価すると、`sample`
    が復帰文字込みなら終了値は 0、`]]` だけなら 1 になることを確認した。フック側では、この右辺の直後を `&&` で区切り、開始文を `lex_segments()` から `_args_json_conditional_step()`
    に渡す。8607～8608行で復帰文字が除かれ、8790～8792行で `closed` が真になるため、継続すべき条件式に対して `is_open` が偽になる。
  reproduction_alternates: []
  reproduction_overflow: false
  sources:
  - codex:security
  confidence: 85
  resolution: fixed
  resolution_reason: auto-applied loop 1
- stable_id: 11d110990b0cbc46
  severity: high
  category: security
  file: em-workflow/hooks/destructive-guard.py
  line: 8796
  title: 'TM-1: 正規表現内の `]]` で条件式の走査が終了する'
  description: '`=~` の右辺にある括弧付き正規表現では、Bash は空白に囲まれた `]]` もパターンの一部として扱う。フックはここで条件式を閉じるため、後続の `&&` や `||`
    の先にある算術比較を見落とす。比較の左辺が `true` などの許可名なら、後続の Notion 呼び出しが検査対象外のままになり、`--args-json` 内のコマンドが判定されない。これは
    `feature-docs/dbracket-opener-arith-scan/THREAT-MODEL.md` の TB-1 で、TM-1 が求める実際の閉じ括弧までの走査が途切れるケースに当たる'
  suggestion: 開始文と継続文の両方で、正規表現の内部にある語を閉じ括弧の候補から除く。正規表現の終端を特定できない場合は条件式を不確定と判定し、後続のペイロードを検査する
  reproduction: 無害な条件式 `[[ x =~ (true ]] y) && false ]]` は `bash -n` で構文検査を通る。同じ文字列を `lex_segments()`
    で分割し、最初の区間を `_args_json_conditional_step()` に渡すと、`&&` の時点で `(False, False)` が返る。ここではまだ条件式の内側なので、第2要素は
    `True` であるべき
  reproduction_alternates: []
  reproduction_overflow: false
