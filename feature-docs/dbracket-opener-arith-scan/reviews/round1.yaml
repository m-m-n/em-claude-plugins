- stable_id: ebed04afda5cbb09
  severity: high
  category: security
  file: em-workflow/hooks/destructive-guard.py
  line: 8800
  title: TM-1：行継続を含む `=~` と拡張パターン内の `]]` で条件式の走査が早く終わる
  description: '`_args_json_word_source()` は行継続を残すため、`=` と `~` を行継続で分けると、8800行と8769行の完全一致判定をどちらも通らない。Bash
    は同じ入力を正規表現の比較として扱う。この差により、正規表現内の `]]` で走査が終わり、後続の算術比較と `--args-json` の検査を見落とす経路が残る。feature-docs/dbracket-opener-arith-scan/THREAT-MODEL.md
    の TB-1 で求める TM-1 の緩和が、この表記には適用されない。


    `==`、`=`、`!=` の右辺では、Bash は括弧を含む拡張パターンを認識する。ところが8802行の終了判定はパターンの内側かどうかを確認せず、独立した語に見える `]]` で走査を打ち切る。その後にある算術比較を見落とすと、後続の
    Notion 呼び出しが `--args-json` の検査対象から外れたままになる。feature-docs/dbracket-opener-arith-scan/THREAT-MODEL.md
    の TB-1 における TM-1 の走査範囲を満たさない。[Bash の条件式仕様](https://www.gnu.org/software/bash/manual/html_node/Conditional-Constructs.html)'
  suggestion: 引用とエスケープを区別したまま、Bash が取り除く行継続を除いた値で `=~` を判定する。開始文と継続文の両方で同じ判定を使う。 拡張パターンの右辺を一つのオペランドとして読み、その外側でだけ
    `]]` を終端と判定する。右辺の終端を特定できない場合は、後続の `--args-json` を検査対象に残す。
  reproduction: 無害な `[[ abc =~ b ]]` の `=` と `~` の間にバックスラッシュと改行を挿入しても、Bash は終了値0を返した。比較対象を `z` に変えると終了値は1になった。同じ演算子を
    `_args_json_word_source()` から8800行に渡すと、元の改行が残るため `evaluates` はこの分岐で真にならない。
  reproduction_alternates:
  - 無害な `[[ "label ]] data" == @(label ]] data) ]]` は Bash で終了値0になり、右辺の `]]` がパターンの一部であることを確認できた。`_args_json_conditional_step()`
    では、括弧内の語列にある `]]` が8803行の比較に一致し、本来の終端に達する前に8807行でループを抜ける。
  reproduction_overflow: false
  sources:
  - codex:security
  confidence: 60
  resolution: fixed
  resolution_reason: auto-applied loop 3
