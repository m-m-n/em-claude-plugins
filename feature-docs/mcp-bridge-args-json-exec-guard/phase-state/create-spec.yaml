    - budget_for_bounds_new_for_unrestorable
    freeform: null
    normalized_answer: 展開数の使い切りは既存の scan-budget-exceeded。復元できない静的な語は新しい理由 ID args-json-unrestorable と専用の文言
    resolution_note: 'gate: create-spec.requirement-clarification (category security -> batch relaxed
