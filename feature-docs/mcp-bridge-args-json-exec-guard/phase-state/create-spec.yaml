    freeform: null
    normalized_answer: mcp-bridge が受理する静的な形（引用符付きのフラグ名、= の形、単ダッシュ、-- や位置引数の後ろ）を読み、重複した --args-json はすべての値を検査する
    resolution_note: 'gate: create-spec.requirement-clarification (category security -> batch relaxed
      route); options: read_mcp_bridge_forms / keep_out_of_scope / ask_noncanonical; chosen: read_mcp_bridge_forms;
      not chosen: keep_out_of_scope, ask_noncanonical; codex_consulted: true (entry codex, 1 turn); key
