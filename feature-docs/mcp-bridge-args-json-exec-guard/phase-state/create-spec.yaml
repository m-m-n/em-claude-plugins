    normalized_answer: トップレベルの command は展開数 25 に入れず scan_budget で上限を持つ。-c / eval / ヒアストリングのペイロードを使い切りで積めなかったときは、キューを処理し終えた後に
      ask（それまでの deny が勝つ）
    resolution_note: 'gate: create-spec.requirement-clarification (category security -> batch relaxed
      route); options: separate_count_fail_closed / shared_count_fail_closed / provenance_count_fail_closed;
      chosen: separate_count_fail_closed; not chosen: shared_count_fail_closed, provenance_count_fail_closed;
      codex_consulted: true (entry codex, 1 turn); key points: decoded command is checked within the overall
      scan budget without spending the expansion count; when the count is exhausted, ask after draining
      if no deny (batch demotes it to deny); orchestrator judged the mapping; opus_escalation: false'
  requirement.args-json.ask-reason-id:
    packet_id: create-spec-q0002
