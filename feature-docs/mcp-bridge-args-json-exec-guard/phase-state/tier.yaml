  work_still_required_evidence: HEAD `733253313` に検査漏れが残っている。em-workflow/hooks/destructive-guard.py:1396
    は引用符内の置換記号を元の文字列から探し、同ファイル:7917–7921 はその走査結果から `chunk_subs` を作る。同ファイル:8127–8142 は見つかった候補だけを再走査に回す。同ファイル:7530–7537
    の `--args-json` の扱いは正規形の Notion コメント呼び出しで候補を除外するためのもので、JSON を復号するのはフックの標準入力を読む箇所だけ（同ファイル:10826）。既存のシェル入力抽出も
    `eval` とシェルの `-c`・ヒアストリングを対象とする（同ファイル:4396–4444、:8228–8231）。そのため、JSON 復号後にだけ現れる置換も、置換のない平文の `command`
    もシェル入力として検査されず、ほかの規則に一致しなければ `allow` に達する（同ファイル:10706–10722、:10772–10773）。レビューでも同じ欠落が未解決と記録されている（feature-docs/mcp-bridge-exec-tool-rescan/reviews/round1.yaml:48、:54–57、:67）。既存テストは、置換記号を直接書いた
    `start_process` の `deny` と Notion コメントの `allow` を確認する（em-workflow/hooks/tests/destructive-guard-cases.json:1373–1374）。該当する
    JSON エスケープの回帰ケースは表にない。既存ランナーはケース表からフックの判定を検証できる（em-workflow/hooks/tests/run-destructive-guard.py:209–238、:268–275）。読み取り専用で実行した関連30件と無人実行の確認1件はすべて通過した。SPEC
    で決める点は、静的に確定できる実行文字列を復号して既存のシェル検査に渡す範囲と、宛先や実行文字列を確定できない場合の `ask` の範囲。無人実行では `ask` が `deny` になるため、その範囲が正常な呼び出しの拒否にも影響する（em-workflow/hooks/destructive-guard.py:411–423）。変更行数の
    `-1` は方針決定前で未算定を示す。追加テスト件数は回帰ケースの下限で、呼び出し箇所は既存の抽出関数の直接呼び出し2か所を数えた（同ファイル:4263、:8228）。ファイル欄は実装とテストの範囲を示す。
