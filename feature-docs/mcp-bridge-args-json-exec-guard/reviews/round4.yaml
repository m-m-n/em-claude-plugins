  title: Pipelines that appear only after decoding never reach the whole-pipeline curl-pipe-shell check
  description: 'main() runs check_pipe_to_shell() once, on the raw Bash input (11377). statements() splits every chunk at
    `|`, including a top-level `command` string queued at 8370-8374. So a pipeline that appears only after JSON decoding gets
    no curl-pipe-shell deny: for example a `|` written as the JSON escape \u007c, or a JSON \n escape before `sh`. A plain
    {"command":"curl x | sh"} is still denied, because the raw regex sees the literal text. comprehensive#0 re-reported this
    at high. It stays at medium, the same judgment as round 3 (03086290fa444588): FR5 queues the string like a -c payload,
    and -c / eval / ANSI-C payloads already have the same gap, because check_pipe_to_shell() is called nowhere else. It is
    an inherited limitation, not a regression and not a SPEC contradiction. Confirmed by reading.'
  suggestion: Run check_pipe_to_shell() on each decoded top-level `command` string before _queue_args_json_chunks() queues
    it, and add a runner case with a JSON-escaped pipe that expects deny. Whether -c / eval payloads get the same check is
    a separate SPEC decision.
