- stable_id: b1965436ebfbbae2
  severity: high
  category: comprehensive
  file: em-workflow/hooks/destructive-guard.py
  line: 8092
  title: An `=`-form flag word with a non-static value part disables the inspection of every --args-json value in the statement
  description: '_mcp_bridge_args_json_chunks() reads each flag-position word whole with _read_static_word() (8092) before
    splitting it at `=` (8103). So an `=`-form flag word whose name part is static but whose value part is not is WORD_NOT_STATIC.
    Examples: `--mcp="$S"`, `--session="$SID"`, `--format=$F`, `--args-json="$X"`. That outcome returns _ARGS_JSON_NOTHING
    for the whole statement (8093-8094) and throws away every --args-json value, including static ones already collected.
    Two commands keep the raw-string verdict (allow), confirmed by reading: `mcp-bridge run --session="$SID" --mcp desktop-commander
    --tool start_process --args-json ''{"command":"git branch -D example"}''` and `mcp-bridge run --args-json ''{"command":"git
    branch -D example"}'' --args-json="$X"`. The space-separated spellings of both are inspected and denied (TS-20; test_a_repeated_args_json_is_judged_value_by_value).
    The SPEC requires the opposite: FR3 (f) defines the `=`-form value word as the part after `=`. FR3 (g) / A8 read --args-json
    whatever the destination is. FR6''s closing sentence and FR8 put non-static destinations, the `=` form and repeated --args-json
    outside the FR6 forms. FR6 says repeated values are judged one by one, with static values inspected. FR13 lists both the
    `=` form and non-static destinations among what TestFlagReading must show as inspected. The unit test entry ''equals form
    with a destination'' (tests/test_destructive_guard_args_json.py:646) pins the reverse under FR6 (2). This reopens round
    1''s high e0e4df99e5cded9d (a dynamic destination disables inspection) through the `=` spelling, and `--session="$SID"`
    is an ordinary spelling, not a contrived one. It is not a regression against the base commit (allow before), so NFR2 holds.'
  suggestion: 'In the flag loop, when a flag-position word is not static, read its static prefix up to the first unquoted
    `=`. If that prefix holds the `=` and names a known value-taking flag, take the rest as the value word and continue: for
    args-json a non-static value skips only that value (FR6 (1)); for the other names the value is not examined. Otherwise
    keep FR6 (2). Change the ''equals form with a destination'' entry at tests/test_destructive_guard_args_json.py:646 to
    expect inspection. Add runner cases for `--mcp="$S"` and for a repeated --args-json with one `=`-form non-static value,
    both expecting deny.'
  reproduction: null
  reproduction_alternates: []
  reproduction_overflow: false
