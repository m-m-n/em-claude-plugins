  file: em-workflow/hooks/destructive-guard.py
  line: 7880
  title: A literal `$` that Bash leaves as text inside a double-quoted --args-json value makes the whole value non-static
  description: _read_double_quoted() returns None for any unescaped `$` (7004-7005). _read_static_word() turns that into WORD_NOT_STATIC
    (7879-7881), so the value is skipped as an FR6 (1) form and no ask is raised. Bash starts no expansion at a `$` followed
    by a space, a closing double quote, or any other character that cannot begin a name, a parameter, `(`, `{` or `[`; it
    passes that `$` on as text. Take a double-quoted JSON value with a destructive top-level `command` plus such a `$` in
    another string, for example a trailing `5 $`. It keeps the raw-string verdict (allow). The same JSON with the `$` escaped
    is inspected and denied. FR3 (f) requires the value to be rebuilt under Bash's double-quote rules. Confirmed by reading.
  suggestion: 'In _read_double_quoted(), treat `$` as an expansion only when the next character can start one: a name character,
    a digit, a special-parameter character, `{`, `(` or `[`. Otherwise keep it as text. Add a unit test that the escaped and
    unescaped spellings restore to the same value.'
  reproduction: null
  reproduction_alternates: []
  reproduction_overflow: false
