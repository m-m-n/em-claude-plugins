findings:
- stable_id: ca547a9f716957df
  severity: high
  category: security
  file: em-workflow/hooks/destructive-guard.py
  line: 8101
  title: A lone `-` after the --args-json value is read as an unknown flag, so the decoded value goes
    uninspected while mcp-bridge still runs it
  description: 'Evaluator-originated (Independent Inspection Duty). The flag loop in _mcp_bridge_args_json_chunks()
    (lines 8089-8102) reads the word `-` with _read_static_word() as static ''-''. It is not ''--'' and
    it starts with ''-'', so line 8096 strips one dash to an empty name. That name is not in _MCP_RUN_VALUE_NAMES,
    so line 8101-8102 returns _ARGS_JSON_NOTHING and discards the --args-json value it already collected.
    The raw-string scan finds no candidate in a single-quoted plain `command` or in `\u0024(`, so the
    verdict is allow. mcp-bridge-exec-tool-rescan IMPLEMENTATION.md D1 (which A11 says the flag reading
    follows) records that `mcp-bridge run` uses Go''s standard flag parsing. In Go''s flag package, `-`
    is a non-flag argument: parsing stops there and the earlier flags take effect. D1''s Basis (form 3)
    also records that a trailing positional word does not stop mcp-bridge from running. So `mcp-bridge
    run --mcp desktop-commander --tool start_process --args-json ''{"command":"git branch -D example"}''
    -` is allowed, yet mcp-bridge runs the command. It is the same threat as TS-25 (`-- extra`, pinned
    deny) and as THREAT-MODEL.md''s Elevation-of-privilege row (a value before `--` or a positional word),
    which the SPEC brings into scope. The trailing form is not covered: the cases file has no lone-dash
    case, and TestFlagReading (line 602) only pins `mcp-bridge run - --args-json ...` under the unknown-flag
    group. That leading form is NOTHING under Go semantics too, because no value is parsed before `-`.'
  suggestion: In the flag loop, treat a restored flag-position word shorter than two characters (`-`,
    as well as the empty word already handled) as a positional word that ends the flag sequence, as Go's
    flag.parseOne does (`len(s) < 2 || s[0] != '-'`). Values collected before it are still inspected.
    Add a runner case `mcp-bridge run --mcp desktop-commander --tool start_process --args-json '{"command":"git
    branch -D example"}' -` expecting deny, and move the lone-dash entry of TestFlagReading out of the
    unknown-flag group (the leading `- --args-json` form stays nothing-to-do). The SPEC's FR3 (d) / FR6
    (3) wording ('a word not beginning with `-` is positional') may need a matching clarification under
    A11.
  reproduction: 'Input (read only, not executed): mcp-bridge run --mcp desktop-commander --tool start_process
    --args-json ''{"command":"git branch -D example"}'' - . Guard trace: the flag loop collects the --args-json
    value (8104-8112). The word `-` reads as WORD_STATIC ''-''. rest='''' gives flag_name ''''. That name
    is not in _MCP_RUN_VALUE_NAMES, so _ARGS_JSON_NOTHING is returned (8101-8102). No raw candidate exists,
    so the verdict is allow. Runtime: Go flag parsing stops at the non-flag `-`, the --args-json value
    is used, and start_process runs `git branch -D example`.'
  reproduction_alternates: []
  reproduction_overflow: false
  sources:
  - claude:evaluator
  confidence: 80
  resolution: unresolved
  resolution_reason: 'batch auto-rework (review round 2): evaluator-only source, forced to needs-judgment
    and skipped in batch auto-fix loop 1; orchestrator confirmed the hook returns allow for the trailing
    lone-dash form (the same statement without the trailing `-` is denied)'
- stable_id: 34c91ffd68c9bb6e
  severity: medium
  category: security
  file: em-workflow/hooks/destructive-guard.py
  line: 7790
  title: A non-static flag-position word (e.g. an empty `$EMPTY`) disables the --args-json inspection,
    as SPEC O2 (2) accepts
  description: 'Reproduction verified by reading: reproduced. `$EMPTY` in flag position reads as WORD_NOT_STATIC
    through _read_static_word() (an unquoted `$` or a parameter region). The flag loop in _mcp_bridge_args_json_chunks()
    (lines 8089-8091) then returns _ARGS_JSON_NOTHING. The single-quoted `\u0024(` gives the raw scan
    no candidate, so the verdict is allow. Bash drops the empty unquoted word, so mcp-bridge receives
    a fully static invocation and runs the decoded substitution. The form is, however, exactly the out-of-scope
    form O2 (2) that the SPEC records: FR6 (2), FR8, and TS-27 pinned allow under AC-6. The static guard
    accepts the same class of bypass in O2 (1) (`--args-json "$X"`). The finding is therefore carried
    at medium as a residual the SPEC accepts. Changing it is a SPEC decision, not a defect against the
    current SPEC. A sub-case the SPEC does not need to give up: when the non-static word comes after an
    already collected static --args-json value (`... --args-json ''<v>'' $X`), that value is discarded
    too.'
  suggestion: 'Raise this with the SPEC owner rather than auto-fixing it, because TS-27 / AC-6 pin the
    current allow. Options: hold an ask for a non-static flag-position word in an `mcp-bridge run` statement
    that is not the notion pair, or at least still inspect the static --args-json values collected before
    the first non-static flag word.'
  reproduction: 'Input: mcp-bridge run $EMPTY --mcp desktop-commander --tool start_process --args-json
    ''{"command":"echo \u0024(git branch -D example)"}'' with EMPTY unset/empty, via Bash tool. Guard
    path: _mcp_bridge_args_json_chunks flag loop _read_static_word->$EMPTY=WORD_NOT_STATIC=>return _ARGS_JSON_NOTHING
    (cf. TS-27 allow pin). Observable: verdict allow, while Bash executes mcp-bridge run --mcp ... --args-json
    ... which decodes to $(git branch -D example) and re-scans to deny when inspected directly (TS-1).'
  reproduction_alternates: []
  reproduction_overflow: false
  sources:
