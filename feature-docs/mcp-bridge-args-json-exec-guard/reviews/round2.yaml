  confidence: 90
  resolution: unresolved
  resolution_reason: 'medium: SPEC-accepted out-of-scope form O2 (2); not an auto-fix candidate; changing
    it is a SPEC decision'
- stable_id: 8134f7498038208d
  severity: medium
  category: performance
  file: em-workflow/hooks/destructive-guard.py
  line: 8357
  title: 'Quadratic anchor lookup: one linear token scan per decoded --args-json value'
  description: _queue_args_json_chunks() calls _args_json_word_index(tokens, value.word) once for each
    decoded value (line 8357). That helper (lines 7764-7773) scans the statement's tokens linearly for
    a matching span. A statement with V static --args-json object values over T tokens therefore costs
    O(V*T). Each value of a cheap form such as `--args-json '{}'` charges only a few units, so the 8*len+4096
    scan budget does not cut this off. For a statement with thousands of repeated --args-json values,
    the lookup grows quadratically toward the 10-second hook timeout. The code shape is confirmed by reading;
    the timing was not measured.
  suggestion: Build a span-to-index map of TOKENS once per call to _queue_args_json_chunks(), falling
    back to _token_index() for a word without a span. Look each value's word up in that map instead of
    rescanning TOKENS.
  reproduction: null
  reproduction_alternates: []
  reproduction_overflow: false
  sources:
  - litellm:muse-spark-contributor:performance
  confidence: 70
  resolution: unresolved
  resolution_reason: 'medium: not an auto-fix candidate (severity below high)'
- stable_id: a1040ebcb45205ea
  severity: medium
  category: architecture
  file: em-workflow/hooks/destructive-guard.py
  line: 7064
  title: Bash-quoting restoration duplicated between _read_word_as_written() and _read_static_word()
  description: _read_static_word() (7782-7932) repeats the region walk, the quote-kind dispatch, the backslash
    handling and the glob/brace/tilde/extglob checks of _read_word_as_written() (7023-7150) almost line
    for line. The differences are the three-way outcome, locale quotes, and acceptance of single-quote
    marker residue. A later fix to one reader's quoting rules (e.g. a new ANSI-C or glob case) can silently
    miss the other. That would make the masking-stop check and the --args-json step disagree about the
    same word. This is a maintainability risk, not a present defect, and D5 deliberately chose a separate
    reader. It is therefore medium rather than high.
  suggestion: Factor the shared walk into one helper that returns the restored text plus flags (not-static,
    unrestorable, bare positions). Keep _read_word_as_written() as a thin wrapper that maps any non-static
    or unrestorable outcome to None, with its existing stricter residue and bounds checks preserved.
  reproduction: null
  reproduction_alternates: []
  reproduction_overflow: false
  sources:
  - litellm:muse-spark-contributor:architecture
  confidence: 80
  resolution: unresolved
  resolution_reason: 'medium: not an auto-fix candidate (severity below high); D5 chose a separate reader'
