schema_version: 1
feature: mcp-bridge-args-json-exec-guard
created: '2026-11-19'
base_branch: main
goal: '# destructive-guard が mcp-bridge run --args-json の JSON エスケープで書いたコマンド置換をシェル実行型 MCP ツール宛てでも検出しない


  種別: セキュリティ


  ## 脆弱性の概要


  `em-workflow/hooks/destructive-guard.py` は `mcp-bridge run` の `--args-json` を JSON として復号しない。シェルを実行する
  MCP ツール宛ての呼び出しで、`command` の中のコマンド置換を JSON のエスケープ（例: `$(...)`）で書くと、置換の候補にならず再走査をすり抜ける。


  ## 参照


  - CVE / GHSA ID: 該当なし

  - severity: medium

  - 現在のバージョン: feature mcp-bridge-exec-tool-rescan の時点

  - 修正済みバージョン: 無し


  ## 攻撃シナリオ


  シェルを実行する MCP ツール（例: desktop-commander の `start_process`）が mcp-bridge に登録された環境で、Bash から `mcp-bridge run
  --mcp desktop-commander --tool start_process --args-json` を実行し、`command` に JSON エスケープで書いた置換を入れる。フックは置換を検出せず
  allow にし、復号後の値を受け取った MCP ツールがシェルで評価する。


  置換を使わずに破壊的なコマンドを平文で `command` に書く形も、変更前から allow になっている。フックは MCP の実行ツールに渡す引数の意味を解析していない。


  ## 影響範囲


  destructive-guard が止めるべき破壊的な git 操作・ファイル削除が、シェル実行型 MCP ツール経由で素通りする。feature mcp-bridge-exec-tool-rescan
  が持ち込んだものではなく、それより前からある設計上の境界。


  ## 完了の定義


  - [ ] 攻撃シナリオが成立しない

  - [ ] 修正版に追随している（修正版が無い場合は暫定緩和策の欄に対応を記載）

  - [ ] notion の組以外の mcp-bridge run について、`--args-json` を復号して実行ツールの `command` をシェル入力として検査するか、宛先や実行文字列が静的に決まらない形を
  ask に回すかを SPEC で決める（batch では ask が deny に降格する誤 deny の費用も考える）


  ## 該当箇所


  - `em-workflow/hooks/destructive-guard.py` の置換候補の収集（chunk_subs）と、mcp-bridge の `--args-json` を扱う判定

  - review の stable_id: 553233b6be6ecdc3（feature mcp-bridge-exec-tool-rescan の review round 1）


  ## 暫定緩和策


  シェルを実行する MCP ツールを mcp-bridge に登録しない。


  ## 追加の指示


  - 不明点は Codex に相談し、比較してより良いと判断した選択肢を採用する。

  '
