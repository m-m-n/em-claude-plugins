schema_version: 1
feature: codex-guard-anon-fn-pipe
created: '2026-10-17'
base_branch: main
goal: |
  # codex-hook-interactive-guard: パイプや入力リダイレクトを受けた zsh 匿名関数の本体を未接続と判定し、プログラムなしの python3 を誤って deny する

  Notion タスク: <notion-url> （種別: バグ）

  ## 現象
  `codex-hook-interactive-guard.py`（em-workflow / em-review の両コピー）が、パイプや入力リダイレクトを受けた zsh の匿名関数 `function () { ...; }` の本体を「標準入力に何もつながっていない」と判定し、プログラムを渡さない `python3` を noprogram として deny する。
  zsh はパイプラインの入力を匿名関数の本体に渡すため、本体の `python3` はプログラムをパイプから読み、対話にならない。誤検知（拒否側）になる。
  feature `codex-guard-anon-function`（名前のない `function ()` の本体を判定する修正）の review round 1 で comprehensive 観点のレビュアーが報告し、evaluator がコードを読んで確認した（重大度 medium）。この feature の変更で生まれた誤検知で、変更前は本体を判定せず何も出力しなかった。

  ## 再現手順
  1. コマンド `zsh -c 'printf "print(1)\n" | function () { python3; }'` を `{"tool_input": {"command": "..."}}` として hook の標準入力に渡す
  2. noprogram を理由とした deny が出力される
  3. `zsh -c 'function < /dev/null () { python3; }'` でも同じく deny になる

  ## 期待する挙動
  匿名関数の前に付いたパイプ・入力リダイレクトの接続を本体に引き継ぎ、`zsh -c 'printf "print(1)\n" | function () { python3; }'` は何も出力しない。`... | function () { python3 -i; }` は従来どおり deny する。

  ## 完了の定義
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある
  - [ ] `tests/test_codex_hook_interactive_guard.py` の `CASES` に silent の `zsh -c 'printf "print(1)\n" | function () { python3; }'` と deny の `zsh -c 'printf "print(1)\n" | function () { python3 -i; }'` を追加
  - [ ] 両コピーがバイト単位で同一のまま

  ## 該当箇所
  - `em-workflow/scripts/codex-hook-interactive-guard.py:441`（`_names_function` の匿名関数分岐）と `_open_group` / `_close_group`。`_open_group("(")` 内の `_flush()` が `[function]` を単純コマンドとして出力し、`pipe_pending` と `self.stdin` をそこへ渡してしまう。空の `()` グループは pipe=False で作られ、`fn_head` も立たないため、続く `{` グループが未接続になる
  - `em-review/scripts/codex-hook-interactive-guard.py`（同一内容）
  - 記録: `feature-docs/codex-guard-anon-function/reviews/round1.yaml`（stable_id `85d39f52fcef8612`、ブランチ `em-workflow/codex-guard-anon-function/integration`）

  ## 実害・発生条件
  zsh -c の中でパイプから匿名関数へ入力を流し込み、本体でプログラムなしの `python3` などを起動したときだけ起きる。拒否には理由が付くため、エージェントは書き換えて再試行できる。見逃し側ではない。

  ## 追加指示（起動者から）
  - 実装完了後、integration ブランチを remote に push し、gh pr create で base_branch への PR を作成する。integration ブランチはローカル・リモートとも残す（base_branch へ自動マージしない）
  - 不明点は Codex に相談し、比較的よいと判断した選択肢を採用する
  - その議論の内容を Notion に記録する
