  title: "予約語の直後に書いた関数定義の本体を判定してしまい、正当なコマンドを deny する回帰"
  description: "_open_group は `(` の直前の単純コマンドの語の並びを _names_function に渡す。パーサーは `then` `do` `else` `!` `time` などの予約語を区切りとして扱わず、普通の語として words に積む。そのため `if true; then f() { python3 -i; }; fi` では `(` の時点の words が [then, f] になり head が False になる。空の `()` を閉じても fn_head が立たず、続く `{` のグループで呼び出されていない関数本体の `python3 -i` が判定されて deny になる。変更前は何も出力していなかった。`do f()`、`else f()`、`! f()`、`time f()` も同じ経路を通る。em-review 側も同一内容のため同じ回帰がある。CASES には予約語の直後の関数定義のケースが無い。"
  suggestion: "_names_function で長さを見る前に、先頭に続く予約語（`!` `time` `then` `do` `else` `if` `elif` `while` `until`）を取り除き、残りを (a)(b) の条件で判定する。silent のケース（`if true; then f() { python3 -i; }; fi` など）と deny のケース（`if true; then a=()\\n(python3 -i)\\nfi` など）を CASES に足し、両コピーをバイト単位で同一に保つ。"
