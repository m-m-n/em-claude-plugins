goal: |
  # codex-hook-interactive-guard: 配列代入 a=() の後に改行を挟んだサブシェルを関数本体とみなし、対話起動を通す（回帰）

  Notion: <notion-url>

  ## 現象 (必須)
  `codex-hook-interactive-guard.py`（em-workflow / em-review の両コピー）が、配列代入 `a=()` の後に改行を挟んだサブシェルを関数本体とみなし、対話起動を通す。基準版 `fa502d0f` では deny だったものが、PR https://github.com/m-m-n/em-claude-plugins/pull/87 の変更後は何も出力しない（回帰）。review round 1 の finding `08a75f1657a9298e`（medium, security）として未解決のまま残った。
  同じ原因で次も deny から許可に変わる:
  - `a+=()` の後に改行して `(python3 -i)`
  - `export a=()` の後に改行して `(python3 -i)`
  - `a=()` の後に空行を挟んで `(python3)`
  - `a=()` の後にコメント行を挟んで `(python3 -i)`
  `;` で区切った `a=() ; (python3 -i)` は deny のまま。`a=()` の後に改行して `{ python3 -i; }` も通るが、こちらは基準版でも通っていた既存の見落とし。
  ## 再現手順 (必須)
  1. コマンド `a=()` + 改行 + `(python3 -i)` を `{"tool_input": {"command": "..."}}` として hook の標準入力に渡す
  2. 何も出力されない（拒否されない）
  ## 期待する挙動 (必須)
  deny を出力する。`foo()` + 改行 + `(python3 -i)` と `f() (python3 -i)` は bash の関数定義なので、silent のまま保つ。
  ## 完了の定義 (必須)
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある
  - [ ] `tests/test_codex_hook_interactive_guard.py` の `CASES` に `a=()` / `a+=()` + 改行 + `(python3 -i)` を deny として追加
  - [ ] 両コピーがバイト単位で同一のまま
  ## 該当箇所 (任意)
  - `em-workflow/scripts/codex-hook-interactive-guard.py:341`（`_open_group`: `(` の直前に語があれば中身を問わず head を立てる。代入語 `a=` も関数名として扱われる）
  - `em-workflow/scripts/codex-hook-interactive-guard.py:354`（`_close_group`: 中身が空の `()` を閉じると fn_head を立てる）
  - `em-workflow/scripts/codex-hook-interactive-guard.py:325`（fn_head が改行で消えない）
  - `em-review/scripts/codex-hook-interactive-guard.py`（同一内容）
  - 修正案: `_open_group` で head を立てる条件を、`(` の直前の単純コマンドが動的でない語 1 つだけで、`=` を含まない有効な関数名のとき（または `function NAME` の形）に限る
  - 記録: `feature-docs/codex-guard-parser-fixes/reviews/round1.yaml`（ブランチ `em-workflow/codex-guard-parser-fixes/integration`）
  ## 実害・発生条件 (任意)
  Codex レビュアーが対話モードの処理系を起動して孤児プロセスが残る経路が残る。THREAT-MODEL TM-2 の「緩和は定めた条件の範囲だけに効かせる」を満たしていない。

  ## 追加指示（起動時）
  - 実装完了後、integration ブランチを remote に push し、base_branch に対して gh pr create で PR を作る。integration ブランチはローカル・リモート両方に残す（base_branch へ自動マージしない）
  - 不明点は Codex に相談し、比較的良いと判断した選択肢を採用する
  - その議論内容を Notion に記録する
