schema_version: 1
feature: sca-scanner-project-config-isolation
created: '2026-10-04'
base_branch: main
goal: |
  # SCA 軸: スキャナが被レビュープロジェクトの設定（.npmrc / .cargo/audit.toml）を読み、結果を偽装できる

  Notion タスク: https://www.notion.so/3d43509ec8ee813aa0f9d51dd6fe2cc9 （種別: バグ）

  ## 現象
  軸 2 のスキャナが、被レビュープロジェクト自身の設定ファイルを読んでしまう。PR の作者が設定ファイルを置くだけで、クリーンなスキャン結果を偽装できる。

  1. `.npmrc` による audit トラフィックの迂回（finding de4c569f8b63818d, medium/security, scan-dependencies.py:762）
  `ECOSYSTEM_ENV_PINS['npm']` がピン留めしているのは `npm_config_registry` と `npm_config_userconfig` だけで、`build_scan_job` は cwd を被レビュープロジェクトのルートに設定するため、npm はそのプロジェクトの `./.npmrc` を読む。registry のピンは効くが、`proxy` / `https-proxy` / `strict-ssl` / `cafile` / `noproxy` はピン留めされておらず、プロジェクトの `.npmrc` から無抵抗に読まれる。`https-proxy` と `strict-ssl=false` を設定すれば PR 作者が audit トラフィックに割り込み、クリーンな advisory 応答を返せる。`judge_scan_outcome` は well-formed な空の `vulnerabilities` オブジェクトを completed なスキャンとして受理する。

  2. `.cargo/audit.toml` の読み込み（finding d5bca9d78798a428, medium/security, vuln-scanners.yaml:53）
  `ECOSYSTEM_ENV_PINS['cargo']` は「cargo-audit を直接解決すれば `[alias]` ディスパッチが消える」という理由で意図的に空にしてある。それ自体は前進だが、cargo-audit は作業ディレクトリから `.cargo/audit.toml` を独立に読み込む。`build_scan_job` はその作業ディレクトリを被レビュープロジェクトのルートにしている。このファイルの `[advisories]` ignore リストと `[database]` の url / path 設定で、PR 作者が advisory を握りつぶしたり advisory データベースを差し替えたりできる。結果の空の `vulnerabilities.list` は `_has_success_structure` に completed なクリーンスキャンとして受理される。

  ## 再現手順
  1. 被レビュープロジェクトのルートに `.npmrc` を置き、`https-proxy=<攻撃者のプロキシ>` と `strict-ssl=false` を書く
  2. `package.json` を変更した PR として軸 2 を走らせる
  3. 攻撃者側のプロキシがクリーンな advisory 応答を返し、スキャンは `completed` / findings 0 件になる
  4. cargo 側も同様に、`.cargo/audit.toml` の `[advisories] ignore` に対象 advisory を並べると findings 0 件になる

  ## 期待する挙動
  - npm: transport に影響する設定を env var の形でもピン留めする（`npm_config_proxy` / `npm_config_https_proxy` を空に、`npm_config_strict_ssl=true`、`npm_config_cafile` を unset）。あるいは、検証済みの manifest / lockfile のコピーを置いた隔離ディレクトリから npm を実行し、プロジェクトの `.npmrc` を探索経路に載せない
  - cargo: 被レビューツリーの外のディレクトリから、明示的な `--file <検証済み Cargo.lock>` とピン留めした database 設定で cargo-audit を起動する。あるいは、クリーンな結果を受理する前にプロジェクト由来の audit 設定が探索経路に無いことを表明する

  ## 完了の定義
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある（プロジェクト由来の設定ファイルを置いた状態でスキャンし、その設定が効かないことを確認する）

  ## 該当箇所
  `em-workflow/scripts/scan-dependencies.py:762`（`ECOSYSTEM_ENV_PINS`, `build_scan_job`）、`em-workflow/references/vuln-scanners.yaml:53`

  ## 実害・発生条件
  untrusted な PR をレビューする構成でのみ問題になる。軸 2 の前提（被レビューコードは untrusted）が成り立つ場面では、SCA 軸そのものが無効化される。

  出典: em-workflow レビュー round 2 の findings de4c569f8b63818d / d5bca9d78798a428（ともに medium / security）。
  関連 PR: https://github.com/m-m-n/em-claude-plugins/pull/27

  ## 追加の起動指示
  - 実装完了後、integration ブランチを remote に push し、gh pr create で base_branch への PR を作る。integration ブランチはローカル・リモートとも残す（base_branch へ自動マージしない）
  - 不明点は Codex に相談し、相対的に良いと判断した案を採用する
  - その議論内容を Notion に記録する
