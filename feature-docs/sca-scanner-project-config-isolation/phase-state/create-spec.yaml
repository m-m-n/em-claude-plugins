    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids:
    - isolated_copy
    freeform: null
    normalized_answer: 'isolated_copy: copy the binding-checked package.json and the selected anchor lockfile
      (npm-shrinkwrap.json preferred over package-lock.json) into a fresh isolation directory outside
      the reviewed tree and run npm audit with that directory as cwd; ECOSYSTEM_ENV_PINS npm values unchanged.'
    resolution_note: 'Codex (run_codex_exec.sh readonly, entry codex, turn 1) chose isolated_copy: 検証済みの
      package.json と選択されたアンカーロックファイルだけを隔離先へコピーし、そこで npm audit を実行する。プロジェクトの設定全体を読み込み対象から除外でき、レビュー担当者の
      globalconfig にある接続設定を維持できる。環境変数の追加固定だけでは、列挙していない設定が残る。 Evidence: em-workflow/scripts/scan-dependencies.py:795
      — npm の固定値は registry と userconfig だけで、proxy や strict-ssl は固定していない。; em-workflow/scripts/scan-dependencies.py:918、1165
      — 現在は対象プロジェクトのディレクトリを cwd として subprocess.run に渡している。; em-workflow/scripts/scan-dependencies.py:2259
      — npm-shrinkwrap.json が存在すれば優先し、不正な場合も package-lock.json へ切り替えない。; npm は localPrefix/.npmrc を読む。localPrefix
      は CLI の --prefix、または cwd から探索した package.json／node_modules のあるディレクトリで決まる。コピーした package.json と既存の
      --workspaces=false により、探索を隔離先で止められる。[npm の設定読み込み実装](https://github.com/npm/cli/blob/latest/workspaces/config/lib/index.js)
      Options not chosen: env_pins, isolated_copy_and_env_pins. Orchestrator adopted (maps to declared
      option_id; comparatively better). Opus escalation not run.'
    answered_at: '2026-10-04T22:20:53+09:00'
