schema_version: 1
feature: review-perspective-model-effort
created: '2026-11-20'
base_branch: main
goal: "# レビュー観点ごとの Codex モデルと effort の指定\n\n## 前提（作業ツリーの未コミット変更）\n\n次の変更は作業ツリーに入っていて、まだコミットしていない。このタスクに含める。\n\
  \n- security 観点の codex エントリのモデルを `gpt-6-astra` から `gpt-6.2-astra` に変更した。\n- performance / architecture\
  \ / spec 観点の `primary_chain` を、codex が 1 番目、`muse-spark` が 2 番目の順に入れ替えた。\n- 上の 2 点に合わせて、両方の `reviewers.yaml`\
  \ の説明コメントと、テストの期待値を更新した。\n\n対象ファイル:\n\n- `em-workflow/references/reviewers.yaml`\n- `em-review/references/reviewers.yaml`\n\
  - `tests/test_reviewers_primary_chains.py`\n- `tests/test_contributor_tier_criteria.py`\n\n## ゴール\n\n\
  各観点の codex エントリで、モデルと effort を次のとおりに指定する。\n\n| 観点 | モデル | effort |\n| --- | --- | --- |\n| security\
  \ | `gpt-6.2-astra` | xhigh |\n| comprehensive | `gpt-6.2-astra` | high |\n| architecture | `gpt-6.2-astra`\
  \ | high |\n| spec | `gpt-6.2-sol` | xhigh |\n| performance | `gpt-6.2-sol` | xhigh |\n| license | `gpt-6.2-sol`\
  \ | low |\n\n- license 観点は em-workflow にだけある。\n- em-review の comprehensive 観点は chain が空なので、codex エントリは無い。\n\
  - 2 番目のエントリ（`{harness: litellm, model: muse-spark}`）は変更しない。\n\n## 現状\n\n- codex エントリの `model` は、security\
  \ 以外は指定していない。\n- effort は、`run_codex_exec.sh` が readonly モードで `-c 'model_reasoning_effort=\"xhigh\"\
  '` を固定で付けている。\n    - `em-workflow/scripts/run_codex_exec.sh`\n    - `em-review/scripts/run_codex_exec.sh`\n\
  - `reviewers.yaml` に effort を指定する項目は無い。\n\n## やること\n\n1. `reviewers.yaml` の codex エントリに effort を指定する項目を追加する（em-workflow\
  \ / em-review の両方）。\n2. `run_codex_exec.sh` が effort を引数で受け取れるようにする（em-workflow / em-review の両方）。\n\
  \    - 指定しないときは、今と同じ xhigh にする。\n3. codex-reviewer が `reviewers.yaml` の effort をラッパーに渡すようにする（em-workflow\
  \ / em-review の両方）。\n    - `model` の受け渡しと同じ経路にする。\n4. オーケストレーター側で、codex-reviewer に effort を渡す箇所を更新する（`review-protocol.md`\
  \ などで `model` の受け渡しを定義している箇所）。\n5. ゴールの表のとおりに、両方の `reviewers.yaml` のモデルと effort を書き換える。\n6. テストの期待値を更新し、effort\
  \ のテストを追加する。\n    - `tests/test_reviewers_primary_chains.py` の `EXPECTED_CHAINS`\n    - `tests/test_contributor_tier_criteria.py`\
  \ の `EM_REVIEW_EXPECTED_CHAINS`\n    - `tests/test_codex_wrapper_model_flag.py`（ラッパーの effort 引数）\n7.\
  \ `.claude/skills/security-review-model/SKILL.md` の「推論の深さはラッパーが固定する xhigh」という記述を、新しい指定方法に合わせて直す。\n\n\
  ## 受け入れ条件\n\n- 各観点の codex レビュアーが、ゴールの表のモデルと effort で `codex exec` を呼ぶ。\n- effort を指定しないエントリでは、今と同じく\
  \ xhigh で呼ぶ。\n- em-workflow と em-review の 2 つのコピーで、ラッパーの effort の扱いが揃っている。\n- 次のテストが通る。\n\n    ```\n\
  \    python3 -m unittest tests.test_codex_wrapper_model_flag \\\n      tests.test_reviewers_primary_chains\
  \ tests.test_contributor_tier_criteria\n    ```\n\n- `python3 -m unittest discover -s tests` が通る。\n"
