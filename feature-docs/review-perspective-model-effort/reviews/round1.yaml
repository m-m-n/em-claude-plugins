- stable_id: 4f185753962d81bc
  severity: medium
  category: security
  file: em-workflow/scripts/run_codex_exec.sh
  line: 68
  title: nocasematch を継承すると effort の検証が大文字を通す
  description: is_effort_word（66〜69行）は `local LC_ALL=C` のうえで `[[ "$1" =~ ^[a-z]+$ ]]` を使う。bash のマニュアルによると、nocasematch
    が有効なとき `=~` は大文字と小文字を区別せず、環境変数 BASHOPTS にある shell option は起動時に有効になる。スクリプトは nocasematch を解除しないので、その環境では
    `HIGH` が検証を通り、`model_reasoning_effort` の -c に入る。SPEC FR3 / NFR2 と脅威モデル TM-1 の『^[a-z]+$ に一致しない値は exit
    1 で、codex を起動しない』から外れる。通るのは英字だけなので、引用符・バックスラッシュ・空白による TOML への注入は起きない。BASHOPTS を操作できる前提も要るため、実害は仕様との不一致に限られる。security@s1#0
    と spec#0 は em-review のラッパーにも同じ検証があると報告している（評価者は読み取りの上限のため未読）。spec#0 も同じ箇所を独立に指摘した。
  suggestion: 両ラッパーで、スクリプトの冒頭か is_effort_word の中で `shopt -u nocasematch` を実行してから検証する。NFR3 のとおり両ラッパーを同じ形にし、環境に
    BASHOPTS=nocasematch を置いた stub 起動で `HIGH` が exit 1 になり、codex を起動しないことを確かめるテストを足す。
  reproduction: 親の Bash で `shopt -s nocasematch` と `export BASHOPTS` を実行し、各ラッパーを `readonly --effort HIGH
    'Review marker'` で呼ぶ。起動処理をスタブに置き換えて確認すると、em-review では `model_reasoning_effort="HIGH"` が起動引数に渡り、em-workflow
    では検証を通過して起動準備に進む。`nocasematch` を無効にした同じ呼び出しでは、両方とも検証エラーを出して終了コード1を返す
  reproduction_alternates: []
  reproduction_overflow: false
