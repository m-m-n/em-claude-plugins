  description: _assert_minor_bump_over_baseline（108〜121行）は、現在のマニフェストに対して major が基準と同じ、minor が基準 +1、patch
    が 0 であることを要求する（基準は 63〜64 行の 0.4.28 / 0.5.54）。.claude/rules/core-plugin-version-bump.md のとおり、main への
    push 後は Actions がそのプラグインの patch を上げる。この変更の次に em-workflow か em-review を変えて push すると patch が 1 になり、このモジュールは失敗し続ける。次の
    minor 更新でも失敗する。無人実行の検証段で全テストを流すと、無関係な機能でもこの失敗に当たる。
  suggestion: 継続実行されるアサーションを、(major, minor, patch) が (基準の major, 基準の minor + 1, 0) 以上という下限比較と、マニフェストとマーケットプレイスの一致に変える。patch
    == 0 と minor == 基準 + 1 の厳密な確認は、受け入れ時の git diff による検証に回す。否定の証明（patch だけの更新を拒否するなど）は下限比較に合わせて直す。
