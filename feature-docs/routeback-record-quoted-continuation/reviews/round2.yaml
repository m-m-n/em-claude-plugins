  description: '`_scan_flow`（374〜384 行目）は、`?` の直後が空白・タブ・行末なら位置を問わず指示子とみなし、`_at_start` を真にする。YAML 1.2.2 で `?` が明示キーの指示子になるのはフロー項目の先頭だけで、`[retry? ''failed]` や `{reason: retry? ''failed}` の `retry? ''failed` は 1 つの通常文字列になる。task0001 が pending、ジャーナル 1 行目が task0001 の failed、notes の後ろに本物の直下キー `routeback_failed_journal_line: 1`、その後に task0002 という入力で、records は {} になり終了コードが 2 から 0 に倒れる（メモリ内で再現）。前回の 6bd6c5a5788b3ddf の修正が `?` について不完全で、SPEC FR4 と THREAT-MODEL.md の TM-2 を満たしていない。PyYAML 6.0.3 はこの入力を構文エラーにするが、フックは YAML 1.2.2 の読み方を採っている。'
  suggestion: '`?` を指示子とみなすのは、その時点で `_at_start` が真（フロー項目の先頭）で、かつ直後が空白・タブ・行末のときに限る。`[retry? ''failed]`、`{reason: retry? ''failed}`、行末に `?` がある形の後ろに本物の直下キーの記録と task0002 を置き、exit 2 になる回帰テストを足す。既存の `{? ''tried }` が開くテストは維持する。'
