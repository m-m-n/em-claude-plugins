  title: 全角空白などの Unicode 空白だけの行を空行とみなし、通常文字列の続きの行で引用値を開いて後続行を隠す
  description: '`_read_line`（240 行目）は `stripped.strip() == ""` で空行を判定する。Python の `strip()` は U+3000 や U+00A0 も取り除くが、YAML の空白は半角空白とタブだけなので、これらだけの行は通常文字列の内容になる。`notes:` の次に U+3000 だけの行、その次に `      - ''unclosed` が続くと、追跡処理は U+3000 の行を空行として飛ばし、次の行で単一引用値を開いて以降の全行を本文にする。後続の記録と task0002 が消え、exit 2 が exit 0 に倒れる（メモリ内で再現、PyYAML 6.0.3 でも有効な YAML）。b342ff634000d263 の修正の取りこぼしで、SPEC FR4 と TM-2 に反する。'
  suggestion: 追跡処理の空行判定を半角空白とタブだけに限定する（240 行目。230 行目の `feed` の空行判定も揃える）。U+3000 や U+00A0 だけの行の後に `- '…`、`"…`、`[…` が続く形で、本物の記録と task0002 が読まれて exit 2 になる回帰テストを足す。
