  description: '`_read_line` は行頭の項目記号を無条件に値の開始位置とみなす（`value_start = dash_col is not None or ...`）。通常文字列の継続状態を持たないので、`    notes: retry failed` の次行に `      - ''unclosed` があると単一引用値を開き、以降の全行を本文として扱う。この 2 行は YAML として有効で、PyYAML 6.0.3 は notes を `"retry failed - ''unclosed"` と読み、後続の直下キーも読む。メモリ内で再現し、`- "x` の形と、値が次行から始まる形（`notes:` / `retry failed` / `- ''unclosed`）でも、後続の記録と task0002 が同じように消えることを確認した。変更前に exit 2 だった入力が exit 0 に倒れる。追跡処理の説明（plain-scalar continuation lines never open）、SPEC FR4、THREAT-MODEL.md の TM-2 に反する。既存テスト test_plain_scalar_continuation_lines_never_open は、引用符か括弧で始まる継続行しか確かめていない。'
  suggestion: キーや項目の値がその行で通常文字列だったとき、親の字下げを覚える。値が次行から始まり、その最初の行が通常文字列だったときも同じにする。その後、親より深い字下げの行（空行とコメント行を除く）を継続行として扱い、項目記号・引用符・括弧で値を開かない。親以下の字下げの行が来たら状態を解く。継続行が `- 'x`・`- "x`・`- [x` の場合と、値が次行から始まる場合について、後続の本物の記録と task0002 が読まれて exit 2 になる回帰テストを足す。
