  title: フロー内の通常文字列中の `:'` / `?'` を内側の引用値の開始と誤認し、後続行をすべて隠す
  description: '`_scan_flow` は、直前の有意文字が `:` か `?` なら引用符で内側の文字列を開く。`notes: [retry:''failed]` と `notes: {a:''b}` は YAML として有効で、`retry:''failed` と `a:''b` は通常文字列になる（PyYAML 6.0.3 でも `["retry:''failed"]` / `{"a:''b": None}` と読む）。それでも内側の引用値が開いたままになり、同じ行の `]` / `}` を数えず、以降の全行を本文として扱う。メモリ内で再現し、後続の直下キーの記録 `routeback_failed_journal_line: 1` と task0002 が読み取り結果から消えることを確認した（task_ids は [''task0001''] だけ、records は {}）。変更前に exit 2 だった入力が exit 0 に倒れる。THREAT-MODEL.md の TM-2（値の開始位置以外の引用符では開かない）と SPEC FR4（プレーンスカラーの途中の引用符は開きとみなさない）を満たしていない。既存テスト test_quote_inside_a_plain_flow_scalar_is_not_an_inner_string は、`it''s` のように英字の直後に来る引用符しか確かめていない。'
  suggestion: '`:` と `?` を指示子とみなすのは、直後が空白・タブ・行末のときに限る。`:` はこれに加えて、直前が閉じた内側の引用文字列か入れ子のコレクションの閉じ括弧のとき（JSON 形式のキーの直後）も指示子とみなす。それ以外の `:` / `?` は通常文字として `_prev` を更新する。`[retry:''failed]` と `{a:''b}` の後ろに本物の直下キーの記録と task0002 を置き、exit 2 になることと task0002 が列挙されることを確かめる回帰テストを足す。あわせて `{"a":''b` や `[a: ''b` のような正しい開始位置が引き続き開くことも確かめる。'
  sources:
