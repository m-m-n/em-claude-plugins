  description: 'security の指摘と原因は同じで、症状が逆向きに出る例。入力は `zsh -c ''echo "$(for x (<(printf x # )))"; python3 -i; echo "<改行>)) { :; })"''`。変更後は、入れ子の w の中の `#` が語の文字になる。続く `)` で入れ子の w を閉じ、次の `)` で外側の w を閉じ、3 つ目の `)` で `$(` の置換を閉じる。外側の読みでは `"` が閉じた後に `; python3 -i` が命令として判定され、拒否される。zsh ではコメントが改行まで続くので、`python3 -i` はプロセス置換の中のコメントの一部で、実行されない。変更前はここがコメントとして読まれ、判定は silent だった。新しく生まれた誤爆で、無人実行の停止につながる。em-review のコピーも同一で、同じ問題がある。'
  suggestion: 'security の指摘の修正と一緒に直す。文脈 w の中で語の先頭にある `<(`・`>(`・`=(` を、入れ子の w ではなくコマンド列 p として積む。両コピーに同じ修正を入れ、この入力を silent の行として CASES に足す。'
