  title: '語一覧の中のプロセス置換 <( ) のコメントを語の文字と読み、コメント内の引用符で判定不能になって対話起動の拒否を漏らす'
  description: '`_skip_substitution` の `(` 分岐 (2551-2577) は、文脈 w の中の `(` を常に入れ子の w として積む。そのため `<(`・`>(`・`=(` のプロセス置換も入れ子の w になる。今回の条件 `stack[-2] != "w"` (2599) により、その中では空白の後の `#` もコメントを始めなくなった。コメント内の `"` は d として開かれる。再現入力 `echo "$(for x (<(: # "<改行>)) { :; })"; python3 -i` では、d が `})"` の `"` まで続く。残りは w のまま入力の末尾に達し、`_Undecidable("substitution")` になる。最初の命令の中で起きるのでチェックポイントが無い (3317-3322, 3340-3341)。後続の `python3 -i` は判定されず、出力は空になる。変更前は旧条件で `#` から行末までがコメントになり、`))` で w を閉じて置換を閉じたうえで `python3 -i` を拒否していた。zsh はプロセス置換の中身をコマンド列として読み、コメントを認める。新しく拒否漏れ (fail-open) が生まれており、これは本機能が取り除こうとした種類の問題と同じ。em-review のコピーはバイト単位で同一なので、同じ問題がある。原因は SPEC の前提 A1/A2 にある。A1/A2 は入れ子の `(` をすべて glob 修飾子とみなしており、プロセス置換を考えていない。'
  suggestion: '両コピーの `(` 分岐 (2551-2577) を直す。文脈 w の中で語の先頭にある `<(`・`>(`・`=(` は、入れ子の w ではなくコマンド列 p として積む。その `)` は語の中の閉じ (close_command False) として扱い、w に戻る。glob 修飾子やグループの入れ子 w では、今のまま `#` を語の文字として読む。CASES に 2 行を足す。1 つはプロセス置換内のコメントに引用符を含む deny の行、もう 1 つは `python3 -i` がプロセス置換内のコメントにだけある silent の行。2 つのコピーは同じ変更の中で一緒に直し、バイト単位で同一に保つ。'
  reproduction: '次の JSON をフックの標準入力へ渡す。command 自体は実行しない: {"tool_name":"Bash","tool_input":{"command":"zsh -c ''echo \"$(for x (<(: # \"\n)) { :; })\"; python3 -i''"}}。変更後は標準出力が空になり、変更前の条件では permissionDecision: deny が返る。'
