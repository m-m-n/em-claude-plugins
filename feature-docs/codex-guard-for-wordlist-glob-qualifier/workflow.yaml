base_branch: main
goal: |
  # codex-hook-interactive-guard: zsh の for 語一覧の中の glob 修飾子 *(#qN) の # をコメントと読み、後ろの python3 -i を見逃す

  種別: バグ
  Notion: <notion-url>

  ## 現象 (必須)

  feature `codex-guard-subst-reading-regressions` の review round 1 で deferred になった指摘（stable_id `fa91f061156d70be`、medium）。

  `codex-hook-interactive-guard.py`（em-workflow / em-review の両コピー）は、zsh の `for name (words)` の語一覧の中で開いた入れ子の `(`（glob 修飾子）でも、直前が `(` の `#` をコメントの始まりと読む。`*(#qN)` の `#` は語の途中にあり、zsh ではコメントにならない。後ろに改行がなければ判定不能（`_Undecidable`）になり、置換の後ろの `python3 -i` を拒否しない（拒否漏れ）。

  ## 再現手順 (必須)

  1. `tool_input.command` に次を設定した PreToolUse(Bash) の JSON をフックの標準入力へ渡す（コマンド自体は実行しない）
  2. `zsh -c 'setopt extendedglob; echo "$(for x (*(#qN)) { :; })"; python3 -i'` → 無出力になる（基準コミット `f201d52d` では deny）
  3. 最上位（シェル不明）の `echo "$(for x (*(#qN)) { :; })"; python3 -i` も無出力になる

  ## 期待する挙動 (必須)

  - 語一覧の中で開いた入れ子の `(` の entry（`stack[-2]` が `w` のもの）では、直前が `(` の `#` を語の文字として読む
  - コメントは一番外の語一覧の entry でだけ始まる（TS8 の `for x (# c<改行>a)` の読み方は変えない）
  - 読み取りの線形性を保つ

  ## 完了の定義 (必須)

  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある
  - [ ] `tests/test_codex_hook_interactive_guard.py` の `CASES` に上の入力（zsh -c 版と最上位版）を deny の行として追加し、両コピーに流す
  - [ ] 両コピーがバイト単位で同一のまま

  ## 該当箇所 (任意)

  - `em-review/scripts/codex-hook-interactive-guard.py:2539`
  - `em-workflow/scripts/codex-hook-interactive-guard.py`（同一内容）
  - 記録: `feature-docs/codex-guard-subst-reading-regressions/reviews/round1.yaml`（ブランチ `em-workflow/codex-guard-subst-reading-regressions/integration`）

  ## 実害・発生条件 (任意)

  `$( )` の中の zsh の for の語一覧に `#` で始まる glob 修飾子（`*(#qN)` 等）を書き、同じ置換の中で後ろに改行が無い場合だけ。拒否漏れ（fail-open）で、無人実行が入力待ちで止まりうる。p の文脈の `$(ls *(#qN))` は変更前から同じように読み違える（今回の差分の範囲外）。

  ## 追加指示（起動時）

  - 実装完了後、integration ブランチを remote に push し、base_branch へ gh pr create で PR を作成する。integration ブランチはローカル・リモート双方に残す（base_branch へ自動マージしない）
  - 不明点は Codex に相談し、比較的良いと判断した選択肢を採用する
  - その議論内容を Notion に記録する
