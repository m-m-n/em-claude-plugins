    source: batch-codex-consultation
    answer_mode: select_or_freeform
    selected_option_ids: [template-default]
    freeform: null
    normalized_answer: >-
      SPEC / REQUIREMENTS テンプレートに「宣言された変更集合」の節を新設し、
      workflow 生成物を既定で含む形にする。containment 検証側は現状どおり
      「コミットされた成果物はすべて実変更集合の一部」として扱う。
    resolution_note: >-
      batch-policies.yaml の create-spec.requirement-clarification が
      codex_consultation を指定。Codex は template-default を推し、
      「生成物を検証側で除外すると閉じた宣言が実態と乖離し containment が弱まる」
      ことを理由に挙げた。オーケストレーターが option_id への対応を判定して採用。
  workflow-artifact-set:
    packet_id: create-spec-q0001
    answered_at: "2026-08-16T20:31:00+09:00"
    source: batch-codex-consultation
    answer_mode: select_or_freeform
    selected_option_ids: [test-docs-and-feature-docs]
    freeform: null
    normalized_answer: >-
      既定集合は test-docs/{feature}/** と feature-docs/{feature}/** の両方。
      後者には SPEC 執筆後に生成される reviews/roundN.yaml・retrospect.yaml・
      VERIFICATION.md・tasks/・workflow.yaml・phase-state/ が含まれる。
    resolution_note: >-
      Codex 相談。両ディレクトリとも回避不能な workflow 出力であり、
      test-docs のみに限ると後続フェーズの生成物で同じ行き止まりが再発する。
  recycled-feature-remediation:
