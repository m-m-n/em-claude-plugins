findings:
- stable_id: 155bd6279d2d5a79
  severity: medium
  category: security
  file: em-workflow/scripts/codex-hook-interactive-guard.py
  line: 454
  title: '`}` の前にセミコロンが無い括弧なし匿名関数が文字列全体を判定不能にし、同じ文字列の対話起動を見逃す'
  description: 'zsh は IGNORE_CLOSE_BRACES が無効なら、単独の `}` をセミコロン無しでも閉じ括弧として読む。このため `function { : }` は有効な構文になる。変更後は `function` の後の `{` で群を開く（454行）。一方 `}` は、単純コマンドに語が残っていると閉じ括弧として扱わない（457行の `not self.words`）。群が閉じないまま parse が `_Undecidable("group")` を送出し、`_scan` と `main` がこれを捕捉してその文字列を丸ごと読み飛ばす。その結果、`zsh -c ''python3 -i; function { : }''` やトップレベルの `python3 -i; function { : }` が、変更前の deny から出力なしに変わる（fail-open 方向の退行）。em-review 側のコピーもバイト単位で同一。`function () { : }`、`() { : }`、ただの `{ : }` は変更前から同じく判定不能なので、退行は括弧なし形に限られる。'
  suggestion: '両コピーで、匿名関数の本体（anon な `{` 群）の中にある単独の bare な `}` は、語が残っていても、まず単純コマンドを確定してから群を閉じるようにする。`zsh -c ''python3 -i; function { : }''`、`zsh -c ''function { : }; python3 -i''`、`zsh -c ''function { python3 -i }''` を deny として CASES に加える。'
  reproduction: '両コピーのフックに標準入力で {"tool_input":{"command":"zsh -c ''python3 -i; function { : }''"}} を渡すと、終了コード0・標準出力なしになる。基準コミット328f1d1cでは同じ入力にdenyが返る。変更後も `function { :; }` にするとdenyが返る。実行経路は、閉じられないグループによる `_Undecidable` を `_scan` が捕捉し、内側の文字列全体を読み飛ばす経路。zshではpython3を引数表示だけの関数に置き換えて安全に確認し、`-i` を伴う呼び出しに到達することを確認した'
  reproduction_alternates: []
  reproduction_overflow: false
  sources:
