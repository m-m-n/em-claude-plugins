schema_version: 1
feature: codex-guard-anon-brace-forms
created: '2026-10-12'
base_branch: main
goal: '# codex-hook-interactive-guard: zsh の括弧なし匿名関数 function { ... } と、閉じ波括弧の後に引数を取る function () { ... } arg の本体を判定せず対話起動を見逃す


  Notion タスク: <notion-url> (種別: バグ)


  ## 現象 (必須)

  `codex-hook-interactive-guard.py`（em-workflow / em-review の両コピー）が、次の 2 つの zsh の匿名関数の形で本体の対話起動を見逃す。zsh ではどちらも定義した匿名関数をその場で実行する。

  - 括弧なしの `function { python3 -i; }`: 現行パーサーは 1 つのコマンドとして読み、本体を判定しない

  - 閉じ波括弧の後に引数を取る `function () { python3 -i; } arg`: 判定不能として素通しする

  feature `codex-guard-anon-function`（名前のない `function ()` を匿名関数として本体を判定する修正）の create-spec で、Codex に確認したうえで対象外とし、残存する見逃しとして記録した。関数名判定の修正だけでは直らず、波括弧の認識と閉じた後の引数処理の変更が要る。


  ## 再現手順 (必須)

  1. コマンド `zsh -c ''function { python3 -i; }''` を `{"tool_input": {"command": "..."}}` として hook の標準入力に渡す

  2. 何も出力されない（silent）

  3. `zsh -c ''function () { python3 -i; } arg''` でも同じく silent


  ## 期待する挙動 (必須)

  どちらの形も zsh の匿名関数として本体を判定し、本体に対話起動があれば deny する。


  ## 完了の定義 (必須)

  - [ ] 再現手順で現象が起きない

  - [ ] 再発を検出するテストがある

  - [ ] `tests/test_codex_hook_interactive_guard.py` の `CASES` に上の 2 コマンドを deny として追加

  - [ ] 両コピーがバイト単位で同一のまま


  ## 該当箇所 (任意)

  - `em-workflow/scripts/codex-hook-interactive-guard.py`

  - `em-review/scripts/codex-hook-interactive-guard.py`（同一内容）

  - 記録: `feature-docs/codex-guard-anon-function/phase-state/create-spec.yaml` の `assumption.a4.out-of-scope-forms`（ブランチ `em-workflow/codex-guard-anon-function/integration`）


  ## 実害・発生条件 (任意)

  見逃し側（fail-open）。zsh -c の中でこれらの形の匿名関数を使って対話プログラムを起動すると、ガードを通り抜けて対話待ちの孤児プロセスが残りうる。


  ## 追加指示（起動時）

  - 完了時は integration branch を remote に push し、base_branch へ gh pr create で PR を作る。integration branch はローカル・リモートとも残す（base_branch へ自動マージしない）。

  - 不明点は Codex に相談し、比較的良いと判断された選択肢を採用する。

  - その議論の内容を Notion に記録する。

  '
