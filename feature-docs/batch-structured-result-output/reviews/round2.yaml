  title: 自前 4 規則が発火したときの出力が未定義で、`detail` には CR/LF/TAB 以外の制御文字を落とす合法な手段が無い
  description: 99-107 行の `detail` 正規化が空白へ置換するのは CR / LF / TAB の 3 種のみ。ESC (U+001B) をはじめとする他の C0 / C1 制御文字は正規化を素通りし、61-64
    行の residual 規則で `\u001b` にエスケープされて decode 時に terminal-control code point として復活する。247-251 行はエスケープ済みでも拒否すると明言しているため、`detail`
    の出所（自動承認コマンド文字列など、`## Reporting` の監査項目）に ANSI 制御列が 1 つ混じった時点でこの規則が発火する。131-141 行の in-full 規則は secret
    の redaction を「One named exception, and only one」と明示しているので、emitter が制御文字だけを落とす合法な手段も文書内に存在しない。さらに 64
    KiB 衝突（227-236 行）には発火時の出力を明記した段落があるのに、この 4 規則には対応する段落が無く、拒否が起きたとき何を出すのかがどこにも定義されていない。
  suggestion: いずれかで閉じる。(a) `detail` の正規化規則を「U+0000-U+001F / U+007F-U+009F / U+2028 / U+2029 を単一スペースに置換する」まで広げ、これは内容の削除ではなく制御文字の正規化であって
    131-141 行の in-full 規則の例外にはあたらない旨を明記する。そのうえで 247 行の `detail` 部分を「正規化後に残ることは無い」二重防壁として据える。(b) 拒否対象を「エスケープを逃れて生のまま出力に残った」制御文字だけに限定する。いずれの場合も、それでも拒否が起きたときの出力を
    64 KiB 段落と同じ形（結果を出さない／reason code は追加しない）で 1 段落明記する。
  sources:
