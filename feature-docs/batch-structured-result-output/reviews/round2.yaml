  description: '247-251 行の em-workflow 自身の拒否規則は「`detail` と `resume_conditions` は decode 後の line terminator
    / terminal-control code point を拒否する。`## Escaping` はここでも助けにならず、エスケープ済みの制御文字も生のものと同じく拒否される」と定める。一方、同文書
    126-130 行は `resume_conditions` について「`detail` の正規化は適用せず、Markdown の改行・インデント・末尾空白は `## Escaping` のエスケープとして生き残る」と定め、SPEC
    FR8 / AC-4 も同じことを要求している。`\n` は decode すれば line terminator なので、複数行のリカバリ手順を持つ `state: "stopped"` の結果は必ずどちらかの規則を破る。停止は
    batch で最も頻度の高い終端経路であり、(a) FR8 に従えば自前規則で拒否され、(b) 自前規則に従えば結果を出せず NFR6 の「結果なし＝異常終了」信号が正常な停止に対して誤って立つ。242-245
    行の「Each of the four cannot fire while `## Escaping` is honoured」という前提文も、247-251 行自身がエスケープ済みを拒否すると明言しているためこの経路では偽。矛盾の両側をテストが緑のまま固定している（tests/test_structured_result_conformance.py
    の TestResumeConditionsEscapingOnly と tests/test_batch_stop_contract.py の _assert_own_hardening_rules_stated）ため、スイートでは検出できない。この拒否規則は
