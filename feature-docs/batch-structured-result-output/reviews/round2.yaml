    のみを対象としている。4 パースペクティブすべてが同一サイトを独立に報告（spec / architecture / comprehensive が high、security が medium）。'
  suggestion: '拒否規則を `detail` と `resume_conditions` で分ける。1 案: 当該 bullet を「`detail` は decode 後の line terminator
    / terminal-control code point を拒否する（`## Field values` の正規化が CR/LF/TAB を除去済みなので、残存は正規化の飛ばしを意味する）。`resume_conditions`
