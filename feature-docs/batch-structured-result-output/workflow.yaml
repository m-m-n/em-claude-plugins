base_branch: main
goal: |
  --batch --once --pr https://www.notion.so/3e03509ec8ee81ad844ce7ad361eb564

  Once the implementation is finished, push the integration branch to the remote and create a Pull Request against base_branch with gh pr create. Keep the integration branch both locally and on the remote (do not auto-merge it into base_branch).
  Consult Codex on any unclear points and adopt the option judged to be comparatively better.
  Record the content of that discussion in Notion.

  --- Resolved Notion task (title + body), fetched at launch ---

  # batch 終端行が claude-batch の要求スキーマと不一致で run が exit 1 になる

  種別: バグ

  ## 現象 (必須)
  `claude-batch` 経由の `--batch` 実行で、オーケストレーターが終端行を出した時点で
  スキーマ検証に弾かれ、run が exit 1 で終わる。

      claude-batch: response does not conform to schema (attempt 1/5): output_schema: missing key "branch"

  em-workflow は `references/batch-terminal-line.md` を SSOT として、4 フィールドの
  マーカー行を出すよう指示している。

      EM_WORKFLOW_TERMINAL: state=phase_done step=create-spec reason=none detail=...

  一方 claude-batch は 8 キーの構造化出力を要求する（`branch` / `detail` / `feature` /
  `pr_url` / `reason` / `resume_conditions` / `state` / `step`）。loop-develop 側は
  2026-08-17 の `refactor(yaml-result-sole-path): drop legacy path` で
  `EM_WORKFLOW_TERMINAL:` マーカー行のパーサを削除済み。em-workflow 側がこの移行に
  追従していない。

  ## 再現手順 (必須)
  1. `claude-batch` 経由で `/em-workflow:develop --batch --once <タスク>` を実行する
  2. いずれかのフェーズ境界でターンが終端状態に達し、`references/batch-terminal-line.md`
     のとおり `EM_WORKFLOW_TERMINAL:` 行が出力される
  3. claude-batch が `output_schema: missing key "branch"` で拒否し、run が exit 1 になる

  ## 期待する挙動 (必須)
  em-workflow が claude-batch の要求する 8 キーの構造化出力を出し、終端状態が正しく
  受け取られて run が成功扱いで終わる。

  ## 完了の定義 (必須)
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある

  ## 該当箇所 (任意)
  - `em-workflow/references/batch-terminal-line.md` — 終端行の SSOT。`Line format` 節が
    「exactly four `key=value` fields」を定義している
  - `em-workflow/skills/develop/SKILL.md` — 「バッチ終端行」節（上記 SSOT を参照）
  - 相手側の契約: loop-develop `src/local/terminal-line.ts`（8 キーを列挙する
    `STRUCTURED_RESULT_FIELDS`、legacy マーカー行パーサは削除済み）

  ## 実害・発生条件 (任意)
  無人 batch 実行が終端で必ず失敗扱いになり、Notion タスクが「中断」に落ちる。
  フェーズの成果物自体は integration ブランチにコミット済みで残るため、再起動すれば
  続行はできる。
  実例: emterm の feature `wheel-report-notch-clamp`（2026-09-20 01:34 JST、exit 1、
  所要 10m38s、session_id `01a0ba7b-88ce-7386-820f-5cd666da2d27`）。create-spec は
  完了していたが、終端行の拒否で run 全体が失敗になった。
  なお、このとき claude-batch は 5 回までの再出力リトライを持つが、1 回目の block 応答が
  `hook_listener: reply window closed before the reply could be delivered` で配送に失敗し、
  リトライが成立しないまま interrupt されて exit 1 になった。こちらは claude-batch 側の
  挙動で、本タスクのスコープ外。
