schema_version: 1
feature: batch-structured-result-output
created: '2026-09-20'
base_branch: main
goal: "--batch --once --pr https://www.notion.so/3e03509ec8ee81ad844ce7ad361eb564\n\nOnce the implementation\
  \ is finished, push the integration branch to the remote and create a Pull Request against base_branch\
  \ with gh pr create. Keep the integration branch both locally and on the remote (do not auto-merge it\
  \ into base_branch).\nConsult Codex on any unclear points and adopt the option judged to be comparatively\
  \ better.\nRecord the content of that discussion in Notion.\n\n--- Resolved Notion task (title + body),\
  \ fetched at launch ---\n\n# batch 終端行が claude-batch の要求スキーマと不一致で run が exit 1 になる\n\n種別: バグ\n\n## 現象\
  \ (必須)\n`claude-batch` 経由の `--batch` 実行で、オーケストレーターが終端行を出した時点で\nスキーマ検証に弾かれ、run が exit 1 で終わる。\n\n   \
  \ claude-batch: response does not conform to schema (attempt 1/5): output_schema: missing key \"branch\"\
  \n\nem-workflow は `references/batch-terminal-line.md` を SSOT として、4 フィールドの\nマーカー行を出すよう指示している。\n\n   \
  \ EM_WORKFLOW_TERMINAL: state=phase_done step=create-spec reason=none detail=...\n\n一方 claude-batch\
  \ は 8 キーの構造化出力を要求する（`branch` / `detail` / `feature` /\n`pr_url` / `reason` / `resume_conditions` / `state`\
  \ / `step`）。loop-develop 側は\n2026-08-17 の `refactor(yaml-result-sole-path): drop legacy path` で\n`EM_WORKFLOW_TERMINAL:`\
  \ マーカー行のパーサを削除済み。em-workflow 側がこの移行に\n追従していない。\n\n## 再現手順 (必須)\n1. `claude-batch` 経由で `/em-workflow:develop\
  \ --batch --once <タスク>` を実行する\n2. いずれかのフェーズ境界でターンが終端状態に達し、`references/batch-terminal-line.md`\n   のとおり\
  \ `EM_WORKFLOW_TERMINAL:` 行が出力される\n3. claude-batch が `output_schema: missing key \"branch\"` で拒否し、run\
  \ が exit 1 になる\n\n## 期待する挙動 (必須)\nem-workflow が claude-batch の要求する 8 キーの構造化出力を出し、終端状態が正しく\n受け取られて run\
  \ が成功扱いで終わる。\n\n## 完了の定義 (必須)\n- [ ] 再現手順で現象が起きない\n- [ ] 再発を検出するテストがある\n\n## 該当箇所 (任意)\n- `em-workflow/references/batch-terminal-line.md`\
  \ — 終端行の SSOT。`Line format` 節が\n  「exactly four `key=value` fields」を定義している\n- `em-workflow/skills/develop/SKILL.md`\
  \ — 「バッチ終端行」節（上記 SSOT を参照）\n- 相手側の契約: loop-develop `src/local/terminal-line.ts`（8 キーを列挙する\n  `STRUCTURED_RESULT_FIELDS`、legacy\
  \ マーカー行パーサは削除済み）\n\n## 実害・発生条件 (任意)\n無人 batch 実行が終端で必ず失敗扱いになり、Notion タスクが「中断」に落ちる。\nフェーズの成果物自体は integration\
  \ ブランチにコミット済みで残るため、再起動すれば\n続行はできる。\n実例: emterm の feature `wheel-report-notch-clamp`（2026-09-20 01:34\
  \ JST、exit 1、\n所要 10m38s、session_id `01a0ba7b-88ce-7386-820f-5cd666da2d27`）。create-spec は\n完了していたが、終端行の拒否で\
  \ run 全体が失敗になった。\nなお、このとき claude-batch は 5 回までの再出力リトライを持つが、1 回目の block 応答が\n`hook_listener: reply window\
  \ closed before the reply could be delivered` で配送に失敗し、\nリトライが成立しないまま interrupt されて exit 1 になった。こちらは\
  \ claude-batch 側の\n挙動で、本タスクのスコープ外。\n"
