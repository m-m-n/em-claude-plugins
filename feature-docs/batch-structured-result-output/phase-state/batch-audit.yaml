  - question_id: develop.terminal-output-contract-selection
    packet_id: null
    answered_at: "2026-09-20T03:35:00+09:00"
    source: batch-unlisted-gate-fallback
    answer_mode: freeform
    selected_option_ids: []
    freeform: "emit the new bare eight-key structured result"
    normalized_answer: "emit the new bare eight-key structured result"
    resolution_note: >-
      gate: unlisted, no gate_id — which output contract this run's own --once
      phase-boundary final message must follow. Option A: the legacy
      EM_WORKFLOW_TERMINAL four-field marker line, which is what the main
      working tree's em-workflow/references/batch-terminal-line.md (the literal
      path develop's SKILL.md names) still contains and what the orchestrator's
      loaded skill text describes. Option B: the bare eight-key YAML mapping
      this feature just committed to that same file on the integration branch.
      codex_consulted: attempted, no decision obtained — the Codex CLI returned
      a usage-limit error (no second opinion; not retried through a substitute
      provider). Falling back to the minimum-side-effect option per
      references/batch-mode.md's unlisted-gate fallback. Chosen: Option B.
      Reasons: the live consumer (loop-develop / claude-batch) dropped its
      legacy marker-line parser on 2026-08-17 and requires the eight keys, so
      Option A is a guaranteed rejection that ends the run at exit 1 — the exact
      defect this feature exists to fix — while Option B matches the contract
      the consumer actually enforces; and the contract this run owns is the one
      committed on its own integration branch, which is the current SSOT for
      this feature's work. Not chosen: Option A (reproduces the reported bug),
      and emitting both formats (the new contract requires the mapping to be the
      whole final message). Side effects are identical either way on the branch
      state; only the run's own outcome signal differs.

  - question_id: review.r2b-no-successful-chain-entry
    packet_id: null
    answered_at: "2026-09-20T03:55:00+09:00"
    source: batch-safe-default
    answer_mode: freeform
    selected_option_ids: []
    freeform: "dispatch the single Claude fallback for each of the four perspectives"
    normalized_answer: "dispatch the single Claude fallback for each of the four perspectives"
    resolution_note: >-
      gate: unlisted, no gate_id — review phase R2b, how to treat a schema-valid
      but non-retryable `review_data_too_large` skip, and a retryable
      `rate_limited` skip whose remaining chain entries are all harness
      reviewers bound by the same data budget. Round 1 facts: comprehensive#0
      (codex) and security#0 (codex) skipped `rate_limited`; architecture#0
      (litellm vertex-glm-5.2) and spec#0 (litellm muse-spark) skipped
      `review_data_too_large` — the integrated diff is ~370,000 characters
      against review-protocol.md's 300,000-character budget.
      codex_consulted: attempted, no decision obtained. The Codex CLI returned
      a usage-limit error ("try again at 6:23 AM"), and both LiteLLM routes
      (vertex-glm-5.2 and muse-spark) returned 429 after exhausting their retry
      limit, so no second opinion was available through any provider.
      Options considered. (1) Strict literal reading of R2b: a non-retryable
      skip means keep the skip and dispatch nothing further — architecture and
      spec would end the round with zero completed runs and would not even be
      listed in `unreviewed_perspectives`, since that list requires a
      dispatched fallback. Round 1 would review 0 of 4 perspectives.
      (2) Purposive reading: treat "no completed run and no further chain entry
      that could succeed" as the chain-exhaustion case and dispatch the one
      Claude fallback per perspective. (3) Re-scope the review target by
      splitting the diff into batches and re-dispatching harness reviewers.
      Chosen: (2). Reasons, per references/batch-mode.md's unlisted-gate
      fallback (minimum side effect once no decision is reached): the protocol's
      own rationale for non-retryability is that "the next entry in the chain
      would be handed the same oversized data" — a statement about chain
      entries, not about the Claude fallback, which references/review-phase.md
      places outside the chain and outside the 2-hop budget; review-protocol.md
      scopes `review_data_too_large` to the litellm reviewer's model context,
      which the Claude fallback does not share; and R2b's stated design intent
      is that the fallback dispatch "structurally closes" the case of a
      perspective ending with zero completed runs. For comprehensive and
      security the `rate_limited` walk was not continued because every
      remaining entry is a harness reviewer under the same 300,000-character
      budget that two models had already failed on, and both harnesses were
      verified unreachable at that moment.
      Not chosen: (1), which silently drops all four perspectives from round 1
      with no disclosure surface; (3), which redefines the review target and is
      a larger, less reversible side effect than one extra fallback dispatch.
      Outcome: 4 Claude fallback dispatches, all completed, 17 raw findings.
      No chain hop was consumed.
