      gate: planner open item — the conformance tests (task0004) assert a shape
      defined by a document owned by task0001, and each task builds in its own
      worktree off the same parent; codex_consulted: true. Options: keep the
      canonical expected values in IMPLEMENTATION.md with only the owning task
      asserting the real file's binding, or have every dependent task assert the
      real file. Codex judged the plan's design comparatively better: duplicating
      the binding check across worktrees would add contract duplication and
      staleness risk without catching independent bugs, and the single assertion
      is backed by the negative-proof / non-vacuity convention plus the
      post-merge whole-suite run. Chosen: keep D5 unchanged. Not chosen:
      per-task real-file assertions.
