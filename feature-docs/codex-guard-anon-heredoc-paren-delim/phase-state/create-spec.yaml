    normalized_answer: 区切り語の ( 〜 ) 範囲に引用されていない $' または $" があるときは区切り語を確定できないものとして判定不能（無出力）にする。通常の引用符の中にある $' や、バックスラッシュで逃がした $ は契機にしない。
    resolution_note: 'gate create-spec.requirement-clarification（batch policy codex_consultation）。選択肢: undecidable / plain_quotes。同じ Codex ターンで undecidable を推奨: $''...'' は zsh がエスケープを復号するため、$ を残して通常引用だけ外す plain_quotes ではシェルの区切り語と一致しない。通常経路も $''...'' を生のまま保持しており再利用では解決しない（:1109-1115）。ただし通常引用の中の文字列やエスケープされた $ まで部分文字列検索で保留しないこと、同じ文字列内の実際の起動が検査できなくなる点は受け入れることを指摘。読めないものは無出力にする既存の方針と合い、誤判定を避けられる undecidable の方が比較的良いと判断し採用。Opus エスカレーションは不要。'
