  title: "二重引用符内の $( ) の引用符まで除去し、zsh と違う区切り語を登録して終端後の起動を見逃す"
  description: "_remove_range_quotes の二重引用符の分岐（1013〜1023 行）は `$(` を読み飛ばさず、次の `\"` で引用を閉じる。通常経路の _double_quoted（1059〜1064 行）は _skip_substitution で `$( ... )` を書いたまま残すため、SPEC FR1「除去の規則は通常経路と同じ」と THREAT-MODEL TM-1 の緩和策から外れる。`foo(\"$(echo \"x\")\")` は guard では `foo($(echo x))` として登録され、zsh では `foo($(echo \"x\"))` になる。実際の終端行と一致しないので heredoc が閉じず、_Undecidable が握りつぶされ、終端の後にある python3 -i を見逃す。変更前は deny されていた。em-review の複製も同一。"
  suggestion: "二重引用符の分岐で `$(` / `$((` に当たったら _skip_substitution で読み飛ばし、その原文を残す（_double_quoted と同じ扱い）。読み飛ばしが範囲の終わりを越えるときは _Undecidable にする。再現コマンドを CASES に追加し、両コピーを同じ変更で直す。"
  reproduction: "inner を \"function { :; } << foo(\\\"$(echo \\\"x\\\")\\\")\\nfoo(\\\"$(echo \\\"x\\\")\\\")\\nfoo($(echo \\\"x\\\"))\\npython3 -i\" とし、tool_input.command に \"zsh -c \" + shlex.quote(inner) を設定したJSONをフックへ渡す。変更前の読み取りでは deny、変更後は標準出力が空になる。"
  reproduction_alternates: []
  reproduction_overflow: false
