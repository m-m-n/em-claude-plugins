schema_version: 1
feature: stop-reason-coverage
created: '2026-09-24'
base_branch: main
goal: '# em-workflow: 終端行契約の停止理由コード閉集合が全終端停止点を網羅していない


  Notion: https://www.notion.so/3be3509ec8ee8175956dd3e7f5b38f08


  ## やりたいこと（必須）

  `em-workflow/references/batch-terminal-line.md` の終端行契約について、停止理由コードの閉集合が「全ての終端停止点を網羅する」という主張を実態に一致させる。あわせて `step` 値の欠落と優先規則の記述矛盾を解消する。

  ## 背景・なぜ（必須）

  PR [https://github.com/m-m-n/em-claude-plugins/pull/8](https://github.com/m-m-n/em-claude-plugins/pull/8) で終端行契約を導入した際のレビュー round 2 で検出した 6 件（high 1 / medium 5）。batch mode の rework 上限に到達したため deferred として残した。詳細は同 PR の `feature-docs/batch-stop-contract/reviews/round2.yaml`。

  契約は「Every terminating stop point is bound to exactly one reason code above」と宣言しているが、round 1 で 2 つの穴を塞いだ直後の round 2 で更に 4 つ見つかっている。閉集合の網羅性を人手で維持する構造そのものが収束しない。

  ## 受け入れ条件 / 完了の定義（必須）

  - [ ] `b654786a7fb8e13c` (high): coverage 表に無い終端停止が reason code を持つ。対象は (1) `references/contracts/designer-contract.md` の `kind: none` × token 実在 ABORT と候補探索 truncated 時の batch abort、(2) 同 contract の `em_workflow` × html のみ実在（dispatch 中止）、(3) `references/phase-state.md` の未知 `schema_version` による plugin version mismatch abort、(4) `references/batch-policies.yaml` の `create-spec.command-approval` の `refusal_patterns: hard_fail`。catch-all code + fallback 規則を置くか、行を足したうえで owner 文書側にアンカーを書いて双方向チェックできる形にする

  - [ ] `6d3ffa3e04510229` / `454755f74a3e8a04` (medium): `stop-condition-4`（workflow.yaml parse エラー）と Step A.5 のゲート停止で `step` に出せる値がある。`no-step` の列挙を網羅的定義から例示に落とすか、`step` の fallback 規則を明記する

  - [ ] `e0aba3d91cffcb97` (medium): 優先規則の「3 停止点すべてが step を `failed` にする」という記述を Source 文書に合わせて修正する。`docs-commit-conflict` は status を書かずに中断する（そもそも書けなかったのが停止理由）

  - [ ] `c1e94c9399f18b7d` (medium): 優先規則の `stop-condition-3` 限定文を状態ベースから経路ベースへ改め、前回ランが残した `failed` での再突入停止に code が付くようにする

  - [ ] `9e5ce22b85677b38` (medium): refusal-pattern hard fail が coverage 表に載るか、`gate_fail_closed` への写像が明示される

  - [ ] 変更に応じて `tests/test_batch_stop_contract.py` / `tests/test_batch_stop_contract_skill_wiring.py` の pin 定数（`REASON_CODES` / `STOP_POINT_KEYS` / `_KEY_CODE_PAIRS_IN_ORDER` / `NO_STEP_STOP_POINTS`）を同期する

  - [ ] `python3 -m unittest discover -s tests` が通る

  - [ ] `em-workflow/.claude-plugin/plugin.json` と `.claude-plugin/marketplace.json` の version を同じ値で bump する

  ## スコープ外（任意）

  loop-develop 側での終端行の受け取りと Notion ステータス遷移の実装。

  ## 制約・前提（任意）

  - PR #8 がマージされていることが前提

  - prefix・フィールド名・reason code の literal は `batch-terminal-line.md` だけが持つ。ポインタ文書（`batch-mode.md` / `skills/develop/SKILL.md`）に再掲しない — 契約テストがこの単独所有を強制している

  - `em-workflow/scripts/check-plugin-invariants.py` が緑のままであること。新しい識別子は `gate_id` 判定に誤認されない形にする（ドットを含めない）


  '
