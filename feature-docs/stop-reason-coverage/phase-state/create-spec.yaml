    freeform: Codex 相談（run_codex_exec.sh readonly、1 ターン）で catch_all_fallback を推奨。オーケストレーターが選択肢に写像できると判断して採用。
    normalized_answer: 'catch_all_fallback を採用。条件: (1) 新コード・新行キーはドットを含めない（例 unmapped_stop
      / unmapped-terminating-stop）、意味は「原因不明」ではなく「既存行に該当しない終端停止」。(2) 既存行（stop-condition-N
      を含む）と refusal-pattern の gate_fail_closed 行が常に優先し、catch-all は最後の補完。(3) 補完対象はバッチ実行を終了させる停止に限る（待機・正常終了・結果を出さない
      64KiB 例外は含まない）。(4) detail に停止箇所と具体的原因を残し、resume_conditions 必須を維持。(5) 未掲載停止への適用と既存行優先をテストで検証。(6)
      loop-develop 側の新値受理はスコープ外として残件化する。'
