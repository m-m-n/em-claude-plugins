schema_version: 1
feature: cd-prefix-non-directory-dotdot
created: '2026-10-29'
base_branch: main
goal: '# bash_guard.py の cd 前置形の判定で、通常ファイルの後ろに .. が続く Bash が移動できないパスを許可する


  ## やりたいこと

  bash_guard.py の cd 前置形の判定で、通常ファイルや存在しない要素の後ろに `..` が続くパス（例: `.../em-workflow/hooks/bash_guard.py/..`）を、Bash
  が移動できない形として許可から外す。


  ## 背景・なぜ

  `is_below()` は物理パスを `os.path.realpath(path)`（strict=False）で解決するため、通常ファイルの後ろの `..`
  を字句のまま取り除く。論理パスが存在しない形（`/proc/self/root/..` を前に置く形など）では物理パスへのフォールバック分岐で True になる。一方、Bash
  の cd は「Not a directory」で失敗し、`&&` の後ろの承認済みコマンドは実行されない。


  実害はなく、docstring と command-execution-protocol.md の「Bash が物理パスへのフォールバックで着く場所」という記述と判定が食い違うだけ。論理パスが存在する形では、変更前から同じ食い違いがある。


  feature is-below-physical-fallback の review round 1 で comprehensive レビュアーが報告し、evaluator
  が low に下げた指摘。


  ## 受け入れ条件

  - 通常ファイルや存在しない要素の後ろに `..` が続くパスを cd 前置形の許可に含めない

  - その形を silent のケースとして `tests/test_bash_guard_cd_prefix.py` の PATH_CASES に加えたテストがある

  - 既存の cd 前置形のテストがすべて通る


  ## スコープ外

  `/proc/self/cwd` のようなプロセス依存のパスの扱い（別タスク）


  ## 制約・前提

  `os.path.realpath(path, strict=True)` でも途中の通常ファイルを拒否するかは Python の版による。版に依存しない形で確かめる。

  '
