lessons_candidates:
  - >-
    プロトコル文書の 1 箇所を「例外」にする変更は、その義務を宣言している全 SSOT
    （ここでは commit-docs.sh の RECOVERY CONTRACT ヘッダと develop/SKILL.md の
    全称句）を同じ変更で narrow しないとドリフトする。round 1 の medium 2 件は
    まさにこれで、round 2 では逆に「全称 → 閉じた 3 件列挙」に振り切った結果、
    列挙から漏れた呼び出し箇所（I.2.a / I.3）が未定義になった。全称スコープ +
    明示 carve-out 1 件、という形が両方向のドリフトを避ける唯一の書き方に見える。
  - >-
    VERIFICATION.md の diff-scope シナリオを「固定のファイル列挙」で書くと、
    タスクが増えるたびに必ず fail する。implementer が全タスクに対して
    `test-docs/{feature}/{taskNNNN}.tests.yaml` を生成する以上、期待値はタスク単位の
    規則（「登録済みタスク 1 件につきレコード 1 件、それ以外は無し」）で書くべき。
    今回はこれが verify の唯一の失敗要因だった。
  - >-
    batch-policies.yaml の `create-spec.design-step` が指定する option_id
    `decide_autonomously` を、requirements-analyst のパケットが提示していない。
    ポリシー側の option_id とワーカーが実際に発行する option_id の対応が
    どこにも機械検査されていないため、同種の不一致が他ゲートにも潜在しうる。
  - >-
    review の auto-fix は「同一サイトに prose と diff の suggestion が混在すると
    conflict」というシェイプ判定のため、複数観点が同じ欠陥を別形式で指摘するほど
    自動修正されなくなる。今回 round 2 で唯一の高 severity 候補がこれで落ちた。
    観点間の合意が強いほど自動修正が効かなくなるのは直観に反する挙動。
  - >-
    tests.yaml の red_confirmed 欠落は round 1 で指摘 → task0004 が task0001 を修正 →
    同じラウンドで生成された task0003 に同じ欠落が新規混入、という形で再発した。
    サイト単位の修正がレコード形の規律として効いていない兆候。
