  rule.disposition:
    packet_id: create-spec-q0001
    answered_at: "2026-08-15T00:37:52+09:00"
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids: [keep-harmonize]
    freeform: null
    normalized_answer: "Keep the recycled-task-id rule and harmonize it: I.2.b step 3's write-back must key off the step-1 reconciled state (failed) rather than re-reading the journal's last event directly, so the rule reads identically at I.2.a, I.2.b step 1, I.2.b step 3 and I.2.c route-back."
    resolution_note: "batch: gate create-spec.requirement-clarification -> codex_consultation. Codex agreed with the analyst's tentative position; removing the rule would leave the id-reuse misclassification in place, and abolishing id recycling would ripple disproportionately into workflow-patch.md and the planner contract."
  pending.launched.exit:
    packet_id: create-spec-q0001
    answered_at: "2026-08-15T00:37:52+09:00"
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids: [routeback-precondition]
    freeform: null
    normalized_answer: "Prevent the state instead of recovering from it: I.2.c route-back gains a precondition that every task it resets must have a terminal journal last event (merged or failed). A non-terminal last event (launched) makes route-back inapplicable, and that failure is itself a defined terminal outcome (abort with a report for manual handling) rather than an undefined path. Because task-id recycling only ever occurs through route-back plus replace_all renumbering, the 'status: pending + journal launched' pair then cannot arise, satisfying the acceptance criterion's second branch."
    resolution_note: "batch: gate create-spec.requirement-clarification -> codex_consultation. Codex rejected the analyst's tentative 'reconcile-terminal' with a verifiable reason: the orchestrator never writes the journal, so reclassifying a task as failed appends no failed event, and queue_launch_guard.py (journal-only) would still deny the advertised retry. Orchestrator confirmed that against em-workflow/references/implement-phase.md's journal-writer list and queue_launch_guard.py."
  rule.scope:
    packet_id: create-spec-q0001
    answered_at: "2026-08-15T00:37:52+09:00"
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids: [orchestrator-only]
    freeform: null
    normalized_answer: "State explicitly that the recycled-task-id rule governs only the orchestrator's interpretation of the journal. The journal-reading hooks (queue_launch_guard.py, queue_stop_guard.py, queue_failure_net.py, queue_taskstop_net.py) continue to judge by journal last event alone and never read workflow.yaml."
    resolution_note: "batch: gate create-spec.requirement-clarification -> codex_consultation. Matches the current implementation and keeps the hooks' fail-open, journal-only contract; letting the launch guard trust a possibly-stale workflow.yaml status could permit a duplicate launch."
