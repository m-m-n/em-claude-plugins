lessons_candidates:
  - id: L1
    note: >-
      SPEC の AC が version 番号のような可変リテラルを byte-exact に固定すると、
      feature の implement 完了から merge までの間に main 側が同じ番号へ到達したとき、
      AC を満たしたまま運用ルール（同一変更内での bump）を破る状態が作れてしまう。
      本 feature では review round 2 で「固定リテラル assert は次の bump で赤くなる」
      （960a61c72544179f）としてテスト側は baseline 相対に直したが、SPEC 側のリテラルは
      残っていた。verify で main と突き合わせて 0.1.38 へ繰り上げた（REQUIREMENTS.md A6-1）。
  - id: L2
    note: >-
      review の completion gate と rework 経路の優先順位が実行時に取り違えられた。
      `batch.review_rework_count` が cap 1 に達していれば review-phase.md Phase R5 の
      at-cap defer が適用されるが、前回 run は rework-planner を再 dispatch し、
      spec-change ゲートで無人実行を停止させた。R5 の at-cap 分岐は rework 経路より
      先に評価されることを protocol 側でより明示できる余地がある。
  - id: L3
    note: >-
      auto-fix loop が「SPEC が byte-exact に固定した document contract」に阻まれて
      2 回連続 abort した（29b99dea6a37377d / c431ec8ba89742db）。document-contract
      テストは回帰防止に効く一方、同じ feature 内での修正余地を消すため、
      新規 wording の matcher をどこまで厳密に固定するかは設計判断として記録に値する。
