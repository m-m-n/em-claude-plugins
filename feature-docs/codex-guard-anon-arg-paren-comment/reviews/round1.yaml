  file: em-workflow/scripts/codex-hook-interactive-guard.py
  line: 814
  title: "TM-1: 救済した区切りの後の `}` が外側の波括弧群を閉じず、波括弧群で包むと救済が効かない"
  description: "`{ function { :; } foo(a; python3 -i; }` では、`foo(` の仮の群が一番内側の群のまま末尾の `}` を読む。`_finish_word`（588行）は `frames[-1].kind == \"{\"` のときだけ `}` を閉じ括弧として扱うので、この `}` は仮の群の中の普通の語として読まれる。入力が終わると `_rescue_argument_groups`（813〜822行）は仮の群を frames から外すだけで `}` を外側の群で読み直さないため、外側の `{` が残り `_Undecidable(\"group\")` になり、何も出力されずに `python3 -i` が通る。匿名関数の本体（`function { function { :; } foo(a; python3 -i; }`）でも同じ。変更前も判定不能だったので後退ではないが、`{ ...; }` で包むだけで TM-1 の対策を回避できる。FR5 が出力なしとするのは本当に閉じていない群だけで、この `{` 群は zsh では閉じている。TS14（関数定義の本体の中での救済）が silent になるのも skipped の規則ではなく同じ原因による。em-review のコピーも同一。"
  suggestion: "救済した区切りの後に、コマンド位置で単独の語として読んだ `}` が、仮の群を囲む `{` 群（匿名関数の本体と関数定義の本体を含む）を閉じるように両コピーを同じ変更で直す。NFR1（線形時間、再帰なし）は保つ。`{ function { :; } foo(a; python3 -i; }` と `function { function { :; } foo(a; python3 -i; }` が deny になるケースと、関数定義の本体の中で救済した形が skipped で silent になるケースを CASES に足す。"
  reproduction: "1. {\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"zsh -c 'setopt nobadpattern; { function { :; } foo(a; python3 -i; }'\"}} を python3 -B em-workflow/scripts/codex-hook-interactive-guard.py の標準入力へ渡す。\n2. main → find_deny → 内側の文字列の解析 → _rescue_argument_groups を経て、拒否JSONではなく標準出力が空、終了コード0になる。em-review側も同じ結果になる。\n3. 対話起動を実行せず到達を確認するには、zsh -f -c 'setopt nobadpattern; { function { :; } foo(a; printf REACHED; }' を実行する。REACHEDが出力され、終了コード0になる。"
  reproduction_alternates: []
  reproduction_overflow: false
