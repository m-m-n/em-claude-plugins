    ; / & の後に限り、本物の未閉鎖群の silent と入力接続・関数定義の除外は維持する。
  resolution_note: 'gate create-spec.requirement-clarification（batch policy codex_consultation、orchestrator
    が analyst の仮定「; の形のみ」を検証するために開いた）。選択肢: (a) ; のみ / (b) ; & 改行を対象。Codex 1 ターン（codex
