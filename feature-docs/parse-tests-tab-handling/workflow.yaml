schema_version: 1
feature: parse-tests-tab-handling
created: '2026-10-10'
base_branch: main
goal: |+
  # tests_yaml_id_resolution の parse_tests でタブを含む行の扱いが FR2 から外れる 2 件（先頭項目のタブで後続 ID が落ちる・タブ付き継続行の断片が残る）

  Notion task: https://www.notion.so/3f43509ec8ee81caa588e8eb87cc2d45

  ## 現象 (必須)
  feature `tests-yaml-id-resolution-gaps` のレビュー round 1 で、記録検査 `tests/test_tests_yaml_id_resolution.py` の `_RecordParser.parse_tests` に medium 2 件が残った（critical/high ではないため自動修正の対象外）。どちらもタブを含む行の扱いの順序の問題で、SPEC FR2 から外れる。
  - tests の先頭項目にタブがあると、後続の読める ID が 1 件も解決判定されない（`tests/test_tests_yaml_id_resolution.py:539`）。先頭行のタブを報告した直後に `[]` を返し、呼び出し元が後続のダッシュ項目をフィールドのインデント不一致として読み飛ばす。2 項目目以降のタブ行は報告したうえで読み続けるので、先頭項目だけ扱いが食い違う
  - スペースの後にタブが続く深い継続行では、複数行の値の 1 行目の断片が取り除かれない（`tests/test_tests_yaml_id_resolution.py:563`）。タブの判定が深い行の判定より先にあるため、`last_is_id` のときの `ids.pop()` が走らず、断片が解決判定される
  どちらも記録自体は抽出エラーで失敗するので見逃しにはならない。
  ## 再現手順 (必須)
  1. `extract_text` に、`acceptance_tests:` / `  AC-1:` / `    tests:` / `      <タブ>- tests.nope.bad` / `      - tests.nope.good` を渡すと、`AC-1` の ID が空になる
  2. `extract_text` に、`acceptance_tests:` / `  AC-1:` / `    tests:` / `      - tests.nope.fragment` / `        <タブ>continued` / `      - tests.nope.control` を渡すと、`tests.nope.fragment` が解決対象に残る
  ## 期待する挙動 (必須)
  - 先頭項目のタブを報告した後もリストの解析を続け、後続の 1 行で完結した ID を解決判定する
  - タブを含む深い継続行でも、直前の項目の断片を解決対象から外す
  ## 完了の定義 (必須)
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある
  ## 該当箇所 (任意)
  - `tests/test_tests_yaml_id_resolution.py`（539, 563 行付近、`_RecordParser.parse_tests`）
  - レビュー記録: `feature-docs/tests-yaml-id-resolution-gaps/reviews/round1.yaml`（stable_id 94f2ccd5e6f0db92 / 49d22a1031b45fcb、integration ブランチ `em-workflow/tests-yaml-id-resolution-gaps/integration`）
  ## 実害・発生条件 (任意)
  タブを含む誤った記録を書いたときだけ起きる。抽出エラーと解決エラーを 1 回の失敗メッセージに並べるという FR2 の目的が、この 2 経路では果たせない。

