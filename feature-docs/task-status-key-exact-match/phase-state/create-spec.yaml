      has lower regression risk for no-space values, and that the change is not always
      toward allowing exit (status:failed then status: pending now blocks), so both
      directions should be pinned by tests. Orchestrator adopted strict_yaml_separator
      plus the two direction tests. Opus escalation: not run.'
