      options: strict_yaml_separator / keep_nospace_value / other; codex_consulted:
      true (harness entry: codex, 1 turn). Codex chose strict_yaml_separator: matches
      YAML block-mapping semantics and the file''s own _find_key_colon rule; bare status:
