    normalized_answer: 'Adopt A-1: a direct-child line is a status key line only
      when status: is followed by space, tab, or end of line (^\s+status:(?=[ \t]|$),
      same rule as _find_key_colon). status:pending (no space) is not a key line.
      Add test scenarios fixing both fail directions: status:pending alone -> task
      omitted; status:failed (no space) then status: pending -> pending.'
