schema_version: 1
feature: worker-self-write-digest
created: '2026-10-24'
base_branch: main
goal: '# worker が読み書き両方する target（tokens.yaml、planner の既存成果物）で、R1 の返却後 input_digest
  再計算が worker 自身の正当な更新を stale と誤判定しうる


  Notion: <notion-url>


  ## 現象 (必須)


  `em-workflow/references/contracts/worker-envelope.md` の Rule R1 は、worker が戻った後に同じ入力から
  `input_digest` を計算し直し、dispatch 時の値と食い違えば stale として扱う。


  designer の `design-system/tokens.yaml`（`extend_only`）や、implementation-planner /
  rework-planner が更新する既存成果物（IMPLEMENTATION.md、VERIFICATION.md、TASK.md 等）は、`digest_inputs`
  と `write_policy.targets` の両方に入る。このため worker 自身が許された範囲で書いただけで `input_digest` が変わり、外部の変更と区別できない。


  ## 再現手順 (必須)


  1. 既存の `design-system/tokens.yaml` がある feature で、designer を `extend_only` 付きで dispatch
  する

  2. designer が tokens.yaml にキーを追加して戻る

  3. オーケストレーターが R1 に従って `input_digest` を計算し直すと、dispatch 時の値と食い違う


  ## 期待する挙動 (必須)


  worker 自身が `write_policy` の範囲で書いた target を、戻った後の stale 判定から区別できるようにする。


  ## 完了の定義 (必須)


  - [ ] 再現手順で現象が起きない

  - [ ] 再発を検出するテストがある


  ## 該当箇所 (任意)


  - `em-workflow/references/contracts/worker-envelope.md`（Rule R1 の Recomputation
  and comparison timing）

  - `em-workflow/references/contracts/designer-contract.md`

  - `em-workflow/references/contracts/planner-contract.md`

  - `em-workflow/references/contracts/rework-planner-contract.md`


  ## 実害・発生条件 (任意)


  feature worker-digest-ownership の create-spec で Codex に相談した中で見つかった。その feature ではスコープ外とした。読み込み対象と書き込み対象を兼ねる成果物を持つ
  dispatch でだけ起きる。

  '
