    description: "workflow-schema.md の 441〜443 行は「an absent or stale index ... makes the Orchestrator-side lookup unresolvable」と書いてる。でも implement-phase.md の Orchestrator-side read（1155〜1161 行付近）が解決不能と定義しているのは「そのタスクの項目がない」場合だけだよ。読み取りでは最も新しく追記された項目を選んで、その最初の候補を停止ツールに渡す。再試行のときに索引への記録が失敗して前回起動の項目だけが残ると、その古い項目は解決不能にならずに候補へ解決されるよ。そのあと停止ツールが何も止めなければ第3のケースとして同じ Residual に入るし、孤立タスク復旧は `no-agent-entry` ではなく D7 の起動ひも付け判定で止まる。最終的な結果はほぼ同じ Residual だけど、そこまでの経路の説明が引用元と食い違ってるよ。なお、この文言は SPEC FR3 の本文そのままだから、実装は SPEC には従ってるよ"
    suggestion: "「解決できなくなる」という主張は、索引がない場合（タスクの項目がない場合）だけに絞ってね。古い項目については、前回起動の候補に解決され、停止ツールが何も止めなければ第3のケースとして同じ Residual に進む、と implement-phase.md を引用して分けて書いてね。テストで固定されている文言は残し、`stale-agent-entry` は書かないでね。SPEC FR3 本文の「absent or stale」から外れることは、人に知らせてね"
