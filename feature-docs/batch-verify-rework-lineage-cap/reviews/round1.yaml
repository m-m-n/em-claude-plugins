findings:
  - stable_id: "1975bf8649e26ca4"
    severity: medium
    category: comprehensive
    file: em-workflow/skills/develop/SKILL.md
    line: 511
    title: "hard cap の `rounds` が「rework を実行したラウンド数」と説明されているが、更新規則は cap 判定より前に加算する"
    description: |
      SKILL.md 511-512 は `batch.verify_rework.rounds` を「rework を実行したラウンド数」と定義し、
      515-518 の更新規則は「verify ラウンドが `failed_items` を確定させたら…続けて `rounds` を 1 増やす。
      この更新は rework を回すかどうかの判定より先に行う」と定めている。両者は同一段落内で矛盾する:
      更新規則に従うと `rounds` は「verify が失敗を確定させたラウンド数」であり、cap 到達ラウンド
      （rework を実行しないラウンド）でも加算される。結果として hard cap「値 3」で実際に回る rework は
      2 回であり、括弧書きのラベル通り「rework 実行時のみ加算」と読んだ実装者/エージェントは 3 回回す
      （失敗ラウンド 4 回）。off-by-one が生じる。加えて「値」の意味が 2 つの cap で不揃いになる:
      系譜 cap は「値 1」で rework 1 回許容（閾値は出現回数 2）、hard cap は「値 3」で rework 2 回許容
      （閾値は rounds 3）。SPEC FR2 / Data Flow は『verify ラウンド → rounds を更新』側を採っているため、
      誤っているのは括弧書きのラベル。tests/test_verify_rework_lineage_cap.py の
      `_states_hard_cap_independent_rule` は「hard cap」「rounds」「値 3」「独立」の存在しか見ないため、
      このラベルの誤りを検出しない。
    suggestion: |
      511-512 の括弧書きを更新規則に合わせる（例: 「rework を実行したラウンド数」→
      「verify が `failed_items` を確定させたラウンド数」）。数え方を変えたい場合は代わりに `rounds` の
      加算を cap 判定の後ろへ動かすが、その場合 hard cap の閾値意味が変わるため SPEC FR2 との整合を
      取り直すこと。
    sources: ["litellm:vertex-glm-5.2:comprehensive"]
