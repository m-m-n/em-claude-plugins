goal: "# destructive-guard: heredoc 本文中の git の reset --hard を実行と誤認して deny する\n\n種別: バグ / 優先度: 中\n\n## 事象\n\nem-workflow/hooks/destructive-guard.py が、ヒアドキュメント本文に含まれるだけの git の reset --hard という文字列を実際の実行と誤認して deny を返す。\nレビュー記録（YAML）をヒアドキュメントで書き出すコマンドで、本文の引用として当該文字列を含んでいただけで deny された。\n\n## 再現\n\n次の形のコマンドで発火する（実際に git は実行されない）。\n\n    cat > /tmp/example.yaml <<'YAML'\n    description: |\n      実測: `rm -rf tmp/$X` は main deny → 本ブランチ ask、\n      `rm -rf tmp/$X; git reset --hard HEAD~1` も main deny → ask。\n    YAML\n\n結果: [destructive-guard/git-reset-hard] の deny。\n\n## 期待する挙動\n\nヒアドキュメントの本文はコマンドとして解釈しない。.claude/rules/hook-tests.md に「ヒアドキュメントの本文を 1 行ずつコマンドとして読む」誤爆は allow ケースとして残してあると書かれており、rm -rf 等については既に対処済みに見える。git-reset-hard の判定がその扱いから漏れている。\n\n## 影響\n\n誤爆は無人実行をその場で止める。ask は claude-batch 下で deny に降格されるため、誰も答えられないまま走行が終わる。\n\n## 該当箇所（推定）\n\nem-workflow/hooks/destructive-guard.py のヒアドキュメント処理と git reset --hard 判定の適用順序。rm -rf 側と同じ除外が効いていない。\n\n## 完了の定義\n\n- 上記の再現コマンドが allow になる\n- em-workflow/hooks/tests/destructive-guard-cases.json\
  \ に allow ケースを追加\n- 本物の git reset --hard 実行が deny のまま維持されている\n- python3 em-workflow/hooks/tests/run-destructive-guard.py が全件通る\n\n## 追加指示\n\n- 実装完了後、integration ブランチを remote に push し、gh pr create で base_branch への PR を作成する。integration ブランチはローカル・remote 双方に残す（base_branch へ自動マージしない）。\n- 不明点は Codex に相談し、比較的良いと判断した選択肢を採用する。\n- その議論内容を Notion に記録する。\n"
