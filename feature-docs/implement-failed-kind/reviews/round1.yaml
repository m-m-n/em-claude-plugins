    title: "自動再開の書き込みセットが implement を pending に戻すのに pending タスクを登録せず、implement フェーズの I.0 前提条件に抵触する"
    description: |
      手順 6 の書き込みセットは `implement.status` を `pending`、`failed_kind` を null、カウンタを +1
      するだけで、`tasks.{T}.status` には触れない。一方 `references/implement-phase.md` Step I.0 の 5 番は
      「fresh first pass でない `implement: pending` 突入で `status == pending` のタスクが 1 つも無い状態は
      protocol error → 即 ABORT」と定めており、`references/rework-task-synthesis.md` Section 11 Invariant 1
      も「implement が pending に戻る前に pending タスクが少なくとも 1 つ登録されている」と無条件に述べている。
      自動再開の直前状態は interactive の abort phase 終端で、その経路は「no task status or notes write set」
      と明記されているため、失敗タスクは `failed`、他は `merged` のまま。全タスクが launch 済みで 1 つだけ
      失敗した典型ケースでは `pending` タスクがゼロになり、再開した implement フェーズは I.0 の 5 番で
      そのまま abort する。abort は status を書かないので `implement` は `pending` のまま残り、次の Step B
      反復でまた同じ abort を繰り返し、最終的に停止条件 2（`step_stuck`）で止まる。しかもカウンタは
      フェーズ実行の前にコミット済みなので、再開ラウンドだけが消費される。
    suggestion: |
      (a) `references/implement-phase.md` Step I.0 の 5 番に第 3 の突入経路（develop の infra 自動再開）を
      明示的に切り出し、「reconciled state が `failed` のタスクが存在する場合はこの前提条件を満たす
      （I.2.c が処理する）」と書き足す。あわせて rework-task-synthesis.md Invariant 1 の適用範囲を
      rework 由来の遷移に限定する旨を明記する。(b) 自動再開の書き込みセットに `tasks.{T}.status` の
      リセットを加える。ただし (b) は I.2.a の recycled-task-id carve-out に引っかかり、I.2.c を経ずに
      タスクが自動再起動されて FR1「no automatic retry」を破るため、採るなら I.2.a 側の除外も同時に
      定義する必要がある。整合コストの小さい (a) を推奨。
    sources: [claude:comprehensive]
    confidence: 60
