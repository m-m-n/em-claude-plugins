findings:
- stable_id: 9af0ee2d7bcddc4c
  severity: medium
  category: comprehensive
  file: em-workflow/references/implement-phase.md
  line: 190
  title: Step I.1's conditional failed_kind clear is unreachable on all three documented entry routes,
    and I.2.c's route-back clause asserts a Step I.1 write that never happened
  description: 'Verified against the files. workflow-schema.md:315-319 states failed_kind ''is returned
    to null by the same write set that moves the `implement` step off `failed`''. The only write set that
    actually moves implement off `failed` is SKILL.md''s batch auto-resume step 6 (implement->pending,
    failed_kind->null, one commit, before the phase runs). implement-phase.md:187-192 nonetheless calls
    its own phase-start write ''the write set that carries the field''s lifecycle clear on an entry from
    `failed`'', gated on ''when this phase is entered with `implement`''s prior status `failed`''. Step
    I.0 (implement-phase.md:128-147) enumerates exactly three entry routes and all three deliver `implement:
    pending` (Step I.1 itself names a fourth prior status, `in_progress`, for a resume). No documented
    route reaches Step I.1 with prior status `failed`, so the conditional is unreachable and the naming
    sentence attaches lifecycle ownership to a write that never performs the clear. This compounds at
    implement-phase.md:757-765, where the route-back write set describes its own clear as ''re-asserting
    the null value Step I.1''s phase-start write already set on this entry'' - in the rework flow that
    reaches I.2.c, implement was `in_progress`, the I.1 conditional did not fire, and I.1 wrote no failed_kind
    value at all, so the re-assertion claim is false as written. Note on impact: the escalation path suggested
    by the reporting run (a maintainer deleting SKILL.md step 6''s clear, causing the auto-resume branch
    to re-fire) does not hold - that branch is gated on `status: failed` and the resume write sets `pending`,
    so a stale `infra` would linger against the schema''s ''held for exactly as long as that `failed`
    status'' rule without any reader consuming it. The defect is a false normative statement in the SSOT-consumer
    chain, not a runtime break. Four tests pin the current wording literally (test_step_i1_names_the_write_set_carrying_the_lifecycle_clear,
    test_route_back_states_its_own_accurate_role, test_exactly_one_place_names_the_write_set_carrying_the_clear
    in tests/test_failed_kind_resume_reentry.py:369-394, and test_first_failed_kind_occurrence_is_the_phase_start_write
    in tests/test_failed_kind_write_paths.py), so any correction must move doc and tests together.'
  suggestion: Name SKILL.md step 6's auto-resume write set as the write set that carries the lifecycle
    clear, and demote Step I.1's conditional to an explicitly-labelled safety net that no documented entry
    route reaches. At implement-phase.md:757-765, replace 'the null value Step I.1's phase-start write
    already set on this entry' with an accurate statement (the field is already null on this route because
    the route-back is reached with implement `in_progress`, never `failed`), or drop the redundant clear.
    Update the four pinning tests in the same change; all 3663 tests currently pass, so the literals are
    load-bearing.
  sources:
