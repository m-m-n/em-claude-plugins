schema_version: 1
feature: implement-failed-kind
created: 2026-09-06
base_branch: main
goal: |
  em-workflow: implement の failed に理由分類を持たせ、インフラ起因なら停止条件 3 を発火させず続行する

  ## やりたいこと（必須）
  workflow.yaml の implement step の `failed` に理由の分類を持たせ、インフラ起因（implementer の孤児化など）の `failed` は develop の Step B で停止条件 3 を発火させず、implement を `pending` に戻して続行できるようにする。設計判断が必要な `failed` だけを従来どおり人に回す。

  ## 背景・なぜ（必須）
  2026-09-05 08:06 JST の run は、workflow.yaml の implement が `failed` だったため Step B の停止条件 3（ユーザー介入が必要）で即停止した。
  - この `failed` の理由は「implementer がディスパッチャ再起動で消えた」であり、人の判断は不要だった
  - task0001 の worktree には未コミット差分が残っていて、I.2.a の resume guard で続行できる状態だった
  - 停止条件 3 は `failed` / `needs_update` を一律にユーザー介入と扱うため、人が workflow.yaml を `pending` に戻すまで、何回 dispatch しても 1〜2 分で同じ報告を繰り返す

  ## 受け入れ条件 / 完了の定義（必須）
  - [ ] `references/workflow-schema.md` の implement step に `failed_kind: infra | decision` を追加する。`infra` は外部要因（孤児化、harness 障害）、`decision` は実装内容の失敗や計画の見直しが必要なもの
  - [ ] implement を `failed` に書く各箇所（I.2.c の abort、batch の 2 回目 failed、gate-rejected terminal）で `failed_kind` を必ず書く。孤児化由来は `infra`、それ以外は `decision`
  - [ ] Step B の停止条件 3 は `failed_kind: decision` のときだけ発火する。`infra` のときは implement を `pending` に戻し、その write をコミットしてからフェーズを実行する
  - [ ] `infra` 起因の自動続行に回数上限を設け、上限到達時は `decision` 扱いで停止する。上限値と回数は workflow.yaml の `batch` セクションに記録する
  - [ ] `references/batch-terminal-line.md` の `step_needs_intervention` の説明と、`skills/develop/SKILL.md` の停止条件 3、`references/batch-mode.md` を更新する
  - [ ] 検証: `failed_kind: infra` の workflow.yaml から `--batch --once` を起動し、停止せず implement が続行することを確認する。`failed_kind: decision` では従来どおり停止することを確認する

  ## スコープ外（任意）
  - 孤児 launched の検出と journal への `failed` 記録（別タスク「孤児 implementer の自動復旧」で扱う）
  - review / verify の `failed` への分類の適用

  ## 制約・前提（任意）
  - 別タスク「孤児 implementer の自動復旧」が journal に `failed`（reason: `orphaned`）を書く経路を前提にする。着手順はそちらが先
  - `failed_kind` が無い既存の workflow.yaml は `decision` として扱い、後方互換を保つ
parent_branch: em-workflow/implement-failed-kind/integration

