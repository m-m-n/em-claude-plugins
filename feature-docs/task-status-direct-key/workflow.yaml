schema_version: 1
feature: task-status-direct-key
created: 2026-10-07
base_branch: main
goal: |
  # queue_stop_guard の status 読み取りが notes の複数行文字列内の status 行を誤読しうる

  Notion: https://www.notion.so/3f23509ec8ee81b9b526c2cb4717303c

  ## 現象 (必須)
  `em-workflow/hooks/queue_stop_guard.py` の `task_statuses_from_workflow` は、`iter_task_block_lines` が返すタスクブロック内の行から `TASK_STATUS_RE`（`^\s+status:`）に合う行を読む。route-back 記録の読み取りと同じ構造のため、`notes: |` のブロックスカラー本文にある `status: pending` 行を、直下の `status:` キーが無いとき、または notes より後ろにあるときに読みうる。
  `tasks.{T}.notes` は実装者の報告から書かれる欄で、信頼できない文字列が入る。
  ## 再現手順 (必須)
  1. workflow.yaml のタスクブロックで、`notes: |` の本文に `status: pending` を含め、直下の `status:` キーを notes より後ろに置く（または置かない）
  2. `task_statuses_from_workflow` を呼ぶ
  3. notes 本文の値が status として返る
  ## 期待する挙動 (必須)
  status は `tasks.{T}` 直下のキーだけから読み、ブロックスカラーの本文や入れ子のマッピングの行は読まない。
  ## 完了の定義 (必須)
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある
  ## 該当箇所 (任意)
  - `em-workflow/hooks/queue_stop_guard.py` の `task_statuses_from_workflow` / `TASK_STATUS_RE`
  ## 実害・発生条件 (任意)
  出典: feature `routeback-record-direct-key`（Notion タスク https://www.notion.so/3f03509ec8ee818ab58aebe52dbf47b4 ）の要件調査で検出し、範囲外とした（仮定 A2）。コードを読んだ範囲での指摘で、実行による再現は未確認。
