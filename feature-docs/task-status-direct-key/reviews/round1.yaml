    line: 80
    title: "TASK_STATUS_KEY_RE がコロンを含む別キー（status:detail など）を直下の status キーと誤認する"
    description: "新設の TASK_STATUS_KEY_RE = r\"^\\s+status:\" は、コロンの直後に空白や行末を求めていない。そのため直下インデントの `status:detail: ignored`（YAML では `status:detail` という別キー）に一致し、task_statuses_from_workflow がそのタスクを decided に入れる。TASK_STATUS_RE はこの行から値を取り出せないので、タスクは結果から外れ、後ろにある本来の直下キー `status: pending` は読まれない。評価側の再現で、この変更後は {}、main のフックでは {'task0001': 'pending'} を返した。この差分で入った後退。route-back の記録と journal の failed 行が一致している再起動対象のタスクが failed と分類され、Stop フックは BLOCK せずに終了を許す。FR1 の「直下インデントにある最初の `status:` キー」と合わない。起きる可能性は低い（オーケストレーターが書くタスクキーにこの形は無く、notes の本文は直下より深いインデントにある。外れる方向は fail-open 側）。"
    suggestion: "キーの一致にコロン直後の空白か行末を求める（例: re.compile(r\"^\\s+status:(?:\\s|$)\")）。裸の `    status:` が決定行になる既存挙動は保つ。直下に `status:detail: ignored`、その後ろに `status: pending` があるとき pending を返す回帰テストを足す。"
    sources: [codex:comprehensive]
    confidence: 85
    resolution: unresolved
    resolution_reason: "medium のため auto-fix 対象外（R4 の候補条件は critical/high）"
