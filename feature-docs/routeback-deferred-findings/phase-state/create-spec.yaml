    - widen-proof-chain
    freeform: null
    normalized_answer: 成果物欠損の stale launched も Agent index 照会→stop→既存の orphan/same-session 証明チェーンに通し、証明できたら既存ヘルパーが既存
      reason で journal に failed を追記。task-artifacts-missing は打ち切り理由でなく証拠の一つ。証明不能なら Residual
    resolution_note: 'gate: create-spec.requirement-clarification (policy action codex_consultation, record_as_assumption);
      codex_consulted: true (1 turn, harness codex); opus_escalation: false; chosen: widen-proof-chain;
      not chosen: reconciled-state-only, dedicated-missing-artifacts-proof; Codex suggestion mapped onto
      option widen-proof-chain (matches worker tentative); codex reason: Agent index は task ID で引けるため
      worktree 不要（recover-orphaned-task.py:372）。reconciled-state-only は journal が launched のまま launch
      guard に拒否される（queue_launch_guard.py:224）。dedicated は終了証拠要件を弱める（implement-phase.md:637）。欠損自体を停止証明に使わず、未完了呼び出し除外・終了証拠・停止対象一致・追記時の識別情報再確認は維持。recover-orphaned-task.py:650
      の即時終了とテスト（test_stale_launched_recovery_chain.py:306,514）の更新が必要'
  requirement.ancestor-unverified-merged.exit:
