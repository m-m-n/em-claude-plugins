    freeform: null
    normalized_answer: ancestor 検証失敗時に orchestrator が journal-append-failed.py を追加 reason merge-unverified
      で呼び、ヘルパーはロック内で最終イベントが merged のときだけ failed を追記。第3 conjunct と launch guard は不変。I.2.c の行き止まり段落と例外文を削除し、Status
      semantics は無条件のまま、writer-set 段落に reason 値を追記
    resolution_note: 'gate: create-spec.requirement-clarification (policy action codex_consultation, record_as_assumption);
      codex_consulted: true (1 turn, harness codex); opus_escalation: false; chosen: helper-merge-unverified;
      not chosen: ssot-carve-out; Codex suggestion mapped onto option helper-merge-unverified (matches
      worker tentative); codex reason: ssot-carve-out は行き止まりが残り完了条件を満たさない（implement-phase.md:918）。排他区間で
      merge-unverified と最終イベント merged の組合せだけ許可し launched には追記しない。merged はエージェント終了証明ではないので元実行の終了確認と待機規則を維持（merge-task.sh:156,
      implement-phase.md:841）。既存 reason で merged を変えないテスト（test_journal_append_failed.py:185）は残し、行き止まり文言のテスト（test_implement_routeback_gate.py:1749）を更新。abort
