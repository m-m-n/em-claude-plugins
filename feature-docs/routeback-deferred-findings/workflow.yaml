schema_version: 1
feature: routeback-deferred-findings
created: '2026-09-26'
base_branch: main
goal: |
  # em-workflow: routeback-admissibility-exits の review round 3 deferred findings 6 件

  ## 現象（必須）
  feature `routeback-admissibility-exits`（PR [https://github.com/m-m-n/em-claude-plugins/pull/20](https://github.com/m-m-n/em-claude-plugins/pull/20)）の review round 3 で、batch の rework cap（`batch.review_rework_count` = 1）に達したため `deferred` のまま完了させた findings が 6 件残っている。critical 1 件 / high 3 件 / medium 2 件で、すべて `em-workflow/references/implement-phase.md` の I.2.b / I.2.c 周辺。
  | stable_id | severity | 観点 | 指摘 |
  | --- | --- | --- | --- |
  | `12839a507a7df994` | critical | spec | FR3/AC-2 が名指しする stale `launched` 状態に abort 以外の復旧路が無い |
  | `2da3c75adac32650` | high | spec | ancestor 検証失敗 `merged` タスクが自認の行き止まりになり Objectives 第 1 項に反する |
  | `bc57aa350bb027c7` | high | spec | 候補集合を前セッション由来の `launched` に限定したため、同一セッション内 stale `launched` に復旧が届かない |
  | `59e58726b1b22211` | high | architecture | Failed-task resolution invariant violated for ancestor-check-failure state |
  | `94de80a315821a55` | medium | architecture | `agents.jsonl` の読み手集合と欠損時の影響が SSOT（`workflow-schema.md`）とドリフトしている |
  | `9cc0ce6b64087d2f` | medium | architecture | status semantics 不変条件を破る状態を SSOT 未更新のまま consumer 側で宣言している |
  `59e58726b1b22211` / `94de80a315821a55` / `9cc0ce6b64087d2f` は修正の本体が `em-workflow/references/workflow-schema.md` への編集を要し、review-editor の single-file スコープ外のため auto-fix loop が abort している。
  ## 再現手順（必須）
  1. `em-workflow/routeback-admissibility-exits/integration` ブランチをチェックアウトする
  2. `feature-docs/routeback-admissibility-exits/reviews/round3.yaml` の `resolution: deferred` の項目を読む
  3. 各 finding が指す `em-workflow/references/implement-phase.md` の該当行を確認する
  ## 期待する挙動（必須）
  deferred の 6 件がいずれも解消され、`implement-phase.md` と `workflow-schema.md` の間に status semantics / `agents.jsonl` 読み手集合のドリフトが無い状態になる。
  ## 完了の定義（必須）
  - [ ] critical / high の 4 件が解消されている
  - [ ] medium の 2 件について、SSOT（`workflow-schema.md`）側を更新するか、指摘を明示的に却下した根拠が残っている
  - [ ] `python3 -m unittest discover -s tests` が通る
  - [ ] プラグイン配下を変更するので、同じ変更に含めて `em-workflow/.claude-plugin/plugin.json` と `.claude-plugin/marketplace.json` の version を bump する
  ## 該当箇所（任意）
  - `em-workflow/references/implement-phase.md` 388 / 426 / 633 / 639 / 641 / 816
  - `em-workflow/references/workflow-schema.md`
  - 記録: `feature-docs/routeback-admissibility-exits/reviews/round3.yaml`
  ## 実害・発生条件（任意）
  stale `launched` を持つプランで route-back を選べず abort しか残らない経路と、ancestor 検証に落ちた `merged` タスクが行き止まりになる経路が protocol 上に残る。無人実行が中断したあとの再開でだけ露出するため、対話実行では気づきにくい。

