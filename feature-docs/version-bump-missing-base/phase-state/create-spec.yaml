  requirement.base-fallback:
    packet_id: create-spec-q0001
    answered_at: '2026-11-22T19:07:42+09:00'
    source: batch-codex-consultation
    answer_mode: select_or_freeform
    selected_option_ids:
    - fetch_then_first_parent
    freeform: null
    normalized_answer: 'before が 40 桁 hex かつ全ゼロでなく clone に無ければ git fetch origin <before> を 1 回試す。取れたら before..AFTER を比較する。取れない・全ゼロのときは AFTER の第 1 親を基点にし、その旨を ::warning:: で出して続行する。第 1 親も無ければファイルを変えずに非 0 で終了する。skip で exit 0 にする分岐は残さない'
    resolution_note: 'gate: create-spec.requirement-clarification; codex_consulted: true (1 turn); Codex suggested fail_only (fetch by SHA, else non-zero exit). Orchestrator chose fetch_then_first_parent and adopted Codex''s fetch-by-SHA refinement, because the task''s expected behavior requires bumping even when the base cannot be obtained, which fail_only does not satisfy. Not chosen: first_parent_only, last_bump_commit, fail_only. opus_escalation: not run'
  requirement.version-regression:
    packet_id: create-spec-q0001
    answered_at: '2026-11-22T19:07:42+09:00'
    source: batch-codex-consultation
    answer_mode: select_or_freeform
    selected_option_ids:
    - bump_from_max
    freeform: null
    normalized_answer: 基点と AFTER の version を整数 3 要素で比べる。AFTER が基点と同じか低いときは大きい方の patch を 1 上げ、plugin.json と marketplace.json に同じ値を書く。AFTER が高いとき（手で上げた）は上げない
    resolution_note: 'gate: create-spec.requirement-clarification; codex_consulted: true; Codex suggested bump_from_max with integer-triple comparison; mapped. Not chosen: keep_skip, fail_job. opus_escalation: not run'
  requirement.force-push-prevention:
    packet_id: create-spec-q0001
    answered_at: '2026-11-22T19:07:42+09:00'
    source: batch-codex-consultation
    answer_mode: select_or_freeform
    selected_option_ids:
    - github_ruleset
    freeform: null
    normalized_answer: main への non-fast-forward 更新を、bypass を持たない別のルールセットで禁止する。ルールセットの定義はリポジトリ内のファイルとして置き、テストで中身を確かめる。GitHub への適用（gh api での作成）と適用後の確認は PR マージ後に人が行う手順として文書に書く。既存の main ルールセットは変えない
    resolution_note: 'gate: create-spec.requirement-clarification; codex_consulted: true; Codex suggested a separate ruleset with only non_fast_forward and no bypass actors, leaving the existing ruleset untouched; mapped. Orchestrator limited the run to committing the definition and the apply procedure, because changing GitHub repository settings is an outward-facing action not authorized for this unattended run. Fact: the existing ruleset already has non_fast_forward but grants admin bypass ''always'', and git confirms the 13:45:36 push was non-fast-forward. Not chosen: github_ruleset_and_tool_fix, fix_pushing_tool, local_pre_push_hook. opus_escalation: not run'
  requirement.remediation-bump:
    packet_id: create-spec-q0001
    answered_at: '2026-11-22T19:07:42+09:00'
    source: batch-codex-consultation
    answer_mode: select_or_freeform
    selected_option_ids:
    - workflow_dispatch_input
    freeform: null
    normalized_answer: workflow に workflow_dispatch を足す。入力は plugin（登録済みプラグイン名、必須）と min_version（MAJOR.MINOR.PATCH、必須）。main でだけ動く。対象の現在の version が min_version 以下で major・minor が同じなら min_version の次の patch に上げ、既存の PR 経由で main に入れる。現在の version が min_version を超えていれば何もせず成功で終わる。マージ後に plugin=em-workflow, min_version=0.5.3 で 1 回実行するのは人の手順
    resolution_note: 'gate: create-spec.requirement-clarification; codex_consulted: true; Codex suggested workflow_dispatch with plugin name and baseline version inputs, idempotent; mapped. Not chosen: rely_on_next_push, manual_minor_bump. opus_escalation: not run'
