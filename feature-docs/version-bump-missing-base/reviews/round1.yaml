    file: .github/workflows/plugin-version-bump.yml
    line: 21
    title: "手動実行が同じ並行実行グループで待機中の push を置き換え、版更新を取りこぼす"
    description: "21〜23行目の並行実行グループはワークフロー全体に掛かり、push と workflow_dispatch が共有している。cancel-in-progress: false でも、グループの待機枠は 1 件だけで、新しい実行が入ると待機中の実行は取り消される。37行目の main 判定はステップ単位なので、main 以外を選んだ手動実行も待機枠を取る。後続の push は自身の BEFORE 以降しか比べないので、取り消された push の差分はどの実行でも版が上がらない。push 同士の置き換えは基点のワークフローから既にあり、今回の変更で手動実行が新しい置き換え元になった。手動実行はまれな操作で、取りこぼしは同じ手動実行で取り戻せるため、high から medium に下げた。"
    suggestion: "main 判定をジョブの `if` に移し、並行実行グループもジョブ側に置く。こうすると、main 以外の手動実行はチェックアウトも待機枠も使わない。待機中の実行を残す設定は、現行の GitHub Actions の仕様にあると確かめてから使う。ワークフローとテンプレートはバイト単位で同一に保つ。"
