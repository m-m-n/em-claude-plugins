schema_version: 1
feature: version-bump-missing-base
created: '2026-11-22'
base_branch: main
goal: |
  # plugin-version-bump.yml が base commit を取得できないと version を上げずに success で終わる

  種別: バグ

  ## 現象

  `.github/workflows/plugin-version-bump.yml` が `skip: base commit <sha> is not available` を出して何も変更せず、実行結果は success になる。em-workflow の変更が main に入っても version が上がらず、インストール済みプラグインのキャッシュが古いままになる。

  発生事例（2026-11-22、時刻は JST）:

  - 13:44:46 `8d25180d5` を push
  - 13:45:01 Actions が `f87807a8e`（chore: bump plugin versions (em-workflow@0.5.3)）を main に積む
  - 13:45:31 ローカル main で `8d25180d5` の上に `em-workflow/rework-replan-artifact-digest/integration` をマージし `e4286e77b` を作成（`f87807a8e` を取り込んでいない）
  - 13:45:36 `e4286e77b` を push。origin/main が `f87807a8e` を含まない `e4286e77b` に置き換わった
  - 次の Actions（run 44986457565）は `github.event.before` = `f87807a8e` を取得できず skip。em-workflow は 0.5.2 のまま
  - インストール済みキャッシュの em-workflow/0.5.2/ は main の `references/phases/create-plan-phase.md`・`references/contracts/planner-contract.md` と一致しない

  ## 再現手順

  1. main に push し、Actions の version 更新コミットが積まれる
  2. その更新コミットを取り込まずにローカル main で別のブランチをマージし、push で origin/main を置き換える
  3. 次の push で Actions が base commit を見つけられず skip する

  ## 期待する挙動

  - base commit が取得できないときも、変更のあったプラグインの version を上げる（skip で success にしない）
  - Actions の更新コミットを含まない push で origin/main が置き換わらない

  ## 完了の定義

  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある
  - [ ] main の em-workflow の version が インストール済みキャッシュ（em-claude-plugins/em-workflow/）にある最新の版より大きく、キャッシュに main の内容が届いている

  ## 該当箇所

  - `.github/workflows/plugin-version-bump.yml:67`（base commit が無いときの skip）
  - 13:45:36 の push を行った処理（未特定。origin/main の reflog は `update by push`）

  ## 実害・発生条件

  rework-replan-artifact-digest の修正（PR #124）が main に入っているのにインストール済みプラグインに届かず、feature `mcp-bridge-function-shadow` のタスクが再開できない。

  ## 追加の指示

  - 不明点は Codex に相談し、比較的良いと判断した選択肢を採用する。
