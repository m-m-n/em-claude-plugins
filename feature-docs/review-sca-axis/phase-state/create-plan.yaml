answers:
  create-plan.digest-staleness-scope:
    packet_id: null
    answered_at: "2026-09-07T20:39:00+09:00"
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids: [exclude_written_artifacts]
    freeform: null
    normalized_answer: >-
      Exclude the worker's own reported written_artifacts from the return-time
      input_digest recomputation; rely on scope verification to catch
      out-of-scope writes.
    resolution_note: >-
      Rule R1 recomputation vs. planner-contract digest_inputs, which lists the
      planner's own IMPLEMENTATION.md / VERIFICATION.md / tasks/* — on a first
      planning pass the recomputation therefore always mismatches. Verified
      empirically that the only changed digest_inputs keys were exactly the 8
      files the planner wrote; workflow_blob, answers_digest,
      write_policy_digest and every other input were byte-identical. Codex
      consulted (readonly), chose the exclusion option; adopted.
  create-plan.co-owned-file-split:
    packet_id: null
    answered_at: "2026-09-07T20:39:00+09:00"
    source: batch-codex-consultation
    answer_mode: multi_select
    selected_option_ids: [keep_split_review_phase, keep_split_scan_script, collapse_schema_mirror]
    freeform: null
    normalized_answer: >-
      Keep task0003 + task0004 (review-phase.md, disjoint regions) and
      task0001 + task0005 (scan-dependencies.py, symmetric merge duty) split;
      collapse the task0001 + task0002 mirrored edit to
      review-output-schema.json into task0001 alone.
    resolution_note: >-
      Codex first proposed declaring an ordering between co-owning tasks; that
      option is unavailable — implement-phase.md Step I.2 states there is NO
      ordering mechanism between tasks and the task schema has no depends_on
      field, so adopting it would mean changing the implement phase itself,
      outside this feature's scope. Codex was re-consulted with that constraint
      stated and split its answer per pair: keep the two large splits (a
      collapsed task0001+task0005 would carry 11+ requirements, a collapsed
      task0003+task0004 would carry 13), collapse the byte-identical mirrored
      schema edit because it buys no parallelism and only adds
      conflict/adoption overhead. Adopted; the planner was re-dispatched to
      fold task0002 into task0001. Task id 0002 is retired, not reused.
  create-plan.verification-scenarios-beyond-spec:
    packet_id: null
    answered_at: "2026-09-07T20:39:00+09:00"
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids: [accept]
    freeform: null
    normalized_answer: >-
      Accept VERIFICATION.md's TS-15..TS-22, which go beyond SPEC.md's
      TS-1..TS-14, without routing back to create-spec.
    resolution_note: >-
      The added scenarios close test coverage for FR9, FR10 and NFR1..NFR7,
      requirements already approved in SPEC.md that SPEC left with no test
      scenario. Codex consulted; judged planning work rather than a
      specification change, since no product behavior is introduced or
      altered. Adopted. Requirement coverage is now 31/31.
