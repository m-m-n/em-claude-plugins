    with the orchestrator's permissions during an unattended review. npm audit similarly honours a repository
    .npmrc.
  suggestion: Resolve and execute the trusted scanner binary directly (cargo-audit audit --json), bypassing
    cargo's alias/subcommand dispatch, and run scanners so repository-controlled configuration cannot
    redirect the executable, the registry endpoint, or the build.
