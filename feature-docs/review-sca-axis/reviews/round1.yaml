  title: '`cargo audit` dispatches through repository-controlled aliases'
  description: The registry runs `cargo audit --json` with cwd set to the reviewed project root. `audit`
    is not a builtin cargo command, so cargo resolves an [alias] entry from the project's own .cargo/config.toml
