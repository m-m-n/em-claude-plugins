  file: em-workflow/references/review-phase.md
  line: 493
  title: R3b dedupe collapses every advisory in a manifest into one finding
  description: scan-dependencies.py emits every advisory with file = <manifest path> and line = None,
    so R3b's same_site predicate holds between ALL vulnerability findings from one manifest and within-category
    dedupe reduces them to a single finding. The accountability floor matches by the same predicate, so
    retaining or dismissing one advisory discharges the duty for all others. Downstream, file_tasks recovers
    (package, advisory_id) only from the surviving title.
  suggestion: Give vulnerability findings a site identity that includes package and advisory id, and make
    the dedupe/floor predicate use it for category vulnerability.
  sources:
