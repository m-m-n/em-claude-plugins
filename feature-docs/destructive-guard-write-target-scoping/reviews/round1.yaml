    title: "mv の source 側が write-target から漏れ、保護パスの持ち出し・削除が allow になる"
    description: |
      write_targets() は cp/mv/ln をまとめて「最後の非フラグ引数だけが宛先」として扱うが、
      mv の source は読み取りではなく unlink される。保護対象からの mv は破壊的な書き込みなのに
      write-target 集合に入らない。旧実装との実測差分:

        ask  -> allow | mv /home/sakura/.claude/settings.json /tmp/x
        ask  -> allow | mv ~/.claude/hooks/destructive-guard.py /tmp/x
        deny -> allow | mv ~/.claude/projects/p/a.jsonl /tmp/b

      3 件目は本フック唯一の hard deny（transcript-write）が allow に後退している。
      ALLOW_NON_DESTRUCTIVE により明示 allow は auto mode classifier と
      settings.json の permissions.deny の両方をスキップさせるため、
      rm を mv に置き換えるだけでガードを迂回できる。

      同じ site に `-t` / `--target-directory=` 形式の宛先取りこぼしも重なる
      （cp -t ~/.claude/hooks/ payload.py、mv -t ~/.claude/hooks/ payload.py、
      cp payload.py --target-directory=/home/sakura/.claude/hooks/ がいずれも旧 ask -> 新 allow）。
      567 行の `not a.startswith("-")` フィルタでフラグ値が落ちるため恒久的に不可視。

      さらに destructive-guard-cases.json の
      ["allow", "mv 複数ソース + 宛先のみ判定", "mv ~/.claude/hooks/x.py extra.txt /tmp/y"]
      がこの検知漏れを期待値として固定しており、
      .claude/rules/hook-tests.md の「誤爆を潰す修正が検知力を削っていないことを示す」
      というスイートの役割と齟齬がある。
    suggestion: |
      mv を cp/ln から切り離し、全非フラグ引数（source + destination）を write-target に入れる。
      あわせて cp/mv/ln/install の `-t <DIR>` の値トークンと `--target-directory=<DIR>` の右辺を
      targets に加える。destructive-guard-cases.json の "mv 複数ソース + 宛先のみ判定" を
      ask 期待へ改め、`mv ~/.claude/projects/p/a.jsonl /tmp/b` を deny ケース、
      `cp -t ~/.claude/hooks/ x.py` を ask ケースとして追加する。
      write_targets() の docstring も mv が source も消す旨に書き換える。
