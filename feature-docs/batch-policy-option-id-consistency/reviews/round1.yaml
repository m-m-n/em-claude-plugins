    severity: medium
    category: comprehensive
    file: tests/test_gate_option_vocabulary.py
    line: 271
    title: "exemption loader scans the whole document, so any second table silently exempts gates"
    description: >-
      load_exempt_gate_ids() collects Markdown table rows from the ENTIRE text of
      em-workflow/references/gate-option-vocabulary.md rather than from its
      `## Exemption registry` section. The sibling parser in
      tests/test_gate_option_vocabulary_doc.py scopes correctly
      (_section(text, "## Exemption registry", "## Scope")), so the two modules
      disagree about what the registry says. Adding one illustrative
      `## Gate option vocabulary` example table to that document — a plausible
      edit, since the document describes the format in prose with no example —
      makes load_exempt_gate_ids() return {'create-spec.feature-identity'} while
      the registry still reports zero rows. The sweep then skips that gate via
      `if gate_id in exempt: continue` with no test failing, reopening the
      protocol-error abort this feature exists to close.
    suggestion: >-
      Scope the scan to the `## Exemption registry` section before collecting
      table lines, mirroring extract_vocabulary_section(). Add a hermetic test:
      a registry document containing an unrelated table plus a zero-row
      `## Exemption registry` must yield set().
    sources: [claude:comprehensive]
    confidence: 80
    resolution: unresolved
    resolution_reason: >-
      severity medium — below Phase R4's auto-fix candidate gate
      (critical/high only). Carried to a follow-up task.
