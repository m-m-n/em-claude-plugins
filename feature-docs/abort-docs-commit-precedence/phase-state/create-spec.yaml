      option_id に写像できると判断して採用。
    normalized_answer: batch_terminal_line_precedence を採用。優先関係は batch-terminal-line.md
      の「Precedence rule:」段落内（テストの抽出範囲内）に置き、既存の固定文言（a2）は維持する。implement-phase.md の I.2.c
      batch 段落（4 テストがバイト固定）は変更しない。再開・NFR2 の定義は implement-phase.md の Branch & Worktree
      Model の exit-4 箇所に置き、再開入口での破棄は skills/develop/SKILL.md に接続する。
