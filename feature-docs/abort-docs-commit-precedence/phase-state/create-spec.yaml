    freeform: Codex 相談（run_codex_exec.sh readonly、1 ターン、codex エントリ）で推奨。オーケストレーターが各設問の
      option_id に写像できると判断して採用。
    normalized_answer: 'docs_commit_conflict_wins を採用。abort の terminal status commit
      が exit-4 recovery を使い切って停止した場合の reason は docs_commit_conflict_aborted。優先関係（phase-specific
      同士が同時該当したとき、その停止を直接引き起こした commit 失敗側の docs-commit-conflict が勝つ）を明記する。1 回目 exit
      4 → 再試行成功の場合は従来どおり implement_task_failed。同一ランの Step B が未コミットの implement: failed
      を読んで stop-condition-3 経路に入ることは無い（停止は終端）ことも明記する。13 コード / 14 行は不変。'
  edge-case.uncommitted-terminal-status-on-resume:
    packet_id: create-spec-q0001
    answered_at: '2026-09-24T20:21:58+09:00'
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids:
    - discard_and_rederive
    freeform: Codex 相談（run_codex_exec.sh readonly、1 ターン、codex エントリ）で推奨。オーケストレーターが各設問の
      option_id に写像できると判断して採用。
    normalized_answer: 'discard_and_rederive を採用。条件: (1) 停止時、terminal status write（implement:
      failed / failed_kind: decision）は integration worktree に未コミットで残り、ブランチには確定しないと明記する。(2)
      NFR2「never carries uncommitted state across turns」にこの停止の名前付き例外を置く。(3) Step I.1
      だけでは不十分 — develop は既存 worktree を再利用し Step A.5 で読み取り・コミット（commit-docs.sh）を行い、Step
      B は worktree の workflow.yaml を直接読むため、残留書き込みの破棄は Step A.5 より前（develop の再開入口）で行う規定が必要（skills/develop/SKILL.md）。(4)
      再導出はコミット済みのタスク状態・retry 消費記録・ジャーナルから行い、追加の自動 retry を与えない。(5) detail に停止した呼び出し箇所・対象タスク・未コミットであることを、resume_conditions
      に破棄と再導出の手順を含める。(6) commit-docs.sh の exit 4 は既存の書き込みを消さないため、「aborts without writing
      any status」の文言と「書いたがコミットできなかった」状態を区別する。'
  requirement.rule-scope:
    packet_id: create-spec-q0001
    answered_at: '2026-09-24T20:21:58+09:00'
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids:
    - batch_abort_only
    freeform: Codex 相談（run_codex_exec.sh readonly、1 ターン、codex エントリ）で推奨。オーケストレーターが各設問の
      option_id に写像できると判断して採用。
    normalized_answer: batch_abort_only を採用。対象は batch の 2 回目失敗 abort の terminal commit（implement-second-failure
      × docs-commit-conflict）に限定する。他の exit-4 呼び出し箇所（baseline / launch / wake / I.3）は
      docs_commit_conflict_aborted 単独のまま。
  requirement.placement:
