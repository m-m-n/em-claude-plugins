  title: "「no other exit-4 call site leaves uncommitted state」は事実と合わないよ"
  description: "新しい abort terminal-commit exception の箇条書きに『no other exit-4 call site leaves uncommitted state』とあるが誤り。commit-docs.sh は exit 4 のとき git の状態に触らず、直前の exit-4 recovery 箇条書きは I.1 baseline / I.2.a launch / I.2.b wake / I.2.c rejected-path / I.3 completion のどれでも状態遷移を再適用してから 1 回だけ再試行すると定めている。どの呼び出し箇所でも 2 回目の exit 4 のあとには再適用した書き込みが未コミットのまま integration worktree に残る。実害は小さめで、SKILL.md Step A の無条件 refresh が他の箇所で残った分も捨てる。"
  suggestion: "誤った節を削るか、この例外が名前を付けて扱うのはこの停止だけであり、他の exit-4 呼び出し箇所の 2 回目の exit 4 で残る未コミット変更も同じ無条件の再開時 refresh（skills/develop/SKILL.md Step A）で捨てられる、と正しく書き直す。NFR2 で固定された exit-4 箇条書きの文言と I.2.c batch-mode 段落は変えない。"
  sources: [codex:comprehensive]
  confidence: 85
  resolution: unresolved
  resolution_reason: "medium のため auto-fix 候補外"
