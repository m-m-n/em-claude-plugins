schema_version: 1
feature: abort-docs-commit-precedence
created: '2026-09-24'
base_branch: main
goal: '# em-workflow: batch abort の commit 新設で batch-terminal-line の stop reason code
  が二重該当しうる


  Notion: https://www.notion.so/3bf3509ec8ee81b0a6a6ef3465aeadda


  ## 現象（必須）

  `em-workflow/references/batch-terminal-line.md` の Stop point coverage 表で、1 つの停止点が
  phase-specific な 2 行に同時該当し、batch run が最終行に出す reason code が未定義になる。

  batch の 2 回目失敗 abort パスで `commit-docs.sh` の exit-4 recovery を使い切って停止した場合、その停止点は次の
  2 行の両方に該当する。

  - `implement-second-failure` → `implement_task_failed`

  - `docs-commit-conflict` → `docs_commit_conflict_aborted`

  同ファイルの Precedence rule は「phase-specific \> generic `stop-condition-N`」しか解決せず、phase-specific
  同士の衝突を解決しないまま「so exactly one code applies」と宣言している。

  ## 再現手順（必須）

  1. batch モードで `/em-workflow:develop --batch <task>` を実行する

  2. あるタスクを 2 回連続で failed にする（1 回目は自動 retry、2 回目で abort phase へ入る）

  3. abort phase の terminal status commit で `commit-docs.sh` が exit 4 を返す状況を作る（並行する
  `merge-task.sh` がブランチ ref を進める）

  4. exit-4 recovery の 1 回リトライも exit 4 で失敗させ、フェーズを停止させる

  5. `references/batch-terminal-line.md` の Stop point coverage 表を引いて、この停止点に対応する reason
  code を決めようとする

  ## 期待する挙動（必須）

  停止点ごとに reason code が一意に定まる。phase-specific な 2 行が同時該当したときにどちらが勝つかが、いずれかの SSOT に明記されている。

  ## 完了の定義（必須）

  - [ ] phase-specific 同士が同時該当した場合の優先関係が、`references/batch-terminal-line.md` の Precedence
  rule か `references/implement-phase.md` の abort 記述のどちらかに明記されている

  - [ ] abort の terminal commit で exit-4 recovery を使い切って停止したときの reason code が、本文から一意に読み取れる

  - [ ] その停止時に terminal status write が未コミットのまま worktree に残ることが定義されている（再開時の扱いが確定する）

  - [ ] `python3 -m unittest discover -s tests` が通る

  - [ ] `em-workflow/.claude-plugin/plugin.json` と `.claude-plugin/marketplace.json`
  の version を同じ変更で lockstep bump している

  ## 該当箇所（任意）

  `em-workflow/references/batch-terminal-line.md`（Stop point coverage 表と Precedence
  rule）、`em-workflow/references/implement-phase.md` Step I.2.c の batch-mode 段落（L490
  前後）。

  ## 実害・発生条件（任意）

  外部サービスは terminal line の reason code でフォローアップタスクを起票するため、docs コミット競合が「タスク 2 回失敗」として、あるいはその逆として誤って帰属される。発生条件は「batch
  の 2 回目失敗 abort」かつ「その terminal commit で exit 4 が 2 回連続」なので頻度は低いが、起きたときに人間へ届く唯一の確認面が誤った内容になる。

  PR https://github.com/m-m-n/em-claude-plugins/pull/13 のレビュー round 1 で comprehensive
  観点が検出した medium。記録は `feature-docs/abort-phase-terminal/reviews/round1.yaml` の `676ce984493653e6`。severity
  medium のため review phase R4 の auto-fix 候補ゲート（critical/high のみ）に該当せず、`resolution:
  unresolved` のまま残した。PR #13 以前は abort パスに commit が一切無かったため、この 2 行が同時該当することは起き得なかった。


  '
