answers:
  requirement.pidfd-unavailable:
    packet_id: create-spec-q0001
    answered_at: '2026-10-27T00:34:00+09:00'
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids:
    - stop_nothing
    freeform: null
    normalized_answer: 何も止めない
    resolution_note: 'gate: create-spec.requirement-clarification; Codex consulted (harness: codex, 1
      turn); orchestrator mapped the suggestion onto option stop_nothing; Opus escalation not run; Codex
      rationale: _stop() は確認と信号送信を別々に行うため、os.kill に戻すと報告された競合が残る。使えなければ何も送らずに終える方が、「疑わしければ何も止めない」方針と、送信エラー後に追加送信しない既存テストに沿う。'
  requirement.start-time-equal:
    packet_id: create-spec-q0001
    answered_at: '2026-10-27T00:34:00+09:00'
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids:
    - allow_equal
    freeform: null
    normalized_answer: 等しければ採用
    resolution_note: 'gate: create-spec.requirement-clarification; Codex consulted (harness: codex, 2
      turns); orchestrator mapped the suggestion onto option allow_equal; Opus escalation not run; Codex
      rationale: turn 1 は reject_equal を推したが、orchestrator が「開始時刻は 10 ms 刻みで、正しい親子が同値になることは多く、拒否すると止めるべき子孫が漏れて元の不具合が戻る」と反論し、turn
      2 で allow_equal に収束した。親が子より後に開始したリンクだけを除外し、同値は許容するのが妥当。Codex が turn 2 で添えた追加の確認（親子双方の pidfd を取った後の再確認）はタスクの範囲を超えるため採用しない。'
  requirement.pidfd-lifetime:
    packet_id: create-spec-q0001
    answered_at: '2026-10-27T00:34:00+09:00'
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids:
    - hold_across_phases
    freeform: null
    normalized_answer: SIGKILL まで保持
    resolution_note: 'gate: create-spec.requirement-clarification; Codex consulted (harness: codex, 1
      turn); orchestrator mapped the suggestion onto option hold_across_phases; Opus escalation not run;
      Codex rationale: _stop() は SIGTERM 後も (pid, start) だけを保持し、SIGKILL 前に開始時刻で再判定している。pidfd を保持すれば両段階で同じプロセスを参照でき、開き直しの経路を避けられる。記述子は対象数分必要だが、EMFILE
      では追加送信を止めれば既存のエラー処理方針に沿う。'
  requirement.ancestor-chain-scope:
    packet_id: create-spec-q0001
    answered_at: '2026-10-27T00:34:00+09:00'
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids:
    - apply_to_chain_too
    freeform: null
    normalized_answer: 祖先チェーンにも適用
    resolution_note: 'gate: create-spec.requirement-clarification; Codex consulted (harness: codex, 1
      turn); orchestrator mapped the suggestion onto option apply_to_chain_too; Opus escalation not run;
      Codex rationale: _ancestor_chain() も開始時刻を使わず PPID だけをたどり、その結果で起点の妥当性と除外対象を決めている。ここを放置すると誤った起点を採用する経路が残るため、不整合が見つかったら送信前に終える。'
  design-step.decision:
