schema_version: 1
feature: codex-hook-tty-reaper-pid-reuse
created: '2026-10-27'
base_branch: main
goal: '# codex-hook-tty-reaper.py の PID 再利用の競合で、起動元の Codex の子孫ではないプロセスに信号が届き得る


  種別: バグ


  ## 現象


  `codex-hook-tty-reaper.py`（Codex の Stop フック）に、PID の再利用による競合が 2 つ残っている。どちらも、起動元の Codex と関係のないプロセスに SIGTERM
  / SIGKILL が届く経路になる。


  1. 走査中の親 PID の再利用: `_snapshot()` は `/proc` を PID 昇順に 1 件ずつ読み、`_depths_below()` は ppid の数値だけで親子を結ぶ。外部プロセス
  P の子 C を読んだ後に P が終了し、同じ PID が起動元配下の新しいプロセスに再割り当てされると、C が起動元の子孫と判定される。`_same_process()` は C 自身の開始時刻しか見ないので確認を通る。

  2. 同一性の確認から信号送信までの窓: `_stop()` は `_same_process()` で開始時刻を確かめたあと、別の操作として `os.kill(pid, sig)` を呼ぶ。確認の直後に対象が終了して
  PID が再割り当てされると、信号は新しいプロセスに届く。


  em-workflow / em-review の 2 つのコピーはバイト単位で同一なので、両方に同じ問題がある。


  ## 再現手順


  1. テストの FakeTable で、C の古い PPID と、再利用された P の新しい PPID を同じスナップショットに取り込ませる。C が停止対象になり、SIGTERM の送信が記録される。

  2. テストで、stat 読み取りが開始時刻 100 を返した直後に PID の実体を開始時刻 200 へ入れ替える。新しい実体への SIGTERM と SIGKILL の送信が記録される。


  ## 期待する挙動


  起動元の Codex の子孫ではないプロセスには、どの段階でも信号を送らない。


  ## 完了の定義


  - [ ] 再現手順で現象が起きない

  - [ ] 再発を検出するテストがある

  - [ ] 2 つのコピー（em-workflow / em-review）を同じ変更で直し、バイト単位で同一に保つ


  ## 該当箇所


  - `em-workflow/scripts/codex-hook-tty-reaper.py:171`（`_depths_below()` の親子リンク）

  - `em-workflow/scripts/codex-hook-tty-reaper.py:225`、`:239`（`_stop()` の `os.kill`）

  - `em-review/scripts/codex-hook-tty-reaper.py` の同じ箇所


  修正案（レビューでの提案）:


  - 親の開始時刻が子の開始時刻より後になる親子リンクを採用しない（等しい場合は許す）

  - `os.pidfd_open(pid)` で pidfd を取ってから開始時刻を照合し、`signal.pidfd_send_signal` で送る。pidfd が使えない環境では何も止めない側に倒す


  ## 実害・発生条件


  成立には PID 空間の折り返しと走査中の再割り当て、またはマイクロ秒単位の窓での再割り当てが要るため、発生確率は極めて低い。em-workflow の feature `codex-stop-hook-tty-reaper`
  のレビュー（round 1、comprehensive 観点、medium 2 件）で見つかった。この feature のブランチがマージされた後に着手する。


  ## 追加の指示（起動者から）


  - 実装完了後、integration ブランチを remote に push し、gh pr create で base_branch への PR を作る。integration ブランチはローカル・リモートとも残す（base_branch
  に自動マージしない）。

  - 不明点は Codex に相談し、相対的に良いと判断した選択肢を採用する。

  - その相談内容を Notion（タスクページへのコメント）に記録する。

  '
