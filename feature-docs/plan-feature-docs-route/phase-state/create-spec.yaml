    freeform: null
    normalized_answer: '規則と検証の両方: 計画担当の規則に書いたうえで、validate-worker-output.py でも replace_planning の entries を弾く。テスト test_ac1_replace_planning_entries_are_not_checked の期待値を反転させる。'
    source: batch-codex-consultation
    answered_at: '2026-11-07T22:23:52+09:00'
    resolution_note: 'batch-policies.yaml create-spec.requirement-clarification: codex_consultation (harness entry: codex, 1 turn). Codex suggested rule_and_validator; orchestrator judged it maps to the option and adopted it. Codex rationale: 現行の禁止検査は append 専用なので、規則の追記に加えて replace_planning の entries[].files も機械的に拒否することを推奨する（em-workflow/scripts/validate-worker-output.py:2469）。既存のパス正規化と先頭区画の判定を共用し、replace_planning の除外を固定しているテストの期待値も変更する（em-workflow/scripts/validate-worker-output.py:2480、tests/test_rework_docs_only_validator_rules.py:332）。禁止対象は実装対象を示す files に限定し、計画書の所在を示す plan は引き続き許可する（em-workflow/references/phases/create-plan-phase.md:102）。'
  resume.failed-entry:
    packet_id: create-spec-q0001
    answer_mode: select_or_freeform
    selected_option_ids:
    - extend_failed_entry
    freeform: null
    normalized_answer: 'failed からの入口を広げる: Step A.6 の failed からの入口を広げる。未マージの失敗タスクの files に feature-docs/** があれば、計画の訂正（そのパスを files から外し、文書は新しい経路で直す）を dispatch し、implement とそのタスクを pending に戻す。対話実行でも batch 実行でも同じ入口を使う。'
    source: batch-codex-consultation
    answered_at: '2026-11-07T22:23:52+09:00'
    resolution_note: 'batch-policies.yaml create-spec.requirement-clarification: codex_consultation (harness entry: codex, 1 turn). Codex suggested extend_failed_entry; orchestrator judged it maps to the option and adopted it. Codex rationale: 停止条件の評価より前に訂正でき、対話実行と batch 実行で入口を共用する既存構造を維持できる（em-workflow/skills/develop/SKILL.md:401、em-workflow/skills/develop/SKILL.md:406）。通常の replace_all は failed を拒否し、引き継ぐタスクの files も変更しないため、文書経路への移管だけを許す限定的な例外を契約と検証処理に追加する必要がある（em-workflow/references/workflow-patch.md:136、em-workflow/references/workflow-patch.md:154）。文書の訂正と計画の整合を検証した後、implement と対象タスクを pending に戻し、failed_kind・notes の解消と routeback_failed_journal_line の記録も引き継ぐことで、過去の失敗履歴による再停止を防ぐ（em-workflow/skills/develop/SKILL.md:413、em-workflow/references/implement-phase.md:263）。進行中のタスクがない条件と、マージ済みタスク・既存作業ツリーを保護する条件は維持する（em-workflow/references/workflow-patch.md:425、em-workflow/skills/develop/SKILL.md:432）。'
