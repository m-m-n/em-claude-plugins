    source: batch-codex-consultation
    answered_at: '2026-11-07T22:23:52+09:00'
    resolution_note: 'batch-policies.yaml create-spec.requirement-clarification: codex_consultation (harness entry: codex, 1 turn). Codex suggested other_feature_docs_except_state; orchestrator judged it maps to the option and adopted it. Codex rationale: 他 feature の Markdown 文書を対象候補とし、workflow.yaml・phase-state/**・tasks/**・design/mockups/・feature-docs/LESSONS.md は除外することを推奨する。workflow.yaml は統括担当だけが書く状態ファイルであり、phase-state は実行履歴を、tasks は実装指示を保持するため、この境界を維持する（em-workflow/references/workflow-schema.md:3、em-workflow/references/workflow-schema.md:9、em-workflow/references/phase-state.md:3、em-workflow/skills/plan-writing/SKILL.md:62）。THREAT-MODEL.md 以外の文書訂正にも対応しつつ、書き込み権限は必要なファイルだけ個別に列挙する（em-workflow/references/contracts/spec-writer-contract.md:38）。'
  validation.replace-planning:
    packet_id: create-spec-q0001
    answer_mode: single_select
