  route.other-feature-docs:
    packet_id: create-spec-q0001
    answer_mode: select_or_freeform
    selected_option_ids:
    - planner_at_create_plan
    freeform: null
    normalized_answer: 'create-plan で計画担当が直す: implementation-planner が create-plan の中で他 feature の文書を自分で直し、結果の中で宣言する（rework-planner の文書のみ経路と同じ考え方）。既存ファイルに書くには事前に宣言された write_policy の targets が要るので、書く対象の渡し方（2 段階の dispatch など）は SPEC で決める。'
    source: batch-codex-consultation
    answered_at: '2026-11-07T22:23:52+09:00'
    resolution_note: 'batch-policies.yaml create-spec.requirement-clarification: codex_consultation (harness entry: codex, 1 turn). Codex suggested planner_at_create_plan; orchestrator judged it maps to the option and adopted it. Codex rationale: 計画担当が文書を直接訂正する既存方式にそろえられ、implement の担当振り分けやタスク種別の追加を避けられる（em-workflow/references/rework-task-synthesis.md:227、em-workflow/references/rework-task-synthesis.md:237）。対象を先に洗い出し、統括担当が個別の write_policy.targets と expect_digest を設定してから再依頼する二段階方式を推奨する（em-workflow/references/contracts/planner-contract.md:44、em-workflow/references/contracts/spec-writer-contract.md:48）。文書訂正は create-plan 完了前に済ませ、訂正内容と written_artifacts を返し、検証・状態更新・コミットは既存どおり統括担当が行う（em-workflow/references/rework-task-synthesis.md:244、em-workflow/references/phases/create-plan-phase.md:34）。 Codex notes: 他 feature 文書への自動訂正権限は、対象を限定して契約に明記する必要がある。現在の replace_own は自身の同一フェーズ出力、replace_authorized はユーザー承認済みの上書きを意味するため、そのまま無条件に流用しない（em-workflow/references/contracts/spec-writer-contract.md:72）。既存の artifact-overwrite
      を流用するだけでは、batch の preserve_and_reuse が文書を保護して blocked に至り得る（em-workflow/references/batch-policies.yaml:34）。 / 文書訂正の対象と結果を再開後も読める形で保持し、対象文書を入力ダイジェストと自己書き込みの照合にも含めることを推奨する。入力集合は担当ごとの契約で定義されるため、targets の追加だけでは不十分になる（em-workflow/references/contracts/worker-envelope.md:175、em-workflow/references/contracts/worker-envelope.md:205）。 / 他 feature 文書を tasks.*.files から外した後も、その訂正宣言を変更集合の導出元へ含める必要がある。現在の導出元と自 feature 向けの既定範囲だけでは、他 feature 文書の変更が検証時の包含条件から漏れる（em-workflow/references/phases/create-plan-phase.md:414、em-workflow/references/templates/spec-document.md:183、em-workflow/references/templates/spec-document.md:201）。 / 再開時は失敗タスクで入口を判定した後、訂正対象を未マージの全タスクから収集する既存方式にそろえることを推奨する（em-workflow/scripts/report-name-entry.py:140、em-workflow/scripts/report-name-entry.py:144）。ただし、文書経路への移管は既存文書にも必要なので、最終パス訂正の「旧パスが基準コミットに存在しない」という条件は共用しない（em-workflow/references/workflow-patch.md:429）。実装担当の feature-docs/** 変更禁止は維持する（em-workflow/skills/worktree-task-workflow/SKILL.md:17）。'
