findings:
- stable_id: 39b64a741a70ebad
  severity: high
  category: spec
  file: em-workflow/skills/develop/SKILL.md
  line: 463
  title: 復元の分割でタスクだけ先に pending になり、中断や後段の訂正失敗で再開できなくなる
  description: SPEC FR9 は、implement を pending、failed_kind を null、対象タスクの status を pending にする書き込みを「まとめて 1 回の Write と 1 回のコミット」で行うと定めている。復元の分割（459〜469 行）は、タスクの項目を feature-docs の訂正の Write に入れ、step の項目は最後の訂正の Write に回すため、両方の訂正が要るときは途中に『タスクは pending、implement は failed』の状態ができる。失敗タスクの選び方（em-workflow/scripts/report-name-entry.py の failed_tasks、93〜107 行）は『status が failed、または journal の最後のイベントが failed』で、journal が無いときは read_journal_events がイベント無しとして読む。失敗の journal 記録が無いタスクでは、最初の Write の後にそのタスクがどちらの判定からも外れる。ここで中断するか、後段の最終パスの訂正（13 節の dispatch）が検証済みのパッチを得ずに終わると、次の起動では両判定が none になり、Step B で停止条件 3 が毎回発火する。残った最終パスの違反は自動では直らない。同じ節の『訂正と訂正の間で中断した場合、次の起動は feature-docs の判定が none を返し、最終パスの判定に進む』という説明も、この場合は成り立たない。
  suggestion: 最後でない訂正の Write にはパッチだけを書き、tasks.{T}.status は failed のままにする。すべての訂正の対象のタスクの項目（status と routeback_failed_journal_line）は、未解決の判定が無いときに限り、implement と failed_kind と一緒に最後の Write にまとめて書く。これで FR9 の 1 回の Write に揃い、途中の状態でもタスクが失敗タスクとして判定に残る。tests/test_feature_docs_entry_develop_docs.py の split_defects の固定文言も合わせて直す。
  reproduction: null
  reproduction_alternates: []
  reproduction_overflow: false
