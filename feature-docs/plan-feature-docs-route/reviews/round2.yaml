  title: 評価をまたぐと、前の訂正の対象タスクが復元されず failed のまま残る（FR9 の復元漏れ）
  description: task0010 で、評価の最後でない訂正の Write はパッチだけを書くようになった（460〜463 行）。復元はすべて、未解決の判定が無いときに限り、最後の Write に入る（464〜471 行）。1 回の評価の中ではこれで正しく動く。ただ、評価をまたぐと次の穴が残る。例として、失敗したタスク A の files に feature-docs のパスだけがあり、失敗したタスク B に REPORT.md（最終パスの違反）がある場合を考える。feature-docs の訂正の Write（パッチのみ）の後に中断するか、最終パスの訂正が未解決で終わると（471 行により復元は 1 つも書かれない）、次の起動はこう進む。(1) feature-docs-entry.py は、失敗したタスクに feature-docs のパスが残っていないので none を返す（117〜118 行）。(2) 最終パスの判定の violations は要素ごとに path を持つので（SKILL.md 407 行）、違反が無い A は挙がらない。(3) 482 行の『その評価の復元は、その評価自身の訂正の対象について書く』により、復元されるのは B だけになる。その結果、A は計画が訂正済みなのに status が failed のまま残り、routeback_failed_journal_line も記録されない。implement だけが pending に戻るので、A は未起動ではなく失敗したタスクとして扱われる（I.2.c の失敗処理。batch では再試行を消費する）。FR9 は、訂正の対象タスクの status を pending に戻すよう定めている。逆の順でも同じことが起きる。feature-docs の判定が blocked のまま最終パスの訂正だけが成功し、後の起動で feature-docs の訂正が最後の訂正になると、前の評価の violations の対象は復元されない。478〜484 行は、このケースが次の起動で片付くかのように書いている。tests/test_feature_docs_entry_develop_docs.py の interruption_defects（358 行付近）もこの文言を固定している。前ラウンドの
    39b64a741a70ebad と 29d5fb6ce49e138b は、1 回の評価の中では task0010 で解消した。この指摘は、評価をまたいだ場合に残った部分である。
  suggestion: 次の起動の評価の復元の対象に、前の評価の訂正で files が変わったのに復元されていないタスクを加える。(a) 最後でない訂正の対象を phase-state/create-plan.yaml の run の記録として残し、次の評価で、未マージで status が failed のままのものを、自分の対象と一緒に復元する。または (b) 今回の implement の失敗の後に記録された create-plan の patches（feature_docs_removals / path_corrections）の task_id から、同じ条件のタスクを拾う。failed_journal_line は、feature-docs-entry.py と同じように journal から引く。そのうえで 478〜484 行を実際の挙動に合わせて書き直す。テストも interruption_defects の固定文言を新しい規則に合わせ、次の 3 つを固定する。『A は feature-docs のパスだけ、B は最終パスの違反』で訂正と訂正の間に中断するケース。最終パスの訂正が未解決で終わり、次の起動で成功するケース。その逆順のケース。
