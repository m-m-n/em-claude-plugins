    title: "引数位置のヒアドキュメント区切り語で ( 範囲の引用符が除去されず本文を誤判定する"
    description: "_read_argument_parens は範囲の生テキスト self.s[start:end] を引用符除去せずに語へ入れる（788行）。匿名関数の引数位置で `<<` のリダイレクト先になると、_finish_word（502-509行）がそれをヒアドキュメントの区切り語として登録する。例: zsh -c \"function { :; } << foo('x')<改行>foo('x')<改行>python3 -i<改行>foo(x)\" では区切り語が foo(x) ではなく foo('x') として登録され、本文 1 行目で本文が終わり、本文の python3 -i をコマンドとして拒否する。変更前は判定不能（無出力）。無出力から deny への変化で、「判別できないものは通す」方針と SPEC Objectives に反する。成立条件は狭い。em-workflow 側のコピーも同じ。"
    suggestion: "ヒアドキュメントの区切り語を待っている間は範囲を読まず、従来の群の読みに戻す。または区切り語に使う前に範囲内の引用符とバックスラッシュを除去する。上の入力を silent として CASES に追加し、両コピーをバイト同一に保つ。"
    reproduction: null
