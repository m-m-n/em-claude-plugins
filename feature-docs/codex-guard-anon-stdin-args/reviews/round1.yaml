    title: "TM-2: 引数の ( 範囲内のバッククォートで本体の明示的な -i の拒否が外れる"
    description: "_scan_parens（724-764行）はバックスラッシュの対と単引用・二重引用しか読み飛ばさず、バッククォートの中の `)` でも範囲を閉じる。入力 zsh -c 'setopt nonomatch nobareglobqual; function { python3 -i; } foo(`case x in x) echo x;; esac`)' では、範囲が最初の `x)` で閉じたと判定され、範囲内に `;` `&` 改行が無いため 787-790行で 1 語として読まれる。続く `echo x;;` は区切りとして処理され、残った `esac`)` のバッククォートは対が見つからず（1043-1046行）_Undecidable(\"quote\") となり、-c 文字列全体が読み飛ばされて無出力になる。変更前は匿名関数本体の python3 -i を拒否していた。deny から無出力への後退で、SPEC FR2、Objectives、THREAT-MODEL TB-1/TM-2 に反する。em-review 側のコピーも同じ。"
    suggestion: "_scan_parens（または _read_argument_parens）で、範囲内に引用されていないバッククォートが現れたら separated と同じく扱い、従来の群の読みに戻す。上の入力を deny として CASES に追加し、両コピーをバイト同一に保つ。"
    reproduction: "tool_input.command に \"zsh -c 'setopt nonomatch nobareglobqual; function { python3 -i; } foo(`case x in x) echo x;; esac`)'\" を設定した JSON をフックの標準入力へ渡す（コマンド自体は実行しない）。変更前は permissionDecision: deny を出力するが、変更後は終了コード0・空出力となる。"
