schema_version: 1
feature: codex-guard-anon-stdin-args
created: '2026-10-17'
base_branch: main
goal: |
  # codex-hook-interactive-guard: 括弧なし匿名関数の頭の入力リダイレクトや引数中の ( で本体が未接続になり、非対話の python3 を誤って deny する（回帰）

  Notion タスク: <notion-url> （種別: バグ）

  ## 現象 (必須)
  `codex-hook-interactive-guard.py`（em-workflow / em-review の両コピー）が、標準入力を /dev/null などへ向けた zsh 匿名関数の非対話実行を誤って deny する。feature `codex-guard-anon-brace-forms` で匿名関数の本体を群として開くようになったことで入った誤爆（変更前は silent）。
  - 匿名関数の頭より前の入力リダイレクト: `_open_group` が `_flush()` で `self.stdin` を捨て、本体の群にはパイプの状態だけを渡すため、本体の `python3` が入力未接続として扱われる
  - 匿名関数の引数中の `(`: 引数を読んでいる途中の `(` で `_open_group("(")` が `_flush()` を呼び、`after_group` が None になる。後ろの `<` は引数から作られた群に付き、本体は未接続のまま残る

  ## 再現手順 (必須)
  1. `zsh -c 'function < /dev/null { python3; }'` をフックに渡すと deny（実際の zsh では出力なし・終了コード 0）
  2. `zsh -c '< /dev/null function { python3; }'` も同様
  3. `zsh -c 'setopt nonomatch nobareglobqual; function { python3; } foo(x) < /dev/null'` も deny（実際の zsh では正常終了）

  ## 期待する挙動 (必須)
  匿名関数の本体を開くとき、頭の単純コマンドで読んだ標準入力リダイレクトを本体の群に引き継ぐ。引数を読んでいる間は `(` を含む語も引数として読み、`after_group` が本体を指したままにする。上の 3 コマンドはいずれも silent になる。

  ## 完了の定義 (必須)
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある
  - [ ] `tests/test_codex_hook_interactive_guard.py` の `CASES` に上の 3 コマンドを silent として追加
  - [ ] 両コピーがバイト単位で同一のまま

  ## 該当箇所 (任意)
  - `em-workflow/scripts/codex-hook-interactive-guard.py:585`（引数中の `(`）、`:592`（本体へ渡す状態）
  - `em-review/scripts/codex-hook-interactive-guard.py`（同一内容）
  - 記録: `feature-docs/codex-guard-anon-brace-forms/reviews/round1.yaml` の `r3b_dropped`（ブランチ `em-workflow/codex-guard-anon-brace-forms/integration`）

  ## 実害・発生条件 (任意)
  誤爆側（fail-closed）。書かれる見込みの小さい形で、deny の理由を読めば書き換えで回避できる。無人実行では誤爆がその場で走行を止める。

  ## 追加指示（起動引数）
  - 実装完了後、integration ブランチを remote へ push し、gh pr create で base_branch への PR を作る。integration ブランチはローカル・リモートとも残す（自動マージしない）。
  - 不明点は Codex に相談し、比較的よいと判断した選択肢を採用する。
  - その議論内容を Notion に記録する。
