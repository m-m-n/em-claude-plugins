answers:
  q-build-scan-jobs-unification:
    question_id: q-build-scan-jobs-unification
    packet_id: create-spec-q0001
    answered_at: '2026-10-05T12:36:53+09:00'
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids:
    - plan-units
    freeform: null
    normalized_answer: 'plan-units: build_scan_jobs becomes the single planning stage (validate, resolve,
      real-path grouping via _verified_groups, target selection) and returns (plans, skip_reasons) where
      each plan is an unlaunched per-group unit (ecosystem, directory/real root, files, target, executable).
      run_scan consumes exactly those plans and does not repeat target selection; binding check, per-group
      isolation directory, pip lockfile preparation and build_scan_job stay on the run side in their current
      order (no path checks when validate/resolve fails; isolation prepared only after binding passes).
      Group order, pip unverified-path handling, output object and reason strings are unchanged. Tests
      that assumed built job dicts from build_scan_jobs are rewritten to verify plans; argv/env/cwd assertions
      move to build_scan_job and run_scan tests.'
    resolution_note: 'Codex (run_codex_exec.sh readonly, entry codex, turn 1) chose plan-units, matching
      the analyst recommendation: build_scan_jobs is lexical and cannot handle npm/cargo prepared inputs
      or pip lockfiles (scan-dependencies.py:1085, :1098); production groups by real path after validate/resolve
      (:2968); sharing grouping+target selection keeps per-group isolation lifetime and pip one-to-many
      runs (:2818, :2767, :2426). Rejected: prepare-all-then-build (changes isolation lifetime), delete-build-scan-jobs
      (contradicts done-definition), gate-only (paths stay split). Orchestrator adopted Codex choice (comparatively
      better). Opus escalation not run. Recorded as assumption (batch-policies record_as_assumption).'
  q-unattempted-policy:
    question_id: q-unattempted-policy
    packet_id: create-spec-q0001
    answered_at: '2026-10-05T12:36:53+09:00'
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids:
    - record-and-surface
    freeform: null
    normalized_answer: 'record-and-surface: file_tasks adds a 5th summary key unattempted_packages, defined
      as ''the failed package and every package after it that was never attempted'', generated from the
      recovered/de-duplicated/truncated group processing order (malformed findings excluded). It is present
      on every return branch ([] on full success, report branch, and another-round). The triage_filing
      receipt records it alongside the four task-listed keys in all three review-phase.md places (R4 receipt,
      R5 YAML example, R5 prose). No automatic retry; the run surfaces ''triage filing incomplete'' with
      the packages in R6 and in the batch final result (R6 alone is suppressed in batch); the review completion
      condition is unchanged. A later re-run of file-tasks recovers only the remainder via duplicate detection,
      guaranteed only when the latest listing reflects the filed packages.'
    resolution_note: 'Codex (run_codex_exec.sh readonly, entry codex, turn 1) chose record-and-surface,
      matching the analyst recommendation: the loop stops at the first failure and later packages are
      recorded nowhere (scan-dependencies.py:537, :547, :554); keeps report_path report-branch-only and
      the once-per-review filing rule (review-phase.md:911, :806); re-run suppression of filed packages
      is already tested (tests/test_sca_task_filing.py:826, :850). Rejected: partial-report-fallback (widens
      report_path meaning), retry-once (adds a second filing per review). Orchestrator adopted Codex choice.
      Opus escalation not run. Recorded as assumption.'
  q-design-step:
    question_id: q-design-step
    packet_id: create-spec-q0001
    answered_at: '2026-10-05T12:36:53+09:00'
