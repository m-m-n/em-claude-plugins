  work_still_required_evidence: '1は未修正。headlineはstripのみで内部の改行が残り、共通のタイトル生成でも空白を畳んでいない。復元用正規表現と不正findingの除外処理も指摘どおり存在する（em-workflow/scripts/scan-dependencies.py:2095、em-workflow/scripts/scan-dependencies.py:1422、em-workflow/scripts/scan-dependencies.py:133、em-workflow/scripts/scan-dependencies.py:185）。メモリ上の確認でも、複数行のpip
    descriptionから生成したfindingがmalformedに分類された。タイトル組み立て前の空白正規化とscan→file_tasksの往復試験が必要。

    2は作成・更新時について未修正。両ヘルパのsubprocess.runにはOSErrorの変換がなく、起票ループはEntryPointErrorだけを捕捉する（em-workflow/scripts/scan-dependencies.py:400、em-workflow/scripts/scan-dependencies.py:423、em-workflow/scripts/scan-dependencies.py:537、em-workflow/scripts/scan-dependencies.py:547）。両経路で2件目の起動失敗を模擬すると、mainからOSErrorが抜けてstdoutは空になった。ただし、最初から不正なshebangを持つファイルは一覧取得時に捕捉してレポートへ移る処理が既にあり、提示の再現手順2だけでは異常終了しない（em-workflow/scripts/scan-dependencies.py:356、tests/test_sca_task_filing.py:499）。作成・更新時のOSErrorをEntryPointErrorへ変換する必要がある。先行する外部タスク自体を削除するコードはなく、失われるのは返却する進捗記録。

    3は未修正。返却値にはfailed_package、failure_reason、malformed_findings、listing_dropped_countが既にあり、捕捉済みの途中失敗でもJSONを出して終了コード0を返す（em-workflow/scripts/scan-dependencies.py:562、em-workflow/scripts/scan-dependencies.py:3115）。receiptの説明・R5例には4項目がなく、未試行の残りを表面化・再試行する規則もない（em-workflow/references/review-phase.md:821、em-workflow/references/review-phase.md:905、em-workflow/references/review-phase.md:957）。これらの永続化と未試行対象の扱いを追記する必要がある。

    4は未修正。build_scan_jobsの説明自体がrun_scanでは使わないと明記し、実行経路には別の検証・実行ファイル解決・ジョブ構築が残る（em-workflow/scripts/scan-dependencies.py:1108、em-workflow/scripts/scan-dependencies.py:2970、em-workflow/scripts/scan-dependencies.py:2820、em-workflow/scripts/scan-dependencies.py:2869、em-workflow/scripts/scan-dependencies.py:2428）。ただし、プロジェクトごとの走査は既に実装済みで、build_scan_jobsの試験も現在は複数ファイルにある（em-workflow/scripts/scan-dependencies.py:2979、tests/test_sca_scan_job_grouping.py:128、tests/test_sca_scanner_project_config_isolation.py:1205）。run_scanが共通の(jobs,
    skip_reasons)を消費するよう接続し、既存の実パス検証、npm/cargoの隔離、pipロックファイルの準備を維持する必要がある。現在のbuild_scan_jobsはpipロックファイルを準備対象外としており、単純な呼び出し追加では対応できない（em-workflow/scripts/scan-dependencies.py:1098）。

    関連する既存試験はあるが、上記の再発検出は不足している。途中失敗試験は非ゼロ終了を扱い、receipt試験は従来の項目だけを確認する（tests/test_sca_task_filing.py:776、tests/test_sca_axis_triage_timing.py:359）。読み取りだけで実行できる復元・receiptの既存13試験は通過した。呼出元・依存数30は、調整対象9関数の対象外にある直接呼出元と同一スクリプト内の直接依存関数を重複排除して数えた値。変更行数と追加試験数は見込みで、ファイルは変更していない'
