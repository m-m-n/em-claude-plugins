findings:
  - stable_id: 3b0cbcee0a37b8bf
    severity: medium
    category: comprehensive
    file: em-workflow/scripts/scan-dependencies.py
    line: 421
    title: "A temp-file removal error after a successful create/update reports the package as failed and stops the rest of the batch"
    description: "_run_entry_point_with_references deletes the references file in a finally block (lines 421-423) with an unguarded Path(refs_path).unlink(missing_ok=True). If that unlink raises OSError after subprocess.run has already returned exit 0, the OSError replaces the return value; create_security_task / append_security_task_references turn it into EntryPointError, and file_tasks records the package as failed_package (task_create_failed / task_update_failed), puts it first in unattempted_packages and stops the batch. The receipt then calls a filed package unfiled. FR3 only requires converting launch and temp-file write errors. _write_references_tempfile already suppresses unlink errors, so the two cleanup paths are inconsistent. tests/test_sca_file_tasks_oserror.py::TestFilingHelpersConvertOsErrors.test_temp_file_removal_failure_becomes_entry_point_error pins the current behaviour."
    suggestion: "Decide success or failure from the launch and exit status only: guard the unlink in the finally with try/except OSError and print the removal error to stderr. Remove 'removing the file' from the docstrings of _run_entry_point_with_references and create_security_task, and rewrite test_temp_file_removal_failure_becomes_entry_point_error to assert the helper returns normally and the error text reaches stderr only."
    sources: [claude:comprehensive]
    confidence: 70
    resolution: unresolved
    resolution_reason: "medium severity is below the auto-fix and completion-gate threshold"
