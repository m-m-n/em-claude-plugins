base_branch: main
goal: "# destructive-guard: クォート付きコマンド置換で理由文のターゲットが空白になる\n\n種別: バグ / 優先度: 中\nNotion: https://www.notion.so/3d63509ec8ee815d8337cc340757a824\n\n## 現象 (必須)\n`destructive-guard.py` がクォート付きコマンド置換を含む `rm` を deny するとき、理由文に表示されるターゲットが空白1文字になり、代替として提示される `gio trash` のパスも実在しないものになる。\n2026-09-09 時点の main（`ce6d3fd`）での出力:\n\n```\n判定: deny\n理由: [destructive-guard/rm-recursive] `rm -r` の対象 ` ` はスクラッチ領域の外。\n      `gio trash -- '/home/sakura/src/my_projects/em-claude-plugins/ '` に書き換える（復元情報が残り、ゴミ箱から戻せる）。\n```\n\n- ターゲットが空白1文字（` `）として表示される\n- 提示される退避先が `<リポジトリルート>/' '`（末尾が空白1文字のパス）になる。実在しないので、提示どおり撃ち直しても失敗するだけ\n\n判定自体は deny なので削除は止まる。壊れているのは理由文の内容。\n\n## 再現手順 (必須)\n1. リポジトリルートで次を実行する。\n\n```\npython3 -c \"\nimport json,subprocess,sys\ncmd='rm -rf \\\"\\$(printf /home/sakura/valuable)\\\"'\np=subprocess.run([sys.executable,'em-workflow/hooks/destructive-guard.py'],input=json.dumps({'tool_name':'Bash','tool_input':{'command':cmd}}),capture_output=True,text=True)\no=json.loads(p.stdout)['hookSpecificOutput']\n\
  print(o['permissionDecision'])\nprint(o['permissionDecisionReason'])\n\"\n```\n\n2. 出力される理由文のターゲットが ` `（空白1文字）になっていることを確認する。\n\n## 期待する挙動 (必須)\n理由文のターゲットが、実際に削除されるパスか、少なくとも「コマンド置換なので静的に確定できない」と分かる表現になっている。変数展開 `rm -rf $TARGET` が返す `rm-unresolvable` と同じ扱いが望ましい。\n\n```\n[destructive-guard/rm-unresolvable] 再帰削除の対象 `$TARGET` が変数/グロブで、影響範囲を静的に確定できない。\n```\n\n## 完了の定義 (必須)\n- [ ] 再現手順で現象が起きない（理由文のターゲットが空白1文字にならない）\n- [ ] 再発を検出するテストがある（`em-workflow/hooks/tests/destructive-guard-cases.json` にケース追加）\n- [ ] `python3 em-workflow/hooks/tests/run-destructive-guard.py` が全件通る\n\n## 該当箇所 (任意)\n`em-workflow/hooks/destructive-guard.py:456`（`statements()`）と `em-workflow/hooks/destructive-guard.py:70`（`SUBSTITUTION`）。\n`statements()` がコマンド置換の中身を切り出して親コマンドから空白に置換するため、クォートで囲まれた置換は「空白1文字のターゲット」として `check_rm()` に届く。クォートが無い場合はトークンごと消えてターゲットが無くなり、そちらは allow に落ちる。\n\n## 実害・発生条件 (任意)\n削除は deny で止まるため、データ損失は発生しない。実害は理由文の正確さに限られる。\nただし destructive-guard の理由文は「そのまま実行できる代替」を示す設計なので、エージェントがこれに従って撃ち直すと無意味なコマンドを実行して混乱する。\n\
  発生条件は、`rm` の削除対象がクォートで囲まれたコマンド置換であること。\n\n## 補足\n同じ置換除去に起因する、より重大な問題として「destructive-guard: コマンド置換でターゲットが消えて allow になる」を別途起票している。クォート無しの `rm -rf $(...)` は allow で素通りする。本件はその表層症状なので、あちらを直すと同時に解消する可能性が高い。先にあちらを見るのが良い。\n"
