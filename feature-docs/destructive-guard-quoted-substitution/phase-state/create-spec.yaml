    normalized_answer: |
      create-spec.requirement-clarification の batch policy は codex_consultation。
      run_codex_exec.sh(readonly) を 1 ターン実行し、フォールバックプロバイダ
      (litellm/vertex-glm-5.2) が回答した。結論は regression_cases_including_backtick。
      理由: 症状は姉妹チケットの修正で解消済みのためフック本体の変更は不要。
      チケットの再現形（クォート付き + printf 綴り）とそのバッククォート版は
      どちらも既存 226 ケースに無く、hook-tests.md の「見逃しを見つけたら
      直す前にケースを足す」に従い両方を足すのが最小かつ規則に忠実。
      独立した二次相談（vertex-glm-5）も同じ結論に至った。
      orchestrator の採否判断: 採用（自前の実測とも整合）。
  testing.expected-verdict:
    packet_id: create-spec-q0001
    answered_at: "2026-09-13T13:02:12+09:00"
    source: batch-decision-table
    answer_mode: select_or_freeform
    selected_option_ids: [match_sibling_ask]
    freeform: null
    normalized_answer: |
      同じ codex_consultation の結論は match_sibling_ask。
      理由: 再現手順で観測された deny は無人実行(CLAUDE_BATCH)下の ask→deny 降格。
      同じ rm-unresolvable 経路の既存ケースは ask を期待値として 226/226 通過している。
      orchestrator の採否判断: 採用。
