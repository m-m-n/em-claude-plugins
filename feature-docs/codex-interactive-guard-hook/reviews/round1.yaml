    description: "_read_options はシェルの -c を python の -c と同じく「束の残りが値」として扱い、束に後続の文字があると code_string を None のまま返す。Bash の -c は値を取らないフラグで、束の残りもオプションとして処理し、最初のオペランドを文字列として実行する。`bash -cx 'python3 -i'`、`bash -ce 'python3 -i'`、`bash -c -- 'python3 -i'` はいずれも判定なしで通り、`bash -ci 'python3'` も束の中の -i と内側の引数なし起動の両方を見落とす。FR9 と THREAT-MODEL.md の TM-1 に反する。tests/test_codex_hook_interactive_guard.py:281 が `bash -cx` を silent として固定している。em-review のコピーも同じ。"
    suggestion: "シェル系では -c を値を取らないフラグとして扱い、同じ束の残りの文字と後続のオプション（`--` を含む）を読み終えてから、最初のオペランドを -c の文字列として 1 段判定する。束の中の i も検知する。281 行目の期待値を deny に変え、`bash -ce`、`bash -c --`、`bash -ci` のケースを足して両コピーで流す。"
