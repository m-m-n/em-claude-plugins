  file: em-workflow/scripts/run_codex_exec.sh
  line: 128
  title: 'FR13/AC-5 provider chain is not implemented: entries 2 and 3 name providers that are defined
    nowhere and cannot be defined under --ignore-user-config'
  description: SPEC FR13 and AC-5 require run_codex_exec.sh to implement GPT -> GLM5.2 (Vertex AI) ->
    Muse Spark. The script instead sets PROVIDER_ARGS_2=(-c 'model_provider="codex-fallback-provider-beta"')
    and PROVIDER_ARGS_3=(-c 'model_provider="codex-fallback-provider-gamma"'). Those two identifiers appear
    ONLY in run_codex_exec.sh:128-131 and tests/test_codex_wrapper_provider_fallback.py, and `model_providers`
    appears in zero files. The same codex invocation passes --ignore-user-config, so a user's ~/.codex/config.toml
    cannot supply the missing model_providers.<name> block either, and no -c model_providers.* override
    is passed. Whenever a switch condition fires, entries 2/3 reference an undefined provider and can
    only fail - the chain can never answer in production, and the original entry-1 failure is destroyed
    by run_attempt's truncating redirect to $OUTFILE. The new tests stay green because the stub decides
    its identity purely by grepping argv for those marker strings and reads no provider configuration
    at all.
  suggestion: 'Define entries 2 and 3 as real, resolvable providers: pass the full provider configuration
    via -c overrides (model_providers.<name>.base_url / wire_api / env_key plus the model) so it survives
    --ignore-user-config, matching the GPT -> GLM5.2 (Vertex AI) -> Muse Spark order FR13/AC-5 names.
    Add a test assertion that each non-primary entry''s invocation carries a resolvable provider definition,
    not just a provider name. If real endpoints cannot be supplied in this change, gate the chain off
    behind an explicit flag and record the FR13 deviation rather than shipping a chain that cannot succeed.'
  sources:
  - litellm:muse-spark:spec
  confidence: 100
