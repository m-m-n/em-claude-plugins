  - stable_id: 43504ede8ee2f609
    severity: medium
    category: security
    file: em-workflow/scripts/run_codex_exec.sh
    line: 216
    title: "Switch detection rests on an unverified premise that codex's stderr carries no attacker-influenceable content"
    description: |
      `is_usage_limit_response` and `is_provider_error_response` are case-insensitive substring greps
      over `$ERRFILE`. The design is sound only if the premise the header asserts holds — that stderr is
      the underlying CLI's own diagnostic while stdout is the attacker-influenceable model reply. The
      security reviewer claims codex's human-output renderer also writes prompt echo, tool output and
      assistant text to stderr, which would let repository content carrying the literal phrases
      `usage limit` / `provider error` combine with any unrelated non-timeout failure to force a
      provider switch. The evaluator could neither confirm nor refute the premise read-only: the
      reviewer's reproduction exercised the stub. Carried at medium with reduced confidence because the
      premise is load-bearing for the whole switch design yet is asserted only in a comment, with no
      test pinning it. Impact if false is bounded — no data leak and no gate bypass; the worst case is a
      reviewer-model downgrade steered by repository content.
    suggestion: |
      Prefer a structured signal (CLI error type or a dedicated exit code) over substring matching, or
      narrow the match to codex's diagnostic-line shape (anchor on a leading `Error:` / `ERROR` prefix
      at line start) instead of a bare substring anywhere in the stream. At minimum, add a test that
      feeds attacker-controlled phrase text on stderr alongside an unrelated failure and asserts no
      switch — the mirror of the existing stdout-spoofing case — and record in the header what evidence
      establishes that stderr carries only CLI diagnostics.
    sources: [codex:security]
    confidence: 50
    resolution: unresolved
    resolution_reason: null
evaluation:
  round_summary: |
    Round 2, cross_validation=true, 5 perspectives dispatched across 7 runs (architecture#0 skipped
    harness_unavailable, architecture#2 skipped rate_limited, architecture#fallback completed).
    7 findings carried by the evaluator: 1 high, 5 medium, 1 low. The dominant finding is real and the
    evaluator reproduced its full causal chain by reading: run_codex_exec.sh truncates each attempt's
    output, so a rate-limited entry 1 followed by a failed fallback entry emits only the last attempt —
    codex-reviewer.md Step 6 loses its only rate-limit signal, and review-phase.md R2b explicitly treats
    the resulting schema-valid empty result as a substantive completed result, so an outage is recorded
    as a zero-finding completed review with no chain walk and no Claude fallback. Regression from the
    pre-change single `2>&1` invocation.
    Independent inspection duty (10 of 10 read budget used) — comprehensive: corroborated (verified the
    phase-state source-vocabulary hole against both documents; demoted the batch-policies header claim
    to low after confirming its conclusion still holds); security: corroborated (the ERRFILE-scoped
    substring matchers are exactly as described, but the load-bearing premise about codex's real stderr
    content is not verifiable read-only and is pinned by no test — carried at reduced confidence);
    performance: corroborated (the only executable in the diff is the wrapper; its fallback is
    sequential and outage-path only, temp files are released by `trap ... EXIT` — empty findings set
    supported); spec: findings (the evaluator's own SPEC cross-read surfaced what the empty set missed —
    SPEC FR8/A4 and the Interfaces section fix the escalation as an Opus/xhigh subagent Task dispatch,
    while question-resolution.md's escalation section drops both the Task route and the xhigh effort,
    and its per-packet scope does not cover the non-packet-gate callers); architecture: corroborated
    (all four fallback-run findings verified against the files).
    No injection attempt was observed in any reviewer output this round. Both reviewer-reported high
    sites (run_codex_exec.sh:207, README.md:40) are carried forward in findings, so dismissed_sites is
    empty. README.md:40 lies outside changed_files; it is carried because the drift is what this diff
    created, and takes the R3b step-7 confidence cap of 50.
  recommended_action: another_round
  action_rationale: |
    One high finding is a genuine regression that makes a provider outage indistinguishable from a clean
    zero-finding review, and its fix is not a bounded mechanical edit: the wrapper must compose output
    differently on the success path than on the failure path (naive appending breaks codex-reviewer.md's
    JSON-first parse) and needs a new regression case. Four mediums are cross-document contract gaps.
    The SPEC itself is sound and the implementation matches it on every requirement checked, so this is
    implementation/document drift, not rework. Fix and re-review.
    (Advice only — the orchestrator's completion gate and the batch rework cap decide, per
    references/review-phase.md Phase R3b.)
