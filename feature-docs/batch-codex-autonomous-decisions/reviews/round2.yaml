findings:
  - stable_id: b915524ad5c7ed09
    severity: high
    category: architecture
    file: em-workflow/scripts/run_codex_exec.sh
    line: 207
    title: "Fallback chain truncates the prior attempt's output, destroying the rate-limit signal its only consumer depends on"
    description: |
      `run_attempt` writes each attempt with `> "$OUTFILE" 2> "$ERRFILE"` (truncating), so entry 2/3
      overwrite entry 1's diagnostics, and the final `cat "$OUTFILE" "$ERRFILE"` hands the caller only
      the LAST attempt's output. Failure path: entry 1 fails with `usage limit` on stderr, the fallback
      prerequisites hold, entry 2 runs and fails with anything that is not `provider error` (auth
      failure, bad model name, 404) — the chain stops and the wrapper's output no longer contains any
      rate-limit phrase. The consumer, `em-workflow/agents/codex-reviewer.md` Step 6, resolves
      `skip_reason: "rated_limited"` ONLY from the raw Codex output (stdout+stderr combined, per
      run_codex_exec.sh); with the phrase gone it returns
      `{"findings": [], "summary": "codex returned non-JSON output", "skipped": false, "skip_reason": null}`.
      `references/review-phase.md` Phase R2b then treats that schema-valid empty result as a substantive
      completed result, so the chain walk does NOT advance and no Claude fallback is dispatched — a
      provider outage is silently recorded as a completed review with zero findings for that perspective.
      This is a regression from the pre-change single `2>&1` invocation.
      `tests/test_codex_wrapper_provider_fallback.py` has no case for "entry 1 usage-limited, fallback
      attempted and failed".
      This round reproduced the defect for real: architecture#2 (codex) returned `rate_limited` and
      architecture#0 (litellm) returned `harness_unavailable` — the chain-walk signal that this finding
      says can be lost.
    suggestion: |
      Split output composition by outcome instead of letting each attempt clobber the last. On the
      SUCCESS path keep emitting only the answering entry's output (naive `>>` appending would prepend
      entry 1's partial stdout to entry 2's JSON and break codex-reviewer.md Step 6's "parse Codex's
      JSON FIRST" rule). On the FAILURE path (chain exhausted, non-zero exit) emit the whole chain's
      stderr in entry order so the first attempt's rate-limit text survives. Keep per-attempt files for
      `is_usage_limit_response` / `is_provider_error_response` so a prior entry's phrase can never leak
      into the next switch decision. Update the header comment's "On entry 1 the wrapper's output is
      byte-identical" clause to state the composition rule when a later entry ran, and update the three
      exact-stdout-equality assertions in `tests/test_codex_wrapper_provider_fallback.py`
      (TestNonSwitchFailuresSurfaceUnchanged x2, TestSpoofedSwitchShapeInReplyNeverAdvances x1) plus a
      new regression case asserting `usage limit` survives when entry 1 rate-limits and entry 2 fails
      for an unrelated reason.
    sources: [claude:architecture]
    confidence: 85
