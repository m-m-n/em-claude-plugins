schema_version: 1
feature: batch-codex-autonomous-decisions
created: 2026-09-07
base_branch: main
goal: |
  em-workflow: --batch 指定時は判断の迷いを全て Codex と相談のうえ自律的に決める

  ## やりたいこと（必須）
  `--batch` 指定時は、判断の迷いを全て Codex と相談のうえ自律的に決めて続行する。`references/question-resolution.md` の即時 abort（`reversible: false`・`category: security`・`category: license`）を batch では廃止し、Codex 相談で決定を確定して先へ進む。決定と議論の要点は記録に残す。
  相談はClaude Codeが納得するまで行うが、1つの話題について5回目の呼び出しでも収束しない場合はClaude CodeがOpusのサブエージェントに議論で収束していない論点を伝え、決めてもらう
  この時、なぜその決定なのかもフィードバックしてもらう

  ## 背景・なぜ（必須）
  2026-09-04 18:39 JST、emterm の feature `ring-push-blank-clears-ridx-test` の create-spec で、requirements-analyst が仮定 A3 に `reversible: false` を付けたため fail-closed ゲートで即中断した。
  - `references/question-resolution.md` は、worker が不可逆と申告した質問について Codex 相談もポリシー参照も使えないと定めている。文書自身が「今は worker の申告以外に根拠が無い」と限界を認めている
  - チケットの申し送りに「不明瞭な点はセカンドオピニオンエージェントと議論して決定して良い」とあったが、orchestrator がそれを読む仕組みは無い
  - 結局、人が Codex と議論して同じ決定（強化する・両方の assert を残す）を Notion に書いて再実行しただけで、無人実行の意味が薄れた
  `--batch` は無人で回す前提なので、迷いは人に返さず、Codex と相談して比較的良いと考えられる案を採用して進める。

  ## 受け入れ条件 / 完了の定義（必須）
  - [ ] `--batch` 指定時、`reversible: false` の assumption に紐づく質問、`category: security`、`category: license` の質問はいずれも即時 abort せず、`references/question-resolution.md` の Codex 相談経路に入る
  - [ ] Codex 相談で決定に至らなかった場合も abort せず、副作用が最小の選択肢を採って続行する（既存の unlisted-gate fallback と同じ規則）
  - [ ] 決定した内容・採らなかった案・Codex との議論の要点を `feature-docs/{feature}/phase-state/batch-audit.yaml` に記録し、run 報告と Notion の進捗コメントに含める
  - [ ] interactive モード（`--batch` なし）の挙動は変えない。fail-closed の即時 abort は interactive にのみ残る
  - [ ] `references/question-resolution.md`・`references/batch-mode.md`・`references/batch-policies.yaml` の該当箇所を更新し、「Precedence reservation」など abort を非上書きと定めている記述を batch について書き換える
  - [ ] 検証: `reversible: false` を含む質問パケットを fixture で与え、`--batch` では Codex 相談を経て続行し、interactive では従来どおり abort することを確認する

  ## スコープ外（任意）
  - ディスパッチャのプロンプト補強（loop-develop に別タスクで起票）
  - interactive モードでの委任判定

  ## 制約・前提（任意）
  - Codex CLI 不在時はClaude CodeのサブエージェントをOpus/xhighで実行する
  - Codex CLIがあり、GPTがリミットの場合はGLM5.2 (Vertex AI)、Vertex AIがエラーの場合はMuse Sparkと2段階のフォールバックを持たせる
  - 記録は `references/phase-state.md` の batch audit record の形式に従う
