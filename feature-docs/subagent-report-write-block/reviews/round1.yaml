  title: 訂正入口のパッチが entries と requirements_patch を無制限に通す（TB-2 / TM-6 の脅威が残る）
  description: '訂正入口（create-plan: completed かつ implement: failed）で機械的に絞られているのは step_patches が空であることだけ。path_corrections
    で replace_all の許可条件を通した同じパッチに、任意の新規タスクと requirements_patch を載せても検証は通る。REQUIREMENTS_PATCH_SET_KEYS
    は status を含み、apply_patch はその値を要件へそのまま代入するので、set.status: excluded で要件を除外できる。agents/implementation-planner.md
    の「entries は merged なテストファイルの参照を直す新規タスクだけ」はプロンプト上の規則で、検証がない。条件 5 の比較対象は文書だけで workflow.yaml の requirements
    は見ない。develop の Step A.6 は対話・batch の両方で走り、新しいゲートもユーザーへの質問も入れないと明記しているので、信頼できない内容を読んだ planner が注入を受けると、承認なしでタスク追加と要件の除外が適用される。THREAT-MODEL.md
    の TM-6 が挙げる「path_corrections を replace_all の許可条件を通すために使う」に当たる。TM-6 に列挙された緩和策（状態の限定、step_patches 空、in_progress
    の拒否）は実装済みで、残っているのは entries / requirements_patch の経路。'
  suggestion: correction_entry が真のときに限って、次を機械的に拒否する。(a) requirements_patch は、新規 entries の id を載せる tasks_append
    以外のキーを持つものを拒否する。(b) entries の files は、ベースコミットに regular file として存在し、かつ本文に old_path か旧ファイル名を含むものだけを許す（base_tree_entry
    と _read_base_document で判定できる）。どちらも新しいエラーコードで報告する。再計画パスは対象にしない。src/d.py という無関係な新規ファイルの entry を通すことを固定している
    tests/test_final_path_correction.py の test_new_task_plans_under_entries_are_outside_the_set も合わせて見直す。
