schema_version: 1
feature: subagent-report-write-block
created: '2026-11-05'
base_branch: main
goal: 'em-workflow の実装者がファイル名の先頭が REPORT のレポートを Write できず implement が止まる


  ## 現象

  em-workflow の計画が、ファイル名の先頭が REPORT のレポートを実装者（サブエージェント）の成果物にすると、実装者の Write が毎回拒否されて
  implement が止まる。


  拒否の文面: Subagents should return findings as text, not write report files. Include
  this content in your final response instead.


  拒否するのは Claude Code 本体の Write ツールの入力検証。サブエージェントからの書き込みで、ファイル名が /^(REPORT|SUMMARY|FINDINGS|ANALYSIS).*\.md$/i
  に一致すると拒否する（2.1.318 のバイナリで確認）。hook でも permission でもないため、設定では通せない。


  ## 再現手順

  1. 計画の tasks.<id>.files に test-docs/<feature>/REPORT.md を持つ feature を /em-workflow:develop
  --batch で実行する。

  2. 実装者が Write でそのファイルを書く。

  3. 2 回とも上の文面で拒否され、batch の再試行を使い切って implement が failed_kind: decision で止まる。


  ## 期待する挙動

  計画に沿ったレポートの成果物を、実装者の Write の拒否で止まらずに親ブランチへ取り込める。計画済みの web-sip-phone の feature tcp-send-path-fr8-race-audit（test-docs/tcp-send-path-fr8-race-audit/REPORT.md）も再開できる。


  ## 完了の定義

  - [ ] 再現手順で現象が起きない

  - [ ] 再発を検出するテストがある

  - [ ] tcp-send-path-fr8-race-audit を再開する手順が決まっている


  ## 該当箇所

  - em-workflow 0.4.7: agents/implementer.md、skills/plan-writing/

  - Claude Code 2.1.318: Write ツールの validateInput（tengu_subagent_md_report_blocked）


  ## 実害・発生条件

  - 発生例: web-sip-phone のタスク（2026-11-05 22:52 JST と 23:00 JST の 2 回、セッション 01a1abf3-3f7c-7099-9d23-a944a388a119）

  - web-sip-phone の implementer 245 件のうち、この拒否を受けたのは上の 2 件だけ

  - 拒否の条件はファイル名だけで、置き場所と書き込み内容には依存しない。.md 以外、または先頭が 4 語以外の名前は一致しない

  '
