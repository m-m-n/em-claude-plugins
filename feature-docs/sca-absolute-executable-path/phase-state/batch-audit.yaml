  freeform: null
  normalized_answer: 子の PATH から相対・空の項目を除き、絶対パスの項目だけを元の順序で渡す。残らなければ PATH キーを渡さない
  resolution_note: 'relaxed route (category: security, batch). Codex consulted (harness:
    codex, 1 turn). Codex recommended drop_relative_entries: build_child_env copies
    PATH verbatim (:904) and the child runs in job cwd (:1366-1373); absolutizing
