    title: "Windowsで拡張子付きのスキャナーを検出できなくなる"
    description: "resolve_executable は各絶対パス項目について os.path.join(entry, name) の 1 候補だけを確かめる（808-814 行）。以前の shutil.which は Windows で PATHEXT の拡張子を補っていたため、絶対パスのディレクトリに govulncheck.exe / pip-audit.exe / cargo-audit.exe だけがある環境では、変更後は None になり、<ecosystem>_tool_not_found でスキャンが飛ばされる。結果は安全側（信頼できないファイルは起動しない）で、スキップ理由も記録される。SPEC は Windows を要件に含めておらず、IMPLEMENTATION.md のリスク表は Linux での運用を前提にしている。"
    suggestion: "Windows を対象外とするかどうかを先に決める。対象外にするなら resolve_executable の docstring に PATHEXT を補わないことを明示する。対象にするなら絶対パス項目だけを探す制約は残し、os.name == 'nt' のときだけ .exe の候補を確かめ、拡張子付きのファイルしか無いケースの回帰テストを足す。"
    sources: [codex:comprehensive]
    confidence: 60
    resolution: unresolved
    resolution_reason: "medium のため自動修正の対象外。Windows を対象にするかは範囲の判断が要るため別タスクとして起票する"
