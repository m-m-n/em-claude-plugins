schema_version: 1
feature: codex-guard-funcname-anon-always
created: '2026-10-24'
base_branch: main
goal: "# codex-hook-interactive-guard: 2 つ目以降の関数名の後の case と、匿名関数の本体の後の always を構文として読み、python3 -i を見逃す（回帰）\n\nNotion: <notion-url>\n\n## 現象 (必須)\n\nfeature `codex-guard-brace-case-group-depth` の review round 1 で出た security の medium 2 件。どちらも同 feature の変更（FR2 / FR3）で生じた回帰で、変更前は deny だった入力が無出力（判定不能）になる。\n\n`codex-hook-interactive-guard.py`（em-workflow / em-review の両コピー）の `$( )` の中の読みで、関数定義の頭部の状態の扱いが zsh の文法と合わない。\n\n1. 2 つ目以降の関数名の後の `case` を case 文として読む（拒否漏れの回帰）\n   - FR3 の実装は、2 つ目以降の名前を読んだ後も `HEAD_FUNCTION_NAME` とコマンド位置を保つ。そのため次の `case` を case 文の開始として読む\n   - zsh は関数名を incmdpos=0 で読むので、`function f g case { :; }` は有効な定義になる\n   - ガードは `case {` の後に `in` も単独の `{` も無いので判定不能になり、後続の `python3 -i` を拒否しない\n   - 変更前は `g` を単純コマンドの最初の語として読み、置換は `)` で閉じて deny していた\n2. 匿名関数の本体を閉じた `}` の後の `always` を予約語として読む（拒否漏れの回帰）\n   - コマンド位置の `}` はどの一覧でも `HEAD_GROUP_CLOSED` を立てるため、匿名関数（`function { :; }`、`function () { :; }`、`() { :; }`）の本体を閉じた `}` の後の `always` も予約語として読み、次の語をコマンド位置にする\n\
  \   - zsh は匿名関数の `}` の後を引数として読む。`always`・`{`・`case` はどれも普通の語になる\n   - 判定不能になる形のほか、置換の閉じの位置を誤って起動を項目本体の引用の中に入れ、無出力になる形もある\n\n## 再現手順 (必須)\n\n1. `tool_input.command` に次を設定した PreToolUse(Bash) の JSON をフックの標準入力へ渡す（コマンド自体は実行しない）\n2. `zsh -c 'echo \"$(function f g case { :; })\"; python3 -i'` → 無出力（期待は deny）\n3. `zsh -c 'echo \"$(function { :; } always case x)\"; python3 -i'` → 無出力（期待は deny）\n4. `zsh -c` の本文を `echo \"$(function { :; } always case x in x)\"; python3 -i; \";; esac)\"` にする → 無出力（期待は deny）\n5. `zsh -c` の本文を `echo \"$(function { :; } always { case y in y) echo '\"; python3 -i; \"';; esac; })\"` にする → 無出力（期待は deny）\n\n## 期待する挙動 (必須)\n\n- 最初の関数名の直後の扱い（SPEC A-4）は保ったまま、2 つ目以降の名前を読んだ後は、単独の `{` / `}`、空の `()`、区切り以外の語をすべて名前として読み、再現手順 2 を deny にする\n- 匿名関数の本体を閉じた `}` では `HEAD_GROUP_CLOSED` を立てず、その後の語を引数として読み、再現手順 3〜5 を deny にする\n- 既存の `{ :; } always { ... }` の silent の行は保つ\n\n## 完了の定義 (必須)\n\n- [ ] 再現手順で現象が起きない\n- [ ] 再発を検出するテストがある\n- [ ] `tests/test_codex_hook_interactive_guard.py` の `CASES`\
  \ に再現入力を追加し、両コピーに流す\n- [ ] 両コピーがバイト単位で同一のまま\n\n## 該当箇所 (任意)\n\n- `em-workflow/scripts/codex-hook-interactive-guard.py:2991`〜`:2998`（2 つ目以降の関数名の状態）、`:2887`〜`:2898`（`always` の予約語扱い）、`:2971`（コマンド位置の `}` で `HEAD_GROUP_CLOSED` を立てる箇所）\n- `em-review/scripts/codex-hook-interactive-guard.py`（同一内容）\n- 記録: `feature-docs/codex-guard-brace-case-group-depth/reviews/round1.yaml`（ブランチ `em-workflow/codex-guard-brace-case-group-depth/integration`）の findings `90ae5c1cbf88e0ee` / `c5da4b70ee651440`\n- feature `codex-guard-brace-case-group-depth` の SPEC A-4 / A-5 が受け入れた読みから生じている\n\n## 実害・発生条件 (任意)\n\n`$( )` の中で、複数名の関数定義の 2 つ目以降の名前に `case` 等を書いた場合、または匿名関数の本体の後の引数に `always` を書いた場合だけ。どちらも拒否漏れ（fail-open）で、無人実行が入力待ちで止まりうる。\n\n## 追加指示（起動時）\n\n- 実装完了後、integration ブランチを remote に push し、base_branch へ gh pr create で PR を作成する。integration ブランチはローカル・リモートとも残す（base_branch へ自動マージしない）\n- 不明点は Codex に相談し、比較的良いと判断された選択肢を採用する\n- その議論内容を Notion に記録する\n"
