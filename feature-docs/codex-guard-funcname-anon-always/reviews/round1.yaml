- stable_id: b98958fb18af13b8
  severity: medium
  category: security
  file: em-workflow/scripts/codex-hook-interactive-guard.py
  line: 3140
  title: 引数の位置の単独の `}` が匿名関数の本体の記録を取り除かず、後の外側の `}` が匿名の閉じと誤認されて always 以降の拒否が漏れる（この変更で生じた回帰）
  description: 'この変更で `{` 群の記録（`groups`）を持つようにしたが、zsh が既定（IGNORE_CLOSE_BRACES 未設定）で引数の位置でも閉じに使う単独の `}`（`function
    { : }` の `}`）では記録が取り除かれない。そのため形 (a) で積んだ匿名の本体の記録が残り、zsh では外側の普通の群を閉じるコマンド位置の `}` を、その記録を取り除く閉じとして読み、HEAD_ANON_ARGS
    を立てる。続く `always` `{` `case` は引数として読まれ、パターンの `)` が置換を閉じて引用の境界がずれ、後ろの `python3 -i` が silent になる。変更前は
    deny だったので、この変更が生んだ拒否漏れの回帰になる。`function () {` と `() {` の形でも同じ。両コピーで同じ。'
  suggestion: 'その一覧に開いた記録があるとき、引数の位置の単独・引用なし・エスケープなしの `}` でもその一覧の最も内側の記録を取り除く。匿名の本体なら匿名関数の引数の状態、普通の群なら群を閉じた状態にする。記録が無いときは今の読みのまま。`{
    function { : }; } always ...` を 3 つの形すべてで deny にする行を CASES に足し、docstring と HEAD_* 前のコメントも合わせて直す。両コピーをバイト単位で同一に保つ。'
  reproduction: 'Pythonの文字列 inner に `echo "$({ function { : }; } always { case x in x) echo ''"'';; esac;
    })"; python3 -i` を設定する。`command = ''zsh -c '' + shlex.quote(inner)` を作り、json.dumps({''tool_name'':
    ''Bash'', ''tool_input'': {''command'': command}}) を各ガードの標準入力へ渡す。入力は main → find_deny → _skip_substitution
    を通り、両コピーとも終了コード0・標準出力空となる。基準版では同じ入力を拒否する。実行可能性は、inner の `python3 -i` を `printf REACHED` に置換して `zsh
    -f -c` に渡すことで安全に確認でき、終了コード0でREACHEDが出力される'
  reproduction_alternates: []
