  title: 匿名関数の空の `()` と本体の `{` の間の `;` とコメントで頭部の状態が切れ、拒否漏れが残る（新しいテスト行がその読みを silent で固定している）
  description: 'zsh は関数定義の空の `()` の後で区切り（`;` と改行）とコメントを読み飛ばしてから `{` を本体として読むので、`() ; {`、`() # c` + 改行
    + `{`、`function () ; {`、`function () # c` + 改行 + `{` も匿名関数になる。この変更は改行だけで HEAD_ANON を保ち、`;` とコメントで落とすため、その後の
    `always` が予約語、`case` が case 文として読まれ、zsh が後ろの起動を実行する入力が silent になる。変更前も silent だった既存の漏れだが、tests/test_codex_hook_interactive_guard.py
    の 1351-1353 行がこの読みを silent で固定している。`function` + 改行 + `{` と `function ; {` も同じ原因（変更前から）。'
  suggestion: HEAD_ANON の間は改行に加えて `;`（`;;` `;&` `;|` は除く）とコメントでも状態を保ち、次の単独の `{` を匿名関数の本体として読む。HEAD_FUNCTION
    の直後の改行と `;` も同じ扱いにする。テスト 1351-1353 行の期待値を deny に替え、docstring rule 6 / rule 7、HEAD_* 定数前のコメント、TestHeadStateComment
    / TestSubstitutionSkipDocumentation の期待文字列も直す。両コピーを同一に保つ。
