    packet_id: create-spec-q0001
    answered_at: "2026-08-25T23:17:04+09:00"
    source: batch-codex-consultation
    answer_mode: select_or_freeform
    selected_option_ids: [treat_as_phase_done]
    freeform: null
    normalized_answer: >-
      implement I.2.c の route back to planning と rework の spec-change 遷移も
      1 フェーズ完了として扱い、patch 適用とコミットが済んだ時点でターンを終える。
    resolution_note: >-
      gate create-spec.requirement-clarification / policy action
      codex_consultation。Codex は「--once は completed 状態遷移ではなく
      1 フェーズを約束するもので、両遷移は routing 変更のコミット後に
      当該フェーズを明示的に終える」と判断。orchestrator が option_id
      treat_as_phase_done への写像を確認して採用。record_as_assumption: true。
  requirement.phase-done.step-field-value:
