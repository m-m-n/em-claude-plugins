lessons_candidates:
  - id: L1
    severity: high
    note: >-
      `git stash` は refs/stash という **リポジトリ単位の単一 ref** で、worktree ごとに
      分かれていない。並列 implementer が tdd-testing の「baseline を stash して赤を確認する」
      手順を同時に実行すると、互いの working tree の変更を取り違えて pop したり、
      相手の stash を消したりする。ラウンド 1 で task0001 と task0003 が実際に衝突し、
      両者とも自力で差分を再構成して復旧した（マージ結果には影響なし）。
      対策候補: worktree-task-workflow または tdd-testing スキルに「並列 worktree では
      bare `git stash` を使わない。`cp` で退避 → `git show HEAD:<path> > <path>` で戻す →
      検証 → 退避を戻す」を明記する。ラウンド 2 以降は orchestrator が
      dispatch prompt に注意書きを足して再発しなかった。
  - id: L2
    severity: medium
    note: >-
      implement-phase.md I.2.b step 4 は merged タスクの後片付けに `git branch -D` を
      指定しているが、destructive-guard がこれを弾く（deny）。integration worktree の
      HEAD は integration ブランチなのでタスクブランチは到達可能であり、
      `git -C {integration worktree} branch -d` で問題なく削除できた。
      対策候補: I.2.b step 4 を `-d`（integration worktree から実行）に書き換える。
      現行のコメントは「orchestrator の HEAD は base_branch なので -d は拒否される」と
      説明しているが、`-C` で integration worktree を指定すればその前提は成り立たない。
  - id: L3
    severity: medium
    note: >-
      orchestrator が workflow.yaml の step ブロックを素朴な文字列置換で書き換えた結果、
      implement step に `completed_at_commit` が重複するキーとして残った。
      PyYAML の safe_load は後勝ちで古い値を採用するため、以降の読み取りがすべて
      誤った値を見ていた。rework-planner が入力欠陥として報告して発覚。
      対策候補: develop の Step B に「step の status 更新は YAML をパースして書き戻す
      （行の文字列置換で済ませない）」を明記するか、commit-docs.sh に重複キー検査を足す。
  - id: L4
    severity: high
    note: >-
      ラウンド 1 の high 3 件の根本原因は、task0003 の計画書（tasks/task0003.md の
      「変えてはならないもの」リスト）が「`none` が `state=completed` 専用の予約値で
      あること」を保持せよと指示していた点にある。同じタスクが `state` の値域を広げる
      のだから、この 2 つは両立しない。実装者は指示に忠実に従っただけ。
      対策候補: plan-writing スキルに「値域を広げるタスクでは、その値域に依存する
      他フィールドの記述を『変えてはならないもの』に入れない。widening と freeze を
      同一タスクに同居させない」を追加する。
  - id: L5
    severity: medium
    note: >-
      R4 の conflict 分類は「diff 形状と prose 形状の混在」を機械的に conflict とする。
      ラウンド 2 では 2 観点が**同一の修正**を提案していたのに、片方が diff、片方が
      prose だったため conflict になり、batch 規定でサイトごとスキップされた。
      結果として本物の high が自動修正されず、verify rework まで持ち越された。
      対策候補: review-phase.md R4 に「同一サイトで diff 1 件 + prose n 件のときは
      diff を採用して auto-applicable にする」旨の規則を足すか、レビュアー側に
      suggestion 形状の統一（常に diff）を課す。
  - id: L6
    severity: medium
    note: >-
      review-editor は単一ファイル限定なので、「文書とそれを pin しているテストモジュール」を
      同時に直す必要がある finding は R4 では原理的に修正できない。ラウンド 2 の
      77ba577919799b8a は editor が applied を返しスコープ検証も通ったが、
      tests/test_develop_once_option.py の 3 アサートを落としたため復元・abort した。
      対策候補: R4 の候補ゲートに「finding の修正が finding.file 以外の変更を要すると
      判断できる場合は needs-judgment ではなく rework に回す」判定を足すか、
      R4 適用後にプロジェクトのテストコマンドを走らせて赤なら自動 revert する手順を
      明文化する（現在の scope verification はファイル集合しか見ていない）。
  - id: L7
    severity: medium
    note: >-
      クロスモデル spec レビュアー（vertex-deepseek-v3.2）はラウンド 1 で 5 件すべて
      誤検知だった（うち 1 件は critical）。いずれも diff の `-` 行（削除済みの旧文言）を
      現行内容と読み違えたもの。vertex-reviewer エージェント自身が「4 件は誤読に見える」と
      注記を添えており、その注記が無ければ orchestrator の裏取りコストはさらに高かった。
      ラウンド 2 では同モデルが 0 件（正しく解消を確認）。
      対策候補: cross-model reviewer のプロンプトに「diff の `-` 行は削除済みであり
      現行内容ではない。指摘する前に現行ファイルの当該行を引用すること」を明記する。
      ラウンド 2 ではこの旨を prompt に足したところ誤検知が消えた。
  - id: L8
    severity: low
    note: >-
      rework-planner が返した patch_id `develop-once-option-p0001` が、create-plan
      フェーズの patch_id と衝突した（phase-state のファイルは別だが、
      references/phase-state.md の ID 一意性は feature 単位）。orchestrator 側で
      `develop-once-option-rw0001` に振り直して記録した。
      対策候補: rework-planner の contract に patch_id の命名規則（フェーズ接頭辞）を足す。
  - id: L9
    severity: low
    note: >-
      spec-writer / implementation-planner / rework-planner は Bash ツールを持たないため
      `written_artifacts` の sha256 を常に null で返す。契約は digest を必須にしているが
      構造上満たせない。毎回 orchestrator が実ファイルから計算して補完した。
      対策候補: 各 contract の `written_artifacts` に「digest は orchestrator が
      補完する。worker が計算手段を持たない場合は null でよい」と明記する。
