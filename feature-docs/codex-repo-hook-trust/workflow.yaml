schema_version: 1
feature: codex-repo-hook-trust
created: '2026-10-05'
base_branch: main
goal: '# --dangerously-bypass-hook-trust がリポジトリ側 Codex 設定の hook を信頼確認なしで動かすかを確かめ、塞ぐ


  Notion: https://www.notion.so/3ef3509ec8ee81b3b0adf398dadc1bbf

  種別: セキュリティ


  ## 脆弱性の概要 (必須)

  `run_codex_exec.sh`（em-workflow / em-review）が `codex exec` に付ける `--dangerously-bypass-hook-trust` が、ラッパーが渡す hook だけでなく、レビュー対象リポジトリ側の Codex 設定にある hook まで信頼確認なしで実行させる可能性がある。Codex 0.160.0 で実挙動を確認していない（THREAT-MODEL.md の TB-3 の未解決事項）。

  ## 参照 (必須)

  - CVE / GHSA ID: 該当なし

  - アドバイザリ URL: 該当なし

  - severity: medium

  - 該当パッケージ: 該当なし

  - 現在のバージョン: Codex CLI 0.160.0

  - 修正済みバージョン: 無し

  ## 攻撃シナリオ (必須)

  レビュー対象のリポジトリが作業ディレクトリ側の Codex 設定（`.codex/` 等）に hook を持ち込む。`--litellm` 経路はユーザー設定を読むため、そのプロジェクトが信頼済みだと、持ち込まれた hook が信頼確認なしに Codex レビュアーの環境で実行される。

  ## 影響範囲 (必須)

  レビューを実行するユーザーの権限で、レビュー対象リポジトリが用意した任意のコマンドが hook として実行されうる。em-workflow の review フェーズ・em-review の Codex レビュアーの両経路が該当する。

  ## 完了の定義 (必須)

  - [ ] 攻撃シナリオが成立しない

  - [ ] 修正版に追随している（修正版が無い場合は暫定緩和策の欄に対応を記載）

  - [ ] 既定経路と `--litellm` 経路のそれぞれで、作業ディレクトリ側の hook 定義が実行されるかを Codex 0.160.0 で確かめた記録がある

  - [ ] 実行される場合はその層を読まない起動に変え、リポジトリ側の hook が実行されないことを確かめるテストがある。実行されない場合は THREAT-MODEL.md の TB-3 に記録する

  ## 該当箇所 (任意)

  - `em-workflow/scripts/run_codex_exec.sh:203`（`HOOK_FLAG` の組み立て）

  - `em-review/scripts/run_codex_exec.sh`（同じ構成）

  - review round 1 の指摘 4f3a287a7676c073。PR https://github.com/m-m-n/em-claude-plugins/pull/86 の push 時の自動セキュリティ確認も同じ点を指摘した

  ## 暫定緩和策 (任意)

  信頼していないリポジトリに対して Codex レビュアーを走らせない。


  ## 追加指示（起動者）

  - 実装完了後、integration ブランチを remote に push し、gh pr create で base_branch への PR を作る。integration ブランチはローカル・remote とも残す（base_branch へ自動マージしない）。

  - 不明点は Codex に相談し、相対的に良いと判断した案を採用する。

  - その議論の内容を Notion に記録する。

  '
