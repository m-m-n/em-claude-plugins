    title: "相対リンクの行き先を /proc・/dev/fd 配下と字句判定して誤って拒否する"
    description: "_stage_walk_refuses は os.readlink() の戻り値を、絶対か相対かを区別せずに _under_proc_or_dev_fd(target) で判定している（317-318 行）。そのため、行き先が相対の proc、./proc、proc/...、dev/fd のリンクは、エリア内の普通の <area>/proc や <area>/dev/fd を指していても refuse になる。例: <area>/proc が実ディレクトリで <area>/alias -> proc のとき、is_below('<area>/alias', area) は変更前は True、変更後は False になる。判定は安全側に倒れ、セキュリティ上の穴ではないが、FR1 の『ルート直下にない proc・dev/fd という名前のディレクトリは除外しない』と FR4 に反する回帰になっている。"
    suggestion: "字句判定 _under_proc_or_dev_fd(target) は target が絶対パスのときだけ適用する（または削除してリセット後の段階の検査に任せる）。相対の行き先（proc、./proc、dev/fd）で is_below が True になる回帰テストを追加し、絶対の行き先の既存ケースは False のまま維持する。"
