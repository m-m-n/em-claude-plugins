schema_version: 1
feature: cd-prefix-process-dependent-paths
created: '2026-10-29'
base_branch: main
goal: |
  bash_guard.py の cd 前置形の許可で、/proc/self/cwd のようなプロセス依存パスをフック自身のプロセスで解決し、許可領域外への移動を許し得る

  種別: セキュリティ（severity: low）

  ## 脆弱性の概要

  bash_guard.py の cd 前置形の許可で、`/proc/self/cwd` のようにプロセスごとに解決先が変わるパスを、フック自身のプロセスで解決して判定している。フックと Bash の cwd が異なると、Bash は許可領域（`.claude/worktrees/em-workflow/`）の外へ移動したうえで承認済みコマンドを実行し得る。

  ## 攻撃シナリオ

  `cd "/proc/self/cwd/../tests" && <承認済みコマンド>` のような形で、論理パスが存在しないため物理パスへのフォールバック分岐に入る。フックのプロセスでは物理パスが worktree 配下（許可領域内）に解決されて allow になる一方、cwd が異なる Bash ではメイン作業ツリー側（許可領域外）へ移動して承認済みコマンドを実行する。

  前提（フックのプロセスの cwd と Bash の cwd が異なる）が実際の起動で成り立つかは確認されていない。同じ種類の抜け道（`/proc/self/cwd/<名前>`）は物理パスへのフォールバックを入れる前からある。

  ## 影響範囲

  承認済みコマンドが、許可領域の外の作業ディレクトリで自動許可されて動く。実行されるのは承認済みの文字列だけ。

  ## 完了の定義

  - [ ] 攻撃シナリオが成立しない
  - [ ] 修正版に追随している（修正版が無い場合は暫定緩和策の欄に対応を記載）
  - [ ] `/proc/self/cwd`・`/proc/thread-self`・`/proc/self/fd`・`/dev/fd` のようなプロセス依存のパスを cd 前置形の許可でどう扱うかを SPEC で決め直す（`/proc/self/root/..` を前に置く形を残すかどうかも同じ改定で決める）
  - [ ] フックのプロセスの cwd と入力の cwd が異なる場合の回帰テストがある

  ## 該当箇所

  `em-workflow/hooks/bash_guard.py` の `is_below()`（物理パスへのフォールバック分岐）

  ## 暫定緩和策

  feature is-below-physical-fallback の SPEC A3 で「解決先がプロセスごとに変わるパスは特別扱いしない」と範囲外にした。review round 1 で security レビュアーが報告し、evaluator が low に下げた指摘。
