    file: tests/test_plan_path_backslash_binding.py
    line: 129
    title: "Windows でテストのデコイが一時ディレクトリの外に書き込まれる"
    description: "`temporary_fixture()` の既定は `with_decoy=True` で、`Fixture.__init__` は `self.tasks_dir / DECOY_NAME` に書き込む（129〜133 行）。Windows では pathlib が `\\task0003.md` をドライブ相対のルート付きパスとして扱うため、結合結果は `C:\\task0003.md` になる。TestModuleHygiene の 3 つのテスト（401、413、422 行）はスキップ条件なしで既定の `temporary_fixture()` を呼ぶので、Windows ではドライブ直下へ書き込もうとする。権限がなければ PermissionError で失敗し、権限があればファイルを作成または上書きし、後処理でも消えない。401 行のテストが一時ディレクトリ内にあることを確かめるのは `feature_dir`、`tasks_dir`、`task_file` だけで、`decoy_file` は含まれない。そのため、モジュールの docstring にある「デコイは一時ディレクトリ内にだけ作る」という AC-5 の主張は、この環境では破れていても検出されない。Linux では影響しない。"
    suggestion: "`temporary_fixture` の既定を `with_decoy=False` にし、`@needs_decoy` が付いたテストからだけ `with_decoy=True` を渡す（AC-4 のテストは既に `with_decoy=not BACKSLASH_IS_SEPARATOR` を渡している）。あわせて `Fixture.__init__` 側でも、`BACKSLASH_IS_SEPARATOR` が真のときはデコイを作らないようにする。さらに、デコイが作られた場合は 401 行の包含チェックに `fx.decoy_file` を加える。"
    reproduction: null
    reproduction_alternates: []
    reproduction_overflow: false
