    Codex に相談した。Codex は root_only を推した: 検証側と実装担当が同じファイルを参照する。既存テストが ./ やバックスラッシュ等の別綴りの受け入れを固定しており、拒否規則を足すと検証済みの計画が起動時に止まる。オーケストレーターは
