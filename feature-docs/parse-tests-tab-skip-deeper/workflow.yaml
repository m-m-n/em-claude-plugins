schema_version: 1
feature: parse-tests-tab-skip-deeper
created: '2026-10-10'
base_branch: main
goal: |
  # tests_yaml_id_resolution の parse_tests で、先頭のタブ行の直後にタブ無しの深い続き行があると skip_deeper が後ろの読める ID まで読み飛ばす

  Notion: https://www.notion.so/3f53509ec8ee81299204f23bb8238a0f

  ## 現象 (必須)
  記録検査 `tests/test_tests_yaml_id_resolution.py` の `_RecordParser.parse_tests` で、tests ブロックの先頭の行がタブ行で、その直後にタブの無い深い続き行が来ると、`skip_deeper(f + 1, key_indent)` が続き行だけでなく後ろの読める ID 行まで読み飛ばし、それらが解決対象から消える。
  feature `parse-tests-tab-held-id`（PR https://github.com/m-m-n/em-claude-plugins/pull/134 ）の SPEC Assumption A1 で範囲外とした、変更前からある欠陥。元は feature `parse-tests-tab-handling` のレビュー round 1 で low に下がり除外された指摘。
  ## 再現手順 (必須)
  1. `extract_text` に、`acceptance_tests:` / `  AC-1:` / `    tests:` / `      <タブ>- tests.nope.bad` / `        continued` / `      - tests.nope.after` を渡す
  2. `AC-1` の ID が `[]` になり `tests.nope.after` が含まれない（integration ブランチ `em-workflow/parse-tests-tab-held-id/integration` の時点で確認。エラーは `tab in indentation`（4 行目）と `tests value is not a block sequence of scalars`（5 行目）の 2 件）
  ## 期待する挙動 (必須)
  - 先頭のタブ行の続き行だけを読み飛ばし、後ろの読める ID（`tests.nope.after`）は解決対象に残す
  ## 完了の定義 (必須)
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある
  ## 該当箇所 (任意)
  - `tests/test_tests_yaml_id_resolution.py` の `_RecordParser.parse_tests`（先頭のタブ行の分岐にある `skip_deeper(f + 1, key_indent)`）
  ## 実害・発生条件 (任意)
  タブを含む誤った記録を書いたときだけ起きる。タブ行のエラーは出るので記録検査が誤って通ることは無いが、抽出エラーと解決エラーを 1 回の失敗メッセージに並べる目的が、この形では果たせない。
