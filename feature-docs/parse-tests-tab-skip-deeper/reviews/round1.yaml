  file: tests/test_tests_yaml_id_resolution.py
  line: 644
  title: "キーより浅いタブ行の続き行の読み飛ばしが、後続の兄弟フィールド（2 つ目の tests キー）まで消費する"
  description: |-
    最初の項目より前の走査で、続き行の読み飛ばし範囲が `skip_deeper(f + 1, tab_indent, limit)` になっていて、タブ行の深さだけを境界にしている。タブ行が `tests` キーより浅い場合（例: キー 4 空白、タブ行 3 空白）は、続き行（6 空白）の後にある、`tests` キーと同じ深さの行（4 空白の兄弟フィールド）まで読み飛ばしてしまう。

    次の記録でコードを追った。`acceptance_tests:` / `  AC-1:` / `    tests:` / `   \t- tests.nope.bad` / `      continued` / `    tests: [tests.nope.second]`
    - 変更前: `tests.nope.second` が抽出され、`duplicate tests key` も報告される。
    - 変更後: エラーは 4 行目のタブと 5 行目の deeper の 2 件だけになる。2 つ目の tests キーとその ID は報告なしで消え、その ID の解決エラーも出ない。

    キーと同じ深さのダッシュ項目（`    - tests.nope.after`）も同じく報告なしで読み飛ばされる。続き行と判定する条件（637〜642 行）は `scan_indent > key_indent` を要求するので、キーと同じ深さの行は続き行にならない。ところが読み飛ばし範囲ではその行を続き行として消費しており、両者が食い違っている。SPEC の目的「続き行だけを読み飛ばす」にも合わない。

    SPEC の FR1 と task0001 計画の表の行 2 は「直前のタブ行より深い後続行を読み飛ばす」と書いていて、実装はその文言どおりになっている。つまり、タブ行がキーより浅い場合を仕様が想定していなかった抜けでもある。記録検査はタブと deeper のエラーで失敗するので、検査がすり抜けることはない。影響は報告の抜けに留まる。
  suggestion: |-
    読み飛ばしの境界を `max(tab_indent, key_indent)` にする（`f = self.skip_deeper(f + 1, max(tab_indent, key_indent), limit)`）。

    docstring と、最初の項目より前の走査のコメントにある「the lines deeper than that tab line are passed over」を、「タブ行と `tests` キーの両方より深い行を読み飛ばす」という意味に書き直す。

    `TestTabLinesInTestsBlock` に回帰テストを足す。キーより浅いタブ行、続き行、キーと同じ深さの 2 つ目の `tests` キー（およびキーと同じ深さのダッシュ項目）を組み合わせる。

    今回追加されたテストはどれもタブ行が 6 空白以上なので、この修正で期待値は変わらない。
