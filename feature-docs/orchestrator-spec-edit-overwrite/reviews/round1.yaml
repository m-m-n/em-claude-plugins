  title: 記録する digest が、修正前から文書にあった他者の編集まで上書きできる版にしてしまう
  description: Step B の記録手順は、修正後の文書全体の digest を条件なしで記録する。修正前の文書が phase-state/create-spec.yaml のそのパスの最後の artifacts エントリと一致するか、既存の orchestrator_doc_edits の最後のエントリと一致するかは確かめていない。ユーザーが create-spec の後に SPEC.md へ要件を追記し、その後 create-plan 中にオーケストレーターが別の段落だけを直すと、追記を含む全文が (b) の記録になる。次の create-spec では replace_own が選ばれ、上書き確認を通らない。exit 4 の再試行（657〜660行）でも同じことが起きる。最新 tip から取り込んだ他者の並行コミットの内容も記録の digest に入る。同じ修正がすでに入っていて差分が出ない場合も、手順は記録を追記するよう指示している。comprehensive#0 の high 指摘は同じ原因なので、この項目にまとめた。SPEC の Objective 2 と US2（ほかの経路で変わった SPEC.md は従来どおり digest-mismatch 分岐で守る）と食い違う。手順を読んで再現を確認した。発生には、create-plan の前か最中に同じ文書が別の経路で変わっている必要があるので、medium とした。
  suggestion: 記録を追記する条件を加える。修正前の文書の digest が、(a) create-spec.yaml のそのパスの最後の artifacts エントリ、または (b) 既存の orchestrator_doc_edits のそのパスの最後のエントリと一致するときだけ記録する。一致しないときは記録しない。この場合、次の create-spec は従来どおり digest-mismatch 分岐に入る。exit 4 の再試行でも、最新 tip の修正前の文書で同じ確認をやり直し、修正で差分が生じないときは記録しない。FR1 の記録条件を狭める変更なので、SPEC の FR1 と A-10 の記述も合わせて直す。
  reproduction: ユーザーが独自の要件を追記した SPEC.md を入力に、create-plan でオーケストレーターが別段落の誤字だけを修正するケースを追う。647〜655行では要件と誤字修正の両方を含む全文が記録される。次の create-spec ではその記録に一致して `replace_own` が選ばれ、要件を含まない分析結果から仕様書を再生成しても上書き確認が発生しない。
