schema_version: 1
feature: orchestrator-spec-edit-overwrite
created: '2026-11-27'
base_branch: main
goal: '# em-workflow: create-plan でオーケストレーターが直した SPEC.md が、spec-change 後の create-spec 再実行で digest 不一致として preserve になり batch が止まる


  種別: バグ


  ## 現象


  バッチ実行で、create-plan 中にオーケストレーターが Codex 相談を経て SPEC.md を直してコミットすると、その後 review の rework で spec-change 遷移（change-spec）が決まって create-spec を再実行したとき、SPEC.md の現ダイジェストが「直前の同フェーズ出力」（前回の create-spec の spec-writer
  出力）と一致しない。spec-writer-contract.md の「How the orchestrator chooses each target''s action before dispatch」で digest-mismatch 分岐に入り、バッチ方針 `create-spec.artifact-overwrite: preserve_and_reuse` により SPEC.md が
  `preserve` になる。決定済みの SPEC 変更を書けず、オーケストレーターは `unmapped_stop` で停止する。


  ## 再現手順


  1. バッチ実行の create-plan で、オーケストレーターが SPEC.md を直してコミットする（例: 計画と SPEC の TS-4 の食い違いを Codex 相談で B 採用）

  2. review で high の指摘が出て、rework-planner が `rework.spec-change` を返し、change-spec が採用される

  3. create-spec が `needs_update` で再実行され、spec-writer の起動前の書き込み方針決定で SPEC.md が digest 不一致となり、`preserve_and_reuse` で停止する


  ## 期待する挙動


  オーケストレーター自身がバッチ内で承認・コミットした SPEC.md の変更は、spec-change 再実行の書き込み方針決定で上書きしてよい版として扱われ、決定済みの SPEC 変更が書き込まれる。ほかの経路（人の手による変更など）で変わった SPEC.md は、従来どおり digest-mismatch 分岐で守られる。


  ## 完了の定義


  - [ ] 再現手順で現象が起きない

  - [ ] 再発を検出するテストがある


  ## 該当箇所


  - `em-workflow/references/contracts/spec-writer-contract.md`（How the orchestrator chooses each target''s action before dispatch / write_policy actions）

  - `em-workflow/references/artifact-digest.md`

  - `em-workflow/skills/develop/SKILL.md`（rework の spec-change 遷移、create-plan での SPEC 修正の記録）


  ## 実害・発生条件


  別の feature が create-spec 再実行で停止している。SPEC.md の現ダイジェスト sha256:802788d2…、直前の create-spec 出力 sha256:89d3af82…。


  ## 追加指示


  - 不明点は Codex に相談し、比較して良い方の選択肢を採る。相談内容は Notion のタスクページに記録する。

  - 実装完了後は integration ブランチを remote に push し、base_branch への PR を gh pr create で作る。integration ブランチはローカル・リモート両方に残す（base_branch へ自動マージしない）。

  '
