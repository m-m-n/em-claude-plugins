  evidence: バッチでは分類ゲートが続行を決めると、rework が create-spec を needs_update にして再実行する（em-workflow/skills/develop/SKILL.md:562–584、em-workflow/references/rework-task-synthesis.md:319–342）。再実行時も直前の同フェーズのワーカー出力と照合するため、ダイジェストが異なる既存
    SPEC.md はバッチ方針の preserve_and_reuse に従い、読み取り専用の preserve になる（em-workflow/references/phases/create-spec-phase.md:183–198、em-workflow/references/contracts/spec-writer-contract.md:69–74、137–159、em-workflow/references/batch-policies.yaml:34–44、74–77）。unmapped_stop
    は個別の理由に当てはまらない停止の既定値で、報告された実行は再現していない（em-workflow/references/batch-terminal-line.md:294–304）。create-plan
    でオーケストレーター自身が承認・コミットした当該 feature の SPEC.md を記録し、再実行時に参照する仕組みは確認できなかった。SPEC.md
    は通常の計画作成では入力であり、artifacts はワーカーの written_artifacts を記録する。self_write_set はワーカーの起動から復帰までに観測した書き込みを対象とし、入力ダイジェストの比較に使う（em-workflow/references/phases/create-plan-phase.md:187–206、299–318、em-workflow/references/artifact-digest.md:121–147、em-workflow/references/phase-state.md:139–141、em-workflow/scripts/self-write-digest.py:304–350）。既存テストが確認するのはファイルのハッシュ計算、計画作成ワーカーの復帰時の照合、create-plan
    自体の上書き判定で、この再実行経路の回帰テストは確認できなかった（tests/test_artifact_digest_script.py:172–212、tests/test_self_write_digest.py:1244–1271、tests/test_artifact_digest_docs.py:1708–1731）。見積もりは、承認した
    SPEC.md の変更とダイジェストを同じコミットで記録し、再実行時に対象 feature・パス・直前の create-spec 出力との対応と現ダイジェストの一致を確認して、既存の
    replace_own を使う案に基づく。判定規則に直接つながる変更箇所は、create-plan の記録、phase-state の定義、ダイジェストの定義、create-spec
    の起動手順の4箇所。既存のハッシュ計算とワーカーへの入力形式を使い、回帰テストには記録との一致、記録なし、記録後の別経路による編集、古い記録の4ケースを見込む（em-workflow/scripts/artifact-digest.py:129–137、em-workflow/scripts/commit-docs.sh:153–176、em-workflow/references/contracts/spec-writer-contract.md:54–74）。
