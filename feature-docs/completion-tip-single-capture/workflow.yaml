schema_version: 1
feature: completion-tip-single-capture
created: '2026-10-23'
base_branch: main
goal: |
  # em-workflow: Step I.3 の completed_at_commit と COMPLETION_TIP が同一 capture 由来にならず SPEC FR3 の literal 未達

  Notion: <notion-url>  (種別: バグ)

  ## 現象 (必須)

  `em-workflow/references/implement-phase.md` の Step I.3、1092-1093 行は `$COMPLETION_TIP` と
  `completed_at_commit` が「both derived from the same step-1 capture」なので SAME commit を指す、
  と断言している。しかし step 3 が書けと言う `completed_at_commit` の値は、ピン留め文の中の
  `$(git rev-parse "em-workflow/{feature}/integration")` という独立したコマンド置換であり、
  step 1 の `COMPLETION_TIP=` とは別の rev-parse 呼び出しになる。
  指示どおりに実行するエージェントは rev-parse を 2 回走らせることになり、不変条件は文書の主張で
  あってコマンド列の帰結ではない。SPEC FR3 は「both derive from that same step-1 capture」を
  明示要求し、FR4 はピン留め文の改変を禁じている。

  ## 再現手順 (必須)

  1. `em-workflow/references/implement-phase.md` の Step I.3 冒頭、step 1 の `COMPLETION_TIP=` の捕捉を読む
  2. 同じ節の step 3 が指示する `completed_at_commit` の値の書き方を読み、ピン留め文の中で独立した `$(git rev-parse ...)` になっていることを確認する
  3. 1092-1093 行の「both derived from the same step-1 capture」という主張が、step 1 と step 3 のコマンド列からは導けないことを確認する

  ## 期待する挙動 (必須)

  `$COMPLETION_TIP` と `completed_at_commit` の値の出所が 1 箇所に確定し、SPEC FR3 の
  literal 要求（both derive from that same step-1 capture）が文面から追えること。FR4 の
  ピン留め文はバイト単位で維持されること。

  ## 完了の定義 (必須)

  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある

  ## 該当箇所 (任意)

  - `em-workflow/references/implement-phase.md:1092` — Step I.3 の不変条件の主張
  - `em-workflow/references/implement-phase.md` — Step I.3 step 1 の `COMPLETION_TIP` 捕捉と step 3 の書き込み指示
  - `feature-docs/exit4-tip-argument/SPEC.md` — FR3 / FR4

  ## 実害・発生条件 (任意)

  実害は限定的。値がずれた場合は `commit-docs.sh` が exit 4 で拾う。

  出典: PR #17 (feature `exit4-tip-argument`) review round 2 の未解決 medium
  `ec70b86d6085827e`（confidence 70）。記録は `feature-docs/exit4-tip-argument/reviews/round2.yaml`。

  推奨対応: AC-3 でバイト一致を要求されているピン留め文は触らず、step 3 に
  `completed_at_commit` は `$COMPLETION_TIP` の値である旨を書いて、値の出所を 1 箇所に確定させる。

  ## 追加指示（起動引数より）

  - 実装完了後、integration ブランチを remote に push し、base_branch に対して gh pr create で PR を作る。integration ブランチはローカル・リモートとも残す（base_branch へ自動マージしない）。
  - 不明点は Codex に相談し、比較的よいと判断された選択肢を採用する。
  - その議論内容を Notion に記録する。
