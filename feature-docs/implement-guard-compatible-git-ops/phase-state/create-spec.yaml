    normalized_answer: 'I.2.a resume guard / I.2.c route-back の未マージ片付け（worktree remove
      --force / branch -D）は範囲外とし、既知の未対応として後続タスクに起票する。Codex: batch 経路はこれらの操作を通らず、未マージ内容の扱い変更は分離できる。延期箇所を完了扱いにしないこと。'
    resolution_note: 'codex_consulted: true (harness entry: codex, 2 turns, converged);
