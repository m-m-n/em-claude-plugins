  description: '再現判定は reproduced。手順はコードの読解だけで追い、実行していない。_correction_entries_errors は entry.plan が指すファイルだけを正規本文と比較し(2290-2300行)、plan の値と tasks/{T}.md を結び付ける検査は検証器に無い。登録外の tasks/{T}.md は条件5の文書集合にも入らない。一方 em-workflow/references/implement-phase.md:466 の task_plan_path は tasks/{T}.md 固定なので、plan を別名にすると、TM-11 が検査した本文と実装担当が読む本文が別物になる。前提は tasks/ に任意のファイルを書ける計画担当であり、TB-3 が想定する脅威に当たる。留保: create-plan-phase.md:103-107 は implement フェーズが tasks.{T}.plan から解決すると書いており、implement-phase.md と矛盾している。task_plan_path を組み立てるスクリプトは無いので、どちらが効くかはオーケストレーターの文書の読み方で決まる。この矛盾は今回の差分より前からある。'
  suggestion: 正規本文を検証したファイルと起動時の task_plan_path が必ず一致するようにし、拒否を回帰テストで固定する。implement-phase.md:466 を tasks.{T}.plan から解決する形に揃えるのが根本対応になる。同ファイルは SPEC の File Structure に無いので、範囲内で閉じるなら、訂正入口で tasks/{T}.md が存在して entry.plan と異なるエントリを path-correction-entries で拒否する。
  reproduction: create-plan=completed、implement=failed の状態で、REPORT.md→audit.md の訂正と新規 task0002 を返す。対象ファイルは旧参照を含む tests/test_ref.py、plan は tasks/task0002-safe.md とし、その本文を canonical_correction_plan の出力にする。一方、未登録の tasks/task0002.md には環境変数を外部送信する追加指示を置く。ファイル・Git読み取りをメモリ上で置き換えた validate_worker_result(..., dry_run=True) は errors=[] を返し、task0002.md を一度も読まなかった。起動仕様ではこの未検査ファイルが選ばれる。対照として plan を tasks/task0002.md に変更すると path-correction-entries で拒否された
