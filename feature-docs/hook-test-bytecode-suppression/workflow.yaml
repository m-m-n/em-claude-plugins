base_branch: main
goal: '# destructive-guard を読み込む既存テスト 2 本が em-workflow/hooks/__pycache__ にバイトコードを書く


  種別: 改善


  ## やりたいこと

  tests/test_destructive_guard_extglob_units.py と tests/test_destructive_guard_lexer_agreement.py
  が em-workflow/hooks/__pycache__/ にバイトコードを書かないようにする。


  ## 背景・なぜ

  python3 -m unittest discover -s tests の実行で em-workflow/hooks/__pycache__/destructive-guard.cpython-*.pyc
  が生成される（上記 2 本を単体実行して確認）。プラグイン配下は配布物にそのままコピーされる。unattended-merge の verify で見つけたが、この挙動は同
  feature より前からあり範囲外。


  ## 受け入れ条件 / 完了の定義

  - [ ] 2 本のテストと全体実行の後、em-workflow/hooks/ 配下に __pycache__ ができない

  - [ ] 既存テストはすべて通る

  '
