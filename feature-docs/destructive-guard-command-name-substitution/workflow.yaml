schema_version: 1
feature: destructive-guard-command-name-substitution
created: 2026-09-14
base_branch: main
goal: |
  destructive-guard: コマンド名そのものがコマンド置換で決まる形は検査対象外

  ## 脆弱性の概要 (必須)
  `destructive-guard.py` は、コマンド名そのものがコマンド置換で決まる形を検査対象にしていない。
  `$(which rm) -rf <path>` のように、置換の展開結果が実行されるコマンドになるケースは、
  展開結果を静的に確定できないため `allow` になる。

  ## 参照 (必須)
  - CVE / GHSA ID: 該当なし
  - アドバイザリ URL: 該当なし
  - severity: medium
  - 該当パッケージ: 該当なし
  - 現在のバージョン: em-workflow 0.1.75
  - 修正済みバージョン: 無し

  ## 攻撃シナリオ (必須)
  削除コマンドの「名前」を置換で組み立てると素通りする。実測値（feature
  `destructive-guard-command-substitution` 適用後の状態）:

  | コマンド | 判定 |
  | --- | --- |
  | `$(which rm) -rf /home/sakura/valuable` | allow |
  | `bash -c "$(echo 'rm -rf /home/sakura/valuable')" 'echo safe'` | allow |
  | 対照: `rm -rf /home/sakura/valuable` | deny |

  いずれも feature `destructive-guard-command-substitution` の基準版（`db5a4f86`）でも `allow` で、
  同 feature が持ち込んだ退行ではない。元からある検査範囲の外側。
  なお `$(true) rm -rf /home/sakura/valuable` のように「置換の後ろに実コマンド語が続く」形は
  同 feature で `deny` に戻してある。残っているのは「置換の展開結果そのものがコマンド／
  スクリプト本文になる」形だけ。

  ## 影響範囲 (必須)
  コマンド名またはシェルのスクリプト本文を置換で組み立てられる、実行ユーザーが書き込み可能な
  任意のパス。`$(...)` とバッククォートの両形式が対象。

  ## 完了の定義 (必須)
  - [ ] 上表の `allow` が `deny` または `ask` になる、または「検査対象外である」ことが
  設計判断として明文化され、理由文・ドキュメントがその範囲と一致している
  - [ ] `em-workflow/hooks/tests/destructive-guard-cases.json` に該当形のケースが入っている
  - [ ] `python3 em-workflow/hooks/tests/run-destructive-guard.py` が全件通る
  - [ ] `python3 -m unittest discover -s tests` が全件通る

  ## 該当箇所 (任意)
  `em-workflow/hooks/destructive-guard.py` の `head()` / `extract_shell_payload()`。
  判断が必要な点: コマンド位置の置換に対して `ask` へ倒すと、`eval "$(ssh-agent -s)"` /
  `eval "$(direnv export bash)"` / `eval "$(mise activate zsh)"` / `bash -c "$(cat script.sh)"`
  のような正常系が止まる。無人実行では `ask` が `deny` に降格するため、低頻度でも作業が確実に
  止まる。`.claude/rules/hook-tests.md` の「誤爆 1 件のコストは見逃し 1 件と同じ桁」を踏まえると、
  一律 `ask` は採れない。許容できる誤爆頻度を先に決める必要がある。
  また、クォート付きの `"$(...)"` は空に展開されても語が消えないのに対し、未引用の `$(...)` は
  語ごと消える。この差はトークン列からは復元できない（`_mark_substitutions()` が字句解析前に
  両方を同じマーカーへ潰すため）。区別が必要なら、マーカーにクォート情報を持たせる設計変更が要る。

  ## 由来 (任意)
  feature `destructive-guard-command-substitution` の review round 2 で security 観点
  （litellm/muse-spark）が指摘。基準版との実測比較で退行ではないことを確認したため、
  同 feature では `declined` として扱い、別タスクへ切り出した。
  Codex への相談でも「今回のバグ修正には含めず別タスクに切り出すべき」との判断だった。
parent_branch: em-workflow/destructive-guard-command-name-substitution/integration

