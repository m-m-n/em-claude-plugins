  answer_mode: select_or_freeform
  selected_option_ids:
  - narrow_destructive_shape
  freeform: null
  normalized_answer: コマンド語位置の置換は、残りのトークンが破壊的形状のときだけ deny/ask に倒す
  resolution_note: 'gate: create-spec.requirement-clarification (category: security -> batch relaxed route).
    chosen: narrow_destructive_shape. not chosen: uniform_ask / document_out_of_scope. key points: 無人実行では
    ask が deny に降格するため一律 ask は正常系を確実に止める; allow のままは「安全宣言」であり確定的な rm -rf 形の見逃しになる; 破壊形状に絞れば cases.json:213-215
    の allow 固定は維持され誤爆増分が最小。 codex_consulted: true. opus_escalation: false.'
