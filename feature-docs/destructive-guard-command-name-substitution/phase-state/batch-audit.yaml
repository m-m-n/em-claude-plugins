- question_id: create-plan.replanning-traceability
  packet_id: null
  answered_at: '2026-09-14T23:03:00+09:00'
  source: batch-codex-consultation
  answer_mode: single_select
  selected_option_ids:
  - replace_tests_mapping
  freeform: null
  normalized_answer: オーケストレーターが requirements.<ID>.tests を generation 2 の正しい対応表で置き換える
  resolution_note: 'gate: create-plan re-planning patch application (orchestrator-side deviation from
    the proposed patch). options: (A) apply as-is and leave the superseded TS ids that requirements_patch
    cannot remove, treating VERIFICATION.md as authoritative; (B) replace each requirement''s tests list
    with VERIFICATION.md''s generation-2 coverage table in the same single write. choice: B. codex_consulted:
    yes, but the Codex CLI itself was unreachable (usage limit until 2026-09-19), so the consultation
    ran through the LiteLLM harness (codex exec -p litellm -m muse-spark), the documented substitute.
    reasoning: downstream review and verify read requirements.<ID>.tests mechanically; a stale id whose
    meaning the revised SPEC reassigned corrupts coverage judgement, and a Markdown table cannot correct
    an automated consumer. The orchestrator owns workflow.yaml, and this record keeps the deviation auditable.
    affected ids dropped: FR5 TS-13, FR8/NFR6 TS-14, FR9 TS-15, FR10/NFR5 TS-16, NFR1 TS-17, NFR2/NFR3/NFR4
    TS-18, plus FR1/FR3''s generation-1 TS-6/TS-7 pairing. tasks lists were left as the patch proposed
    (append task0002).'
- question_id: create-plan.task-granularity
  packet_id: null
  answered_at: '2026-09-14T23:03:00+09:00'
  source: batch-codex-consultation
  answer_mode: single_select
  selected_option_ids:
  - single_task
  freeform: null
  normalized_answer: delta 全体を 1 タスク (task0002) のままにする
  resolution_note: 'gate: whether to accept the planner''s single-task delta whose 9 acceptance criteria
    exceed the plan-writing guideline of about 7. options: (A) keep one task; (B) split into two parallel
    tasks sharing the case table. choice: A (agrees with the planner''s D1). codex_consulted: yes, via
    the LiteLLM harness substitute (Codex CLI at its usage limit until 2026-09-19). reasoning: tasks run
    in parallel worktrees with no ordering, so two owners of one case-table JSON conflict on merge and
    each passes only its own worktree''s suite; the whole-table invariants (every pre-existing verdict
    preserved, full suite green) can only be checked by whoever holds the complete file. The size guideline
    is soft and yields to that.'
- question_id: verify.m5-version-bump-commit-separation
  packet_id: null
  answered_at: '2026-09-15T01:45:00+09:00'
  source: batch-codex-consultation
  answer_mode: single_select
  selected_option_ids:
  - pass_ssot_wins
  freeform: null
  normalized_answer: M-5 の「独立コミット」条項は SSOT を超えた過剰仕様とみなし、verify を pass にする
  resolution_note: 'gate: verify.m5-version-bump-commit-separation (gate_id を持たない裁量判断。
    ユーザー指示「不明点は Codex に相談し、比較的良い方を採用」による相談)。
    VERIFICATION.md の手動項目 M-5 は「version bump が挙動変更に混ざらず独立した
    コミットとして現れていること」を要求するが、review フェーズの auto-fix コミット
    da3599d が destructive-guard.py の挙動変更 + ケース追加と一緒に 0.1.81 -> 0.1.82 の
    bump を含んでいる。task0001 の 3b72790 と task0002 の 3360fa8 はいずれも独立コミット。
    options: A=pass (M-5 の当該条項は SSOT を超えた過剰仕様) / B=fail にして rework し
    da3599d を分割する。 chosen: A。not chosen: B。
    key points: SPEC.md FR10 の文言は「同じ変更の中で」であり独立コミットを要求していない;
    プロジェクトルール .claude/rules/core-plugin-version-bump.md も「その変更に含めて
    version を上げる」でありむしろバンドルを支持する; NFR5 は「変更範囲は 4 ファイル」
    のみを要求し、実測は宣言どおり 4 ファイルで M-5 の実質的な狙いである変更範囲の
    封じ込めは満たされている; M-5 の独立コミット規律は implementer のタスクコミットを
    想定した文言と読め、ワークフローが生成する review auto-fix コミットは単一の論理的
    修正単位である; マージ済み履歴の書き換えは純粋な手続き遵守のためのコストとして
    見合わない。 follow-up: M-5 の条項に SSOT の裏付けを持たせたいなら FR10 か
    プロジェクトルール側を明示改訂する (別タスクへ切り出し)。
    codex_consulted: true (Codex CLI が使用上限 2026-09-19 に到達したため
    `codex exec -p litellm -m vertex-glm-5 --sandbox read-only` 経由)。
    opus_escalation: false.'
