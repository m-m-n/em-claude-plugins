    （statements() が _mark_quoted_substitutions により各チャンクを二重に lex し、
    チャンクごとに lex_segments() を先行実行するが、入力は MAX_SHELL_PAYLOAD_EXPANSIONS
    予算下の単一コマンド文字列で、実行可能なコストではない。run の空結果と一致）。
    architecture は追認（インライン経路ブロックは実在。run が懸念した git 二重 dispatch の
    不変条件が現時点で成立することも別途確認）。spec は追認（実装は FR1-FR10 と
    AC-1..AC-12 に一致。AC-1/2/3/4/5/6/7/8 の判定を実行で確認、AC-9 は 241/241、
    AC-11 は両マニフェストで 0.1.79 から 0.1.80、python3 -m unittest discover -s tests の
    6 件の失敗は既存のもので main でも同一の 6 件が落ちる — AC-10 のベースラインは
    元から赤で、本 diff は壊していない）。high の 2 件は仕様からの逸脱ではない。実装は
    SPEC FR1/FR3 を忠実に実現しており、ありふれた破壊的スペルを通し、かつありふれた
    無害コマンドを新たに deny するのは、その規定されたゲート（dash 事前ゲートと
    フラグのみによる rm/git 推定）そのものである。
  recommended_action: "rework"
  action_rationale: >-
    dedupe 後も high が 2 件残り、同じ 6 行のゲートに対して逆向きに引いている。経路は
    オペランド先行と強制なしの rm スペルを捕まえるには狭すぎ、-r と -f を持つ置換先頭
    コマンドをすべて deny する点では広すぎる。いずれも bounded な auto-fix ではない。
    どちらも SPEC FR1/FR3 が明示する入口条件の変更を要し、仕様本文と pinned ケースが
