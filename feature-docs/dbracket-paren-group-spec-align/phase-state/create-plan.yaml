  change: 'FR3 no longer lists [[ ( a == b ) && true ]] among the forms read as certain:
    it states that this form stays uncertain (the ( boundary makes a == b a simple
    command whose name a is not an allow-list name, read as uncertain by the command-level
    reading as before that feature) and that the following notion call with --session
    "$SID" is KIND_INSPECTED, while [[ ( true == x ) && true ]] stays the certain
    / KIND_NOTHING example. AC-5 drops the form from the KIND_NOTHING list and states
    that, with the array assignment, the following notion call is KIND_INSPECTED and
    the hook decision is deny with reason ID git-branch-force-delete. TS-3 separates
    the [KIND_NOTHING] expectation of the certain forms from the [KIND_INSPECTED]
    expectation of this form. Nothing else in the document changes.'
  reason: 'dbracket-paren-group-spec-align FR2 and FR3 (SPEC assumption A0): the command-level
    reading in destructive-guard.py is kept, so the prior SPEC is aligned to the implemented
    judgment (uncertain, KIND_INSPECTED) instead of asking for KIND_NOTHING.'
