base_branch: main
goal: '# dbracket-opener-arith-scan: SPEC FR3・AC-5 の `[[ ( a == b ) && true ]]` の判定が
  SPEC・テスト・実装で食い違う


  種別: バグ


  ## 現象


  dbracket-opener-arith-scan の SPEC FR3・AC-5・TS-3 は `[[ ( a == b ) && true ]]` を確定と読み、後続の
  `--session "$SID"` 付き notion 呼び出しを `KIND_NOTHING` に保つと定めている。実際は `(` で区切られた `a ==
  b` がひとつの単純コマンドになり、許可名でない `a` を `_args_json_declares_nameref()` が不確定と読むため `KIND_INSPECTED`
  になる（修正前から同じ挙動）。テスト（`tests/test_destructive_guard_args_json.py` 4380 行付近）は SPEC と逆の判定（True）を固定しており、AC-6
  が求めるケース表の行も無い。


  ## 再現手順


  1. `[[ ( a == b ) && true ]]` の後に `--session "$SID"` 付きの標準形の notion 呼び出しを続けたコマンドを静的判定にかける

  2. 後続の呼び出しが `KIND_INSPECTED` になり、SPEC の期待（`KIND_NOTHING`）と食い違う


  ## 期待する挙動


  SPEC・テスト・実装の三者が同じ判定を述べている。コマンド単位の読み取りは緩めない方針なら、SPEC からこの例示を外すか「不確定のまま残り後続は `KIND_INSPECTED`」と明記し、テストの説明文もそれに揃える。


  ## 完了の定義


  - [ ] 再現手順で現象が起きない

  - [ ] 再発を検出するテストがある


  ## 該当箇所


  `em-workflow/hooks/destructive-guard.py` 8877 行付近、`tests/test_destructive_guard_args_json.py`
  4271〜4273 行・4380 行付近


  ## 実害・発生条件


  dbracket-opener-arith-scan のレビュー第1ラウンドで spec / architecture 観点が medium として報告し deferred
  にした（stable_id: 0995fb9ebc703b77, 27997561fe67bbab）。判定は検査する側に倒れているため安全側の食い違い。


  ## 追加指示


  - 不明点は Codex に相談し、比較して良い方の選択肢を採る。相談内容は Notion のタスクページに記録する。

  - 実装完了後は integration ブランチを remote に push し、base_branch への PR を gh pr create で作る。integration
  ブランチはローカル・リモート両方に残す（base_branch へ自動マージしない）。

  '
