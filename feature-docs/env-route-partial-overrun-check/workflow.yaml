feature: env-route-partial-overrun-check
created: '2026-11-24'
base_branch: main
goal: '# destructive-guard: env 経路で片方の読み方だけが overrun したとき、もう片方が復号した notion ペアの command
  が検査されない


  種別: セキュリティ / severity: medium


  ## 脆弱性の概要

  destructive-guard の env 経路は extglob の両方の読み方で本文を読むが、片方の読み方だけが上限を超えた（overrun）とき、上限内に収まったもう片方の読み方が復号した
  notion ペアの command を検査に回さない。


  ## 参照

  - CVE / GHSA ID: 該当なし

  - アドバイザリ URL: 該当なし

  - severity: medium

  - 該当パッケージ: 該当なし

  - 修正済みバージョン: 無し


  ## 攻撃シナリオ

  片方の読み方（extglob あり／なし）でだけ上限を超える本文を作り、もう片方の読み方で復号される notion ペアの command に破壊的なコマンドを置く。overrun
  の ask は出るが、復号済みの command の deny が判定に反映されない。


  ## 影響範囲

  本来 deny になるべきコマンドが ask にとどまる。対話実行では確認で通り得る。


  ## 完了の定義

  - 攻撃シナリオが成立しない

  - 修正版に追随している（修正版が無い場合は暫定緩和策の欄に対応を記載）


  ## 該当箇所

  em-workflow/hooks/destructive-guard.py の env 経路で、読み取りごとの overrun / unrestorable
  をまとめる箇所（`for reading in readings:`）。env-route-lex-flag-isolation のレビュー round 1、stable_id
  bf55aa65b635241a（deferred）。


  修正案: overrun の ask は残しつつ、上限内に収まった読み取りが復号した本文・command も検査に回し、そこで出た deny を優先する。または
  overrun を、それを起こした読み取りの項目にだけ効かせる。

  '
