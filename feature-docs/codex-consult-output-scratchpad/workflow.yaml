schema_version: 1
feature: codex-consult-output-scratchpad
created: '2026-10-31'
base_branch: main
goal: '# em-workflow の Codex 相談で、run_codex_exec.sh の出力がプロジェクトルートに consult1.out / consult1.err として残る


  種別: バグ


  ## 現象

  develop の質問解決ステップで Codex に相談したとき、オーケストレーターが `run_codex_exec.sh` の出力を相対パスでリダイレクトし、プロジェクトルートに `consult1.out` / `consult1.err` が残った。


  実行されたコマンド:

  ```

  S=<scratchpad>; P=''...''

  <em-workflow>/scripts/run_codex_exec.sh readonly -C <対象プロジェクトのルート> "$P" > consult1.out 2>consult1.err

  ```

  `S` に scratchpad を設定しているが、リダイレクト先が `$S/` ではなくカレント（プロジェクトルート）になっている。別セッションでは `$S/consult1.txt` と正しく scratchpad に書いており、毎回ではない。


  ## 再現手順

  1. 未確定の質問が出るタスクで `/em-workflow:develop` を実行する

  2. 質問解決ステップで Codex 相談が走る

  3. オーケストレーターが出力をファイルにリダイレクトした場合、置き場所がプロジェクトルートになることがある


  ## 期待する挙動

  Codex 相談の出力をファイルに残す場合、scratchpad に置かれ、プロジェクトルートに未追跡ファイルが残らない。


  ## 完了の定義

  - [ ] 再現手順で現象が起きない

  - [ ] 再発を検出するテストがある


  ## 該当箇所

  `em-workflow/references/question-resolution.md:466-476`（手順 2. Wrapper invocation）

  呼び出し形のみ規定しており、出力をファイルに保存するか・どこに置くかが書かれていない。手順 2 に「出力をファイルに残すときは scratchpad に置く。プロジェクトルートに書かない」旨を追記する。


  ## 実害・発生条件

  対象プロジェクトの作業ツリーに未追跡ファイルが残り、`git status` が汚れる。誤ってコミットされる可能性がある。

  '
