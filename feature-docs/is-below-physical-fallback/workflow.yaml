schema_version: 1
feature: is-below-physical-fallback
created: '2026-10-28'
base_branch: main
goal: |
  # bash_guard.py の is_below() が論理パスの不存在だけで有効な cd 前置形を allow から外す

  種別: 改善

  ## 現象
  bash_guard.py の is_below() は、論理パス（realpath(normpath(path))）が存在しないだけで False を返す。Bash の cd は論理パスへの移動に失敗すると物理パスで再試行するため、論理パスが存在しなくても領域内へ正常に移動できる場合がある。そうした有効な cd 前置コマンドが allow から外れ、通常の権限確認に回る。
  review round 1 の loop 1 の修正（シンボリックリンクの後ろの .. で領域外へ出られる問題の修正）で入った副作用で、安全側に倒れている。

  ## 再現手順
  1. P = /proc/self/root/.. + 現在の worktree パスとする
  2. realpath(P) は worktree になり、bash の cd "P" も成功する
  3. realpath(normpath(P)) は存在しないため、修正後の is_below() は False を返す

  ## 期待する挙動
  領域外の論理移動先は引き続き除外しつつ、論理パスが使えず物理パスへフォールバックする場合も考慮して判定する。

  ## 完了の定義
  - 再現手順で現象が起きない
  - 再発を検出するテストがある
  - シンボリックリンクの後ろの .. で領域外へ出る形は引き続き allow しない

  ## 該当箇所
  em-workflow/hooks/bash_guard.py:224（is_below）

  ## 実害・発生条件
  - feature implementer-cd-verbatim-conflict の review round 1 で未解決になった medium（stable_id 1ff4933d3c9b729c、comprehensive、confidence 60）
  - 通常の権限確認に戻るだけで、無人実行では deny になる。普通の worktree パスでは起きない
  - 変更は PR https://github.com/m-m-n/em-claude-plugins/pull/19 で入る（マージ済み）
