  title: 実装担当に渡す計画パスが、検証した計画と別のファイルを指しうる
  description: 検証側（_plan_is_bound_to_task_md と _resolve_contained_relative_path）は path_segments でバックスラッシュを区切りとして正規化した
    tasks/{T}.md を検証する。一方、implement-phase.md 546 行目の task_plan_path と Plan-path check の規則 2・3（symlink
    判定と realpath 判定）は、保存値をそのまま feature-docs/{feature}/ に結合する。POSIX ではバックスラッシュはファイル名の文字なので、plan が tasks\task0003.md（test_every_spelling_of_tasks_t_md_is_bound
    が bound として受理を固定している綴り）や tasks/\task0003.md のとき、検証は tasks/task0003.md を読み、実装担当には別名のファイルが渡る。FR1 は正規化後が
    tasks/{T}.md なので拒否しない。Plan-path check の 4 条件（安全な相対パス、symlink なし、realpath が内側、Cc なし）もすべて通る。THREAT-MODEL.md
    の攻撃者（tasks/ 配下にファイルを書き、patch を返す implementation-planner）が、正規形の側に canonical_correction_plan の出力を、別名の側に別の指示を置けば、TM-1
    と TM-4 が防ぐはずの食い違い（検証した文書と実装担当が読む文書の違い）がそのまま残る。悪意が無い場合も、バックスラッシュ綴りでは存在しないパスが実装担当に渡る。Plan-path check
    は存在を確かめないので止まらない。comprehensive#0 が同じ箇所を独立に報告した。create-plan-phase.md 2a 節にも同じ「joined with that value」の記述がある。SPEC
    FR2 の「feature-docs/{feature}/{tasks.{T}.plan}」という書き方がこの食い違いの元になっている。
  suggestion: implement-phase.md 546 行目の task_plan_path と、Plan-path check の規則 2・3 に次を明記する。保存値の文字列結合ではなく、path_segments
    で正規化したセグメントを feature-docs/{feature} に順に結合した絶対パスを使う（_resolve_contained_relative_path と同じ解決）。create-plan-phase.md
    2a 節の記述も揃える。別案として、Plan-path check に規則を 1 つ足して fail-closed にしてもよい。保存値が「/」区切りの正規形（バックスラッシュ・空セグメント・「.」を含まない形）と一致しないときに拒否する規則にする。どちらの案でも、tests/test_final_path_correction_docs.py
    が固定している「joined with」系の文言（1802・1890・1986・2387・2486 行付近）を更新する。さらに、バックスラッシュ綴りでも検証対象と起動時の対象が一致する（または拒否される）ことを固定するテストを足す。
  reproduction: POSIX 環境を想定し、plan を tasks/\task0003.md とする。tasks/task0003.md に canonical_correction_plan
    の出力、同じディレクトリの文字通りの名前 \task0003.md にテストの検証を無効化する別の計画を割り当てる。ファイル読み込みをメモリ上で代用して実際の関数を実行したところ、_plan_is_bound_to_task_md
    は true、_correction_entries_errors は [] となった。文面どおり保存値を結合したパスは後者を指し、起動前の4条件もすべて成立した。ファイルは作成・変更していない。
