schema_version: 1
feature: final-path-plan-binding
created: '2026-11-18'
base_branch: main
goal: |
  # 最終パス訂正の入口で、正規本文を検証した計画書と実装担当が読む計画書が結び付いていない

  種別: セキュリティ

  ## 脆弱性の概要 (必須)

  最終パス訂正の入口で、検証器が正規本文と比較するファイル（`entry.plan`）と、実装担当に渡す計画書（`tasks/{T}.md`）が結び付いていない。正規本文を持つ別ファイルを `plan` に指定すると検証を通り、未検査の `tasks/{T}.md` が指示として読まれ得る。

  ## 参照 (必須)

  - CVE / GHSA ID: 該当なし
  - アドバイザリ URL: 該当なし
  - severity: medium
  - 該当パッケージ: 該当なし
  - 現在のバージョン: 該当なし
  - 修正済みバージョン: 無し

  ## 攻撃シナリオ (必須)

  `tasks/` に任意のファイルを書ける計画担当が、訂正入口で新規タスクを返す。`plan` を `tasks/task0002-safe.md` にしてその本文を `canonical_correction_plan` の出力にし、未登録の `tasks/task0002.md` に別の指示を置く。`validate_worker_result(..., dry_run=True)` は errors なしで通り、`tasks/task0002.md` を読まない。`plan` を `tasks/task0002.md` にすると `path-correction-entries` で拒否される。

  留保: `em-workflow/references/implement-phase.md:466` は `task_plan_path` を `tasks/{T}.md` 固定と書き、`em-workflow/references/phases/create-plan-phase.md:103-107` は `tasks.{T}.plan` から解決すると書いている。この矛盾は feature `final-path-correction-medium-fixes` より前からあり、どちらが効くかはオーケストレーターの文書の読み方で決まる。

  ## 影響範囲 (必須)

  実装担当が、検証を通っていない計画書の指示に従う。feature `final-path-correction-medium-fixes` の THREAT-MODEL の TM-11 が求める正規本文の強制が、実際の指示入力まで届かない。

  ## 完了の定義 (必須)

  - [ ] 攻撃シナリオが成立しない
  - [ ] 修正版に追随している（修正版が無い場合は暫定緩和策の欄に対応を記載）

  ## 該当箇所 (任意)

  - `em-workflow/scripts/validate-worker-output.py:2290`（feature の統合ブランチ上の行番号、stable_id `29be215ab3f496e3`）
  - `em-workflow/references/implement-phase.md:466`
  - `em-workflow/references/phases/create-plan-phase.md:103`

  ## 暫定緩和策 (任意)

  訂正入口で、`tasks/{T}.md` が存在して `entry.plan` と異なるエントリを `path-correction-entries` で拒否する。根本対応は `implement-phase.md:466` を `tasks.{T}.plan` から解決する形に揃えること。
