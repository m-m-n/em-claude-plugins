schema_version: 1
feature: control-char-abort-terminal-state
created: '2026-11-01'
base_branch: main
goal: |
  # em-workflow の制御文字検査による implement フェーズの中止が終了状態を書かず、Stop hook が中止したタスクの起動を促す

  種別: バグ

  ## 現象 (必須)

  em-workflow の implement フェーズ Step I.2.a に追加された Control-character check 段落は「ABORT the implement phase」と書いているが、中止時に workflow.yaml へ書く終了状態（implement の status と failed_kind、およびそのコミット）を定めていない。

  この検査に来た時点で implement は Step I.1 により in_progress としてコミット済みで、選択されたタスクはまだ起動していないので journal にイベントが無い。そのため `queue_stop_guard.py` は「implement が in_progress、journal イベントの無いタスクがあり、空きスロットもある」と判定してターン終了を exit 2 で止め、中止したタスクそのものを起動対象（`launch=<task ids>`）として挙げる。FR3 で禁じている implementer の起動を hook がオーケストレーターに促すことになる。

  develop の「ターンを終わらせていい唯一の条件」にも明確には当たらない（停止条件 3 は failed / needs_update を要し、停止条件 5 は in-flight の待機に限られる）。結果として同じ ABORT を繰り返し、停止条件 2（スタック）まで止まらない。

  ## 再現手順 (必須)

  1. `.claude/worktrees/em-workflow` 配下にリンクを置き、リンク先のディレクトリ名に改行を含める
  2. `/em-workflow:develop` で implement フェーズに入る
  3. Control-character check が ABORT した後、implement が in_progress のまま残り、Stop hook が中止したタスクの起動を促す

  ## 期待する挙動 (必須)

  制御文字検査による中止が、Step I.2.c の abort phase と同じ終了処理を取る（implement の status を failed、failed_kind を decision にする 1 回の書き込みと、commit-docs.sh によるそのコミット。worktree とブランチは片付けない）。これにより develop の停止条件 3 で止まり、`queue_stop_guard.py` もブロックしない。

  ## 完了の定義 (必須)

  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある（`tests/test_canonical_worktree_path_docs.py` に、終了処理の引用を確かめるテストと、それを欠いた偽の写しのテストを足す）

  ## 該当箇所 (任意)

  - `em-workflow/references/implement-phase.md` の Control-character check 段落（391-407 行付近）
  - `em-workflow/references/implement-phase.md` Step I.2.c の abort phase（1233-1249 行付近）
  - `em-workflow/hooks/queue_stop_guard.py`
  - 既存の `check_control_char_stop` は「ABORT the implement phase」を含む文がちょうど 1 つであることを要求するので、足す文にはこの語句を入れない

  ## 実害・発生条件 (任意)

  正規化済み worktree_path に制御文字が入ったときだけ発生する。feature worktree-path-control-char-stop の review round 1 で evaluator が medium として報告した。
