schema_version: 1
feature: prelaunch-inprogress-routeback
created: '2026-10-05'
base_branch: main
goal: '# em-workflow: I.2.a が起動前に全選択タスクの in_progress をコミットするため未起動タスクが I.2.c route-back
  を恒久的に塞ぐ


  Notion: https://www.notion.so/3d53509ec8ee81c280a3cdf8dc62349f  (種別: バグ)


  ## 現象 (必須)

  `em-workflow/references/implement-phase.md` の Step I.2.a 新シーケンス（299-316 行）は、

  step 3 で「この entry で選択された EVERY task」の `in_progress` を 1 つの write set にまとめ、

  step 4 で 1 コミットにする。しかしこのコミットの後に承認ゲート（batch では未承認

  `project_commands` が hard-fail）と `Task()` 起動ループが来るため、両者の間で中断すると、

  journal に launched イベントが無いまま `in_progress` が branch にコミット済みで残る。

  I.2.a の選択規則は再選択できるので通常の再入は自己修復するが、I.2.c は do not refill なので、

  同一 entry の一部だけ起動して失敗した場合、未起動タスクは二度と起動されない。その状態で

  route-back ゲートは workflow.yaml の `in_progress` ユニオンだけで塞がるため、一度も起動されて

  いないタスクの `in_progress` が route-back を恒久的にブロックする。

  ## 再現手順 (必須)

  1. `em-workflow/references/implement-phase.md` の Step I.2.a、299-316 行の新シーケンスを読む

  2. step 3 の write set が「この entry で選択された EVERY task」を対象にし、step 4 で 1 コミットになることを確認する

  3. そのコミットの後に承認ゲートと `Task()` 起動ループが置かれていることを確認する

  4. Step I.2.c の route-back ゲートを読み、workflow.yaml の `in_progress` ユニオンだけでゲートが塞がること、および
  do not refill であることを確認する

  ## 期待する挙動 (必須)

  起動前に中断したタスクの `in_progress` 残骸が、I.2.c の route-back を恒久的にブロックしないこと。

  ## 完了の定義 (必須)

  - [ ] 再現手順で現象が起きない

  - [ ] 再発を検出するテストがある

  ## 該当箇所 (任意)

  - `em-workflow/references/implement-phase.md:310` — Step I.2.a の write/commit シーケンス

  - `em-workflow/references/implement-phase.md` — Step I.2.c の route-back ゲート

  ## 実害・発生条件 (任意)

  変更前は write が未コミットで、I.2.b step 2 の `reset --hard` に捨てられていたため到達しなかった。

  `exit4-tip-argument` の変更が新たに作る永続状態。

  出典: PR #17 (feature `exit4-tip-argument`) review round 2 の未解決 medium

  `bd794c3459ca8c75`（confidence 70、評価者も auto-fix 対象外に同意）。記録は

  `feature-docs/exit4-tip-argument/reviews/round2.yaml`。

  推奨対応（設計判断が要る）:

  - (a) I.2.c の route-back ゲートの `in_progress` 半分に「journal に一切イベントが無いタスクの workflow.yaml
  `in_progress` は起動前中断の残骸とみなし、in-flight として扱わない」というカーブアウトを明記する

  - (b) write/commit を承認ゲートと起動の後ろに移し、実際に起動できたタスクだけを `in_progress` としてコミットする


  ## 追加指示（起動者）

  - 実装完了後、integration ブランチを remote に push し、gh pr create で base_branch への PR を作る。integration
  ブランチはローカル・remote とも残す（base_branch へ自動マージしない）。

  - 不明点は Codex に相談し、相対的に良いと判断した案を採用する。

  - その議論の内容を Notion に記録する。

  '
