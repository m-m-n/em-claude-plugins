  description: 'iter_task_block_lines（160〜212 行）は、タスクキーより深いインデントの行を区別せずにすべて返す。task_routeback_records_from_workflow（240〜249 行）は、その中で ^\s+routeback_failed_journal_line: に合う最初の行を記録として採用する。このため notes: | の本文の行も記録として読まれる。workflow-schema.md の並びでは notes が記録より前にあり、Step I.2.c の route-back write set は実装者の報告の notes と記録を同じ書き込みで tasks.{T} に入れる。そのため notes の本文が「最初の出現」になり、本物の記録を隠す。評価者の再現: notes 本文に routeback_failed_journal_line: 3、本物の記録に 1 を持つブロックで、関数は {''task0001'': ''3''} を返した。影響は 2 方向: (1) 本物の記録が一致しているのに不一致と判定され、本来ブロックすべき場面で exit 0 になる。(2) 記録が無い、または一致しない pending + failed のタスクが notes 内の値との一致で unlaunched に分類され、Stop フックが再起動を求めてブロックする。tests/test_queue_stop_guard_routeback_record.py のフィクスチャは常に notes: null で、この形のケースが無い。'
  suggestion: '記録（できれば status も）を tasks.{T} の直下のキーだけから読む。タスクブロックで最初に現れる空でない行のインデントを直下の深さとし、それより深い行（ブロックスカラー | / > の本文や入れ子のマッピング）は読まない。tests/test_queue_stop_guard_routeback_record.py に回帰ケースを足す: notes: | の本文に一致する値があり本物の記録が無ければ exit 0、notes 本文に不一致値があっても本物の記録が一致すれば exit 2。'
