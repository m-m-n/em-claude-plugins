    answered_at: '2026-10-05T20:45:00+09:00'
    source: batch-assumption
    answer_mode: assumption
    selected_option_ids: []
    freeform: null
    normalized_answer: 'This plan pins the canonical form of routeback_failed_journal_line
      more strictly than SPEC.md: ASCII digits only, first digit 1-9, no leading zero,
      nothing but trailing whitespace after the value (an inline comment counts as
      non-canonical). Every reader, the orchestrator and queue_stop_guard.py alike,
      treats a non-canonical value as ''no record''.'
  create-plan.assumption.A-P3:
    packet_id: null
    answered_at: '2026-10-05T20:45:00+09:00'
    source: batch-assumption
    answer_mode: assumption
    selected_option_ids: []
    freeform: null
    normalized_answer: Physical line counting treats LF as the only delimiter (CR
      is never a delimiter). A final non-empty segment without a terminating LF counts
      as one line.
