base_branch: main
goal: |
  # codex-hook-interactive-guard: サブシェルで包んだ匿名関数の引数の救済が効かず、; の後の対話起動を見逃す

  Notion タスク: <notion-url> （種別: バグ）

  ## 現象 (必須)
  `codex-hook-interactive-guard.py`（em-workflow / em-review の両コピー）で、サブシェル `( ... )` の中に、匿名関数の引数から仮に開いて閉じない `(` があり、その中の最初の区切りが `;` の形を判定不能（出力なし）にする。末尾の `)` が仮の群を閉じ、外側の `(` が開いたまま残るため silent になり、`;` の後の `python3 -i` を見逃す。
  feature `codex-guard-brace-anon-arg-rescue`（PR https://github.com/m-m-n/em-claude-plugins/pull/183 ）で、どちらの群を閉じる `)` なのかが曖昧なため範囲外とした残件。

  ## 再現手順 (必須)
  1. `zsh -c 'setopt nobadpattern; ( function { :; } foo(a; python3 -i; )'` をフックに渡すと出力なし（silent）
  2. 到達の確認: `zsh -f -c 'setopt nobadpattern; ( function { :; } foo(a; printf REACHED; )'` で REACHED が出力される

  ## 期待する挙動 (必須)
  上の形を deny にする。線形時間・再帰なし・2 コピーのバイト一致を保つ。

  ## 完了の定義 (必須)
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある

  ## 該当箇所 (任意)
  - `em-workflow/scripts/codex-hook-interactive-guard.py`（`)` が直近の `(` 群を閉じる対応付け、`_rescue_argument_groups`）
  - `em-review/scripts/codex-hook-interactive-guard.py`（同一内容）
  - 元タスク: <notion-url>

  ## 実害・発生条件 (任意)
  見逃し側。`setopt nobadpattern` のもとで、引数の括弧の中に `;` を仕込み、全体を `( ...; )` で包む不自然な形に限られる。

  ## 追加指示
  - 実装完了後、integration ブランチを remote に push し、gh pr create で base_branch への PR を作る。integration ブランチはローカル・remote とも残す（自動マージしない）。
  - 不明点は Codex に相談し、比較的良いと判断した案を採用する。
  - その議論の内容を Notion に記録する。
