    description: "`_close_paren` に足した救済（`_closes_paren_after_rescue` / `_close_paren_after_rescue`）は、仮の群が最内の開いた群のときに読んだ `)` を、chain_base の `(` 群を閉じる括弧として読む。その `)` が case のパターン終端でも同じように読む。`( function { python3; } foo(a; case x in x) < /dev/null :;; esac; )` では `x)` で G1 が閉じ、`< /dev/null` が G1 に stdin を立て、匿名関数本体の python3 が接続済みになり silent になる。変更前は deny だった（deny から silent への後退）。zsh では `< /dev/null` は case 分岐内の `:` にしか掛からない。em-review のコピーも同一。仮の群を通らない `( python3; case x in x) < /dev/null :;; esac; )` は変更前から silent（case を追わない既存の限界）。SPEC の前提 A1 が case パターンの `)` では成り立たない。"
    suggestion: "狭い修正: 仮の群が最内の開いた群のときにコマンド位置で `case` を読んだら、その群に定数時間で読める印を付け、`_closes_paren_after_rescue` は印のある群では救済しない。両コピーを同じ変更で直し、再現形を deny の行として CASES に足す。docstring の手順 4、`_Parser`、`_close_paren`、`_closes_paren_after_rescue` の条件記述も追従する。case のパターン終端を主の読み手で追う広い修正は別 feature で扱う。"
    reproduction: "両ガードの標準入力に {\"tool_input\":{\"command\":\"zsh -c 'setopt nobadpattern; ( function { python3; } foo(a; case x in x) < /dev/null :;; esac; )'\"}} を渡すと終了コード0・出力なし。変更前（base_commit 0e4426d6）のガードでは deny。"
