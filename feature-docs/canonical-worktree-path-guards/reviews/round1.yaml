  file: em-workflow/hooks/queue_launch_guard.py
  line: 151
  title: "Git の共通管理ディレクトリの親を無条件にプロジェクトのルートとみなし、正しい場所からの起動を拒否する"
  description: "git_common_dir_root は `git rev-parse --path-format=absolute --git-common-dir` の出力の親ディレクトリを無条件に返している（151 行目）。cwd_outside_project_root はその値と cwd の git toplevel を realpath で比べ、違えば拒否する。SPEC a3 の前提（共通管理ディレクトリ = 主作業場所直下の `.git`）が崩れる構成では、正しい場所からの起動も拒否される。(1) サブモジュール: 作業場所が /super/sub なら共通管理ディレクトリは /super/.git/modules/sub で、ルートは /super/.git/modules になる。(2) `--separate-git-dir`: 共通管理ディレクトリが /store/proj.git なら、ルートは /store になる。(3) プロジェクトのルート自体が linked worktree の場合: `--git-common-dir` は主リポジトリの `.git` を返すので、ルートは主作業場所になる。どの構成も、変更前は区切りが無いと確認を省いていた（fail-open）。区切りの無い linked layout と重なると、実装担当の起動が毎回拒否される。NFR2 の「判断できない状態は fail-open を保つ」から外れる後退になっている。"
  suggestion: "git_common_dir_root で、正規化した共通管理ディレクトリの末尾要素が `.git` でなければ None を返し、確認を省く（fail-open）。プロジェクトのルートが linked worktree の場合は、cwd の toplevel 配下の `.claude/worktrees/em-workflow` を realpath した先が worktree_path の realpath の祖先なら許可する。迷う場合は許可側に倒す。テストでは RecordingRunner に `/super/.git/modules/sub` と `/store/proj.git` を返させ、拒否されないことを確かめる。"
  reproduction: null
  reproduction_alternates: []
