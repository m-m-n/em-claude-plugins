schema_version: 1
feature: canonical-worktree-path-guards
created: '2026-10-31'
base_branch: main
goal: '# em-workflow の worktree 配置がリンクのとき、正規化した worktree_path を launch guard と stale-launched の比較が扱えない


  種別: 改善


  ## やりたいこと (必須)


  `.claude/worktrees/em-workflow` かその祖先がリンクになっている配置で、正規化した worktree_path を launch guard と stale-launched の比較が扱えるようにするかを決め、必要なら直す。


  ## 背景・なぜ (必須)


  feature cd-prefix-canonical-path-only で、implement フェーズが implementer に渡す worktree_path を strict realpath で正規化する。`.claude/worktrees/em-workflow` かその祖先が main worktree 内へのリンクのとき、正規化後の値に `/.claude/worktrees/em-workflow/` の区切りが無くなる。


  - launch guard は、この区切りからプロジェクトルートを導出しているため、導出できない。

  - stale-launched の `--task-worktree`（`$WT_ROOT/{T}`）は、記録済みの worktree と文字列として一致しなくなる。


  どちらも fail closed（拒否側）に倒れる。feature cd-prefix-canonical-path-only の IMPLEMENTATION.md の Open Questions に、SPEC の範囲外として残した。


  ## 受け入れ条件 / 完了の定義 (必須)


  - [ ] launch guard と stale-launched の比較を、正規化した worktree_path に合わせるかどうかを決める

  - [ ] 合わせる場合は、上記の配置でも両方の判定が通ることをテストで確かめる


  ## 制約・前提 (任意)


  `tests/test_stale_launched_missing_artifacts_doc_contract.py` が `--task-worktree` の値を固定している。


  ## 追加指示（起動者から）


  - 不明点は Codex に相談し、相対的に良いと判断した選択肢を採用する。

  - 相談の内容は Notion（タスクページへのコメント）に記録する。

  '
