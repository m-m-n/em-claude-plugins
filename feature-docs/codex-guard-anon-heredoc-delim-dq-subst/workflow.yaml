schema_version: 1
feature: codex-guard-anon-heredoc-delim-dq-subst
created: '2026-10-18'
base_branch: main
goal: |
  # codex-hook-interactive-guard: 匿名関数の引数位置のヒアドキュメント区切り語の範囲で、二重引用符内の $( ) の引用符まで除去し、zsh と違う区切り語を登録する（見逃しと誤 deny）

  Notion: <notion-url>

  ## 現象 (必須)
  `codex-hook-interactive-guard.py`（em-workflow / em-review の両コピー）の `_remove_range_quotes` が、匿名関数の引数位置のヒアドキュメント区切り語の範囲を引用除去するとき、二重引用符の中の `$( ... )` を読み飛ばさず、置換の中の引用符まで除去する。区切り語 `foo("$(echo "x")")` が zsh の解釈する `foo($(echo "x"))` ではなく `foo($(echo x))` として登録され、次の 2 方向の誤判定が起きる。
  - 見逃し: 実際の終端行と一致しないため heredoc が閉じず判定不能になり、終端の後にある `python3 -i` を通す（変更前は deny だった）
  - 誤 deny: 本文中に `foo($(echo a))` の行があるとそこで heredoc を閉じ、本文の `python3 -i` を deny する
  feature `codex-guard-anon-heredoc-paren-delim` の review round 1 の指摘（stable_id `b3f96f950a8b93fe` security / `11425081edad840a` comprehensive / `95566319fa29d884` spec、いずれも medium）。同じ round の architecture 指摘 `d81b76f7ebbcf315`（引用除去の規則が `_double_quoted` / parse 本体と `_remove_range_quotes` に重複し、`$( )` と `${ ... }` で既に食い違っている）も同じ原因。
  ## 再現手順 (必須)
  1. `tool_input.command` に `zsh -c ` + shlex.quote(inner) を設定した JSON をフックの標準入力へ渡す（コマンド自体は実行しない）。見逃し側の inner は次の 4 行
  ```plain text
  function { :; } << foo("$(echo "x")")
  foo("$(echo "x")")
  foo($(echo "x"))
  python3 -i
  ```
  1. 標準出力が空になる（期待は deny）
  2. 誤 deny 側は inner を `function { :; } << foo("$(echo "a")")` / `foo($(echo a))` / `python3 -i` / `foo($(echo "a"))` の 4 行にすると deny が出る（期待は silent）
  ## 期待する挙動 (必須)
  二重引用符内の `$(` / `$((` を `_double_quoted` と同じく `_skip_substitution` で読み飛ばして原文を残す。読み飛ばしが範囲の終わりを越えるときは判定不能にする。見逃し側の入力は deny、誤 deny 側の入力は silent になる。
  ## 完了の定義 (必須)
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある
  - [ ] `tests/test_codex_hook_interactive_guard.py` の `CASES` に上の 2 入力を追加
  - [ ] 両コピーがバイト単位で同一のまま
  - [ ] 引用除去の規則を範囲を受け取る共通処理にまとめ、語の読み取りと区切り語の範囲の両方から呼ぶ（再帰と循環呼び出しは持ち込まない）
  ## 該当箇所 (任意)
  - `em-workflow/scripts/codex-hook-interactive-guard.py` の `_remove_range_quotes`（971〜1031 行付近、二重引用符の分岐は 1013〜1023 行）、`_double_quoted`（1051〜1064 行付近）
  - `em-review/scripts/codex-hook-interactive-guard.py`（同一内容）
  - 記録: `feature-docs/codex-guard-anon-heredoc-paren-delim/reviews/round1.yaml`（ブランチ `em-workflow/codex-guard-anon-heredoc-paren-delim/integration`）
  ## 実害・発生条件 (任意)
  区切り語の範囲の二重引用符の中に、さらに引用符を含む `$( )` を書いた場合だけ。見逃し側は fail-open。

  ## 追加指示

  - 実装完了後、integration ブランチを push し、base_branch へ gh pr create で PR を作る。integration ブランチはローカル・リモート共に残す（自動マージしない）。
  - 不明点は Codex に相談し、比較して良い方を採用する。議論内容は Notion に記録する。
