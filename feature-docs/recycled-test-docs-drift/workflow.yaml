schema_version: 1
feature: recycled-test-docs-drift
created: '2026-09-25'
base_branch: main
goal: '# em-workflow: recycled-task-id-contract の test-docs がスキーマ違反と記録陳腐化を抱えている


  Notion: https://www.notion.so/3c03509ec8ee81bebdeeddebbafb4c1b  (種別: バグ)


  ## 現象

  feature `recycled-task-id-contract` の test-docs 2 ファイルが、`em-workflow/agents/implementer.md`
  が定めるスキーマと実態から外れている。


  **必須フィールドの欠落**: `test-docs/recycled-task-id-contract/task0002.tests.yaml` の AC-4
  だけが `red_confirmed` を持たず、`tests: []` と `red_reason` のみ。同ファイルの AC-1/2/3/5 と task0001.tests.yaml
  の全エントリは持っている。implementer.md は `tests: []` のビルド系 criterion を含め全 Acceptance Criterion
  エントリが `tests` / `red_confirmed` / `red_reason` を持つと明記している。


  **記録の陳腐化**: `test-docs/recycled-task-id-contract/task0001.tests.yaml` が review の
  auto-fix 後に更新されていない。

  - AC-3 の `red_reason` が「All four hooks ...」という現在は存在しない文面を引用している（auto-fix で「The other
  three queue hooks ...」に書き換わった）

  - auto-fix が `tests/test_hook_classification_pin.py` に追加した非空虚性テストが、どの AC の `tests:`
  リストにも載っていない

  - AC-7 の `red_reason` がテスト総数を旧件数のまま記録している


  **観測していない red**: task0001.tests.yaml の AC-7 が `red_confirmed: true` としつつ、`red_reason`
  は「pre-edit の git diff が空であること（実装前は自明に真）」と述べている。implementer.md の「観測していない red に true
  と書くな」に照らすと `false` + 理由が正しい形。


  ## 再現手順

  1. task0002.tests.yaml の AC-4 に `red_confirmed` が無いことを確認する。

  2. task0001.tests.yaml の AC-3 の `red_reason` に「All four hooks」の引用があることを確認する。

  3. `em-workflow/references/implement-phase.md` を `All four hooks` で grep し、0 件であることを確認する。


  ## 期待する挙動

  test-docs の記録が implementer.md のスキーマを満たし、かつ成果物の実態を説明している。後続フェーズ（verify / retrospect）がこの記録を根拠に判断しても誤らない。


  ## 完了の定義

  - [ ] task0002.tests.yaml の AC-4 に `red_confirmed: false` がある

  - [ ] task0001.tests.yaml の AC-3 の引用が現在の文面と一致する

  - [ ] auto-fix で追加されたテストが対応する AC の `tests:` に載っている

  - [ ] task0001.tests.yaml の AC-7 のテスト総数と `red_confirmed` が実態に合っている


  ## 該当箇所

  `test-docs/recycled-task-id-contract/task0001.tests.yaml`、`test-docs/recycled-task-id-contract/task0002.tests.yaml`


  ## 実害・発生条件

  記録は成果物の一部として integration ブランチにコミット済みで、後続フェーズが失敗の帰属根拠として読む。review の auto-fix が実装を書き換えても
  test-docs は更新されないという構造的な穴でもあるので、個別修正に加えて「auto-fix 後に tests.yaml を追随させる責務が誰にあるか」を
  review-phase.md 側で決める余地がある。


  由来: PR https://github.com/m-m-n/em-claude-plugins/pull/16 のレビュー finding `4d38d19e836bbffb`
  と `3c7e5b9a1d4f8026`（comprehensive、medium、confidence 65）。

  '
