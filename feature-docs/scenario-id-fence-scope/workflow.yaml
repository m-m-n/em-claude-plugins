schema_version: 1
feature: scenario-id-fence-scope
created: '2026-11-07'
base_branch: main
goal: |
  シナリオ ID 形式検査が除外するコード範囲を文書の「fenced code blocks」と一致させる

  ## やりたいこと (必須)

  シナリオ ID 形式の検査（`find_hyphenless_scenario_ids`）が除外するコード範囲と、文書の記述を一致させる。

  ## 背景・なぜ (必須)

  `find_hyphenless_scenario_ids` は既存の `_strip_noise` を再利用しており、三連バッククォートの間を行頭かどうか・囲み文字の種類を見ずに除去する。このため次のずれがある。

  - 行内の「See ```TS3``` for details.」の TS3 が除去され、ハイフン無しの ID が検査を通る
  - `~~~` で囲んだコードブロック内の `TS3` は除去されず、検査で拒否される
  - `planner-contract.md`・`create-plan-phase.md`・plan-writing の `SKILL.md` は「fenced code blocks を除く」と書いており、`~~~` のブロックも除外されると読める

  feature `scenario-id-ts-hyphen` のレビューで報告された。同 feature の SPEC（A2）は検査範囲を「既存の `_strip_noise` と同じ」と定めているため、現状の挙動は仕様どおり。

  ## 受け入れ条件 / 完了の定義 (必須)

  - [ ] 次のどちらかに揃っている: 検査が行頭の ``` / ~~~ ブロックだけを除外する（読み取り側の `_strip_noise` は変えない）／ 3 つの文書の記述を「三連バッククォートで囲んだ範囲（`_strip_noise` と同じ）」に直す
  - [ ] `~~~` ブロックと行内の三連バッククォートの回帰テストがある
  - [ ] テストスイート全体が通る

  ## スコープ外 (任意)

  既存文書の `TSn` の書き換え。

  ## 制約・前提 (任意)

  - 既存文書の読み取り（`TS-?\d+` で両方の形を受け付ける）は変えない
  - 該当箇所: `em-workflow/scripts/validate-worker-output.py` の `find_hyphenless_scenario_ids`、`_strip_noise`
  - sha256 ピンを持つテストがあれば併せて更新する
