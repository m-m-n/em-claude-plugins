    title: "走査中の親 PID 再利用で外部プロセスが子孫と判定され信号を受ける"
    description: "_snapshot() は /proc を PID 昇順に 1 件ずつ読み、_depths_below() は ppid の数値だけで親子を結ぶ。外部プロセス P の子 C を読んだ後に P が終了し、同じ PID が ANCHOR 配下の新しいプロセス P' に再割り当てされ、そのあとで P の位置を読むと、C が P' の子として ANCHOR の子孫に入る。昇順に走査するので、PID の折り返しで C < P になっている場合に限られる。C の stdin が /dev/pts/* なら標的になり、_same_process() は C 自身の開始時刻しか見ないので確認を通る。NFR1 に反する経路で、THREAT-MODEL.md の TM-3 にも書かれていない。発生確率は極めて低い。em-review のコピーも同じ。"
    suggestion: "_depths_below() で、親の開始時刻が子の開始時刻より後になる親子リンクは採用しない（等しい場合は許す）。走査中に親 PID が再利用される状況を FakeTable で再現する試験を追加する。2 つのコピーは同じ変更で直し、バイト単位で同一に保つ。"
