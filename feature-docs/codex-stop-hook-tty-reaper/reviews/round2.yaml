    title: "走査中の親 PID 再利用で外部プロセスが ANCHOR の子孫と判定され信号を受ける"
    description: "_snapshot() は /proc の各エントリを 1 件ずつ順に読み、_depths_below() は ppid の数値だけで親子を結ぶ（171-172 行）。外部プロセス P の子 C（PID の折り返しで C < P）を先に読み、その後 P が終了して同じ PID が ANCHOR 配下の新しいプロセスに再割り当てされてから P の位置を読むと、C が ANCHOR の子孫に入る。C の stdin が /dev/pts/* なら標的になる。_same_process() は C 自身の開始時刻しか見ないので確認を通り、NFR1 に反して外部プロセス（利用者の対話シェルなど）に SIGTERM / SIGKILL が届く。第 1 ラウンドの head（f7b2464a）以降、フック本体に差分は無い。発生確率は極めて低い。em-review のコピーもバイト同一なので同じ問題がある（cmp で確認）。"
    suggestion: "_depths_below() で、親の開始時刻が子の開始時刻より後になる親子リンクは採用しない（等しい場合は許す）。走査中に親 PID が再利用される状況を FakeTable で再現する試験を追加する。2 つのコピーは同じ変更で直し、バイト単位で同一に保つ。"
