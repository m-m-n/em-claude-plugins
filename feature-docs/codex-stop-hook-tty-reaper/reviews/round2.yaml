    title: "同一性の確認から信号送信までの間の PID 再利用が塞がれていない"
    description: "_stop() は _same_process() で開始時刻を確かめたあと、別の操作として send_signal(pid, sig)（既定値は os.kill）を呼ぶ（SIGTERM は 225-226 行、SIGKILL は 239-240 行）。確認の直後に対象が終了して回収され、PID が再割り当てされると、信号は新しいプロセスに届く。test_tm3_* が扱うのは確認より前の入れ替わりだけ。窓はマイクロ秒単位で実害の確率は極めて低いが、NFR1 の保証に穴が残る。第 1 ラウンドから変わっていない。em-review のコピーも同じ。"
    suggestion: "os.pidfd_open(pid) で pidfd を取ってから開始時刻を照合し、一致したときだけ signal.pidfd_send_signal(pidfd, sig) で送る。ProcessLookupError は終了済みとして扱う。それ以外の失敗や pidfd が使えない環境では、何も止めない側に倒す。SIGTERM と SIGKILL の両段階で、確認後の入れ替わりを扱う試験を追加する。2 つのコピーは同時に直す。"
    reproduction: null
