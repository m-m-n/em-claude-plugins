schema_version: 1
feature: codex-stop-hook-tty-reaper
created: '2026-10-25'
base_branch: main
goal: |
  # run_codex_exec.sh で起動する Codex に、端末の入力待ちで残った対話起動のプロセスを止める Stop フックを登録する

  ## やりたいこと (必須)

  `run_codex_exec.sh` で起動する Codex に Stop フックを登録し、ターンの終わりに、端末の入力待ちのまま残っている対話起動のプロセスを止める。

  ## 背景・なぜ (必須)

  - Codex が `exec_command` を `tty:true` で実行し、`python3 -i` などの対話起動が残ると、Codex の終了後に孤児化して CPU を空回りし続ける（検証で CPU 65% を確認）。
  - `codex-hook-interactive-guard.py`（PreToolUse）はコマンド文字列の静的解析で防いでいるが、レビューのたびに解析の穴が見つかり、タスクが増え続けて収束しない。解析の修正タスク 8 件は破棄した。
  - `PreToolUse` の `tool_input` には `command` しか渡らず、`tty` の指定は見えない。実行前に端末ありの実行だけを止める手段は無い。
  - `run_codex_exec.sh` の呼び出し元はすべて `readonly`（Codex のレビュアーと質問解決での相談）。

  ### 検証結果（Codex 0.164.0、read-only サンドボックス）

  - `Stop` の時点で、残った対話起動のプロセスは Codex の子孫として見え、標準入力は `/dev/pts/*` だった。
  - `python3 -i` 自身の `PostToolUse` は発火しない（コマンドが終わらないため）。
  - 検証用の Stop フックで止められた。
    - `python3 -i`: 止められた
    - `bash -i`: SIGTERM では止まらず、SIGKILL で止まった
    - `node` の REPL: `Stop` の時点で既に終了しており、対象にならなかった
  - `tty:true` を指定しない実行では、`bash -i` も `node -i` も入力の終わりを受け取ってすぐ終了した。
  - 過去の read-only の `codex exec` のコマンド 41,542 件のうち、`tty:true` は 71 件。
  - 検証で使った判定: Codex の子孫のうち子を持たない末端のプロセスで、標準入力が `/dev/pts/*` のものに SIGTERM を送り、0.5 秒後も生きていれば SIGKILL を送る。

  ## 受け入れ条件 / 完了の定義 (必須)

  - [ ] `run_codex_exec.sh`（em-workflow / em-review）が Stop フックを登録する
  - [ ] Stop フックが、Codex の子孫で標準入力が端末のまま残っているプロセスを止める
  - [ ] `python3 -i` と `bash -i` を `tty:true` で残した Codex の実行で、終了後にそのプロセスが残らない
  - [ ] 読み取り専用のコマンドだけを実行した Codex の実行で、フックが何も止めない
  - [ ] `readwrite` と `--litellm` 経由の起動でも、同じ判定で対象が見つかることを確かめる
  - [ ] 意図して残したバックグラウンドのプロセスを巻き込むかどうかを確かめ、結果を記録する

  ## スコープ外 (任意)

  - `codex-hook-interactive-guard.py` のコマンド解析の修正

  ## 制約・前提 (任意)

  - フックは `run_codex_exec.sh` の起動時の引数（`-c hooks.Stop=...`）で登録する。
