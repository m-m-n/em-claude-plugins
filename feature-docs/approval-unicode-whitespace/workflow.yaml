schema_version: 1
feature: approval-unicode-whitespace
created: '2026-11-01'
base_branch: main
goal: |
  # コマンド承認の照合で Unicode 空白を除くため、未承認の実行ファイルが承認される（merge-preflight.py / bash_guard.py）

  ## 脆弱性の概要 (必須)

  コマンド承認の照合が Python の <code>str.strip()</code> で前後の空白を除くため、Bash が語の区切りにしない空白（U+00A0、U+000B、U+000C など）を前に付けたコマンドが、承認済みの別コマンドとして通る。<code>merge-preflight.py</code>（unattended-merge-medium-fixes の FR4 で導入）と <code>bash_guard.py</code>（従来から）の両方に同じ弱さがある。

  ## 参照 (必須)

  - CVE / GHSA ID: 該当なし
  - アドバイザリ URL: 該当なし
  - severity: medium（reviewer は high、evaluator が medium に下げた）
  - 該当パッケージ: 該当なし
  - 現在のバージョン: em-workflow 0.4.x
  - 修正済みバージョン: 無し

  ## 攻撃シナリオ (必須)

  承認済みコマンドが <code>/usr/bin/true</code> のような絶対パスのとき、リポジトリを書き換えられる者が workflow.yaml の <code>test_command</code> を「U+00A0 + /usr/bin/true」にし、作業ツリーに <code><U+00A0>/usr/bin/true</code> という実行ファイルを置く。preflight も bash\_guard も前後の空白を除いた値で承認と判定し、Bash は元の文字列を作業ツリー相対のパスとして実行する。

  ## 影響範囲 (必須)

  承認されていないプログラムが、承認ゲートを通って実行される。成立するのは、先頭の語に <code>/</code> を含み、リポジトリ外の実行ファイルを指す承認コマンドがある場合に限る。<code>make test</code> のように PATH で解決するコマンドでは成立しない。

  ## 完了の定義 (必須)

  - [ ] 攻撃シナリオが成立しない
  - [ ] 修正版に追随している（修正版が無い場合は暫定緩和策の欄に対応を記載）
  - [ ] U+00A0 / U+000B / U+000C を前後に付けたコマンドが承認されないことを確かめるテストがある（preflight と bash\_guard の両方）

  ## 該当箇所 (任意)

  - <code>em-workflow/scripts/merge-preflight.py:465</code>（<code>check_approval</code>）
  - <code>em-workflow/hooks/bash_guard.py</code>（フックの入口の strip、<code>is_cd_prefixed_approved</code>）
  - <code>tests/test_merge_preflight.py</code> の <code>test_fr4_ac3_preflight_agrees_with_bash_guards_own_approval_decision</code>（現在は U+00A0 などを付けた値を「承認」として固定している）
  - 詳細: integration ブランチ <code>em-workflow/unattended-merge-medium-fixes/integration</code> の <code>feature-docs/unattended-merge-medium-fixes/reviews/round1.yaml</code>（stable\_id <code>d17e1a08d32875cf</code>）

  ## 暫定緩和策 (任意)

  除く空白をスペースとタブに限る。前後にそれ以外の空白を含む値は承認不可とする。bash\_guard.py は unattended-merge-medium-fixes では変更対象外だったため、両方を同じ変更で直す。
