  evidence: '問題は現在のコードに残っている。preflight は生の値について LF/CR を除外するが、承認照合には引数なしの strip() を使い、元の文字列を返す（em-workflow/scripts/merge-preflight.py:417、em-workflow/scripts/merge-preflight.py:465、em-workflow/scripts/merge-preflight.py:472）。フックも入口と
    cd 後の文字列で同じ処理を行い、承認済みなら allow を返す（em-workflow/hooks/bash_guard.py:336、em-workflow/hooks/bash_guard.py:448、em-workflow/hooks/bash_guard.py:480、em-workflow/hooks/bash_guard.py:482）。承認一覧をメモリ上で
    /usr/bin/true に差し替えた検証では、U+00A0/U+000B/U+000C を先頭・末尾・両端に付けた全9入力が preflight と通常のフックで承認された。cd
    前置形もパス検証を差し替えた条件で全9入力が承認された。実行ファイルを配置する攻撃再現は行っていない。

    その他のコマンド文字列に対する strip() は、空値判定、宣言抽出、保存済み承認の読み込み、cd 後の除外判定、標準入力の読み込みにもある（em-workflow/scripts/merge-preflight.py:415、em-workflow/hooks/bash_guard.py:182、em-workflow/hooks/bash_guard.py:202、em-workflow/hooks/bash_guard.py:367、em-workflow/hooks/bash_guard.py:446、em-workflow/hooks/bash_guard.py:502）。標準入力は行単位なので、コマンドの空白処理と行末の処理を区別する必要がある（em-workflow/hooks/bash_guard.py:501）。

    既存テストには対象文字があるが、拒否を明示せず、両実装の判定が一致することを検証している（tests/test_merge_preflight.py:1198、tests/test_merge_preflight.py:1199、tests/test_merge_preflight.py:1221）。通常承認と
    cd 前置形の試験基盤は既にある（tests/test_bash_guard_cd_prefix.py:550、tests/test_bash_guard_cd_prefix.py:645）。27
    は3文字×先頭・末尾・両端×preflight・通常フック・cd 前置形という拒否検証条件の数で、追加する関数の数ではない。スペースとタブだけを除く方針では、末尾
    LF を承認する既存テストとの整合も確認対象になる（tests/test_bash_guard_cd_prefix.py:424、tests/test_bash_guard_cd_prefix_operators.py:396）。hooks/tests
    の実行器は destructive-guard.py を対象としている（em-workflow/hooks/tests/run-destructive-guard.py:63）。

    既存関数内の文字列処理と判定条件が変更対象で、追加関数・追加ファイル・追加依存を必須とする箇所は確認できない（em-workflow/scripts/merge-preflight.py:465、em-workflow/hooks/bash_guard.py:336、em-workflow/hooks/bash_guard.py:448）。外部契約の値は
