    手順から preflight、Bash フック登録から bash_guard、preflight から承認一覧 CLI への直接接続を数えた（em-workflow/skills/merge/SKILL.md:75、em-workflow/hooks/hooks.json:21、em-workflow/scripts/merge-preflight.py:431）。変更行数は未確定であり、changed_lines_approx
