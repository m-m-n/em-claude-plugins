findings:
- stable_id: 90ff0d70d70279b8
  severity: medium
  category: security
  file: em-workflow/hooks/bash_guard.py
  line: 207
  title: 'TM-5: 引用符内の先頭にある U+0085 を YAML 1.1 が空白に変えるため、宣言済みで未承認のコマンドが拒否されず判定なしに後退する'
  description: 'declared_commands は workflow.yaml を 1 行ずつ読み、`test_command: "<U+0085>./unapproved"` の値を `\x85./unapproved` のまま宣言集合に入れる（trim はスペースとタブだけ）。一方 PyYAML（YAML 1.1）は二重引用符内の U+0085 を空白 1 つに変えるため、解析結果は ` ./unapproved` になる。この値がコマンドとして渡ると、hook_main は `./unapproved` にトリムし、宣言集合にも承認集合にも含まれないため判定なし（return 0）になる。基準コミットでは両側に str.strip() をかけていたため一致し、未承認として拒否していた。挙動は SPEC FR8 と tests/test_bash_guard_unicode_whitespace.py:416-422 のとおりで、仕様の穴にあたる。影響は通常の権限確認に回るだけに限られ、YAML のエスケープやブロックスカラーを使えば基準コミットでも同種の食い違いは起こせた。'
  suggestion: declared_commands で、スペースとタブだけのトリム値に加えて str.strip() した値（または YAML 1.1 が改行として扱う U+0085 / U+2028 / U+2029 を前後から除いた値）も宣言集合に入れる。tests/test_bash_guard_unicode_whitespace.py:418 / :422 の silent 期待を見直し、SPEC FR8 と THREAT-MODEL TM-5 に追記し、U+0085 を含む宣言とその YAML 解析結果で deny を確かめる回帰テストを加える。
  reproduction: workflow.yaml の project.components.main.test_command に、二重引用符内の先頭が実際の U+0085 である "<U+0085>./unapproved" を指定する。承認ストアには /usr/bin/true だけを登録する。YAML 解析結果の「 ./unapproved」を、同じリポジトリを cwd とした PreToolUse JSON の tool_input.command に渡す。基準コミットでは permissionDecision=deny、新版では終了コード0・標準出力なしになる。ファイル入出力と Git 情報をメモリ上で置き換え、両版の hook_main で確認した
  reproduction_alternates: []
