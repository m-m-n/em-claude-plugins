    file: em-workflow/scripts/codex-hook-interactive-guard.py
    line: 341
    title: "配列代入 `a=()` の後に改行を挟んだサブシェルを関数本体とみなし、対話起動を通す（基準版からの回帰）"
    description: "`a=()\\n(python3 -i)` は、基準版 (fa502d0f) では deny (interactive, python3) になる。変更後は何も出力しない。同じ原因で、`a+=()\\n(python3 -i)`、`export a=()\\n(python3 -i)`、`a=()\\n\\n(python3)`、`a=()\\n# c\\n(python3 -i)` も deny から許可に変わる。`;` で区切った `a=() ; (python3 -i)` は deny のまま。原因は 3 つの処理の組み合わせ。(1) `_open_group`（341 行）は、`(` の直前に語があれば中身を問わず head を立てる（made = bool(words)）。このため代入語 `a=` も関数名として扱われる。(2) `_close_group`（354 行）は、中身が空の `()` を閉じると fn_head を立てる。(3) fn_head は改行では消えない（325 行）。結果として、次の行の `(` / `{` が関数本体として skip される。bash では `a=()` は配列代入で、次の行のサブシェルは実行される。THREAT-MODEL TM-2 の「緩和は定めた条件の範囲だけに効かせる」を満たしていない。em-review 側のコピーはバイト単位で同一なので、同じ問題がある。同じ原因で `a=()\\n{ python3 -i; }` も通る。こちらは基準版でも通っていた既存の見落とし。"
    suggestion: "`_open_group` で head を立てる条件を絞る。`(` の直前の単純コマンドが動的でない語 1 つだけで、その語が `=` を含まない有効な関数名のとき（または `function NAME` の形）に限る。`foo()\\n(python3 -i)` と `f() (python3 -i)` は bash の関数定義なので、silent のまま保つ。CASES には `a=()\\n(python3 -i)` と `a+=()\\n(python3 -i)` を deny として足す。両方のコピーを同じ変更で直し、バイト単位で同一に保つ。"
    sources: ["codex:security"]
    confidence: 95
    resolution: unresolved
    resolution_reason: "medium は auto-fix の対象外（R4 の候補は critical / high のみ）"
