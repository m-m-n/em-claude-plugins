    title: "Actions の更新 PR がマージされる前に git pull すると、旧版を基準に確かめてしまう"
    description: "`.github/workflows/plugin-version-bump.yml`（272〜288 行）は、push の後に別ブランチで version を上げて PR を作り、`gh pr merge --squash` で main に入れる。この反映は push より遅れて起きる。18〜19 行は Actions の実行完了や更新 PR のマージを待つ手順を書いていない。push の直後に `git pull` すると何も取り込まれず、マニフェストは旧版のままになる。その結果、21〜24 行の分岐に入り、正常に進んでいる更新を「キャッシュが無い・一致しない」や「Actions が version を上げなかった」として調べて報告してしまう。"
    suggestion: "18 行の手順に、その push に対応する Actions の実行が終わり、更新 PR が main にマージされたことを確かめてから `git pull` する、と足す（例: `gh run list` / `gh run watch` で確かめる）。そのうえで、取り込んだマニフェストの version を `<新しい version>` として使う。"
