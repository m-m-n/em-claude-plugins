base_branch: main
goal: |-
  # core-plugin-version-bump ルールを、push 後のキャッシュ反映を Claude が確かめる形に変える
  
  Notion タスク: <notion-url>
  
  ## やりたいこと
  .claude/rules/core-plugin-version-bump.md を、push 後にプラグインのキャッシュへの反映を Claude 自身が確かめる形に変える。
  
  ## 背景・なぜ
  今のルールは「変更をユーザーに報告するときは、反映に Claude Code の再起動が要ることを添える」で、反映の確認が人の作業として報告される。キャッシュの中身は Claude がファイルを比べて確かめられる。新しく起動するセッション（無人実行を含む）には再起動なしで反映される。
  
  ## 受け入れ条件 / 完了の定義
  - main に push した後、Actions のコミットを git pull で取り込み、~/.claude/plugins/cache/<marketplace>/<plugin>/<新しい version>/ に変更が入っていることを確かめる、と書かれている
  - Actions が version を上げなかったときは、その原因を調べて報告する、と書かれている
  - 再起動が要るのは今開いている対話セッションへの反映だけで、新しく起動するセッションには再起動なしで反映される、と書かれている
  
  ## スコープ外
  .github/workflows/plugin-version-bump.yml の修正（別タスク）。
  
  ## 制約・前提
  変更するのは .claude/rules/core-plugin-version-bump.md だけ。
  
  ## 追加指示（起動時）
  - 実装完了後、integration ブランチを remote に push し、gh pr create で base_branch への PR を作成する。integration ブランチはローカル・リモートとも残す（base_branch へ自動マージしない）。
  - 不明点は Codex に相談し、比較的良いと判断した選択肢を採用する。
  - その議論内容を Notion に記録する。
