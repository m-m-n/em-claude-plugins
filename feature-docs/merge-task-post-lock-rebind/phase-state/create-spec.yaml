  requirement.post-lock-recheck-order:
    packet_id: null
    answered_at: '2026-10-25T22:08:31+09:00'
    source: codex-consultation
    answer_mode: select
    selected_option_ids:
    - recheck_before_clean_tree
    freeform: null
    normalized_answer: Post-lock symbolic-ref re-check runs right after flock and before the clean-tree
      check; identity rejection wins over the dirty-tree error. Codex agreed with the analyst's tentative
      position.
  requirement.merge-commit-source:
    packet_id: null
    answered_at: '2026-10-25T22:08:31+09:00'
    source: codex-consultation
    answer_mode: select
    selected_option_ids:
    - read_confirmed_task_ref
    freeform: null
    normalized_answer: HEAD_SHA is read from the confirmed task-branch ref (IB_EXPECTED_REF), not HEAD.
      A plain checkout does not honour the flock, so a switch can still happen after the re-check; reading
      the ref directly closes that window. Reading both and comparing was rejected as not atomic either.
      Codex agreed.
  requirement.same-branch-new-commit-scope:
    packet_id: null
    answered_at: '2026-10-25T22:08:31+09:00'
    source: codex-consultation
    answer_mode: select
    selected_option_ids:
    - out_of_scope_still_merges
    freeform: null
    normalized_answer: A new commit landing on the same task branch during the lock wait still merges
      (it is the confirmed branch's tip); the fix is limited to branch mix-ups. Codex agreed.
  requirement.regression-test-synchronization:
    packet_id: null
    answered_at: '2026-10-25T22:08:31+09:00'
    source: codex-consultation
    answer_mode: select
    selected_option_ids:
    - poll_proc_for_flock_child
    freeform: null
    normalized_answer: 'The regression test must not rely on a short sleep: it polls /proc (monotonic
      deadline about 10 s) until a direct child of the merge-task.sh process with comm ''flock'' appears,
      failing the test if never seen, then switches branch and releases the lock. Every failure path releases
      the lock and stops and reaps the spawned child (the test''s own child only). The error assertion
      names both the expected ref and the switched-to ref. Codex proposed this over an env-var test hook
      (adds interface) and a short sleep (flaky); the analyst''s original short-wait design was found
      insufficient because the pre-lock rejection could satisfy it on a slow machine.'
