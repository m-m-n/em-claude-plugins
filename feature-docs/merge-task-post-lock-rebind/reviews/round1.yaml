  title: "マージ元の解決が参照名の補完に頼るため、タスクブランチ消失時に同名の別参照（タグ等）をマージできる"
  description: "164行目の git rev-parse --verify --quiet \"$IB_EXPECTED_REF^{commit}\" は、完全な参照名 refs/heads/em-workflow/<feature>/<task> を渡していても、gitrevisions の曖昧解決規則（$GIT_DIR/<refname> → refs/<refname> → refs/tags/<refname> → ...）に従う。タスクブランチが消えていると refs/refs/heads/... や refs/tags/refs/heads/... に解決が進み、別のコミットを返す。(1) ブランチを update-ref -d で消しても HEAD は存在しないブランチを指すシンボリック参照のまま残るので、150〜152行目の確かめ直しは通る。(2) git rm -r -f . の後は git status --porcelain が空になる。(3) 同名のタグがあると164行目がそのコミットAを返す。Aが統合ブランチの子なら fast-forward で統合ブランチがAに進み、task0001 の merged イベントが追記され、終了0になる。THREAT-MODEL.md の TM-2 の緩和策と SPEC の NFR1・FR4（タスクの ref を解決できなければ終了2）が、この経路では保証されない。同じリポジトリに書き込める主体はタスクブランチ自体を動かすこともでき（A1 で受け入れ済み）、増える能力は削除時に失敗側へ倒す動作の迂回に限られるので medium。"
  suggestion: "マージ元は完全に一致する参照だけから読む。例: TASK_TIP=$(git show-ref --verify --hash \"$IB_EXPECTED_REF\") || die ...; HEAD_SHA=$(git rev-parse --verify --quiet \"$TASK_TIP^{commit}\") || die ...。3経路はこの1つの値を使い続ける。回帰テスト: 参照を削除して作業ツリーも空にする既存手順に加えて、統合ブランチの子コミットを指す refs/tags/refs/heads/em-workflow/feat/<task> を作っておき、終了2で副作用が無いことを確かめる。同じコミットで EXPECTED_MERGE_TASK_SH_SHA256 を更新する。"
  reproduction: "使い捨てリポジトリで、有効なfeat/task0001作業ツリーと、統合ブランチの子である攻撃用コミットAを別ブランチに用意する。git tag refs/heads/em-workflow/feat/task0001 <AのID> でタグを作る。共有マージロックを保持してmerge-task.sh em-workflow/feat/integration task0001を起動し、flock待機を確認する。同じタスク作業ツリーでgit update-ref -d refs/heads/em-workflow/feat/task0001とgit rm -r -q -f .を実行し、ロックを解放する。164行目がタグからAを取得するため、期待する終了2ではなく終了0となり、統合ブランチがAへ進み、task0001のmergedイベントが記録される。この再現手順自体は実行していない（Codex 側の read-only 実行で確認された推定経路）。"
