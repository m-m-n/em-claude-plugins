base_branch: main
goal: '# destructive-guard: bash が構文エラーで捨てる行の << をヒアドキュメントと読み、次の行の破壊的コマンドを素通りさせる


  Notion タスク: https://www.notion.so/3f03509ec8ee817c89dfd4ea5d181743 （種別: セキュリティ）


  ## 脆弱性の概要

  `em-workflow/hooks/destructive-guard.py` が、bash が構文エラーで捨てる行の中の `<<` をヒアドキュメント演算子と読み、続く行を本文として検査から外す。bash は構文エラーの行を捨てて次の行を実行するので、破壊的コマンドが allow のまま実行される。


  ## 参照

  - CVE / GHSA ID: 該当なし

  - severity: medium

  - 現在のバージョン: em-workflow（feature `destructive-guard-unified-lexer` の integration ブランチ。現在は main にマージ済み）

  - 修正済みバージョン: 無し


  ## 攻撃シナリオ

  エージェントが生成する Bash コマンドが `x=( <<EOF` の行の後ろに `rm -rf ...` の行を置き、`EOF` の行で閉じる形をとると、フックは allow を返し、bash は rm を実行する。基準コミット（e69f212）のフックでも allow で、退行ではない。


  ## 影響範囲

  無人実行（em-workflow の batch）を含め、hook が allow を返すので rm -rf や git reset --hard が確認なしで実行される。


  ## 完了の定義

  - [ ] 攻撃シナリオが成立しない

  - [ ] 修正版に追随している（修正版が無い場合は暫定緩和策の欄に対応を記載）

  - [ ] 上の形を deny ケースとして `em-workflow/hooks/tests/destructive-guard-cases.json` に足す

  - [ ] 既存の deny / ask ケースが 1 件も消えていない


  ## 該当箇所

  - `em-workflow/hooks/destructive-guard.py` の `lex_shell()` / `_lex_pass()`（ヒアドキュメント演算子の登録）

  - 詳細は `feature-docs/destructive-guard-unified-lexer/reviews/round1.yaml` の `evaluation.round_summary`

  '
