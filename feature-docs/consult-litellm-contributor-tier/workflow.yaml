schema_version: 1
feature: consult-litellm-contributor-tier
created: '2026-10-06'
base_branch: main
goal: |+
  # batch の Codex 相談が litellm 経路に落ちると、同意済みでも muse-spark-contributor ではなく muse-spark で呼ばれる

  ## 現象 (必須)
  batch の Codex 相談で litellm 経路に移ったとき、同意が記録済みのリポジトリでも `muse-spark`（Standard ティア）で呼ばれる。`muse-spark-contributor` にならない。
  2026-10-05 の em-claude-plugins（feature: codex-interactive-guard-hook）で 2 回発生した。
  - 00:48:15 JST の相談：Codex がタイムアウトし、litellm 経路へ移った。`run_codex_exec.sh readonly --litellm muse-spark ...` で実行した
  - 01:12:54 JST の相談：同じく `--litellm muse-spark` で実行した
  どちらのセッションでも `muse_guard.py --list` は実行されていない。同じリポジトリでは `--list` がプロジェクトのキーを出力する（同意済み）。
  ## 再現手順 (必須)
  1. `/em-workflow:contributor-consent` で同意を記録したリポジトリで、`/em-workflow:develop --batch` を走らせる
  2. create-spec / create-plan などで Codex 相談が発生し、codex エントリが使えない（またはタイムアウトする）状況にする
  3. litellm エントリでの wrapper 呼び出しを見る
  ## 期待する挙動 (必須)
  同意が記録済みなら `--litellm muse-spark-contributor` で呼ばれる。未同意なら `--litellm muse-spark` で呼ばれる。判定は `references/reviewers.yaml` の contributor-tier pre-dispatch criteria と同じ。
  ## 完了の定義 (必須)
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある
  ## 該当箇所 (任意)
  - `em-workflow/references/question-resolution.md:431-461`（Codex consultation procedure の手順 1・2）
  - 対比：`em-workflow/references/review-phase.md:91-96`（Phase R0 の `contributor_consented` 判定）
  - `em-workflow/references/reviewers.yaml:38-49`（contributor-tier pre-dispatch criteria）
  ### 原因
  - 手順 1（447-450 行目）は「contributor として扱うかは reviewers.yaml の決まりに従う」と参照先を示すだけで、判定の手順を持たない
  - 手順 2（459-461 行目）は呼び出し例として `--litellm muse-spark` を具体的に書いている
  - オーケストレーターは手順 2 の例を文字どおり使い、参照先の判定を行わなかった
  - レビュー経路は Phase R0 で `contributor_consented` を判定する手順が明記されているため、同じ問題が起きない
  ### 修正案
  1. 手順 1 の litellm エントリの可用性判定に、review-phase.md Phase R0 と同じ `contributor_consented` 判定を加える。litellm エントリが available のときだけ次を実行し、1 行出力されたら true、何も出ないか失敗したら false とする
  ```bash
     python3 "${CLAUDE_PLUGIN_ROOT}/hooks/muse_guard.py" --list --project-dir "{project_root}"
  ```
  1. 手順 2 の呼び出し例を固定のモデル名ではなく、判定結果で決める形にする。`contributor_consented` が true なら `--litellm muse-spark-contributor`、false なら `--litellm muse-spark` と両方を明記する
  2. 「the model name written here is never edited to reach that tier」の一文は残す（チェーンのエントリ自体は `muse-spark` のまま、読み替えだけを行う）
  3. 再発検出のテストとして、`scripts/check-plugin-invariants.py` か `tests/` に「question-resolution.md の litellm 呼び出し箇所が `contributor_consented` 判定と `muse-spark-contributor` の両方に言及している」ことを検査するケースを足す
  ## 実害・発生条件 (任意)
  - 発生条件：同意済みリポジトリで、batch の Codex 相談が litellm エントリに落ちたとき
  - 実害：Standard ティアの単価（入力 \$1.25 / 出力 \$4.25）で課金され、contributor ティア（\$0.10 / \$0.20）より高くつく
  ### 関連する観察（本件の範囲外）
  01:12:54 JST の相談では codex エントリを試さず、最初から litellm エントリで呼んでいた。手順 1 は相談ごとに codex から順に可用性を判定する決まりなので、こちらも手順から外れている可能性がある。

