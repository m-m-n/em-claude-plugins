      choice: follow_bash_int_range (Codex 提案を採用、worker の推奨とは異なる); 議論の要点: bash は 2147483647
      を超える数字列を fd ではなく語として扱う（orchestrator が bash で確認: `echo 2147483648>/dev/null`
      は rc=0、`echo 2147483647>/dev/null` は「不正なファイル記述子」）。現行どおり fd として読むと `python3 <巨大な数字>>/dev/null`
      が誤拒否になり NFR2（誤拒否より通過を優先）に反する。既存 CASES に 2 桁以上の fd を固定するものは無く、変更範囲の拡大は小さい。後続の
