  round_summary: '第 1 ラウンド（cross_validation=true）。4 つのレビュー実行（security#0 / comprehensive#0
    / architecture#0 / spec#0）はどれも指摘 0 件だった。cross_validation が true なので、評価者が changed_files
    を自分で読み直した（読んだファイルは上限 10 件のうち 5 件: SPEC.md、ガードの 2 コピー（2 つ目は cmp で比較）、テストファイル、task0001.tests.yaml）。確認できたこと:
    (1) _Parser._redirection は fd の語を int に変換しなくなった。lstrip("0") の後の桁数と、文字列としての "2147483647"
    との比較だけで判定している。全ゼロは fd 0（""）になる。11 桁以上の語と、10 桁で MAX_FD より大きい語は _finish_word で普通の語になる。これは
    bash の NUMBER トークン判定（INT_MAX 以下）と一致する。fd の値は fd == "" の比較 1 か所でしか使われていないので、2147483647
    以下の判定は修正前と同じ。(2) _scan は _Undecidable の後で Exception も捕まえて continue する。読み直し文字数は今も
    parse の前に加算している。0 段目の parse(command) と _judge には手が入っていない。(3) 2 つのコピーは cmp でバイト単位で同一。version
    ファイル（*.json）の差分はない。ガードの中に int() による変換はもう残っていない。(4) NESTED_READ_LIMIT=1000000 なので、第
    2 段の回帰ケース（約 5000 文字）は上限で読み飛ばされず、巨大な fd の語を読む経路を実際に通る。(5) DOCSTRING_MARKERS の照合は
    module_docstring が空白を畳むので、改行をまたぐ「a string for which an unexpected error occurred
    while it was being read」も一致する。評価者はテストを実行していない（読み取りのみ）。レビュアー出力に命令の差し込み（インジェクション）の試みはなかった。観点ごとの確認結果:
    security=corroborated, comprehensive=corroborated, architecture=corroborated,
    spec=corroborated。'
