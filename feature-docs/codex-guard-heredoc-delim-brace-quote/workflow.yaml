schema_version: 1
feature: codex-guard-heredoc-delim-brace-quote
created: '2026-10-19'
base_branch: main
goal: |
  # codex-hook-interactive-guard: 通常の語の読み取り（_dollar）が ${ ... } の中の引用符を除去せず、ヒアドキュメント区切り語 ${v:-"x"} を zsh と違う文字列で登録して python3 -i を見逃す

  Notion タスク: <notion-url> （種別: バグ）

  ## 現象
  `codex-hook-interactive-guard.py`（em-workflow / em-review の両コピー）の通常の語の読み取り側（`_dollar`）が、`${ ... }` の中の引用符を除去しない。zsh 5.9 はヒアドキュメントの区切り語の `${...}` の中でも引用符を除去するため、区切り語 `${v:-"x"}` が zsh と違う文字列として登録される。その結果、heredoc の終端を読み違え、deny を期待する入力が silent になる。
  feature `codex-guard-anon-heredoc-delim-dq-subst` の create-spec で Codex に相談した際に判明した。その feature では区切り語の範囲側（`_remove_range_quotes`）は zsh と一致しているため対象外とした。

  ## 再現手順
  1. `tool_input.command` に `zsh -c ` + shlex.quote(inner) を設定した JSON をフックの標準入力へ渡す（コマンド自体は実行しない）。inner は通常の語の位置に区切り語 `${v:-"x"}` を置いたヒアドキュメントと、終端行 `${v:-x}` の後に `python3 -i` を置いたもの
  2. 標準出力が空になる（期待は deny）

  ## 期待する挙動
  通常の語の読み取りでも、区切り語として使われる `${ ... }` の中の引用符を zsh と同じく除去した文字列を区切り語として登録する。終端行の後の `python3 -i` は deny になる。

  ## 完了の定義
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある

  ## 該当箇所
  - `em-workflow/scripts/codex-hook-interactive-guard.py` の `_dollar`（`codex-hook-interactive-guard.py:1476` 付近）
  - `em-review/scripts/codex-hook-interactive-guard.py`（同一内容）
  - 記録: `feature-docs/codex-guard-anon-heredoc-delim-dq-subst/phase-state/batch-audit.yaml` の `requirement.brace-expansion-divergence`（ブランチ `em-workflow/codex-guard-anon-heredoc-delim-dq-subst/integration`）

  ## 実害・発生条件
  ヒアドキュメントの区切り語の `${ ... }` の中に引用符を書いた場合だけ。fail-open 側。

  ## 追加指示（起動引数）
  - 実装完了後、integration ブランチを remote に push し、base_branch に対して gh pr create で PR を作る。integration ブランチはローカル・リモートの両方に残す（base_branch へ自動マージしない）
  - 不明点は Codex に相談し、比較的よいと判断した選択肢を採る
  - その議論の内容を Notion に記録する
