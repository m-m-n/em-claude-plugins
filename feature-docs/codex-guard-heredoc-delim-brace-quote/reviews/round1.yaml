  description: "_remove_range_quotes の引用の外の $( の分岐は _skip_parens（_scan_parens）で閉じを探す。_scan_parens は ( と ) の深さを数えるだけで case 文を読まないので、${v:-$(case x in x) echo \"x\";; esac)} ではパターン末尾の x) を置換の終端とみなし、続く echo \"x\" の二重引用符を除いてしまう。登録される区切り語が zsh の終端行と一致せず、後続の python3 -i が本文として読み飛ばされる（変更前は deny）。SPEC FR1 / AC3 からの逸脱。em-review 側のコピーも同じ。"
  suggestion: "braced=True のときは、引用の外の $( を _skip_substitution(j) で読み飛ばし（戻り値が end を超えたら判定不能）、書かれたまま out に足す。括弧の範囲（braced=False）は FR5 に従い変えない。2 つのコピーを同じ変更で直し、この入力を CASES に足す。"
  reproduction: null
