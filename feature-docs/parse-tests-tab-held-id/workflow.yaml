schema_version: 1
feature: parse-tests-tab-held-id
created: '2026-10-10'
base_branch: main
goal: |
  # tests_yaml_id_resolution の parse_tests で、同じ深さのタブ行の後に深い行が来るとタブ行より前の ID が解決対象から消える

  Notion: https://www.notion.so/3f53509ec8ee81fdb689e8766d1a8320

  ## 現象 (必須)
  feature `parse-tests-tab-handling` のレビュー round 1 で、記録検査 `tests/test_tests_yaml_id_resolution.py` の `_RecordParser.parse_tests` に medium 1 件が残った（critical/high ではないため自動修正の対象外。stable_id `5a06dddcc4016a48`）。
  item ループのタブ分岐は、`last_is_id` を False に戻すのが `indent > item_indent` のときだけになっている。同じ深さ（または浅い）タブ行の後も `last_is_id` が True のまま残るため、その直後の深い行が、タブ行より前の正しい ID を `ids.pop()` で取り除いてしまう。深い行が続けているのは直前のタブ行の要素であり、その前の ID ではない。SPEC FR3 / FR4 に反する。
  - 深い行がタブ付きの場合: 今回の変更（深いタブ行での pop の追加）で入った退行
  - 深い行がタブ無しの場合: 変更前からある同じ原因の欠陥
  どちらもタブ行のエラーは出るので、記録検査が誤って通ることは無い。
  ## 再現手順 (必須)
  1. `extract_text` に、`acceptance_tests:` / `  AC-1:` / `    tests:` / `      - tests.nope.kept` / `      <タブ>- tests.nope.bad` / `        <タブ>continued` / `      - tests.nope.after` を渡すと、`AC-1` の ID が `['tests.nope.after']` になり `tests.nope.kept` が消える
  2. 上の 6 行目をタブ無しの `        continued` にしても、同じく `tests.nope.kept` が消える
  ## 期待する挙動 (必須)
  - 同じ深さのタブ行の後に深い行が来ても、タブ行より前の ID（`tests.nope.kept`）を解決対象に残す
  - 再現手順 1 ではエラーがタブ 2 件だけ、再現手順 2 ではタブ 1 件と continues or nests 1 件になる
  ## 完了の定義 (必須)
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある
  ## 該当箇所 (任意)
  - `tests/test_tests_yaml_id_resolution.py:588`（`_RecordParser.parse_tests` の item ループのタブ分岐）
  - 修正案: `tab in indentation` を報告した後、深さを問わず `last_is_id = False` にする。pop は `indent > item_indent and last_is_id` のときだけ行う。コメントの「the held state stays」も直す
  - レビュー記録: `feature-docs/parse-tests-tab-handling/reviews/round1.yaml`（integration ブランチ `em-workflow/parse-tests-tab-handling/integration`）
  ## 実害・発生条件 (任意)
  タブを含む誤った記録を書いたときだけ起きる。抽出エラーと解決エラーを 1 回の失敗メッセージに並べるという目的が、この形では果たせない。
  関連（同じレビューで low に下がり除外された、変更前からある穴）: 先頭のタブ行の直後にタブ無しの深い続き行があると、`tests/test_tests_yaml_id_resolution.py:570` の `skip_deeper(f + 1, key_indent)` が後ろの読める ID まで読み飛ばす。
