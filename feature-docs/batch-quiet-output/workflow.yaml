      language: markdown
      build_command: ""
      test_command: "python3 -m unittest discover -s tests"
      format_command: ""
      e2e_test_command: ""
    hooks:
      language: python
      build_command: ""
      test_command: "python3 em-workflow/hooks/tests/run-destructive-guard.py"
      format_command: ""
      e2e_test_command: ""

