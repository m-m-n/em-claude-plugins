schema_version: 1
feature: batch-quiet-output
created: 2026-08-29
base_branch: main
goal: |
  `develop`コマンドで`--batch`を指定した際、メインコンテキストの出力はほぼ行わなくて良いです
  --batchコマンドは`claude -p`や`claude-batch`を経由して実行されることを念頭に置きます
parent_branch: em-workflow/batch-quiet-output/integration

project:
  license: none
  design_system:
    kind: none
    paths: []
  components:
    main:
      language: markdown
      build_command: ""
      test_command: "python3 -m unittest discover -s tests"
      format_command: ""
      e2e_test_command: ""
    hooks:
      language: python
      build_command: ""
      test_command: "python3 em-workflow/hooks/tests/run-destructive-guard.py"
      format_command: ""
      e2e_test_command: ""

workflow:
  - id: create-spec
    artifacts: [REQUIREMENTS.md, SPEC.md]
    status: completed
    completed_at_commit: 446c5c6c0cfd63bafcc08954b99783c9c8ba028b
  - id: design
    artifacts: [DESIGN.md, design/]
    status: skipped
    skipped_reason: "変更対象が em-workflow プラグインの protocol ドキュメントとオーケストレーターの出力規律のみで、画面・視覚要素・デザイントークンを一切持たない。design system 候補も 0 件。"
  - id: create-plan
    artifacts: [IMPLEMENTATION.md, VERIFICATION.md, tasks/]
    status: completed
    completed_at_commit: 53c643b89cd4f1d8b434d37eb2247c43953554e2
  - id: implement
    status: completed
    base_commit: 4dc8c598399daad7e89ba07d98f32e31a2e20cf9
    completed_at_commit: e63c3451bd1b7aac13642fddc1d2e5d7fc2e6a73
  - id: review
    status: completed
    completed_at_commit: 010d8f8f5159e1497274618e1c6d3c68ccc8176b
  - id: verify
    status: pending
    result: fail
    failed_items:
      - id: SC-6
        category: spec
        title: "レビュー round 記録に残存 critical/high finding があり Success Criteria SC-6 が未達"
        evidence: >-
          reviews/round2.yaml の residual_critical_high が 3。いずれも同一サイト
          （em-workflow/references/batch-mode.md:180 / :184 の audit-item source map）で、
          記録先を batch-audit.yaml の `answers` と書いているが、phase-state.md が定義する
          コンテナは append-only の `records` リストで `answers` キーは存在しない。
          comprehensive / architecture / spec の 3 観点が独立に指摘し、review の
          auto-fix loop 3 では conflict グループ（非等価な diff が 2 件）となり
          batch の review.auto-fix-conflict 規約でサイトごとスキップされた。
          workflow-schema.md の `residual_critical_high` は 0 でなければ workflow を
          完了できないゲートでもある。
        scenario: TS-5
        requirements: [FR9, FR11, NFR4]
      - id: SC-6-b
        category: spec
        title: "phase-state.md の batch audit record 節に medium 2 件の未解決ドリフトが残る"
        evidence: >-
          reviews/round2.yaml の 546089d1de91e7dd（question-resolution.md step 7 の誤引用と
          `question_id: null` のパターン違反）と 8efe209e0d97bda5（per-command approval
          fallback にコミット到達点が無く、implement wake の reset --hard で監査レコードが
          失われうる）。どちらも medium のため R4 の候補外で、rework cap 到達により
          deferred のまま残った。
        scenario: TS-5
        requirements: [FR9, FR11]
  - id: retrospect
    status: pending

