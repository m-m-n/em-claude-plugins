schema_version: 1
feature: batch-quiet-output
created: 2026-08-29
base_branch: main
goal: |
  `develop`コマンドで`--batch`を指定した際、メインコンテキストの出力はほぼ行わなくて良いです
  --batchコマンドは`claude -p`や`claude-batch`を経由して実行されることを念頭に置きます
parent_branch: em-workflow/batch-quiet-output/integration

