lessons_candidates:
  - >-
    review の auto-fix（R4）は 1 ファイル 1 エディタなので、複数の SSOT ドキュメントにまたがる
    1 つの契約を直す処方には構造的に向いていない。round 2 では loop 1 が high 7 件を潰す一方で
    新たな high を持ち込み、loop 2 も同様で、3 ループ回して初めて収束した。同一サイトでない
    2 つの finding が互いの処方を打ち消すケース（batch-mode.md の source map 具体化 vs
    循環参照の抽象化）は same_site による conflict 判定では検出できない。
  - >-
    task0005 が新設した document-contract テストが、その後の auto-fix が意図的に変える文言を
    pin していたため、修正のたびにスイートが赤くなった。ドキュメント契約テストは
    「変えてはいけない文言」と「この変更で決めた文言」を区別できる形にしないと、
    後続の修正コストが上がる。
  - >-
    verify の失敗を rework に回す経路は有効だった。review の rework cap を使い切った後でも
    verify の cap 1 が残っており、task0006 という適切にスコープされた 1 タスクとして
    残存 findings をまとめて解消できた。
  - >-
    orchestrator が auto-fix の revert に `git cat-file` でハッシュ復元を試みたが、
    `git hash-object` は -w なしではオブジェクトを書かないため失敗し、
    batch-mode.md を空にした。BACKUP_DIR からの復元で回復したが、
    ロールバックは常にループ開始時のスナップショットから行うべき。
  - >-
    `cp` がユーザー環境で `cp -i` にエイリアスされており、スクリプト内の上書きが
    対話プロンプトで無言に失敗した。無人実行のスクリプトでは `cat src > dst` か
    `command cp` を使う。
  - >-
    `git branch -D` は destructive-guard に弾かれる。マージ済みタスクブランチの削除は
    integration worktree から `git -C {worktree} branch -d` で行えば通る
    （HEAD が integration ブランチなのでマージ済み判定が成立する）。
