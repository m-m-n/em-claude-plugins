  - question_id: review.diff-scope-after-main-merge
    packet_id: null
    answered_at: "2026-09-08T21:05:00+09:00"
    source: codex
    answer_mode: select
    selected_option_ids: [merge-base-scope]
    freeform: ""
    normalized_answer: "Use `git diff main...HEAD` (merge-base form) as the round-2 review target instead of the literal `git diff {implement.base_commit} HEAD`."
    resolution_note: >-
      gate: review phase diff-scope (unlisted-gate fallback; no gate_id at the
      originating site). Context: after commit e14a674 merged `main` into the
      integration branch, the protocol-literal `git diff 2bc54ba..HEAD` expands
      to 323 files / 69,005 insertions, almost all of which are `main` changes
      already reviewed and merged upstream. `git diff main...HEAD` yields
      7 files / 1,106 insertions — exactly the feature's own change set and the
      same scope round 1 reviewed at head fdffb3f.
      Options - A: literal `base_commit..HEAD` (323 files);
      B: merge-base `main...HEAD` (7 files) with the deviation disclosed.
      codex_consulted: true. The primary Codex CLI returned a usage-limit error
      (no answer); the litellm fallback provider (vertex-deepseek-v3.2) answered
      and chose B. No Opus escalation was needed.
      Codex rationale: the 3 unresolved highs all concern the feature's own
      implement-phase.md and SPEC; option A destroys signal-to-noise with
      already-reviewed upstream content; B keeps round-2 scope identical to
      round 1 and stays consistent with the prior record; the merge itself is
      validated separately by the verify phase's test run rather than by
      re-reviewing all of main.
      Chosen: B. Recorded here and in the round record's scope block.
  - question_id: verify.ts9-stale-scenario-wording
    packet_id: null
    answered_at: "2026-09-08T21:30:00+09:00"
    source: codex
    answer_mode: select
    selected_option_ids: [pass-and-fix-verification-doc]
    freeform: ""
    normalized_answer: "Record TS9 as PASS against the revised NFR1, and in the same change correct TS9's wording in VERIFICATION.md so the verification document and SPEC.md agree."
    resolution_note: >-
      gate: verify-phase TS9 verdict (unlisted-gate fallback; no gate_id at the
      originating site). Context: VERIFICATION.md's TS9 was written against the
      pre-revision NFR1 and demands that all six commit-docs.sh call sites share
      one `{NAME}_TIP` capture idiom. SPEC.md's NFR1 was later narrowed (commit
      e102727) to require parity only across the two call sites this feature
      adds, declaring the four pre-existing sites explicitly out of scope and
      assigning their conversion to the separate feature
      `tip-capture-idiom-unification`. implement-phase.md satisfies the revised
      NFR1: Step I.2.a (`LAUNCH_TIP`) and Step I.3 (`COMPLETION_TIP`) match each
      other in shape, capture-first idiom and exit-4 cross-reference phrasing,
      and the `Idiom split is transitional (NFR1)` paragraph declares the split,
      names the four old sites and points at the follow-up feature.
      Options - A: record PASS and leave TS9's stale text alone;
      B: record FAIL on the literal TS9 text (triggers a rework round);
      C: record PASS and correct TS9's wording to match the revised NFR1.
      codex_consulted: true. The primary Codex CLI returned a usage-limit error
      (no answer); the litellm fallback provider (muse-spark) answered and chose
      C. No Opus escalation was needed.
      Codex rationale: SPEC.md is authoritative and VERIFICATION.md is derived,
      so judging the product by stale derived text inverts that hierarchy. B is
      worst - it logs a product FAIL for documentation drift, forces a spurious
      rework round and pressures scope creep into the four out-of-scope sites,
      which the revised NFR1 forbids. A gets the verdict right but leaves the
      verification document contradicting its own SPEC, a latent trap for the
      next reader. C fixes both. Codex flagged that C can look like fitting the
      test to the code, and advised framing the edit explicitly as traceability
      maintenance citing the NFR1-narrowing commit and the follow-up feature.
      Chosen: C. TS9's table row, its manual checklist item and a traceability
      note in VERIFICATION.md were rewritten accordingly; the verdict recorded
      in workflow.yaml is pass.
  - question_id: develop.once-vs-step-c-pr-instruction
    packet_id: null
    answered_at: "2026-09-08T21:35:00+09:00"
    source: codex
    answer_mode: select
    selected_option_ids: [continue-into-step-c]
    freeform: ""
    normalized_answer: "Continue into Step C in the same turn and fulfil the operator's push + PR instruction, instead of ending the turn at the --once retrospect boundary."
    resolution_note: >-
      gate: develop Step C entry under --once (unlisted-gate fallback; no
      gate_id at the originating site). Context: the run was launched as
      `/em-workflow:develop --batch exit4-tip-argument --once` together with a
      free-text operator instruction to push the integration branch and open a
      PR against base_branch while keeping the branch locally and remotely and
      not auto-merging. The --once contract ends the turn once `retrospect`
      reaches `completed`, treating Step C as a separate phase for the next
      invocation; batch mode's `develop.completion` default is "keep branch"
      (no merge, no push, no PR). PR #17 for
      `em-workflow/exit4-tip-argument/integration` is already OPEN against
      `main`, so `gh pr create` would be rejected as a duplicate and the
      equivalent fulfilling action is pushing the branch to update that PR.
      Options - A: honour --once strictly, end the turn after retrospect and
      leave Step C to the next invocation;
      B: continue into Step C now and perform the push + PR step.
      codex_consulted: true. The primary Codex CLI provider did not answer; the
      litellm fallback provider (entry 2, vertex-glm-5.2) answered and chose B.
      No Opus escalation was needed.
      Codex rationale: the operator's explicit free-text deliverable outranks
      --once, which is a per-invocation bounding mechanism for an external
      dispatcher rather than a correctness invariant; the effective action is
      low-risk because the existing open PR only needs a push; and the next
      invocation would most likely not carry the free-text override, so Step C
      would fall back to "keep branch" and the requested push/PR would never
      happen.
      Chosen: B. Step C runs in this turn with the operator's PR option in
      place of the batch default.
