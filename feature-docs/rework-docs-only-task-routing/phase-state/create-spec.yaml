      のタスクが feature-docs/** を一つでも含めば拒否し、文書のみ・コードとの混在の両方を失敗例、コードのみを成功例として検証するのがよい。既存の
      fixture 実行基盤を使い、TS<N>→TS-<N> と既存 task0001/task0003 文書の修正について、新規タスクなし、旧 tests
