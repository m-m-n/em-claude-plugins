    resolution_note: 'batch: create-spec.requirement-clarification -> codex_consultation
      (codex entry, 1 turn). Codex: implementer は feature-docs/** を変更できず、rework-planner
      は既に文書更新と workflow patch 提案を担当しているため、その範囲を広げる案が適している（em-workflow/agents/implementer.md:311、em-workflow/agents/rework-planner.md:91、em-workflow/agents/rework-planner.md:122）。既存
      tasks 文書の修正は現在の新規作成限定から明示的に拡張し、対象を write_policy.targets に列挙するとともに、replace_own
      の同一工程・同一作成者という条件との整合を定義する必要がある（em-workflow/references/contracts/rework-planner-contract.md:124、em-workflow/references/contracts/spec-writer-contract.md:48、em-workflow/references/contracts/spec-writer-contract.md:72）。workflow.yaml
      の要件の tests 参照は現在追加しか許されないため、旧IDを除去する期待値付き置換を契約・検証・適用処理へ追加する必要がある（em-workflow/references/workflow-patch.md:184、em-workflow/scripts/validate-worker-output.py:1486、em-workflow/scripts/validate-worker-output.py:1703）。'
  requirement.docs-only.step-rerun:
