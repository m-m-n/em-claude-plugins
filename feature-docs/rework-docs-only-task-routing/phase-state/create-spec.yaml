    record_as_assumption: true
    resolution_note: 'batch: create-spec.requirement-clarification -> codex_consultation
      (codex entry, 1 turn). Codex: 文書のみの修正では、verify 起点なら verify、review 起点なら review
      だけを pending に戻すのがよい。implement へ戻すと、新規 pending タスクを要求する I.0 に反し、全タスクが merged
      の場合は処理規約違反として停止する（em-workflow/references/implement-phase.md:164、em-workflow/references/implement-phase.md:178）。Invariant
      1 は implement を pending に戻す場合の条件なので、文書経路では implement の completed を維持すると明記すれば、その条件自体を緩める必要はない（em-workflow/references/rework-task-synthesis.md:289）。develop
      の対話・batch 分岐と --once の再開先は現在 implement 復帰を前提としているため、新経路に合わせて更新する必要がある（em-workflow/skills/develop/SKILL.md:865、em-workflow/skills/develop/SKILL.md:874、em-workflow/skills/develop/SKILL.md:1059）。'
