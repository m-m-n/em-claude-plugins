    resolution_note: 'batch: create-spec.requirement-clarification -> codex_consultation
      (codex entry, 1 turn). Codex: 文書部分を文書経路で処理し、コード部分だけを現行の原因別グループ化規則でタスクにすれば、implementer
      の禁止範囲を含まないタスクを同じラウンドで登録できる（em-workflow/references/rework-task-synthesis.md:65、em-workflow/agents/implementer.md:311）。コードタスクがある混在ラウンドでは通常の
      implement 復帰を行い、起点工程だけを戻す規則は文書のみの場合に限定する（em-workflow/references/rework-task-synthesis.md:208）。docs_first
      は追加の検証ラウンドを必要とするため、同じ失敗IDの再出現やラウンド数を制限する既存の cap と干渉しやすい（em-workflow/skills/develop/SKILL.md:887、em-workflow/skills/develop/SKILL.md:892）。シナリオIDの改名が混在する場合は、covered_by_existing
      が入力 verification_index と照合される点も踏まえ、改名前後の参照を検証する規則を定義する必要がある（em-workflow/scripts/validate-worker-output.py:2187、em-workflow/scripts/validate-worker-output.py:2241）。'
