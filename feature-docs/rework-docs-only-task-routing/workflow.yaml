schema_version: 1
feature: rework-docs-only-task-routing
created: '2026-11-01'
base_branch: main
goal: |
  # em-workflow の verify rework で rework-planner が feature-docs/** だけを対象とするタスクを合成し、implementer が実装できずに implement が停止する

  種別: バグ

  ## 現象
  verify の失敗から rework-planner が合成したタスクの `files` が `feature-docs/**` だけで構成され、implementer がそのタスクを実装できずに implement が `failed`（`failed_kind: decision`）で停止する。implementer の定義には「Never modify `feature-docs/**`」の制約があるため、再試行しても同じ理由で失敗する。

  発生例: 別プロジェクトの feature `auto-dispatch-not-started`（em-workflow 0.3.98 で実行）
  - verify round 1 が `src/verification-scenario-ids.test.ts` の失敗（VERIFICATION.md のシナリオ ID が `TS<N>` で、正規形 `TS-<N>` でない）で fail
  - 差し戻し経路の選択で文言修正経路（Wording-correction route）は「requirements の tests 参照値が変わる」ため対象外と判断され、通常の verify rework が選ばれた
  - rework-planner が task0004「Canonical TS-<N> scenario IDs in the feature's verification documents」を合成。`files` は `feature-docs/auto-dispatch-not-started/VERIFICATION.md`・`tasks/task0001.md`・`tasks/task0003.md` の 3 つだけ
  - implementer が 2 回とも feature-docs/** の制約で失敗し、implement が `failed` で停止

  ## 再現手順
  1. VERIFICATION.md や tasks/*.md など feature-docs 配下の文書だけを直せば解消する verify 失敗を起こす（例: シナリオ ID の形式違反をガードテストが検出する）
  2. その修正が文言修正経路の適用条件を満たさない状態にする（例: requirements の tests 参照値が変わる）
  3. develop を実行して verify rework に進める

  ## 期待する挙動
  feature-docs/** だけを対象とする修正は、implementer に渡るタスクとして合成されず、feature-docs を書き換えられる経路（オーケストレーターまたは planner の文書更新など）で処理されて、develop が停止せずに進む。

  ## 完了の定義
  - 再現手順で現象が起きない
  - 再発を検出するテストがある

  ## 該当箇所
  - `em-workflow/agents/rework-planner.md`
  - `em-workflow/references/rework-task-synthesis.md`（Wording-correction route の適用条件）
  - `em-workflow/agents/implementer.md` の Hard constraints（`feature-docs/**` の変更禁止）

  ## 実害・発生条件
  無人実行（--batch）が implement で止まり、人が feature-docs を手で直すまで再開できない。
