  file: em-workflow/scripts/validate-worker-output.py
  line: 2371
  title: 改名申告の改名先 (to) が変更後の VERIFICATION.md に実在するか検査していない
  description: renamed_to_existing (2371-2373) は from が envelope の verification_index のキーであることだけを条件に to を受理集合へ入れる。to が現在の VERIFICATION.md に存在するか、baseline との差分で from→to の改名が実際に起きたかは見ていない。scenario_renames は rework-planner 自身の申告で信頼できない出力なので、既存 ID を 1 つ from に書けば任意の to を covered_by_existing に通せる。SSOT 側 (rework-task-synthesis.md Section 12 の Rename-aware coverage、rework-planner-contract.md の check 2) も from の条件しか定めていない。
  suggestion: feature_dir と baseline_dir がそろうときは、改名による受理を to が after_ids にある・from が before_ids にある・from が after_ids にない の 3 条件がすべて成り立つときに限る。文書の差分を取れないときは fail-closed で拒否する。rework-task-synthesis.md Section 12、契約の check 2、THREAT-MODEL の TM-5 を同じ規則に揃え、架空の to を拒否する invalid フィクスチャを足す。
  reproduction: valid-mixed-round-renamed-scenario-declared/input.json をメモリ上で読み、task0007 の covered_by_existing を ["TS-9999"]、scenario_renames を [{"from":"TS3","to":"TS-9999"}] に変更する。同梱の envelope.json と validate_worker_result に渡すとエラーは [] になる。同じ入力から改名申告を外すと rework-index エラーになる。
  reproduction_alternates: []
