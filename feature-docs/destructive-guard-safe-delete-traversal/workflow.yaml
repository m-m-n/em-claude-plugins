schema_version: 1
feature: destructive-guard-safe-delete-traversal
created: 2026-09-09
base_branch: main
goal: |
  # destructive-guard: SAFE_DELETE の前方一致でパストラバーサルが allow になる

  種別: セキュリティ / 優先度: 高 / severity: high
  Notion: https://www.notion.so/3d63509ec8ee8188a9b0d38bdee47ef0

  ## 脆弱性の概要 (必須)
  `destructive-guard.py` の `SAFE_DELETE` が正規化前のターゲット文字列に前方一致するため、`..` を含むパスや安全ディレクトリ名を接頭辞に持つ別パスが安全判定をすり抜け、削除ガードが `allow` を返す。

  ## 参照 (必須)
  - CVE / GHSA ID: 該当なし
  - アドバイザリ URL: 該当なし
  - severity: high
  - 該当パッケージ: 該当なし
  - 現在のバージョン: em-workflow 0.1.72
  - 修正済みバージョン: 無し

  ## 攻撃シナリオ (必須)
  安全ディレクトリを接頭辞に持つ削除コマンドが `allow` で通る。2026-09-09 時点の main（`ce6d3fd`）の hook に判定させた実測値:

  | コマンド | 判定 |
  | --- | --- |
  | `rm -rf /tmp/../home/sakura/valuable` | allow |
  | `rm -rf build/../src` | allow |
  | `rm -rf targets` | allow |
  | 対照: `rm -rf /home/sakura/valuable` | deny |

  同じ宛先でも `/tmp/..` を挟むだけで deny が allow に落ちる。`targets` は `target` の前方一致に合致するだけで、パスコンポーネントの境界を見ていない。
  hook が `allow` を返した後、シェルが `..` を解決して意図した作業領域の外を再帰削除する。フックは実行前に阻止できる唯一の層なので、ここが抜けると後段の防御が無い。

  ## 影響範囲 (必須)
  安全削除ルート（`/tmp/`、`build`、`target`、`.cache` 等）の外にある、実行ユーザーが書き込み可能な任意のパス。ホームディレクトリ配下の作業成果・設定・鍵が対象になりうる。`rm` はゴミ箱を経由しないため復元手段が無い。

  ## 完了の定義 (必須)
  - [ ] 攻撃シナリオが成立しない（上表の allow 3件が deny または ask になる）
  - [ ] 修正版に追随している（修正版が無い場合は暫定緩和策の欄に対応を記載）
  - [ ] `em-workflow/hooks/tests/destructive-guard-cases.json` に上記3パターンの deny ケースを追加
  - [ ] 既存の deny ケース（末尾スラッシュ無しの `tmp` / `.cache` / `/var/tmp`）が deny のまま維持されている
  - [ ] `python3 em-workflow/hooks/tests/run-destructive-guard.py` が全件通る

  ## 該当箇所 (任意)
  `em-workflow/hooks/destructive-guard.py:152`（`SAFE_DELETE` の定義）と、それを適用する `check_rm()`。
  修正の方向としては、例外を適用する前にターゲットを正規化し、親ディレクトリ参照と未解決の展開を拒否したうえで、正規表現の前方一致ではなくパスコンポーネント単位の包含判定で比較する。相対の安全ディレクトリ名は完全一致かセパレータ続きを要求する。シンボリックリンクによる脱出を安全に排除できない場合は `ask` / `deny` に倒す。

  ## 暫定緩和策 (任意)
  現状 `em-workflow/hooks/tests/destructive-guard-cases.json` はこれらのパターンを既知の穴として `allow` で固定している。修正時はケース表の同時更新が必要。
  過去に自動修正を試みた際、`SAFE_DELETE` を `tmp(?:/|$)` に緩めた副作用でスイートが 150/150 から 130/150 に落ちた（末尾スラッシュ無しの `tmp` / `.cache` / `/var/tmp` の deny が allow に退行）。前方一致の緩和だけで済ませると検知力が落ちるため、正規化とコンポーネント比較をセットで入れる。

  ## 補足
  feature `destructive-guard-trash-rewrite` の review round 1 で codex:security が指摘（finding stable_id: `9bdb454f52936e7d`）。同 feature は変更範囲を理由文と補助処理に閉じる制約を持っていたため中では修正できず、feature ごと破棄した。上表は破棄後に main で取り直した実測値。

