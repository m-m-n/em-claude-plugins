evaluation:
  round_summary: |
    round 1 / cross_validation=true のため、reviewer の主張を鵜呑みにせず main 版と本ブランチ版の
    destructive-guard.py に同一コマンド 24 本を通す差分実測を行い、報告された退行をすべて再現した。
    仕様が狙った穴（SAFE_DELETE の前方一致、末尾スラッシュ非対称、`build/../src`）は実際に塞がっており、
    164/164 pass・plugin.json と marketplace.json がともに 0.1.73・14 件の SAFE_DELETE ケース反転・
    既存 deny/ask ケースの削除ゼロ（旧 155→新 163 ケース、削除 0）を確認した。問題は、その代わりに
    新しい穴が開いたこと: 正規化で `..` を畳む処理が「解決できない先頭コンポーネント」を普通の
    ディレクトリとして相殺してしまい、main では deny だった 6 形（コマンド置換の残骸・`$@`・`$1`・
    `~+`・`~user`）が allow に落ちた。無人実行でも allow のままでフェイルセーフが効かない。
    injection: reviewer_outputs 5 件すべてを精査したが injection attempt は検出されなかった。
    perspective 別の独立検査: comprehensive#0 = corroborated（3 件すべて再現、1 件は medium に調整、
    2 件は security#0 と同一原因のため重複整理）/ security#0 = corroborated（3 件すべて再現、
    symlink の 1 件のみ SPEC NFR4 の既知残存リスクとして demote）/ architecture#0 = corroborated /
    spec#0 = findings（FR1-FR5・FR7-FR10 と 164/164・版番号一致は corroborate できたが、
    FR6「変数展開/コマンド置換は safe 例外に達しない」は未達で reviewer の「違反なし」は不正確。
    実体は F1/F2 と同一欠陥のため security カテゴリ側で計上）/ performance#0 = corroborated。
  recommended_action: "rework"
  action_rationale: |
    high 2 件はいずれも「main では deny だったものが本ブランチで allow になる」実測済みの退行で、
    しかも無人実行でも allow に落ちるためフェイルセーフが働かない。修正は UNRESOLVED_EXPANSION の
    語彙拡張だけでなく、statements() が剥がした置換の痕跡をどう伝えるかという設計判断と、
    正規化前に「解決不能な先頭コンポーネント」を判定する新しい分岐、加えて回帰ケースの追加を伴うため、
    bounded auto_fix の範囲を超える。medium 1 件も同じ check_rm の判定順序に触るので同じ rework で直す。
