    title: "先頭対象の ask が後続対象・後続コマンドの deny を隠す"
    description: |
      実測: `rm -rf tmp/$X /home/sakura/valuable` は main deny → 本ブランチ ask、
      後続に破壊的コマンドを繋げた複合形でも同じ退行が出る。decide() は最初の判定で
      sys.exit(0) するため対象ループは先頭対象で打ち切られ、確実に deny すべき後続対象を
      検査しない。理由文も `tmp/$X` しか示さないので、承認した利用者は `/home/sakura/valuable`
      まで通ったことを知らされない。無人実行では ask が deny に降格されるため（実測で batch=deny）、
      影響は対話実行に限られる。
    suggestion: |
      ask を即座に返さず保留し、全対象と後続セグメントを走査して deny があればそちらを優先する。
      理由文には判定に関わった対象を全部並べる。対象順を入れ替えた形と複合コマンド形の
      回帰ケースを追加する。
    sources: [codex:comprehensive]
