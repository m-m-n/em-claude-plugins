    file: em-workflow/hooks/destructive-guard.py
    line: 898
    title: "コマンド置換が剥がされた残骸と `..` の組み合わせで safe ルート判定を通過する（main では deny）"
    description: |
      実測で再現した。`rm -rf $(pwd)/../tmp/scratch` は main では deny、本ブランチでは
      allow（CLAUDE_BATCH の有無いずれでも allow）。原因は statements() が
      `SUBSTITUTION.sub(" ", chunk)`（destructive-guard.py:519）で `$( )` を空白に置換して
      から check_rm() にトークンを渡すことで、UNRESOLVED_EXPANSION は置換が存在した事実を
      見られない。残った `/../tmp/scratch` を normalize_candidate() が `/tmp/scratch` に畳み、
      safe_delete_target() が true を返して continue する。実際の削除先は $(pwd) の親配下で
      safe ルートの外。`rm -rf $(printf '/home/sakura/valuable /tmp/x')/../../tmp/scratch` も
      同じ経路で allow を再現した。成立条件は「置換の残骸 + `..` + safe ルートに着地する末尾」で、
      末尾が safe ルート外なら deny のまま。SPEC FR6（コマンド置換は safe 例外に達しない）の未達。
    suggestion: |
      statements() が置換を剥がした痕跡をトークン側に残す（置換位置に解決不能マーカーを置く）か、
      check_rm() 側で「先頭が解決不能なコンポーネント + `..`」の形を safe 例外の前に
      ask(rm-unresolvable) に倒す。`rm -rf $(pwd)/../tmp/scratch` を
      destructive-guard-cases.json の deny/ask ケースとして追加する。
      ただし SPEC の受け入れ条件が allow で固定しているケース表 96 / 129 行
      （対象がコマンド置換単体の形）の判定は変えないこと。
    sources: [codex:security]
