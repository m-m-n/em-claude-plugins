  - stable_id: c9d5805f9d786c12
    severity: high
    category: security
    file: em-workflow/hooks/destructive-guard.py
    line: 146
    title: "展開できない先頭トークンが `..` と相殺され、末尾の safe 名だけで allow になる（main では deny）"
    description: |
      実測した 4 形すべてが main deny → 本ブランチ allow（batch でも allow）:
      `set -- /home/sakura/valuable /tmp/x; rm -rf "$@/../build"` / `rm -rf $1/../build` /
      `rm -rf ~+/../build` / `rm -rf ~someone/../build`。UNRESOLVED_EXPANSION は
      `$(` / backtick / `${` / `$[A-Za-z_]` しか拾わず、位置パラメータ `$@` `$1` や
      特殊パラメータを検出しない。normalize_candidate() は `~` と `~/` だけを展開するため
      `~+` `~-` `~user` は通常のコンポーネント扱いになり、続く `..` に相殺される。結果、
      先頭が未解決のまま末尾の `build` だけで safe_delete_target() が true になる。
      シェルでは `~+` は $PWD、`$@` は複数語に展開されるので実際の削除範囲は safe ルート外に出る。
      SPEC FR6（変数展開は safe 例外に達しない）の実装漏れ。
    suggestion: |
      UNRESOLVED_EXPANSION に位置/特殊パラメータ（`$@` `$*` `$#` `$?` `$$` `$-` `$[0-9]`）を
      加え、normalize_candidate() が展開しないチルダ形（`~` の直後が `/` でも終端でもないもの）も
      正規化前に ask(rm-unresolvable) に倒す。上記 4 形をそのまま回帰ケースに追加する。
    sources: [codex:security]
