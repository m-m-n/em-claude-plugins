    title: "D6 の遅延発火により、後続セグメントの非 rm ask が先行する rm deny を飲み込む — 対話では deny が ask に落ち、batch でも理由が誤る"
    description: |
      check_rm() だけが発火を遅延するようになった（判定タプルを返し、main() がループ後に
      strongest_rm_decision() で 1 度だけ発火する）。他の check — check_git /
      check_external / check_permissions / check_file_destruction — は従来どおりループ内で
      decide() → sys.exit(0) する。そのため後続セグメントの非 rm の ask が、
      プールされた rm の deny が発火する前にプロセスを終了させる。

      main 版とブランチ版での実測（CLAUDE_BATCH 未設定）:

        rm -r 系の deny 対象 ; git commit --amend                main=deny branch=ask (git-amend)
        rm -r 系の deny 対象 ; chmod -R 777 /etc                 main=deny branch=ask (chmod-broad)
        rm -r 系の deny 対象 && terraform destroy                main=deny branch=ask (terraform)
        rm -r 系の deny 対象 ; kubectl delete pod x              main=deny branch=ask (kubectl-destructive)
        rm -r 系の deny 対象 ; gcloud projects add-iam-policy-binding  main=deny branch=ask (cloud-iam)

      CLAUDE_BATCH 下では ask が deny に降格されるため判定段は一致するが、発火する理由は
      依然 git-amend / chmod-broad などであり、再帰削除の対象とその書き換え案は、
      無人エージェントが自己修正のために読む判定文から消えている。1834-1839 行の
      コメントは「先行する非 rm の deny が先に exit する」場合しか説明しておらず、
      「後続の非 rm の ask が先行する rm deny を飲み込む」場合を説明していない。
      非対称は順序依存で、非 rm を先に置いた形は main でも ask のため退行しない。
      ケース表の D6 ケース（173-175 行）はすべて rm + rm であり、rm と非 rm を混ぜた
      ケースが 1 件も無い。
    suggestion: |
      D6 を一般化し、すべての check の (判定段, 規則, 文言) を 1 つのプールに集めて
      ループ後に最強段を 1 度だけ発火させる。それが大きすぎるなら、少なくとも非 rm の
      check が exit する前に収集済みの rm 判定と段を比較し、強い方を発火させる。
      両方のセグメント順序について「rm の deny 対象 ; 非 rm の ask コマンド」の
      ケースをケース表に追加し、判定段と理由 ID を固定する。
