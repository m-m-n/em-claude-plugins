    title: "Fail-open: クォートしたコマンド置換は D7 の unresolved マーキングを完全に迂回し、main が deny を返す形が allow になる（SPEC FR6 違反）"
    description: |
      WORD_BOUNDARY_CHARS（93 行）が引用符 2 種を含むため、_mark_substitutions() は
      両隣が引用符であるコマンド置換を「語全体を占める置換」と分類し、UNRESOLVED_MARK
      ではなく空白に置き換える。その結果 `.unresolved` の証跡が立たず、後続の `..` が
      その空白ごと畳み、対象が safe スクラッチルートに着地して check_rm() の安全例外に
      到達する。

      main 版とブランチ版に同一コマンド列を通した実測（CLAUDE_BATCH 未設定）:

        裸形のコマンド置換 + 親参照 + safe ルート    main=deny   branch=deny  （ケース表 165 行で固定済み）
        同じ形を二重引用符で囲んだもの               main=deny   branch=ALLOW <-- fail-open
        同じ形を単一引用符で囲んだもの               main=deny   branch=ALLOW
        同じ形をバッククォート + 二重引用符で書いたもの main=deny   branch=ALLOW
        着地先を dist / node_modules / .cache に変えた形 main=deny   branch=ALLOW
        置換の前後に文字を密着させた形               main=deny   branch=ALLOW

      引用符を付ける方がむしろ慣用的な綴りであり、ケース表は語全体を占める引用符付き
      置換（133 行）を deny として固定している。にもかかわらず末尾にパスが続く形は
      allow になる。allow は CLAUDE_BATCH でも降格されないため、無人実行ではゲート無しで
      削除が実行される。実際の削除先は置換が実行時に決める場所の親配下であり、
      ファイルシステム上の任意の位置になりうる。

      SPEC FR6（変数展開・コマンド置換を含む対象は safe 例外に到達せず
      ask(rm-unresolvable) に落ちる）に正面から違反する。変数展開は shlex が文字列として
      残すため UNRESOLVED_EXPANSION が拾えており影響を受けない。証跡を失うのは
      _mark_substitutions() が実際に取り除くコマンド置換だけ。

      round 1 の項目 4318c9f53a9d2ca3 は閉じていない。comprehensive#1 は新ケース表が
      カバーする裸形 3 種だけを確認して「閉じた」と報告したが、引用符付きの形は
      ケース表に無く、そのため 178/178 が通ったまま穴が開いている。
    suggestion: |
      WORD_BOUNDARY_CHARS から引用符を外すか、境界判定を生の隣接文字ではなく解決後の
      語に対して行う。引用符が語境界になるのは、引用区間の反対側が本物の空白・演算子で
      閉じているときだけ。最小限正しい述語は「その置換がシェル語全体を占めるか」であり、
      隣接 1 文字ではなく引用符の連なりを越えて次の空白・PUNCTUATION まで見る必要がある。
      引用符付きの各形（二重引用符・単一引用符・バッククォート・前後密着）を、裸形の
      双子が 165-168 行で既に持っているのと同じ deny としてケース表に追加し、
      引用符有無の非対称が二度と開かないようにする。
