  title: was_open 分岐が最初の ]] で読みを止めたため、]] の直後に then / do で続く新しい [[ -v ]] / [[ -eq ]] を読まなくなった（deny から allow への後退）
  description: フックの文（lex_segments()）は ; & && || | 改行でしか区切られず、then / do / else / elif などの予約語は文の区切りにならない。一方 Bash は ]] の直後に区切りなしで予約語を受け付ける（bash -n で `if [[ true && true ]] then [[ -v x ]]; fi` と `while [[
    true && true ]] do [[ 0 -eq SID=1 ]]; done` が構文として通ることを確認）。そのため && で分かれた条件式の閉じ括弧を持つ文では、]] の後ろにリダイレクト先以外の語、つまり新しいコマンドや新しい条件式が来うる。変更前の was_open 分岐は文の全語を読んでいたので、後ろの [[ -v x ]] や [[ 0 -eq SID=1 ]] の -v
    / -eq を拾ってチャンクを不確かにし、notion ペアの除外を外して deny していた。変更後は最初の ]] で break する。was_open の文では opener 分岐が走らず、コマンド単位の読みでもその文のコマンド名は許可名の true なので、then の後ろの条件式の演算語はどこでも読まれない。評価者がフックの基底版（f5c51bd1）と変更後版をメモリ上で実行して比べたところ（ファイルへの書き込みなし）、次の
    4 件が基底版では deny [git-branch-force-delete]、変更後版では allow になった。`if [[ true && true ]] then [[ -v x ]]; fi; <notion 呼び出し>`、その前に配列代入 A=(...) を置いた形、`if [[ true && true ]] then [[ 0 -eq SID=1 ]]; fi; <notion
    呼び出し>`、`while [[ true && true ]] do [[ -v x ]]; done; <notion 呼び出し>`。対照として、`; then` と区切った形と、&& のない `if [[ true ]] then [[ -v x ]]` は両版とも deny のまま。-eq の被演算子は算術評価されるので、SID=1 は notion の除外が頼る "$SID" そのものを書き換える。原因は
    SPEC の Assumptions にある「Bash は同じ文の ]] の後ろにリダイレクト（と外側のグループの `)`）しか受け付けない」という前提が誤っていること。FR1 はこの前提に沿って実装されているため、spec の観点からは SPEC どおりの実装になっている。
  suggestion: 'was_open 分岐では、閉じ括弧の後ろの語を全部読み飛ばすのをやめる。読み飛ばすのはリダイレクト先（WORDS の中でリダイレクト演算子の直後にある語）だけにして、閉じ括弧より後ろの他の語にも _unsettled() と _ARGS_JSON_DOUBLE_BRACKET_WORDS の検査を続ける。別の方法として、閉じ括弧より後ろを新しい文として opener 分岐と同じように読み、then
    / do / else / elif / { の後ろにある新しい [[ を見つけて走査してもよい。修正の前に、ケース表へ deny の行を足す（{"rule": "git-branch-force-delete"}）。例: `if [[ true && true ]] then [[ -v x ]]; fi; ` + notion 呼び出し、`while [[ true && true ]]
    do [[ 0 -eq SID=1 ]]; done; ` + notion 呼び出し。今回足した allow 4 行（>=~ / >-eq）は allow のまま保つ。あわせて、SPEC の Assumptions と FR1 の文言を「閉じ括弧の後ろのリダイレクト先は読まない」に直す。'
  reproduction: '1. 次のコマンドを PreToolUse(Bash) のペイロードとして em-workflow/hooks/destructive-guard.py に渡す: `if [[ true && true ]] then [[ 0 -eq SID=1 ]]; fi; mcp-bridge run --mcp notion --tool notion-create-comment
    --session "$SID" --args-json ''{"command":"git branch -D example"}''` 2. 基底コミット f5c51bd1 の hook は deny（[destructive-guard/git-branch-force-delete]）を返し、変更後の hook は allow を返す。3. 文 2 の `true ]] then [[
    0 -eq SID=1 ]]` は _args_json_conditional_step() の was_open 分岐で 2 語目の ]] で break し、(False, False) を返す。_args_json_declares_nameref() はコマンド名を true として読むので、-eq はどこでも読まれない。4. bash -n -c ''if [[ true && true
    ]] then [[ -v x ]]; fi'' は構文エラーにならない。'
