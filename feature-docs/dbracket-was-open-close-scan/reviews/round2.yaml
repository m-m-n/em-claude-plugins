  title: ']] の直後の then / do に続くコマンドがコマンドとして分類されず、リダイレクト先の読み飛ばしで偶然の検出もなくなった'
  description: '&& で分かれた条件式の続きの文（例 `true ]] then pwd >-eq`）は 1 つの単純コマンドになり、コマンド名は条件式の被演算子 `true`（許可名）として読まれ、`then` の後ろの本体コマンドは分類されない。今回の変更で閉じ括弧の後ろのリダイレクト先を読まなくなったため、`if [[ true && true ]] then pwd >-eq;
    fi` は基底版の真から偽に変わった。'
  suggestion: 閉じ括弧の後ろで then / do / else / elif がコマンド位置に来たら、その後ろの語を新しい単純コマンドとして既存の検査に渡す。難しければ、その文を uncertain として扱う（安全側）。
  reproduction: シェルでは実行せず、`TestDbracketOpenerArithScan.scan()` に `if [[ true && true ]] then pwd >-eq; fi` を渡す。`pwd` は単独なら不確実と判定されるが、この形では `true` がコマンド名になり、`-eq` はリダイレクト先として除かれるため、走査は `False` を返す。`]]` と
    `then` の間に `;` を入れると `pwd` が独立して検査され、結果は `True` になる。
  reproduction_alternates: []
