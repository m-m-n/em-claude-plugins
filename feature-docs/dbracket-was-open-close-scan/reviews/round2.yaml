  title: then / do の後ろで開いた新しい [[ が && / || で文をまたぐと、開いた状態が次の文に渡らず演算語を読まない
  description: was_open 分岐は最初の有効な `]]` で closed を立てると、同じ文の後ろで `then` / `do` に続く新しい `[[` が開いても状態を更新せず、末尾で `is_open = not closed`（偽）を返す。新しい条件式が `&&` / `||` で分かれると、次の文で演算語を読まず、notion ペアの除外が残る。4 観点の reviewer
    が独立に同じ箇所を指摘した。基底版も同じ結果で、今回の差分による後退ではない。
  suggestion: 閉じ括弧の後ろでも、コマンド位置（then / do / else / elif の後）にある、書かれたとおりの `[[` で条件式を開き直し、次の有効な `]]` で閉じる。末尾の実際の状態を OPEN として返す。
  reproduction: 無害な入力 `if [[ true && true ]] then [[ true && true ]]; fi` を `TestDbracketWasOpenCloseScan.reports()` に渡す。最初の `&&` と次の `&&` の間では二つ目の条件式が開いているため、`reports[1]` は `(False, True)` になるべきだが、実装は
    `(False, False)` を返す。
  reproduction_alternates: []
  reproduction_overflow: false
