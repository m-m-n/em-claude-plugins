schema_version: 1
feature: dbracket-was-open-close-scan
created: '2026-11-26'
base_branch: main
goal: |
  # destructive-guard の [[ ]] 継続分岐が閉じ括弧の後ろの語まで条件式として読む

  種別: バグ

  ## 現象

  `was_open` 分岐が `]]` を探す前に、その文の全単語を `_unsettled()` に渡す。条件式が `&&` をまたぐと、閉じ括弧の後ろにあるリダイレクト先のファイル名まで条件式として読む。`[[ true && true ]] >=~` では出力先の `=~` を正規表現演算子と見なし、後続の notion 呼び出しが `KIND_NOTHING` から `KIND_INSPECTED` に変わる。

  ## 再現手順

  1. `[[ true && true ]] >=~` の後に `--session "$SID"` 付きの標準形の notion 呼び出しを続けたコマンドを静的判定にかける
  2. 後続の呼び出しが検査対象になる（誤爆）

  ## 期待する挙動

  `was_open` 分岐でも単語を出現順に読み、有効な `]]` に達した時点で条件式の走査を終える。閉じ括弧より後ろの語で検査除外が外れない。

  ## 完了の定義

  - 再現手順で現象が起きない
  - 再発を検出するテストがある

  ## 該当箇所

  `em-workflow/hooks/destructive-guard.py` 8789 行付近（`was_open` 分岐）

  ## 実害・発生条件

  dbracket-opener-arith-scan のレビュー第1ラウンドで comprehensive / architecture / spec 観点が medium として報告し deferred にした（stable_id: 73ea2b1bdc1a19f3）。

  ## 追加指示

  - 不明点は Codex に相談し、比較して良い方の選択肢を採る。相談内容は Notion のタスクページに記録する。
  - 実装完了後は integration ブランチを remote に push し、base_branch への PR を gh pr create で作る。integration ブランチはローカル・リモート両方に残す（base_branch へ自動マージしない）。
