  title: _segment_boundaries() の区切り判定が lex_segments() とずれ、`2>&1`・`>&2`・`&>`・`>|`・`\;`・行継続の後ろにある bash 宛ての本文を data と判定する
  description: '_segment_boundaries() は opaque 範囲の外にある SEGMENT_CHARS をすべて区切りとして数える。一方 lex_segments() は `2>&1`・`>&2`・`&>`・`&>>`・`>|` を 1 個の REDIRECT トークンとして扱い、`\;`・`\&`・行継続 `\<改行>` はエスケープとして扱うので区切りにしない。この差で
    _segment_index_at() の文番号が後ろへずれ、後続の文がホスト文に選ばれる。後続が DATA_COMMANDS（echo など）だと data が確定し、SHELL_SINK フォールバックにも回らない。評価者が基準 f7880283 と現在版で再実行し、次の形がすべて基準 deny、現在 allow になることを確かめた: `make 2>&1 | tail -5\nbash
    <<''EOF''\ngit reset --hard HEAD\nEOF\necho done`、`ls &>/dev/null; bash <<''EOF''…EOF\ncat /dev/null`、`docker ps \\\n  -a\nbash <<''EOF''…EOF\necho done`、`find . -exec ls {} \; -print\nbash <<''EOF''…EOF\necho
    done`、`echo hi >| /tmp/x; bash <<''EOF''…EOF\necho done`、`bash 2>&1 <<''EOF''\nrm -rf /home/sakura/x\nEOF\necho hi`、`bash &>/dev/null <<''EOF''…EOF\necho hi`、`bash >|/tmp/log <<''EOF''…EOF\necho hi`、`echo
    a\\&b; bash <<''EOF''…EOF\necho hi`、`echo x >&2\nbash <<''EOF''…EOF\necho done`、`ls &>>/tmp/l\nbash <<''EOF''…EOF\necho done`。`2>&1` と `>&2` は日常的な書き方なので、AC-4 のシンク検知が実際の利用で外れる。逆向きのずれで誤検知も戻る（`ls 2>&1\ncat
    > /tmp/p <<''EOF''\ngit reset --hard HEAD\nEOF\npython3 x.py` は deny、`2>&1` を外すと allow）。architecture#fallback も同じ根本原因を critical で報告した（1321 行の「字句構造は 1 つのスキャナで決める」という約束と実装の食い違い）。'
  suggestion: '文番号の出どころを lex_segments() の区切りトークンに一本化する。_TrackingLexer にトークンの元テキスト上の位置を記録させ、_mark_substitutions() の置換前後のオフセットと対応付けて文番号を引く。あわせて fail-closed の確認を入れる: _statement_info_at() が選んだ table[idx] に
    `<<`/`<<-` 演算子トークンが無ければ None（undetermined）を返し、FR5 のフォールバックに回す。_segment_boundaries() を REDIRECT・エスケープの規則に合わせるだけの修正では、scan_structure() 側の opaque 範囲の誤り（別指摘の `\''`）を拾えないので、fail-closed の確認は必須とする。上の各形を deny
    ケース、`ls 2>&1\ncat > /tmp/p <<''EOF''…EOF\npython3 x.py` を allow ケースとして cases.json に追加する。'
