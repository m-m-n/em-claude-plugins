    deny される。`(x)` 形式のパターンでも同じ原因の誤爆が以前からある。【見逃し（base f7880283 では deny だったもの）】`if a; then if b; then cat <<'EOF'\ngit reset --hard HEAD\nEOF\nfi\nfi | bash`、`! if true; then cat <<'EOF'...EOF\nfi | bash`、`case
