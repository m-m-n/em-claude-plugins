schema_version: 1
feature: destructive-guard-heredoc-reset-hard
created: '2026-09-28'
goal: |
  # destructive-guard の git-reset-hard 判定が、ヒアドキュメント本文の reset --hard 文字列で誤爆する

  Notion タスク: https://www.notion.so/3cc3509ec8ee815eac09f3b89799f372 （種別: バグ）

  ## 現象（必須）
  `em-workflow/hooks/destructive-guard.py` の `git-reset-hard` 判定が、**実行されない位置**に
  書かれた `reset --hard` の文字列で発火する。ヒアドキュメント本文（`<<'EOF'` … `EOF`）の中で
  散文として言及しただけでも deny になる。
  出たエラー:
  ```
  [destructive-guard/git-reset-hard] `reset --hard` は未コミットの変更を復元不能に捨てる。個別ファイルなら `git checkout -- <path>` を使う。
  ```
  `.claude/rules/hook-tests.md` は allow 側の既知ケースとして「ヒアドキュメントの本文を 1 行ずつ
  コマンドとして読む」を挙げているが、`git-reset-hard` 判定はその除外が効いていない。

  ## 再現手順（必須）
  1. 次の内容の Bash コマンドを実行する（ヒアドキュメント本文にだけ `reset --hard` が現れる）:
  ```
     cat > /tmp/p.txt <<'EOF'
     Some prose mentioning `git reset --hard` inside a documentation quote.
     EOF
     echo done
  ```
  2. `[destructive-guard/git-reset-hard]` で deny されることを確認する。ファイルは書かれず、
  `echo done` にも到達しない。
  3. 同じ payload を `python3 em-workflow/hooks/destructive-guard.py` に直接流しても同じ結果に
  なる（インストール済みキャッシュではなくリポジトリ側のコードで再現する）。

  ## 期待する挙動（必須）
  ヒアドキュメント本文・クォート内の文字列など、シェルがコマンドとして解釈しない位置に現れる
  `reset --hard` では発火しない。実際に `git reset --hard` を実行するコマンドセグメントのときだけ
  `ask` / `deny` になる。

  ## 完了の定義（必須）
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある（`em-workflow/hooks/tests/destructive-guard-cases.json` に
  allow 側ケースとして追加し、`python3 em-workflow/hooks/tests/run-destructive-guard.py` が通る）
  - [ ] 既存の deny / ask ケースが 1 件も消えていない

  ## 該当箇所（任意）
  - `em-workflow/hooks/destructive-guard.py` — `git-reset-hard` ルールと、ヒアドキュメント本文の除外処理
  - `em-workflow/hooks/tests/destructive-guard-cases.json` — allow 側ケースの追加先
  - `.claude/rules/hook-tests.md` — 誤爆を見つけたら先にケースを足す規律

  ## 実害・発生条件（任意）
  `--batch` の無人実行をその場で止める。`ask` は `claude-batch` 下で `deny` に降格されるので、
  誰も答えられないまま走行が終わる。
  実際に踏んだ経路: `/em-workflow:develop --batch` の create-spec フェーズで、
  `references/question-resolution.md` の Codex consultation を実行しようとした。プロンプト本文に
  「Step I.2.a には `git reset --hard` の記述が無い」という調査対象の説明が含まれていたため、
  プロンプトをヒアドキュメントでファイルに書き出す時点で deny された。回避には Write ツールへの
  切り替えが必要だった。em-workflow 自身のプロトコル文書が `reset --hard` を多数含むため、
  このリポジトリを対象にした batch 実行では踏みやすい。

  ## 追加指示（起動引数より）
  - 実装完了後、integration ブランチを remote に push し、gh pr create で base_branch への PR を作成する。integration ブランチはローカル・remote 双方に残す（base_branch へ自動マージしない）。
  - 不明点は Codex に相談し、比較的良いと判断した選択肢を採用する。
  - その議論内容を Notion に記録する。
