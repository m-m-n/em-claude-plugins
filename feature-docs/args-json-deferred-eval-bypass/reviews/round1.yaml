  title: '`[[ ]]` の `&&`・`||` より後ろにある算術比較を見落とす'
  description: '`_lex_layout()` は、SEGMENT_CHARS だけからなる演算子トークンをすべて文の区切りにする。字句解析器の `cond` 状態もこれを止めない。そのため
    `[[ yes && true -eq x ]]` は、`[[ yes` と `true -eq x ]]` の2文に分かれる。後者の名前は `true` で、`_ARGS_JSON_CERTAIN_NAMES`
    により語を読まずに確定になる。一方 Bash は、右辺の `-eq` を現在のシェルで算術評価する。そのとき、オペランドの変数の値（ANSI-C 引用で `{` を隠した `b[${ declare
    -gn r=A[@]; }]` など）の添字が展開され得る。今回足した TS-4 の `[[` ケースは、どれも論理演算子を含まない。security と spec が指摘している。'
  suggestion: '`[[` から対応する `]]` までを1つの条件式として扱い、`&&`・`||` で分かれた後ろの断片も `[[` の語として判定する（例: 閉じていない `[[` で始まる文の後は、`]]`
    を含む文まで条件式として読む）。演算子の位置にある語だけを判定するようにすれば、文字列比較の値として引用した `''-eq''` や `-v` を数える誤判定も同時に直る。`&&` と `||`
    の両方の形を deny ケースに足す。'
  sources:
  - codex:security
  - codex:spec
  confidence: 100
  reproduction: '`[[ echo -eq 1 ]]` の後に `--session "$SID"` 付きの標準形の Notion 呼び出しを置くと、`statements()` は JSON
    を検査する。条件を `[[ yes && echo -eq 1 ]]` に変えると検査対象が空になる。Bash 5.3.9 では `[[ yes && true -eq ''flag=1'' ]]`
    の評価後に `flag` が `1` になり、右辺が現在のシェルで評価されたことを確認できる'
