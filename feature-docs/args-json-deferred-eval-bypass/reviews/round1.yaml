    フック側の流れは次のとおり。`_args_json_strip_redirections()` の `{名前}` 判定は添字付きの形に一致しないので、語は `:` や `echo` の引数として残る。これらの名前は語を読まずに確定になる。添字
    `[x]` は代入語でも複合代入でもないので array-subscript 領域にならず、`$` も含まないので展開レベルの読み取りにも掛からない。そのため、`x` に ANSI-C 引用で `{`
    を隠した `b[${ declare -gn r=A[@]; }]` を入れておけば、算術評価が値の添字を展開して nameref を作り得る。Bash 側の挙動は実行では確かめていない。'
