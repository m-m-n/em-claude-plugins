  title: '`$` と `{` の間の行継続で、パラメータ展開の再評価を見落とす'
  description: '`_args_json_parameter_defers()` は、`head[2:]` で先頭2文字を捨ててから行継続を除く。`$`、バックスラッシュ、改行、`{p@P}`
    の順に並ぶ展開では、捨てるのが `$` とバックスラッシュになる。残りが改行から始まるため変数名の照合に失敗し、False を返す。字句解析器がこれを領域として読まなくても結果は同じになる。`:`
    の引数は読まれず、リテラル検査も `${` の後ろが空白や `|` ではないので掛からない。Bash は二重引用符の中でも行継続を除くので、`${p@P}` として展開する。


    また、通常のチャンクを読む `_args_json_has_deferred_evaluation()` は、書かれたままの本文を1回読むだけで、ヒアドキュメント本文のように行継続を除いた本文を読み直さない。そのため、他の構文の開始記号（`$((`
    など）をまたぐ行継続も同じ穴になり得る。security と spec が指摘している。'
  suggestion: 先に行継続を除いてから `${` を外す。加えて、チャンクの本文に行継続がある場合は、`_bodies_hold_current_shell_substitution()` と同じく、行継続を除いた本文も字句解析して数える。`$`
    と `{` の間、`$(` と `(` の間に行継続を入れた形を deny ケースに足す。
  sources:
