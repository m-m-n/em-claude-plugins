  suggestion: 左から 1 回だけ走査し、`[` の次の `]` を探して判定する。閉じ括弧が見つからなければ、その場で未確定として打ち切る。9092 行のオプション判定も入れ子の `*` を持つので、3 条件を個別に調べる形に置き換えるとよい。開き括弧を多数並べた入力で処理時間が線形に収まることを単体テストで固定する。
  reproduction: '[security@s1#0] `note=` と開き角括弧だけの文字列で、括弧 256/512/1024 個の中央値は 98/377/1515 マイクロ秒（倍ごとに約 4 倍）

