- stable_id: a03aa1f45bc1f7bc
  severity: high
  category: security
  file: em-workflow/hooks/destructive-guard.py
  line: 8625
  title: 'TM-1: 行継続を挟んだリダイレクト変数の配列添字の評価を見落とす'
  description: '`_args_json_fd_variable_deferred()` は、`_args_json_word_source()` が返す書かれたままの綴り（行継続を含む。`_MarkedText.text` も行継続を残している）を `_ARGS_JSON_FD_VARIABLE` で照合する。`{` の直後や変数名の途中に引用されていない行継続があると一致しない。一方
    Bash は行継続を取り除いてから `{name[subscript]}` を読み、添字を算術評価する。8622 行の隣接判定も `marked.text` で語の直後の 1 文字を見るので、`}` と演算子の間に行継続があっても外れる。外れた語は `_args_json_strip_redirections()` でも除かれない（9137 行は添字のない `{name}` だけを除く）。そのため
    `:` などの許可リストのコマンドの引数として扱われ、文は確定と判定される。ANSI-C 引用で `${` を隠した値を添字に置けば、現在のシェルで nameref を作れる。それでも後続の Notion 呼び出しの `--args-json` は検査されない。読解で再現した。第1ラウンドで直した行継続の穴（パラメータ展開）と同じ類型が、task0003 で足した読みに再発している。'
  suggestion: 語の綴りを照合する前に、引用の外にある行継続（`marked.pairs` が持つ位置）を取り除き、その綴りで `_ARGS_JSON_FD_VARIABLE` を照合する。演算子との隣接も、行継続を飛ばした位置で判定する。綴りを書かれたまま読む処理が行継続を除くか区別するかは、共通の補助関数で明示する。`[[` / `]]` の判定は行継続を区別して未確定側に倒している。次の
    3 か所に行継続を置いた deny ケースを、case table と単体テストに足す。変数名の途中、`{` の直後、`}` と演算子の間。
  reproduction: '[security@s1#0] 読み取り専用の `: {slots[i]}</dev/null` を `_args_json_nameref_scan` に渡すと `True` になる。`slots` の `sl` と `ots` の間にバックスラッシュと改行を挿入した入力では `False` になった。Bash 5.3.9 では `i=2` のとき、行継続がある入力でも配列の添字
    2 にファイル記述子が代入された

    [security@s2#0] 静的に確認できる。`_MarkedText.pairs` は Bash が取り除く行継続の位置を保持するが、`_args_json_word_source()` は 8588 行目で元の文字列を返す。8626 行目の照合では変数名部分に英数字と下線しか認めないため、名前の途中に行継続があると一致せず、添字の判定に到達しない'
  reproduction_alternates: []
  reproduction_overflow: false
