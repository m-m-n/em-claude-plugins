schema_version: 1
feature: args-json-deferred-eval-bypass
created: '2026-11-21'
base_branch: main
goal: '# destructive-guard: 後から評価される値（算術式・${var@P}・read）経由で notion ペアの除外を回避できる


  ## 脆弱性の概要 (必須)


  `em-workflow/hooks/destructive-guard.py` の notion ペアの除外（`_args_json_notion_pair()`）は、先行するコマンドが名前参照を作り得るかを
  `_args_json_nameref_scan()` で判定する。値を後から現在のシェルで評価し直す構文（算術式、`${var@P}` など）を経由すると、この判定をすり抜けて
  `--args-json` の検査を省かせられる。


  ## 参照 (必須)


  - CVE / GHSA ID: 該当なし

  - アドバイザリ URL: 該当なし

  - severity: high

  - 該当パッケージ: 該当なし

  - 現在のバージョン: integration ブランチ em-workflow/args-json-quoting-bypass/integration の時点（review
  round 3 完了後）

  - 修正済みバージョン: 無し


  ## 攻撃シナリオ (必須)


  シェルを実行する MCP ツールが mcp-bridge に登録された環境で、次のどれかの形で名前参照 `r` を配列に向け、`mcp-bridge run --mcp
  notion --tool notion-create-comment --format "$r" --args-json ''{"command":"<破壊的なコマンド>"}''`
  を実行する。フックは notion 宛てと判定して JSON を検査せず allow にするが、Bash では `"$r"` が `json --mcp desktop-commander
  --tool start_process` に展開され、別のツールに送られる。


  - ANSI-C で開始記号を隠した値を `${p@P}` で評価する（`p=$''$\x7b declare -gn r=A[@]; }''`）

  - `$''''{` で分割した値や ANSI-C の値を、算術式 `(( a ))` の配列添字で評価する

  - 区切り語を引用したヒアドキュメントやファイルから `read` した値を同じように評価する


  round 3 の auto-fix では、字面の `${ ` / `${|` をチャンク全体から探す判定（引用の内外を問わない）で塞いだが、値を実行時に組み立てる形は防げない。


  ## 影響範囲 (必須)


  無人実行で、破壊的なコマンドが destructive-guard の deny を通らずに MCP 経由のシェルで実行される。


  ## 完了の定義 (必須)


  - [ ] 攻撃シナリオが成立しない

  - [ ] 修正版に追随している（修正版が無い場合は暫定緩和策の欄に対応を記載）

  - [ ] 上の各形を `em-workflow/hooks/tests/destructive-guard-cases.json` の deny ケースとして固定する


  ## 該当箇所 (任意)


  - `em-workflow/hooks/destructive-guard.py` の `_args_json_has_brace_substitution()`、`_args_json_nameref_scan()`、`_args_json_declares_nameref()`（算術コマンドを「何も宣言しない」と扱う箇所）

  - 方向性: 値をコードとして評価し直す構文（`((...))`、`let`、`$((...))`、`[[ ]]` の算術比較、変数を使う配列添字、`declare
  -i` 付きの代入、`${x@P}`）をチャンクが持つときは、シェル状態を不明として除外を外す。字面検索は補助にする

  - 同時に扱うとよい残件: 文字列を評価する組み込みの拒否リストが不完全（`fc`、`history`、`enable`、`compgen`、`complete`、`bind`）。許可リスト方式も検討する

  - 詳細は integration ブランチの `feature-docs/args-json-quoting-bypass/reviews/round3.yaml`（findings
  の `50060ea113b79522`）


  ## 暫定緩和策 (任意)


  無し


  '
