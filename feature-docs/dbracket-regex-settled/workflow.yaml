schema_version: 1
feature: dbracket-regex-settled
created: '2026-11-26'
base_branch: main
goal: '# destructive-guard が [[ ]] 内の正規表現比較・拡張パターンだけで後続の notion 呼び出しを検査対象にする


  種別: バグ


  ## 現象

  `_unsettled()` が `=~` の位置と右辺を確認せず、正規表現比較や拡張パターンがあるだけで条件式を不確定と読む。`[[ version =~ ^v
  ]]`、`[[ a =~ b ]]`、`[[ x == =~ ]]`、`[[ a == @(true) && true ]]` で、修正前は `KIND_NOTHING`
  だった後続の notion 呼び出しが `KIND_INSPECTED` になり、最終判定が `deny` になる場合もある。


  ## 再現手順

  1. `[[ version =~ ^v ]]` の後に `--session "$SID"` 付きの標準形の notion 呼び出しを続けたコマンドを静的判定にかける

  2. 後続の呼び出しが検査対象になる（誤爆）


  ## 期待する挙動

  SPEC FR3 のとおり、`_ARGS_JSON_DOUBLE_BRACKET_WORDS` の演算語（算術比較・`-v`）を含まない条件式は確定として扱い、後続の呼び出しを
  `KIND_NOTHING` に保つ。正規表現・拡張パターンの情報は閉じ括弧の判定にだけ使う。


  ## 完了の定義

  - [ ] 再現手順で現象が起きない

  - [ ] 再発を検出するテストがある


  ## 該当箇所

  `em-workflow/hooks/destructive-guard.py` の `_unsettled()`（8777 行・8822 行付近）


  ## 実害・発生条件

  無人実行で誤爆すると ask/deny で run が止まる。dbracket-opener-arith-scan のレビュー第1ラウンドで comprehensive
  / architecture / spec 観点が medium として報告し deferred にした（stable_id: 225b48189d76347d,
  ea1bfdc61f810e3e, 56b5aa2890c19362）。


  ## 追加指示

  不明点は Codex に相談し、比較的良いと判断した選択肢を採用する。

  '
