    resolution_note: 'gate: rework.spec-change; chosen: share-split; not chosen: exclude-dollar; relaxed route (bound-set category security); Codex consulted: true (codex entry, 1 turn); Opus escalation ran: false; Codex chose share-split (labelled goal_not_met, evidence AC-1, AC-4, FR2, FR3, FR4, NFR1, NFR2, TM-1, TM-2). Key points: Codex ran the scans itself; the ^v repro gives allow, but both $ forms give nameref False / shadow True / inspected / deny, so the goal of removing the misfire is not met for AC-1/AC-4. exclude-dollar is smaller but leaves the false deny in place. Relax only NFR2''s caller restriction so _args_json_shadow_scan() item 3 shares the counted-parenthesis reading, keep it decision- and reason-free, keep existing deny/ask coverage (NFR1), fail-safe closers (TM-1) and boundaries outside confirmed patterns (TM-2).'
