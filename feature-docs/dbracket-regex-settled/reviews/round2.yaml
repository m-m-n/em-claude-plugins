  line: 8845
  title: 正規表現の語に `|` で接した `]]` を閉じ括弧と読み、後ろの算術比較を見落とす
  description: Bash は `=~` の右辺を読む間、`|` と `(...)` を語の一部として扱う。そのため `]]|true` や `a|]]` は 1 語の正規表現になる。フックの字句解析器は
    `|` で文を分け、_depth_reading() の隣接判定は `(` `)` しか見ない。このため `[[ x =~ ]]|true || true -eq 0 ]]` では最初の `]]`
    が深さ 0 の閉じ括弧になり、後ろの `true -eq 0 ]]` が _ARGS_JSON_DOUBLE_BRACKET_WORDS の検査を通らず、`--session "$SID"` 付きの
    notion 呼び出しが KIND_NOTHING になる。変更前は `=~` があるだけで不確定だったので後退にあたる。
  suggestion: パターンの開始後、`]]` が `|` に空白なしで接している場合は閉じ括弧にせず、文を不確定にする。単独の `|` で分けられた直前の文が、開いたパターンの語で終わった場合（`a|]]`）も同じにする。
  reproduction: 無害な入力 `[[ x =~ ]]|true || true ]]` を Bash と `_args_json_conditional_step()` で比較した。Bash
    は式全体を受理して終了状態 0 を返すが、フックは最初の `|` の手前ですでに `OPEN=False` を返し、`_args_json_nameref_scan()` も `False` を返した。
  reproduction_alternates: []
  reproduction_overflow: false
