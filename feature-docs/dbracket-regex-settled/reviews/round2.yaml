  title: 行継続で書いた `]]` の後も条件式を開いたまま読み、case の分岐本体のコマンド名を項目 3 から隠す
  description: Bash は `]\<改行>]` を `]]` として読み条件式を閉じるが、フックは閉じ括弧にしないため、継続文 `case =~ in (=~) eval '...' ]]
    ;; esac` の `=~` をパターン開始と読み、分岐の括弧を数え、分岐本体の `]]` を閉じ括弧と読む。_args_json_shadow_scan() がその括弧を counted_by_statement
    に渡すため、分岐本体の `eval` / `source` が項目 3 で読まれず、固定の `--session` で `--args-json` が検査されない。変更前からの後退。
