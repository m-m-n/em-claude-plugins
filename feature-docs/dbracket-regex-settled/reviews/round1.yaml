  title: パターンの `)` に空白なしで接した `]]` を閉じ括弧と読み、後ろの算術比較を見落とす
  description: Bash は `=~` の右辺や拡張パターンの括弧の対を読んだ後も、空白が来るまで同じ語を読み続けるため、`(x)]]` は 1 語のパターンになる。フックは `)` の直後の `]]` を深さ 0 の閉じ括弧と読み、`[[ x =~ (x)]] || true -eq 0 ]]` の算術比較を見落として後続の notion 呼び出しを allow にしていた（TM-1 の対策漏れ・変更前からの後退）。拡張パターンと継続文の同じ形も同じ。
  suggestion: '`)` の直後や `(` の直前に空白なしで接する `]]` を閉じ括弧にせず、文を不確定にする。'
  reproduction: '`[[ a =~ (x)]] || true == true ]]` を lex_segments() から _args_json_conditional_step() に渡すと、最初の `||` の時点で uncertain=False, open=False が返る。Bash は `(x)]]` 全体を正規表現として読む。'
  reproduction_alternates: []
  reproduction_overflow: false
