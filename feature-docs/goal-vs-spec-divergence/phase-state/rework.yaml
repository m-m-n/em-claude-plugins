    の検査項目（written_artifacts が targets と allowed_write_roots に収まること）は整形済みコピーで実施し合格した
  lesson: envelope 構築時に validate-worker-output.py の期待する構造を先に確認する。orchestrator 側にも dispatch
    前の envelope 検証が要る
