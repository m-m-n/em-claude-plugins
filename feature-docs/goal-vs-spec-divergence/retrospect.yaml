lessons_candidates:
- SSOT 文書に対する prose の auto-fix が 2 ラウンド連続で回帰を生んだ。loop 1 は analyst プロンプトに契約と矛盾する条件付き規定を足し、loop 2 は control
  path 拒否リストに『plugin root 相対』注記を足して照合不能にした。いずれも次のループで修正できたが、review-editor は単一ファイルに閉じるため『引用先を直す』修正ができず、書き写しを増やす方向に倒れやすい。文書中心の
  feature では needs-judgment の batch 自動適用を見直す価値がある。
- review-editor が単一ファイル固定であることが、複数文書にまたがる SSOT 修正を構造的に適用不能にしている（round 4 で 1 件が skipped、複数が deferred）。同じ修正が
  verify 由来 rework でタスク化されたら 1 発で通った。横断修正は auto-fix ではなく rework に回す判定基準があってもよい。
- LiteLLM ハーネスのクロスモデルレビューが 3 観点とも review_data_too_large で落ちた。diff が 748KB。この skip_reason は R2b の再試行対象に入っていないため
  fallback も効かない。大きな feature では diff の分割かファイル単位のレビュー指示が要る。
- implement-phase.md がマージ済みタスクブランチの片付けに強制削除フラグ付きの git branch -D を指定しているが、同梱の destructive-guard が git-branch-force-delete
  で拒否する（reset --hard にはある em-workflow 用の除外が無い）。統合 worktree 側で git branch -d を打てば git の安全検査も guard も通る。task0001-task0021
  のブランチが残っているのは、以前のラウンドで同じ拒否に当たった痕跡と思われる。
- worker-envelope の write_policy.targets を map 形式で組み立てたところ validate-worker-output.py の worker-result 検証が例外で落ちた（期待は
  path キーを持つ配列）。dispatch 前に envelope 自体を検証する経路が無い。
- rework-planner が生成する task plan の Files 節で、パス以外に inline code を書くと validator の task-plan-files パーサが『複数のバックティック引用パス』として弾く。2
  回の dispatch で計 7 箇所発生し、いずれも手で直した。テンプレート側で『Files の各行は code span を 1 つだけにする』と明示すると消える。
- review round 1-3 の findings の resolution が全て unresolved のまま記録されており、round 4 の round_context に 49 件が『未解決』として渡った。rework
  でタスク化された findings を fixed に更新する経路が無いため、round_context の抑止機構が実質的に機能していない。
- heredoc を <<PY（クォート無し）で書くと、Python 文字列内のバックティックを zsh がコマンド置換として実行してしまい、書き出した YAML から該当箇所が消えた。ドキュメント生成では常に
  <<'PY' を使う。
