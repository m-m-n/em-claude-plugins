schema_version: 1
feature: codex-guard-anon-arg-escaped-backquote
created: '2026-10-18'
base_branch: main
goal: '# codex-hook-interactive-guard: 匿名関数の引数中の ( 〜 ) 範囲の入れ子のコマンド置換（\` で打ち消したバッククォート）を群の読みが終端と誤認し、本体の
  python3 -i を見逃す（回帰）


  ## 現象 (必須)

  `codex-hook-interactive-guard.py`（em-workflow / em-review の両コピー）で、zsh 匿名関数の引数中の
  `(`〜`)` 範囲に入れ子のコマンド置換（バックスラッシュで打ち消したバッククォート）があると、群の読みが打ち消したバッククォートを終端と誤認する。最後のバッククォートが未閉鎖と判定され
  `_Undecidable(''quote'')` になり、匿名関数本体の明示的な `python3 -i` の deny が外れる（無出力）。

  feature `codex-guard-anon-arg-backquote`（範囲内にバッククォートがあれば群の読みに戻す変更）で表に出た後退。変更前は deny
  だった。review round 1 の指摘（stable_id `dfdc820511d4c859`、severity medium、category security）。

  ## 再現手順 (必須)

  1. `tool_input.command` に `zsh -c ''setopt nonomatch nobareglobqual; function {
  python3 -i; } foo(`echo \\`echo x\)''` を設定した JSON をフックの標準入力へ渡す（コマンド自体は実行しない）

  2. 終了コード 0・空出力になる（期待は `permissionDecision: deny`）

  ## 期待する挙動 (必須)

  引用符の外のバッククォートの終端を探すときも、`_skip_substitution` の b 文脈と同じくバックスラッシュの組を読み飛ばし、本体の `python3
  -i` を deny する。

  ## 完了の定義 (必須)

  - [ ] 再現手順で現象が起きない

  - [ ] 再発を検出するテストがある

  - [ ] `tests/test_codex_hook_interactive_guard.py` の `CASES` に上のコマンドを deny として追加

  - [ ] 両コピーがバイト単位で同一のまま

  ## 該当箇所 (任意)

  - `em-workflow/scripts/codex-hook-interactive-guard.py` の `parse` の引用符外バッククォート処理（1200-1205
  行付近、`s.find("`", i + 1)`）、`_read_argument_parens\`（943-948 行付近）

  - `em-review/scripts/codex-hook-interactive-guard.py`（同一内容）

  - 記録: `feature-docs/codex-guard-anon-arg-backquote/reviews/round1.yaml`（ブランチ `em-workflow/codex-guard-anon-arg-backquote/integration`）

  ## 実害・発生条件 (任意)

  見逃し側（fail-open）。THREAT-MODEL の明示的な `-i` は拒否する方針を満たさない。書かれる見込みの小さい形。


  Notion: <notion-url>


  ## 追加指示


  - 実装完了後 integration ブランチを push し gh pr create で base_branch への PR を作る（自動マージしない。integration
  ブランチはローカルとリモートの両方に残す）。不明点は Codex に相談し比較的良い案を採用、その議論内容を Notion に記録する。

  '
