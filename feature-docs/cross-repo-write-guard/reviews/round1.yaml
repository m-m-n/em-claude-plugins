  title: 'TM-3: シンボリックリンクを解決する前に `..` を字面で畳むため、リンク経由の外部書き込みを見逃す'
  description: normalize()（os.path.normpath）が、パスを結合した直後に `link/..` を字面で除去する。リンクの解決（resolve_path()）はその後になる。カーネルは `link` を先に解決し、解決後のパスに `..` を当てる。このため repo/link が外部ディレクトリを指すとき、`printf x > link/../victim` の実際の書き込み先は外部になる。hook は repo/victim と判定して何も出力せず、CLAUDE_BATCH でも deny にならない。THREAT-MODEL の TB-2 / TM-3 が求める「実パスの意味での比較」を満たしていない。同じ根本原因で逆向きの誤判定も起きる。/var/run -> /run のホストでは `/var/run/../tmp/x` の実体は除外対象の /tmp/x だが、hook は /var/tmp/x として ask（無人実行では deny）を返す。comprehensive#0 がこの箇所を誤爆側から報告しており、本件に統合した。
  suggestion: 境界判定と除外判定に使うパスは字面正規化を通さず、realpath と同じ方法（解決済みのパスに `..` を当てる）で解決する。/dev シンクの照合（FR5）は、従来どおり字面正規化後のパスで行う。resolve_path() の親ディレクトリのキャッシュは、末尾要素が `.` / `..` のときは使わず realpath に直接渡す。修正の前に、`echo hi > link_out/../x`（ask）と `/var/run/../tmp` 相当（silent）を CASES に追加する。
  reproduction: メモリ上で cwd と git toplevel を /var/cwg-review/repo、repo/link を /var/cwg-review/outside/child へのリンクとして模擬する。CLAUDE_BATCH=1 で Bash の command に `printf x > link/../victim` を渡すと judge() は None を返す。一方、元のパスを realpath() に渡すと /var/cwg-review/outside/victim となることを確認した。直接この外部パスを指定すると deny になる
  reproduction_alternates: []
  reproduction_overflow: false
