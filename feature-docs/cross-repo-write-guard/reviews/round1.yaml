  title: 'TM-3: cp のコピー先がディレクトリのとき、実際に書き込む子パスのリンクを検査しない'
  description: cpmv_destinations() は `-t DIR` か最後のオペランドだけを返し、resolve_path() はそのディレクトリ自身しか解決しない。GNU cp は既存ディレクトリへコピーするとき DIR/<コピー元の名前> に書き込む。その子パスが既存のシンボリックリンクなら、リンク先を開いて上書きする。repo/dest/config が外部の既存ファイルを指していれば、`cp payload/config dest/` は外部ファイルを上書きするが、hook は repo/dest を内部と判定して何も出力しない。SPEC FR7(d) の字面は「ディレクトリ自身」を書き込み先としているが、TM-3 の「repo 内のリンクが外を指す場合」の穴にあたる。mv は rename でリンク自体を置き換えるので、外部には書き込まない。
  suggestion: cp で書き込み先が `-t` か既存ディレクトリのときは、静的に解決できる各コピー元の basename を結合したパスも resolve_path() で解決して判定する。コピー元が解決できなければ、従来どおりディレクトリだけを判定する。-r の深い階層までは追わなくてよい。
