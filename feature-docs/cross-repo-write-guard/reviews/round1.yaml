  title: 'TM-1: コマンドを絶対パスで書くと tee / sed / cp / mv とラッパーを認識しない'
  description: command_destinations() は名前を `tee` / `sed` / `cp` / `mv` との完全一致で比べる。resolve_command() の WRAPPERS 判定（695 行）も同じ比べ方をしている。このため `/usr/bin/tee /outside/x`、`/bin/cp a /outside/b`、`/usr/bin/env tee /outside/x` では書き込み先が集まらず、確認も無人実行時の deny も起きない。TM-1 の「FR7 の形を FR8 の範囲で必ず認識する」を満たしていない。
  suggestion: 引用されていないコマンド語が `/` を含むときは basename で比べる。ラッパーの判定（WRAPPERS）にも同じ扱いを入れ、`/usr/bin/tee` と `/usr/bin/env tee` の ask ケースを CASES に追加する。
  reproduction: 実際の git リポジトリを cwd とし、CLAUDE_BATCH=1 で Bash の command に `/usr/bin/tee /var/cwg-outside/victim` を渡すと、候補が空になり judge() は None を返した。`tee /var/cwg-outside/victim` に変更すると deny になる。
