schema_version: 1
feature: cross-repo-write-guard
created: '2026-10-12'
base_branch: main
goal: '# em-workflow に、カレント git リポジトリ外への書き込みを確認するフック cross-repo-write-guard を追加する


  Notion タスク: <notion-url>


  ## やりたいこと (必須)

  カレントの git リポジトリの外へのファイル書き込みを検知し、確認を挟むフックを em-workflow に追加する。


  ## 背景・なぜ (必須)

  `~/.claude/rules/cross-repository-writes.md` のルール（カレントリポジトリ外への書き込み前に確認する）をフックで強制する。


  ## 受け入れ条件 / 完了の定義 (必須)

  - [ ] `em-workflow/hooks/cross-repo-write-guard.py`（仮称）を追加し、`em-workflow/hooks/hooks.json` の `Write|Edit|MultiEdit` matcher に登録する

  - [ ] 書き込み先が `git rev-parse --show-toplevel` の配下でないとき `ask` を返す

  - [ ] `/tmp` 配下と `~/.claude/` 配下は判定せず通す

  - [ ] Bash 経由の書き込み（`>` リダイレクト、`tee`、`sed -i`、`cp` / `mv` の書き込み先）のうち静的に解決できるものを判定対象にし、`Bash` matcher に登録する

  - [ ] 静的に解決できないパス（変数展開など）は判定しない

  - [ ] `tests/test_cross_repo_write_guard.py` に `CASES` 表 `(期待する判定, ラベル, コマンド)` でテストを置く

  - [ ] `.claude/rules/hook-tests.md` に cross-repo-write-guard の節を追加する


  ## スコープ外 (任意)

  ユーザーが名指ししたパスの判別。


  ## 制約・前提 (任意)

  - `.claude/worktrees/` 配下の worktree から、メインリポジトリ側へ書く場合の扱いを決めておく

  - `claude-batch` 下では `ask` が `deny` に降格される


  ## 実行時の追加指示

  - 不明点は Codex に相談し、比較的良いと判断した選択肢を採用する。

  - その議論の内容を Notion（タスクページへのコメント）に記録する。

  '
