  title: 'TM-2: TS-2（rm 文 2 つ）で判定と理由 ID を固定していない'
  description: THREAT-MODEL.md の TM-2 の緩和策は「全複数置換ケースで判定 ask（CLAUDE_BATCH 時は deny）と理由 ID rm-unresolvable を固定する」と書いている。TS-2（`rm -rf $(cat a); rm -rf $(cat b)`、174-179 行）は check() に decision_expected / rule_expected を渡していない。check()（105-125 行）は値が None のとき判定と理由 ID の比較を省くので、判定が allow に退行しても位置表記の並びさえ合えば TS-2 は通る。TM-2 の Verified by 欄は TS-2 を挙げておらず、SPEC FR2 も判定を固定しないため、SPEC 違反ではなく脅威モデルの緩和文に対する検証の穴。
  suggestion: TS-2 の check に decision_expected="ask" と rule_expected="rm-unresolvable" を渡す。さらに同じコマンドを batch=True で実行し、判定が deny、理由 ID が rm-unresolvable、指定の並びが同じになることを確かめるケースを 1 つ足す。
  reproduction: ファイルを変更せず、run_guard の戻り値をメモリ内で差し替えて TS-2 を実行した。入力は rm -rf $(cat a); rm -rf $(cat b)。check に渡す JSON を permissionDecision="allow"、permissionDecisionReason="[destructive-guard/unexpected-rule] 1番目のrmの1番目の対象[`$(...)`] 2番目のrmの1番目の対象[`$(...)`]" とすると、testsRun=1、failures=[]、errors=[] で成功した。
