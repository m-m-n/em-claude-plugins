schema_version: 1
feature: resolve-findings-parent-symlink
created: '2026-11-18'
base_branch: main
goal: '# resolve-verified-findings.py が親ディレクトリのシンボリックリンク経由で対象外の review 記録を書き換えられる


  種別: セキュリティ / severity: medium


  ## 脆弱性の概要

  `resolve-verified-findings.py` は書き換え対象ファイル自体のシンボリックリンクは拒否するが、親ディレクトリ（`feature-docs/{feature}/reviews`
  など）のシンボリックリンクは検査しない。リンク経由で対象外の feature の review 記録を書き換えられる。


  ## 参照

  - CVE / GHSA ID: 該当なし

  - 現在のバージョン: feature `verify-pass-resolves-deferred-findings`（PR #95）の時点

  - 修正済みバージョン: 無し


  ## 攻撃シナリオ

  `feature-docs/current/reviews` を別 feature の `reviews` へのリンクにし、`--feature-dir` に
  `current` を渡して実行すると、別 feature の `reviews/round1.yaml` の deferred 指摘（high、spec）が
  `fixed` に書き換わる。review round 1 の指摘 `cc3ea79e666d0a2d`（security、TM-5）。リポジトリ内のファイルを置ける者が対象。


  ## 影響範囲

  別 feature の review 記録の未解決指摘が解決扱いになり、自動マージの事前チェック（`merge-preflight.py`）を不正に通る。


  ## 完了の定義

  - [ ] 攻撃シナリオが成立しない

  - [ ] 修正版に追随している（修正版が無い場合は暫定緩和策の欄に対応を記載）


  ## 該当箇所

  `em-workflow/scripts/resolve-verified-findings.py`（`reviews` ディレクトリの解決、`lstat`、`mkstemp`、`os.replace`）。`realpath`
  で worktree 配下に収まることを確かめるか、`O_DIRECTORY|O_NOFOLLOW` で開いた `dir_fd` 基準で読み書きする。

  '
