    normalized_answer: 修正方式（dir_fd 基準）、reviews がリンクのときの invalid-round-record、feature
      ディレクトリがリンクのときの invalid-workflow、祖先のリンクは検査しない、workflow.yaml とマッピングファイルは現状どおり辿る、の
      5 点は analyst の判断どおり採用する。
