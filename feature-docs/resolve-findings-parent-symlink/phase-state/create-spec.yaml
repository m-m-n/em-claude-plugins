    normalized_answer: --feature-dir の末尾に区切り文字（/）が付いていても、最後の要素がシンボリックリンクなら FR-2 と同じく
      invalid-workflow で拒否する。末尾の区切り文字を付けた引数でリンクを辿らせる回避を塞ぐ（open は末尾 / があると O_NOFOLLOW
      でもリンクを辿るため）。リンクでない正当なディレクトリに末尾 / を付けた場合はこれまでどおり動く。
  requirement.decision-points-confirmation:
