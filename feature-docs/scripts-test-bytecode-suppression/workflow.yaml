schema_version: 1
feature: scripts-test-bytecode-suppression
created: '2026-11-07'
base_branch: main
goal: |
  # テスト全体実行で em-workflow/scripts/__pycache__ にバイトコードが書かれる

  種別: 改善

  ## やりたいこと
  `python3 -m unittest discover -s tests` の全体実行で、`em-workflow/scripts/` 配下に `__pycache__` が生成されないようにする。

  ## 背景・なぜ
  全体実行の後、`em-workflow/scripts/__pycache__` が生成される。`em-workflow/scripts/` 配下のスクリプトを読み込む一部のテストモジュールが原因。プラグイン配下は配布物にそのままコピーされる。
  hook-test-bytecode-suppression（`em-workflow/hooks/` 配下のみが対象）の実装中に見つけた範囲外の課題。

  ## 受け入れ条件 / 完了の定義
  - 全体実行の後、`em-workflow/scripts/` 配下に `__pycache__` ができない
  - 既存テストはすべて通る
