    line: 2131
    title: "値を取る他の pip オプションの引数を独立したトークンとして解析している"
    description: "_requirements_option_items は -r / -c / -e 以外のオプションを読み飛ばすが、その引数は消費しない。pip（optparse）は値を取るオプションの直後のトークンを、先頭が '-' でも値として消費する。(1) 過大方向: `-f \"-enamed-pkg\" -r actual.txt` で pip は '-enamed-pkg' を find-links の値とするが、実装は editable と読み named-pkg を直接依存に加える。`--find-links \"-rdeps.txt\" -r actual.txt` でも deps.txt を辿る（封じ込めは効く。SPEC A1 が許容する方向）。(2) 過小方向: `--trusted-host -c -r deps.txt` で pip は '-c' を trusted-host の値とし deps.txt を include として辿るが、実装は -c が '-r' を消費し、items=[] で complete=True のままになる。deps.txt の脆弱なパッケージは直接依存に入らず、normalize_pip が推移的として黙って捨てる（THREAT-MODEL TM-5 の経路）。`-f -c -r X`、`-i -c -r X`、`--extra-index-url -c -r X`、`--trusted -c -r X` も同じ。変更前は行全体を無視していたため回帰ではない。"
    suggestion: "値を取る pip のオプション（-i / --index-url、--extra-index-url、-f / --find-links、--trusted-host、--no-binary、--only-binary、--use-feature 等）は分離形のとき次のトークンを値として消費して読み捨てる。これらの長形式の省略形も値を消費するか complete=False にする。回帰テスト: `--trusted-host -c -r deps.txt`、`-f -c -r deps.txt`、`-f \"-enamed-pkg\" -r actual.txt`、`--find-links \"-rdeps.txt\" -r actual.txt`。"
