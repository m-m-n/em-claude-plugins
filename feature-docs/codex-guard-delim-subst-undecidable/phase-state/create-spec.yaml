    normalized_answer: '語の文脈で読み、区切り文字も語の文字: コマンドの位置でない (（語の途中・引数の位置の語頭）は語の括弧の文脈で開き、中の語はコマンドの位置にならない（case・閉じの語・head
      は効かない）。# は語の文字。引用・\ の組・$( )・${ }・バッククォートは追う。入れ子の ( は同じ文脈。;・&・改行も語の文字として読む。コマンドの位置の (、<(、>(、=( はコマンドを読む括弧のまま。'
    resolution_note: 'gate: create-spec.requirement-clarification (batch-policies: codex_consultation,
