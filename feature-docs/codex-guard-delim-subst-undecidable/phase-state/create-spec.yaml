    normalized_answer: '閉じで算術かサブシェルかを決める: コマンドの位置の ((（for の後を含む）は )) で閉じれば算術の文脈、そうでなければ今の入れ子のサブシェルの読みを保つ。読み直しは
      1 つの (( につき 1 回、総量を制限して線形時間を保ち、上限超過は判定不能。'
    resolution_note: 'gate: create-spec.requirement-clarification (batch-policies: codex_consultation,
      record_as_assumption); Codex consulted (codex entry, 1 turn, 3 questions batched, converged); Codex
      recommended arith_or_subshell. Codex は算術（実測 5・6）とサブシェルへの読み直し（実測 8）を両立でき、arith_undecidable は今 deny
      の echo "$( ((echo a) ) )"; python3 -i を出力なしに変えて危険、arith_always は実測 8 を読めない、と判断。注意: 入れ子で再走査が重なると二次時間になり得るので総文字数を制限し明示スタックで処理する。
      zsh 5.9 実測（feature-docs/.../phase-state 外の記録は SPEC に転記）: 区切り語 ${v:-$(echo <<EOF)} は同じ行の ) で閉じ、全文が区切り語になる（終端行
      EOF では後続が本文に吸われる）。$( ((1 << 2)) )・for ((..<<..))・$(echo foo(case x))・$(echo foo(a;b)) も全文が区切り語。$(
      ((echo a) ) ) は zsh がサブシェルとして読み直す。*(e:true<改行>:N) も受理。 Opus escalation: not run. Recorded as assumption.'
