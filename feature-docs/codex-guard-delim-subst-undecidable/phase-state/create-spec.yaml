    packet_id: create-spec-q0001
    answered_at: '2026-10-23T20:00:43+09:00'
    source: batch-codex-consultation
    answer_mode: select_or_freeform
    selected_option_ids:
    - shared_same_line
    freeform: null
    normalized_answer: '共有スキップで同じ行の閉じを読む: case 文の外の << で、置換の閉じ ) までに引用されていない改行が無いものは閉じの位置を変えずに読み進める。<<
      の後に置換の中で改行が来るものと、case 文の中の << は判定不能のまま。二重引用符側の 1 行の "$(cat <<EOF)" も同じ読み。'
    resolution_note: 'gate: create-spec.requirement-clarification (batch-policies: codex_consultation,
      record_as_assumption); Codex consulted (codex entry, 1 turn, 3 questions batched, converged); Codex
      recommended shared_same_line. Codex は zsh 実測 1〜4 と一致し本文読みを追加せず直せる、区切り語側も共有読みなので括弧数えに戻すより case の読みを保てる、と判断。注意:
      改行検出で << ごとの再走査をせず線形時間を保つ、呼び出し構造と再帰禁止を保つ、heredoc を常に判定不能とする docstring 固定テストを直す。不採用: delimiter_fallback（case
      のパターンの ) で閉じる読みに戻る）、shared_model_body（コード増分最大）。 zsh 5.9 実測（feature-docs/.../phase-state 外の記録は SPEC
      に転記）: 区切り語 ${v:-$(echo <<EOF)} は同じ行の ) で閉じ、全文が区切り語になる（終端行 EOF では後続が本文に吸われる）。$( ((1 << 2)) )・for
      ((..<<..))・$(echo foo(case x))・$(echo foo(a;b)) も全文が区切り語。$( ((echo a) ) ) は zsh がサブシェルとして読み直す。*(e:true<改行>:N)
      も受理。 Opus escalation: not run. Recorded as assumption.'
  requirement.double-paren-fallback:
