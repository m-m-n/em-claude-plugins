    file: em-workflow/scripts/codex-hook-interactive-guard.py
    line: 2638
    title: "語の括弧（W）の中の `<(` / `>(` をコマンドリストとして読まず、後ろの対話起動の拒否が外れる"
    description: "`_skip_substitution` の `(` 分岐は、top が W のときに `elif top not in \"awW\"`（2642 行）を通らない。このため `s[j-1] not in \"<>=\"` の判定に届かず、W の中の `<(` / `>(` も入れ子の W として開く。W は case・注釈・`<<` を読まないので、プロセス置換の中の case パターンの `)` で括弧が早く閉じ、置換の終わりが zsh より前になる。その後の引用符の対応がずれて文字列全体が判定不能（出力なし）になり、変更前に deny だった入力を通してしまう。SPEC FR3（`<(`・`>(` は今の読みを保つ）と NFR3（今判定できている形を判定不能に変えない）に反する。em-review 側のコピーもバイト単位で同一なので、同じ欠陥がある。"
    suggestion: "`(` 分岐で top が W のときも、`s[j-1]` が `<` か `>` なら p（コマンドの位置から始まるコマンドリスト、close_command は False）として開く。閉じた後は W の中に戻す。2 つのコピーを同じ変更で直し、再現手順の `zsh -c` の形を deny の行として CASES に足す。"
    reproduction: "tool_input.command に `zsh -c 'if false; then echo \"$(echo foo(<(case x in x) echo x;; esac)); : \"(\")\"; fi; python3 -i'` を設定し、JSON を各ガードの標準入力へ渡す。変更後は両方とも終了コード0、標準出力なしとなるが、変更前は deny と判定する。安全な実行確認として末尾の `python3 -i` を `echo SECURITY_REVIEW_MARKER` に置き換え、zsh -fc で実行すると、終了コード0でマーカーが表示され、後続コマンドへの到達を確認できる。入力は _read_quoted_unit から _skip_substitution の W 分岐へ到達する。"
