schema_version: 1
feature: mcp-bridge-exec-tool-rescan
created: '2026-11-18'
base_branch: main
goal: |
  # destructive-guard が mcp-bridge run --args-json の本文を実行先の MCP ツールを問わず再走査から外し、シェル実行型ツール経由の破壊的コマンドを通す

  ## 脆弱性の概要 (必須)

  `em-workflow/hooks/destructive-guard.py` は、静的な単一の `mcp-bridge run` コマンドの `--args-json` の値を、実行先の MCP サーバー・ツールを問わず「実行されないデータ」として扱い、単一引用符内のコマンド置換候補を再走査しない。引数をシェルで実行する MCP ツールを呼ぶ場合、破壊的なコマンドが検知されずに通る。

  ## 参照 (必須)

  - CVE / GHSA ID: 該当なし
  - アドバイザリ URL: 該当なし
  - severity: medium
  - 該当パッケージ: 該当なし
  - 現在のバージョン: feature destructive-guard-false-deny（PR #84）の時点
  - 修正済みバージョン: 無し

  ## 攻撃シナリオ (必須)

  シェルを実行する MCP ツール（例: desktop-commander の `start_process`）が mcp-bridge に登録された環境で、次のコマンドを Bash から実行する。

  ```txt
  mcp-bridge run --mcp desktop-commander --tool start_process --args-json '{"command":"echo $(git branch -D example)","shell":"bash"}'
  ```

  変更前のフックは deny、変更後は allow になる。`--args-json` の値は MCP ツール側で bash に渡され、置換部分が実行される（review round 2 の security 観点で読解により再現。実サーバーでの削除は未実施）。

  ## 影響範囲 (必須)

  destructive-guard が止めるべき破壊的な git 操作・ファイル削除が、シェル実行型 MCP ツール経由で素通りする。置換で包まない平文の形は変更前から allow だったため、新たに開いたのは置換で包んだ形のみ。

  ## 完了の定義 (必須)

  - [ ] 攻撃シナリオが成立しない
  - [ ] 修正版に追随している（修正版が無い場合は暫定緩和策の欄に対応を記載）
  - [ ] 再走査を省く対象を、引数を実行しないと分かっている `--mcp` / `--tool` の組（例: notion の `notion-create-comment`）に限る。または THREAT-MODEL の TM-1 に受け入れた残存リスクとして記録する
  - [ ] `em-workflow/hooks/tests/destructive-guard-cases.json` に上記シナリオのケースを追加する

  ## 該当箇所 (任意)

  - `em-workflow/hooks/destructive-guard.py` の FR2 判定関数（`mcp-bridge` の `--args-json` をデータ語として集める箇所）
  - `feature-docs/destructive-guard-false-deny/THREAT-MODEL.md` の TM-1
  - review の stable\_id: 717acb1e7d66bc83

  ## 暫定緩和策 (任意)

  シェルを実行する MCP ツールを mcp-bridge に登録しない。
