  description: 'chunk_subs は生の Bash 文字列から `$(` / バッククォートを探して作るため、`--args-json` の `command` に JSON エスケープ（例:
    `\u0024(...)`）で書いた置換は候補にならず、再走査に入らない。フックは `--args-json` を JSON として復号しない。この差分が持ち込んだものではなく、同じ形は変更前も
    allow だった。置換を使わない平文の破壊的コマンドを start_process に渡す形も変更前後とも allow で、フックは MCP 実行ツールに渡す引数の意味を解析していない。根本は
    SPEC の範囲（S1 のスキップ条件の絞り込み）の外にある設計上の境界。'
  suggestion: このフィーチャーでは直さず、別フィーチャーの候補とする。対処する場合は、notion の組以外の mcp-bridge run について `--args-json` を JSON
    として復号して実行ツールの `command` をシェルの入力として検査するか、宛先や実行文字列が静的に決まらない形を ask に回すかを SPEC で決める。誤 deny の費用も合わせて考える。
  reproduction: TS-1 と同じく Bash の PreToolUse 入力から `start_process` に渡る `--args-json` を対象にする。無害な置換を含む `command`
