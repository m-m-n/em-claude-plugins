schema_version: 1
feature: sca-cargo-implicit-workspace-members
created: '2026-10-11'
base_branch: main
goal: |
  # SCA 軸: Cargo の path 依存による暗黙のワークスペースメンバーがあっても直接依存の集合を完全として扱う

  種別: バグ
  Notion: https://www.notion.so/3f03509ec8ee8107b10fc1283d34c9b2

  ## 現象 (必須)
  `_cargo_workspace_view` は `[workspace]` に `members` が無いとき、または空配列のとき `complete=True` を返す。Cargo ではワークスペースのディレクトリ配下にある path 依存は自動でメンバーになり、その依存は Cargo.lock に入るが、メンバーのマニフェストは読まれない。
  その結果、メンバーの直接依存に対する advisory が推移的依存として黙って捨てられ、判定不能の件数にも残らない（THREAT-MODEL の TB-1 / TM-5 が防ぐはずの経路）。

  ## 再現手順 (必須)
  1. ルートの `Cargo.toml` に `members` を書かない `[workspace]` と、`member = { path = "member" }` の依存を置く
  2. `member/Cargo.toml` に advisory のあるクレートを宣言する
  3. 軸 2 を走らせる → 直接依存の集合は `{'member'}` のまま `complete=True`、member 側の advisory が落ちる

  ## 期待する挙動 (必須)
  - `[workspace]` があり、ルートの依存テーブル（target 配下も含む）に `path` を持つエントリがあるときは `complete=False` にし、判定不能の件数として報告する
  - path 依存を含まない `members` 省略・空配列のワークスペースは、従来どおり完全として扱う

  ## 完了の定義 (必須)
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある（`members` の省略・空配列と path 依存の組み合わせ）

  ## 該当箇所 (任意)
  `em-workflow/scripts/scan-dependencies.py:1669`（`_cargo_workspace_view`）

  ## 実害・発生条件 (任意)
  SPEC FR5 は「members を列挙している」場合だけを不完全の条件にしているため、この修正は FR5 の文言より範囲を広げる。
  出典: em-workflow feature `sca-directness-resolution` のレビュー round 1 の finding `b34e1e48141a9af9`（security / medium）。閾値未満のため auto-fix されず `unresolved` のまま残った残件。ブランチ `em-workflow/sca-directness-resolution/integration`。

  ## 追加指示
  - 実装完了後、integration ブランチを remote に push し base_branch に向けて gh pr create で PR を作る。ブランチはローカル・リモート両方に残す（自動マージしない）
  - 不明点は Codex に相談し、比較的良いと判断した選択肢を採用する
  - その議論内容を Notion に記録する
