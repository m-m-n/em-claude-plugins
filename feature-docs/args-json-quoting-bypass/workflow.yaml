schema_version: 1
feature: args-json-quoting-bypass
created: '2026-11-20'
base_branch: main
goal: |
  # destructive-guard の --args-json 検査を引用・エスケープの書き方で回避できる残件

  ## 脆弱性の概要 (必須)

  `em-workflow/hooks/destructive-guard.py` の `mcp-bridge run --args-json` の検査を、引用・エスケープ・展開の書き方を変えるだけで回避できる経路が残っている。feature mcp-bridge-args-json-exec-guard の review round 4 で、自動修正の上限に達して持ち越した high 2 件と関連する medium の残件。

  ## 参照 (必須)

  - CVE / GHSA ID: 該当なし
  - アドバイザリ URL: 該当なし
  - severity: high
  - 該当パッケージ: 該当なし
  - 現在のバージョン: integration ブランチ em-workflow/mcp-bridge-args-json-exec-guard/integration の時点
  - 修正済みバージョン: 無し

  ## 攻撃シナリオ (必須)

  シェルを実行する MCP ツールが mcp-bridge に登録された環境で、Bash から `mcp-bridge run` を実行し、`--args-json` の `command` に破壊的なコマンドを入れる。次の書き方では、フックが JSON を検査せず allow にする。

  1. `3f7145c6c8c0b26a`（high）: notion の組の除外判定（`_args_json_notion_pair`）を、引用していない展開の単語分割で偽装できる。`--format ${UNSET:-json --mcp desktop-commander --tool start_process}` の形にすると、フックは notion 宛てと読むが、実際は別の MCP ツールに送られる。
     - loop 2 で除外を狭める修正を入れたが、既存の正規の notion 呼び出し 6 件を誤って deny にしたため、Codex と相談して取り消した。除外の条件を、展開が単語分割で別のフラグを作れない形に限る方向で直す必要がある。
  2. `f16e5bb8d5da2621`（high）: `=` 形式のフラグ語で、引用の外のバックスラッシュ付き `=`（`--mcp\="$S"`）を区切りとして認識せず、後続の静的な `--args-json` が検査から外れる。

  ## 影響範囲 (必須)

  無人実行で、破壊的なコマンドが destructive-guard の deny を通らずに MCP 経由のシェルで実行される。

  ## 完了の定義 (必須)

  - [ ] 攻撃シナリオが成立しない
  - [ ] 修正版に追随している（修正版が無い場合は暫定緩和策の欄に対応を記載）
  - [ ] 既存の allow ケース（notion の正規の呼び出し）を deny にしない
  - [ ] 上の 2 件を `em-workflow/hooks/tests/destructive-guard-cases.json` の deny ケースとして固定する

  ## 該当箇所 (任意)

  - `em-workflow/hooks/destructive-guard.py` の `_args_json_notion_pair()`、`_flag_equals_prefix_name()`
  - 同時に扱うとよい medium の残件
    - `dc2fdf65ce30d198`: `$` と変数名の間に行継続があると、展開を固定文字列として扱う（`_read_double_quoted()` / `_read_static_word()`）
    - `f35ed060564bcf20`: `$` の後に非 ASCII 文字が続くと、Bash は文字どおりに渡すのに展開として扱い、検査を打ち切る
    - `0379cf2eb7ad4e92` / `9981fd673b28e7e4`: `--args-json` を多数並べると、値ごとの位置検索が二乗時間になる
    - `3340375b4b50c4b0`: 単体テスト `equals form with a destination` の期待値が現行の判定と逆
  - 詳細はリポジトリの `feature-docs/mcp-bridge-args-json-exec-guard/reviews/round4.yaml`

  ## 暫定緩和策 (任意)

  \<修正までの回避手段。あれば>
