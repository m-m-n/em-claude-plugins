  title: FR3 continued-dollar hides co-occurring expansion instead of staying Not static
  description: SPEC FR3 requires "語が FR6 (1) の別の要素も含むときは、現在どおり Not static のまま。" but _read_double_quoted() collapses a body holding both the FR3 continued-dollar form and an ordinary expansion to _DQ_CONTINUED, and _read_static_word() then marks it Unrestorable instead of WORD_NOT_STATIC, contradicting the required NOT_STATIC outcome.
  suggestion: Preserve expansion signal alongside continued in _read_double_quoted() (e.g. return EXPANSION when any FR6(1) expansion/backtick exists, or propagate both flags) and make _read_static_word() return WORD_NOT_STATIC when the word holds any FR6(1) element even if FR3 is also present, per FR3.
  reproduction: Lex value '"$\\\nDEST $Y"' (double-quoted FR3 form plus $Y expansion) via _read_static_word(); spec + TS-13 expect WORD_NOT_STATIC, implementation returns WORD_UNRESTORABLE because continued takes precedence over expansion in _read_double_quoted(). Same for backtick/glob/substitution co-occurring with FR3 in one double-quoted/locale-quoted body.
  sources:
