  title: TM-1 の対策漏れで行継続を挟んだ @ 形式の展開が Notion の検査除外を通る
  description: _args_json_single_word_certain() の holds_array_form() は、`$` の直後の 1 文字だけを見て `$@` と `${` を判定する。二重引用符の中でも Bash は行継続（バックスラッシュと改行）を先に取り除くので、`"$<行継続>@"` は `"$@"`、`"$<行継続>{A[@]}"` は `"${A[@]}"` として複数語（または 0 語）に展開される。holds_array_form() は `$` の次がバックスラッシュなので素通りし、続く `{` や `@` も `$` の直後ではないので検出しない。その結果、値の語を 1 語確定と誤判定し、notion ペアの除外が成立して、後続の --args-json は復号も検査もされない。TS-3 に行継続を 1 つ挟んだだけの形が allow になる。読解で再現した。comprehensive#0 も同じ箇所を high で報告している。tests/test_destructive_guard_args_json.py の SPLITTING_WORDS には、この形が無い。
  suggestion: holds_array_form() で `$` を見たら、_read_dollar() と同じく直後の行継続（バックスラッシュと改行の組、任意個）を飛ばしてから `@` と `{` を判定する。`${` の内側で入れ子を数える `$` の判定にも同じ処理を入れる。SPLITTING_WORDS に `"$<行継続>@"` と `"$<行継続>{A[@]}"` を加える。ランナーにも TS-3 の行継続版を deny のケースとして足す。
  sources:
  - security#0
  confidence: 90
  reproduction: Notion ペアの `--session` 値として、二重引用符内に `$`、バックスラッシュ、改行、`@` を並べ、後続に無害な `--args-json` 値を置く。コマンド文字列を `statements()` に渡すと、`_args_json_notion_pair()` は `True` を返し、JSON の検査結果は空になる。同じ値を位置引数 `alpha` と `beta` を設定した Bash の引数表示に渡すと、2引数になる。MCP ツールを呼び出さずに確認できる。
