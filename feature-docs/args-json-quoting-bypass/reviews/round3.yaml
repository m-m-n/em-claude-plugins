  title: 'TM-1: trap / alias / mapfile -C / readarray -C で実行される名前参照の宣言を見落とし、notion ペアの除外を回避できる'
  description: _args_json_declares_nameref() がシェル状態を不明とするコマンド名は eval / source / . だけ（8397 行）。trap のアクション文字列（DEBUG は次の単純コマンドの前、ERR は失敗の後に実行される）、alias（expand_aliases の下で後続の行で展開される）、mapfile / readarray の -C コールバックは、現在のシェルで文字列をコードとして実行する。その中の `declare -gn r=A[@]` はコマンド位置の語ではないので走査されない。子のチャンクとして読まれても、_args_json_nameref_declared() は外側に向かってしかたどらない（8284-8299 行）ので、mcp-bridge の文のチャンクには届かない。結果、`--format "$r"` / `--session "$r"` が 1 語確定と判定されて除外され allow になる。しかし Bash の argv は --mcp desktop-commander --tool start_process を含み、--args-json の command（git branch -D、rm -rf ~ など）が検査されずに実行される。同じフックの STOP_COMMAND_WORDS は trap / mapfile / readarray を、OVERRIDE_BUILTINS は alias を、シェル状態を変えるものとして既に扱っている。名前参照の判定だけがこれを反映していない。評価者がコードを読んで再現経路を確認した（reproduced）。
  suggestion: "--- a/em-workflow/hooks/destructive-guard.py\n+++ b/em-workflow/hooks/destructive-guard.py\n@@ -8396,3 +8396,5 @@\n     name, ok = _args_json_declaration_word(marked, words[k])\n-    if not ok or name in (\"eval\", \"source\", \".\"):\n+    if not ok or name in (\n+        \"eval\", \"source\", \".\", \"trap\", \"alias\", \"mapfile\", \"readarray\",\n+    ):\n         return True"
  sources:
  - claude:security
  confidence: 88
  reproduction: 'フックに PreToolUse の Bash ペイロードとして次のコマンドを渡す（CLAUDE_BATCH なし）: A=(json --mcp desktop-commander --tool start_process); trap ''declare -gn r=A[@]'' DEBUG; mcp-bridge run --mcp notion --tool notion-create-comment --format "$r" --args-json ''{"command":"git branch -D example"}'' → allow。次の形でも同じく allow になる。(1) trap の後に `trap ''declare -gn r=A[@]'' ERR; false;` を置いた形。(2) `mapfile -t -C ''declare -gn r=A[@]; :'' -c 1 X <<< x;` の形とその readarray 版。(3) 改行区切りで `shopt -s expand_aliases` / `alias D=''declare -n''` / `D r=''A[@]''` と書いた後に同じ mcp-bridge 文を置く形。(4) --session "$r" と --args-json ''{"command":"rm -rf ~"}'' の組み合わせ。対照として `declare -n r=''A[@]''` と直接書くと deny になる。Bash 側の確認: bash -c ''A=(json --mcp desktop-commander --tool start_process); trap "declare -gn r=A[@]" DEBUG; printf "<%s> " run --mcp notion --tool notion-create-comment --format "$r" --args-json "{}"'' の出力は <--format> <json> <--mcp> <desktop-commander> <--tool> <start_process> <--args-json> を含む。alias 形は eval 経由でも成立することを確認した。'
