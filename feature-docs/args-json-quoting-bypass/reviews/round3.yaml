  suggestion: FR3 のとおり、行継続の形だけが非静的要素である語は Unrestorable を期待するよう、テストと実装を直す（コマンド置換の本体の再走査は保つ）。Not static を認めるなら、SPEC FR3 と TS-13 に例外として明記する。
