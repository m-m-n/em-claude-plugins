    title: "mktemp テンプレートの `$SCRATCHPAD_DIR` が未定義で、FR3 の「発明せずに従える具体機構」を満たしていない"
    description: >-
      SPEC FR3 は「エージェントが定義どおりに実行すれば準拠パスを発明せずに得られる」ことを
      要求しているが、実装が示す `mktemp "$SCRATCHPAD_DIR/codex-reviewer-prompt.XXXXXX"` の
      `SCRATCHPAD_DIR` は両プラグインのどこにも定義がなく、環境変数としても export されない。
      未設定変数が空展開して `mktemp "/codex-reviewer-prompt.XXXXXX"` になり、ルート直下への
      作成失敗 → FR5 の fail-closed 経路で `skipped: true` を返す。つまり temp ファイル経路を
      選んだ codex レビューが常時スキップになり、その観点のレビューが黙って失われる。
      em-review/agents/codex-reviewer.md にも同一文面。
      オーケストレーターが実物を確認して事実と検証済み。
    suggestion: >-
      両ファイルの例を自己完結した形に直す。SPEC の A1 どおり
      `mktemp "${TMPDIR:-/tmp}/codex-reviewer-prompt.XXXXXX"` にするか、scratchpad ディレクトリを
      使い続けるならその値の入手元を同じ節で明示し、未設定時のフォールバックを書く。
    sources: [claude:spec, claude:comprehensive]
    confidence: 75
    resolution: unresolved
    resolution_reason: "batch auto-rework round 1 で task0002 に差し戻し"
