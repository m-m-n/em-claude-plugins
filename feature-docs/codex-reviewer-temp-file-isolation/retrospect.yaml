lessons_candidates:
  - >-
    R4 の auto-fix ゲートは `category != spec` を含むため、spec 観点の high は
    auto-fix に一切乗らず必ず rework 経由になる。この feature では唯一の high が
    spec だったので、auto-fix ループが 1 度も回らないまま rework 上限を消費した。
  - >-
    このタスクの修正対象（codex-reviewer の一時ファイル規約）は、review フェーズが
    codex-reviewer を並行起動するときの前提そのもの。今回は codex CLI 不在で
    codex-reviewer が全て skip されたため、修正の効果を同じ run 内で実地検証できていない。
  - >-
    プラグインの plugin.json バージョンを複数のテストが独立にハードコードする構造が
    残っている。round 1 の F-4 で片方は baseline 比較に直したが、もう片方は完全一致の
    まま値だけ付け替えられ、round 2 で再指摘された（4184c0c99bf3e8ea）。
  - >-
    「session scratchpad に書く」と宣言した規約の具体例が `${TMPDIR:-/tmp}` を指す、という
    スコープと例の食い違いが round 2 で 2 観点から指摘された（30b2e1ce37f4489d /
    c28aef1e5a19b2ae）。round 1 の指摘を潰す修正が別の不整合を生んだ形。
