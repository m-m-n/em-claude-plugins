schema_version: 1
feature: orphan-recovery-plugin-root-path
created: '2026-09-29'
base_branch: main
goal: 'em-workflow: orphan-recovery ヘルパーの起動パスが cwd 相対で配布構成では発火しない


  ## 現象（必須）

  `em-workflow/references/implement-phase.md` の I.2.b orphan-recovery ブロックが、

  孤児 launched の復旧ヘルパーを `em-workflow/scripts/recover-orphaned-task.py` という

  cwd 相対パスで起動するよう orchestrator に指示している。em-workflow はマーケット

  プレイス経由で任意のプロジェクトへ配布されるため、利用者の cwd 配下に `em-workflow/`

  は存在しない。結果として、インストール済みプラグイン構成では recovery が一度も発火せず、

  すべての候補が Residual（journal 不変・gate-rejected terminal）に落ちる。

  feature `orphaned-implementer-recovery` の review round3 で high として検出されたが、

  batch の rework 上限に達していたため `deferred` で残った（stable_id: `ebad15de2c79c36c`）。

  ## 再現手順（必須）

  1. em-claude-plugins をマーケットプレイスからインストールし、`em-workflow/` を含まない

  別プロジェクトを cwd にする

  1. implement フェーズで孤児 launched（journal 最終イベントが `launched`、worktree と

  branch あり、Agent index に live なし）を作る

  1. 次の run の I.2.b reconcile を走らせる

  2. ヘルパーのパスが解決できず recovery が発火しない

  ## 期待する挙動（必須）

  同じ文書の Step 4 が定めるプラグイン同梱スクリプトの解決規律と同じ経路をたどること。

  `RECOVER_SCRIPT=${CLAUDE_PLUGIN_ROOT}/scripts/recover-orphaned-task.py` を解決し、

  fail-closed で `$HOME/.claude/plugins` / `$HOME/.claude/skills` を

  `*/em-workflow/*/scripts/*` で探索する。cwd は見ない。解決に失敗した場合は Residual

  として扱う旨も明記する。

  あわせて、起動時の cwd（feature の integration worktree / プロジェクトルート）を同じ

  文で固定し、D1 の既定導出（`default_transcripts_dir` の `os.getcwd()`）を決定的にする。

  ## 完了の定義（必須）

  - [ ] 再現手順で現象が起きない

  - [ ] 再発を検出するテストがある

  - [ ] `implement-phase.md` の起動文が `${CLAUDE_PLUGIN_ROOT}` 経由になり、Step 4 を

  owning section として cite している（NFR7 の SSOT 重複禁止）

  - [ ] 起動時の cwd が明記されている

  ## 該当箇所（任意）

  - `em-workflow/references/implement-phase.md:472`（起動文）

  - `em-workflow/references/implement-phase.md:124-127`（Step 4 の解決規律。owning section）

  - `tests/test_implement_routeback_gate.py:681` — 現行の文言

  \``invokes `em-workflow/scripts/recover-orphaned-task.py` for the `\` を逐語で assert

  しているため、同じ変更でこのリテラルも更新する

  `implement-phase.md:496` / `:845` と `workflow-schema.md:313` は「どのスクリプトが

  書き手か」の同定であって起動指示ではないため対象外。`recover-orphaned-task.py` 自身は

  `_SCRIPT_DIR` で兄弟ヘルパーを自力解決しているので変更不要。

  ## 実害・発生条件（任意）

  配布構成（マーケットプレイス経由でインストールした利用者）でのみ発生する。開発リポジトリ

  本体を cwd にしている限り再現しないため、自動テストでは露出しない。SPEC AC-2 / FR2 は

  I.2.b reconcile 中に実際に recovery を走らせることを要求しているので、この feature の

  目玉挙動そのものが配布先で到達不能になる。

  '
