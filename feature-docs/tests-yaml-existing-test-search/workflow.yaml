schema_version: 1
feature: tests-yaml-existing-test-search
created: '2026-09-25'
base_branch: main
goal: |
  # em-workflow: implementer の *.tests.yaml が既存テストの存在を検索せず「テストなし」と断定する

  ## 現象（必須）
  implementer が書く `*.tests.yaml` の `red_reason` が、既存テストの網羅範囲を検索せずに「そのようなテストは存在しない」と断定することがある。
  feature `declared-change-set-implementation`（PR https://github.com/m-m-n/em-claude-plugins/pull/18 ）の `test-docs/declared-change-set-implementation/task0002.tests.yaml` で発生した。AC-1 / AC-2 / AC-3 の `red_reason` は「No automated assertion reads either manifest」、AC-5 は「the suite does not read either manifest, so it cannot go red for this change」と述べ、全 AC を `tests: []` / `red_confirmed: false` の目視確認扱いにしている。
  しかし既存の `tests/test_spec_file_set_completeness_version_bump.py` は `em-workflow/.claude-plugin/plugin.json` と `.claude-plugin/marketplace.json` を実際に `json.loads(path.read_text())` で読み、(1) version が `X.Y.Z` 形式で `(major, minor) == (0, 1)` かつ patch が前進していること、(2) 2 つのレジストリの version が一致すること、(3) 両ファイルのトップレベルキー集合が期待値と一致すること、を assert している。同種の `*_version_bump.py` は他フィーチャー分にも複数ある。
  つまり片方のレジストリだけを bump した・JSON を壊した・キーを増やした場合はスイートが実際に red になるので、記録の「red になり得ないので目視のみ」という根拠は事実と異なる。
  ## 再現手順（必須）
  1. プラグインのマニフェスト version bump だけを行うタスクを em-workflow の implement フェーズで実行する。
  2. 生成された `test-docs/{feature}/{T}.tests.yaml` の `red_reason` を読む。
  3. `tests/` 配下を `grep -l "marketplace.json" tests/*.py` などで検索し、実際にはマニフェストを読む既存テストが存在することを確認する。
  ## 期待する挙動（必須）
  `red_reason` で「テストが存在しない」と断定する前に、implementer が対象ファイルを読む既存テストの有無を検索して確認する。存在する場合は `tests:` にそのモジュール／クラスを列挙し、`red_reason` は「専用の新規モジュール追加はスコープ外だが、既存の X が Y を検出する。今回の変更では red 状態が発生しなかった」という趣旨にする。
  ## 完了の定義（必須）
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある
  ## 該当箇所（任意）
  - `em-workflow/skills/tdd-testing/SKILL.md`（`*.tests.yaml` の記録規律。`red_confirmed: false` を書くときに既存テストの検索を必須にする箇所）
  - `em-workflow/agents/implementer.md`
  - 実例: PR #18 の `test-docs/declared-change-set-implementation/task0002.tests.yaml`（review round1 の stable_id `6bdb784aa896a7d7`、severity medium）
  ## 実害・発生条件（任意）
  `*.tests.yaml` は verify / retrospect フェーズが参照する永続記録なので、既存の耐久不変条件（レジストリ一致・patch 前進）が存在しないと読み手に誤認させる。冗長な検証モジュールの追加、または「ここは元々ノーガードだから」という誤った前提での退行を招く。
  発生条件: タスクの変更対象が、専用テストを持たないように見えるが実は横断的なテスト（`*_invariants.py` / `*_version_bump.py` 等）にカバーされているファイルであるとき。
