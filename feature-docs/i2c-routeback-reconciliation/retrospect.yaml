lessons_candidates:
  - note: |
      implement-phase.md と phase-state.md が規定する integration worktree の refresh 手順
      (`git -C {wt} reset` の hard 形) が、ユーザー環境の PreToolUse hook
      destructive-guard/git-reset-hard に拒否された。同様に I.2.b step 4 の `git branch -D` も
      destructive-guard/git-branch-force-delete に拒否された。
      回避策: refresh は `git restore --source=HEAD --staged --worktree -- <個別パス>`、
      ブランチ削除は integration worktree 内で `git branch -d`（そちらの HEAD は integration
      なので -d が通る）。プロトコル側にこの代替手順を書くか、hook 側に em-workflow の
      worktree パスの除外を入れるかは要判断。
  - note: |
      hook のパターンマッチは Bash コマンド文字列全体を走査するため、ドキュメントの本文として
      危険なコマンド名を書いた heredoc も拒否された。ドキュメント生成は Write ツールで行う必要が
      あった。
  - note: |
      Notion タスクの前提が実行時点で陳腐化していたケース。requirements-analyst が
      「依頼された統合はすでに main にマージ済み」と検出し、orchestrator が gh / git で裏取りして
      scope を verify_and_close に確定した。batch policy create-spec.requirement-clarification は
      codex_consultation を既定にしているが、今回は直接検証で決着できた。前提の陳腐化検出は
      analyst が機能した好例。
  - note: |
      成果物が feature-docs/ 配下のドキュメントだけの feature では、review-phase の
      「feature-docs/{feature}/** を review 対象から除外」規則により、実質的に成果物本体が
      レビューされない。今回は test-docs/ の tests.yaml だけが対象になり、そこに medium 2 件が
      出た。記録型 feature の扱いは検討の余地がある。
  - note: |
      review medium findings 2 件 (stable_id: e42a404cafa83c7b, 7ad9024270d98c72) は R4 の
      auto-fix ゲート（critical/high のみ）に該当せず unresolved のまま。いずれも implementer が
      書いた tests.yaml の証拠運用（final_failures の再実行裏付け / red_confirmed のローカル
      再定義）に関するもので、implementer.md Step 4c の契約と実運用の齟齬を示している。
