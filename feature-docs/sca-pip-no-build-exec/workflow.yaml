schema_version: 1
feature: sca-pip-no-build-exec
created: '2026-11-28'
base_branch: main
goal: |
  # em-workflow SCA 軸の pip 経路でレビュー対象のビルドコードが実行されうる問題を塞ぐ

  ## やりたいこと

  `em-workflow` の SCA 軸（軸 2）の pip 経路で、`pip-audit` がレビュー対象プロジェクトのビルドコードを実行しうる問題を、正しい形で塞ぐ。

  ## 背景

  review-sca-axis のレビュー round 2 で security 観点（codex）が high として検出した指摘（stable_id `2febcb34aa888ac7`）:

  > `pip-audit` は `-r requirements.txt` 形式と、プロジェクトディレクトリ指定形式の両方で依存解決を行い build backend を走らせる。レビュー対象プロジェクトに local / editable / sdist 依存があると、`setup.py` や PEP 517 フックがレビュアープロセスの権限で実行される。`build_child_env` のサニタイズ・`PIP_CONFIG_FILE=/dev/null`・`PIP_INDEX_URL` の固定・argv 配列での起動は、設定汚染とインジェクションには効くが、ローカルコード実行には効かない。

  round 2 の auto-fix はレジストリ（`em-workflow/references/vuln-scanners.yaml`）の pip エントリの `args` に `--no-deps --disable-pip` を足したが、これは不完全な適用だった:

  - レジストリの `args` は pip の 2 つのターゲット形式（`-r <file>` と `<dir>`）で共有されるため、`--no-deps` がディレクトリ指定形式にも乗ってしまう。`--no-deps` は `-r` 形式でしか成立しないので、適用された変更はこの緩和策の正しい実装になっていない。
  - テストピン側（`tests/test_sca_scan_invocation.py` / `tests/test_sca_scan_normalization.py`）が同時に更新されず、`python3 -m unittest discover -s tests` が 9 件失敗する状態になった。`--no-deps` は同ファイルの forbidden_tokens にも入っている。

  verify フェーズの rework（task0010）で、レジストリは SPEC の `pip-audit --format json` の形に戻す。緩和策そのものは未対応のまま残るため、本タスクとして切り出す。

  ## 受け入れ条件 / 完了の定義

  - [ ] pip 経路が、レビュー対象プロジェクトの build backend / `setup.py` を実行しない形で監査できること
  - [ ] ターゲット形式ごとに引数を出し分けられるようにする（レジストリのスキーマ変更を伴う可能性が高い）。1 本の `args` を 2 形式で共有する現在の形では緩和策を正しく置けない
  - [ ] 静的に抽出した完全に pin された依存インベントリを監査する形にするか、それが作れない入力には機械可読な `skip_reason` を返す
  - [ ] `tests/test_sca_scan_invocation.py` の forbidden_tokens を含むテストピンを、選んだ形に合わせて更新する
  - [ ] FR1（`pip-audit --format json` というコマンド形の記述）と NFR2 に対する整合を SPEC 側で決着させる
  - [ ] `em-workflow/.claude-plugin/plugin.json` と `.claude-plugin/marketplace.json` の version を同じ値で上げる

  ## 制約・前提

  - レジストリ（`vuln-scanners.yaml`）とテストピンは同一の変更で両方を触る。片側だけの適用が今回の不整合の原因
  - 他エコシステム（npm / cargo / go）の同種のリスクも同じ機会に確認する

  ## 追加指示（起動時）

  - 実装完了後、integration ブランチを remote に push し、base_branch に対して gh pr create で PR を作る。integration ブランチはローカル・リモートともに残す（base_branch へ自動マージしない）
  - 不明点は Codex に相談し、比較してより良いと判断した選択肢を採用する
  - その議論の内容を Notion に記録する
