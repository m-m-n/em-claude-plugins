schema_version: 1
feature: cd-prefix-relative-link-target
created: '2026-10-30'
base_branch: main
goal: |
  # bash_guard.py の cd 前置形の判定で、相対リンクの行き先を /proc・/dev/fd 配下と字句判定して誤って拒否する

  種別: バグ

  ## 現象
  `em-workflow/hooks/bash_guard.py` の `_stage_walk_refuses` は、`os.readlink()` の戻り値を絶対パスか相対パスかを区別せずに `_under_proc_or_dev_fd()` で字句判定している。そのため、許可領域内の普通のディレクトリ `<area>/proc` や `<area>/dev/fd` を指す相対リンク（行き先 `proc`、`./proc`、`dev/fd`）でも cd 前置形の判定が拒否になる。

  判定は安全側に倒れる（cd プレフィックスが無いものとして判定される）ためセキュリティ上の穴ではないが、feature cd-prefix-process-dependent-paths の SPEC FR1（ルート直下にない proc・dev/fd という名前のディレクトリは除外しない）と FR4（他の判定は変えない）に反する回帰になっている。

  ## 再現手順
  1. 許可領域内に実ディレクトリ `<area>/proc` を作る
  2. `<area>/alias -> proc`（相対の行き先）のシンボリックリンクを作る
  3. `is_below('<area>/alias', area)` を評価する
  4. 変更前は True、変更後は False になる（行き先を絶対パス `<area>/proc` にすると変更後も True）

  ## 期待する挙動
  相対の行き先を持つリンクは字句判定せず、解決後の段階の検査で判定する。`<area>/proc`・`<area>/dev/fd` を指す相対リンクでは `is_below` が True になる。行き先が絶対パスの `/proc/self/cwd`・`/proc/self`・`/dev/fd/<N>` は引き続き False。

  ## 完了の定義
  - 再現手順で現象が起きない
  - 再発を検出するテストがある（相対の行き先 `proc`・`./proc`・`dev/fd` のケース）

  ## 該当箇所
  `em-workflow/hooks/bash_guard.py:317-318`（`_stage_walk_refuses`）

  ## 実害・発生条件
  許可領域内に proc・dev/fd という名前のディレクトリと、そこへの相対リンクがある場合だけ。承認済みコマンドの自動許可が効かず、確認に回る。review round 1 の medium finding（stable_id `6bbedec4f375664a`）。
