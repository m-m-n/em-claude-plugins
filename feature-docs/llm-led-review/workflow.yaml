schema_version: 1
feature: llm-led-review
created: '2026-09-04'
base_branch: main
goal: "develop コマンドのレビュー段を他 LLM 主体と Opus 評価の構成に改修する\n\n## やりたいこと（必須）\ndevelop コマンドのレビュー段を、他 LLM がメインでレビューし、その結果を Opus のサブエージェントがまとめて評価し、オーケストレーターがその評価に基づいて次の行動を決める構成に改修する。\n## 背景・なぜ（必須）\n現在は Claude のレビュアーとセカンドオピニオン（Codex）が並列でレビューを行い、その結果を突合する形になっている。\n該当箇所:\n- `em-workflow/skills/develop/SKILL.md`\n- `em-workflow/references/review-phase.md`\n- `em-workflow/references/reviewers.yaml`\n- `em-workflow/agents/reviewer.md`\n- `em-workflow/agents/codex-reviewer.md`\n## 受け入れ条件 / 完了の定義（必須）\n- [ ] レビューのメインを他 LLM が実行する\n- [ ] 他 LLM の結果が出たら、Opus のサブエージェントがまとめて評価する\n- [ ] Opus の評価がオーケストレーターに返る\n- [ ] オーケストレーターは Opus の評価に基づいて次の行動を決める\n- [ ] 現在の Claude と Codex の並列レビューと突合の流れを、上記の構成に置き換える\n## スコープ外（任意）\n- 従来のクロスレビュー（Claude と Codex の並列レビューと突合）は `/em-review:multi-review` を使う\n- em-review の multi-review には今回手を入れない\n## 制約・前提（任意）\n\\<触ってほしくない箇所 / 使う技術 / 互換性など。あれば\\>\n---\n## 再開条件 2026-09-04T09:04:47+09:00\n## 申し送り\n不明瞭な点はサブエージェントやセカンドオピニオンと相談して決める\n決めた内容をNotionに記載していれば好きに進めて良い\n---\n## 再開条件 2026-09-04T09:47:15+09:00\n\
  ## 再開に必要な条件\n### 停止の直接原因（最優先）\n- `review.sanitization-ownership` (category: security / blocking) — 他 LLM 出力の untrusted 扱いを誰が担保するか。選択肢は (a) オーケストレーターの機械的サニタイズを評価役の出力にも従来どおり適用する、(b) サニタイズ責務を評価役へ移す。評価役の出力自体を untrusted として扱うかも明記が必要\n\t- 評価役がそれを含めて評価する\n### 現在の状態\n- ブランチ `em-workflow/llm-led-review/integration` と worktree `.claude/worktrees/em-workflow/llm-led-review/integration` を残置\n- コミット済みは `feature-docs/llm-led-review/phase-state/create-spec.yaml` のみ\n- REQUIREMENTS.md / SPEC.md / workflow.yaml は未生成\n- リポジトリ本体の作業ツリーに em-workflow/references/review-phase.md と em-workflow/references/reviewers.yaml の未コミット変更（litellm モデル名の更新）が残っている\n"
parent_branch: em-workflow/llm-led-review/integration
