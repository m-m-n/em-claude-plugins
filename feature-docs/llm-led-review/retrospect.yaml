lessons_candidates:
- review-editor が単一ファイル契約のため、SSOT 間の契約ドリフト型 finding を auto-fix で閉じられない。1 ファイル内の散文修正が毎ループ新しい矛盾を生み、round1
  は loop-cap、round2 は no-progress で終了した（residual critical/high 7 → 6）。
- この feature の変更セットは複数の SSOT（review-phase.md / review-evaluation-contract.md / batch-mode.md / batch-policies.yaml
  / SPEC.md / agents/*.md）を同時に整合させる必要があり、単一ファイル編集を前提とした auto-fix ループの適合範囲外だった。
- critical/high 26 件のうち 24 件が review-phase.md と review-evaluation-contract.md の 2 ファイルに集中した。1 ファイルに責務が集中した変更ではレビュー観点を跨いだ重複検出が多発する（同一サイトを
  4 観点が別 stable_id で報告し、R4 の conflict group によりまとめてスキップされた）。
- codex ハーネスが round2 の security 観点で 600s タイムアウト（exit 124）。ハーネスの死活をラウンド内で記憶せず毎ループ再ディスパッチする点は finding 611f7fdd71c106ff
  / 1781613dd8f96776 / 4df2f57d353cda5a として繰り返し指摘された。
- batch の review auto-rework cap（1）に到達し、round2 の high 6 件が deferred のまま review completed になった。verify は
  pass だが、これらは別タスクとして起票する必要がある。
