schema_version: 1
feature: validator-scenario-id-format
created: '2026-10-07'
base_branch: main
goal: '# em-workflow: validate-worker-output.py の検証シナリオ ID 正規表現が TSn 書式を拾わない


  Notion タスク: https://www.notion.so/3f13509ec8ee81beafe4c1fe5a71999f （種別: バグ）


  ## 現象 (必須)

  `em-workflow/scripts/validate-worker-output.py` は VERIFICATION.md のシナリオ ID を `_TS_ID_RE = re.compile(r"TS-\d+")`
  で拾う。ハイフン付きの `TS-n` 書式しか一致しない。

  implementation-planner が `TS1`, `TS2` … の書式で VERIFICATION.md を書いた feature では、rework-planner が新しく足したシナリオを検証器が見つけられない。結果として「new_scenarios
  ''TS13'' is not a new VERIFICATION.md scenario」というエラーで正しい出力を拒否する。


  ## 再現手順 (必須)

  1. VERIFICATION.md のシナリオ ID が `TSn` 書式の feature で review の rework を走らせる（例: destructive-guard-heredoc-bypass-fixes
  の review round 1）

  2. rework-planner が `TS13` などの行を VERIFICATION.md に足し、`payload.rework_index.*.new_scenarios` に並べる

  3. `validate-worker-output.py` で出力を検証する


  ## 期待する挙動 (必須)

  新しく足されたシナリオは、ID の書式にかかわらず新しいシナリオとして認識される。検証器の正規表現と plan-writing の ID 書式の決まりが一致している。


  ## 完了の定義 (必須)

  - [ ] 再現手順で現象が起きない

  - [ ] 再発を検出するテストがある


  ## 該当箇所 (任意)

  - `em-workflow/scripts/validate-worker-output.py` の `_TS_ID_RE`

  - `em-workflow/skills/plan-writing/SKILL.md` のシナリオ ID の書式


  ## 実害・発生条件 (任意)

  無人実行では、検証が拒否するとオーケストレーターが Codex に判断を仰ぐか停止するしかなくなる。destructive-guard-heredoc-bypass-fixes では、Codex に相談したうえで監査記録を残してパッチを適用した（phase-state/batch-audit.yaml
  の rework.validator-scenario-id-format）。


  ## 追加指示（起動時）

  - 実装完了後、integration ブランチを remote に push し、gh pr create で base_branch への PR を作成する。integration ブランチはローカル・リモート両方に残す（base_branch
  へ自動マージしない）

  - 不明点は Codex に相談し、相対的に良いと判断した選択肢を採用する

  - その議論内容を Notion に記録する

  '
