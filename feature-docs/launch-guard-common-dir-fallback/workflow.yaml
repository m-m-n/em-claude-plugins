schema_version: 1
feature: launch-guard-common-dir-fallback
created: '2026-11-01'
base_branch: main
goal: '# launch guard の git-common-dir フォールバックが、共通管理ディレクトリが .git でない構成で正しい起動を拒否する


  種別: 改善


  ## やりたいこと

  launch guard が `git rev-parse --git-common-dir` の親を無条件にプロジェクトのルートとみなす処理を、共通管理ディレクトリが主作業場所直下の
  `.git` でない構成でも誤って拒否しないようにする。


  ## 背景

  feature canonical-worktree-path-guards のレビュー（round 1、medium、stable_id `a3fe8ddbe09570f2`）で指摘された。`em-workflow/hooks/queue_launch_guard.py:151`
  の `git_common_dir_root` は共通管理ディレクトリの親をそのまま返し、`cwd_outside_project_root` がそれと cwd
  の git toplevel を比べて違えば拒否する。


  次の構成では正しい場所からの起動も拒否される。

  - サブモジュール: 共通管理ディレクトリが `/super/.git/modules/sub` のとき、ルートが `/super/.git/modules`
  になる

  - `--separate-git-dir`: 共通管理ディレクトリが `/store/proj.git` のとき、ルートが `/store` になる

  - プロジェクトのルート自体が linked worktree: ルートが主作業場所になる


  変更前は区切りが無ければ確認を省いていた（fail-open）。区切りの無い linked layout と重なると、実装担当の起動が毎回拒否される。NFR2
  の「判断できない状態は fail-open を保つ」から外れる。


  ## 受け入れ条件

  - [ ] 正規化した共通管理ディレクトリの末尾要素が `.git` でないときは確認を省く（fail-open）

  - [ ] プロジェクトのルートが linked worktree の場合に、正しい場所からの起動が拒否されない

  - [ ] `/super/.git/modules/sub` と `/store/proj.git` を返す構成で拒否されないことをテストで確かめる


  ## 制約・前提

  `tests/test_merge_unverified_exit_doc_contract.py` が launch guard の sha256 を固定している。

  '
