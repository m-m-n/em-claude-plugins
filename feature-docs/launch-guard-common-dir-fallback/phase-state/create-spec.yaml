    normalized_answer: 'containment_and_cwd_ancestor を採用。追加条件: (a)(b) は区切りが無いフォールバック経路に限る。内包は
      realpath と commonpath で比べる。(b) は「求めたルートが cwd の git toplevel を内包し、かつその toplevel
      が task worktree を真に内包する（同一は除く）」場合に限り拒否しない。git-common-dir の呼び出しは既存の 1 回を再利用する。既存単体テストの
      /proj-store と /proj/.git の組は内包が成り立つ配置に直し、拒否の検証を残す。'
