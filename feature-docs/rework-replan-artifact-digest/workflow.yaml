schema_version: 1
feature: rework-replan-artifact-digest
created: '2026-11-21'
base_branch: main
goal: '# em-workflow: 仕様変更後の create-plan 再計画で、rework-planner が書き換えた VERIFICATION.md が digest 不一致として preserve になり batch が止まる


  種別: バグ


  ## 現象


  仕様変更の遷移のあとで create-plan を再計画すると、verify の手戻りで rework-planner が書き換えた VERIFICATION.md が digest 不一致と判定される。batch では `create-plan.artifact-overwrite` = `preserve_and_reuse` により VERIFICATION.md が読み取り専用になり、改訂後の SPEC に合わせられないため planner が blocked を返す。無人実行は `step_needs_intervention` で停止する。


  ## 再現手順


  1. batch で develop を実行し、verify の手戻りで rework-planner が VERIFICATION.md を書き換える（記録は `phase-state/rework.yaml` に入る）

  2. 分類ゲートが `spec_gap` を選び、仕様変更の遷移（create-spec を needs_update、create-plan〜verify を pending）を取る

  3. create-spec の再実行後、create-plan の Pre-dispatch verification が `phase-state/create-plan.yaml` の記録とだけ digest を照合し、VERIFICATION.md を不一致とする

  4. batch の方針で preserve になり、planner が blocked を返して停止する


  ## 期待する挙動


  verify の手戻りで rework-planner が書き換えた計画成果物があっても、仕様変更の遷移後の create-plan 再計画が batch で止まらず、改訂後の SPEC に合わせて成果物を更新できる。


  ## 完了の定義


  - [ ] 再現手順で現象が起きない

  - [ ] 再発を検出するテストがある


  ## 該当箇所


  - `em-workflow/references/artifact-digest.md` の `Pre-dispatch verification` / `Layer 5 recording`（記録先は dispatch したフェーズの phase-state ファイル）

  - `em-workflow/references/phases/create-plan-phase.md` の `4. Planner dispatch`

  - `em-workflow/references/batch-policies.yaml` の `create-plan.artifact-overwrite`


  ## 実害・発生条件


  発生事例: feature `mcp-bridge-function-shadow`、2026-11-21 19:23 JST のコミット `bf82e71da`（create-plan aborted (preserved VERIFICATION.md blocked)）。

  '
