      drop TS7's monotonicity half, relying on test_plugin_version_parity.py alone.
      Codex chose A. Decisive point: SPEC's own "## Declared Change Set" states the
      feature-specific paths are derived at create-plan from each task's files entries, so the
      File Structure block's four entries are not a closed allow-list; the repository already
      holds 21 sibling per-feature *_version_bump.py modules, each pinning its own baseline, and
      both manifests currently read 0.1.84 while the highest existing baseline is 0.1.82 - so a
      forgotten bump would turn no existing test red. Cost of the losing options: B introduces a
      cross-feature dependency by rewriting another feature's historical baseline, and the module
      it would edit is itself outside SPEC's four files, so it does not even achieve the
      file-count goal; C loses the comparison against this feature's base revision entirely and
      fails TS7.
      Codex correction to the brief: test_plugin_version_parity.py does check monotonicity
      (greater than 0.1.50), not equality alone as the consultation prompt had stated.
