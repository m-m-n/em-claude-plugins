  # batch-terminal-line.md の自前拒否規則が resume_conditions の改行保持と衝突する


  種別: バグ


  ## 現象 (必須)

  `em-workflow/references/batch-terminal-line.md` の `## Consumer constraints` にある

  em-workflow 自身の拒否規則（"`detail` and `resume_conditions` each reject a line

  terminator or a terminal-control code point after decoding"）が、同じ文書の

  `## Field values` が `resume_conditions` について定める挙動と正面衝突している。

  `## Field values` は `resume_conditions` について「Its value is NOT put through

  `detail`''s normalization: any Markdown newlines, indentation and trailing spaces it

  carries survive as `## Escaping`''s escapes rather than being collapsed」と定める。

  つまり改行を含む `resume_conditions` は正常形。一方で自前拒否規則は decode 後に

  line terminator を含む `resume_conditions` を拒否する。

  結果として、複数行の停止復旧手順を持つ停止結果（= `state: stopped` の通常形）は

  「正常形として生成されたのに自前規則で拒否される」状態になり、合法な出力が存在しない。

  review round 2 の finding `527e10173b2e8e66` (high, spec)。batch review rework cap

  到達により deferred。


  ## 再現手順 (必須)

  1. `em-workflow/references/batch-terminal-line.md` の `## Field values` の

  `resume_conditions` の項を読む（改行は escape として残るのが期待される正常形）

  1. 同文書の `## Consumer constraints` 末尾「em-workflow''s OWN emitter obligations

  and rejection rules」の 1 つ目の箇条書きを読む（`resume_conditions` の line

  terminator を decode 後に拒否）

  1. 2 つの規定が同じ値に対して両立しないことを確認する


  ## 期待する挙動 (必須)

  `resume_conditions` については、CR / LF / TAB 以外の terminal-control code point

  のみを拒否する。FR8 により Markdown の改行は `\n` エスケープとして残るのが期待される

  正常形であり、違反ではない。`detail` は正規化で CR/LF/TAB が除去済みなので、残存は

  正規化の飛ばしを意味するため従来どおり拒否してよい。

  あわせて、同節の「Each of the four cannot fire while `## Escaping` is honoured」の

  記述を実態に合わせて書き直す。


  ## 完了の定義 (必須)

  - [ ] 再現手順で現象が起きない

  - [ ] 再発を検出するテストがある

  - [ ] `tests/test_batch_stop_contract.py` の `_assert_own_hardening_rules_stated` の

  期待文字列と `FORGED_OWN_RULES_PARTIAL` を更新する

  - [ ] 「改行入り `resume_conditions` は拒否されない」ことを示す positive ケースを 1 本足す


  ## 該当箇所 (任意)

  - `em-workflow/references/batch-terminal-line.md` — `## Field values` の

  `resume_conditions` 項、および `## Consumer constraints` の自前拒否規則

  - `tests/test_batch_stop_contract.py` — `_assert_own_hardening_rules_stated`、

  `FORGED_OWN_RULES_PARTIAL`


  ## 実害・発生条件 (任意)

  停止結果の通常形（複数行の復旧手順を持つ `state: stopped`）で発生する。SSOT の

  自己矛盾であり、実装がどちらの規定に従うべきか決まらない。PR

  https://github.com/m-m-n/em-claude-plugins/pull/38 の時点の内容。

  '
