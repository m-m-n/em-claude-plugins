schema_version: 1
feature: codex-guard-procsub-in-wordlist
created: '2026-10-23'
base_branch: main
goal: |
  # codex-hook-interactive-guard: zsh の for 語一覧の中のプロセス置換 <( ) のコメントを語の文字と読み、拒否漏れと誤拒否を起こす

  種別: バグ
  Notion: <notion-url>

  ## 現象 (必須)

  feature `codex-guard-for-wordlist-glob-qualifier` の review round 1 で deferred になった指摘（stable_id `19818dabfb7f0481`、medium、security / comprehensive の 2 件で原因は共通）。

  `codex-hook-interactive-guard.py`（em-workflow / em-review の両コピー）の `_skip_substitution` の `(` 分岐は、文脈 w（zsh の `for name (words)` の語一覧）の中の `(` を常に入れ子の w として積む。そのため `<(`・`>(`・`=(` のプロセス置換も入れ子の w になり、同 feature で入れた条件 `stack[-2] != "w"` によって、その中では空白の後の `#` もコメントを始めない。zsh はプロセス置換の中身をコマンド列として読み、コメントを認めるので読み方がずれる。

  - 拒否漏れ（security）: コメント内の `"` が d として開かれ、入力末尾で判定不能（`_Undecidable("substitution")`）になり、後ろの `python3 -i` を拒否しない
  - 誤拒否（comprehensive）: コメントの一部で実行されない `python3 -i` を命令として読み、deny する

  ## 再現手順 (必須)

  1. `tool_input.command` に次を設定した PreToolUse(Bash) の JSON をフックの標準入力へ渡す（コマンド自体は実行しない）
  2. 拒否漏れ: `zsh -c 'echo "$(for x (<(: # "<改行>)) { :; })"; python3 -i'` → 無出力になる（変更前の条件では deny）
  3. 誤拒否: `zsh -c 'echo "$(for x (<(printf x # )))"; python3 -i; echo "<改行>)) { :; })"'` → deny になる（変更前は silent）

  ## 期待する挙動 (必須)

  - 文脈 w の中で語の先頭にある `<(`・`>(`・`=(` は、入れ子の w ではなくコマンド列 p として積む。その `)` は語の中の閉じ（close_command False）として扱い、w に戻る
  - glob 修飾子やグループの入れ子 w では、今のまま `#` を語の文字として読む

  ## 完了の定義 (必須)

  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある
  - [ ] `tests/test_codex_hook_interactive_guard.py` の `CASES` に、上の 2 入力をそれぞれ deny / silent の行として追加し、両コピーに流す
  - [ ] 両コピーがバイト単位で同一のまま

  ## 該当箇所 (任意)

  - `em-workflow/scripts/codex-hook-interactive-guard.py:2551`（`(` 分岐、2551-2577）と `:2599`（`stack[-2] != "w"` の条件）
  - `em-review/scripts/codex-hook-interactive-guard.py`（同一内容）
  - 記録: `feature-docs/codex-guard-for-wordlist-glob-qualifier/reviews/round1.yaml`（ブランチ `em-workflow/codex-guard-for-wordlist-glob-qualifier/integration`）

  ## 実害・発生条件 (任意)

  `$( )` の中の zsh の for の語一覧にプロセス置換を書き、その中に空白の後の `#` コメントがある場合だけ。拒否漏れ（fail-open）は無人実行が入力待ちで止まりうる。誤拒否は無人実行をその場で止める。原因は同 feature の SPEC 前提 A1/A2 が語一覧の入れ子の `(` をすべて glob 修飾子とみなしていたこと。

  ## 追加指示（起動時）

  - 実装完了後、integration ブランチを remote に push し、base_branch へ gh pr create で PR を作成する。integration ブランチはローカル・リモート双方に残す（base_branch へ自動マージしない）
  - 不明点は Codex に相談し、比較的良いと判断した選択肢を採用する
  - その議論内容を Notion に記録する
