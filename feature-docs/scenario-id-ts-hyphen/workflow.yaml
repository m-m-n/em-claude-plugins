schema_version: 1
feature: scenario-id-ts-hyphen
created: '2026-11-03'
base_branch: main
goal: |
  # em-workflow が新規に作る文書のシナリオ ID を TS-n に統一する

  ## やりたいこと (必須)

  em-workflow が新規に作る文書のシナリオ ID を `TS-n` 形式に統一する。

  - spec-writer が SPEC.md に書くシナリオ ID を `TS-n` にする
  - plan-writing の「`TSn` も正しい ID」を、既存文書を読むときだけの扱いにする
  - 新規に書く VERIFICATION.md・tasks/*.md に `TSn` が含まれていたら、implementation-planner の出力検査で弾く
  - 既存文書の読み取りは、今まで通り `TS-?\d+` で両方の形を受け付ける

  ## 背景・なぜ (必須)

  plan-writing は新規の VERIFICATION.md を `TS-n` で書くと定めているが、spec-writer は SPEC.md を `TSn` で書き、planner もそれに揃えて VERIFICATION.md を `TSn` で書いている。

  事例: loop-develop の feature `auto-dispatch-not-started` で、SPEC.md と VERIFICATION.md が `TS1`〜`TS15` 形式で作られた。

  ## 受け入れ条件 / 完了の定義 (必須)

  - [ ] 新規に作られる SPEC.md・VERIFICATION.md・tasks/*.md のシナリオ ID が `TS-n` になる
  - [ ] 新規の VERIFICATION.md・tasks/*.md に `TSn` が含まれる planner 出力が検査で弾かれる
  - [ ] 既存の `TSn` 形式の文書を含むフィーチャーの読み取り・rework 検証が、今まで通り動く

  ## スコープ外 (任意)

  - 既存文書の `TSn` の書き換え

  ## 制約・前提 (任意)

  - 該当箇所（0.4.0）: `skills/plan-writing/SKILL.md:305-314`、`scripts/validate-worker-output.py:394-397`、spec-writer の SPEC.md テンプレート
