lessons_candidates:
- 3 ラウンド連続で、rework が前ラウンドの findings を全て閉じながら同程度の重さの新しい退行を生んだ。ラウンドごとの findings 数（15 / 14 / 15）だけでは収束/非収束が読めず、「前ラウンドの指摘は閉じたか」と「新しい退行が出たか」を分けて追う必要がある。
- 差分実行（base コミットのフックと現行を同一入力で突き合わせる）が、この機能で最も検知力の高い手法だった。round 1 では使われず、round 2 以降でレビュアーに明示的に指示してから退行が大量に見つかった。判定ロジックを変更する機能では、レビュー観点に関係なく最初から必須にする価値がある。
- テストスイートが緑でも退行は防げなかった。round 2 の 10 件、round 3 の 10 件はいずれも既存ケースが覆っていない形で、スイートは常に緑だった。「スイートが緑」は「退行が無い」の証拠にならないことを、実測付きで
  2 回確認した。
- オーケストレーター自身が base との差分実行を行い、その結果を round record の orchestrator_verification ブロックに残したことが、撤回の判断根拠として決定的だった。レビュアーの報告だけでは
  11 件中 10 件が退行という全体像が見えなかった。
- 撤回を選んだあとも、レビューが見つけたシェイプのテストケースは資産として残った（58 → 138 件）。うち 16 件は base 由来の既知の穴を記録するもので、マーカー付きで固定した。機能そのものが失敗しても、レビューの副産物が残る形にできる。
- implementer が 1 応答で大量のテストケースを書き出そうとして 64000 トークンの出力上限で落ちた。worktree の作業は残っていたので同一エージェントを再開して復旧できたが、大量のデータファイルを書くタスクでは最初から小分けを指示するとよい。
- codex レビュアーが 600 秒のラッパータイムアウトで 2 回とも JSON 未出力に終わり、round 2 の security クロスモデルがシグナル無しになった。大きなファイルの全体レビューでは
  reasoning effort と timeout の組み合わせが破綻する。
- vertex-review のモデルがスキーマのプレースホルダ文字列をそのまま返した回があり（round 2 spec）、findings 0 が「問題なし」ではなく「シグナル無し」を意味していた。round
  record に note として区別を残した。
