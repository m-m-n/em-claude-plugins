schema_version: 1
feature: destructive-guard-var-resolution
created: '2026-09-01'
base_branch: main
goal: |
  em-workflow/hooks/destructive-guard.py の誤爆を修正する。

  同一コマンド文字列の中でリテラル代入された変数を `rm -r` の対象に使うと、
  check_rm が DYNAMIC パターン（`$VAR`）を検知して rule `rm-unresolvable` の
  ask を返す。実際に踏んだ例:

    BACKUP_DIR=/tmp/claude-1000/-home-sakura-go-src-mcp-bridge/f20c1168.../scratchpad/review-r1-loop2-backup
    rm -rf "$BACKUP_DIR"; mkdir -p "$BACKUP_DIR/src/lib" && chmod 700 "$BACKUP_DIR"

  この `BACKUP_DIR` は同じコマンド文字列の 3 行上でリテラル代入されており、
  静的に解決できる。展開後のパスは SAFE_DELETE（`^/tmp/`）に一致するため、
  実パスを直書きしていれば無言 allow になっていた。つまりこれは誤爆。
  無人実行（claude-batch）では ask が deny に降格されるため、誤爆 1 件が
  その場で走行を止める。

  原因は check_rm が DYNAMIC を見た瞬間に ask している点（destructive-guard.py:706-716）で、
  同一コマンド内のリテラル代入を追跡する仕組みが無い。head() は代入トークンを
  読み飛ばすだけで値を保持していない。

  同一コマンド文字列内のリテラル代入だけを解決して判定に使えるようにする。
  解決できない代入（コマンド置換・他変数参照・環境由来・条件付き代入）は
  従来どおり解決不能として扱い、検知力を落とさない。

