    line: 911
    title: "shlex がクォートを剥がした NAME=VALUE を実代入として記録し、bash が代入しない語で対象を解決する"
    description: |
      collect_assignments() は shlex 解決済みのトークンを代入パターンに掛けるだけで、
      その語が bash にとって本当に代入かを見ていない。bash は名前部や `=` が
      クォート/エスケープされた語を代入として扱わない。
      実測: `"HOME"=/tmp/safe` / `\HOME=/tmp/safe` / `HOME"="/tmp/safe` /
      `HO"ME"=/tmp/safe` の 4 形すべてを正規の代入として記録し、続く
      `rm -rf $HOME` が deny(rm-root) → allow になる。
      実シェルではこれらはコマンド不在で流れ、$HOME は本物のホームのまま展開される。
    suggestion: |
      記録の判定を shlex 後のトークン文字列ではなく元の綴りに対して行う。
      _TrackingLexer が既に state を監視しているので、トークンごとのクォート開始
      オフセットか生ソース span を記録し、「生の綴りの先頭が unquoted で代入形に
      一致する」ことを条件にする。判定できない場合は記録しない。
    sources: [claude:security]
    confidence: 60
    resolution: unresolved
    resolution_reason: null
  - stable_id: r3-compound-constructs
    severity: critical
    category: security
    file: em-workflow/hooks/destructive-guard.py
    line: 386
    title: "if / while / case / 波括弧 / 関数本体の中の代入が無条件の代入として記録される"
    description: |
      lex_segments() が「実行されないかもしれない文」として扱うのは短絡演算子の直後と
      サブシェルだけで、if・while・until・case・ブレースグループ・関数本体は
      文の形として一切モデル化されていない。改行区切りでこれらの中に置かれた代入は
      囲みスコープの無条件な単独代入文として記録され、解決の適用条件をすべて満たす。
      実測: `if false; then\nHOME=/tmp/safe\nfi\nrm -rf $HOME` が deny(rm-root) → allow。
      while / until / case / 呼ばれない関数本体 / パイプ先のブレースグループも同じ。
      既存ケースが押さえているのは「if/then に融合した *再* 代入は counts が 2 になる」
      方向だけで、分岐の中に代入が 1 個しかない方向は 1 件も無い。
    suggestion: |
      lex_segments() に複合構文の深さを持たせ、then / else / elif / do / in / 波括弧 /
      関数定義で深さを増やし、fi / done / esac / 閉じ波括弧で減らす。深さが 0 より
      大きい文は conditional=True として yield すれば、既存の適用条件が弾く。
    sources: [claude:security]
    confidence: 60
    resolution: unresolved
    resolution_reason: null
