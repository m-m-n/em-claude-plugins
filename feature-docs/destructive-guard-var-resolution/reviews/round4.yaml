    title: "削除対象が裸のコマンド置換だけの rm -rf を「期待どおりの allow」として固定している"
    description: |
      追加された 2 件が、ガードを完全にすり抜ける形を allow として記録している
      （`rm -rf $(mktemp -d)` と `rm -rf $(cat list)`）。
      これは中身が安全だからではなく、削除対象位置の置換が別セグメントへ切り出され、
      外側の rm が位置引数ゼロで check_rm に入り早期 return するため。
      同じ意味のクォート形 `rm -rf "$(cat list)"` は deny になるので、方針ではなく
      レクサーの取りこぼし。
      フック自体は base とバイト一致なので新規の穴ではない。問題は、この穴を塞ぐ修正が
      入るとこの 2 件が FAIL し、次の担当者が「誤爆の再発」と読んで巻き戻す確率が高いこと。
    suggestion: |
      期待値を allow のまま残すなら、ラベルを「既知の抜け穴（未修正）」と明示し、
      対になる `rm -rf "$(cat list)"` の deny ケースを隣に置いて非対称が意図でないことを
      スイート自身に語らせる。あるいは check_rm 側を先に直して期待値を ask に変える。
    sources: [claude:security, "litellm:muse-spark:security", claude:comprehensive]
