  - stable_id: r5-pwd-build-mislabel
    severity: medium
    category: comprehensive
    file: em-workflow/hooks/tests/destructive-guard-cases.json
    line: 97
    title: "rm -rf $(pwd)/build のラベルが判定経路を誤って説明し、誤爆を期待値として固定している"
    description: |
      ラベルは「スクラッチ外(rm-recursive)」と述べるが、実測した理由文の対象は `/build`。
      deny を生んでいるのは対象がスクラッチ外だからではなく、statements() が `$(pwd)` を
      空白に潰した結果、コマンドが名指ししていない絶対パス `/build` という幻の対象が
      残るため。実際の削除対象はスクラッチ領域の内側で、`rm -rf build` / `rm -rf ./build`
      はどちらも allow、`rm -rf $PWD/build` は ask。
      本来 ask に落ちるべき形が deny になっており、このエントリはその誤爆を
      正しい挙動として固定している。無人実行では deny のまま走行が止まる。
      同じ構図が `rm -rf "$(cat list)"` にもある（実対象は空白 1 文字）。
    suggestion: |
      ラベルから「スクラッチ外」という誤った根拠を外し、幻の対象で deny していることを
      書いて既知の穴の群に合流させる。対になる `rm -rf $PWD/build`（ask）と
      `rm -rf build`（allow）を並べる。
    sources: [claude:comprehensive]
    confidence: 65
    resolution: unresolved
    resolution_reason: null
