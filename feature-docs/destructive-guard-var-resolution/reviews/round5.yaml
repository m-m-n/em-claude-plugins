    file: em-workflow/hooks/tests/destructive-guard-cases.json
    line: 130
    title: "変数に隠した rsync --delete の回避を「対象外(判定なし)」と誤ラベルしている"
    description: |
      フックは `rsync --delete` の deny 規則（rule rsync-delete）を実際に持つ。
      実測: `rsync --delete src dst` → deny、`D=--delete; rsync $D src dst` → allow。
      つまりこれは「判定対象外」ではなく「既存の deny 規則をフラグの変数化で回避できる」
      既知の穴であり、ラベルは規則の不在を主張していて事実に反する。
      同じファイルの `cat $X`（本当に規則が無い）と同じ分類に置かれているため、
      規則の不在と規則の回避が混同されている。
      スイート全体で rsync に触れるエントリはこの 1 件だけで、直書き `--delete` の
      deny counter-case が無い。
      なお同種のフラグ変数化は git push --force / find -delete / rm -rf でも成立する
      （base 由来の挙動で、この diff の対象外）。
    suggestion: |
      ラベルを「既知の穴(未修正): フラグを変数に隠すと deny 規則を回避できる」に改め、
      対になる `rsync --delete src dst`（deny）を並べて非対称を示す。
    sources: [claude:security]
