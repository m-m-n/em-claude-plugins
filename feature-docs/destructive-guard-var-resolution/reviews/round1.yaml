    title: "解決値の単語分割とクォート文脈を無視し、SAFE_DELETE の前方一致で残りの削除対象が素通りする"
    description: |
      resolve_target() は置換後テキストに DYNAMIC が残っていなければ解決済みとし、
      check_rm() はそれを 1 個の削除対象として扱う。クォートされていない参照は
      シェルでは単語分割されるため、値に空白が含まれると実際には複数パスの削除になる。
      SAFE_DELETE は前方一致（終端アンカーなし）なので、先頭がスクラッチ領域なら
      残り全部が無検査で通る。
      実測: X='/tmp/x /home/sakura' の後に変数経由で再帰削除すると、変更前 ask /
      変更後 allow。タブ区切り・IFS 変更でも同じ。先頭に安全パスを置くだけで
      任意パスの再帰削除が通る。
    suggestion: |
      置換後テキストに IFS 空白（スペース/タブ/改行）が含まれる場合は resolved=False と
      して元トークンを返し従来どおり ask に落とす。あるいは空白で分割して各語を
      独立した削除対象として rm-root / SAFE_DELETE / DYNAMIC 判定にかける。
      クォート由来情報を保持し、単一引用符・エスケープされた参照は解決しない。
    sources: [claude:security, codex:security]
    confidence: 95
    resolution: unresolved
    resolution_reason: null
