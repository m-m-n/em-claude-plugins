schema_version: 1
feature: security-review-repro-steps
created: '2026-10-08'
base_branch: main
goal: '# セキュリティレビューは再現方法を伝えてもらう


  Notion タスク: https://www.notion.so/3f33509ec8ee814db7e0da115e3c8646

  種別: 改善


  ## やりたいこと

  セキュリティ観点のレビューで、指摘ごとに再現方法を伝えてもらう。


  ## 背景・なぜ

  `em-workflow/references/review-output-schema.json` と `review-security` スキルには、再現方法を書く項目や指示が無い。


  ## 受け入れ条件 / 完了の定義

  - [ ] セキュリティ観点の指摘に再現方法が含まれる

  - [ ] em-workflow と em-review の両方に反映されている


  ## 方針（追記）

  - ねらいは、セキュリティレビューを収束させること

  - 指摘には、再現手順かそれに準ずる確認方法を付けてもらう

  - Claude Code がその手順で検証し、確かなものだけ対応する

  - 再現手順が無い指摘は、対応するかを Claude Code が判断する


  ## 追加指示（起動引数）

  - 実装完了後、integration ブランチを remote に push し、gh pr create で base_branch への PR を作成する。integration ブランチはローカル・リモートとも残す（base_branch
  へ自動マージしない）

  - 不明点は Codex に相談し、比較的良いと判断された案を採用する

  - その議論内容を Notion に記録する

  '
