  title: 単独行の `;;` と `;&` / `;|` で case 項目の終端を認識しない
  description: 'SPEC FR2 と Edge Cases は改行をまたぐ case を対象にしている。`;;` を字下げした単独行に置く一般的な書式では、lex_segments() が空の文（toks
    が空、sep に `;;` を含む）を返す。ところが body から pattern への切替（1052 行）は 1040 行の `if toks:` の内側にあるため実行されず、次の項目のパターン語がコマンド語として読まれて本文が検査されない。評価者の再現:
    `case $x in` / `  a) echo hi` / `     ;;` / `  b) rm -rf /home/sakura/x` / `     ;;` / `esac` を改行でつないだ形は
    allow（`;;` を本文と同じ行に置くと deny）。`start)` / `echo start` / `;;` / `stop) git push --force origin main
    ;;` の形も allow。さらに終端判定が `";;" in sep` だけなので、bash の `;&`（`case x in a) :;& b) rm -rf /home/sakura/x;;
    esac` は allow）と zsh の `;|` でも同じ漏れが起きる（`;;&` は deny）。既存の複数行ケースは `;;` が本文と同じ行にあるため、この穴を検出できない。


    [同一サイトで統合] shlex の解析に失敗したチャンクではグルーピングが剥がされない: 後続の行に閉じていない引用符があると、チャンク全体が正規表現による分割にフォールバックする（lexed=False）。このとき
    statements() は shaped_toks = toks をそのまま返す。評価者の再現: `if [ -d /home/sakura/x ]; then rm -rf /home/sakura/x;
    fi` 改行 `echo it''s done` は allow（`rm -rf /home/sakura/x` 改行 `echo it''s done` は deny）。`(rm -rf /home/sakura/x)`
    改行 `echo "oops` も allow。bash は 1 行目を実行してから 2 行目で構文エラーになる。SPEC FR2 はフォールバック経路を例外にしていない。変更前から同じ挙動で、引用符の閉じ忘れがないと起きないため
    medium。'
  suggestion: '切替を `if toks:` の外へ出し、lexed なセグメントでは空の文でも sep を評価する。終端判定を `;;` に加えて `;&` / `;|` に広げる。`;;`
    を単独行に置いた複数項目の case と、`;&` で区切った case を deny 期待のケース行として先に追加する。


    [同一サイトで統合] フォールバックでも改行ごとに _TrackingLexer を再試行し、解析できた行は lexed=True で返す。あるいは先頭の `(` / `{` / 予約語 / `!`
    を文字列として剥がしてから head() に渡す。上の 2 形をケース行に追加する。'
