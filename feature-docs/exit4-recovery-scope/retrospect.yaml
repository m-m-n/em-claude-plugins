lessons_candidates:
  - >-
    batch モードの auto-fix（review.auto-fix-judgment = Apply as-is）が、
    SPEC の Assumptions に反する修正を適用しうる。今回は architecture /
    comprehensive の high 指摘に従って Step I.2.a / I.3 へ明示的な
    commit-docs.sh 呼び出しを追加したが、SPEC A3 がそれを明示的にスコープ外と
    宣言しており、さらに他モジュールの byte-pinned アサーションを壊して
    フルスイートが red になった。R4 の candidate gate が category != spec で
    spec 観点を auto-fix から除外している一方、spec 観点だけが SPEC の
    Assumptions 違反を検出できるため、非 spec 観点の指摘が SPEC と衝突する
    ケースを loop 内で事前に弾く仕組みが無い。needs-judgment の dispatch 前に
    SPEC の Assumptions / Out of Scope と突き合わせる手順を検討する価値がある。
  - >-
    auto-fix の editor が単一ファイル制約を持つため、テストメソッドのリネームが
    test-docs の AC → test マッピングに追随できず、記録が解決不能な ID を
    指す状態になった。critical/high ゲートの外（medium）に落ちるため protocol 上は
    未解決のまま残る。今回はゲート外の付随修正として明示的に適用した。
  - >-
    ドキュメント文面をバイト単位で pin するテストが複数モジュールに分散しており
    （今回は tests/test_rework_synthesis_contract.py が implement-phase.md の
    Step I.3 の一文を pin）、編集側からは事前に気づけない。SPEC の A4 が
    「full-suite run で discharge する」と定めていた想定どおりに機能したが、
    auto-fix loop はテスト実行を挟まないため red の検出が次の再レビューまで遅れた。
