    selected_option_ids:
    - oserror_and_valueerror
    freeform: null
    normalized_answer: 起票ヘルパは OSError に加えて ValueError（UnicodeEncodeError を含む）を EntryPointError に変換し、元の例外を __cause__ に残す。TypeError 等のプログラム誤りは従来どおり伝播する。_write_references_tempfile の書き込み失敗時の一時ファイル削除も OSError
      と ValueError に広げる（書き込み関数自体は生の例外を送出したまま）
    resolution_note: 'gate: create-spec.requirement-clarification; policy action: codex_consultation; codex_consulted: true (1 turn, entry codex); Codex chose oserror_and_valueerror (対象例外だけを追加し既存の原因保持を維持できる。scan-dependencies.py:461、tests/test_sca_file_tasks_oserror.py:518。書込失敗時の削除対象も広げ、削除失敗で結果を変えない契約は維持する);
      recorded as assumption'
