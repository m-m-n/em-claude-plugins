    normalized_answer: package / advisory_id / severity（文字列のとき）のいずれかが UTF-8 にエンコードできない finding は集約段階で除外し、malformed_findings に position と新しい固定の理由文字列（既存のタイトル契約違反の理由とは別）で記録する。他の finding は通常どおり処理する。report 分岐も同じ集約を通るため落ちなくなる
    resolution_note: 'gate: create-spec.requirement-clarification; policy action: codex_consultation; codex_consulted: true (1 turn, entry codex); Codex chose skip_as_malformed (集約は分岐前なので文字列の severity も含めて検証・除外すれば起票と報告の両方を保護できる。scan-dependencies.py:528、:293。正常な
      finding を処理し続ける既存方針にも合う。tests/test_sca_task_filing.py:709); recorded as assumption'
