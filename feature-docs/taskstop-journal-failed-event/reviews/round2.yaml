    title: "封じ込めチェックが symlink 経路差で正当なエントリを破棄し、recorder が恒久 no-op になる"
    description: "rework で追加された封じ込めチェックは、index 側（hook の cwd から walk-up した実パス）とエントリ側（オーケストレーターが git toplevel から組んだ文字列）を symlink を解決せず文字列一致で比較する。同一物理ディレクトリでも綴りが違えば該当エントリは wholesale で無視され、recorder はそのプロジェクトで恒久 no-op になる。レビュアーが実測で再現: cwd が実パスなら failed が付き、同じディレクトリへの symlink 経由の cwd では何も書かれない。プロジェクトルートが symlink 経由で到達可能な環境（macOS の /tmp→/private/tmp、automount、~/work→/mnt/... 等）で発火する。rework が持ち込んだリグレッション。"
    suggestion: "比較の両辺を realpath で解決する。F-1 の防御は落ちず、むしろ強くなる（タスク worktree 自体が symlink の場合、realpath はリンク先へ解決するため親が feature ディレクトリと一致せず拒否される）。symlink 経由の cwd で happy path が解決することを assert する回帰テストを追加する。"
