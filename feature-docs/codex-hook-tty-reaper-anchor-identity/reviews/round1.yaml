    は返すチェーンの全リンクについて starts に開始時刻を記録するので、starts[anchor] は必ずある。開始時刻の比較はスナップショットの後、_targets
    の前で行い、完全一致しないときやエントリが無いときは pidfd を開かずに return する。親（ppid）は比べない。os.kill と新しい import
    は追加されていない。Flow は10ステップのままで、検査は step 5 に書かれている。TS1 は test_ac1（offset 500、対照テストあり）、TS2
    は test_ac2（±1 tick）、TS3 は test_ac4 に当たる。ほかに、アンカーが無い場合（test_ac3）と途中のプロセスが終了した場合（test_ac5）のテストもある。World
    は load_hook でテストごとに新しいモジュールを読み込むので、_snapshot の差し替えは他のテストに影響しない。観点ごとの照合結果: comprehensive=corroborated,
    security=corroborated, performance=corroborated, architecture=corroborated, spec=corroborated。注入の試みは見つからなかった。補足（指摘には入れていない）:
    スナップショットは /proc を1回走査して作るので、一瞬で取れるわけではない。アンカーのエントリを読んだ後、走査が終わるまでの数ミリ秒の間に PID が2回再利用されると、別のプロセスの子が子孫として数えられる経路が残る。これは変更前からある性質で、SPEC
    の範囲（チェーンを読んでからスナップショットまでの間）の外になる。テストスイートは評価者自身では実行していない。task0001.tests.yaml の記録（11796件
