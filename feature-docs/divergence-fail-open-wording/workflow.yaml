schema_version: 1
feature: divergence-fail-open-wording
created: '2026-09-25'
base_branch: main
goal: |
  # em-workflow: implement-phase.md I.2.a の divergence 段落が fail-open 定義と矛盾し、I.2.b の同型ルールを取りこぼしている

  Notion: https://www.notion.so/3c03509ec8ee818fa135ef93bc6f3e89

  ## 現象（必須）
  `em-workflow/references/implement-phase.md` I.2.a に新設された unlaunched-definition divergence 段落に、同一文書内で矛盾する用語と、隣接する同型ルールの取りこぼしがある。
  **(1) fail-open の用語矛盾**
  divergence 段落は、`queue_stop_guard.py` が journal イベントの無いタスクを status 無参照で unlaunched とみなし、結果として `status: merged` のタスクを launch list に載せ得る挙動を「deliberate, intended fail-open behavior」「the hook is a fail-open net」として正当化している。
  しかし同じ文書の Supporting cast セクションは fail-open を「on any unexpected state ... they exit 0 silently」「a hook wrongly blocking the session is worse than missing one violation」と定義している。divergence 段落が述べている挙動は exit 0 ではなく **exit 2 の誤 BLOCK**（既に merged のタスク名を出して turn 終了を阻む）であり、文書自身の定義では fail-open ではなく、まさに fail-open 規約が防ごうとしている事象そのもの。
  さらにこの文言は `tests/test_recycled_task_id_consistency.py` の `DIVERGENCE_DELIBERATE_PHRASE` として固定されているため、以後のメンテナは「誤 BLOCK は規約通り」と読んで修正対象から外す。
  **(2) I.2.b step 1 の同型ルール取りこぼし**
  divergence 段落は status 無参照の no-event 分類を `queue_stop_guard.py` 固有の逸脱として提示している。しかし同じ文書の I.2.b step 1 も、orchestrator 自身の reconcile ルールとして status 無参照で「no event → unlaunched」を規定している。逸脱はフック固有ではなく、分類層と選択層の差。
  最終挙動としては I.2.b が I.2.a に再突入するため `status != merged` フィルタが選択時に効いて一致するが、読者が divergence 段落だけを読むと「orchestrator は常に `status != merged` を併用する」と解釈し、I.2.b の記述と衝突する。
  ## 再現手順（必須）
  1. `em-workflow/references/implement-phase.md` の I.2.a 末尾の divergence 段落を読む
  2. 同じ文書の「Supporting cast: journal, hooks, resume」節の fail-open 定義（「on any unexpected state ... they exit 0 silently」）と突き合わせる
  3. 同じ文書の I.2.b step 1 の「no event → unlaunched」と突き合わせる
  ## 期待する挙動（必須）
  - divergence の正当化が、文書内の fail-open 定義と整合する語で書かれている。具体的には (a) 意図された根拠（初回 launch の取りこぼし検出）と (b) 誤 BLOCK が consecutive-block cap (3) によって有界化されている事実を明示し、この挙動に `fail-open` という語を当てない
  - divergence 段落が、I.2.b step 1 の reconcile も status 無参照で分類することに触れ、`status != merged` は I.2.a の選択時フィルタとして効くと述べている（または I.2.b step 1 側に注記を足して、divergence 段落の主語を「I.2.a の選択条件」と明示する）
  ## 完了の定義（必須）
  - [ ] divergence 段落から、誤 BLOCK 挙動を fail-open と呼ぶ記述が消えている
  - [ ] divergence 段落と I.2.b step 1 の関係が、どちらか一方を読んだだけで誤読しない形になっている
  - [ ] `tests/test_recycled_task_id_consistency.py` の `DIVERGENCE_DELIBERATE_PHRASE` が新しい文言に合わせて更新され、対となる negative proof も同時に更新されている
  - [ ] `python3 -m unittest discover -s tests` が通る
  ## 該当箇所（任意）
  - `em-workflow/references/implement-phase.md` — I.2.a の divergence 段落（236-245 行付近）
  - `em-workflow/references/implement-phase.md` — I.2.b step 1（341 行付近）
  - `em-workflow/references/implement-phase.md` — Supporting cast の fail-open 定義（582-586 行付近）
  - `tests/test_recycled_task_id_consistency.py` — `DIVERGENCE_DELIBERATE_PHRASE`
  ## 実害・発生条件（任意）
  `queue_stop_guard.py` の誤 BLOCK は journal が欠損・切り詰められたときに起きる。その際「規約通りの fail-open」と読めてしまうため、実際には有界化（cap 3）で凌いでいるだけの事象が調査対象から外れる。
  recycled-task-id-carveout feature（PR [https://github.com/m-m-n/em-claude-plugins/pull/15](https://github.com/m-m-n/em-claude-plugins/pull/15)）のレビューで検出された `8b579bf5c8547993`（architecture、medium、confidence 60）と `436df760545c569d`（comprehensive、medium、confidence 65）。severity が medium だったため、review フェーズの auto-fix ゲート（critical/high 限定）を通らず未対応のまま。
