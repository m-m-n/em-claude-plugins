  title: 承認文字列にトップレベルの & があると、後続の処理が cd 先ではなく元の cwd で動く
  description: '&& は & / ; より強く結びつくため、cd "P" && A & B では B が元の cwd（通常はメイン作業ツリー）で動く。; や || を含む承認文字列でも cd 失敗時に後続が元の cwd で動く。実装は FR1 のとおりで、SPEC の設計の漏れから来ている。'
  suggestion: 承認文字列全体が cd 先で動く実行形にするか、トップレベルに & / ; / || を含む承認文字列は cd 前置形の対象外だと手順書に書く。フック・文書・試験を同じ変更で合わせる。
  reproduction: null
