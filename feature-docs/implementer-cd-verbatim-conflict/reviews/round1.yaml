findings:
- stable_id: 61f034be00484674
  severity: high
  category: security
  file: em-workflow/hooks/bash_guard.py
  line: 221
  title: シンボリックリンクの後ろの .. で cd 先の領域制限を回避できる
  description: is_below() は os.path.realpath() でリンクを解決してから .. を処理する（物理パス）が、シェルの既定の cd は .. を文字列上で処理してからリンクを解決する（論理パス）。P が <リンク>/.. を含むと、フックが検査する場所と実際の移動先がずれ、承認済みコマンドが領域外で確認なしに動く。SPEC の AC-5 と Edge Case に反する。
  suggestion: P に .. の要素があれば cd 前置形として扱わない。または realpath(os.path.normpath(P)) も領域内にあることを求める。
  reproduction: 承認集合を {"pwd -P"} とし、worktree 内を cwd として cd "/proc/self/cwd/.." && pwd -P を is_cd_prefixed_approved() に渡すと True。同じ入力を bash で実行すると移動先は領域外の /proc/<PID>。
  reproduction_alternates:
  - この integration 作業ツリーを cwd とし、`pwd -P` を承認済みとして `cd "/proc/self/cwd/.." && pwd -P` を検査する。allow が返る一方、同じ cwd から Bash で実行すると `/proc/<PID>` が出力される。
  reproduction_overflow: false
  sources:
  - codex:security
  - codex:comprehensive
  confidence: 100
  resolution: fixed
  resolution_reason: auto-applied loop 1
- stable_id: b3582a48847b9e2f
