- stable_id: 1ff4933d3c9b729c
  severity: medium
  category: comprehensive
  file: em-workflow/hooks/bash_guard.py
  line: 224
  title: Bash が移動できるパスを論理パスの不存在だけで除外しない
  description: Bash の cd は論理パスへの移動に失敗すると物理パスで再試行するため、論理パスが存在しなくても領域内へ正常に移動できる場合がある。loop 1 の修正後は、そうした有効なパスの cd 前置コマンドが allow から無判定（通常の権限確認）へ変わる。
  suggestion: 領域外の論理移動先は引き続き除外しつつ、論理パスが使えず物理パスへフォールバックする場合も考慮して判定し、回帰テストを追加する。
  reproduction: P = "/proc/self/root/.." + 現在の worktree パスとすると、realpath(P) は worktree で bash の cd も成功するが、realpath(normpath(P)) は存在しないため修正後の is_below() は False を返す。
  reproduction_alternates: []
  reproduction_overflow: false
  sources:
  - codex:comprehensive
  confidence: 60
  resolution: unresolved
  resolution_reason: 'medium: auto-fix 対象外（critical/high のみ）。安全側（allow しない）に倒れる副作用で、通常の権限確認に戻るだけ'
