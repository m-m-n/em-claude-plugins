    title: batch abort に commit 呼び出しが入ったことで batch-terminal-line の stop reason code が二重該当しうる
    description: >-
      この変更で batch の 2 回目失敗 abort パスに `commit-docs.sh` 呼び出しが新設され、
      その call site は exit-4 recovery の対象として Branch & Worktree Model の
      箇条書きに明示的に追加された。その結果、abort 実行中に 2 回連続の exit 4 が
      起きた停止点は `references/batch-terminal-line.md` の Stop point coverage 表の
      2 行 — `implement-second-failure`（→ `implement_task_failed`）と
      `docs-commit-conflict`（→ `docs_commit_conflict_aborted`）— の両方に同時に
      該当する。同ファイルの Precedence rule は「phase-specific > generic
      `stop-condition-N`」しか解決せず、phase-specific 同士の衝突を解決しないまま
      「so exactly one code applies」と宣言しているため、batch run が最終行に出す
      reason code が未定義になる。外部サービスはこのコードでフォローアップタスクを
      起票するので、誤帰属が起きうる。変更前は abort パスに commit が一切無かった
      ため、この 2 行が同時に該当することは起き得なかった。副次的に、exit-4
      recovery を使い切った時点では 2 回目の書き込み（`implement: failed`）が
      未コミットのまま worktree に残る点も、この経路特有の残留状態になる。
    suggestion: >-
      どちらか一方の SSOT で優先関係を明示する。(a)
      `references/batch-terminal-line.md` の Precedence rule に「phase-specific 同士が
      同時該当した場合は、停止を直接引き起こした事象側（= `docs-commit-conflict`）が
      勝つ」といった規則を 1 文追加する。または (b)
      `references/implement-phase.md` の abort 記述側に、この call site で exit-4
      recovery を使い切って停止した場合の reason code を明記する。あわせて、その
      停止時に terminal status write が未コミットで残ることも 1 文で定義しておく。
    sources: [claude:comprehensive]
