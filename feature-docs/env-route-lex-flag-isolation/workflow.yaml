schema_version: 1
feature: env-route-lex-flag-isolation
created: '2026-11-24'
base_branch: main
goal: '# destructive-guard: env 経路の本文の字句解析が大域フラグを立て notion 以外の判定を変える


  ## 現象 (必須)


  destructive-guard の env 経路（head() が env を読み違える形の `bash -c` 本文を notion ペアの検査のために読む経路）が、本文に
  notion 呼び出しがあるかを確かめる前に本文を `lex_shell()` で字句解析する。`lex_shell()` はモジュールの大域フラグ `_lex_unreadable_met`（同じ形の
  `_lex_extglob_met` も）を立てるため、notion と無関係な本文でも、`run()` が ask 未満の判定を ask に上げる。無人実行ではそれが
  deny に降格する。


  ## 再現手順 (必須)


  1. `/usr/bin/env bash -c ''<区切り語が ${tag} の cat のヒアドキュメントだけを持つ本文>''` を destructive-guard
  に渡す（CLAUDE\_BATCH あり）

  2. 判定が unreadable-heredoc-delimiter による deny になる（env 経路の読み取りを外すと allow）


  ## 期待する挙動 (必須)


  env 経路で足した本文の読み取りは notion ペアの検査だけに効き、notion 以外の判定を変えない。上の例は allow のまま。


  ## 完了の定義 (必須)


  - [ ] 再現手順で現象が起きない

  - [ ] 再発を検出するテストがある


  ## 該当箇所 (任意)


  `em-workflow/hooks/destructive-guard.py` の `_args_json_payload_chunk()`（integration
  ブランチ `em-workflow/mcp-bridge-function-shadow/integration` の 9573 行付近）。mcp-bridge-function-shadow
  のレビュー round 3 の stable\_id 3cd1a62c2e606dc2（deferred）。


  修正案: 呼び出しの前後で大域フラグを保存して戻す、または本文が mcp-bridge を含むときだけ字句解析する。


  ## 実害・発生条件 (任意)


  無人実行で、`/usr/bin/env` 経由の `bash -c` 本文に読めないヒアドキュメント区切り語があるときだけ、止まる回数が 1 つ増える。判定は通常の
  `bash -c` の形が既に受けるものと同じ。

  '
