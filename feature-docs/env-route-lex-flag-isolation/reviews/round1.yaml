  title: 2 つの読み取りの重複除去が値の文字列で行われ、charge が読み取りの順に依存する
  description: _args_json_env_combine() を読んで確認した。先の読み取りが [A]、後の読み取りが [A, B]（B は A と別の文だが同じ command 文字列）のとき、A は unmatched で消え、B は文字列がすべて既出なので charge されず、結果は command 1 件と A の charge になる。順序が逆だと A と B の両方が
    charge され、command は 2 件残る。run() は外側に拡張パターンの括弧があると両方の読み方で判定するので、1 回の判定の中でも 2 つの順序が起こりうる。同じ文字列は少なくとも 1 回 queue されるので検査漏れにはならず、影響は scan-budget の境界付近の判定に限られる。architecture#0 も同じ箇所を同じ理由で指摘している（各文の本文中の位置を
    _EnvBodyEntry に持たないため、同じ文の再読と別の文の同じ値を区別できない）。
  suggestion: _EnvBodyEntry に notion 文（または `--args-json` の値）の本文中の位置を持たせ、両方の読み取りで同じ位置から得た値だけを 1 回にまとめて charge する。返す文字列の重複除去と charge の集計を分ける。どちらの extglob 設定から読み始めても件数と charge が一致するテストを足す。
