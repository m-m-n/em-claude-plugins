  title: env 経路で区切り語を読めないヒアドキュメントの後ろに置いた notion ペアが検出されなくなる
  description: 'security#0 の再現手順（TS-1 の本文の区切り行の後ろに printf を足すと、batch で変更前 deny、変更後 allow）は読解で確認した（reproduced）。ただし printf の allow は SPEC の AC-1 と THREAT-MODEL が目的とする結果で、env 経路の本文の notion 以外の文は変更前から通常の検査に渡らない（cases.json
    1593 行の `/usr/bin/env bash -c` に git branch -D を渡すケースは allow で固定されている）。そのため指摘の一般形（区切り行の後のコマンド全般が未検査）はこの差分が持ち込んだものではない。残る問題は notion ペアの検出範囲の縮小に限られる: 読めない `<<` は tail source になり、その後ろの引用符は開かれず literal
    のまま残る（LexMap.unopened、3766 行付近のマスク）。このため区切り行の後ろに置いた lifted な notion ペアの `--args-json ''...''` は JSON として復号できず、env 経路は何も返さない（_args_json_read_values() は JSONDecodeError を黙って飛ばす）。変更前は本文の読み取りが立てた `_lex_unreadable_met`
    が run() の P16 の ask（batch では deny）として残り、この形も止めていたが、10402 行の復元でその安全網が消えて allow になる。THREAT-MODEL の TM-2 と同じ型の縮小を P16 について起こしており、脅威モデルにもテストにも無い。env 経路の本文の通常のコマンドは元から検査されないので攻撃者の上積みは小さく、high から medium に下げた。'
  suggestion: FR1 のフラグ復元は保ったまま、env 経路の読み取りが LexMap.unreadable（tail source）に出会い、かつ tail の開始位置以降に mcp-bridge を呼びうる文があるときは、その読み取りの結果に unrestorable を立てて args-json-unrestorable の ask を残す。tail の中では `--mcp 'notion'`
    のような引用も literal になるので、notion の判定ではなく mcp-bridge の語の有無で判断する。区切り行の後ろに lifted な notion ペアを置いた env 経路のケースを cases.json に足す。TS-1 / TS-2 は mcp-bridge を含まないので allow のまま。
  reproduction: 追加された TS-1 の区切り行の直後に、無害な `printf REVIEW_MARKER` を本文の最終行として加えた。CLAUDE_BATCH=1 で同じ入力を run() に渡すと、比較元は deny、変更後は allow を返した。変更後に statements() が通常の検査に渡したコマンド名は env だけで、printf は含まれなかった。
