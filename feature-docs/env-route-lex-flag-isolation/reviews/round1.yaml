  title: 片方の読み方だけの overrun で、もう片方が復号した notion ペアの command が検査されない
  description: 読解で再現を確認した（reproduced）。10428 行はどちらかの読み取りの overrun を結果全体に立て、10819 行の呼び出し元は overrun のときその文の値を何も queue せず scan-budget の ask を保持して戻る。変更前は env 経路の読み取りが 1 回で、その読み方で見えた notion ペアの command は queue
    され deny になった。変更後は、もう片方の読み方だけで見える文の `--args-json` が入れ子の上限を超えると、先の読み方で復号済みの git branch -D が検査されず、対話実行で deny が利用者の承認できる ask に弱まる（batch では deny のまま）。1 回の読み取りの中で複数の notion 文の overrun を合成する既存の挙動の延長でもある。FR4
    が overrun の合成を求めているので、直すには呼び出し元の D3 との整理が要る。
  suggestion: 上限を超えた読み取りの ask は保持したまま、もう片方の読み取りが上限内で得た command と本文を検査に回し、deny が出ればそちらを優先する。FR4 と D3 の文言との整合は人の判断で決める。
  reproduction: 追加テストの `EXT_LINE` と `NOTION` を使い、extglob 有効時だけ `_args_json_read_values()` が overrun を返すようにして、同じ入力を対話設定の run() に渡した。比較元は `git-branch-force-delete` で deny、変更後は `scan-budget-exceeded` で ask
    を返した。片方だけの overrun が実入力でも発生することは、TS-6 の複数行形式と既存の TS-15 nesting の無害な JSON 値で確認した。
