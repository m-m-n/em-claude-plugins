    normalized_answer: env 経路の本文の読み取りの前後で _lex_unreadable_met と _lex_extglob_met を退避し、本文に持ち上げられた
      notion 文があってもなくても読み取り前の値に戻す。notion の検出範囲を狭めないため、本文の読み取りで extglob を検出したときは、env
      経路の中で extglob の有効時と無効時の両方で本文を読み、どちらかで見つかった notion ペアを検査する。両方の読み取りの後にフラグを戻す
    resolution_note: 'gate: create-spec.requirement-clarification; policy codex_consultation;
      Codex consulted (codex entry, 3 turns); chosen always-restore（turn 2 の緩和策を含む）;
      not chosen propagate-when-notion, substring-gate; key points: turn1 always-restore
      — run() はフラグを入力全体に適用するため、同じ本文の別の文の区切り語で全体が ask/deny になる。turn2 propagate-when-notion
      — extglob の有無でヒアドキュメントの範囲が変わり（2714 行）、env 経路の notion 検査は本文を 1 回しか読まない（10382
      行）ため検出が狭まる。緩和策として env 経路内で両方の読み方を試す案を提示。turn3 always-restore に収束し、緩和策は always-restore
      と両立する。substring-gate は $''\x6dcp-bridge'' を取りこぼす; Opus escalation not run'
