  title: ))で閉じない (( / $(( を 1 個見つけるたびに全文を読み直すため仕事量が二乗で増え、無害なコマンドが scan-budget の ask になる（退行）
  description: 未閉鎖の opener はひとつのパスでまとめて確定するが、最初の閉じが隣接する `))` でない `((` / `$((` は、見つけた時点で opener を 1 個だけ持って restart する（1198 行）。そのため k 個あると k+1 回のパスになり、仕事量はおよそ k·n/2 に増える。予算 LEX_WORK_FACTOR·n+1024 を超えると LexBudgetExceeded になり、ask を返す（CLAUDE_BATCH 下では deny）。`x=$((echo N) | wc -c)` を 28 行（約 630 文字）並べると予算を超えて ask になる。`((cd /tmp/aN && ls) || echo no)` を 40 文並べても ask になる。基準コミットはどちらも allow なので、本差分による退行にあたる。513〜517 行のコメントと NFR3 の線形性の主張は、この経路で成り立っていない。
  suggestion: 非隣接の閉じを見つけたら、全文からではなく、その opener から局所的に読み直す。あるいは 1 パスで見つけた非隣接の opener をすべて集めてから restart する。k 個の `$((cmd) ...)` を並べたケースで、rounds と work が n に比例することを TestUnclosedOpeners に足す。
