  title: コマンド位置の判定が bash より狭い。閉じ記号の後の予約語、for NAME do、function NAME()、coproc NAME の後ろにある ((...)) の << をヒアドキュメント演算子と読む
  description: word_transition() は f.cmd が真のときしか予約語（then / do など）を扱わない。また、群の `)` と算術コマンドの `))` を閉じたときに親の cmd を偽にする（1032 行、1192 行）。bash は `)`・`}`・`))`・`]]`・fi / done / esac の直後でも予約語を認める（parse.y の reserved_word_acceptable）。`for NAME` / `select NAME` の後の do、`coproc NAME` / `function NAME` の後のコマンド位置も同様に認める（special_case_tokens）。そのため次の各形では `<<2` が本物の演算子として登録され、続く行は本文として読み飛ばされる。各形の後ろに `\nrm -rf /home/sakura/valuable\n2` を続けると、フックは allow を返し、bash 5.3 は 2 行目を実行する。`if (true) then ((1<<2)); fi` / `if ((1)) then ((1<<2)); fi` / `if { true; } then ((1<<2)); fi` / `if [[ 1 ]] then ((1<<2)); fi` / `until (true) do ((1<<2)); done` / `for x do ((1<<2)); done` / `function f() ((1<<2))` / `coproc foo ((1<<2))`。これは FR3（コマンド位置には予約語の後ろを含む）と IMPLEMENTATION.md P3（do・coproc の後、関数定義の本体）に反する。基準コミットのフックも同じ形を allow にするので退行ではない。COMMAND_POSITION_FORMS はこれらの形を含んでいない。
  suggestion: bash の reserved_word_acceptable に合わせる。閉じ記号（群の `)`、`}`、算術コマンドの `))`、`]]`、fi / done / esac）の直後を「予約語を受け付ける」状態にし、then / do / else / elif / fi / done などを keeper として扱う。for / select の後の NAME に続く do、coproc NAME、function NAME [()] の後もコマンド位置にする。hook-tests.md に従い、直す前に上の各形を deny ケースとして cases.json に足し、COMMAND_POSITION_FORMS にも加える。
