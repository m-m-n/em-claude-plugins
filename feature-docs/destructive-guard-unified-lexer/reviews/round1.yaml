  description: '_lex_pass() は、演算子がある物理行の終わり（hd_trigger）に達すると、スタックの状態にかかわらず本文の後ろへ飛ぶ（921〜927 行）。bash は保留中の本文を、演算子を読んだ文脈の改行トークンに達したときに集める。演算子の後ろで開いた二重引用・単一引用・`$(` が改行をまたぐと、本文はその引用が閉じた行の次から始まる。例: `cat <<EOF; echo "\n"; rm -rf /home/sakura/valuable\nEOF`。bash は rm を実行し、本文は空になる。字句解析は 2 行目を本文に入れ、フックは allow を返す。`echo ''\n''` や `echo $(\n)` の形、`git reset --hard HEAD` でも同じ結果になる。基準コミットも allow なので退行ではないが、FR8 の本文判定を担う新しいコードにある。'
  suggestion: 演算子を登録したときのフレーム（スタックの深さ）を記録する。本文への飛び越しは、そのフレームが最上位にあり、かつそのフレームで改行を読んだときだけ行う。別のフレームが開いている間は飛び越しを保留し、本文の探索を始める行もその改行の次の行に合わせる。直す前に上の形を deny ケースとして足す。
