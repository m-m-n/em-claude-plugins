  description: '[1050 行] bash は、代入として受け付けられる位置にある識別子の直後の `[` を、`]` までの対の括弧として読む（read_token_word の P_ARRAYSUB）。そのため `a[1<<2]=x` の `<<` は演算子にならない。字句解析は単語の中の `<` で語を切り、`<<2` を本物の演算子として登録する。`a[1<<2]=x\nrm -rf /home/sakura/valuable\n2` を bash は実行するが、フックは allow を返す。基準コミットも allow。 / [同一箇所で統合した 1051 行の所見（元 stable_id e69e7660d6daa738）: 区切り語に英数字以外を含むヒアドキュメント（<<END-X など）で、区切り語を途中までしか読まず、後ろの行を本文として捨てる] 字句解析は HEREDOC_OP（154 行、`(\w+)`）で区切り語を取る。`<<END-X` や `<<E.X` では区切り語が `END` / `E` で切れ、その名前だけの行を探す。`cat <<END-X\nbody\nEND-X\nrm -rf /home/sakura/valuable\nEND` では、bash の本文は `body` だけで rm を実行する。一方、字句解析は後ろの `END` 行までを本文にし、フックは allow を返す。基準コミットも allow。'
  suggestion: (1050) コマンド位置（または代入が続く位置）の語が `識別子[` で始まるときは、`]` までを対で読む領域にし、その中の `<<` を演算子にしない。TS-8 の `a[1] <<EOF`（本物の演算子）とは区別して残す。(1051) 区切り語を、bash と同じく次のメタ文字までの 1 語として読み、引用除去した値を区切り語にする。`\w+` に収まらない区切り語を見つけたときは、本文を取らない（後ろを検査から外さない）読みに倒す。どちらも直す前に deny ケースとして足す。
