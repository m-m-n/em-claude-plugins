  description: P10 で閉じ記号の後に認める予約語の集合 _LEX_AFTER_CLOSER_WORDS（726 行）に `{` が無い。bash は算術 for（ARITH_FOR_EXPRS）の直後の `{` を本体の開始として受け付ける（`for ((;;)) { list; }`）。字句解析は算術 for の `))` を閉じたときに rw を立てるが、続く `{` を予約語と認めずコマンド位置にしないので、本体の `((1<<2))` を 2 つの括弧と読み、`<<2` を本物の演算子として登録する。`for ((i=0;i<1;i++)) { ((1<<2)); }\nrm -rf /home/sakura/valuable\n2`、`for ((;0;)){ ((1<<2)); }\nrm -rf /home/sakura/valuable\n2`、`if :; then for ((;0;)) { ((1<<2)); }; fi\nrm -rf /home/sakura/valuable\n2` でフックは allow を返し、bash 5.3.9 は 2 行目を実行する（rm を echo に置き換えて確認した）。FR3（コマンド位置には予約語の後ろと for ((...)) を含む）に反する。42180fe3cd060309 と同じ類で、task0002 の P10 が拾っていない形。基準コミットも allow なので退行ではない。
  suggestion: 算術 for の `))` の直後（rw が立つ位置）では `{` も予約語として認め、コマンド位置にする。他の閉じ記号の後ろの `{` は bash でも構文エラーなので、`{` を _LEX_AFTER_CLOSER_WORDS に足しても安全側に倒れる。hook-tests.md に従い、直す前に上の形を deny ケースとして cases.json に足し、COMMAND_POSITION_FORMS にも加える。
