    freeform: null
    normalized_answer: 'Codex 相談で採用（計画の欠陥修正）: 位置対応を『厳密増加・全域』とする契約は、置換印の長さが元の範囲と異なる場合（destructive-guard.py:2701、3
      文字の $() が 6 文字の印になる）に成立しない。置換部分は元の範囲全体へ対応させ、文字位置の往復一致は未変更部分に限定する。'
  create-plan.assumption.Q3-agreement-risk:
