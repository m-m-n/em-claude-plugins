    freeform: null
    normalized_answer: 'Codex 相談で採用: 各層が同じ誤読を共有したまま一致検査を通るリスクがある。追加例では固定した範囲の期待値と最終判定の両方を確認し、閉じない開始記号の再読でもコメントやヒアドキュメント本文の取り込みで後続を捨てないことを検証する。'
  create-plan.assumption.PA5:
    packet_id: null
    answered_at: '2026-10-06T00:20:00+09:00'
    source: batch-assumption
    answer_mode: assumption
    selected_option_ids: []
    freeform: null
    normalized_answer: プロセス置換 <(...) / >(...) は $(...) と同じく置換範囲として scan_structure() の spans に載せ、本文を独立したチャンクとして検査し、中のヒアドキュメントも本文側の文に帰属させる。ホストの文は
      has_process_sub の証拠を保つ（既存ケース tee >(bash) <<'EOF' は deny のまま）。
