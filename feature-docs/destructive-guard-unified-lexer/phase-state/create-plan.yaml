    normalized_answer: 一致検査のテストは、ケース追加コミットの後・フック変更コミットの前に単独でコミットする。検証では git 履歴でこの順序と、変更前フックでの失敗を確かめる（TS-19
      / TS-20）。
  create-plan.assumption.PA10:
