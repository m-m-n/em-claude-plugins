findings:
  - stable_id: d23f182330cc695e
    severity: high
    category: architecture
    file: em-workflow/hooks/muse_guard.py
    line: 73
    title: "DENY_CONTEXT がレビュアーにチェーン選択を指示し、deny 後の復帰経路がプロトコルに存在しない"
    description: >-
      DENY_CONTEXT（両プラグインの muse_guard.py:73-80、PLUGIN_SLUG 以外バイト一致）は
      「reviewers.yaml の chain にある非 contributor の muse-spark エントリ、または他の
      chain エントリでレビューを続行する」と指示する。この additionalContext を受け取るのは
      deny された Bash を発行した主体、すなわち codex exec -p litellm -m <model> を実行する
      レビュアーサブエージェントである。ところが em-workflow/references/review-protocol.md:25 は
      『never chooses one itself — WHICH model each perspective gets is decided by the
      orchestrator』と定めており、reviewers.yaml はレビュアーの入力ですらない。指示どおり
      動けば、レビュアーはオーケストレーターが選んでいないモデルで自走し、R2 が記録した
      chain INDEX・R2b の再開位置・litellm:<model>:<perspective> の source identity が
      すべて実行実体とずれる。どのレビューをどのティアへ送ったかの追跡可能性がこの機能の
      目的そのものなので、記録が実行と食い違うのは具体的なコスト。加えて、この deny を表す
      skip_reason が review-protocol.md の retryable 集合（rate_limited / budget_exhausted /
      harness_unavailable）に無く、レビュアーには層に沿った報告手段が無い。
    suggestion: >-
      DENY_CONTEXT からチェーン選択の指示を外し、レビュアーには「このハーネス呼び出しは
      実行できない」ことと同意の代行記録禁止だけを伝える。チェーン継続の判断はオーケスト
      レーターに戻す — (a) この deny に対応する skip_reason を review-protocol.md の
      retryable 集合に追加して R2b の表に行を足すか、(b) deny を非 retryable 失敗として
      扱い R2b のチェーン歩進に載せるか、どちらかに寄せる。em-review 側のコピーも同じ
      1 行修正で揃える（PLUGIN_SLUG 以外バイト一致の制約を維持）。
    sources: [claude:architecture]
    confidence: 80
