    title: "同意の「機械的チェック」を実行する手段がオーケストレーター向けに定義されていない"
    description: >-
      新設の Contributor-tier pre-dispatch criteria（em-workflow は 244-268 行、em-review は
      199-223 行、両 reviewers.yaml のコメントにも同文）は、read-mapping の前提として
      「consent for this project is recorded — mechanical, decided by the consent store,
      not by prose」の通過を要求する。しかしオーケストレーターが読む文書のどこにも、
      ストアの問い合わせ手段・プロジェクトキーの導出規則が書かれていない。R0 の probe 群
      （codex / litellm / ntd）にも同意 probe は無い。ストアへの読み取り経路は
      skills/contributor-consent/SKILL.md:40 の --list だけで、その SKILL.md 自身が
      『develop フローや review フローの自動処理から呼び出されることはなく、どのフェーズ
      ドキュメントもこのスキルを参照しない』（11-13、122-123 行）と宣言している。結果、
      R2 のオーケストレーターは機械的チェックを実行できず、実質 LLM 判断だけで dispatch
      して hook の deny を待つ運用になる（設計上の二段チェックが一段に退化し、前掲の deny
      復帰経路の欠落と直結する）。自前でキー導出を再実装する回避も、muse_guard.py が単独
      所有する git common-dir 規則の二重化になる。
    suggestion: >-
      どちらかに明示的に寄せる。(a) R0 の probe 群に 1 ステップ足し、
      python3 "${CLAUDE_PLUGIN_ROOT}"/hooks/muse_guard.py --project-dir {project_root} --list
      の出力有無で contributor_consent を決めると書き、criteria 側は「機械的チェック =
      R0 で得た contributor_consent」と参照するだけにする（キー導出は muse_guard.py の
      単独所有のまま）。(b) 機械的チェックは hook が実行時に行うものと明記し、criteria
      からは dispatch 前の前提条件という位置づけを外したうえで、deny された場合の
      オーケストレーター側の扱いを定義する。em-review 側の review-phase.md と両
