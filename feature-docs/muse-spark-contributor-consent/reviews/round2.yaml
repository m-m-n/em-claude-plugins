- stable_id: 42f7a860a3dae1c4
  severity: high
  category: security
  file: em-workflow/hooks/muse_guard.py
  line: 469
  title: Statement splitting runs before quote resolution, so the harness's own invocation form escapes
    the deny
  description: '_SEGMENT_SPLIT_RE.split at line 469 splits on `;` `&&` `|` newline before shlex.split
    ever sees quoting, so a separator inside a quoted argument shatters the statement; the resulting fragments
    raise ValueError on unbalanced quotes and are silently skipped at lines 475-476. Verified no-decision
    cases: `codex exec -m muse-spark-contributor "review this; check auth"` and a prompt containing a
    newline. Decisive rather than theoretical: the provider''s own harness documents the invocation as
    `codex exec -p litellm -m <model> "<prompt>"` (vertex-review 0.9.0 litellm-harness/SKILL.md) and a
    review prompt is a multi-line block, so the single form the guard exists to intercept is exactly the
    form it fails to classify. SPEC FR4 and FR5''s invocation clause are both unmet. tests/test_muse_guard.py
    passes only because every spelling fixture uses the single-line, separator-free prompt "review this".
    Both plugin copies are affected.'
  suggestion: Split into statements on the same quote-aware pass that _quote_aware_scan already performs,
    emitting separators only when they occur outside quoted/escaped regions, instead of regex-splitting
    the raw text. Add regression fixtures using a multi-line prompt and a prompt containing `;`, in the
    `-p litellm -m <tier> "<prompt>"` shape the harness actually emits.
  sources:
  - codex:security
  confidence: 100
  resolution: deferred
  resolution_reason: 'batch mode: rework cap reached'
