    cost is asymmetric in this repository: .claude/rules/hook-tests.md records that a guard misfire stops
    an unattended run on the spot, because ask/deny cannot be answered under claude-batch. Documentation
    commands, commit messages and review prompts that quote the tier name are all blocked, in both plugin
    copies.'
  suggestion: 'Fix jointly with the quote-aware splitting change: a separator inside a quoted region is
    not a statement boundary, so the quoted text never becomes a candidate segment. Add negative fixtures
