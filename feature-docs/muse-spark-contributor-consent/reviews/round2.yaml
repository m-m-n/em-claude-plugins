  title: The consent CLI is reachable from the agent's own Bash tool and is guarded only by prose
  description: 'Reproduced both halves. First, the hook does not classify its own CLI: `python3 "${CLAUDE_PLUGIN_ROOT}"/hooks/muse_guard.py
