    property that the gate is decided in code and therefore cannot be talked around (Prompt-injection
    Resistance), and FR7 states the CLI is out-of-band and never invoked by the workflow; neither is enforced,
    so a single injected instruction converts a deny into permanent consent for the repository. This is
    the one finding whose consequence is irreversible from the user''s point of view.'
  suggestion: Have the guard classify invocations of its own CLI mutation modes (--record / --remove)
    in the PreToolUse path and deny them, which is coherent with FR7's out-of-band contract - the user
    runs this in a terminal, never through the agent's Bash tool. Keep the prose, but stop relying on
