  title: Quoted mentions of the tier produce a false deny, violating FR5's no-misfire floor
  description: 'The same pre-shlex split at line 469 also fires in the opposite direction. Reproduced:
    `printf ''%s\n'' ''example; codex exec -m muse-spark-contributor; done''` yields a deny decision although
