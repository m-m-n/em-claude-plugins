- stable_id: f612821e62f070e6
  severity: medium
  category: comprehensive
  file: em-workflow/hooks/muse_guard.py
  line: 561
  title: Unlocked read-modify-write in the CLI can resurrect a revoked consent, and the temp file name
    is shared
  description: 'cli_record and cli_remove both read the store (line 561 / 575), build a dict in memory,
    and replace the whole file (line 567 / 584) with no interprocess lock, while write_store uses the
    fixed name path + ''.tmp'' (line 141) shared by both plugin copies and every concurrent process. Interleaved
    record and remove therefore lose one update - a removed repository reappears with consent - and two
    concurrent writers can interleave on the same temp path, which os.replace atomicity does not protect
    against. The evaluator demoted the reviewer''s high to medium on likelihood, not on mechanism: contributor-consent/SKILL.md
    restricts the CLI to interactive user sessions. The failure direction still matters, because the update
    that gets lost is the revocation.'
  suggestion: Wrap each mutation in a lock held across the whole read-modify-replace (an O_CREAT|O_EXCL
    lock file or fcntl.flock on the store), and give the temp file a unique per-process suffix. Cover
    interleaved record/remove for both copies.
  sources:
  - codex:comprehensive
  confidence: 80
  resolution: unresolved
  resolution_reason: 'medium severity: not an auto-fix candidate (Phase R4 gate requires critical/high)'
