- stable_id: e4d8030072b17204
  severity: medium
  category: security
  file: em-workflow/hooks/muse_guard.py
  line: 528
  title: Consent is evaluated against the payload's cwd rather than the invocation's effective directory
  description: Line 528 takes the key from the payload cwd only, while the classifier does detect the
    invocation across an && boundary (`cd /repo-b && codex exec -m muse-spark-contributor review` classifies
    as an invocation). With consent recorded for repository A, an invocation whose effective working directory
    is repository B is permitted on A's consent. Because consent here is a licensing decision made per
    repository, this lets a repository's contents reach the contributor tier without that repository's
    own consent.
  suggestion: Derive the effective directory per detected invocation, accounting for a preceding cd in
    the same statement chain and for directory-selecting options, and require consent for every repository
    an invocation can read from. Where the effective directory cannot be determined, the existing fail-open
    posture applies.
  sources:
  - codex:security
  confidence: 85
  resolution: unresolved
  resolution_reason: 'medium severity: not an auto-fix candidate (Phase R4 gate requires critical/high)'
