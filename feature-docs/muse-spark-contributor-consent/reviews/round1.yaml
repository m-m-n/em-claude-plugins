findings:
- stable_id: 1170516129413bc5
  severity: high
  category: security
  file: em-workflow/hooks/muse_guard.py
  line: 264
  title: Contributor-tier guard misses `--model <value>` and `-m=<value>` spellings, so the deny is bypassed
    (merged with the nested-invocation site at line 262)
  description: '`_segment_invokes_contributor_tier` (em-workflow/hooks/muse_guard.py:264-269, byte-identical
    in em-review/hooks/muse_guard.py:264-269) recognizes exactly two spellings: `-m` as a token followed
    by a token equal to `muse-spark-contributor`, and a token starting with `--model=`. The codex CLI
    is clap-based and accepts the long flag with a separate value (`--model muse-spark-contributor`) and
    the short flag with an attached/`=`-joined value (`-m=muse-spark-contributor`, `-mmuse-spark-contributor`)
    as fully equivalent invocations. Verified against both copies of the hook with a nonexistent consent
    store: `codex exec -p litellm -m muse-spark-contributor ''x''` -> deny (correct), `codex exec -p litellm
    --model=muse-spark-contributor ''x''` -> deny (correct), but `codex exec -p litellm --model muse-spark-contributor
    ''x''` -> no decision, and `codex exec -p litellm -m=muse-spark-contributor ''x''` -> no decision.
    Both uncovered spellings run the contributor tier with the project diff and receive no deny at all,
    which is the exact outcome SPEC Objectives 2 / US2 exists to prevent. SPEC FR5''s enumeration lists
    only the two covered spellings, so the gap is between FR5''s enumeration and FR1/Objective-2''s intent.


    MERGED SIBLING (stable_id 98df40b6ce96c809, line 262, same_site within 5 lines of this finding, severity
    medium): Invocations nested under `bash -c`, command substitution, or `xargs` are not classified.
    Classification requires the segment''s own command word to be `codex` (`_segment_invokes_contributor_tier`,
    :262; `_command_word`, :237-258). That restriction is load-bearing for the FR5/TS-6 no-misfire cases
    (`git commit -m muse-spark-contributor`, `grep -m ...`), but it leaves every nested spelling unclassified.
    Verified against both copies with an empty store, all returning no decision: `bash -c "codex exec
    -p litellm -m muse-spark-contributor ''x''"`, `sh -c ''codex exec -p litellm -m muse-spark-contributor''`,
    `echo $(codex exec -p litellm -m muse-spark-contributor ''x'')`, and `echo x | xargs codex exec -p
    litellm -m muse-spark-contributor`. Covered forms confirmed correct: `/usr/local/bin/codex ...` (basename
    match), `cd /tmp && codex ...` (segment split), and `timeout`/`env` wrappers all deny.'
  suggestion: 'In `_segment_invokes_contributor_tier`, treat model selection as a small flag table rather
    than two literals: match (a) `tok in ("-m", "--model")` with `tokens[i+1] == CONTRIBUTOR_TIER`, (b)
    `tok` split once on `=` where the head is `-m`/`--model` and the tail equals `CONTRIBUTOR_TIER`, and
    (c) `tok == "-m" + CONTRIBUTOR_TIER`. Keep every comparison exact string equality against `CONTRIBUTOR_TIER`
    so the `muse-spark` / `muse-spark-contributor` superstring boundary (FR5, TS-3/TS-4) is preserved
    in both directions, apply the identical edit to both plugin copies to keep them byte-identical modulo
    `PLUGIN_SLUG`, and add the new spellings to the TS-5 spelling-variation cases in tests/test_muse_guard.py.
    Widening FR5''s spelling enumeration in SPEC.md to "every spelling the codex CLI accepts for its model
    flag" would keep spec and code in agreement.


    MERGED SIBLING''s suggestion: add `xargs` to `_WRAPPER_WORDS`, and when the command word is a shell
    (`bash`/`sh`/`zsh`/`dash`), recursively classify the argument that follows `-c` by feeding it back
    through `is_contributor_invocation`. For `$( ... )` and backticks, extract the substitution bodies
    before segment splitting and classify each as its own statement. Bound the recursion (depth 2) so
    a pathological command cannot blow the NFR4 latency budget, and extend tests/test_muse_guard.py with
    both the new deny cases and matching no-misfire cases (e.g. `bash -c ''echo muse-spark-contributor''`).'
  sources:
  - claude:evaluator
  confidence: 90
  resolution: unresolved
  resolution_reason: 'batch mode: evaluator-originated finding (sources == [claude:evaluator]) is excluded
    from Phase R4 auto-fix by the candidate gate and skipped rather than applied as-is; routed to batch
    auto-rework round 1'
- stable_id: e0fb5715d50c4b74
  severity: medium
  category: security
  file: em-workflow/hooks/muse_guard.py
  line: 208
  title: Quote-unaware here-doc stripping can delete a real contributor invocation before classification
  description: '`_HEREDOC_RE` / `_strip_heredoc_bodies` (em-workflow/hooks/muse_guard.py:208-234, identical
    in the em-review copy) is applied to the raw command text with no awareness of shell quoting, so a
    `<<WORD` sequence appearing inside a quoted string is treated as a real here-doc header and everything
    from the next line up to a line reading `WORD` is removed before classification. Verified empirically
    against both copies with an empty store: the payload `echo "<<EOF` / `codex exec -p litellm -m muse-spark-contributor`
    / `EOF` returns no decision, even though a real shell executes `echo` (printing a literal string),
    then genuinely executes the codex line, then fails on `EOF`. The stripping direction only ever removes
    text, so it cannot cause a false deny — but it converts a covered spelling into an uncovered one for
    any command an agent can shape, and the guard''s own `additionalContext` explicitly anticipates an
    agent that looks for workarounds.'
  suggestion: 'Only honor a here-doc header when the `<<` occurs outside quotes — e.g. pre-scan the line
    with a small quote-state walk (or reuse the tokenization already performed per segment) and skip `<<WORD`
    occurrences that fall inside a single- or double-quoted region. A cheaper mitigation that keeps the
    current regex: after stripping, also classify the unstripped text and deny if either pass classifies
    as an invocation, accepting that a genuine here-doc body containing `codex ... -m muse-spark-contributor`
    on its own line would then deny (a fail-closed misfire that TS-6 currently forbids, so the quote-aware
    fix is preferable). Add the `echo "<<EOF"` case to tests/test_muse_guard.py alongside the existing
    TS-6 here-doc mention case.'
  sources:
  - claude:evaluator
  confidence: 60
  resolution: unresolved
  resolution_reason: 'medium severity: not an auto-fix candidate (Phase R4 gate requires critical/high);
    carried into batch auto-rework round 1 alongside the high finding on the same classifier'
