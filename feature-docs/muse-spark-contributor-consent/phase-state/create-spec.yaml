    resolution_note: 'gate: create-spec.em-review-hook-parity (orchestrator-opened, no worker packet); chosen both_plugins_ship_the_hook; not chosen: em_workflow_only; codex_consulted: true; fallback provider answered (litellm/vertex-glm-5.2); opus escalation: not run; key points: requirements-analyst proposed shipping muse_guard.py only in em-workflow because em-review has no hooks surface today, which contradicts the task description''s explicit acceptance criterion that the same change land in both plugins and its stated constraint that duplicating the hook is idempotent; em-review''s own review phase dispatches the same `codex exec -p litellm -m <model>` invocation, so a user who installs em-review without em-workflow would have no mechanical enforcement at all - an environment-dependent security gap; the hook is a silent no-op (exit 0, empty stdout) for every non-contributor command, so adding a hooks surface to em-review changes nothing observable in ordinary use; orchestrator adopted the mapping and amended FR1/FR8/NFR9/AC-6/TS-12 and assumption a6 accordingly'
