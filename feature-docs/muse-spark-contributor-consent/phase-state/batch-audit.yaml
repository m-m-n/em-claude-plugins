  resolution_note: 'gate: review.evaluator-confidence-string-mapping (orchestrator-opened, no worker packet, unlisted-gate fallback); chosen normalize_to_integer_90_60_30; not chosen: persist_the_string_verbatim; codex_consulted: true but the primary Codex CLI returned a usage-limit error and the litellm/vertex-glm-5.2 route returned HTTP 429; fallback provider answered (litellm/muse-spark, Standard tier); opus escalation: not run; key points: the round-record example shows an integer 0-100 and R3b step 7''s two corrections (+15 capped at 100, hard cap 50) are arithmetic, so the field is an integer; the mapping is gate-neutral because the R4 candidate gate reads severity/category/stable_id/suggestion/file/sources and the R5 completion gate reads only residual_critical_high, so neither reads confidence; applied as 90 for the merged high finding and 60 for the here-doc medium finding'
