- question_id: security.out-of-scope-enforcement
  packet_id: create-spec-q0001
  answered_at: '2026-09-08T21:54:03+09:00'
  source: batch-codex-consultation
  answer_mode: single_select
  selected_option_ids:
  - documented_only
  freeform: null
  normalized_answer: 「同意の範囲外」3 項目は reviewers.yaml / review-phase.md の dispatch 前判定基準として書き、muse_guard.py
    は同意の有無だけを見る
  resolution_note: 'gate: create-spec.requirement-clarification; relaxed route (category: security, batch
    relaxation per references/question-resolution.md); chosen documented_only; not chosen: record_facts_and_recheck,
    guard_denies_on_drift; codex_consulted: true; fallback provider answered (litellm/vertex-glm-5.2);
    opus escalation: not run; key points: guard_denies_on_drift would put a network fetch inside a PreToolUse(Bash)
    hook that fires on every Bash call under a 15s timeout, where a transient failure false-positives
    and halts an unattended run, breaking the deterministic no-network guard precedent; record_facts_and_recheck
    widens the store schema the task description pinned and adds fragile sole-contributor tracking, while
    the drift conditions reduce to a check of the CURRENT visibility and license at dispatch time because
    consent implies the consent-time state, and secrets-in-diff and third-party content are inherently
    per-diff judgements that cannot be captured at consent time; the orchestrator adopted the mapping
    and requires the written criteria to state the current-visibility / current-license check explicitly
    so condition (c) stays enforceable'
