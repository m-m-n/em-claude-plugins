- question_id: review.auto-fix-judgment
  packet_id: null
  answered_at: '2026-09-09T08:30:55+09:00'
  source: batch-codex-consultation
  answer_mode: single_select
  selected_option_ids:
  - skip_auto_fix_defer_residuals
  freeform: null
  normalized_answer: review round 2 の Phase R4 auto-fix を実行せず、high 6 件を deferred として記録し、run report で明示的にエスカレーションする
  resolution_note: 'gate: review.auto-fix-judgment (round 2, 6 high-severity prose findings, all targeting
    em-workflow/hooks/muse_guard.py); batch-mode.md''s stated default for this gate is ''Apply as-is (editor
    interprets)'', departed from under the invocation''s explicit instruction to consult Codex and adopt
    the comparatively better option; not chosen: apply_as_is_batch_default; codex_consulted: true (codex-harness
    second-opinion, codex source, success); fallback provider answered: no; opus escalation: not run;
    key points: (1) the review-editor may write exactly one file, while tests/test_muse_guard.py::test_copies_differ_in_exactly_one_line_the_plugin_slug
    pins em-review/hooks/muse_guard.py byte-identical to the em-workflow copy apart from PLUGIN_SLUG,
    so applying the default breaks that invariant deterministically and leaves two divergent copies of
    an authorization guard; (2) five sequential editors interpreting six prose findings are unlikely to
    converge on one coherent restructuring of the scan-and-split pipeline, and the review rework budget
    (cap 1) is already spent, so a bad auto-fix could not be repaired in this phase; (3) preserving a
    known reviewable baseline and handing the human evaluator complete evidence beats presenting an unreviewed
    parity-broken partial fix as progress; (4) Codex''s caveat, adopted: deferral is only defensible as
    an explicit escalation, so the six residuals are surfaced prominently in the run report rather than
    silently completed; (5) Codex''s preferred third path, recorded for the human: one coherent manually-reviewed
    patch applied to both copies together outside the auto-fix dispatcher, before the independent verify-phase
    budget is spent'
