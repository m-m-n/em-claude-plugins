  title: env 経路のペイロードの字句解析が上限や閉じない添字で止まると、末尾規則を含む検査がすべて外れて許可になる
  description: _args_json_payload_chunk() は LexBudgetExceeded を捕まえて None を返し、_args_json_env_body_reading() は空の読み取り（Overrun も Unrestorable も False）を返す。このペイロードは他の検査に回らないので、無人実行でも allow になる。spec#0 の指摘（マップを取った後に派生チャンクの scan_structure() が例外を出すと FR1 の判定が失われる）も同じ箇所の同じ原因。LexUnmatchedSubscript は LexBudgetExceeded の派生クラスで、クラスの docstring は「allow にしない」と定めているが、ここで握りつぶされる。この例外は代入位置の NAME[ の ] が来ない行で送出されるので、例外を模擬しなくても起こせる見込みが高い。フックの最終判定は実行して確かめていない。
  suggestion: env 経路では LexBudgetExceeded（LexUnmatchedSubscript を含む）を握りつぶさずに上位へ伝え、既存の scan-budget / unmatched-subscript の ask（batch では deny）にする。少なくとも、ペイロードのマップを取れた後の失敗では、末尾規則の結果を残す。閉じない添字の行を最後に置いた env 経路のケースを足す。FR1 の範囲を超えるので、SPEC への追記が要る。
  reproduction: 既存の `BODY_WORD_IN_HEREDOC_BODY` を `env_command()` で包み、無人実行の Bash イベントとして `run()` に渡した。通常の判定は `deny` だった。同じ入力で、本文に対する `lex_shell()` だけが `LexBudgetExceeded` を返すよう例外を模擬すると、判定は `allow` に変わった
