  title: 読めない末尾でロケール引用 $" を使って mcp-bridge の語を割ると、末尾規則をすり抜ける
  description: _args_json_env_tail_unrestorable() は、(a) 行継続を除き ' " \ を除いた末尾が mcp-bridge を含むか、(b) 末尾が $' を含むかだけを見る。mcp-$"bridge" のようにロケール引用で語を割ると、" を除いた結果は mcp-$bridge になって (a) に当たらず、$" は (b) の対象外なので、規則は False を返す。bash は翻訳の無い $"bridge" を bridge にするので、TS-1 と同じ攻撃が通り、無人実行でも allow になる。SPEC FR1 の列挙が $' だけを挙げて $" を漏らしており、実装は SPEC の文言どおり。読んで確かめたが、フックは実行していない。
  suggestion: SPEC FR1 (b) を「TAIL が $' または $" を含む」に改め、規則に $" の判定を足す。$" で語を割った TS-4 相当のケース（batch で rule args-json-unrestorable の deny）を足す。TS-5 の本文は $" を含まないので allow のまま。
  reproduction: HEREDOC + 'mcp-$"bridge"' + CALL をペイロードとする。lex_shell(payload, "shell") の unreadable は立ち、tail_start は <<${tag} 以前。末尾に $' は無い。行継続を除いてから ' " \ を除くと末尾の語は mcp-$bridge なので、_args_json_env_tail_unrestorable() は False を返す。
