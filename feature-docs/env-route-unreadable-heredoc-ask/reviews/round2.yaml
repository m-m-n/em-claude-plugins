  title: env 経路のペイロードの字句解析が上限や閉じない添字で止まると、末尾規則を含む検査がすべて外れて許可になる
  description: lex_shell(payload, "shell") が LexBudgetExceeded（派生の LexUnmatchedSubscript を含む）を出すと、_args_json_env_body_reading() は空の読み取りを返す。このペイロードは他の検査に回らないので、無人実行でも allow になる。報告の手順は読んで確かめ、成り立つ。ただし high から medium に下げた。理由は 3 つ。(1) 変更前のコードも chunk が None のとき同じ空の読み取りを返しており、今回の差分が持ち込んだ挙動ではない。(2) round 1 の指摘のうち、この機能の範囲に入る部分（マップを取れた後の失敗で判定が失われる）は直っている。マップを取った直後に末尾規則を評価し、chunk が None でも答えを残す（TestKeptAnswer）。読めない末尾の中の閉じない添字は tail_gate が開かないので、マップが取れて TS-21 のとおり deny になる。(3) 残りは gate rework.spec-change の payload-lex-failure で keep_spec と決まり、IMPLEMENTATION.md D5 と THREAT-MODEL.md が範囲外・別タスクと明記している。フック全体の弱点としては残る。走査量の上限を超えさせる文字列を本文に足せば、この機能の攻撃シナリオも空の読み取りになる見込みがあるが、そのような文字列の実例は確かめていない。
  suggestion: この機能の中では直さない。例外を上位へ伝える修正は round 1 で試され、既存の tests/test_destructive_guard_env_route.py の 10 subtests を壊して戻されている。別タスクが起票済みかを確かめ、未起票なら起票する。別タスクでは、LexBudgetExceeded を scan-budget / unmatched-subscript の ask にする範囲を、無害な本文で無人実行を止めない条件と合わせて決める。
  reproduction: 本文 `x[0=1` を `lex_shell` に渡すと `LexUnmatchedSubscript` が発生し、同じ本文を `_args_json_env_body_reading` に渡すと `_EnvBodyReading(entries=(), overrun=False, unrestorable=False)` が返った。追加された `TestPayloadMapUnavailable` でも、保護対象の呼び出しを含む `BODY_PLAIN` の解析で同じ例外を発生させると、env 経路の最終結果が `_ARGS_JSON_NOTHING` になる。
