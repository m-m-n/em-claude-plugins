    normalized_answer: FR1 (b) は、TAIL から行継続（バックスラッシュと改行の組）をすべて除いた文字列が $' または $" を含むとき、とする。TS-4 に、$ と引用符の間に行継続を挟む 2 つの形（mcp-$\<改行>"bridge"、$\<改行>'\x6dcp-bridge'）を足す
    resolution_note: 'gate: create-spec.requirement-clarification (raised by the orchestrator from an analyst warning); policy codex_consultation; chosen: joined_only; not chosen: raw_only, raw_or_joined; Codex consulted: true (codex entry, 1 turn, converged); Opus escalation ran: false; key points: raw_only は $ と引用符の間に行継続を挟む 2 形を見逃す。行継続を除いても隣接した $'' と $" は残るので joined_only と raw_or_joined の検出結果は同じで、joined_only のほうが簡単。Orchestrator probe: both forms give allow in batch and bash resolves them to mcp-bridge.'
