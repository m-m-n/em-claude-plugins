base_branch: main
goal: '# destructive-guard: env 経路で区切り語を読めないヒアドキュメントの後ろに置いた notion ペアが検出されなくなる


  種別: セキュリティ（severity: medium）


  ## 脆弱性の概要

  destructive-guard の env 経路で、区切り語を読めないヒアドキュメントの後ろに置いた mcp-bridge の notion ペアが検査されない。env-route-lex-flag-isolation
  で大域フラグ `_lex_unreadable_met` を退避・復元するようにした結果、その本文に対する `args-json-unrestorable` の
  ask も残らない。


  ## 攻撃シナリオ

  `/usr/bin/env bash -c ''...''` の本文で、先に区切り語を読めないヒアドキュメント（例: 区切り語が `${tag}`）を置き、その後ろに
  notion ペアの形をとった `mcp-bridge run --args-json` を置く。env 経路の読み取りはヒアドキュメント以降を読めず、notion
  ペアの command を検査しない。フラグは復元されるので、全体の ask にも上がらない。


  ## 影響範囲

  destructive-guard が拒否・確認すべき `--args-json` 内のコマンドが、env 経路を経由して検査を抜け得る。


  ## 完了の定義

  - 攻撃シナリオが成立しない

  - 修正版に追随している（修正版が無い場合は暫定緩和策の欄に対応を記載）


  ## 該当箇所

  `em-workflow/hooks/destructive-guard.py` の `_args_json_payload_chunk()` の env 経路（フラグの退避・復元の
  `finally`）。env-route-lex-flag-isolation（PR #135）のレビュー round 1、stable_id c7173bc1fe3d8438（deferred）。


  修正案: env 経路の読み取りが `LexMap.unreadable` に当たり、その後ろの生テキストに mcp-bridge の語があるときは、その読み取りに
  `unrestorable` を立てて `args-json-unrestorable` の ask を残す。再発検出のケースを足す。

  '
