schema_version: 1
feature: threat-model-stride
created: '2026-09-27'
base_branch: main
goal: |
  # em-workflow に設計段階の脅威モデリング（STRIDE）を組み込む

  Notion: https://www.notion.so/3d43509ec8ee8130a4f4d9bedd9566da
  種別: 機能
  指示メモ: SDL の設計段階を create-plan の implementation-planner に載せる。全機能対象で実行し、出力量を脅威の実在に比例させる。プラグイン変更なので version bump を忘れずに

  ## やりたいこと（必須）
  em-workflow の create-plan フェーズに設計段階の脅威モデリング（STRIDE）を組み込む。`THREAT-MODEL.md` を出力し、緩和策を実装タスクの受け入れ条件と `VERIFICATION.md` に落とし、review-security がその文書を入力に取って緩和策の未実装を検出できるようにする。

  ## 背景・なぜ（必須）
  SDL（セキュリティ開発ライフサイクル）の各段階のうち、em-workflow が現状持っているのは実装後の検証（review-security による diff レビュー）とシークレット検出（gitleaks の pre-commit hook）だけ。SDL の核心は「設計で潰す」ことにあり、diff レビューでは信頼境界の引き方そのものの誤りが見えない。
  軽い機能だと思っていたらセキュリティ観点で問題があった、というケースを拾うため、全機能を対象に先に一度目を通す方針とする。

  ## 受け入れ条件 / 完了の定義（必須）
  - [ ] implementation-planner が SPEC / REQUIREMENTS / DESIGN を読んだ後、信頼境界の洗い出しを**全機能で必ず**実行する（domains 等の条件で間引かない）
  - [ ] `THREAT-MODEL.md` を独立文書として出力する。信頼境界ごとに、該当する STRIDE カテゴリの脅威と緩和策だけを書く（6 カテゴリの機械的な穴埋めはしない）
  - [ ] 信頼境界が無い変更では「信頼境界なし + 根拠」の数行で終わる。「見た結果、無かった」という記録が残ること自体を成果とする
  - [ ] domains（`auth` / `input-handling` / `external-io` / `data-persistence`）は実行可否の判断からは外し、掘る深さの調整材料として使う
  - [ ] 緩和策がタスクの受け入れ条件と `VERIFICATION.md` の両方に落ちる（文書を書いただけで終わらせない）
  - [ ] planner の `write_policy` と `digest_inputs` に `THREAT-MODEL.md` を追加する
  - [ ] review-security に `threat_model_path` を渡し、「設計で決めた緩和策が実装されていない」を検出対象に追加する
  - [ ] `SPEC.md` の Security Considerations と重複させない。SPEC 側は「何を守るか」（要件・入力）、`THREAT-MODEL.md` は「どう壊されるか・どう防ぐか」（設計に対する分析・出力）
  - [ ] `em-workflow/.claude-plugin/plugin.json` と `.claude-plugin/marketplace.json` の version を同じ値で上げる

  ## スコープ外（任意）
  - 依存の既知脆弱性チェック（SCA）。review-license が持つ「diff が依存マニフェストに触れたら裁量層で追加」のトリガーに相乗りできるが、別タスクとする
  - セキュアコーディング知識の実装側注入（security-impl 相当）。`impl-skills.yaml` がレイヤー軸のみと明記しているため軸の設計判断が要る。別タスクとする
  - 独立した threat-model ステップの新設。develop のステートマシン・phase-state・batch-mode・`--once` のフェーズ境界まで波及するため採らない

  ## 制約・前提（任意）
  - 脅威モデリングは create-plan の implementation-planner に持たせる。フェーズは増やさない
  - 全機能対象で実行し、出力量を脅威の実在に比例させることでコストを抑える
  - 変更対象の想定: `em-workflow/agents/implementation-planner.md`、`em-workflow/references/contracts/planner-contract.md`、`em-workflow/references/phases/create-plan-phase.md`、`em-workflow/skills/plan-writing/`、`em-workflow/skills/review-security/SKILL.md`、`em-workflow/references/review-phase.md`、`THREAT-MODEL.md` のテンプレート追加

  ## 追加指示（起動引数）
  - 実装完了後、integration ブランチを remote へ push し、base_branch への PR を gh pr create で作成する。integration ブランチはローカル・リモートとも残す（base_branch へ自動マージしない）
  - 不明点は Codex に相談し、相対的に良いと判断した案を採用する
  - その議論内容を Notion に記録する
