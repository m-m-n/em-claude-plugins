    title: "再計画のとき、minimal tier の TASK.md に古い TM-n 行が残り、二重にも追記される"
    description: "minimal tier の TASK.md は extend_only（exact-prefix rule）で追記しかできない一方、THREAT-MODEL.md は再計画で replace_own により作り直せる。初回に TM-1 を Expected Result へ追記した後に再計画し、判定が no-trust-boundary / no-applicable-threat に変わるか TM の番号・内容が変わると、古い TM-n 行が残る。再び threats-identified になると同じ TM-n が二重に追記され得る。追記済み TM-n 行の再計画時の扱いは planner-contract.md / implementation-planner.md / create-plan-phase.md のいずれにも定義が無い。"
    suggestion: "planner が追記した TM-n 行を利用者記述と区別できる形（目印付き区画など）にし、再計画ではその区画だけを置換・削除できる規則を planner-contract.md に定める。代替として、追記済み行があれば blocked を返す規則でもよい。create-plan-phase.md の minimal tier 差分検査も合わせ、『追記あり → 再計画で脅威なし』『追記あり → 再計画で TM 変更』の遷移テストを加える。"
    sources: ["codex:architecture", "codex:comprehensive"]
