schema_version: 1
feature: verify-rerun-legacy-deferred-resolution
created: '2026-11-21'
base_branch: main
goal: '# 完了済み feature で verify をやり直したとき deferred の指摘を解決済みにできるようにする


  ## やりたいこと


  完了済み feature で verify をやり直したとき、review で deferred になった high の指摘を、verify の合格に基づいて解決済みにできるようにする。


  ## 背景・なぜ


  web-sip-phone の feature `inbound-reject-e2e-registration-wait` は、全 step が completed
  のまま main に未マージで止まっている。


  - review round 2 で、high の指摘 `f171409f76fe2785`（AC5 未達。category は spec）が rework 上限に達して
  deferred になった

  - その後、先行タスクの修正を取り込んだ verify round 2 で、AC5 を含めて合格した

  - merge の事前判定 `scripts/merge-preflight.py:349` の `check_review_findings` は、最新 review
  round の critical/high で resolution が fixed/declined でないものがあると `unresolved_findings`
  で止める。この判定は、base の取り込みと検証コマンド（merge スキルの手順 8〜10）より前にある

  - `scripts/resolve-verified-findings.py`（f1fad8224）は、develop の verify 中にしか呼ばれない。さらに、verify
  step の `round` が 1 以上で `passed_ids` があることを前提にしている。この feature の workflow.yaml の verify
  step には、どちらも無い

  - 完了済み feature の救済は、`feature-docs/verify-pass-resolves-deferred-findings/REQUIREMENTS.md`
  で no-backfill として対象外になっている

  - develop SKILL.md の対応づけの規則（未達そのもの以外の内容を含む指摘は対応づけない）は、原因の分析や範囲の判断が書き添えてある指摘を対応づけから外す可能性がある


  ## 受け入れ条件 / 完了の定義


  - [ ] verify を pending に戻して develop を再開すると、verify step に `round` / `passed_ids`
  が無い旧形式の workflow.yaml でも、`resolve-verified-findings.py` が実行される

  - [ ] 指摘の主張がその基準 ID の未達であれば、原因の分析や修正案が書き添えてあっても対応づけの対象になる。この規則が SKILL.md に明記されている

  - [ ] 上記の feature と同じ形の review round 記録と workflow.yaml で verify をやり直すと、指摘が fixed
  になり、`merge-preflight.py` が proceed を返す。これがテストで固定されている


  ## スコープ外


  - `merge-preflight.py` の判定条件の変更

  - verify をやり直す起点（loop-develop の要確認の見直し側で扱う）


  ## 制約・前提


  \<触ってほしくない箇所 / 使う技術 / 互換性など。あれば>

  '
