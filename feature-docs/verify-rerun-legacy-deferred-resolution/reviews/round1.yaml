  title: 隔離テストが失敗すると、ユーザーの Git 設定の生データがログに出る
  description: real_repository_state()（455〜463 行）は ~/.gitconfig と XDG の git/config の生のバイト列を辞書に入れ、495 行の assertEqual に渡している。作業ツリーの状態だけが変わって失敗した場合も、unittest の辞書比較は変わっていない設定値まで出力する。差分が maxDiff（既定 640 文字）以内なら全文が出て、超える場合も短縮表示に設定の先頭が入ることがある。設定に認証情報（URL に埋め込んだトークンや http.extraHeader）があれば、それがテストログに出る。
  suggestion: 設定ファイルは hashlib のダイジェストで比べ、一致しないときはパスだけを出す。作業ツリーの状態は別のアサーションで比べる。
  reproduction: 実ファイルを使わず、460 行目で読み取る Git 設定を示す user_configs に、ダミーのヘッダー値 REVIEW_MARKER を含む同一のバイト列を入れた辞書を2つ用意する。片方の status だけを空から未追跡ファイル report.txt を示す値に変え、495 行目と同じ unittest.TestCase().assertEqual で比較すると、失敗メッセージにダミーのヘッダー値が表示されることを確認した
