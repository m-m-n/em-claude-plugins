  title: ビルドと整形が両方とも cd 前置形の対象外のとき、tests の値をどちらの規則で決めるかが書かれていない
  description: 'build の文（implementer.md:112-115、SKILL.md:139-142）は「the report sets `tests: "fail"`」と書いている。format の文（implementer.md:115-120、SKILL.md:143-148）は「the report''s `tests` follows the result of the test command」と無条件に書いている。build と format の両方の承認文字列が cd 前置形の対象外で、実行できる test コマンドが成功すると、文どおりに読めば build の規則は fail、format の規則は pass を求める。両方を満たす値は無い。"on its own" から「他の規則による fail が優先する」と推測はできるが、明記はされていない。SPEC の Edge Cases と A5 が扱っている組み合わせは test コマンドとのものだけで、build と format の組み合わせには触れていない。同じ書き方が SKILL.md の Command execution gate 節（145 行目付近）にもある。'
  suggestion: 'implementer.md の Step 3 と SKILL.md の gate 節の両方に、format コマンドを実行しなかったことは、他の規則（build が対象外のとき、hook が deny したとき）が決める `tests: "fail"` を覆さない、と書き足す。format の照合器（find_format_sentences）は、同じ文に `the report sets `tests: "fail"`` があるとその文を退ける。このため、format の文とは別の文にするか、別の言い回しにする。NFR2 / NFR3 の文言制約（例: 同じ文に `separate` と `cd` を書かない、`#` を書かない）を守り、build と format が同時に対象外になる場合を確かめる文書試験と、偽の文のケースを組で足す。'
