    normalized_answer: '承認済みの build コマンドが cd 前置形の対象外で実行されなかったときは tests: "fail" にする。format コマンドが対象外で実行されなかったときは、tests
      を test コマンドの結果どおりにする（format の不実行だけでは "fail" にしない）。どちらの場合も、実行しなかったコマンドと、cd 前置形がそのコマンドを対象にしないので実行しなかったことを
      notes に書く。status（merged / failed）の扱いと Step 7 のフィールド構成は変えない。'
    resolution_note: 'gate: create-spec.requirement-clarification; policy: codex_consultation, record_as_assumption;
      codex_consulted: true (2 turns)。analyst は fail_for_both を推奨。Codex は turn 1・turn 2 とも fail_for_build_only
      を推奨: Step 4b は build の成功を先へ進む条件にしているが format の成功を条件にする記述はどちらの手順書にも無く、fail_for_both は新しい合格条件を足すことになる。turn
      1 の補足（build 不実行時に status failed も報告）は turn 2 で A2 の範囲外として撤回。オーケストレーターは既存の規則に根拠がある fail_for_build_only
      を比較的よいと判断して採用'
