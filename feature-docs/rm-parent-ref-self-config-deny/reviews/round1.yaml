  confidence: 80
  resolution: deferred
  resolution_reason: medium, pre-existing behavior (not a regression); fixing needs a design decision on the decision-selection order (hook-tests.md precedence, THREAT-MODEL TM-1/TM-2). Filed as a separate task.
