  title: $HOME 形式の `..` で保護領域の外に出る再帰削除は、まだ self-modification の ask に飲まれる
  description: rm_protected_operand_numbers() は `$HOME/.claude/skills/../../valuable` を畳んで `$HOME/valuable` とし、正しく保護対象から外している。ところが check_rm() は `$HOME` を UNRESOLVED_EXPANSION として扱うので、プールに入るのは ask / rm-unresolvable で、deny は入らない。main() の選択順では保持済みの ask が rm の ask より先なので、check_self_modification() が生の形の一致で出す self-modification の ask がそのまま出る。CLAUDE_BATCH では deny に降格されるが、理由 ID は self-modification のまま残る。判定そのものは変更前と同じなので回帰ではない。`~` の形と絶対パスの形は意図どおり deny / rm-recursive になる。
  suggestion: '`$HOME` を展開して rm-recursive にする修正は既存の固定ケースと `$HOME` を未解決として扱う設計に衝突する。選択順（rm のオペランド自身が self-modification の ask を引き起こしたのに保護対象ではない場合、そのオペランドの rm-unresolvable の ask を先に理由として出す等）の設計判断として後続 feature で扱う。`$HOME` の形の通常経路・置換が文頭の経路・バッチのケースを足して判定を固定する。'
  reproduction: HOME=/home/user、CLAUDE_BATCH 未設定で rm -rf "$HOME/.claude/skills/../../valuable" をフックに渡すと ask / self-modification。$HOME を ~ に置き換えると deny / rm-recursive。CLAUDE_BATCH=1 では deny だが理由 ID は self-modification。
  reproduction_alternates: []
  reproduction_overflow: false
