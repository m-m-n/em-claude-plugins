  description: normalize_candidate() は HOME_VAR.sub(home, expanded, count=1) を使っており、HOME を正規表現の置換文字列として解釈する。`\q` を含む HOME では re.error になり、フックは判定を出さずに終わる。不具合自体は以前からあるが、今回の差分で rm_protected_operand_numbers() が normalize_candidate() を必ず先に呼ぶようになり、置換が文頭で保護ファイルへのリダイレクトを伴う rm の `$HOME/.claude/...` オペランドの経路でも落ちるようになった。HOME にバックスラッシュを含む環境はまれ。
