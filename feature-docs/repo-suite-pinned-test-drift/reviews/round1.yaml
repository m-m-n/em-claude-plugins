  title: version 形式検査が末尾改行と非 ASCII 数字を受理する
  description: VERSION_FORM_RE = re.compile(r"^\d+\.\d+\.\d+$") を re.match で使っている。Python の str 正規表現では \d が全角などの Unicode 数字にも一致し、$ は末尾改行の直前にも一致する。int() も両方を受理する。評価側で再現し、'0.2.10\n' と '０.２.１０' がどちらも形式検査を通り (0, 2, 10) として扱われることを確認した。docstring と IMPLEMENTATION.md の Version form rule は「ASCII 10 進数字だけ、前後の空白なし」と定めているので、FR6 の matcher は AC3 / NFR3 の「形式不正を拒否する」を満たしきれていない。同じ正規表現 ^(\d+)\.(\d+)\.(\d+)$ は tests/test_codex_wrapper_fallback_removal_version_bump.py:43（FR8）、tests/test_batch_structured_result_output_version_bump.py:103（FR9）、tests/test_stop_reason_coverage_version_bump.py:47（FR7）にもある。追加された否定証明はどれも 'v0.2.4'・'0.2.4-rc1'・'' などしか使っておらず、この抜けを検出できない。実際のマニフェストがこの形になる可能性は低く、影響はテストの厳密さに限られる
  suggestion: 4 モジュールとも、isinstance(value, str) を確認したうえで re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", value)（またはフラグ re.ASCII と \Z）に置き換える。batch-structured-result の VERSION_RE.match(version or "") は、非文字列の値で AssertionError ではなく TypeError を出すので、isinstance による判定も加える。各モジュールの形式不正ケース一覧に '0.2.10\n'、' 0.2.10'、'０.２.１０' を足し、両レジストリが同じ不正値でも拒否されることを示す
