schema_version: 1
feature: build-format-both-excluded-tests
created: '2026-10-30'
base_branch: main
goal: |
  # ビルドと整形が両方とも cd 前置形の対象外のとき、implementer 報告の tests の値をどちらの規則で決めるかが書かれていない

  ## やりたいこと
  承認済みの build と format の両方が cd 前置形の対象外になったとき、implementer の報告の `tests` をどの規則で決めるかを手順書に書く。

  ## 背景
  feature cd-prefix-excluded-build-format-tests の review round 1 で medium の指摘として残った。`em-workflow/agents/implementer.md` の Step 3 と `em-workflow/skills/worktree-task-workflow/SKILL.md` の Command execution gate 節で、build の文は `tests: "fail"` を求め、format の文は test コマンドの結果に従うと無条件に書いている。build と format が両方とも対象外で test が成功すると、両方を満たす値が無い。

  ## 受け入れ条件
  - format を実行しなかったことが、他の規則が決める `tests: "fail"` を覆さないと両文書に書かれている
  - build と format が同時に対象外になる場合を確かめる文書試験と、偽の文のケースがある

  ## 制約・前提
  feature cd-prefix-excluded-build-format-tests のマージ後に着手する。format の照合器（`find_format_sentences`）は同じ文に `the report sets tests: "fail"` があると退けるため、別の文として書く。
