  - stable_id: 91c38ea9a5c98a26
    severity: critical
    category: comprehensive
    file: em-workflow/hooks/heredoc-stdin-guard.py
    line: 287
    title: >-
      Hook emits hookSpecificOutput without hookEventName, so Claude Code
      rejects the output and updatedInput is never applied — the guard is a
      silent no-op
    description: >-
      _emit_rewrite writes {"hookSpecificOutput": {"updatedInput": updated}}
      with no hookEventName member. Claude Code requires hookEventName inside
      hookSpecificOutput. 評価者は導入済みランタイム
      (/home/sakura/.local/share/claude/versions/2.1.269) を直接検査し、(1)
      フック出力バリデータが
      'hookSpecificOutput is missing required field "hookEventName"' という
      リテラルを持ち、述語 fwe(r) && !("hookEventName" in r) で到達すること、
      (2) PreToolUse のスキーマヘルプで hookEventName だけが (optional) 印を
      持たず、permissionDecision / permissionDecisionReason / updatedInput は
      いずれも (optional) であること、(3) 埋め込みドキュメントが
      'hookSpecificOutput - Event-specific output (must include
      hookEventName)' と述べること、(4) 併走するサニタイザが
      hookEventName !== "PreToolUse" のとき hookSpecificOutput 全体を捨てる
      ことを確認した。オーケストレーターは同じ論点を実機 Claude Code 2.1.269
      で独立に実測した: 使い捨ての PreToolUse:Bash フックを立て、同一の
      updatedInput を (A) hookEventName 無し、(B) hookEventName 有り・
      permissionDecision 無しの 2 形で返し、実際に実行されたコマンドを
      フラグファイルで判定した。A では書き換えが適用されず元コマンドが実行
      され、B では書き換え後のコマンドが実行された。したがって現行の出力形は
      無効であり、exec < /dev/null は一度も前置されない。このプラグイン内の
      既存フック 6 本 (bash_guard.py:157 / destructive-guard.py:230 /
      kill-guard.py:298 / muse_guard.py:606 /
      failed-run-cleanup-guard.py:153 / queue_launch_guard.py:165) は
      すべて hookEventName を出しており、本フックだけが例外。
    suggestion: >-
      {"hookSpecificOutput": {"hookEventName": "PreToolUse", "updatedInput":
      updated}} を出す。permissionDecision は足さない（"allow" を返すと
      heredoc を含む全コマンドが自動承認され、先行する 5 本のガードの判定を
      上書きするため）。修正後は SPEC の AC1/AC2 を単体テストではなく実セッション
      で end-to-end に再実行する。あわせて 1 つの下流影響を確認する: updatedInput
      が実際に適用されるようになると、パーミッション層と auto mode の分類器が
      見る文字列が "exec < /dev/null" で始まる書き換え後のコマンドになるため、
      heredoc コマンドに一致していた settings.json の prefix allow ルールが
      一致しなくなる。--batch でこれが ask に倒れると同種の無人停止を再導入する。
    sources: [claude:evaluator]
    confidence: 90
