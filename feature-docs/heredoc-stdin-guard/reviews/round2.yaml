  title: コメント中のアポストロフィーで解析が引用状態に入り、ガードが無効化される
  description: '_analyze は `#` 以降のコメントを読み飛ばさないため、コメント内の `''` が in_squote を立てる。評価者が実機で再現: `# don''t wait
    for input` に続けて `cat <<''EOF''` / `hello` / `EOF` / `cat` を与えると、`don''t` の `''` で引用状態に入り、続く `<<''EOF''`
    の `''` が閉じ、最後の `''` が開いたまま終端して _Undecidable となり、出力は空（書き換えなし）。有効な bash スクリプトであり、末尾の `cat` は stdin を待ち続ける
    — このフックが防ぐはずの状態がそのまま残る。説明コメントを 1 行足しただけで保護が外れるため、発火条件が広い。comprehensive#0 の報告を評価者が独立に再現済み。'
  suggestion: トークン先頭位置の `#` からその行末までをコメントとして読み飛ばし、その範囲では引用符・リダイレクトを解析しない。コメント付き heredoc が書き換えられることを回帰テストに追加する。
  sources:
