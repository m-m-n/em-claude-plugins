    _Undecidable になるため。どちらも有効な bash で、後続の `cat` は stdin を待ち続ける。comprehensive#0 の報告を評価者が独立に再現済み。'
  suggestion: 未引用の終端語の読み取りを `;` `|` `&` `<` `>` `(` `)` などのメタ文字でも停止させ、区切り文字自体は外側の走査に戻して処理する。隣接区切りのケースを回帰テストに追加する。
