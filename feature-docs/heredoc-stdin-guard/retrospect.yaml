lessons_candidates:
  - >-
    review round 1 の critical / high 3 件はいずれも同一の根本原因
    （hookSpecificOutput に hookEventName を欠く出力形）から派生していた。
    仕様・実装・契約テストの 3 層が同じ誤った形を相互に固定していたため、
    テストが緑でも機能が無効という状態が成立した。実機の受理側を模したテスト
    fixture が無い限り、契約テストは「自分の間違いを再確認する」形になり得る。
  - >-
    TS-8 / TS-16 は VERIFICATION.md 自身が「マージ後にプラグインキャッシュが
    更新され Claude Code を再起動していること」を前提に書かれており、未マージの
    ブランチでは構造上実行できない。verify フェーズで実行不能な検証シナリオを
    計画段階で許容すると、verify の判定が毎回グレーになる。マージ後にしか
    確認できない項目は、シナリオ表とは別の「マージ後チェック」区画に分ける
    余地がある。
  - >-
    VERIFICATION.md TS-12 の許可範囲の列挙に、エンジン管理情報である
    feature-docs/ と test-docs/ が入っていない。文言どおり適用すると TS-12 を
    含む VERIFICATION.md 自身の存在が範囲違反になる。文書修正の follow-up。
  - >-
    implement-phase.md I.2.b step 4 が指示するタスクブランチの強制削除が、
    同じリポジトリが同梱する destructive-guard（git-branch-force-delete）と
    正面衝突した。マージ済み検証を済ませた通常削除で代替できたが、プロトコルと
    同梱ガードの整合を取る余地がある。
  - >-
    destructive-guard が heredoc 本文の文字列リテラルを実行コマンドとして
    誤認し、監査記録の書き込みを拒否した。.claude/rules/hook-tests.md が
    allow 側ケースとして挙げている誤爆の類型そのものなので、ケース追加の候補。
  - >-
    batch 実行で Codex 相談が 600 秒タイムアウトした事例が 2 件あった。いずれも
    プロンプトが探索範囲を制限しておらず、モデルが無制限のファイルシステム調査に
    入ったことが原因。確定済みの事実を添えて調査を禁止した bounded プロンプトに
    切り替えると 1 回で回答に到達した。batch の相談プロンプトは既定で bounded に
    する余地がある。
  - >-
    workflow.yaml に top-level の `batch:` ブロックが 2 つ存在していた。
    yaml.safe_load は後勝ちで読むためエラーにならず、review_rework_count: 1 が
    黙って 0 に見えていた。retrospect 開始時に重複を解消した。ドキュメント
    コミット時の重複キー検査があると同種の事故を防げる。
