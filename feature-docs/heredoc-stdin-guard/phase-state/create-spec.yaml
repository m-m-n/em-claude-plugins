  testing.harness-placement:
    packet_id: create-spec-q0001
    answered_at: "2026-09-12T23:16:00+09:00"
    source: batch-codex-consultation
    answer_mode: select_or_freeform
    selected_option_ids: [repo_root_unittest]
    freeform: null
    normalized_answer: >-
      リポジトリルート tests/test_heredoc_stdin_guard.py に unittest として置く。
      フックを subprocess で起動し stdin に PreToolUse JSON を渡して、
      stdout の updatedInput と exit code を検証する契約テスト形式。
      検出条件のテストと「書き換え後も heredoc 本文が壊れない」実行テストの
      両方を同一ファイルに置く。
    resolution_note: >-
      gate: create-spec.requirement-clarification (action: codex_consultation);
      codex_consulted: true; fallback provider answered (entry 2,
      litellm/vertex-glm-5.2); Opus escalation: 実行せず（1 回の相談で全問が
      option_id に写像したため）。選ばれなかった選択肢: hook_cases_harness / both。
      Codex の論拠: (1) .claude/rules/hook-tests.md のケーステーブル式ハーネスは
      destructive-guard.py 専用と明記されており、その [verdict, label, command]
      形式は allow/deny/ask 判定専用で、updatedInput によるコマンド書き換えとは
      出力形状が合わない。(2) muse_guard / failed-run-cleanup-guard /
      queue_launch_guard など他の全フックは tests/test_*.py でテストされており、
      test/README.md が subprocess + JSON stdin の契約テストを標準と定めている。
      (3) 検出条件テストも heredoc 非破壊の実行テストも 1 ファイルで賄えるため、
      both は保守コストを増やすだけ。
  technical.updated-input-effectiveness:
    packet_id: create-spec-q0001
    answered_at: "2026-09-12T23:16:00+09:00"
    source: batch-codex-consultation
    answer_mode: select_or_freeform
    selected_option_ids: [e2e_required]
    freeform: null
    normalized_answer: >-
      既存フックが有効なまま実環境の Bash 呼び出しで再現手順を走らせ、
      codex exec が stdin 待ちにならず完了することを受入基準に含める。
      updatedInput が適用されない場合は、フックの出力形
      （permissionDecision の併記有無）や matcher 配列内の位置を実装フェーズで
      調整する。
    resolution_note: >-
      gate: create-spec.requirement-clarification (action: codex_consultation);
      codex_consulted: true; fallback provider answered (entry 2,
      litellm/vertex-glm-5.2); Opus escalation: 実行せず。
      選ばれなかった選択肢: unit_only。
      Codex の論拠: (1) このリポジトリに updatedInput を返す既存フックは 1 つも
      無く（`rg 'updatedInput' em-workflow/hooks/` が空）、同じ matcher 配列の
      destructive-guard.py は非破壊コマンドへ毎回 allow を返すため、7 本目の
      updatedInput が実際に適用されるかの前例が無い。(2) unit_only では
      「正しい JSON を stdout に出す」だけで緑になり、適用されなければハングは
      解消しないので false-green が最も致命的な失敗モードになる。
      (3) 実装フェーズで 1 回 codex exec の完走を確認するだけなら保守コストは
      低く、未知のリスクを機械的に排除できる。
