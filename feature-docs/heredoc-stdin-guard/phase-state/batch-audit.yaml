  - question_id: create-plan.replan-task-split
    packet_id: null
    answered_at: "2026-09-13T00:58:00+09:00"
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids: [single_task]
    freeform: null
    normalized_answer: >-
      案 A（単一タスクに畳み込む）を採用。TS8 相当の end-to-end 検証は
      VERIFICATION.md の手動シナリオに留める。スキーマ準拠テストは実機バイナリ
      非依存の固定 fixture として書く。
    resolution_note: >-
      gate: create-plan re-plan decomposition（gate_id 無しの裁量ゲート。
      batch-mode.md の unlisted-gate fallback に従い Codex 相談を先に行った）。
      codex_consulted: true / 1 回目は 600 秒タイムアウト、2 回目は
      run_codex_exec.sh の fallback entry 2（litellm / vertex-glm-5.2）が応答。
      opus_escalation: なし。
      提示した選択肢: 案 A = 単一タスクに畳み込む / 案 B = 実装修正タスクと
      契約テスト追加タスクの 2 本に分ける。
      採用: 案 A。
      Codex の論拠 3 点 — (1) 案 B は両タスクとも
      tests/test_heredoc_stdin_guard.py を files に宣言するため worktree 並列
      マージで確実にコンフリクトし、親側採用 + 再実装という高コストのプロトコル
      に入る。(2) 契約テスト側は hookEventName 修正の完了に依存するが実行順が
      保証されないため、先に走ると壊れた出力を対象にテストを書くことになる。
      (3) 4 つの変更は「出力形を正す→その形を検証する」という 1 つの結合単位で、
      分割しても並列化の短縮効果がゼロのため分割の目的を満たさない。
      却下した案 B の理由: 同一ファイル衝突が確定し、順序依存を並列実行モデルが
      扱えない。em-workflow の規約が「順序が要るなら 1 タスクにまとめる」を
      指示する状況そのもの。
      付随の 2 点 — (1) TS8 相当の実機検証は自動テスト化しない。フックは Claude
      Code 本体が駆動する経路で動くため、テストプロセスから実機のフック実行経路
      を再現するのは本質的に困難。「スクリプトが正しい JSON を出す」は自動化でき
      るが「Claude Code がそれを受理した」は実機が要るため、境界の手前を自動
      テスト、向こう側を手動シナリオに分ける。(2) スキーマ準拠テストは PreToolUse
      フック出力スキーマをリポジトリ内の固定 fixture として定義し、stdout を
      JSON parse した結果に対して hookSpecificOutput の存在・必須キー集合
      {hookEventName, updatedInput}・hookEventName == "PreToolUse"・updatedInput
      の内容を assert する形にする。実機バイナリに依存せず決定的に回る。
      orchestrator の独立判断も同じ結論に達したため、そのまま採用した。
  - question_id: implement.task-branch-delete-blocked
    packet_id: null
    answered_at: "2026-09-13T01:02:00+09:00"
    source: batch-safe-default
    answer_mode: single_select
    selected_option_ids: [delete_from_integration_worktree]
    freeform: null
    normalized_answer: >-
      implement-phase.md I.2.b step 4 が指示するタスクブランチの強制削除
      （force-delete フラグ付きの branch 削除）が、em-workflow 自身の
      destructive-guard（ルール git-branch-force-delete）に阻まれた。
      代わりに integration worktree 内から通常削除フラグで
      em-workflow/heredoc-stdin-guard/task0002 を削除した。
    resolution_note: >-
      gate: gate_id 無し（AskUserQuestion ゲートではなく PreToolUse hook の
      拒否）。codex_consulted: false — 等価で副作用のより小さい代替手段が
      自明だったため。マージ済みであることは
      `git merge-base --is-ancestor` で検証済みで、integration worktree の
      HEAD は当該ブランチを含む integration ブランチなので通常削除が成功する。
      強制削除ではないため到達不能コミットは生じない。
      選ばれなかった選択肢: メイン作業ツリーから強制削除を再試行（guard に
      再度阻まれる）、ブランチを残す（I.2.b step 4 の掃除が未完のまま残る）。
      retrospect 向けの観察 2 件 — (1) implement-phase.md I.2.b step 4 の
      強制削除指示が、本リポジトリ同梱の destructive-guard と正面衝突する。
      (2) destructive-guard は heredoc 本文に書かれた文字列リテラルを実行
      コマンドとして誤認した（この監査記録を書き込む python heredoc の中の
      引用文にマッチして拒否した）。.claude/rules/hook-tests.md が allow 側
      ケースとして挙げている誤爆の類型そのもの。
