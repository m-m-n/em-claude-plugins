  - question_id: review.security-skip-routing
    packet_id: null
    answered_at: "2026-09-13T01:05:00+09:00"
    source: batch-orchestrator-judgment
    answer_mode: single_select
    selected_option_ids: [dispatch_claude_fallback]
    freeform: null
    normalized_answer: >-
      security 観点の primary（codex）が skipped: true / skip_reason
      "codex_declined_to_fetch_diff" を返した。R2b の retryable 表に無い
      skip_reason なので chain は進めず、代わりに Claude fallback
      （security#fallback）を 1 本だけ dispatch した。
    resolution_note: >-
      gate: gate_id 無しの non-packet gate（references/batch-mode.md の
      「Any other non-packet AskUserQuestion site」フォールバック）;
      codex_consulted: false（Codex 自身が当該 skip の当事者であり、
      同じ枯渇状態の可能性が高いため相談先として不適）。
      当該 run に診断を返させた結果は model_refusal — ハーネスは正常に動作し、
      モデルが diff 取得を行わずに skipped を自己申告していた。summary 自体が
      "Security review not completed — no diff content analyzed." と述べている
      ため、完了した run として扱えない。R2b は「no completed run かつ次の
      chain entry が無い」状態の救済として Claude fallback 1 本を定めており、
      これが最小副作用（カバレッジを足すだけで何も取り除かない）の選択肢。
      選ばれなかった選択肢: keep_skip（security 観点が丸ごと未レビューのまま
      残る。シェルコマンドを書き換えるフックの変更で security floor を空に
      するのは受け入れ難い）、advance_chain_to_muse（retryable 表に無い
      skip_reason で chain hop を消費するのは表の規定に反する）。
