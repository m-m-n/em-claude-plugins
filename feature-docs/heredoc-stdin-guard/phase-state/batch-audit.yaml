  - question_id: review.updated-input-output-shape
    packet_id: null
    answered_at: "2026-09-13T01:20:00+09:00"
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids: [option_b_add_hook_event_name]
    freeform: null
    normalized_answer: >-
      heredoc-stdin-guard.py が stdout に出す
      hookSpecificOutput には "hookEventName": "PreToolUse" を足す。
      permissionDecision は足さない（option B）。
    resolution_note: >-
      gate: gate_id 無しの non-packet gate。ユーザー指示「不明点は Codex に
      相談し、比較して優れていると判断した方を採用する」に基づく相談。
      codex_consulted: true（3 回目で成功）。1 回目 = 既定 provider が
      ChatGPT plan の usage limit で失敗。2 回目 = litellm / vertex-glm-5.2 が
      プロンプト中の「バイナリを調べてよい」という記述を真に受けて無制限の
      ファイルシステム探索に入り 600 秒でタイムアウト。3 回目 = 調査禁止を
      明記した bounded プロンプトで litellm / muse-spark に投げて成功。
      fallback provider が回答: true。Opus escalation: 実行せず。
      Codex（muse-spark）の結論は option B。論拠: (1) 公式ドキュメントの
      PreToolUse の例はすべて hookEventName を持つ。(2) 同一プラグイン内の
      既存フック 6 本すべてが hookEventName を出している。(3) バイナリ内の
      文字列は updatedInput の「object か」「空でないか」の検証を述べている
      だけで、permissionDecision が無いと無視される根拠にはならない。
      (4) option C は動くが permissionDecision "allow" が heredoc を含む
      全コマンドを自動承認し、先行する 5 本のガードの判定を上書きするため
      代償が大きすぎる。
      選ばれなかった選択肢: option_a_keep_as_is、option_c_add_permission_decision。
      検証: Codex の推奨を鵜呑みにせず、実機 Claude Code 2.1.269 で A/B を
      実測した。詳細は同フェーズの review finding を参照。
