  description: case 文の語や in を待つフェーズ（1・3・4・5・7）は 1650〜1692 行の分岐で最初の文字からフェーズを決め、1693 行の \ の処理より先に評価される。フェーズ 3 で行継続の \ を見ると _is_word_at(j, "in", ...) が偽になり、1660 行で _Undecidable("case without in") になる。チェックポイントが無いので出力はなく、後続の python3 -i は拒否されない（読みで追跡）。同じ欠落は case \<改行> x in（フェーズ 2 が行継続を対象の語に含めたあと、空白の後の x をフェーズ 3 で in と比べて判定不能）と、in \<改行>esac)（フェーズ 4 が \ をパターンの始まりと読み、esac をパターンとして読み進めて置換の終わりを見失い判定不能）にもある。変更前も判定不能で silent だったので後退ではないが、bash / zsh が受け付ける形を判定不能にしており、IMPLEMENTATION.md D3（シェルが受け付ける形は読む）と THREAT-MODEL.md TM-1 の対策が満たされていない。em-review 側の同一コードにも影響する。
  suggestion: フェーズ 1・3・4・5・7 の分岐の先頭で \ と改行の対を読み飛ばし、フェーズを保つ。case と対象の語の間、対象の語と in の間、in と最初のパターンや esac の間の行継続を deny の行として CASES に足し、両コピーに流す。
  reproduction: Python 式 'echo "$(case x ' + chr(92) + chr(10) + 'in x) :;; esac)"; python3 -i' で command を作る。この文字列を tool_input.command に設定した PreToolUse(Bash) の JSON を、ガードの標準入力へ渡すと、拒否 JSON が出力されない。行継続を取り除くと deny になる。元の文字列は bash -n -c と zsh -n -c の両方で構文検査に成功する。python3 -i を printf REACHED に置き換えて非対話で実行すると REACHED が出力され、後続命令に到達することも確認できる。対話起動そのものは実行しない。
