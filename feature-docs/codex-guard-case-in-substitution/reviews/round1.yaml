  title: 'TM-2: 引数の esac を終端と誤認して正常な処理を拒否する'
  description: '_at_command_position は直前の語が予約語かどうかだけを見て、その予約語自体がコマンドの位置にあるかを確かめない。そのため echo if esac / echo then esac の引数の esac を _is_esac_keyword が文の終端と判定し、スタックを p に戻す。続くパターン y) の ) で置換を閉じ、置換の中の引用された文字列を命令として判定して deny になる（読みで追跡: 1829〜1834 行が直前の語 if / then を予約語と認めて True を返し、1805〜1807 行で 8 を取り除き、1780〜1786 行の ) でスタックが空になる）。変更前は置換の中の case が判定不能で silent だったので、この誤拒否は今回の変更で新たに生じた。同じ取り違えは拒否漏れにもなる: echo "$(case x in x) echo then esac;; y) echo ''"'';; esac)"; python3 -i #'' では、y) で置換を閉じたあと、二重引用符を ''"'' の中の " で閉じたと読み、残りを単引用符の中の文字列と読むため、シェルが実際に起動する python3 -i を判定しない（読みでの追跡、未実行）。同じ判定を使う _is_case_keyword も echo if case x in y) ... のような引数の case を文の始まりと読み、in と esac が続くと読み切ってしまう（SPEC A3 は取り違えが判定不能で終わる前提）。FR1（esac はパターンの位置か項目の本体のコマンドの位置の単独の語のときだけ閉じる）、THREAT-MODEL.md TM-2、_is_esac_keyword の docstring（引数の esac は閉じない）に反する。em-review 側の同一コードにも影響する。'
  suggestion: 項目の本体（フェーズ 8）でコマンドの位置を状態として持つ。項目の始まり、; & | ( 改行の直後、コマンドの位置にある予約語の直後だけをコマンドの位置とし、引数の if / then / ! などを根拠にしない。NFR1 の線形性を保つ。echo if esac / echo then esac を引数に持つ入力（silent になる）と、上の拒否漏れの入力（deny になる）を CASES に足し、両コピーに流す。
  reproduction: tool_input.command に echo "$(case y in x) echo if esac;; y) echo "; python3 -i;";; esac)" を設定した PreToolUse(Bash) の JSON をガードへ渡すと、permissionDecision が deny になる。この入力は bash と zsh の構文検査に成功し、python3 -i は echo の引用された引数にすぎない。_skip_substitution が返す範囲を確認すると、実際の esac) ではなく途中の y) で終了している。安全確認として python3 -i を printf REPL_SENTINEL に置換して実行すると、文字列「; printf REPL_SENTINEL;」だけが出力される。
