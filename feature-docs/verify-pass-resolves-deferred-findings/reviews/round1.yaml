  title: 書き換えで記録が 8 MiB の読み取り上限を超えうる
  description: read_text は入力を MAX_INPUT_BYTES（8 MiB）で制限するが、replace_record は safe_dump の出力サイズを確認しない。入力が JSON 形式のフロー表記などで書かれていると、複数行文字列の改行とインデントで再出力時にサイズが増え、verify_resolution の追加でも増える。上限直下の記録が上限を超えると、同じ 8 MiB 上限（MAX_RECORD_BYTES）を持つ merge-preflight.py は record_unreadable で止まり、このスクリプトも以後その記録を読めない。結果はどちらも fail-closed だが、自動マージが原因の分かりにくい停止になる。
  suggestion: 一時ファイルを作る前に text の UTF-8 バイト数を MAX_INPUT_BYTES と比べ、超える場合は invalid-round-record で失敗して元の記録を残す。そのケースのテストを足す。
  reproduction: null
