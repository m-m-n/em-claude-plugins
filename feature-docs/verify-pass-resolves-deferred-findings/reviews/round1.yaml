  title: 'TM-5: 親ディレクトリのシンボリックリンク経由で対象外の記録を書き換えられる'
  description: read_round_record の os.lstat は末尾の要素だけを検査する。feature-dir/reviews（または feature-dir 自体）がシンボリックリンクだと、select_round_record の os.listdir と lstat はリンク先を辿り、replace_record の tempfile.mkstemp(dir=...) と os.replace もリンク先のディレクトリに書く。結果として、integration worktree の外を含む別の場所の roundN.yaml が書き換えられる。NFR6（書き込み先は integration worktree の最新 review round 記録だけ）と THREAT-MODEL.md TM-5 の対策が、末尾要素のリンクにしか効いていない（240〜241 行目のコメントの保証も成り立たない）。前提として、攻撃者が feature-docs/{feature}/ 配下にリンクを置ける必要がある。再現手順はコードの読解で追跡し、reproduced と判定した。
  suggestion: feature-dir と reviews を realpath で解決し、integration worktree の配下に留まることと途中の要素がリンクでないことを確かめる。あるいは reviews を O_DIRECTORY|O_NOFOLLOW で開き、dir_fd 経由で lstat・読み込み・一時ファイル作成・os.replace（src_dir_fd / dst_dir_fd）を行う。reviews がリンクのケースを拒否するテストを足す。
  reproduction: 'メモリ上の模擬ファイルシステムで確認した。/workspace/feature-docs/current/workflow.yaml に workflow: [{id: verify, result: pass, round: 1, passed_ids: [AC-1]}] を設定する。other/reviews/round1.yaml に findings: [{stable_id: block1, severity: high, category: spec, resolution: deferred}] を置き、current/reviews を ../other/reviews へのリンクにする。対応づけを {"block1":["AC-1"]} として、run に --feature-dir /workspace/feature-docs/current、対応づけファイルの --mapping、40文字の小文字 a を --verified-commit として渡す。処理は成功し、other/reviews/round1.yaml の block1 が fixed に変わる。確認では実ファイルを作成・変更していない'
