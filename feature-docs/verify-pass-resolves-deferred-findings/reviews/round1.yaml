  title: exit-4 リカバリ後、verify していないツリーで deferred 指摘を fixed にできる
  description: '手順 6 は、commit-docs.sh の exit 4 で integration ブランチの新しい先端にツリーを refresh したあとも、手順 4 を同じ引数（同じ対応づけ・同じ --verified-commit）で再実行するよう指示している。refresh 後のツリーには verify が実行されていないコミットが入るが、スクリプトは verified_commit を現在の先端と照合せず、merge-preflight.py も verified_commit を読まない（verify については result が fail でないことだけを見る）。そのため critical/high の deferred spec 指摘が未検証のコードに対して fixed になり、マージ前確認の unresolved_findings を通過する。ただし verify フェーズ中に integration ブランチが進むのは通常の流れの外であり、exit-4 リカバリが verify の result: pass 自体を未検証のツリーに書き直す既存の挙動も同じ前提に立つため、high から medium に下げた。'
  suggestion: 手順 6 で、refresh 後の先端が手順 2 で捕捉したコミットと異なる場合はスクリプトを実行せず、指摘を deferred のまま残す（A4 の fail-closed と同じ扱い）。または verify を再実行してから手順 2〜4 をやり直すよう書き換える。
