schema_version: 1
feature: verify-pass-resolves-deferred-findings
created: '2026-11-12'
base_branch: main
goal: |
  # verify で解消を確認した deferred の review 指摘が未解決のまま残り、自動マージが unresolved_findings で断られる

  種別: バグ

  ## 現象

  review で rework 上限に達して `deferred` にした critical/high の指摘が、その後の verify で解消を確認しても review 記録上は未解決のまま残る。完了処理後の自動マージの事前チェック（`scripts/merge-preflight.py`）が次の理由でマージを断る。

  ```txt
  merge: not_merged
  reason: unresolved_findings
  detail: round2 unresolved critical/high findings: f171409f76fe2785
  ```

  観測した feature: `inbound-reject-e2e-registration-wait`（web-sip-phone）。指摘 `f171409f76fe2785`（high、spec 観点）は「SPEC AC5（`go test -race -count=1 ./cmd/sipphoned/...` が通る）が未達」。review round 2 で rework 上限により deferred。その後、先行修正を base_branch から取り込み、verify round 2 で AC5 を含めて pass した。

  ## 再現手順

  1. batch 実行で、review の rework 上限到達後に、verify の受け入れ条件の未達を指摘する high の指摘が出て deferred になる
  2. 後続の verify で、その受け入れ条件が pass する
  3. 全ステップが completed になり完了処理を終える
  4. 自動マージの事前チェックが `unresolved_findings` で停止する

  ## 期待する挙動

  verify が pass した受け入れ条件に対応する deferred の指摘は、review 記録の `resolution` が解決済み（`fixed`）に更新され、根拠（どの verify round で pass したか）が記録に残る。受け入れ条件に対応しない deferred の指摘は、これまでどおり未解決のまま扱う。`merge-preflight.py` の判定（`resolution` が `fixed` / `declined` のときだけ解決済み）は変えない。

  ## 完了の定義

  - 再現手順で現象が起きない
  - 再発を検出するテストがある

  ## 該当箇所

  - `em-workflow/scripts/merge-preflight.py` の `check_review_findings`（最新 round の記録のみを読む）と `RESOLVED = ("fixed", "declined")`
  - verify フェーズの完了処理（deferred の指摘の `resolution` を更新する経路が無い）

  ## 実害・発生条件

  全行程が完了し verify も pass したタスクが自動マージされず、Notion 上で中断に戻る。triage でレビュー待ちにしても同じ理由で再びマージを断られる。

  ## 追加指示（起動時）

  - 不明点は Codex に相談し、比較してより良いと判断した選択肢を採用する。その議論の内容は Notion のタスクページに記録する（オーケストレーターが行う）。
