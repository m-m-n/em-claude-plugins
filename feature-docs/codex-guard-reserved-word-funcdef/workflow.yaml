schema_version: 1
feature: codex-guard-reserved-word-funcdef
created: '2026-10-11'
base_branch: main
goal: '# codex-hook-interactive-guard: 予約語（then / do / else / ! / time）の直後に書いた関数定義の本体を判定し、正当なコマンドを
  deny する（回帰）


  Notion: <notion-url>


  ## 現象 (必須)

  `codex-hook-interactive-guard.py`（em-workflow / em-review の両コピー）が、予約語（`then` `do`
  `else` `!` `time` など）の直後に書いた関数定義の本体を判定し、呼び出していない関数の中身を理由に deny を返す。基準版 `726917f4`
  では何も出力しなかったもので、feature `codex-guard-assignment-paren-head` の変更による回帰。review round
  1 の finding `75a8159e787c3781`（medium, comprehensive）として未解決のまま残った。

  同じ原因で次も deny になる:

  - `for x in 1; do f() { python3 -i; }; done`

  - `! f() { python3 -i; }`

  - `time f() { python3 -i; }`

  - `else` の直後の `f() { python3 -i; }`

  ## 再現手順 (必須)

  1. コマンド `if true; then f() { python3 -i; }; fi` を `{"tool_input": {"command": "..."}}`
  として hook の標準入力に渡す

  2. deny が出力される（`bash -n -c` では構文として正しく、関数は呼び出されていない）

  ## 期待する挙動 (必須)

  何も出力しない（silent）。単独の `f() { python3 -i; }` と同じ扱いにする。一方で `if true; then a=()` + 改行
  + `(python3 -i)` + 改行 + `fi` のような配列代入の後のサブシェルは deny のまま保つ。

  ## 完了の定義 (必須)

  - [ ] 再現手順で現象が起きない

  - [ ] 再発を検出するテストがある

  - [ ] `tests/test_codex_hook_interactive_guard.py` の `CASES` に予約語の直後の関数定義を silent
  として、予約語の直後の配列代入 + サブシェルを deny として追加

  - [ ] 両コピーがバイト単位で同一のまま

  ## 該当箇所 (任意)

  - `em-workflow/scripts/codex-hook-interactive-guard.py:350`（`_names_function`: `(`
  の直前の単純コマンドの語の並びが「語 1 つだけ」か `function NAME` かを見る。パーサーは予約語を区切りとして扱わず語として積むため、`[then,
  f]` が関数名にならない）

  - `em-review/scripts/codex-hook-interactive-guard.py`（同一内容）

  - 修正案: `_names_function` で長さを見る前に、先頭に続く予約語を取り除いてから判定する。モジュール docstring の手順 4 と `_Group.head`
  の説明、DOCSTRING_MARKERS も合わせる

  - 記録: `feature-docs/codex-guard-assignment-paren-head/reviews/round1.yaml`（ブランチ
  `em-workflow/codex-guard-assignment-paren-head/integration`）

  ## 実害・発生条件 (任意)

  deny 側の誤爆で、すり抜けではない。Codex レビュアーが制御構文の中で関数を定義する正当なコマンドを実行できず止まる。


  ## 追加指示（起動時）

  - 実装完了後、integration ブランチを remote に push し、base_branch に対して gh pr create で PR を作る。integration
  ブランチはローカル・リモート両方に残す（base_branch へ自動マージしない）

  - 不明点は Codex に相談し、比較的良いと判断した選択肢を採用する

  - その議論内容を Notion に記録する

  '
