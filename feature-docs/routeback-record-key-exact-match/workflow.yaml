schema_version: 1
feature: routeback-record-key-exact-match
created: '2026-10-07'
base_branch: main
goal: |
  # queue_stop_guard の ROUTEBACK_RECORD_LINE_RE がコロンを含む別キー（routeback_failed_journal_line:x など）を route-back 記録と誤認する

  Notion タスク: https://www.notion.so/3f23509ec8ee81409255e0124ddcf550 （種別: バグ）

  ## 現象 (必須)
  `em-workflow/hooks/queue_stop_guard.py` の `ROUTEBACK_RECORD_LINE_RE`（`^\s+routeback_failed_journal_line:(.*)$`）は、コロンの直後に空白や行末を求めていない。そのため `tasks.{T}` 直下の `routeback_failed_journal_line:x: 1` のような別キーの行を route-back 記録の最初の出現として扱い、後ろにある本来の記録 `routeback_failed_journal_line: 1` が読まれない。
  ## 再現手順 (必須)
  1. workflow.yaml のタスクブロックで、直下に `routeback_failed_journal_line:x: 1` を置き、その後ろに `routeback_failed_journal_line: 1` を置く
  2. `task_routeback_records_from_workflow` を呼ぶ
  3. 本来の記録が読まれない（コードを読んだ範囲での指摘で、実行による再現は未確認）
  ## 期待する挙動 (必須)
  キー名が `routeback_failed_journal_line` と一致する行（コロンの直後がスペース・タブ・行末）だけを記録の行として扱う。同じファイルの `_find_key_colon` と同じ規則に揃える。
  ## 完了の定義 (必須)
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある
  ## 該当箇所 (任意)
  `em-workflow/hooks/queue_stop_guard.py` の `ROUTEBACK_RECORD_LINE_RE`、`task_routeback_records_from_workflow`
  ## 実害・発生条件 (任意)
  起きる可能性は低い。オーケストレーターが書くキーにこの形は無い。外れる方向は Stop フックがブロックしない側。出典: em-workflow feature `task-status-key-exact-match`（Notion タスク https://www.notion.so/3f23509ec8ee8194b8c4d28bf89c3fe9 ）の要件調査で検出し、範囲外とした（仮定 A-2）。
