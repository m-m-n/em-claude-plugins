    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids:
    - not_a_heredoc
    freeform: null
    normalized_answer: 引用・コメント内の偽の <<WORD は本文を取り込まない。後続行は元の位置で実際の構文どおり（引用の続きなら引用として）字句解析する
    resolution_note: 'Codex 相談 1 ターン（codex エントリ）で not_a_heredoc を推奨（worker 推奨の rescan_body
      と異なる）。根拠: rescan_body は複数行の引用状態を失い、引用内の文章を実コマンドと誤認する。誤検知のコストは見逃しと同じ桁なので変更量より構文の正しさを優先する。Codex
      の実測で echo ''<<EOF ... EOF'' の形は fallback_sink=false で本文が data のまま捨てられることも確認された。オーケストレーター判断で採用し仮定として記録。不採用:
      rescan_body。Opus エスカレーションなし'
