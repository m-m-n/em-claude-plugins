    normalized_answer: run-destructive-guard.py の各ケースに hooks.json と同じ 10 秒の制限時間を入れ、超過を
      FAIL にする。cases.json に約 60KB の再現入力を deny ケースとして足す
    resolution_note: 'Codex 相談 1 ターン（codex エントリ）で runner_timeout を推奨。根拠: 本番と同じ 10
      秒の制限で、遅延しても pass になる問題を直接検出でき、通常のランナー実行で速度と deny を両方検査できる。オーケストレーター判断で採用し、record_as_assumption
      に従い仮定として記録。不採用: unittest_timing（検査が 2 か所に分かれる）、cases_only（退行を検出できない）。Opus エスカレーションなし'
  requirement.fake-heredoc-operator:
