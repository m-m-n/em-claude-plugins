  description: 'real_operators() は `$` の後ろを `$(` と `$''` しか区別せず、`${`・`$((`・コマンド位置の `((`・`$[` を文脈として積まない（`$((` は sub と group の枠になり、中の `<<2` が裸の演算子扱いになる）。bash では `${x/<<EOF/}` は 1 語、`$((1<<2))` はシフト演算で、ヒアドキュメントは開かれない。評価者が再現した: `echo ${x/<<EOF/}\nrm -rf /home/sakura/valuable\nEOF`、`echo ${x:-<<EOF}\n...\nEOF`、`x=${y/<<EOF/}; ls\ngit reset --hard HEAD~3\nEOF`、`echo $((1<<2))\nrm -rf /home/sakura/valuable\n2`、`((x=1<<2))\n...\n2`、`echo $[1<<2]\n...\n2` はすべて HEAD・基準コミットとも allow。bash で後続行が実行されることも echo 置換で確認した。THREAT-MODEL.md TM-3 の緩和策を満たしていない。なお SPEC FR5 が名指しするのは引用とコメントだけなので、SPEC の文面からは外れた形でもある。'
  suggestion: real_operators() に枠を 2 種類足す。(1) 引用の外の `${` で param 枠を積み、対応する `}` で降ろす。中の引用状態は追うが `<<` は演算子として拾わない。(2) `$((`・`$[`・コマンド位置の `((` で arith 枠を積み、`))` / `]` で降ろし、中の `<<` を拾わない。より保守的な代案は、こうした文脈にある候補の `<<` では本文を取り込まないこと。再現形を deny ケース、`echo $((1<<2)); cat <<'EOF'\nrm -rf /tmp/zz\nEOF`（現在 allow）を allow ケースとして足す。
