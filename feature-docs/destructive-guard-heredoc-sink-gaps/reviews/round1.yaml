  title: FR2 のホスト文の演算子チェックが常に真で、引用の読み違いがあると bash 宛て本文が data として素通りする
  description: '_statement_holds_operator() の 2 条件はどちらも常に真になる。idx は同じ starts への bisect_right で求めているので、starts[idx] <= marked_pos < end は必ず成り立つ。pos は HEREDOC_OP の一致位置なので、text.startswith(''<<'', pos) も必ず成り立つ。FR1 で選択とチェックが同じ starts を使うようになってからは一度も False を返さず、FR2 は実質未実装。_OperatorContext（$''...'' を解釈する）と shlex（解釈しない）の読みが食い違うと害が出る。評価者が実行して確認: `echo $''a\''b''; bash <<EOF\ngit reset --hard HEAD\nEOF\necho x\''y` は HEAD で allow（基準コミットでも allow で退行ではないが、TM-1 の穴が残る）。comprehensive#fallback も同じ箇所を medium で独立に報告。'
  suggestion: _lex_layout(track=True) で、引用されていない裸の演算子トークンのうち `<<` を含むものの開始位置（marked 座標）を _operator_token_start() で確定して文ごとに記録する。融合トークンは既存の pieces/offset 処理で base + 位置として求める。_statement_holds_operator() は marked_pos がその文に記録した `<<` の開始位置と一致するときだけ真を返し、一致しない・確定できないときは None（判定不能）を返す。再現形を deny ケースとして cases.json に足し、FR2 だけで判定が決まるケースも足す。
