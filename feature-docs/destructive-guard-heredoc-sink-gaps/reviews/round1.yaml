  description: _skipped_word_has_sink() は読み飛ばした語全体に SHELL_SINK.search() をかけ、\b 区切りなので python-tools・node-app・bash-completion のようなパス成分にも一致する。`git -C /home/u/src/python-tools commit -F - <<'EOF'\nfix\n\ngit reset --hard HEAD\nEOF` と `env -C /home/u/node-app git commit -F - ...` は基準コミットで allow、HEAD で deny（評価者が実行して確認、退行）。SPEC FR6 の文言どおりではあるが、em-workflow 自身が worktree パスで git -C を多用するため無人実行を止める誤爆になりうる。
  suggestion: 照合対象をプログラムを名指しできる値に絞る（git は -c / --config-env の値と VAR=value 代入のみ。-C/--git-dir/--work-tree/--namespace と env -C/--chdir の値は外す）。`git -C /tmp/node-app commit -F - <<'EOF'` 形の allow ケースを足し、SPEC FR6 の対象範囲もあわせて直す。
