schema_version: 1
feature: destructive-guard-heredoc-bypass-fixes
created: '2026-10-06'
base_branch: main
goal: '# destructive-guard: heredoc-syntax-error の review round 2 で deferred になった回避経路を直す（high 4 件）


  Notion タスク: https://www.notion.so/3f13509ec8ee81e0af5ee7133da78d8e （種別: セキュリティ）


  ## 脆弱性の概要 (必須)

  `em-workflow/hooks/destructive-guard.py` の字句解析に、review round 2 の auto-fix で直しきれず batch の rework 上限で deferred になった回避経路が残っている。bash が実行する破壊的な行を、フックが本文として隠したり、配列代入として認識しなかったりして allow を返す。

  ## 参照 (必須)

  - CVE / GHSA ID: 該当なし

  - アドバイザリ URL: 該当なし

  - severity: high

  - 該当パッケージ: 該当なし

  - 現在のバージョン: em-workflow（feature `destructive-guard-heredoc-syntax-error` の integration ブランチ `em-workflow/destructive-guard-heredoc-syntax-error/integration`）

  - 修正済みバージョン: 無し

  ## 攻撃シナリオ (必須)

  エージェントが生成する Bash コマンドが次のいずれかの形をとると、フックは allow を返し、bash は破壊的な行を実行する。

  - `b0734a006de6f4d7`: 語の内部の行継続。`x\<改行>=( <<EOF` や `decl\<改行>are x=( <<EOF` の後に破壊的な行を置く。代入語と組み込み命令名を最初の平文断片だけで判定しているため配列代入と認識しない（round 1 の `c069888e6fdcbcd8` の残存経路）

  - `a7c0d90ac3e44e5b`: 宣言組み込み（declare / typeset / local / export / readonly）の引数にある `NAME[` を添字として読み、保留中のヒアドキュメントの本文を遅らせる。基準版 deny → 現在 allow の回帰。loop 3 の修正案は既存 deny ケース T2 E-1（eval の引数の `x[a b]=(`）を壊したため取り消した。eval は引数を再解析するので、宣言組み込みとは分けて扱う

  - `f34ee27bc8c323b1`: extglob の途中切り替え対策（解析単位の数による ask）が、括弧より前の文字列が同じ解析単位を重複排除する。外側と内側の eval が同じ接頭辞 `x=(@` を持つと単位数が 1 になり、切り替えによる回避が allow になる

  ## 影響範囲 (必須)

  無人実行（em-workflow の batch）を含め、hook が allow を返すので破壊的なコマンドが確認なしで実行される。

  ## 完了の定義 (必須)

  - [ ] 攻撃シナリオが成立しない

  - [ ] 修正版に追随している（修正版が無い場合は暫定緩和策の欄に対応を記載）

  - [ ] 各再現入力を deny ケースとして `em-workflow/hooks/tests/destructive-guard-cases.json` に足す

  - [ ] 既存の deny / ask ケースが 1 件も消えていない（特に T2 E-1 / T2 E-9）

  ## 該当箇所 (任意)

  - `em-workflow/hooks/destructive-guard.py` の `word_transition()`（decl_pos 分岐・代入語の判定）、`_count_extglob_units()`、`close_subscript()`

  - 詳細は integration ブランチの `feature-docs/destructive-guard-heredoc-syntax-error/reviews/round2.yaml`

  - 関連（architecture, deferred）: `765c3a53859569c2` subscript / extglob の走査器が主ループの引用・展開・プロセス置換の処理を複製しており、片方だけの修正で二通りの読みが食い違う。round 2 の退行 `d96cc6e9cb96644b` はこの重複が原因だった

  ## 暫定緩和策 (任意)

  \<修正までの回避手段。あれば\>

  '
