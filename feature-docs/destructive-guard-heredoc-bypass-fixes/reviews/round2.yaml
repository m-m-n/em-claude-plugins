  action_rationale: 残る high 2 件は、どちらも bash が実行する破壊的な行を allow する回避経路で、基点からの退行。区切り語を読む関数と演算子を認識する箇所に閉じた修正で済み、最悪でも P16 の ask に倒せる。medium 2 件は自動修正の対象外になる見込み。
