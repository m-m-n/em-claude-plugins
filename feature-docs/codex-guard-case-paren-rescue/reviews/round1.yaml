  title: esac 後も残る case 印のせいで、サブシェルを閉じる ) が救済されず対話起動を見逃す
  description: '`foo(` の後で _read_argument_parens が仮の群 P を開く（chain_base は外側のサブシェル G1）。`case x in esac` の先頭語 case で _append_word（938-939 行）が P.case_mark を立てる。メインの読み取りには esac で印を外す処理がないので印は残る。最後の `)` では _closes_paren_after_rescue（1342 行）が印を見て False を返し、_close_paren が P だけを閉じて G1 が開いたまま残る。入力末尾で _Undecidable(''group'') になり判定対象が 0 件になって silent。変更前は同じ `)` が連鎖を救済して G1 を閉じ、python3 -i が deny されていた。em-review 側のコピーも同一で同じ影響を受ける。'
  suggestion: case 印は「パターンを終える ) を待っている間」だけ効くようにする。case 文が esac で終わったら、その仮の群の印を外す（in の直後の esac と、;; の後のコマンド位置の esac の両方）。`(x)` 形式のパターンもこの規則で扱える。docstring の「The mark is never cleared」と SPEC FR1 の「印はそのグループについて永続する」を改める。空の case の後・`(x)` パターンの case の後・esac 後の入れ子連鎖の deny 行を両コピーに足し、2 つのコピーはバイト単位で同一に保つ。
  reproduction: 入力 `zsh -c 'setopt nobadpattern; ( function { python3 -i; } foo(a; case x in esac; )'` を tool_input.command に設定した JSON をフックの標準入力へ渡す。変更後の main は何も出力せず、基準版の find_deny は ('interactive', 'python3') を返すことを確認した。内部では _Undecidable('group') が発生し、判定対象は0件になる。zsh -n -c による構文検査は成功し、python3 -i を `print -r -- REACHED` に置換した安全な実行では REACHED が出力された
