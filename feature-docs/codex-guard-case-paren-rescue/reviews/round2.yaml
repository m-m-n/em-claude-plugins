  title: case x の改行後の in esac と zsh の case x { esac で case 印が残り、対話起動の拒否が外れる
  description: 改行で case の形の追跡が切れ、波括弧形では { が in として扱われないため esac が印を下げない。印 1 のまま最後の ) は救済されず外側のサブシェルが開いたまま入力が終わり、_Undecidable("group")
    で python3 -i が判定されない。基準 9b27557 では deny だった。SPEC A9 が受け入れ、CASES に既知の見逃し（silent）として固定されている。em-review
    側も同一。
  suggestion: case の形の追跡を改行をまたいで保ち、zsh の波括弧形で { を in の代わりとして受けて印を下げる。SPEC A9 の改定が要るため仕様変更として後続の機能で扱う。
  reproduction: いずれかのフックの標準入力に JSON {"tool_input":{"command":"zsh -c 'setopt nobadpattern; ( function
    { python3 -i; } foo(a; case x\nin esac; )'"}} を渡す。main → find_deny → 内側のシェル文字列の解析を経て、group エラーとなり標準出力は空になる。「case
    x\nin esac」を「case x { esac」に置換しても同じ結果になる。実際の対話起動を避けた確認では、内側の文字列の先頭に「function python3 { print -r --
    GUARD_TARGET_REACHED "$@"; };」を追加して zsh -f -c で実行すると、両方とも終了コード0で「GUARD_TARGET_REACHED -i」を出力した。
  reproduction_alternates: []
  reproduction_overflow: false
