  file: em-workflow/skills/merge/SKILL.md
  line: 487
  title: ローカルルートのマージ対象が検証済みの head_sha に束縛されていない
  description: 手順 10 で worktree の HEAD が head_sha と一致することを確かめた後、手順 12 の base-check、13.1 のロック確認、13.3 の main-tree 確認を経てから、手順 13.3 は `git merge --no-ff --no-edit em-workflow/<feature>/integration` をブランチ名で実行し、ブランチを解決し直す。その間に
    integration ブランチへコミットが入ると、検証していないコミットが base に入る。merge-lock.py はマージ走行同士を直列化するだけで（非ブロッキングの flock と holder record）、他の書き込みは防がない。マージ後にも HEAD の第 2 親と head_sha を照合していない。PR ルートは `--match-head-commit <head_sha>`
    で束縛しているので、2 つのルートで保証が揃っていない。high から medium に下げた理由は 2 つある。SPEC FR18 がブランチ名の形を明示していること、そして発生には、develop が完了した後に走行外から integration ブランチへの並行書き込みが要ることである。
  suggestion: FR18 の形を保つ場合は、`git merge` の直前に `git rev-parse refs/heads/em-workflow/<feature>/integration` が head_sha と一致することを確かめる。一致しなければ verification_failed で終端する。マージ後は HEAD の第 2 親が head_sha であることを確かめ、不一致なら
    detail に記す。SHA を直接マージする形にする場合は、先に SPEC FR18 を改める。どちらの場合も、検証後にブランチが進むケースの回帰テストを足す。
  reproduction: null
