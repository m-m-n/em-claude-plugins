  title: 承認の照合で、bash_guard.py と同じ前後空白の除去をしていない
  description: check_approval は、yaml.safe_load で読んだ workflow.yaml の文字列をそのまま `command in approved` で比べる。bash_guard.py の `--list` が返すのは approved_for() が strip した値である。bash_guard.py は宣言の読み込み、実行判定、承認の記録でも strip
    する。そのため、引用符付きで前後に空白を持つ test_command（例 `"make test "`）は、develop の承認ゲートでは承認済みとして通るのに、preflight では常に commands_unapproved になる。承認ストアは strip した値しか持たないので、再承認しても直らない。fail-closed ではあるが、無人実行が恒久的に止まる。
  suggestion: 照合には strip した値を使い、出力の command は元の文字列のまま保つ。前後に空白を持つコマンドで、bash_guard.py と preflight の判定が一致することをテストする。
