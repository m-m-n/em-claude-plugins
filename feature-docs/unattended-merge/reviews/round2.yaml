  file: em-workflow/skills/merge/SKILL.md
  line: 199
  title: ロック取得後に、マージ済みかどうかを判定し直していない
  description: マージ済みの判定（手順 4 の merged、手順 5.2 の resolve）はロック取得より前に行う。merge-lock.py の hold は非ブロッキングの flock なので、後発の走行が判定してから hold するまでの間に先行がマージとロック解放を終えると、後発は held を得て先へ進む。merge-git.py integrate は `--no-ff`
    で、base_tip が old_tip の祖先かどうかだけを見る。base が integration の先端を含んでいても冗長なマージコミットを作る。PR ルートでは、その先端を push した後、マージ済み PR の head は動かないため、CI 待ちか state で pr_head_moved（not_merged）になる。再実行すると、integration_tip が進んでいるので
    resolve は旧 PR を無視し、新しい PR を作ろうとする。ローカルルートでは、空のマージコミットが base に 2 つ入り、結果は already_merged ではなく merged になる。NFR3 の収束と AC6 に反するが、同じ feature の走行が並行するときの狭い窓に限られるので medium とする。
  suggestion: 手順 6 で held を得た後、手順 8 の前に、ローカルルートでは merge-git.py merged を、PR ルートでは merge-pr.py resolve を、同じ integration_tip で呼び直す。マージ済みなら、ロックを止めてからマージ済みの経路へ進む。
  reproduction: null
