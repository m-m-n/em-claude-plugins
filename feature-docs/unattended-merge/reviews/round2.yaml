    と `git rev-parse HEAD` を求めている。プロジェクトルートから始めた走行では（手順 5.3 の cd の後、またはコンフリクトも merge_in_progress も無い通常の経路）、メイン作業ツリーの base の HEAD を読む。その値は head_sha と異なるため、検証コマンドの無い feature が毎回 verification_failed で止まる。文面上、空の場合にこの確認を飛ばすとも読めるため、どちらに読まれても不具合になる。
  suggestion: commands の有無にかかわらず、HEAD の確認の直前に単独の `cd "<worktree_path>"` を置く。commands が空でもこの確認を行うと明記する。
