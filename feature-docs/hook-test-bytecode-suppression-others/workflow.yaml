schema_version: 1
feature: hook-test-bytecode-suppression-others
created: '2026-11-07'
base_branch: main
goal: |
  # hooks を同一プロセスで読み込む他のテスト 7 本も em-workflow/hooks/ と em-review/hooks/ に __pycache__ を書く

  種別: 改善

  ## やりたいこと (必須)

  hooks 配下のモジュールを同じプロセスで読み込む次の 7 本のテストモジュールが、単体実行でも em-workflow/hooks/ と em-review/hooks/ に `__pycache__` を書かないようにする。

  - tests/test_queue_stop_guard.py
  - tests/test_queue_stop_guard_routeback_record.py
  - tests/test_failed_run_cleanup_guard.py
  - tests/test_hooks_registration.py
  - tests/test_queue_failure_net_cross_hook.py
  - tests/test_muse_guard.py
  - tests/test_consultation_harness_chain.py

  ## 背景・なぜ (必須)

  上の 7 本は hooks 配下のモジュールをバイトコード書き込みの抑止なしで読み込んでいる。全体実行で `__pycache__` ができないのは、`tests/test_merge_ci_wait.py` が import 時に `sys.dont_write_bytecode` を True にしたまま戻さないためで、各モジュールを単体実行するとプラグイン配下に書き込む。プラグイン配下は配布物にそのままコピーされる。

  feature hook-test-bytecode-suppression（destructive-guard を読み込む 2 本の対処）の計画時に見つけた範囲外の課題。

  ## 受け入れ条件 / 完了の定義 (必須)

  - [ ] 7 本それぞれを単体実行した後、em-workflow/hooks/ と em-review/hooks/ の配下に `__pycache__` ができない
  - [ ] 既存テストはすべて通る

  ## スコープ外 (任意)

  - tests/test_destructive_guard_extglob_units.py と tests/test_destructive_guard_lexer_agreement.py（別タスクで対処）

  ## 制約・前提 (任意)

  なし
