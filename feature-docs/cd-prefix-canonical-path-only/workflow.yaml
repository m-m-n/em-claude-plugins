schema_version: 1
feature: cd-prefix-canonical-path-only
created: '2026-10-31'
base_branch: main
goal: "# bash_guard.py の cd 前置形の判定を正規の絶対パスだけに絞る\n\n## やりたいこと (必須)\n\n`em-workflow/hooks/bash_guard.py`\
  \ の cd 前置形の判定を、正規の絶対パスだけを許可する形に絞る。段階検査（`_stage_walk_refuses`）、物理パスへのフォールバック、/proc・/dev/fd\
  \ の特別扱いを取り除く。\n\n## 背景・なぜ (必須)\n\n10/28〜10/31 に、cd 前置形の判定を直す feature が 7 件続いた（implementer-cd-verbatim-conflict、is-below-physical-fallback、cd-prefix-toplevel-operators、cd-prefix-non-directory-dotdot、cd-prefix-process-dependent-paths、cd-prefix-relative-link-target、is-below-stalled-walk-proc-read）。修正のたびに、その修正から次の指摘が出ている。最初の\
  \ high を除き、指摘はすべて fail-closed 側の誤判定か、実運用では起きない経路だった。\n\n`em-workflow/references/command-execution-protocol.md`\
  \ は cd 先を `{worktree_path}` に限っているので、Bash のパス解決を再現する必要はない。\n\nこのタスクは「bash\\_guard.py\
  \ の段階検査の続行が要素数の二乗で遅くなる」（破棄）を吸収する。\n\n## 受け入れ条件 / 完了の定義 (必須)\n\n- [ ] 次をすべて満たすパスだけを許可する\n\
  \  - 絶対パスで、ルート以外に空要素・`.`・`..` を含まない（正規化してから受け入れることはしない）\n  - 字句的に `strictly_below(path,\
  \ area)` を満たす\n  - `os.path.realpath(path, strict=True) == path`\n  - `isdir(path)`\n\
  - [ ] パスの長さに上限を設け、上限を超えたら走査の前に不許可にする。上限は固定の PATH\\_MAX ではなく、環境に合ったバイト数にする\n- [ ]\
  \ 既存の引用符などの構文の制限と、例外が出たら不許可にする動作を変えない\n- [ ] `_stage_walk_refuses`、物理パスへのフォールバック、/proc・/dev/fd\
  \ の特別扱いを取り除く\n- [ ] 許可領域そのものがシンボリックリンクを含む場合の扱いを決めて SPEC に書く（`worktree_area()` の解決先を信頼するか、元の作業ツリーの配下に限るか）\n\
  - [ ] 許可する範囲を決めて SPEC に書く（許可領域の配下全体か、割り当てた `{worktree_path}` そのものか）\n- [ ] `command-execution-protocol.md`、hook\
  \ の docstring、implementer の手順書の cd 前置形の条件を、新しい判定に合わせる\n- [ ] 末尾の `/`・重複した `/`・`.`・`..`・リンクを含むパスを不許可とするテストがある\n\
  - [ ] 長いパス（例: `'/dev/null' + '/x' * 32000`）で判定がすぐに返ることを確かめるテストがある\n- [ ] 取り除いた判定のためのテストを整理し、残ったテストがすべて通る\n\
  \n## スコープ外 (任意)\n\n検査してから実行するまでの間に、ディレクトリや祖先がリンクに差し替えられる問題（事前のフックだけでは解消できない）\n\n\
  ## 制約・前提 (任意)\n\nimplementer が cd 先に渡す `{worktree_path}` が正規の絶対パスであることを確かめ、そうでなければ生成する側で正規のパスにそろえる。\n"
