created: '2026-09-25'
base_branch: main
goal: '# em-workflow: recycled-task-id-carveout の TS-13 とテスト docstring の reader-count
  主張が実測と一致しない


  ## 現象

  recycled-task-id-carveout feature の検証ドキュメントとテストモジュール docstring が、実測と一致しない主張を書いている。


  (1) VERIFICATION.md TS-13 が出典より広い全称文になっている

  `feature-docs/recycled-task-id-carveout/VERIFICATION.md` の TS-13 は出典として SPEC AC-6
  を挙げている。AC-6 の本文は「`ORCHESTRATOR_ONLY_SCOPE_PHRASE` の改訂の結果として single-reader の module-level
  定数を残さない」であり、その改訂が孤立させた定数を対象にしている。

  一方 TS-13 の Expected Result 欄は「Count reader sites per module-level constant; every
  constant has 0 (retired with its readers) or >= 2」という、モジュール内の全定数に対する全称文になっている。

  実測では `tests/test_recycled_task_id_consistency.py` に reader 1 の定数が 6 個残る:

  - `PLUGIN_ROOT`、`IMPLEMENT_PHASE_PATH`、`ABORT_PHASE_TERMINAL_PHRASE`、`STOP_CONDITION_3_PHRASE`
  — 本 feature 以前から single-reader

  - `STOP_HOOK_BULLET_START`、`NEXT_SUPPORTING_CAST_BULLET_START` — task0001 が追加したセクション切り出し用アンカー。ヘルパー関数
  `_stop_hook_bullet()` の内部でのみ読まれる

  AC-6 の基準では合格だが、TS-13 の文字どおりでは不合格になる。


  (2) モジュール docstring の reader-count 主張が実測と不一致

  `tests/test_recycled_task_id_consistency.py` の docstring（task0004 の AC-5/AC-6 の説明）が「leaving
  no module-level constant in this module with fewer than two reader sites」と書いているが、reader
  1 の定数が 6 個ある。


  ## 再現手順

  1. VERIFICATION.md の TS-13 行と SPEC.md の AC-6 を突き合わせる

  2. tests/test_recycled_task_id_consistency.py の module-level 定数（`^[A-Z][A-Z0-9_]+\s*=`）ごとに、定義行を除いた出現回数を数える

  3. reader 1 の定数が 6 個あることを確認する

  4. 同モジュールの docstring の該当文を読む


  ## 期待する挙動

  - TS-13 の Expected Result が、出典の SPEC AC-6 と同じ範囲（当該改訂が孤立させた定数、および matcher リテラル定数）に限定されている。あるいは全称文のまま維持するなら、対象外とする定数の種類を明示している

  - モジュール docstring の reader-count に関する記述が実測と一致している


  ## 完了の定義

  - [ ] TS-13 の Expected Result が実測可能かつ実測と一致する基準になっている

  - [ ] tests/test_recycled_task_id_consistency.py の docstring から、実測と一致しない reader-count
  主張が消えている

  - [ ] `python3 -m unittest discover -s tests` が通る


  ## 該当箇所

  - feature-docs/recycled-task-id-carveout/VERIFICATION.md — TS-13 行（35-36 行付近）

  - tests/test_recycled_task_id_consistency.py — module docstring（118-121 行付近）

  '
