lessons_candidates:
  - >-
    implementer が status: merged と merge_commit を報告したが、その merge commit は存在せず
    journal にも merged イベントが無く task branch も 1 コミットも進んでいなかった（task0003 初回）。
    implement-phase.md I.2.b step 1 の trust-but-verify（merge-base --is-ancestor）だけでは
    検出できなかった — task branch が起点から一切進んでいない場合、その branch は integration の
    ancestor に自明に該当してチェックを素通りする。orchestrator が merged 判定を出す前に
    「journal に当該 task の merged イベントが存在すること」と「報告された merge_commit が
    git cat-file で実在すること」を併せて確認する必要がある。この見落としで worktree を削除し、
    実装成果を失った。
  - >-
    上記の誤判定から復帰する際、journal の最終イベントが launched のままだったため
    queue_launch_guard.py が retry を deny した。orchestrator は journal を書けない規約なので、
    stop-tool recorder（queue_taskstop_net.py）を発火させるために完了済みエージェントへ
    TaskStop を発行して failed イベントを追記させる必要があった。この復帰経路は
    implement-phase.md の stale-launched caveat に記述はあるが、
    「orchestrator 自身の誤判定で in-flight でないのに launched が残った」ケースの手順としては
    明示されていない。
  - >-
    review の auto-fix 候補ゲートが critical/high に限定されているため、NFR4 違反
    （b4393fb2176068e4、medium）が review では deferred になり、その後 verify の TS13 として
    再検出されて rework 1 周を消費した。VERIFICATION.md のシナリオに直接紐づく medium finding は、
    review 時点で verify を落とすことが予見できる。review 段階で「この finding は
    VERIFICATION.md のどのシナリオを落とすか」を判定して昇格させる余地がある。
  - >-
    spec-writer / implementation-planner / rework-planner はいずれもシェル実行ツールを持たないため
    written_artifacts の sha256 を算出できず null を返した。3 ワーカーとも同じ警告を出しており、
    契約側で digest 算出を orchestrator の layer 5 責務として明記するか、ワーカーに
    ハッシュ手段を与えるかの判断余地がある。
  - >-
    rework-planner が written_artifacts に task0003.md を申告したが実際には書かれていなかった
    （1 回目）。layer 5 artifact validation（宣言ファイルの実在確認）が捕捉した。
    ワーカーの written_artifacts 申告は実在確認なしに信用できない。
  - >-
    implementation-planner の task0002.md の Files セクションが
    validate-worker-output.py の抽出規則（1 bullet に backtick 引用は 1 つだけ）に違反し、
    files-mismatch で validation エラーになった。plan-writing スキルまたは
    task-plan テンプレートにこの制約を明記すると初回で通せる。
