  title: サブシェルの後の構文を誤読し、対話起動の拒否を回避できる
  description: サブシェルを閉じた後も状態を「語の途中」に固定するため、有効な構文 `if (:) then case ...` の then と case を引数として扱う。続くパターンの `)` を置換の終端と誤認し、引用符の対応が崩れると、置換の外にある `python3 -i` に拒否を返さなくなる。変更前は拒否される入力で、両方のコピーに再現した。TB-1で防ぐ対象の対話プロセスが起動し、無人実行が停止する可能性がある。評価者の読解で再現手順を追跡し reproduced と判定した。comprehensive の finding と同じ根本原因で、同じ原因の誤拒否もあるため high に上げた。
  suggestion: サブシェルの終了と、語に含まれる置換の終了を区別し、複合コマンドの後の then／do を正しく認識する。両方のコピーを修正し、この構文の後にある対話起動を拒否する回帰テストを追加する。
  reproduction: tool_input.command に `echo "$(if (:) then case x in x) printf '%s' '"';; esac; fi)"; python3 -i` を設定したJSONを、各プラグインの codex-hook-interactive-guard.py の標準入力に渡す。両方とも終了コード0・標準出力なしとなり、拒否しない。変更前の find_deny は同じ入力に ('interactive', 'python3') を返す。bash と zsh の構文検査は成功する。実際の対話起動を避けて末尾の python3 -i を printf に置き換えると、その出力まで到達することも確認できる。
