  title: 複合構文の境界で命令位置を復元する
  description: '複合条件式の後の `then` や関数宣言後の `{` も引数扱いされ、続く `case` を認識できなくなる。その結果、パターンの `)` で置換を早く閉じ、引用符の解釈がずれて末尾の `python3 -i` を拒否しない。両コピーに同じ問題がある。評価者の読解: `_skip_substitution` は `]]` のような普通の語の後と、サブシェルの `)` を閉じた後（2209 行）に at_command を偽にし、`f()` の後の `{` も引数の位置で読む。`_read_command_word` は at_command が偽なら `then` / `{` を予約語と判定しない（2279〜2280 行）ので、続く `case` が文を開かず、パターンの `)` で置換が閉じる。変更前の `_at_command_position` は直前の `then` / `{` を見て case を開いていたので、同じ入力を拒否していた（変更による後退）。同じ原因で、置換の中で引用されている文字列を外のコマンドと読む誤拒否も起きる（読解による例: echo "$(f() { case x in x) echo "; python3 -i;";; esac; }; f)" は変更前は無出力、変更後は deny）。'
  suggestion: 複合条件式の終了と関数本体の開始を追跡し、構文上の境界と語の継続を区別して命令位置を更新する。具体的には、サブシェルの `)`・`]]`・`esac` など複合コマンドの閉じの後は予約語（`then` / `do` / `else` / `elif` / `{` など）だけを受け付ける状態にし、そこで読んだ予約語は次の語をコマンドの位置にする。`name()` と `function name` の後の `{` もコマンドの位置で読む。状態は定数サイズに保ち（NFR1）、普通の語の後の引数の `then` が case を開かない FR2 の振る舞いは保つ。再現例を両コピーに対する回帰テスト（CASES の deny 行）へ追加し、上の誤拒否の形も silent 行で固定する
  reproduction: null
