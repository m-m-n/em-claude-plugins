  description: 'HEAD_COPROC の次の普通の語を読んだ後、無条件にコマンドの位置へ戻している。zsh の有効な構文 `coproc echo case x in x` では、echo の引数の `case` を文の始まりと読み、_Undecidable になる。その結果、後ろの `python3 -i` を拒否せず、無人実行が入力待ちで止まりうる。em-workflow 側の同一実装にも影響する。評価者の読解（再現手順を追跡し reproduced）: 内側の文字列で、二重引用の中の `$(` から読み取りに入る。coproc で HEAD_COPROC になり、echo で at_command が真に戻り、case が文を開く。`x)` で項目の本体に入り、続く二重引用符が引用を開いたまま入力が終わって _Undecidable("substitution") になる。内側の文字列には最上位で読んだ改行が無くチェックポイントが無いので、判定するコマンドが残らない。外側の `zsh -c` は対話起動ではない。基準コミットの後ろ向きの判定では、`case` の前が `echo` なのでコマンドの位置にならず、`)` で置換が閉じて deny になっていた（後退）。bash は `coproc WORD` の後の予約語を受け付けるので、今の読み方は bash の文法とは一致する。直すにはシェルごとの読み分けが要る（comprehensive の coproc / repeat の finding と同じ根本原因）。'
  suggestion: coproc の通常コマンドと名前付き複合コマンドを、呼び出し元のシェルの構文に従って区別し、zsh では通常コマンドの引数をコマンドの位置に戻さない。シェルの分からない場合の扱いは SPEC（FR11）で決める。両方の実装に再現入力の回帰テストを追加する。
  reproduction: 標準入力に {"tool_input":{"command":"zsh -c 'echo \"$(coproc echo case x in x)\"; python3 -i'"}} を渡して python3 -B em-review/scripts/codex-hook-interactive-guard.py を実行すると、終了コード0、標準出力は空になり、deny が返らない。入力は main → find_deny → _scan → _skip_substitution に到達する。内側の文字列は zsh -n -c で構文検査に成功し、末尾の python3 -i だけを printf 'REACHED\n' に置換した安全な実行では REACHED が出力され、後続コマンドへの到達を確認できた
