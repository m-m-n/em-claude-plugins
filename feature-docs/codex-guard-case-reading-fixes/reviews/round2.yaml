  description: '`_empty_parens_end` は括弧の間の空白とタブしか読み飛ばさない。Bash は括弧の間のバックスラッシュと改行の対を取り除くので、`f(` と `)` の間に対を挟んだ関数定義は有効だが、ガードは空の `()` と認めない。その `(` はコマンドの位置で開いていない括弧として積まれ、`)` の後は語の続きになる。続く `{` と `case` が引数として読まれ、パターンの `)` で置換が早く閉じる。後ろの引用がずれて _Undecidable になり、両コピーとも後ろの `python3 -i` を拒否しない。基準コミットでは `case` の前の `{` を後ろ向きに見て文を開いたので deny だった（後退）。SPEC FR10 は「中は空白だけ」と書いており、FR1 / FR5 の、行継続の対を取り除いて判定する規則と揃っていない。評価者の読解で確認した。'
