  title: for の語一覧でコメントが引用として読まれる
  description: 'zsh の `for name (words)` の語一覧を、算術展開と同じ `a` のコンテキストとして積んでいる（`kind_char, close_command = "a", True`）。`a` のときは、`#` をコメントとして読む分岐（`elif top == "a"` より後ろにある）に届かない。このため語一覧の中のコメントにある引用符が引用を開き、置換の終わりを見失って _Undecidable になる。チェックポイントの無い文字列は何も判定されないので、後ろの `python3 -i` を拒否しない。基準コミットでは `(` を `p` として積み、空白の後の `#` をコメントとして読み飛ばしていたので deny になっていた（今回の変更による後退）。両コピーはバイト単位で同一で、同じ問題がある。評価者の読解: 仕組みはコードを読んで確認した。zsh の語一覧が改行とコメントを受け付ける点は zsh の文法の知識による判断で、実行しての確認はしていない。'
  suggestion: 語一覧では、語をコマンドの位置で読まない点だけを保ち、`#` のコメントと改行は `p` と同じに読む（`a` を流用せず、語一覧用の状態を持つ）。コメントに引用符を含む語一覧を、両コピーに流す CASES の deny 行として足す。
