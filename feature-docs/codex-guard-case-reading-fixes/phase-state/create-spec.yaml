    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids:
    - include_split
    freeform: null
    normalized_answer: 行継続は待ちフェーズの位置に加えて、case / in / esac の直後に付いた形と、キーワードを分断する形も読み飛ばしてキーワードとして読む
    resolution_note: batch policy create-spec.requirement-clarification codex_consultation（harness codex、1 turn）。Codex は include_split を推奨。両コピーへの JSON 入力で、直後の継続・分断の形が判定不能による拒否漏れ（in\<NL>, esac\<NL>, i\<NL>n,
      es\<NL>ac）と誤拒否（case\<NL>, ca\<NL>se）になることを確認。オーケストレーターが写像を判断し include_split を採用（拒否漏れを既知の残余として固定するより塞ぐ方が比較的良い）。Opus エスカレーションは不要
  design-step.decision:
    packet_id: create-spec-q0001
    answered_at: '2026-10-21T08:24:30+09:00'
    source: batch-decision-table
    answer_mode: single_select
    selected_option_ids:
    - decide_autonomously
    freeform: null
    normalized_answer: design step を省略する（analyst 推奨の skip。UI の無いフック解析処理の修正、デザインシステム候補ゼロ）
    resolution_note: batch policy create-spec.design-step decide_autonomously → analyst 推奨の skip
  requirement.loop-head-command-position:
    packet_id: create-spec-q0002
    answered_at: '2026-10-21T09:52:00+09:00'
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids:
    - include_bash_and_zsh_heads
    freeform: null
    normalized_answer: ループと coproc の頭（bash の for ((…)) の閉じ・for name / select name・coproc / coproc NAME、zsh の for name (words) の閉じ・repeat word）の後もコマンドの位置にする（FR11 を確定）
    resolution_note: 'batch policy create-spec.requirement-clarification codex_consultation（harness codex、1 turn）。Codex は include_bash_and_zsh_heads を推奨。task0001 前のコード（2a67e00d^）で 7 形（for ((…)) do / for
      x do / select x do / coproc { / coproc NAME { / for x (a) { / repeat 1 {）が deny、現行の両コピーでは無出力になることを実行で確認。for/select の名前は通常語として消費し、引数や引用語から頭の状態に入らないようにする必要があるとの注意あり。オーケストレーターが写像を判断し include_bash_and_zsh_heads
      を採用（同じ根本原因の拒否漏れの後退を残余として固定するより塞ぐ方が比較的良い。worker 推奨とも一致）。Opus エスカレーションは不要。不採用: findings_scope_only, include_bash_heads'
