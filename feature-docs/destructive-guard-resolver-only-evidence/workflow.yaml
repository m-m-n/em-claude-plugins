schema_version: 1
feature: destructive-guard-resolver-only-evidence
created: '2026-11-28'
base_branch: main
goal: |
  # destructive-guard: 置換本文の最終語を evidence にするため resolver でない形が誤爆する

  ## 現象
  `destructive-guard.py` の `read_command_name_evidence()` が置換本文の最終語だけを
  `body.split()[-1]` + `os.path.basename()` で読むため、本文中の任意の語が最終語の位置に
  来ただけでコマンド名 evidence として採用される。結果、resolver ラッパーではない置換頭部が
  `deny` に倒れる誤爆が 4 形ある。

  実測（HEAD で deny、基準版 a722550 では allow）:
  - `$(dirname /opt/rm) -rf <path>`
  - `$(ls -d /usr/bin/rm) -rf <path>`
  - `$(readlink -f ./rm) -rf <path>`
  - `$(basename /a/b git) clean -fd`

  FR11 が除外しようとした「本文中の任意の語が rm/git に一致しても evidence にしない」条件が、
  その語が最終語のときだけ通ってしまっている。

  ## 再現手順
  1. feature destructive-guard-command-name-substitution 適用後の destructive-guard.py に対し、上記 4 形を PreToolUse 入力として与える
  2. 判定が deny になることを確認する
  3. 基準版 a722550 の同ファイルに同じ入力を与えると allow になることを確認する

  ## 期待する挙動
  resolver 系ラッパー（which / command -v 等）の引数としてコマンド名が現れた場合だけを
  evidence として採用し、それ以外の複数語・演算子入りの本文は unreadable（= allow）として扱う。
  `$(dirname /opt/rm)` のような形は allow に戻る。

  ## 完了の定義
  - [ ] 上記 4 形が allow に戻る
  - [ ] `$(which rm) -rf <path>` / `$(command -v rm) -rf <path>` の検知は維持される
  - [ ] em-workflow/hooks/tests/destructive-guard-cases.json に上記 4 形と正規形の両方のケースが入っている
  - [ ] `python3 em-workflow/hooks/tests/run-destructive-guard.py` が全件通る
  - [ ] `python3 -m unittest discover -s tests` の失敗テスト ID 集合が base revision と一致する

  ## 該当箇所
  em-workflow/hooks/destructive-guard.py:1135 の read_command_name_evidence()。
  見逃し側（本文に区切り演算子やパイプを含む形、クォートでコマンド名を包んだ形）は基準版でも
  allow であり、FR3 が対象外と宣言している範囲。今回直すのは誤爆側のみ。
  fail-closed な ask への転換は NFR3 が禁じている（無人実行で ask は deny に降格するため）。

  ## 実害・発生条件
  dirname / basename / readlink / ls -d の出力をコマンド語に使う正常な操作が PreToolUse で止まる。
  無人実行では ask ではなく deny なので、その場で作業が止まる。
  由来: feature destructive-guard-command-name-substitution の review round 2、security 観点の指摘。
  severity medium のため auto-fix の候補ゲートに入らず、review_rework_count も cap 1 に達していたため同 feature 内では直せなかった。
