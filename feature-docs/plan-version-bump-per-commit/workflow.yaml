schema_version: 1
feature: plan-version-bump-per-commit
created: '2026-10-03'
base_branch: main
goal: '# em-workflow の rework タスクで version を上げない計画（IMPLEMENTATION.md D3）が plugin-version-guard と衝突し、implement が中断する


  ## 現象 (必須)

  em-workflow の rework タスク（task0002 / task0003）が em-workflow 配下のファイルを変更するのに、計画（`feature-docs/destructive-guard-heredoc-reset-hard/IMPLEMENTATION.md` の D3）は「rework タスクは version を上げない。guard に拒否されたら plan deviation として報告する」と定めている。

  一方、`~/.claude/hooks/plugin-version-guard.py` はコミット単位で「プラグイン配下を変えたのに `plugin.json` の version が上がっていない」コミットを拒否する。feature 全体で 1 回上げていても、各コミットの直前 HEAD との差分で判定するため通らない。

  結果:

  - task0002 の implementer は D3 に反して patch を上げてコミット・マージした（deviation として報告）

  - task0003 の implementer は D3 に従って上げず、`git commit` が拒否されて失敗した。batch の retry 1 回を使い切り、implement フェーズが中断した（`failed_kind: decision`）

  ## 再現手順 (必須)

  1. 同一 feature で em-workflow 配下を触るタスクを 2 つ以上計画し、計画で「version は最初のタスクだけが上げる」とする

  2. 後続タスクの implementer が version を上げずにコミットする

  3. plugin-version-guard に拒否される

  ## 期待する挙動 (必須)

  create-plan / rework-planner が plugin-version-guard の判定単位（コミットごと）を前提に version の扱いを計画する。並列タスクが同じ version 行で衝突しない方法（例: 各タスクが上げてマージ時に親側採用、または version 上げを専用の後続タスクに分ける）を計画段階で決め、implementer が guard と矛盾する指示を受けない。

  ## 完了の定義 (必須)

  - [ ] 再現手順で現象が起きない

  - [ ] 再発を検出するテストがある

  ## 該当箇所 (任意)

  - `em-workflow/skills/plan-writing/SKILL.md` / rework-planner の計画規則（version の扱い）

  - `feature-docs/destructive-guard-heredoc-reset-hard/IMPLEMENTATION.md` D3（integration ブランチ `em-workflow/destructive-guard-heredoc-reset-hard/integration`）

  - `~/.claude/hooks/plugin-version-guard.py`

  ## 実害・発生条件 (任意)

  em-workflow 自身を対象にした batch 実行で、同じプラグインを触るタスクが複数あると implement が止まる。destructive-guard-heredoc-reset-hard では task0003 の実装・テストは完成済み（worktree に staged のまま）だが未マージ。

  '
