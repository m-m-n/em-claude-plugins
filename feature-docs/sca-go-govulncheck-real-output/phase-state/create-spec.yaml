  requirement.go-stream-validity:
    question_id: requirement.go-stream-validity
    packet_id: null
    source: batch-codex-consultation
    answer_mode: freeform
    selected_option_ids: []
    freeform: require_config_object
    normalized_answer: 'require_config_object: stdout is a valid completed stream iff it parses as a JSON
      object stream and contains at least one top-level {"config": {...}} object; otherwise go_unparseable_output.
      A valid stream with no finding objects is clean (completed). The existing empty-output check (go_empty_output)
      keeps precedence, unchanged.'
    resolution_note: 'Orchestrator-raised clarification from Codex turn-1 GAPS. Options: require_config_object
      / any_object_stream / parse_only. Codex (run_codex_exec.sh readonly, entry codex, turn 2) chose
      require_config_object (scan-dependencies.py:1129; govulncheck protocol makes config mandatory).
      Turn-2 GAP on precedence vs go_empty_output resolved by the orchestrator as preserving the existing
      order (scan-dependencies.py:1117). Opus escalation not run.'
    answered_at: '2026-10-04T22:35:00+09:00'
  requirement.go-cvss-vector-selection:
    question_id: requirement.go-cvss-vector-selection
    packet_id: null
    source: batch-codex-consultation
    answer_mode: freeform
    selected_option_ids: []
    freeform: max_valid_v3
    normalized_answer: 'max_valid_v3: consider every OSV top-level severity[] entry of type CVSS_V3 whose
      vector starts with CVSS:3.0/ or CVSS:3.1/ and is parsed by _cvss_severity_band; take the highest
      band. CVSS_V4 and other types are ignored (undetermined if none).'
    resolution_note: 'Orchestrator-raised clarification from Codex turn-1 GAPS. Options: max_valid_v3
      / first_valid_v3. Codex (run_codex_exec.sh readonly, entry codex, turn 2) chose max_valid_v3: first-only
      depends on array order and can miss high+ (scan-dependencies.py:1383, :1246). Opus escalation not
      run.'
    answered_at: '2026-10-04T22:35:00+09:00'
  requirement.go-fixed-version-scope:
