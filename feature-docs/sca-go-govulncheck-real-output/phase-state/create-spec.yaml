answers:
  requirement.go-severity-undetermined:
    question_id: requirement.go-severity-undetermined
    packet_id: create-spec-q0001
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids:
    - cvss_then_count
    freeform: null
    normalized_answer: 'cvss_then_count: severity band from a CVSS v3 vector when present; otherwise the
      advisory is left out of findings and direct ones are counted in a counts-only summary note (go_severity_undetermined),
      pip-aligned; skipped/skip_reason stay completion-only.'
    resolution_note: 'Codex (run_codex_exec.sh readonly, entry codex, turn 1) chose cvss_then_count: skip
      would violate the completion-only meaning of skipped, and report-as-high asserts an unsourced severity
      (scan-dependencies.py:2333, vuln-scanners.yaml:71). Matches analyst recommendation. Orchestrator
      adopted. Opus escalation not run.'
    answered_at: '2026-10-04T22:35:00+09:00'
  requirement.go-stdlib-directness:
    question_id: requirement.go-stdlib-directness
    packet_id: create-spec-q0001
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids:
    - treat_as_direct
    freeform: null
    normalized_answer: 'treat_as_direct: stdlib/toolchain findings pass direct_only, subject to the same
      severity rule.'
    resolution_note: 'Codex (run_codex_exec.sh readonly, entry codex, turn 1) chose treat_as_direct: transitive
      would drop even determined high+ stdlib advisories; separate count bypasses the normal finding route
      (scan-dependencies.py:1244, vuln-scanners.yaml:72). Orchestrator adopted. Opus escalation not run.'
    answered_at: '2026-10-04T22:35:00+09:00'
  requirement.go-finding-granularity:
    question_id: requirement.go-finding-granularity
    packet_id: create-spec-q0001
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids:
    - dedupe_per_osv_module
    freeform: null
    normalized_answer: 'dedupe_per_osv_module: all finding objects for the same OSV id and module within
      one scan unit collapse into one scan finding; reachability judgment stays with R3a. Dedupe and undetermined
      counts are per project unit; findings across projects are kept.'
    resolution_note: Codex (run_codex_exec.sh readonly, entry codex, turn 1) chose dedupe_per_osv_module
      (scan-dependencies.py:1222, review-phase.md:241); turn-1 GAPS added per-project dedupe scope (scan-dependencies.py:2416).
      Orchestrator adopted. Opus escalation not run.
    answered_at: '2026-10-04T22:35:00+09:00'
  requirement.go-real-capture-source:
    question_id: requirement.go-real-capture-source
    packet_id: create-spec-q0001
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids:
    - capture_during_implementation
    freeform: null
    normalized_answer: 'capture_during_implementation: during implementation, run real govulncheck -json
      (go run golang.org/x/vuln/cmd/govulncheck@<pinned version>) against a minimal Go module requiring
      a known-vulnerable dependency version; save stdout verbatim (machine-local absolute paths replaced
      by placeholders) under tests/; tests replay it offline. If capture is impossible the task reports
      blocked rather than hand-crafting.'
    resolution_note: Orchestrator verified go 1.27.1 installed, govulncheck not on PATH, proxy.golang.org
      and vuln.go.dev reachable. Codex (run_codex_exec.sh readonly, entry codex, turn 1) chose capture_during_implementation
      over upstream testdata (licensing/attribution) and handmade fallback (re-introduces invented fields)
      (feature-docs/review-sca-axis/tasks/task0008.md:122, tests/test_sca_per_project_scan_binding.py:27).
      Orchestrator adopted. Opus escalation not run.
    answered_at: '2026-10-04T22:35:00+09:00'
  requirement.go-synthetic-shape-retention:
    question_id: requirement.go-synthetic-shape-retention
    packet_id: create-spec-q0001
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids:
    - drop_synthetic_shape
    freeform: null
    normalized_answer: 'drop_synthetic_shape: the go path accepts only the govulncheck stream; a single-object
      {vulns} payload becomes go_unparseable_output; GO_PAYLOAD and go stubs in test_sca_per_project_scan_binding.py
      switch to a real no-vulnerability stream.'
    resolution_note: 'Codex (run_codex_exec.sh readonly, entry codex, turn 1) chose drop_synthetic_shape:
      the test-only shape is how the defect stayed hidden (scan-dependencies.py:1204, tests/test_sca_scan_normalization.py:504).
      Orchestrator adopted. Opus escalation not run.'
    answered_at: '2026-10-04T22:35:00+09:00'
  requirement.go-mod-unreadable:
    question_id: requirement.go-mod-unreadable
    packet_id: create-spec-q0001
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids:
