  title: 'TM-4: 引用符付きのモジュールパスのエスケープを復元しないため、直接依存の脆弱性が消える'
  description: _go_mod_unquote は引用符を外すだけで、Go の解釈付き文字列のエスケープ（\x、\u、\U、8進数）を復元しない。Go の modfile は strconv.Unquote で復元するため、require "golang.org\x2fx/text" v0.3.6 は Go では golang.org/x/text の直接依存になるが、_go_mod_direct_modules は golang.org\x2fx/text のまま集合に入れる。直接依存の脆弱性が検出結果にも重大度不明の件数にも入らず、skipped false のまま消える。FR3 / TM-4 の対策が一部しか満たされていない。
  suggestion: 二重引用符のトークンを Go の解釈付き文字列の規則で復元する（バッククォートはそのまま）。\x74、\u0074、\U00000074、\164 を含む require を単独行とブロックの両方でテストに加える。
  sources:
  - codex:security
  - codex:comprehensive
  confidence: 100
  resolution: unresolved
  resolution_reason: medium severity; outside the auto-fix candidate gate (critical/high only)
- stable_id: c4755c14bcfae1df
  severity: medium
  category: security
  file: em-workflow/scripts/scan-dependencies.py
  line: 2088
  title: 'TM-4: indirect の判定で使う空白の範囲が Go と違い、制御文字で直接依存を間接扱いにできる'
  description: _go_mod_comment_marks_indirect は comment.split() を使い、Python は \x1c-\x1f を空白扱いする。Go の isIndirect（strings.Fields / unicode.IsSpace）はこれらを空白として扱わないため、"// indirect\x1f" は Go では直接依存、このスクリプトでは間接依存になり、直接依存の脆弱性が消える。
  suggestion: コメントを単語に分ける文字を Go の unicode.IsSpace と同じ集合に限り、// indirect\x1f / \x1c のケースを単独行とブロックの両方でテストに加える。
  sources:
