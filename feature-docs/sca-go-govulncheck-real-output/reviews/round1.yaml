  file: em-workflow/scripts/scan-dependencies.py
  line: 2204
  title: replace で別のモジュールに置き換えた直接依存の脆弱性が消える
  description: replace がある場合、govulncheck は trace に置き換え後のモジュールパスを出す（評価者はオフライン再確認していない）。direct_modules には require の置き換え前パスしか入らないため、require example.org/text v0.3.6 + replace example.org/text => golang.org/x/text v0.3.6 で golang.org/x/text の脆弱性が検出結果にも重大度不明の件数にも入らない。FR3 は replace を「何も寄与しない」と定めており、修正は FR3 を補う形になる。
  suggestion: replace を単独行とブロックの両方で読み、置き換え元が非 indirect の require と一致したら置き換え後のパスも直接依存に加える（ローカルパスへの置き換えは除く）。回帰テストを加える。
  sources:
  - codex:comprehensive
  confidence: 55
  resolution: unresolved
  resolution_reason: medium severity; outside the auto-fix candidate gate (critical/high only)
