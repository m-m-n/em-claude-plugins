schema_version: 1
feature: sca-go-govulncheck-real-output
created: '2026-10-04'
base_branch: main
goal: |
  # SCA 軸: Go の経路が合成 fixture でしか検証されておらず、実 govulncheck 出力では findings が 0 件になる

  Notion タスク: https://www.notion.so/3d43509ec8ee812987b2c77da7cfc1e9 (種別: バグ)

  ## 現象
  `_merge_govulncheck_stream` は severity を `osv['database_specific']['severity']` から読んでいる。これは GitHub Advisory Database の慣習で、govulncheck が唯一出力元とする Go vulnerability database のエントリは `database_specific: {'url': ...}` を持ち、CVSS の severity を公開していない。
  結果、実際の finding すべてで severity が `None` になり、`_map_severity` が `None` を返し、`_passes_threshold` が `False` を返して、Go の advisory は全件破棄される。それでも `run_scan` は `skipped: false` / `skip_reason: null` を報告する。
  directness も同様に不健全で、`is_direct = len(trace) == 1` はモジュールレベルの finding に対して `go.mod` の内容と無関係に真になる。
  テストスイートからは見えない。`GO_FIXTURE` が合成オブジェクトで、最初から `severity: 'high'` と `is_direct: true` を持っているため。

  ## 再現手順
  1. 実際に脆弱性を持つ Go プロジェクトに対して `govulncheck -json` を実行し、その出力を `scan-dependencies.py` の Go 正規化に流す
  2. findings が 0 件、`skipped: false`、`skip_reason: null` で返る

  ## 期待する挙動
  - severity は govulncheck が実際に出力するもの（OSV のトップレベル `severity` 配列の CVSS ベクタを `_cvss_severity_band` に通す）から導出する。または pip の経路と同様に `go_severity_undetermined` のカウントを明示的に出す
  - severity が確定できないことを「閾値未満」として扱わない
  - directness は trace の長さではなく `go.mod` の require ブロックに対して解決する
  - `GO_FIXTURE` を実際の `govulncheck -json` ストリームのキャプチャに差し替える

  ## 完了の定義
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある（実 govulncheck 出力のキャプチャを fixture に使う）

  ## 該当箇所
  `em-workflow/scripts/scan-dependencies.py:1019`（`_merge_govulncheck_stream`）、`GO_FIXTURE`

  ## 実害・発生条件
  Go プロジェクトに対する SCA 軸が常に「脆弱性なし」を返す。skip としても報告されないため、軸が機能していないことに気づけない。

  出典: em-workflow レビュー round 2 の finding `7de239a2d3ce0706`（severity: high）。無人実行の rework cap 到達により deferred になった残件。関連 PR: https://github.com/m-m-n/em-claude-plugins/pull/27

  ## 追加指示（起動時）
  - 実装完了後、integration ブランチを remote に push し、gh pr create で base_branch への PR を作成する。integration ブランチはローカル・リモート双方に残す（base_branch へ自動マージしない）
  - 不明点は Codex に相談し、比較してより良いと判断した選択肢を採用する
  - その議論の内容を Notion に記録する
