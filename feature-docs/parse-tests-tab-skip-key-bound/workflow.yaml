schema_version: 1
feature: parse-tests-tab-skip-key-bound
created: '2026-10-11'
base_branch: main
goal: |
  # tests_yaml_id_resolution の parse_tests で、tests キーより浅いタブ行の続き行を読み飛ばすと後続の兄弟フィールドまで消える

  Notion: https://www.notion.so/3f53509ec8ee81238bd9ff8c6df15dd2

  ## 現象 (必須)
  記録検査 `tests/test_tests_yaml_id_resolution.py` の `_RecordParser.parse_tests` で、最初の項目より前の走査にある続き行の読み飛ばしが `skip_deeper(f + 1, tab_indent, limit)` になっていて、タブ行の深さだけを境界にしている。タブ行が `tests` キーより浅い場合（キー 4 空白・タブ行 3 空白）、続き行（6 空白）の後にある、キーと同じ深さの行（2 つ目の `tests` キーや 4 空白のダッシュ項目）まで報告なしで読み飛ばす。
  feature `parse-tests-tab-skip-deeper` の review round 1（comprehensive 観点、medium、stable_id `de3d176ac910fc8f`、未解決）で見つかった指摘。
  ## 再現手順 (必須)
  1. `extract_text` に次の 6 行を渡す: `acceptance_tests:` / `  AC-1:` / `    tests:` / 3 空白 + タブ + `- tests.nope.bad` / 6 空白 + `continued` / `    tests: [tests.nope.second]`
  2. 変更前（`parse-tests-tab-skip-deeper` 以前）は `tests.nope.second` が抽出され `duplicate tests key` も報告されたが、変更後はエラーがタブ（4 行目）と deeper（5 行目）の 2 件だけになり、2 つ目の tests キーとその ID が消える
  ## 期待する挙動 (必須)
  - 読み飛ばしの境界を `max(tab_indent, key_indent)` にし、キーと同じ深さの行は読み飛ばさずに残す
  - docstring とコメントの「the lines deeper than that tab line are passed over」を、タブ行と `tests` キーの両方より深い行を読み飛ばす意味に直す
  ## 完了の定義 (必須)
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある（`TestTabLinesInTestsBlock` に、キーより浅いタブ行・続き行・キーと同じ深さの 2 つ目の `tests` キーとダッシュ項目を組み合わせたケース）
  ## 該当箇所 (任意)
  `tests/test_tests_yaml_id_resolution.py:644`（`_RecordParser.parse_tests` の最初の項目より前の走査）
  ## 実害・発生条件 (任意)
  タブを含む誤った記録を書き、かつタブ行が `tests` キーより浅いときだけ起きる。記録検査はタブのエラーで失敗するのですり抜けは無いが、後続の ID の抽出・解決エラーが報告から抜ける。SPEC FR1 の文言（直前のタブ行より深い後続行を読み飛ばす）がこの場合を想定していなかった抜けでもある。
