schema_version: 1
feature: unattended-merge-medium-fixes
created: '2026-11-01'
base_branch: main
goal: |
  # unattended-merge のレビュー 2 回目で残った medium 指摘 5 件を直す

  ## 現象 (必須)

  feature `unattended-merge`（em-workflow の merge スキル）のレビュー 2 回目で、medium の指摘が 5 件残った。無人実行の auto-fix は critical / high だけが対象のため、未対応のまま残っている。

  1. ローカルルートの最終 `git merge` がブランチ名で解決し直すため、検証済みの `head_sha` に束縛されていない（stable_id `1eef55acf9af50c3`）
  2. 検証コマンドが空のとき worktree へ移動しないため、検証後の HEAD 確認がメイン作業ツリーで走り、`verification_failed` で止まる（stable_id `7eab3d538629cc4f`）
  3. ロック取得後にマージ済みかどうかを判定し直していないため、並行走行で冗長なマージコミットや誤った結果になる（stable_id `2d0a436389ac8c32`）
  4. preflight の承認照合が bash_guard.py と同じ前後空白の除去をしていないため、前後に空白のあるコマンドが常に `commands_unapproved` になる（stable_id `9696fea33b723122`）
  5. `cmd_repo` がホストを含めずにリポジトリを比較するため、ホストが異なる同名リポジトリを同一と判定する（THREAT-MODEL TM-11、stable_id `c442ee13154b13c7`）

  あわせて、architecture と spec の観点はレビュー対象が大きすぎてレビュアーが走っていない（`review_data_too_large`）。

  ## 再現手順 (必須)

  1. 各指摘の詳細と再現条件は、integration ブランチの `feature-docs/unattended-merge/reviews/round2.yaml` の findings にある
  2. 5 の再現: `merge-pr.py` の `cmd_repo` で、remote の URL を `https://ghe.example/acme/service.git`、gh の既定先を github.com の `acme/service` にすると、`remote_unresolved` ではなく `{"outcome":"github","repo":"acme/service"}` が返る

  ## 期待する挙動 (必須)

  1. 最終マージの直前にブランチの先端が `head_sha` と一致することを確かめ、マージ後に第 2 親が `head_sha` であることを確かめる
  2. commands の有無にかかわらず、HEAD 確認の直前に worktree へ移動する
  3. ロック取得後に同じ integration の先端でマージ済み判定をやり直し、マージ済みなら後片付けへ進む
  4. 承認の照合は前後空白を除いた値で行い、出力するコマンド文字列は元のまま保つ
  5. ホストと owner/name の両方を比べ、不一致なら `remote_unresolved` で止める。後続の gh 呼び出しにホスト付きの識別子を渡す

  ## 完了の定義 (必須)

  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある
  - [ ] architecture / spec 観点のレビューを、対象を分割して実施する

  ## 該当箇所 (任意)

  - `em-workflow/skills/merge/SKILL.md:487`
  - `em-workflow/skills/merge/SKILL.md:355`
  - `em-workflow/skills/merge/SKILL.md:199`
  - `em-workflow/scripts/merge-preflight.py:449`
  - `em-workflow/scripts/merge-pr.py:349`

  ## 実害・発生条件 (任意)

  1 と 3 は走行外からの並行書き込みや同じ feature の並行走行があるときだけ起きる。2 は検証コマンドの無い feature で毎回起きる。4 は前後に空白を持つコマンドで毎回起きる。5 は git remote と gh の既定ホストが食い違う環境だけで起きる。
