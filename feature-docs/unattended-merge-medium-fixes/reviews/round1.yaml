  title: ロック取得後の再判定が事前判定時の先端を使うので、別の走行が base を取り込んでからマージした場合に internal_error になる
  description: 手順 6 の 4 の PR ルートは、resolve に事前判定時の integration_tip を渡している。merge-pr.py の resolve は、head が --integration-tip と異なる MERGED の PR を判定から外す（docstring 37 行、cmd_resolve 517-521 行）。FR3 が想定するのは「ロックを待っている間に、別の走行がマージを済ませた」場面。その走行が手順
    8 で base を取り込み、先端を T1 から T2 に進め、T2 で PR をマージしていたとする。するとこの走行の再判定は T1 で none を受け取り、already_merged ではなく internal_error で終わる。マージ側には倒れないので NFR2 は保たれる。ただし THREAT-MODEL の TM-6 が挙げる「wrong result」は、base が進んでいた場合には防げていない。SPEC
    の FR3 と Data Flow が --integration-tip <integration_tip> を指定しているので、実装は仕様の文言どおり。tests/test_merge_skill_doc.py の AC4 のテストは、この場面を扱っていない。
  suggestion: held を得た後、再判定の前に git rev-parse --verify refs/heads/em-workflow/<feature>/integration で現在の先端を読む。値は、検証した 40 桁の小文字 16 進だけを使う。その値を --integration-tip に渡す。読めない場合と none の場合は、従来どおり internal_error
    にする。再判定に使う先端がロック取得後に読んだ値であることを確かめる文書テストを足す。SPEC FR3 の「同じ integration の先端」をこう解釈したことを、この feature の文書に記録する。
