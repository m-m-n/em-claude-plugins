- stable_id: d17e1a08d32875cf
  severity: medium
  category: security
  file: em-workflow/scripts/merge-preflight.py
  line: 465
  title: str.strip() は Bash が区切りとしない空白まで除くため、未承認の実行ファイルが承認される
  description: check_approval は command.strip() の値で照合する。一方、approvable が生の値で除外するのは LF と CR だけ（408-417 行）。Python の str.strip() は U+00A0、U+000B、U+000C、U+001C-U+001F、U+0085、U+2000 系なども除くが、Bash が語の区切りにするのはスペースとタブだけ。承認済みが
    /usr/bin/true のとき、test_command を「U+00A0 + /usr/bin/true」にすると proceed になり、元の文字列がそのまま commands[].command に載る。手順 10 でこのコマンドが実行されるとき、bash_guard.py もフックの入口（448 行）と is_cd_prefixed_approved（336 行）で同じ strip
    をしてから照合するので allow する。その結果、Bash は worktree 相対の <U+00A0>/usr/bin/true を実行する。変更前は完全一致で照合していたので、この値は止まっていた。新しいテスト test_fr4_ac3_preflight_agrees_with_bash_guards_own_approval_decision は、no-break space や
    U+000C / U+000B を前後に付けた値を「承認」として固定している。THREAT-MODEL の TM-1 は「hook judges the exact string that runs」を前提にしているが、この差によってその前提は成り立たない。コードを読んで再現を確認した（reproduced）。high から medium に下げた理由は 3 つ。(1) 実行時の関門である bash_guard.py（as-6
    で変更対象外）は、以前から同じ入力を allow している。(2) 悪用できるのは、先頭の語に / を含み、リポジトリの外の実行ファイルを指す承認コマンドだけ。make test のように PATH で解決するコマンドは <U+00A0>make が見つからず失敗する。リポジトリ内のスクリプトや Makefile を走らせる承認コマンドは、もともとリポジトリの中身を実行する。(3) SPEC
    の FR4 と TS5 が、str.strip() を使うことと bash_guard.py の判定と一致することを明示している。
  suggestion: 照合は FR4 のとおり str.strip() のまま保つ。そのうえで、改行・CR と同じく生の値で approvable を判定し、前後の空白にスペース・タブ以外を含む値（command.strip() と command.strip(' \t') が異なる値）は承認不可として commands_unapproved で止める。これで preflight は bash_guard.py
    より厳しくなるが、NFR2（fail-closed）の向きに沿う。TS5 の一致テストのうち no-break space と form feed / vertical tab のケースは、preflight が止まることを期待する形に改める。U+00A0 を前に付けた絶対パスが承認されないテストも足す。この除外を THREAT-MODEL の TM-1 に書き足す。bash_guard.py
    側にある同じ弱さは as-6 により今回は直せないので、別の feature への持ち越しとして記録する。
  reproduction: ファイルを変更せず、承認一覧をメモリ上で {'/usr/bin/true'} に差し替え、test_command が '\u00a0/usr/bin/true' の文書を check_approval に渡した。承認され、元の文字列が返ることと、同じ入力に bash_guard が allow を返すことを確認した。その文字列を Bash に渡すと、承認済みの /usr/bin/true
    ではなく、U+00A0 で始まる相対パスの実行を試み、ファイルがないため終了コード127になった。攻撃者が作業ツリーの <U+00A0>/usr/bin/true に実行可能ファイルを含めれば、そのファイルが実行される。通常の /usr/bin/true は終了コード0だった。
