    13.3 の integration ブランチ移動（SKILL.md:522）でも verification_failed を出す。git_failed（merge-result.md:103）は『fetch / worktree add / 衝突でない merge 失敗 / merge abort』と列挙している。SKILL はこれ以外にも、手順 9 の commit 失敗、手順 10 と
    13.3 の git status / rev-parse の失敗で使う。remote_unresolved（merge-result.md:85）には、ホストの形が不正な場合（medium-fixes FR5）が無い。SKILL.md:649-682 は同じ 28 コードの表を別に持ち、更新されているのはそちらだけ。dispatcher が契約文書の条件をもとに reason を解釈すると、ブランチの移動（再試行で収まる競合）をテスト失敗と読み違える。
