  title: 事前判定が見た integration の先端と、取り込み・検証・マージする先端が結び付いていない
  description: 手順 2 の merge-preflight.py は integration_tip（T1）の workflow.yaml と review 記録で FR4/FR5 を判定し、commands もそこから取る。一方、手順 7・8 は worktree の現在の HEAD を取り込み元にする。merge-git.py integrate（merge-git.py:479-484）は、worktree
    HEAD が refs/heads/<branch> と一致することしか確かめない。手順 8 は出力の head をそのまま head_sha にする。integration_tip との照合はどこにも無い。このため、preflight の後に integration ブランチが T2 へ進むと、FR4/FR5 を判定していない T2 が検証・push・マージされる。medium-fixes
    FR1 はローカルマージを head_sha に束縛したが、head_sha そのものは integration_tip に束縛されていない。加えて、手順 6.4（SKILL.md:201）は『先端は手順 4 / 5.2 と同じ integration_tip』と書いている。しかしローカルルートの merge-git.py merged（merge-git.py:350-359）は先端を引数に取らず、その時点の
    refs/heads を読む。medium-fixes FR3 の『同じ integration の先端で判定し直す』と記述が食い違う。fail-closed（medium-fixes NFR2）に反する向きの隙間になる。起きるのは、preflight の後に integration ブランチを動かす並行の書き手がいる場合に限られる。
  suggestion: 手順 8 の前（または integrate の中）で、取り込み前の worktree HEAD が integration_tip と一致することを確かめ、異なれば止める。例として、integrate に期待する先端を渡す引数を足し、不一致なら stop にする。手順 6.4 のローカル再判定も integration_tip と照合する形にするか、SKILL.md:201
    の記述を実際の挙動に合わせて直す。
