  file: tests/test_merge_pr.py
  line: 219
  title: Fixture git calls inherit the caller's GIT_DIR / GIT_WORK_TREE / GIT_INDEX_FILE, so per-test repository isolation (NFR5) depends on the environment
  description: MergePrTestCase.setUp builds self.env and self.real_env from os.environ (lines 219-233). It removes only GH_REPO, GH_TOKEN, GITHUB_TOKEN and EM_WORKFLOW_MERGE_PR_GH_TIMEOUT. Every fixture
    call is `git -C <tmp>/project ...` run with that environment, and a GIT_DIR already set in the environment overrides the repository lookup that -C depends on. If the suite runs with GIT_DIR (or GIT_INDEX_FILE)
    set, setUp's git config / commit write to the caller's real repository instead of the temporary one. tests/test_merge_preflight.py deletes every GIT_* key before building its fixtures. GIT_CONFIG_GLOBAL
    is also not pinned. Nothing in the current workflow runs the suite from a git hook, so the trigger is conditional.
  suggestion: In MergePrTestCase.setUp, remove every key starting with GIT_ from self.env before adding the test values, as test_merge_preflight.py does. Set GIT_CONFIG_GLOBAL to os.devnull next to GIT_CONFIG_NOSYSTEM.
  reproduction: null
