    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids:
    - script_reads_only
    freeform: null
    normalized_answer: スクリプトの --repo（merge-pr.py resolve/state、merge-ci-wait.py）にだけ
      HOST/OWNER/NAME を渡す。gh pr create / gh pr merge は既定リポジトリのまま（ホストまで一致を確認済み）
    resolution_note: 'gate create-spec.requirement-clarification; policy action codex_consultation;
      codex(1 turn) suggested script_reads_only: merge_pr_allow.py:72 の正規形に --repo
      を足すと許可条件の変更になる。merge-pr.py:340 の比較をホスト込みにすれば書き込み側の宛先も担保される; orchestrator mapped
      to script_reads_only (agrees with worker recommendation); opus escalation not
      run'
