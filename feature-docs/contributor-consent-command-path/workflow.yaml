schema_version: 1
feature: contributor-consent-command-path
created: '2026-11-10'
base_branch: main
goal: |
  # contributor-consent スキルが提示するコマンドに未解決の ${CLAUDE_PLUGIN_ROOT} が残っていて同意記録ができない

  ## 現象 (必須)

  `skills/contributor-consent/SKILL.md`（em-workflow / em-review 両コピー、88-110 行付近）の step 5 が、ユーザーが自分の端末で実行する手順として次の形のコマンドを逐語提示している。

  `python3 "${CLAUDE_PLUGIN_ROOT}"/hooks/muse_guard.py --record ...`

  `CLAUDE_PLUGIN_ROOT` は Claude Code がプラグイン実行時に設定する変数で、ユーザー自身のシェルでは未設定。貼り付けると `python3 /hooks/muse_guard.py ...` に展開されて失敗する。同意ストアへ記録する経路はこの CLI しか無いため、同意付与が実運用で成立しない。

  ## 再現手順 (必須)

  1. `/em-workflow:contributor-consent`（または em-review 側）を実行し、step 5 が提示するコマンド行をコピーする
  2. 自分の端末（Claude Code の外）でそのまま貼り付けて実行する
  3. `python3: can't open file '/hooks/muse_guard.py'` 相当のエラーで失敗する

  ## 期待する挙動 (必須)

  提示するコマンド行が、ユーザーの端末にそのまま貼って動く形になっていること。プラグインの実体パスを解決済みの絶対パスで埋めて提示するか、環境変数に依存しない解決手段を案内する。

  ## 完了の定義 (必須)

  - [ ] 再現手順で現象が起きない（提示された行をそのまま貼って同意が記録できる）
  - [ ] 再発を検出するテストがある（`tests/test_contributor_consent_skill.py` を「特定の文言」ではなく「提示行に未解決の環境変数参照が残っていないこと」を検査する形に変える）
  - [ ] em-workflow / em-review の両コピーに同じ修正が入っている
  - [ ] 両プラグインの version を bump した

  ## 該当箇所 (任意)

  `em-workflow/skills/contributor-consent/SKILL.md:97` および `em-review/skills/contributor-consent/SKILL.md` の同一箇所

  検出: review round 3 の finding `ec05dc7aa23bc46f`（high, comprehensive）

  ## 実害・発生条件 (任意)

  muse-spark-contributor tier の同意を付与しようとするすべてのユーザー。同意ストアへの唯一の書き込み経路が塞がっているため、機能全体が使えない状態になる。

  PR #28（https://github.com/m-m-n/em-claude-plugins/pull/28）の無人実行では review rework cap（1）到達により deferred のまま残った。verify フェーズが両コピーを読んで事実であることを独立に確認済み。VERIFICATION.md の TS/SC のいずれにも抵触しない（AC-12 と TS-18 は文書構造の基準）ため verify は pass のまま通っている。
