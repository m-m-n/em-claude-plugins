  description: FR2 (a) は開いた書き方だが、Condition は `stopped as git_failed after a git command failure, a launch
    failure, a timeout or reaching the script-wide time limit, in ...` と閉じた列挙になり、integrate は `running
    fetch or a non-conflict merge` だけになっている。em-workflow/scripts/merge-git.py の cmd_integrate には、worktree
    状態が clean でない Stop、HEAD が integration ブランチの先端でない、ローカルに base が無い、祖先判定の merge-base 失敗、マージ結果の親が想定と違う、unmerged_paths
    の git diff 失敗、コンフリクト中に先端が変わった、という列挙外の git_failed の経路が残る。手順 12 の redo から手順 8 へ戻る経路で worktree 状態の Stop
    に到達しうるが、その detail は Reason codes のどの条件にも対応しない。
  suggestion: 'git_failed の Condition を閉じた列挙から開いた形に直す（例: `a merge-git subcommand stopped as git_failed,
