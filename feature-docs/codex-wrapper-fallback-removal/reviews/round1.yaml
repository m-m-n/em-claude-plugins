      equals the new pinned value exactly. The defect is the missing declaration, not the
      code: VERIFICATION.md's change-set containment check compares the observed change
      set against the declared one, so this file is an undeclared entry at that gate.
    suggestion: >-
      Add "tests/test_reviewer_roles_protocol.py" to the `files` list of the task that
      caused the re-pin (task0002), so the observed change set is contained in the
      declared set at verification time. Do not revert the hash value — it is correct.
