  - id: verify
    status: completed
    completed_at_commit: eaea7ef5891ca5ae2564ecbb4c2a6ffc488d492a
    result: pass
    failed_items: []
    summary: >-
      test: python3 -m unittest discover -s tests -> 1412 tests, OK (exit 0).
      queue_stop_guard 単体では 16 クラス 41 テストが green（TS1-TS11 に対応する
      RealLayoutAncestorWalk / Freshness / LayoutIsolation / SingleDerivation /
