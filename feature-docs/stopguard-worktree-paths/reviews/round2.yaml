    title: 列挙ルートの上方向探索に信頼境界がなく、プロジェクト外・共有書き込み可能な祖先にバインドしうる
    description: >-
      `find_worktrees_root()` は `os.getcwd()` からファイルシステムルートまで無制限に遡り、
      最初に見つかった `.claude/worktrees/em-workflow` をそのまま列挙ルートにする。
      所有者チェックもリポジトリ境界での打ち切りもマウント境界での停止もない。
      cwd が共有書き込み可能なツリー配下にある場合、同一ホストの別ユーザーが
      `/tmp/.claude/worktrees/em-workflow/<f>/integration/feature-docs/<f>/workflow.yaml` と
      journal を仕込むだけでそのツリーが列挙ルートになり、(1) 攻撃者配下のファイルを読み、
      (2) `write_sidecar()` が攻撃者ディレクトリに書き、(3) BLOCK の stderr が
      オーケストレーターのコンテキストへ差し戻される。単一ユーザー機では悪用不可で、
      共有ホスト / CI を前提とした指摘。round 1 の 7b7f078c1177e6db の再掲（当該サイトは
      今回の diff でも未変更）で、所有権フィルタでは塞がらない。
    suggestion: >-
      上方向探索に信頼境界を入れる。(a) 各祖先と発見した worktrees root を `os.stat()` し、
      現在の uid 所有でない / other-writable なものはルートに採用せず None を返す、
      (b) `$HOME` を超えて遡らない、(c) `st_dev` が cwd と一致する間だけ遡りマウント境界を
      跨がない。fail-open 方針は維持し、境界に触れたら黙って exit 0。
    sources: [claude:security]
