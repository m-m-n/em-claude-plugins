      (2) 安価な freshness prune が高価な implement_in_progress の後に置かれている、
      (3) 同一 identity の重複排除が無く同じ journal.jsonl を最大 F 回読む。
      SPEC NFR3 は「1 回の glob と候補ごとの stat 1 回」を予算として宣言しており、
      実装はその予算からずれている。
    suggestion: >-
      (a) candidate_is_fresh を implement_in_progress より前に移す（純粋な述語の AND の
      並べ替えで結果集合も順序も変わらない）、(b) 導出 identity で重複排除する、
      (c) active_candidates をジェネレータにして early return を効かせる。
