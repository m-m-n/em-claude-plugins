    source: batch-codex-consultation
    answer_mode: select_or_freeform
    selected_option_ids: [journal_freshness]
    freeform: "閾値は 24 時間。journal.jsonl の mtime を見て、無ければ workflow.yaml の mtime にフォールバックする"
    normalized_answer: >-
      進行中 feature の active 判定に鮮度条件を加える。journal.jsonl（存在しなければ
      workflow.yaml）の mtime が現在時刻から 24 時間より古い feature は active 集合から
      除外する。stat 1 回で判定でき、判定不能なら除外側（＝ブロックしない側）に倒す。
    resolution_note: >-
      batch: gate create-spec.requirement-clarification は batch-policies.yaml で
      codex_consultation。Codex は journal_freshness を選び 24 時間の閾値を明示した。
      オーケストレーターが option_id への写像を判定して採用。net として「誤ブロック」より
      「見逃し」に倒れる点が hook の契約と一致する。
