schema_version: 1
feature: merge-pr-test-git-env-isolation
created: '2026-11-07'
base_branch: main
goal: '# tests/test_merge_pr.py の setUp が GIT_* 環境変数を外さず、呼び出し元のリポジトリに書き込み得る


  種別: バグ


  ## 現象

  `tests/test_merge_pr.py` の `MergePrTestCase.setUp` は、環境変数から GH_REPO などは外すが GIT_*
  を外さない。GIT_DIR / GIT_INDEX_FILE が設定された環境（git フックの中など）でスイートを走らせると、setUp の `git config`
  や `git commit --allow-empty` が一時リポジトリではなく呼び出し元のリポジトリに書き込まれる。GIT_CONFIG_GLOBAL も固定されていない。


  ## 再現手順

  1. GIT_DIR を別のリポジトリに向けて設定した状態で `python3 -m unittest tests.test_merge_pr` を走らせる

  2. GIT_DIR が指すリポジトリに空コミットと user.name / user.email の設定が書き込まれる


  ## 期待する挙動

  setUp で GIT_ で始まるキーをすべて外してからテスト用の値を足す（`tests/test_merge_preflight.py` と同じ形）。GIT_CONFIG_GLOBAL
  を os.devnull に固定する。


  ## 完了の定義

  - [ ] 再現手順で現象が起きない

  - [ ] 再発を検出するテストがある


  ## 該当箇所

  - `tests/test_merge_pr.py:219-233`

  - 詳細: integration ブランチ `em-workflow/unattended-merge-medium-fixes/integration` の
  `feature-docs/unattended-merge-medium-fixes/reviews/round6.yaml`（stable_id `64742b16658d5b04`）


  ## 実害・発生条件

  現在の運用ではスイートを git フックから走らせていないため、条件付き。起きると一時リポジトリの外に書き込む。

  '
