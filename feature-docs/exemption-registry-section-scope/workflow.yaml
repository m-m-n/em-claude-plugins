schema_version: 1
feature: exemption-registry-section-scope
created: '2026-09-24'
base_branch: main
goal: '# em-workflow: 免除レジストリのパースがセクション非限定で、2つ目のテーブル追記により gate が無言で免除される


  Notion: https://www.notion.so/3be3509ec8ee8164b546e9b5fca1162c



  ## 現象（必須）

  `tests/test_gate_option_vocabulary.py` の `load_exempt_gate_ids()` が、`em-workflow/references/gate-option-vocabulary.md` の **ドキュメント全体** から Markdown テーブル行を集めている。`## Exemption registry` セクションに限定していない。

  そのため、このドキュメントに 2 つ目のテーブルが追記されると、その行の 1 セル目のバックティック内文字列が免除 gate_id として読み取られ、`test_every_select_gate_option_is_declared_at_every_issuing_site` が該当ゲートを `if gate_id in exempt: continue` で静かにスキップする。テストは 1 件も落ちない。

  `## Canonical declaration format` セクションはこのテーブル形式を散文で説明していて実例テーブルがまだ無いため、実例の追記は十分ありうる編集。

  ## 再現手順（必須）

  1. `em-workflow/references/gate-option-vocabulary.md` の `## Canonical declaration format` セクションに、説明用の `## Gate option vocabulary` 実例テーブルを 1 つ追記する（1 セル目に \`` `create-spec.feature-identity` `\` を含む行）

  2. `python3 -m unittest discover -s tests` を実行する

  3. スイートは green のまま。`load_exempt_gate_ids()` は `{''create-spec.feature-identity''}` を返し、そのゲートは correspondence sweep から外れている（`tests/test_gate_option_vocabulary_doc.py` の `parse_exemption_table_rows()` は 0 行と報告しつづける）

  ## 期待する挙動（必須）

  免除は `## Exemption registry` セクションのテーブル行**だけ**から読み取られる。ドキュメントの他の場所にあるテーブルは免除として解釈されない。読み取った行には doc 側と同じ検証（3 セル・reason 非空・compensating guarantee 非空・gate_id が `action: select` に属する）が掛かり、違反時は例外で落ちる。

  ## 完了の定義（必須）

  - [ ] `load_exempt_gate_ids()` が `## Exemption registry` 見出しから次の `## ` 見出しまでを切り出してからテーブル行を集める（`tests/test_gate_option_vocabulary_doc.py` の `_registry_section` と同じアンカーの取り方）

  - [ ] 読み取った免除行に `validate_exemption_rows` 相当の検証が掛かり、不正な行は例外になる

  - [ ] 共通のパーサ／バリデータが 1 箇所（例 `tests/_gate_vocabulary.py` のような非テストヘルパ）に置かれ、doc 側モジュールと消費側モジュールの双方がそれを使う

  - [ ] hermetic テスト追加: 無関係なテーブル + 0 行の `## Exemption registry` を含む合成ドキュメントが `set()` を返す

  - [ ] `python3 -m unittest discover -s tests` が通る

  ## 該当箇所（任意）

  - `tests/test_gate_option_vocabulary.py:271`（`load_exempt_gate_ids`、テーブル行の収集は 286 行付近）

  - `tests/test_gate_option_vocabulary_doc.py:114` / `:137`（正しくセクション限定している側の `parse_exemption_table_rows` / `validate_exemption_rows`）

  - `em-workflow/references/gate-option-vocabulary.md:72`（`## Exemption registry`）

  ## 実害・発生条件（任意）

  `gate-option-vocabulary.md` に 2 つ目のテーブルが追記されたときに発生する。発生しても一切の失敗シグナルが出ないため、該当ゲートの batch 実行が `question-resolution.md` Batch resolution sequence step 6 の protocol-error abort に戻る — この feature がまさに塞いだ穴が、無言で再び開く。

  feature `batch-policy-option-id-consistency`（PR https://github.com/m-m-n/em-claude-plugins/pull/11 ）のレビューで、comprehensive / architecture / spec の 3 観点が独立に同じ欠陥を指摘した（`stable_id`: `c1exempt271scan` / `a2exempt271split` / `s1exempt286anchor`）。3 件とも severity: medium だったため review フェーズの auto-fix 候補ゲート（critical/high のみ）に掛からず未着手のまま残った。

  '
