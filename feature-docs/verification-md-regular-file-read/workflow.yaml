schema_version: 1
feature: verification-md-regular-file-read
created: '2026-11-08'
base_branch: main
goal: '# validate-worker-output.py で通常ファイルでない VERIFICATION.md を読むと検証が止まる（is_file() 確認の消失による後退）


  Notion タスク: <notion-url> （種別: バグ）


  ## 現象 (必須)


  `em-workflow/scripts/validate-worker-output.py` の `_load_scenario_ids` は、VERIFICATION.md を `path.read_text()` でそのまま読む。以前あった `is_file()` の確認が無くなったため、VERIFICATION.md が通常ファイルでない（FIFO、`/dev/zero` へのシンボリックリンク等）と、読み込みが返らず検証が止まる。上限なしで読み続けるため、巨大な入力でもメモリを使い切り得る。


  rework-docs-only-medium-fixes（PR #55）のレビュー round 1 で medium として残った指摘（stable_id `58060ec00a7b29e6`、TM-5）。push 時の自動セキュリティレビューでも同じ箇所が指摘された。


  ## 再現手順 (必須)


  1. feature-dir の VERIFICATION.md を FIFO（`mkfifo`）か `/dev/zero` へのシンボリックリンクに置き換える

  2. 文書のみの回の rework-planner 出力を、その feature-dir / baseline-dir を渡して `validate-worker-output.py` で検証する


  ## 期待する挙動 (必須)


  通常ファイルでない VERIFICATION.md は読まずに「読めない」として扱い、検証は止まらずに拒否（fail-closed）で終わる。


  ## 完了の定義 (必須)


  - [ ] 再現手順で現象が起きない

  - [ ] 再発を検出するテストがある


  ## 該当箇所 (任意)


  - `em-workflow/scripts/validate-worker-output.py` の `_load_scenario_ids`

  - 自動レビューの修正案: `os.open(path, O_RDONLY | O_NONBLOCK | O_NOFOLLOW)` で開いて `os.fstat` + `stat.S_ISREG` を確かめ、それ以外は `("unreadable", "not a regular file")` を返す。読み込みはバイト上限付きにしてから UTF-8 で decode する。FIFO と `/dev/zero` リンクのテストをサブプロセスのタイムアウト付きで足す


  ## 実害・発生条件 (任意)


  worker 出力の検証が返らず、無人実行が止まる。VERIFICATION.md が通常ファイルでないときだけ起きる。


  ## 追加指示（起動時）


  - 実装完了後、integration ブランチを remote に push し、gh pr create で base_branch への PR を作成する。integration ブランチはローカル・リモート両方に残す（base_branch へ自動マージしない）

  - 不明点は Codex に相談し、相対的に良いと判断した選択肢を採用する

  - その議論内容を Notion に記録する

  '
