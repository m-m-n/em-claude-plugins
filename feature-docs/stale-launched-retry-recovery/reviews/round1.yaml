  description: 新チェーン evaluate_stale_launched_chain は opt-in で、7 つの証拠入力 (--worktree-present / --branch-present
    / --task-worktree / --stop-target / --launch-termination / --stop-result / --stop-result-target) を
    1 つ以上渡したときだけ decide の step 6 same-session 分岐から入る。ところが implement-phase.md の Same-session extension
    段落は (a) recover-orphaned-task.py を呼ぶこと自体、(b) 7 つの入力の名前と受理リテラル、(c) --launch-at の由来、のいずれにも触れておらず、唯一名指しするスクリプトが書き込みヘルパー
    journal-append-failed.py だった。結果、marker だけ渡す従来形で呼ぶと evidence_supplied が False のままで same-session 残余に終わり機能が到達不能になる。字義どおり書き込みヘルパーを直叩きする読み方も残り、その場合は証拠チェーンと
    --launch-at による launch 同一性検査 (TOCTOU 対策) を迂回する。comprehensive#fallback と architecture#fallback が独立に同一サイトを
    high で報告した。
