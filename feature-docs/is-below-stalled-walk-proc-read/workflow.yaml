schema_version: 1
feature: is-below-stalled-walk-proc-read
created: '2026-10-31'
base_branch: main
goal: |
  # bash_guard.py の is_below で、段階検査が不存在要素で止まった後に realpath が /proc 配下を参照する

  種別: 改善

  ## やりたいこと

  `em-workflow/hooks/bash_guard.py` の `is_below` で、段階検査（`_stage_walk_refuses`）が不存在要素や通常ファイルの段で止まったとき、その後の `realpath` が /proc 配下を lstat / readlink しないようにする。

  ## 背景・なぜ

  リンクの行き先が `proc/missing/../../../../proc/self/cwd` のように途中に不存在要素を含み、その後の `..` で根まで戻って /proc を指すとき、段階検査は不存在の段で False を返す。続いて `is_below` の非 strict な `realpath` が不存在要素を字句的に通り抜け、/proc や /proc/self を lstat / readlink する。

  判定は常に False のままで、誤った許可は起きない（True には `resolves_to_directory(path)` の成功が要る）。同じ経路は、絶対の行き先 `/area/task/missing/../../../proc/self/cwd` や、先頭が proc でない相対の行き先 `x/missing/../../../../proc/self/cwd` では以前から存在する。feature cd-prefix-relative-link-target で相対の行き先の字句検査を外したため、この経路に入る入力が少し広がった。影響は hook プロセスが /proc を読み取ることだけ。

  feature cd-prefix-relative-link-target の review round 1 で comprehensive 観点が medium として報告し、評価者が low に下げた指摘（同 feature の FR4「他の判定は変えない」の範囲外として持ち越し）。

  ## 受け入れ条件 / 完了の定義

  - [ ] 段階検査が不存在要素・通常ファイルの段で止まった場合に、物理パス側・論理パス側のどちらでも /proc・/dev/fd 配下を lstat / readlink しない
  - [ ] `is_below` の判定結果は変わらない
  - [ ] 不存在要素を含む相対の行き先・絶対の行き先のリンクで /proc の参照が起きないことを、ファイル操作を記録するテストで確かめる

  ## 制約・前提

  物理パス側は、`realpath` を呼ぶ前に `resolves_to_directory(path)` の成功を確かめる案がある。論理パス側の `realpath(normpath(path))` は別途検討が要る。
