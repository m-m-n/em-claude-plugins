- stable_id: 3979d9c470c153b2
  severity: medium
  category: security
  file: em-workflow/hooks/bash_guard.py
  line: 339
  title: 長い未解決経路で cd 前置判定のフックを長時間占有できる
  description: cd "<長い経路>" && <承認済みコマンド> を送ると、bash_guard.py の is_below → _stage_walk_refuses が /dev/null 等で停止した後も NotADirectoryError・ENAMETOOLONG を普通の名前として扱い、全要素を二乗の処理量で走査する。結果は False（fail-closed）で許可の不正取得はできない。影響は可用性（無人実行の遅延）のみ。
  suggestion: 続行中の処理量を経路長に対して線形に抑える。あわせて、エンコード後の長さが PATH_MAX 以上の経路は走査前に False にする。
  reproduction: ファイルを作成せず、python3 -B で runpy.run_path('em-workflow/hooks/bash_guard.py') を読み込む。path = '/dev/null' + '/x' * 32000、command = 'cd "' + path + '" && make test' を構築し、is_cd_prefixed_approved(command, {'make test'}, '/tmp/review-project/.git') の実行時間を測る。確認環境では False が返るまで約21.53秒かかった。
  reproduction_alternates: []
