  title: 停止後の段階走査が要素数の二乗で遅くなる
  description: _stage_walk_refuses は存在しない段階や非ディレクトリの段階で止まらず経路の最後まで走査を続ける。各反復で到達済みの全要素を結合し（334行）、_under_proc_or_dev_fd が全要素を分割して走査し（335行、283行）、os.lstat を呼ぶ（338行）。ENAMETOOLONG も停止後は普通の名前として続行するため要素数に上限がなく、処理量は要素数の二乗になる。判定結果は False（fail-closed）のままで、影響はフックの応答遅延のみ。
  suggestion: 続行中の簿記を差分で持つ（/proc・/dev/fd 判定は reached の先頭2要素と name で決まる）。ENOENT / ENOTDIR / ENAMETOOLONG の要素が reached に残る間は lstat を省き、.. で既存の場所へ戻った時点で再開する。pending.pop(0) は deque か逆順スタックにする。補助策として、エンコード後の長さが PATH_MAX 以上の経路は走査前に False を返す（判定は変わらない）。
  reproduction: null
  reproduction_alternates: []
  reproduction_overflow: false
