base_branch: main
goal: '# codex-hook-interactive-guard: extglob の ?() を含む語を関数名と読み、後ろの実行グループの対話起動を見逃す


  Notion: <notion-url>



  ## 脆弱性の概要 (必須)

  `codex-hook-interactive-guard.py`（em-workflow / em-review の両コピー）が、extglob の `?()` を含む語を関数定義の名前と読み、その後ろの改行に続く実行グループ（`( ... )` など）を関数本体として判定から外す。予約語の直後（`then f?()` / `time /bin/true?()`）でも、予約語の無い形（`f?()`）でも起きる。

  ## 参照 (必須)

  - CVE / GHSA ID: 該当なし

  - アドバイザリ URL: 該当なし

  - severity: low

  - 該当パッケージ: 該当なし

  - 現在のバージョン: feature `codex-guard-reserved-word-funcdef` の integration ブランチ時点

  - 修正済みバージョン: 無し

  ## 攻撃シナリオ (必須)

  Codex レビュアーが `bash -O extglob -c ''time /bin/true?()` + 改行 + `(python3 -i)''` のようなコマンドを実行すると、Bash では `?()` が拡張パターンになり、1 行目は通常のコマンド、2 行目のサブシェルも実行される。ガードは 1 行目を関数定義と読むため、対話起動の `python3 -i` を deny しない。

  ## 影響範囲 (必須)

  対話起動の検出漏れ（fail-open）。ガードは誤読を検出漏れとして扱う設計で、すり抜けの類型は予約語の無い形 `f?()` で基準コミットから既にあった。feature `codex-guard-reserved-word-funcdef` の予約語の除去（SPEC FR1）で、同じ読み違いが予約語の後にも広がった。

  ## 完了の定義 (必須)

  - [ ] 攻撃シナリオが成立しない

  - [ ] 修正版に追随している（修正版が無い場合は暫定緩和策の欄に対応を記載）

  - [ ] 予約語の有り・無しの両方について `bash -O extglob -c` の deny ケースを `tests/test_codex_hook_interactive_guard.py` の `CASES` に足す

  - [ ] 両コピーがバイト単位で同一のまま

  ## 該当箇所 (任意)

  - `em-workflow/scripts/codex-hook-interactive-guard.py:373`（`_names_function`）

  - `em-review/scripts/codex-hook-interactive-guard.py`（同一内容）

  - 修正案: 末尾が extglob の演算子文字（`?` `*` `+` `@` `!`）の語は関数名とみなさない

  - 記録: `feature-docs/codex-guard-reserved-word-funcdef/reviews/round2.yaml`（ブランチ `em-workflow/codex-guard-reserved-word-funcdef/integration`）

  ## 暫定緩和策 (任意)

  \<修正までの回避手段。あれば\>


  ## 追加指示（起動時）

  - 実装完了後、integration ブランチを remote に push し、base_branch に対して gh pr create で PR を作る。integration ブランチはローカル・リモート両方に残す（base_branch へ自動マージしない）

  - 不明点は Codex に相談し、比較的良いと判断した選択肢を採用する

  - その議論内容を Notion に記録する

  '
