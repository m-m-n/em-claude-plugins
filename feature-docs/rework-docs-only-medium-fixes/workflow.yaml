schema_version: 1
feature: rework-docs-only-medium-fixes
created: '2026-11-01'
base_branch: main
goal: |
  # em-workflow の文書のみ修正経路（rework-docs-only-task-routing）のレビューで残った medium 指摘 4 件を直す

  種別: 改善

  ## やりたいこと (必須)

  em-workflow の文書のみ修正経路（feature `rework-docs-only-task-routing`、PR #50）のレビュー round 1 で残った medium 指摘 4 件を直す。

  ## 背景・なぜ (必須)

  レビューで次の 4 件が medium として残った（自動修正の対象は critical / high のみのため未対応）。いずれも `em-workflow/scripts/validate-worker-output.py` の文書のみの回・シナリオ ID 改名・tests 参照置換の検査が、SSOT の規則より緩い。

  - `c588505add1da8c7` 改名申告の改名先 (to) が変更後の VERIFICATION.md に実在するか検査していない
  - `33f072c3b90c3aea` 改名で文書から消えた旧シナリオ ID を covered_by_existing として受理してしまう
  - `6ed87da72e3f5de3` 文書のみの回の step_patches 検査が SSOT の機械検査規則より狭い
  - `a3ac237a09af8436` from と to が重なる tests_replace を受理し、逐次適用で参照が失われる

  詳細はブランチ `em-workflow/rework-docs-only-task-routing/integration` の `feature-docs/rework-docs-only-task-routing/reviews/round1.yaml` にある。

  ## 受け入れ条件 / 完了の定義 (必須)

  - [ ] 4 件それぞれについて、不正な出力を拒否する失敗例の fixture とテストがある
  - [ ] 既存の成功例 fixture が引き続き受理される

  ## 制約・前提 (任意)

  PR #50 のマージ後に着手する。
