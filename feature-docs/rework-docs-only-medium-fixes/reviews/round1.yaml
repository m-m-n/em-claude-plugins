findings:
- stable_id: 58060ec00a7b29e6
  severity: medium
  category: security
  file: em-workflow/scripts/validate-worker-output.py
  line: 2503
  title: 'TM-5: 通常ファイルでない VERIFICATION.md で検証が止まる（is_file() 確認の消失による後退）'
  description: '_load_scenario_ids は path.read_text() を無条件に呼ぶ。変更前の _validate_rework_index にあった vpath.is_file() / bpath.is_file() の確認は、この差分で消えた。経路: validate_worker_result → _validate_rework_index → _VerificationDiff → _load_scenario_ids({feature-dir}/VERIFICATION.md) → read_text。feature-dir の VERIFICATION.md は rework 回で worker が書ける範囲にある（THREAT-MODEL TB-1）。書き手のいない FIFO なら open でブロックし、終了コード 1 も JSON 診断も返らない。/dev/zero などへのシンボリックリンクでは読み取りが終わらずメモリを使い切る。THREAT-MODEL の TM-5 と NFR1 を満たしていない。'
  suggestion: _load_scenario_ids で os.open(path, O_RDONLY|O_NONBLOCK) で開き、os.fstat の結果を stat.S_ISREG で確かめ、通常ファイルでなければ ("unreadable", "not a regular file") を返す。通常ファイルなら上限まで読んで UTF-8 で復号する。FIFO と /dev/zero へのシンボリックリンクを置くテストを subprocess の timeout 付きで足す。
  reproduction: 有効な docs-only の worker-result を用意し、--feature-dir 内の VERIFICATION.md が書き手のいない FIFO の状態で検証する。_validate_rework_index → _VerificationDiff → _load_scenario_ids の経路で読み込みが停止し、終了コードも JSON 診断も返らない。同等の確認として、匿名パイプの /proc/self/fd/<read_fd> を _load_scenario_ids に渡し、通常ファイル判定が false でも外部タイマーで中断するまで待ち続けることを確認した。ファイルは作成していない。
  sources:
