  title: 許容範囲の境界値が丸め誤差で拒否される
  description: FR3 は合計と 1 の差が許容誤差「以内」であることを求めており、tier-rules.yaml のコメントにも「境界値ちょうどは通す」と書かれている。しかし abs(sum - 1.0) > tolerance を浮動小数のまま比較しているため、小数 2 桁の確率で合計がちょうど 0.98 / 1.02 になる入力は差が 0.020000000000000018 になり拒否される。{0:0.80,1:0.18,2:0,3:0} は minimal になるべきだが fallback_matrix:malformed_input で full になる。フェイルセーフ側には倒れるが仕様の境界が守られていない。境界ちょうどの値を検証するテストも無い。
  suggestion: '比較の前に丸める（例: round(diff, 9) > tolerance）か decimal を使い、合計 0.98 と 1.02 が通ること、0.97 と 1.03 が拒否されることを確かめるテストを追加する。'
