    packet_id: create-spec-q0001
    answered_at: '2026-09-26T16:09:15+09:00'
    source: batch-codex-consultation
    answer_mode: select_or_freeform
    selected_option_ids:
    - drop_p0_floor
    freeform: null
    normalized_answer: reduced 条件は P(0)+P(1)≥0.85 のみ（P(0)≥0.40 の下限を外す）
    resolution_note: 'gate: create-spec.requirement-clarification (policy action codex_consultation,
      record_as_assumption); codex_consulted: true (1 turn, harness codex); opus_escalation:
      false; Codex suggestion mapped onto option drop_p0_floor (matches worker tentative);
      codex reason: 現行の reduced は P(0)>=0.40 を要求し、P(0)=0.37・P(1)=0.59 でも full になることをテストで固定しているよ（em-workflow/references/tier-rules.yaml:58、tests/test_tier_rules.py:309）。下限を残す案では
      bucket 1 が優勢な小規模作業を除外する原因が残るため、minimal を先に判定した後は P(0)+P(1)>=0.85 だけで reduced
      にする案を選ぶよ'
  create-spec.tier.rule-plus-test-bucket:
    packet_id: create-spec-q0001
    answered_at: '2026-09-26T16:09:15+09:00'
    source: batch-codex-consultation
    answer_mode: select_or_freeform
    selected_option_ids:
    - bucket_1
    freeform: null
    normalized_answer: ルール追加＋テスト追加は段階 1 に置く（0 はテスト変更を伴わない文言・ルール修正のみ）
    resolution_note: 'gate: create-spec.requirement-clarification (policy action codex_consultation,
      record_as_assumption); codex_consulted: true (1 turn, harness codex); opus_escalation:
      false; Codex suggestion mapped onto option bucket_1 (matches worker tentative);
      codex reason: 現行の minimal は reduced より削減範囲が広く、SPEC.md の TASK.md への置換に加えてタスク分割や
      VERIFICATION.md も削減するよ（em-workflow/skills/develop/SKILL.md:588、em-workflow/skills/develop/SKILL.md:589）。ルール＋テスト追加を
      bucket 0 に広げるより、bucket 1 に置いて Q1 の下限撤廃で reduced に届かせる方が、削減範囲の区別を保ちながら問題を解消できると判断するよ。なお、テストスイート全体の維持は全
      tier 共通なので、この選択はテストを実行するかどうかの区別ではないよ（em-workflow/skills/develop/SKILL.md:591）'
  create-spec.tier.codex-unavailable:
    packet_id: create-spec-q0001
    answered_at: '2026-09-26T16:09:15+09:00'
    source: batch-codex-consultation
    answer_mode: select_or_freeform
    selected_option_ids:
    - full
    freeform: null
    normalized_answer: Codex 事前調査が使用不可なら最終判定の Jev を呼ばず full。tier-rules.yaml・評価器・テストを
      SKILL.md に揃える
    resolution_note: 'gate: create-spec.requirement-clarification (policy action codex_consultation,
      record_as_assumption); codex_consulted: true (1 turn, harness codex); opus_escalation:
      false; Codex suggestion mapped onto option full (matches worker tentative);
      codex reason: Step A は Codex 使用不可なら full と明記している一方、規則表は description_only の閾値評価を指定し、テストも
      Codex 不在で minimal を期待しているよ（em-workflow/skills/develop/SKILL.md:273、em-workflow/references/tier-rules.yaml:104、tests/test_tier_rules.py:405）。実装も
      Codex の可用性が真偽値であることを確認した後、不在による打ち切りを入れずに閾値評価へ進むよ（em-workflow/scripts/decide-tier.py:345、em-workflow/scripts/decide-tier.py:375）。調査結果なしで最終
      Jev を呼ぶ経路を設けるより、使用不可時は最終 Jev を呼ばず full に統一し、規則表・評価器・テストを Step A に揃える案を選ぶよ'
  create-spec.tier.minimal-expectation-clear:
    packet_id: create-spec-q0001
    answered_at: '2026-09-26T16:09:15+09:00'
    source: batch-codex-consultation
    answer_mode: select_or_freeform
    selected_option_ids:
    - probabilities_only
    freeform: null
    normalized_answer: tier 行は最終判定の 0〜3 の確率だけを見る。expectation_clear・confidence は記録のみ
    resolution_note: 'gate: create-spec.requirement-clarification (policy action codex_consultation,
      record_as_assumption); codex_consulted: true (1 turn, harness codex); opus_escalation:
      false; Codex suggestion mapped onto option probabilities_only (matches worker
      tentative); codex reason: 現行の minimal 行には expectation_clear_floor: 0.5 があり、評価器も確率とは別の比較条件として扱っているよ（em-workflow/references/tier-rules.yaml:51、em-workflow/scripts/decide-tier.py:113）。維持案では最終確率が同じでも
      expectation_clear によって結果が変わるため、最終確率だけで tier を決める要件を満たせないよ。expectation_clear
      と confidence は記録に残し、tier の直接の判定条件から外す案を選ぶよ'
  create-spec.tier.bucket-description-home:
