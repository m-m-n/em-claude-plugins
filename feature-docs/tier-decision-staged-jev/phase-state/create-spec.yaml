    freeform: null
    normalized_answer: 0〜3 の段階の説明文は tier-rules.yaml の question_set に置く
    resolution_note: 'gate: create-spec.requirement-clarification (policy action codex_consultation,
      record_as_assumption); codex_consulted: true (1 turn, harness codex); opus_escalation:
      false; Codex suggestion mapped onto option tier_rules_yaml (matches worker tentative);
      codex reason: Step A は送信する質問セットの定義先として、すでに tier-rules.yaml を参照しているよ（em-workflow/skills/develop/SKILL.md:243）。外部
      Jev スキルに置く案より、区分の説明を question_set に置く方が確率の意味と閾値を同じリポジトリで管理できるため、質問文を外部所有とする現行コメントも更新する案を選ぶよ（em-workflow/references/tier-rules.yaml:21、em-workflow/references/tier-rules.yaml:25）。重複禁止テストが確認するのは外部スキル文面の転記なので、区分の説明を独自に定義する方針と両立できるよ（tests/test_tier_rules.py:221、tests/test_tier_rules.py:236）'
  create-spec.tier.probability-validation:
    packet_id: create-spec-q0001
    answered_at: '2026-09-26T16:09:15+09:00'
    source: batch-codex-consultation
    answer_mode: select_or_freeform
    selected_option_ids:
    - four_buckets_and_sum
    freeform: null
    normalized_answer: 最終判定の確率は "0"〜"3" すべて必須・[0,1] の有限値・合計が 1 から許容幅以内（許容幅は tier-rules.yaml）。外れたら
      full
    resolution_note: 'gate: create-spec.requirement-clarification (policy action codex_consultation,
      record_as_assumption); codex_consulted: true (1 turn, harness codex); opus_escalation:
      false; Codex suggestion mapped onto option four_buckets_and_sum (matches worker
      tentative); codex reason: 現行評価器は各行が必要とする値だけを読み、最初に一致した行で戻るため、4 区分全体の妥当性を確認していないよ（em-workflow/scripts/decide-tier.py:222、em-workflow/scripts/decide-tier.py:268）。必要な区分だけ読む案では未参照の欠損や異常を見逃し、4
      区分の存在と範囲だけを確認する案でも合計が 1 でない分布を排除できないよ。既存の有限性・範囲検査と異常時 full の方針を全区分に適用し、合計も tier-rules.yaml
      に置く許容誤差で閾値評価前に検証する案を選ぶよ（em-workflow/scripts/decide-tier.py:169、tests/test_tier_evaluator_contract.py:303）'
