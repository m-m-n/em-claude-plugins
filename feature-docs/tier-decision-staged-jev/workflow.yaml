schema_version: 1
feature: tier-decision-staged-jev
created: '2026-09-26'
base_branch: main
goal: |
  # em-workflow: tier 決定を「Jev（説明文のみ）→ Codex の事実調査 → Jev の最終判定」に組み替える

  ## やりたいこと
  em-workflow の tier 決定を、次の流れに組み替える。
  1. Jev が説明文だけで作業の大きさを判定する（JSON）
  2. Codex がコードを調査し、実装量と影響範囲の事実を返す（JSON）。Codex は大きさの判定をしない
  3. 説明文と 1・2 の JSON を Jev に渡し、最終判定として 0〜3 の確率を返させる。tier はこの確率だけで決める

  ## 背景
  loop-develop の feature `triage-completion-judgment`（triage スキルへのルール追記）が full と判定された。
  - 説明文のみの読み: P(0)=0.55, P(1)=0.38 → reduced
  - 説明文＋Codex 見積りの読み: P(0)=0.09, P(1)=0.90 → full
  - 2 本が食い違ったため `fallback_matrix:readings_disagree` で full
  Codex の見積りは「2 ファイル・約 30 行・新規関数なし・波及なし」で、作業の中身と合っていた。full になった要因:
  - `references/tier-rules.yaml` の reduced 行は P(0) ≥ 0.40 を要求するため、「1」に寄ったタスクは full になる
  - Jev の段階の説明文では「0」が「文言修正、新しいロジックなし」、「1」が「数ファイル＋小さなテスト更新」。テストの追加があるだけで「1」に寄る
  - 現在の Codex 出力はテストについて `covering_tests_exist` しか持たず、`spillover_modules` も名前の一覧だけなので、Jev が変更の重さを見分けられない
  - 2 本の読みが食い違うと無条件で full になる

  ## 受け入れ条件
  - tier 決定が「Jev（説明文のみ）→ Codex 調査 → Jev（説明文＋両 JSON）」の順で行われる
  - 最終判定の Jev が 0〜3 の確率を返し、tier はその確率だけで決まる
  - 2 本の読みの食い違いで full にする規則がなくなっている
  - Codex の出力スキーマに、次の事実を返す項目がある
    - テスト変更の種類（既存の検証に 1 対 1 で足すだけか、新しい振る舞いのテストを起こすか）
    - 増えるテストケース数の見込み
    - 本体の変更の種類（文言・ルールの追記か、新しいロジックか）
    - 変更の閉じ具合（1 つの関数内 / 1 つのモジュール内 / 複数モジュール）
    - 変更箇所の呼び出し元・依存先の数
    - 外から見た約束（引数・戻り値・ファイル書式・設定項目など）を変えるか
    - 振る舞いが変わるか
  - 最終判定の Jev に、1 本目の Jev の確信度も渡される
  - tier 決定の記録（`phase-state/tier.yaml`）に、1 本目の Jev の結果・Codex の JSON・最終判定の確率が残る
  - Codex が使えないときの扱いが決まっている

  ## 制約・前提（未決事項）
  - reduced の条件（P(0) ≥ 0.40）を、「1」が主のタスクを reduced に入れる形に変えるか
  - 段階の説明文で、「ルール追加＋テスト追加」を 0 と 1 のどちらに置くか
  - Codex が使えないとき、最終判定の Jev を Codex 抜きで呼ぶか、full にするか
