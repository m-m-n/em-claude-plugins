schema_version: 1
feature: sca-requirements-option-value-consumption
created: '2026-10-11'
base_branch: main
goal: |
  # SCA 軸: requirements のオプション行で値を取る pip オプションの値を消費せず、後ろの -c が -r を食って include を取りこぼす

  出典 Notion タスク: https://www.notion.so/3f63509ec8ee8141ae3ceb16fb1be5f4 （種別: バグ）


  ## 現象 (必須)
  requirements ファイルのオプション行で、`-r` / `-c` / `-e` 以外の値を取る pip オプション（`-i` / `--index-url`、`--extra-index-url`、`-f` / `--find-links`、`--trusted-host` 等）を読み飛ばすとき、その値のトークンを消費していない。pip（optparse）は値を取るオプションの直後のトークンを、先頭が `-` でも値として消費するため、スキャナと pip の解釈がずれる。
  - 過小方向（TM-5 の経路）: `--trusted-host -c -r deps.txt` では、pip は `-c` を trusted-host の値とし、`deps.txt` を include として辿る。スキャナは `-c` が `-r` を制約の値として消費し、直接依存の集合が空のまま `complete=True` になる。`deps.txt` で宣言した直接依存の high / critical の advisory が推移的依存として黙って捨てられる。`-f -c -r X`、`-i -c -r X`、`--extra-index-url -c -r X`、省略形の `--trusted -c -r X` も同じ。
  - 過大方向: `-f "-enamed-pkg" -r actual.txt` で、pip は `-enamed-pkg` を find-links の値とするが、スキャナは editable と読んで `named-pkg` を直接依存に加える。`--find-links "-rdeps.txt" -r actual.txt` でも `deps.txt` を辿る（封じ込めは効く）。
  ## 再現手順 (必須)
  1. `requirements.txt` に `--trusted-host -c -r deps.txt` の 1 行だけを書き、`deps.txt` に advisory のあるパッケージを宣言する
  2. 軸 2 を走らせる → 直接依存の集合が空で `complete=True`、advisory が落ちる
  3. `-f "-enamed-pkg" -r actual.txt` では `named-pkg` が直接依存に入る
  ## 期待する挙動 (必須)
  - 値を取る pip のオプションは、分離形のとき次のトークンを値として消費して読み捨てる
  - それらの長形式の省略形（`--trusted`、`--index`、`--find` 等）も値を消費するか、`--requirement` / `--editable` の省略形と同じく `complete=False` にする
  ## 完了の定義 (必須)
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある（`--trusted-host -c -r deps.txt`、`-f -c -r deps.txt`、`-f "-enamed-pkg" -r actual.txt`、`--find-links "-rdeps.txt" -r actual.txt`）
  ## 該当箇所 (任意)
  `em-workflow/scripts/scan-dependencies.py:2131`（`_requirements_option_items` のトークン走査）
  ## 実害・発生条件 (任意)
  出典: em-workflow feature `sca-requirements-multi-option-lines` のレビュー round 1 の finding `eac54f8271361426`（comprehensive / medium）。auto-fix の対象外（critical / high のみ）のため `unresolved` のまま残った残件。ブランチ `em-workflow/sca-requirements-multi-option-lines/integration`。変更前は行全体を無視していたため回帰ではない。

  ## 追加指示
  - 実装完了後、integration ブランチを remote に push し、base_branch へ gh pr create で PR を作る。integration ブランチはローカル・remote とも残す（base_branch へ自動マージしない）
  - 不明点は Codex に相談し、比較してより良いと判断した案を採用する
  - その議論内容を Notion に記録する
