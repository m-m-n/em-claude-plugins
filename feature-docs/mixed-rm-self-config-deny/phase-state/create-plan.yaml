other_feature_doc_fixes:
- path: feature-docs/destructive-guard-mixed-rm-precedence/SPEC.md
  change: '3 箇所だけを新しい動作に改めた。1) FR8 の「わかっている影響」の文: `rm -rf ~/.claude/skills/foo /home/user/valuable`
    は、候補から外すのが保護パスの対象の rm 判定だけになったので deny / rm-recursive になる、と書き換えた。2) AC9 の第 3 文:
    ask / self-modification を deny / rm-recursive に変えた。3) TS-15 の行: 期待値を [deny, rm-recursive]
    にし、括弧書きを新しい動作に合わせた。ほかの行は変えていない。'
  reason: mixed-rm-self-config-deny の FR7（SPEC A4、回答 spec_only）。除外の単位が rm の呼び出しから対象に変わった。そのため、この
    SPEC が既知の影響として ask / self-modification に固定していた形が deny / rm-recursive になる。同じ feature
    の REQUIREMENTS.md と VERIFICATION.md は当時の記録として残し、変えない。
  produced_by: create-plan-run-0002
