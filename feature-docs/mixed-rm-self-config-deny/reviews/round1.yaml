  title: 親ディレクトリ参照で保護範囲の外に出る rm 対象も保護パス扱いで外れ、再帰削除の deny が self-modification の ask に置き換わる（既存動作、SPEC で範囲外）
  description: rm_protected_operand_numbers() は、生のオペランドと normalize_candidate() の形のどちらかが SELF_CONFIG に一致すれば、その対象を保護パスとみなす。このため `/home/user/.claude/skills/../../valuable`（実体は /home/user/valuable）も外れ、残るのは保持された self-modification の ask だけになる。変更前の rm_operands_name_self_config() でも同じ ask になっており、この差分が持ち込んだ退行ではない。SPEC の Edge Cases と Assumption A2 がこの形を範囲外・別タスクと明記している。
  suggestion: この feature では直さず、別タスクとして起票する。直すときは FR2・A1 と両立させ、生の形が一致しても正規化後の形が保護範囲の外に出る対象は保護パスとみなさない案を検討する。`rm -rf ~/.claude/skills/../../valuable` 単体の形と、保護パスと並べた形の回帰ケースを rule 付きで足す。
  reproduction: CLAUDE_BATCH=0 で destructive-guard.py の標準入力に {"tool_name":"Bash","tool_input":{"command":"rm -rf /home/user/.claude/skills/foo /home/user/.claude/skills/../../valuable"}} を渡すと、permissionDecision が ask、理由が self-modification になる。第2対象を /home/user/valuable に変えると deny / rm-recursive になる。
  reproduction_alternates: []
