schema_version: 1
feature: mixed-rm-self-config-deny
created: '2026-11-18'
base_branch: main
goal: |
  # destructive-guard: 同じ rm に自己設定パスと通常パスを並べると通常パスの再帰削除 deny が ask(self-modification) に落ちる

  種別: セキュリティ

  ## 脆弱性の概要 (必須)

  `destructive-guard.py` で、1 つの `rm` に自己設定パスと通常のパスを並べると、通常パスの再帰削除 `deny` が判定から外れ、`ask` / `self-modification` に落ちる。

  ## 参照 (必須)

  - CVE / GHSA ID: 該当なし
  - アドバイザリ URL: 該当なし
  - severity: low
  - 該当パッケージ: 該当なし
  - 現在のバージョン: 該当なし
  - 修正済みバージョン: 無し

  ## 攻撃シナリオ (必須)

  `CLAUDE_BATCH` 未設定で `rm -rf ~/.claude/skills/foo /home/user/valuable` を渡すと、判定は `ask` / `self-modification` になる。`rm -rf /home/user/valuable` 単独なら `deny` / `rm-recursive`。

  `check_self_modification()` が ask を保持したあと `rm_operands_name_self_config()` が真になり、その rm の判定記録全体（通常パスの deny を含む）がプールから外れる。`rm -rf ~/.claude/skills/foo /` のように rm-root の対象を並べた形でも同じになる。

  ## 影響範囲 (必須)

  対話実行では、自己設定への書き込みを理由にした確認だけが表示され、その承認で保護対象外の再帰削除も実行できる。`CLAUDE_BATCH` 下では `deny` に降格されるため判定段は一致するが、理由は self-modification のままになる。

  以前からある挙動で、feature `destructive-guard-mixed-rm-precedence` の SPEC FR8 が既知の影響として受け入れ、TS-15 とユニットテスト `test_a_protected_and_an_unprotected_target_in_one_rm_stay_an_ask` で `ask` / `self-modification` に固定している。

  ## 完了の定義 (必須)

  - [ ] 攻撃シナリオが成立しない（上の形が `deny` / `rm-recursive`（または `rm-root`）になる）
  - [ ] 除外を対象単位で行い、自己設定パス以外の対象から出た rm-recursive / rm-root の deny をプールに残す
  - [ ] SPEC FR8 の扱いと TS-15 の期待値を改め、`python3 em-workflow/hooks/tests/run-destructive-guard.py` が全件通る

  ## 該当箇所 (任意)

  `em-workflow/hooks/destructive-guard.py` の `rm_operands_name_self_config()` 呼び出し付近（ループ内で rm 記録をプールから外す分岐）。

  ## 暫定緩和策 (任意)

  自己設定パスと通常パスを同じ rm に並べたコマンドの確認を、対話実行で承認しない。
