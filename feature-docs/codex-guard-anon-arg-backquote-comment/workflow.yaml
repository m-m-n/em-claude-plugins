schema_version: 1
feature: codex-guard-anon-arg-backquote-comment
created: '2026-10-18'
base_branch: main
goal: '# codex-hook-interactive-guard: バッククォートで群の読みに戻した匿名関数の引数の範囲で、空白の後の # をコメントと読み、本体の python3 -i を見逃す（回帰）


  Notion: <notion-url>


  ## 現象 (必須)

  `codex-hook-interactive-guard.py`（em-workflow / em-review の両コピー）で、zsh 匿名関数の引数中の `(`〜`)` 範囲にバッククォートがあって群の読みに戻ったとき、範囲内の空白の後の `#` がコメント開始と読まれ、閉じ括弧が読み飛ばされる。群が閉じず `_rescue_argument_groups` も救済しないため `_Undecidable(''group'')` になり、匿名関数本体の明示的な `python3 -i` の deny が外れる（無出力）。zsh では語の途中の `(`〜`)` の中の空白と `#` は語の一部でコメントにならない。

  feature `codex-guard-anon-arg-backquote` で表に出た後退。変更前は deny だった。review round 1 の指摘（stable_id `ab990994bd365064`、severity medium、category security）。

  ## 再現手順 (必須)

  1. `tool_input.command` に `zsh -c ''setopt nonomatch nobareglobqual; function { python3 -i; } foo(`echo x` #)''` を設定した JSON をフックの標準入力へ渡す（コマンド自体は実行しない）

  2. 終了コード 0・空出力になる（期待は `permissionDecision: deny`）

  ## 期待する挙動 (必須)

  本体の `python3 -i` を deny する。直し方は SPEC の仮定 A2（群の読みに新しい読みを足さない）と FR5（救済の規則を変えない）に触れるため、扱いを SPEC で決めてから両コピーと `CASES` を揃える。

  ## 完了の定義 (必須)

  - [ ] 再現手順で現象が起きない

  - [ ] 再発を検出するテストがある

  - [ ] `tests/test_codex_hook_interactive_guard.py` の `CASES` に上のコマンドを deny として追加

  - [ ] 両コピーがバイト単位で同一のまま

  ## 該当箇所 (任意)

  - `em-workflow/scripts/codex-hook-interactive-guard.py` の `_read_argument_parens`（943-948 行付近）、`parse` のコメント処理（1181 行付近）

  - `em-review/scripts/codex-hook-interactive-guard.py`（同一内容）

  - 記録: `feature-docs/codex-guard-anon-arg-backquote/reviews/round1.yaml`（ブランチ `em-workflow/codex-guard-anon-arg-backquote/integration`）

  ## 実害・発生条件 (任意)

  見逃し側（fail-open）。書かれる見込みの小さい形。


  ## 追加指示


  - 実装完了後 integration ブランチを push し gh pr create で base_branch への PR を作る（自動マージしない。integration ブランチはローカルとリモートの両方に残す）。不明点は Codex に相談し比較的良い案を採用、その議論内容を Notion に記録する。

  '
