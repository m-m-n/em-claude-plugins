lessons_candidates:
  - >-
    VERIFICATION.md のテストシナリオ ID を implementation-planner が `TS1` 形式で
    書いたが、`skills/plan-writing/SKILL.md` の表テンプレートと
    `scripts/validate-worker-output.py` の `_TS_ID_RE`（`TS-\d+`）はどちらも
    `TS-N` 形式を要求する。create-plan フェーズの検証はこの形式を見ないため
    ズレが素通りし、rework フェーズの `rework_index` 検証で初めて落ちた。
    planner 側に ID 形式を明示するか、create-plan の検証でも同じ正規表現を
    かけると早期に気づける。
  - >-
    `scripts/validate-worker-output.py` の `extract_markdown_section` は
    `text.find("## ", start)` で次見出しを探すため、表セル内のバッククォート付き
    `` `## Line format` `` のような文字列を見出しと誤認してセクションを途中で
    打ち切る。今回 VERIFICATION.md のシナリオ表がこれに当たり、TS-1 以外が
    抽出されなかった。行頭アンカー（`^## `）にするだけで解消する。
  - >-
    review フェーズの auto-fix（review-editor）は 1 dispatch = 1 ファイルに
    scope が固定されるため、「閉集合を定義する文書」と「その集合を pin する
    テストモジュール」が別ファイルにある設計では critical/high を 1 件も
    自動修正できない。今回は 2 ラウンドとも auto-fix を 0 loop で打ち切り
    rework に回した。契約テストを伴う文書変更では、auto-fix ではなく rework が
    既定経路になることを review-phase.md 側に書いておくと判断が速い。
  - >-
    「閉集合の網羅性」を要求する契約は、レビューのたびに未カバーの停止点が
    追加で見つかる構造を持つ。round 1 で 2 つ塞いだら round 2 で 4 つ見つかった。
    catch-all コード + fallback 規則を最初から置くか、owner 文書側にアンカーを
    書いて機械的に双方向チェックできる形にしないと収束しない。
