schema_version: 1
feature: version-baseline-patch-tolerance
created: '2026-11-21'
base_branch: main
goal: '# unittest の version ベースライン 4 件と複合代入 [@] のサブテストが失敗し AC7 を満たせない


  ## 現象

  `python3 -m unittest discover -s tests` で 5 件が失敗する。4 件は plugin version のベースライン検査（`patch
  of ''0.5.2'' is not 0`）、1 件は `test_the_words_of_a_compound_assignment_are_no_command`
  の `A=([@]=1 [12]=2)` のサブテスト。


  ## 再現手順

  1. args-json-deferred-eval-bypass の integration ブランチで `python3 -m unittest discover
  -s tests` を実行する


  ## 期待する挙動

  全件成功し、SPEC AC7 を満たす。version は手で変えない（Actions が上げる）。


  ## 完了の定義

  - 再現手順で現象が起きない

  - 再発を検出するテストがある


  ## 該当箇所

  `tests/test_destructive_guard_args_json.py` の複合代入のテスト。Bash は `[@]=1` を添字付き配列への代入として受け付けないので、`A=([0]=1
  [12]=2)` のような有効な形で検証する。version 検査 4 件は変更前から失敗している。

  '
