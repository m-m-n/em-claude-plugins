schema_version: 1
feature: merge-task-parent-symref-reject
created: '2026-10-26'
base_branch: main
goal: |
  # merge-task.sh の統合ブランチの値の解決が、refs/heads/<parent-branch> に置かれたシンボリック参照を辿り、参照先のブランチを統合ブランチとして扱い得る

  種別: セキュリティ (severity: low)

  ## 脆弱性の概要

  `em-workflow/scripts/merge-task.sh` は統合ブランチの値を `git show-ref --verify --hash -- "refs/heads/$PARENT_BRANCH"` で読む。完全一致の参照名で引くが、その名前がシンボリック参照だと参照先の値を返す。続く `update-ref "refs/heads/$PARENT_BRANCH"` も既定でシンボリック参照を辿るため、統合ブランチ以外の参照先ブランチを動かし得る。

  ## 攻撃シナリオ

  同じリポジトリに書き込める別プロセスが、merge-task.sh のロック待機中に `git symbolic-ref refs/heads/em-workflow/{feature}/integration refs/heads/em-workflow/{feature}/{taskNNNN}`（または `refs/heads/main`）を実行する。ロック解放後、統合ブランチの値は参照先のコミットになり、コミット型の確認も通る。

  - タスク参照を指させた場合: already-contained の経路に入り、exit 0 と `merged` イベントが記録される
  - 別ブランチを指させた場合: fast-forward / merge-commit の `update-ref` がそのブランチを動かす

  ## 影響範囲

  統合ブランチ以外のブランチ（main を含む）が更新される、またはマージしていないタスクがマージ済みとして記録される。ただし主体は参照を直接動かせる書き込み権限を既に持つため、増えるのは迂回経路に限られる。変更前の rev-parse による解決でも同じ挙動だった（既存の挙動）。

  ## 完了の定義

  - 攻撃シナリオが成立しない
  - 修正版に追随している（修正版が無い場合は暫定緩和策の欄に対応を記載）

  ## 該当箇所

  - `em-workflow/scripts/merge-task.sh:180`（統合ブランチの値の解決）
  - 修正案: 値を使う前に `git symbolic-ref --quiet "refs/heads/$PARENT_BRANCH"` が成功したら exit 2 にする。タスク参照側はロック後の `git symbolic-ref --quiet HEAD` が再帰的に辿るため、別ブランチへの付け替えは既に再確認で弾かれる
  - 由来: feature `merge-task-exact-ref-resolve` のレビュー round1 で評価者が low として報告した
