findings:
  - stable_id: 58f19eb9f6c13bc3
    severity: medium
    category: comprehensive
    file: em-workflow/references/implement-phase.md
    line: 160
    title: "Step I.1's newly added reset --hard runs without the merge lock, so a merge landing mid-reset can be rewound without exit-4 detection"
    description: >-
      FR5/a5 が Step I.1 に追加した refresh は、reset のターゲットをブランチ名に
      している点で NFR5 の不変条件は満たすが、並行する merge-task.sh に対して
      atomic ではない。git は reset のターゲット (A) をコマンド開始時に解決し、
      index/worktree を更新したあとで ref を更新するため、checkout 実行中に
      ブランチが A->B へ進むと、その ref 更新は B から A への compare-and-swap
      として通ってしまう。BASE_COMMIT は A として先に捕捉済みなので
      commit-docs.sh の等値チェックも通り、マージが exit 4 を出さずに
      integration の履歴から消える。評価者が high から medium に下げた理由は 4 つ:
      (1) destructive-guard hook が reset --hard を拒否するため経験的な再現が
      できておらず、根拠は git の ref 更新順序というメカニズムのみ。
      (2) ロック無しの `reset --hard <branch name>` は PR 17 の 2 サイトと
      Branch & Worktree Model の exit-4 recovery bullet が既に規範化している
      既存の idiom で、この diff はそれらを変更していない。Step I.1 は既存の
      系全体の性質の 7 番目のサイトであって新しい種類の危険ではない。
      (3) Step I.2.b step 1 が次の wake で申告済みマージを integration の履歴に
      対して再検証するため、消えたマージは下流で検出される。
      (4) 成果物はプロトコルの散文で、この diff に実行行の変更は無い。
    suggestion: >-
      この feature を作り直して対処しない。refresh をロックするなら 7 サイト
      全部と exit-4 recovery bullet に適用する必要があり、FR1 の単一 idiom と
      NFR6 の変更集合宣言に反する。Branch & Worktree Model 自体に対する
      follow-up として記録する — orchestrator 側の refresh を全て
      merge-task.sh と同じ em-workflow-merge.lock で直列化するか、
      exit-4 bullet に「refresh は best-effort であり、権威ある検出は
      commit-docs.sh のロック下 expected_base_tip チェックと
      Step I.2.b step 1 のマージ再検証である」と明記する。
    sources: [codex:comprehensive]
    confidence: 60
    resolution: deferred
    resolution_reason: "medium severity: auto-fix の候補ゲート (critical/high) に届かない。プロトコル全体のロック設計の話であり FR1/NFR6 と衝突するため follow-up として起票した"
