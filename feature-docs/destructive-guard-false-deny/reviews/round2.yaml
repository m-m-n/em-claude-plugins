  title: 'TM-1: mcp-bridge run --args-json の置換本文を、実行先の MCP ツールを問わず再走査から外す'
  description: 再現手順は読解で再現した（reproduced）。示されたコマンドは W1〜W4・S1・C1 をすべて満たし、_single_quote_skip_spans() が置換候補を名指しするので、基準版の deny が allow に変わる。ただしこれは AC-4 / TS-4 が allow を求める形そのもので（MCP サーバー名とツール名が違うだけ）、実装は SPEC どおり。基準版のフックは mcp-bridge の引数を一切読まず、置換で包まない平文の形は変更前から allow になるため、シェル実行型 MCP ツールへの経路は今回の変更で開いたものではない。残る問題は、mcp-bridge の実行先が引数を実行しないという前提を SPEC（A6）と THREAT-MODEL（TM-1）が明記していないこと、TM-1 の緩和策の記述が task0002 で削除した実行系の語の語彙を前提にしたままであること。reviewer は high、evaluator が medium に下げた。
  suggestion: THREAT-MODEL.md の TM-1 を task0002 の形（静的な単一の mcp-bridge run --args-json / printf '%s\n' のデータ語だけを省く）に書き換える。mcp-bridge --args-json の値を実行先にかかわらずデータとして扱うことは、受け入れた残存リスクとして記録する。シェル実行型 MCP ツールへの対処は、mcp-bridge の実行先を判定する別機能として起票する。
  reproduction: '入力: mcp-bridge run --mcp desktop-commander --tool start_process --args-json ''{"command":"echo $(git branch -D example)","timeout_ms":1000,"shell":"bash"}''。これをBashのtool_input.commandとして判定すると、基準版はdeny、変更後はallowになることを確認した。Desktop Commanderが登録されgitを許可する環境では、--args-json → start_process.command → bashという経路で置換本文が実行され、対象リポジトリのexampleブランチを強制削除する。実行経路はgitを表示専用関数に置き換え、branch、-D、exampleが渡されることを確認した。実サーバーでの削除は未実施'
