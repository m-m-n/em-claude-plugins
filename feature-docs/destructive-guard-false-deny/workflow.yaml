schema_version: 1
feature: destructive-guard-false-deny
created: '2026-11-09'
base_branch: main
goal: |
  # destructive-guard がマージ済みタスクブランチの削除と散文中の引用フラグを誤って deny する

  Notion タスク: <notion-url> （種別: バグ）

  ## 現象 (必須)

  `em-workflow/hooks/destructive-guard.py` の `git-branch-force-delete` ルールが、次の 2 つの場面で誤って deny する。

  **1. implement フェーズ規定のタスクブランチ削除が実行できない**

  `em-workflow/references/implement-phase.md` の Step I.2.b step 4 は、マージ済みタスクブランチの後片付けとして強制削除フラグ付きの `git branch` を規定している。同ドキュメントはこのフラグを選ぶ理由もコメントで明記している（オーケストレーターの HEAD は base\_branch であり、タスクブランチは integration へマージされているため通常削除は拒否される）。しかし実際に実行すると destructive-guard が deny する。

  ```txt
  [destructive-guard/git-branch-force-delete] 未マージのブランチを強制削除する（`-D`）。到達不能なコミットが残る。
  ```

  つまりプラグイン自身のプロトコルが規定するコマンドを、プラグイン自身のフックが止めている。

  **2. コマンドではなく散文中に引用したフラグにも反応する**

  Notion へ進捗コメントを投稿するコマンドの引数（Markdown 本文）に、上記の現象を説明するため強制削除フラグの文字列を含めたところ、同じルールで deny された。実行されるコマンドは `mcp-bridge run --mcp notion --tool notion-create-comment --args-json <JSON>` であり、`git` の呼び出しは含まれていない。

  ## 再現手順 (必須)

  **現象 1**

  1. em-workflow の implement フェーズを回し、タスクが 1 つ integration ブランチへマージされた状態にする
  2. メイン作業ツリーで、そのタスクブランチに対して強制削除フラグ付きの `git branch` を実行する
  3. destructive-guard が deny する

  **現象 2**

  1. 強制削除フラグの文字列（ハイフン + 大文字 D）を本文中に含む JSON をファイルへ書く
  2. `mcp-bridge run --mcp notion --tool notion-create-comment --args-json "$(cat <その JSON ファイル>)"` を実行する
  3. destructive-guard が deny する

  ## 期待する挙動 (必須)

  - 現象 1: マージ済みであることが検証済みのタスクブランチの削除は通す。少なくとも em-workflow のプロトコルが規定する形は通る必要がある。もしくは implement-phase.md 側を、フックを通る形（integration worktree からの通常削除）に書き換える。
  - 現象 2: `git` が実際に実行されない位置に現れた文字列には反応しない。`.claude/rules/hook-tests.md` が挙げる既存の allow ケース（クォート内の `rm -rf`、ヒアドキュメント本文、`> /dev/null`）と同じ種類の誤爆。

  ## 完了の定義 (必須)

  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある（`em-workflow/hooks/tests/destructive-guard-cases.json` に allow ケースとして 2 件追加する。既存の deny / ask ケースは消さない）
  - [ ] 現象 1 の解決方針を決める（フック側を緩めるか、implement-phase.md 側の手順を書き換えるか）。両プラグインに同じ判断を反映する

  ## 該当箇所 (任意)

  - `em-workflow/hooks/destructive-guard.py` の `git-branch-force-delete` ルール
  - `em-workflow/references/implement-phase.md` Step I.2.b step 4（タスクブランチの後片付け）
  - テストケース: `em-workflow/hooks/tests/destructive-guard-cases.json`
  - テストランナー: `em-workflow/hooks/tests/run-destructive-guard.py`

  ## 実害・発生条件 (任意)

  - 現象 1 は em-workflow の implement フェーズを回すたびに、マージされたタスクの数だけ発生する。無人実行（`--batch`）では `ask` が `deny` に降格されるため、オーケストレーターが回避手段を持たないとその場で止まる。今回は integration worktree からの通常削除に置き換えて回避したが、これはプロトコルに書かれていない手順である。
  - 現象 2 は、フックやガードの挙動を説明する文章を外部サービスへ送る場面で起きる。ワークフローが自分の不具合を報告しようとすると自分のフックに止められる形になる。
  - 観測は 2026-09-08、feature `muse-spark-contributor-consent` の implement フェーズ実行中。

  ## 追加指示（起動時）

  - 実装完了後、integration ブランチを remote に push し、gh pr create で base_branch への PR を作成する。integration ブランチはローカル・リモート両方に残す（base_branch へ自動マージしない）
  - 不明点は Codex に相談し、相対的に良いと判断した選択肢を採用する
  - その議論内容を Notion に記録する
