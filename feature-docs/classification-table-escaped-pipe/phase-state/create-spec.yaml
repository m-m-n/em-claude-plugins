    normalized_answer: (b) 採用のため、行末の `\|` を外枠パイプとして扱うかの要件（analyst の FR2 / AC3 / TS3）は設けない。
    resolution_note: 'Codex: 現在のstrip(''|'')は、末尾の\|からも「|」を取り除くよ（tests/test_hook_classification_pin.py:163）。そのため（a）では、エスケープされていない末尾の区切りだけを外枠として扱うことを明記し、テストする価値があるよ。ただし最終セルは分類列なので、「|」を保持した値は固定語彙の検証でClassificationTableErrorになる（tests/test_hook_classification_pin.py:172）。分割処理での文字保持と、分類検証での拒否を分けて確認するといいよ。今回選ぶ（b）では、この対応は対象外にする'
    question_id: create-spec.trailing-escaped-pipe
