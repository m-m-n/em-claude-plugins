- stable_id: c9d77d33b47dac08
  severity: medium
  category: comprehensive
  file: em-workflow/hooks/destructive-guard.py
  line: 3104
  title: rmの呼び出し番号が元のコマンド上の順ではなく解析順で振られる
  description: 呼び出し番号は main() が check_rm() を呼んだ順に振られるが、statements() は `bash -c '…'`
    や `$(…)` の本文を後に続く文よりさらに後に返す。このため `echo "$(rm -rf /var/x)"; rm -rf /tmp/y` の拒否理由は「2番目のrmの1番目の対象」になり、左から読むと許可対象の
    `/tmp/y` を指す。`bash -c 'rm -rf /var/valuable'; rm -rf /tmp/safe` でも同じ。判定と rule
    id は変わらず安全側に倒れているが、SPEC FR4 の「複合コマンド内の複数の rm をまたいでも対象を一意に特定できる」を満たさない。3093-3101
    行のコメントと rm_target_designation() の docstring も実際の動きと合っていない。
  suggestion: 呼び出し番号は解析順ではなく元のコマンド文字列に rm が現れる順で決める。各 rm の語の元の位置を保持し、全文を走査し終えてから番号を振って理由文を組み立てる。本文を含む複合コマンド(`bash
    -c`、`$(…)`)の回帰テストを追加する。判定と rule id は変えない(FR5)。
  sources:
  - codex:comprehensive
  confidence: 90
  resolution: unresolved
  resolution_reason: medium のため auto-fix 対象外(完了ゲートは critical/high のみ)。Notion に別タスクとして起票する
