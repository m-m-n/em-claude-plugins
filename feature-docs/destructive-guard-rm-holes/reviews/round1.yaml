    の一意特定の要件に反する。判定と rule id は変わらない。'
  suggestion: 同じ文を2経路で判定する場合も呼び出し番号は1つだけ消費させ、対象番号を元の引数位置に対応させる。FR5 の判定と rule id は維持し、回帰テストを追加する。
  sources:
