follow_up_drafts:
- origin_kind: verify
  origin_id: MANUAL-D2
  title: D2 marker-based current-session resolution fails on transcripts whose first line has no timestamp
  body: '_first_entry_timestamp reads only the first non-empty line of the transcript and returns None
    when that line has no "timestamp" field. Real ~/.claude/projects/{encoded-cwd}/*.jsonl files often
    begin with a record such as {"type":"last-prompt",...} that carries no timestamp (34 of 40 sampled
    files on this machine). As a result _resolve_current_session_via_marker locates the marker-bearing
    transcript but still fails to resolve, so D2 form 2 degrades to current-session-unknown and the I.2.b
    orphan recovery never fires outside form 1 (explicit session id + start). Reproduce by running the
    D2 form-2 path from a real session; the automated suite (TS-1..TS-13) misses it because its fixtures
    always place a timestamp on the first line. Affected: em-workflow/scripts/recover-orphaned-task.py.'
lessons_candidates:
- task0005 itself was orphaned mid-run and recovered by this feature's own helper (journal shows launched
  -> failed(orphaned) -> launched -> merged); the feature dogfooded itself during its own implement phase.
- 'The verify failure was only reachable through a Manual Testing item: the automated fixtures encoded
  an assumption (first transcript line carries a timestamp) that real data violates. Fixtures derived
  from the implementation rather than from sampled real data hid the defect across 3029 tests.'
- VERIFICATION.md carried no verification_index, so the failing Manual Testing item could not be mapped
  to a requirement and had to take the sentinel category "unknown".
