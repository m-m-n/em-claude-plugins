    title: "Journal helper re-checks only the event name under the lock, not which launch the evidence describes"
    description: |
      `decide_and_append`（journal-append-failed.py:165-178）は排他 flock を取ってから
      `last_event_for_task` で replay し、最終イベント文字列が `launched` なら append する。
      呼び出し側が証拠を集めた launch と、より新しい launch を区別する手段が無い。
      recover-orphaned-task.py の D7 binding（324-375 行目）は agents.jsonl entry を最後の
      `launched` イベントに束ねるが、この検査はパイプライン先頭で走るため、transcript 読み取りと
      subprocess 起動の間に別のアクターが `failed` + 再 launch を追記すると、ヘルパーは新しい
      implementer を failed とマークしつつ `appended`/`recovered` を報告する。
      evaluator により high から medium へ降格（同一 feature に対して同時に生きている
      orchestrator が 2 本必要で、SPEC の脅威モデルはそれを約束していない）。
    suggestion: |
      検査対象 launch の不変な識別子（最後の `launched` イベントの `at`、または束ねた
      agents.jsonl entry の `at`）を必須引数としてヘルパーへ渡し、ロック下の replay から
      再導出して一致しなければ `noop_terminal` か専用の residual 結果を返す。
      ヘルパーがロックを取る前に launched → failed → launched が挟まる回帰テストを追加する。
    sources: [codex:comprehensive]
