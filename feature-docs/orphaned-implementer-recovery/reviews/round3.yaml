  - stable_id: ebad15de2c79c36c
    severity: high
    category: spec
    file: em-workflow/references/implement-phase.md
    line: 472
    title: "I.2.b orphan-recovery launches the new helper by repo-relative path, so recovery never fires in an installed plugin"
    description: |
      implement-phase.md:472-473 は orchestrator に `em-workflow/scripts/recover-orphaned-task.py`
      という cwd 相対パスでヘルパーを起動するよう指示している。同じ文書の Step 4（124-127 行目）は
      プラグイン同梱スクリプトの解決規律を既に定めている:
      `MERGE_SCRIPT=${CLAUDE_PLUGIN_ROOT}/scripts/merge-task.sh` を解決し、fail-closed で
      `$HOME/.claude/plugins` / `$HOME/.claude/skills` を `*/em-workflow/*/scripts/*` で探索、cwd は見ない。
      em-workflow はマーケットプレイス経由で任意のプロジェクトへ配布されるため、利用者の cwd 配下に
      `em-workflow/` は存在しない。SPEC AC-2 / FR2 は I.2.b reconcile 中に実際に recovery を走らせる
      ことを要求しているので、配布構成では本 feature の目玉挙動が到達不能になり、全候補が Residual に落ちる。
      496 行目 / 845 行目 / workflow-schema.md:313 は「どのスクリプトが書き手か」の同定であって起動指示では
      ないため対象外（recover-orphaned-task.py は `_SCRIPT_DIR` で兄弟ヘルパーを自力解決している）。
      加えて、このブロックはスクリプトをどの cwd から起動するかを述べておらず、D1 の既定導出
      （`default_transcripts_dir` が `os.getcwd()` を使う）が不定になる。
    suggestion: |
      起動文を `RECOVER_SCRIPT=${CLAUDE_PLUGIN_ROOT}/scripts/recover-orphaned-task.py` に書き換え、
      Step 4 と同じ trusted-root fallback を適用し、Step 4 を owning section として cite する（NFR7）。
      解決に失敗した場合は Residual として扱う旨も明記する。起動時の cwd（feature の integration
      worktree / プロジェクトルート）も同じ文で固定して D1 の導出を決定的にする。
      tests/test_implement_routeback_gate.py:681 が現行の文言
      "invokes `em-workflow/scripts/recover-orphaned-task.py` for the " を逐語で assert しているため、
      同じ変更でこのリテラルも更新する。
    sources: [claude:spec]
