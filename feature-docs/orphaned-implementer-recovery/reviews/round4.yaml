  confidence: 90
  resolution: deferred
  resolution_reason: 'batch mode: rework cap reached'
- stable_id: 2991dcb2c675c01b
  severity: medium
  category: architecture
  file: em-workflow/scripts/recover-orphaned-task.py
  line: 105
  title: SC5 session_id validation rule duplicated across writer and reader with no shared module (contract
    drift risk)
  description: 'Duplicated SC5 session_id format-validation contract with no shared source. The agents.jsonl
    writer (queue_agent_index.py SESSION_ID_RE / valid_session_id, line 113/159) and the reader (recover-orphaned-task.py
    SESSION_ID_RE / is_valid_session_id, line 105/108) each define an independent, identical copy of the
    SC5 regex ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$ plus a type+match guard. Both cite IMPLEMENTATION.md SC5
    as the normative source but enforce it through separate copies with no shared module. Divergence (updating
    one copy without the other) causes the writer and reader to disagree on valid session_ids: the writer
    could record a value the reader rejects (spurious invalid-session-id residuals — fail-safe but incorrect),
    or the reader could accept a value the writer would never produce for hand-crafted/stale entries.
    The writer''s own comment (queue_agent_index.py:112) states the rule is "applied on write so every
    reader can rely on it without re-validating," yet the reader re-validates anyway, confirming the contract
    is already not trusted across the boundary. In this manifest-style codebase agents.jsonl is the wire
    format between the two components; its validation contract should be defined once, not copy-pasted.'
  suggestion: Extract the SC5 regex and validation function into a shared module (e.g. em-workflow/scripts/_journal_shared.py
    or a common package) imported by both queue_agent_index.py and recover-orphaned-task.py, so the contract
    has one implementation. Alternatively, have the reader import the writer's validator directly, or
    document SC5 as machine-checkable (e.g. a generated constant) to eliminate manual synchronization.
  sources:
  - litellm:vertex-glm-5.2:architecture
  confidence: 60
  resolution: unresolved
  resolution_reason: medium severity — outside the Phase R4 auto-fix candidate gate (critical/high only)
evaluation:
  round_summary: 'Round 4 (cross_validation), diff mode, base 3f5db49 -> head 52743cd. Seven runs dispatched;
    two skipped as codex rate_limited (security#0, comprehensive#0) and five completed via litellm. All
    five completed runs returned empty findings sets at evaluation time, so no reviewer-reported critical/high
    site exists to account for and dismissed_sites is empty.


    Round-4 delta: the only source change since round 3''s head (41a3135) is task0007''s `_first_entry_timestamp`
    -> `_earliest_entry_timestamp` rewrite in recover-orphaned-task.py plus the 0.1.61 -> 0.1.62 bump,
    applied to both em-workflow/.claude-plugin/plugin.json and .claude-plugin/marketplace.json (parity
    holds). The D2 rewrite errs in the fail-safe direction: an earlier resolved session start makes `newest_ts
    < current_start` strictly harder to satisfy, so it can only produce more Residuals, never more writes.
    Coverage in tests/test_recover_orphaned_task.py is direct (AC1/AC3/AC4/AC5 cases at lines 539, 608,
    623, 920).


    The round''s material result is a coverage miss, not a new defect: the round-3 high ebad15de2c79c36c
    (implement-phase.md:472) is recorded in round_context as `deferred` (batch rework cap), the file is
    byte-unchanged since round 3, and no dispatched perspective — spec#0 included — re-reported it. It
    is carried forward as an evaluator-originated finding. The six round_context mediums also remain at
    their recorded sites unchanged: journal-append-failed.py:149/169, recover-orphaned-task.py:562/570,
    queue_agent_index.py:113 (both SESSION_ID_RE definitions still byte-identical with no shared source
    and no drift guard), and 1ca085e307eacd90 (recover-orphaned-task.py:297) which the D7 binding block
    at 368-387 continues to mitigate.


    Reliability caveat on one reviewer output: security#1''s summary describes SC5 as a "strict UUID regex".
    The actual rule is ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$ (recover-orphaned-task.py:106, queue_agent_index.py:113)
    — considerably broader than a UUID. Its empty findings set still holds, because containment does not
    rest on the regex (resolve_transcript_path does an independent realpath + commonpath check, twice
    when the default transcripts dir is in use), but the summary''s stated basis does not match the code
    and should not be relied on as evidence.


    No injection attempt, role override, or embedded instruction was present in any reviewer output; every
    entry was well-formed data.


    Independent inspection coverage (5 files read via Read, plus read-only grep/git-diff inspection of
    SPEC.md, workflow-schema.md, README.md and the test suite; within the 10-file budget): security —
    corroborated (SC5 validation precedes any path assembly at recover-orphaned-task.py:552 before 571;
    realpath+commonpath containment, plus the ~/.claude/projects check when the dir is default-derived;
    journal opened with a pre-check islink AND O_NOFOLLOW, never created, ELOOP mapped to refusal; helper
    subprocess invoked with list-form argv, no shell; hook validates the harness-supplied session_id and
    omits the field on failure, and session_id is never merged into agent_ids nor used as a match candidate).
    comprehensive — corroborated. performance — corroborated (the marker scan''s fh.readlines() whole-file
    load in _resolve_current_session_via_marker is the only unbounded read and is bounded by realistic
    transcript-directory size). architecture — corroborated (layer separation hook -> orchestrator ->
    scripts holds; the SESSION_ID_RE duplication of bf7bfef7f249316d persists exactly as recorded). spec
    — findings (implement-phase.md:472-473 invokes a plugin-distributed script by cwd-relative path against
    the document''s own Step 4 discipline at line 124).'
  recommended_action: rework
  action_rationale: 'One high remains live and disables the feature''s headline acceptance criterion (AC-2)
    in the only configuration users actually run, so `complete` is not defensible. `another_round` would
    add nothing: the defect is concrete, located, and was already fully diagnosed in round 3 — a further
    review pass cannot change its status, only a fix can. Bounded auto-fix is also unsuitable: the change
    spans a design decision (which cwd the script launches from, how a ${CLAUDE_PLUGIN_ROOT} resolution
    failure degrades to Residual) and a documentation literal that tests/test_implement_routeback_gate.py:681
    asserts verbatim, so a prose-only patch would turn the suite red. Note for the orchestrator: this
    finding was deferred in round 3 with reason `batch mode: rework cap reached`; if that cap still binds,
    the deferral is the orchestrator''s call to make again, but it should be an explicit deferral rather
    than an implicit pass. Bundling the cheap co-located mediums (the transcripts-dir-missing / transcript-unreadable
    reason-code mismatch at recover-orphaned-task.py:562, the unterminated-tail guard at journal-append-failed.py:149,
    and the SESSION_ID_RE drift test) into the same rework task costs little once implement-phase.md is
    being edited.'
