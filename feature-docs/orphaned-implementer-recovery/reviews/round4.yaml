- stable_id: ebad15de2c79c36c
  severity: high
  category: spec
  file: em-workflow/references/implement-phase.md
  line: 472
  title: I.2.b orphan-recovery launches the new helper by repo-relative path, so recovery never fires
    in an installed plugin
  description: 'Evaluator-originated under the Independent Inspection Duty: every one of the five dispatched
    perspectives returned an empty findings set this round, but independent inspection of the round''s
    changed_files shows this round-3 high is still present, byte-unchanged, at its recorded site.


    Delta check: `git diff 41a3135..52743cd` over the plugin tree shows the ONLY source changes since
    round 3 are recover-orphaned-task.py''s `_first_entry_timestamp` -> `_earliest_entry_timestamp` rewrite
    (task0007) and the 0.1.61 -> 0.1.62 version bump. `em-workflow/references/implement-phase.md` was
    not touched. Round 3 recorded this finding with resolution `deferred` / `batch mode: rework cap reached`
    — deferred, not resolved and not declined — so the defect is live in the artifact under review.


    The defect itself, re-verified directly: implement-phase.md:472-473 instructs the orchestrator to
    invoke `em-workflow/scripts/recover-orphaned-task.py` — a cwd-relative path. The same document''s
    Step 4 (line 124) already fixes the discipline for plugin-shipped scripts: resolve MERGE_SCRIPT=${CLAUDE_PLUGIN_ROOT}/scripts/merge-task.sh;
    fail-closed with the same trusted-root fallback discipline as the review protocol (search $HOME/.claude/plugins
    / $HOME/.claude/skills with path filter */em-workflow/*/scripts/*, never cwd). A repo-wide grep confirms
    ${CLAUDE_PLUGIN_ROOT} is the plugin-wide convention for every distributed asset (merge-task.sh, commit-docs.sh,
    references/, agents/, skills/); implement-phase.md:473 is the sole outlier that names a distributed
    script by cwd-relative path.


    em-workflow is distributed through the marketplace into arbitrary projects, where no `em-workflow/`
    directory exists under the user''s cwd. SPEC AC-2 ("In I.2.b reconcile, ... a `failed` event with
    reason `orphaned` is recorded in the journal") and FR2 therefore cannot be satisfied in the installed
    configuration: the invocation fails and every candidate falls to Residual, which is exactly the pre-feature
    behaviour. The feature''s headline acceptance criterion is unreachable in the only configuration users
    run.


    Secondary, same site: the block does not state the cwd from which the script is launched, leaving
    D1''s default derivation (`default_transcripts_dir` -> `os.getcwd()`) indeterminate. Lines 496 and
    845 are out of scope — they identify which script writes the journal, and recover-orphaned-task.py
    self-resolves its sibling helper through `_SCRIPT_DIR`.'
  suggestion: Rewrite the launch sentence as RECOVER_SCRIPT=${CLAUDE_PLUGIN_ROOT}/scripts/recover-orphaned-task.py,
    applying the same fail-closed trusted-root fallback Step 4 defines and citing Step 4 as the owning
    section rather than restating it (NFR7). State explicitly that a resolution failure is treated as
    Residual. Pin the launch cwd (the feature's integration worktree) in the same sentence so D1's derivation
    becomes deterministic. tests/test_implement_routeback_gate.py:681 asserts the current wording verbatim
    ("invokes `em-workflow/scripts/recover-orphaned-task.py` for the "), so that literal must be updated
    in the same change.
  sources:
