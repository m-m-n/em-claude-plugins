feature: codex-guard-anon-arg-backquote
created: '2026-10-17'
base_branch: main
goal: |
  # codex-hook-interactive-guard: 匿名関数の引数中の ( 〜 ) 範囲にバッククォートがあると範囲を誤って閉じ、-c 文字列全体を判定不能にして本体の python3 -i を見逃す（回帰）

  Notion タスク: <notion-url> （種別: バグ）

  ## 現象
  `codex-hook-interactive-guard.py`（em-workflow / em-review の両コピー）が、zsh 匿名関数の引数中の `(`〜`)` 範囲にバッククォートがあると、範囲の終端をバッククォート内の `)` と誤認する。残ったバッククォートが未閉鎖と判定され、`-c` 文字列全体が判定不能（無出力）になり、匿名関数本体の明示的な `python3 -i` の deny が外れる。
  feature `codex-guard-anon-stdin-args`（引数中の `(`〜`)` を 1 語として読む変更）で入った後退。変更前は deny だった。review round 1 の指摘（stable_id `1241d15972c80d75`、severity medium、category security）。

  ## 再現手順
  1. `tool_input.command` に `zsh -c 'setopt nonomatch nobareglobqual; function { python3 -i; } foo(`case x in x) echo x;; esac`)'` を設定した JSON をフックの標準入力へ渡す（コマンド自体は実行しない）
  2. 変更後は終了コード 0・空出力になる（変更前は `permissionDecision: deny`）

  ## 期待する挙動
  範囲内に引用されていないバッククォートがあるときは、`;` `&` 改行を含む場合と同じく従来の群の読みに戻し、本体の `python3 -i` を deny する。

  ## 完了の定義
  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある
  - [ ] `tests/test_codex_hook_interactive_guard.py` の `CASES` に上のコマンドを deny として追加
  - [ ] 両コピーがバイト単位で同一のまま

  ## 該当箇所
  - `em-workflow/scripts/codex-hook-interactive-guard.py` の `_scan_parens`（724-764行）、`_read_argument_parens`（785-790行）
  - `em-review/scripts/codex-hook-interactive-guard.py`（同一内容）
  - 記録: `feature-docs/codex-guard-anon-stdin-args/reviews/round1.yaml`（ブランチ `em-workflow/codex-guard-anon-stdin-args/integration`）

  ## 実害・発生条件
  見逃し側（fail-open）。THREAT-MODEL の TB-1/TM-2（明示的な -i は拒否する）を満たさない。書かれる見込みの小さい形。

  ## 追加指示
  - 実装完了後、integration ブランチを push し、base_branch へ gh pr create で PR を作る。integration ブランチはローカル・リモート共に残す（自動マージしない）。
  - 不明点は Codex に相談し、比較して良い方を採用する。議論内容は Notion に記録する。
