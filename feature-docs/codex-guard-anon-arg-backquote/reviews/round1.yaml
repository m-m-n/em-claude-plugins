  title: 'バッククォートを含む引数の範囲で空白の後の # がコメントになり本体の python3 -i の deny が外れる'
  description: 'バッククォートを含む引数の範囲は仮に開いた群として読まれるようになった（943〜948 行）。群の読みでは、語の途中にない # はコメントの始まりになり行末まで読み飛ばされる。foo(`echo x` #) では群が閉じず、_rescue_argument_groups も救済しないため _Undecidable(''group'') で何も出力されない。zsh では語の途中の ( 〜 ) の中の空白と # は語の一部。変更前は deny していた。em-review のコピーにも同じ問題がある。'
  suggestion: 'バッククォートで群の読みに戻した範囲で、空白の後の # がコメントになって群が閉じない形をどう扱うか決める。仮定 A2 と FR5 に触れるので、SPEC で扱いを決めてから両コピーと CASES（foo(`echo x` #) の形）を揃える'
  reproduction: 'tool_input.command に「zsh -c ''setopt nonomatch nobareglobqual; function { python3 -i; } foo(`echo x` #)''」を設定した JSON をフックへ渡すと、標準出力が空になる'
