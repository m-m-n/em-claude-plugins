- stable_id: dfdc820511d4c859
  severity: medium
  category: security
  file: em-workflow/scripts/codex-hook-interactive-guard.py
  line: 1200
  title: 入れ子のバッククォート（\` のエスケープ）を含む引数で本体の python3 -i の deny が外れる
  description: この差分で、匿名関数の引数中の ( 〜 ) 範囲にバッククォートがあると、_read_argument_parens（943〜948 行）が範囲を 1 語として読まず、仮に開いた群に戻すようになった。群の読みでは、引用符の外のバッククォートを parse の 1200〜1205 行が s.find("`", i + 1) で閉じる。このため、バックスラッシュで打ち消したバッククォート（入れ子のコマンド置換の \`）も終端として扱われ、_Undecidable('quote') で本体の明示的な python3 -i が判定されない。変更前は deny していた。em-review のコピーにも同じ問題がある。
  suggestion: 引用符の外のバッククォートの終端を探すときも、_skip_substitution の b 文脈と同じくバックスラッシュの組を読み飛ばす。両コピーに流す CASES に、引数の範囲に入れ子のコマンド置換（\`）を含む形の deny ケースを足す
  reproduction: tool_input.command に「zsh -c 'setopt nonomatch nobareglobqual; function { python3 -i; } foo(`echo \`echo x\``)'」を設定した JSON をフックへ渡すと、拒否 JSON が出ず標準出力が空になる
  reproduction_alternates: []
  reproduction_overflow: false
