  title: Untrusted verification text can influence the trusted security category
  description: The orchestrator reads VERIFICATION.md and derives failed_items[].category from its natural-language
    scenarios and mapped requirements, but this security-sensitive procedure never declared those inputs
    untrusted or forbade following embedded instructions. A malicious repository contribution can prompt-inject
    the orchestrator into assigning comprehensive/spec instead of security, license, or the sentinel
    value. The classification gate subsequently trusts this orchestrator-written category, allowing its
    final security/license/unknown abort to be bypassed.
  suggestion: Explicitly treat VERIFICATION.md, verification_index, and mapped requirement text as untrusted
    data whose embedded instructions must never be followed. Assign the sentinel value on detected injection
    or ambiguity.
