- stable_id: 3e33ee58a8e170ce
  severity: high
  category: security
  file: em-workflow/references/workflow-patch.md
  line: 301
  title: Applied patch identity is not bound to the current authorization
  description: Recovery matches an applied patches[] entry using only the worker-controlled patch_id,
    then separately asserts that the current spec_change record still stands. The persisted patch entry
    has no authorization generation or spec_change identity binding. A malicious planner can replay a
    patch_id from an earlier applied pass during a later spec-change authorization; recovery then performs
    only rule 18 and spends the fresh one-shot authorization without applying the current re-plan, recreating
    the permanent authorization wedge.
  suggestion: Persist an immutable authorization identifier with both the spec_change record and each
    proposed/applied patch. Require an exact match during recovery, together with the current request/patch
    association, and reject patch IDs previously associated with another authorization.
