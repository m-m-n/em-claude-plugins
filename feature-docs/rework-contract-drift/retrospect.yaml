lessons_candidates:
- topic: git stash is shared across worktrees
  raw: 'task0002 and task0005 implementers hit this simultaneously in round 1: refs/stash is shared across
    all worktrees of this repository, so stashing for red-confirmation swapped their diffs. Both self-detected
    via git status, backed up with cp and a redirected diff, restored with a checkout of the path from
    HEAD, and redid their edits; no cross-worktree write occurred and the merged result was clean. Both
    independently proposed the same remedy: drop stash usage from the worktree-task-workflow skill in
    favour of a cp backup plus a checkout from HEAD. In round 2 both implementers were warned in their
    dispatch prompt and neither hit it.'
- topic: destructive-guard blocks the branch force-delete the protocol prescribes
  raw: implement-phase.md I.2.b step 4 prescribes the force-delete flag (-D) for a merged task branch,
    reasoning that the orchestrator's HEAD is base_branch so the safe flag would refuse. destructive-guard
    denies it as [destructive-guard/git-branch-force-delete]. Running the safe delete flag inside the
    integration worktree instead succeeds, because that worktree's HEAD is the merge target - and it
    is safer, since it leaves no unreachable commits. That form was used for both task0007 and task0008
    cleanup. The protocol text should switch to the safe flag scoped to the integration worktree.
- topic: review-editor's single-file contract structurally conflicts with byte-identity pins
  raw: 'tests/test_gate_option_vocabulary.py pins the sha256 of workflow-patch.md, validate-worker-output.py,
    tests/test_validate_worker_output.py and one fixture. Any R4 auto-fix targeting a pinned file cannot
    leave the suite green, because refreshing the pin needs a second file and review-editor may write
    only the finding''s own file. This aborted candidates in round 1 (f5f1343dc0b8d389, 47f535a25cbb9be9)
    and again in round 2 (two highs) - i.e. the strongest findings are exactly the ones R4 can never
    fix. Candidate remedies: give R4 a pre-dispatch pin-awareness check so such candidates are classified
    as needs-rework rather than dispatched-and-reverted, or allow review-editor a narrowly scoped second
    file when that file is a digest-pin module.'
- topic: content pins also break additive prose edits
  raw: Round 2 loop 1's editor reworded a sentence that tests/test_failed_items_category.py pins verbatim,
    turning the suite red; loop 2 succeeded only because the dispatch prompt named all seven pinned substrings
    and required a purely additive edit. R4 could extract such pins mechanically (a test module asserting
    substrings of the target file) and hand them to the editor as constraints, instead of discovering
    them via a red suite.
- topic: validator's TS-id regex does not match this project's own scenario ids
  raw: 'scripts/validate-worker-output.py''s _TS_ID_RE is TS-<digits> with a hyphen, but every VERIFICATION.md
    in this repository writes TS1..TS18 without one. Consequence: the rework-planner contract''s check
    3 (new_scenarios really added, verified by diffing against a baseline) can never pass - the extractor
    returns an empty set for both sides. The orchestrator had to verify checks 3 and 4 by hand. Either
    the regex should accept both forms or the template should emit hyphenated ids.'
- topic: develop's argument handling for a handover file
  raw: 'This run was launched as `/em-workflow:develop --batch tmp/handover-rework-contract-drift.md`.
    Per the argument rules an existing file is a task description, which would have started a NEW feature
    via create-spec; the file''s actual content was a resume instruction naming an existing feature with
    a live branch and worktree. The orchestrator resolved it as a resume and said so. Worth deciding
    deliberately: either document that a file argument is always a task description (and that resuming
    requires the bare feature name), or let develop recognise a handover document.'
- topic: rework-planner envelope shape is easy to misread
  raw: references/contracts/rework-planner-contract.md shows existing_tasks / next_task_id / verification_index
    / the three document paths as siblings of rework_source, but the YAML block's indentation makes it
    easy to read them as nested inside it. The orchestrator nested them on the first attempt and validate-worker-output.py
    rejected every covered_by_existing id, because it reads verification_index from the envelope's top
    level. A worked example of the full envelope, or a stated value_inputs boundary, would remove the
    ambiguity.
- topic: R4's post-productive-loop reviewer re-run has no cheap variant
  raw: The protocol requires re-running all selected reviewers after any productive loop. In round 2
    that meant nine reviewers to re-confirm eight findings whose disposition was already fixed by the
    consumed rework cap, for a one-file additive documentation fix whose safety the suite verifies mechanically.
    The re-run was skipped and recorded as a deviation in reviews/round2.yaml. A scoped variant - re-run
    only the perspectives whose findings the loop touched, or skip when a clean termination is provably
    unreachable - would make the rule affordable.
- topic: the same site survived a full rework round
  raw: workflow-patch.md's interrupted authorization-spend recovery was the round-1 conflict site (three
    divergent prescriptions, skipped) and is again the round-2 top finding (four reviewers, two perspectives,
    high). The rework closed the specific hole round 1 named and introduced an adjacent one in the same
    paragraph. Signal that a conflict-skipped site handed to rework without resolving the conflict first
    tends to produce a new variant rather than a fix - the batch conflict policy (skip the site) and
    the rework path may need to be connected, e.g. by having rework-planner resolve the conflict explicitly
    and record which prescription it adopted.
