  requirement.fr3.verify-origin-category-failclosed:
    packet_id: create-spec-q0001
    answered_at: "2026-08-24T22:20:00+09:00"
    source: user
    answer_mode: select_or_freeform
    selected_option_ids: [structure_failed_items]
    freeform: null
    normalized_answer: >-
      Direction (b): structure `workflow.yaml`'s verify-step `failed_items` so each
      entry carries a required `category`, and have question-resolution.md's
      direction 2 cite that definition instead of reading a field that cannot exist.
      Vocabulary reuses the review-perspective set plus an `unknown` fail-closed
      sentinel: comprehensive | spec | security | performance | architecture |
      license | unknown. The verify-phase orchestrator assigns it when recording
      `failed_items` (evidence: the failing VERIFICATION.md scenario and the
      requirement IDs it maps to via verification_index); it assigns `unknown`
      whenever the evidence is insufficient, unmapped, contradictory, or cannot
      exclude security/license. The fail-closed abort lives at the classification
      gate, NOT in the verify phase: the gate aborts on `security`, `license`,
      `unknown`, missing, unreadable, or out-of-vocabulary. Verify still records
      `unknown` and lets the case reach the gate, because aborting during verify
      would recreate the FR7 violation. Documents to change: workflow-schema.md,
      skills/develop/SKILL.md verify step 4, question-resolution.md, and the
      validator; SPEC, VERIFICATION.md format, verification_index, retrospect and
      rework-planner do NOT change.
    resolution_note: >-
      Decided by the user across two turns with a two-turn Codex consultation
      (references/question-resolution.md "Codex consultation procedure"; wrapper
      run readonly). Codex's first-turn recommendation — a third option making
      origin_kind=verify structurally ineligible for rework.spec-change — was
      rejected on evidence: the task0028 plan that introduced origin_kind=verify
      had already considered and rejected that exact alternative because it
      contradicts FR7 ("every case that reaches gate_id: rework.spec-change passes
      through the gate") and would require a SPEC change. Option (a) was rejected
      as functionally identical to that third option: with no `category` on
      `failed_items`, "unreadable category -> abort" makes every verify-origin
      spec-change question abort, the same FR7 violation by another mechanism.
      Option (b) is the only direction satisfying FR7 and NFR2 simultaneously.
      Codex agreed on turn 2 once given the FR7 evidence and contributed the
      `unknown` sentinel and the gate-side placement of the fail-closed rule.
