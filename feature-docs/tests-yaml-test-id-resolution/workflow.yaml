schema_version: 1
feature: tests-yaml-test-id-resolution
created: '2026-10-09'
base_branch: main
goal: '# test-docs/**/*.tests.yaml の acceptance test ID 約 769 件が unittest で解決できない


  Notion: https://www.notion.so/3f03509ec8ee818699cee63983ad9368


  ## 現象 (必須)

  `test-docs/**/*.tests.yaml` の `acceptance_tests.*.tests` に列挙された acceptance test
  ID のうち、約 769 件（約 115 ファイル）が `unittest.TestLoader().loadTestsFromName()` で解決できない（ImportError
  / AttributeError、または `loader.errors` に記録される）。

  - 調べた ID は約 6,734 件（空白を含む自由記述の要素は除外）。`tests/` を `sys.path` に入れ、`tests.` 接頭辞の無い古い形式の
  ID も解決を試みたうえでの件数。

  - 件数の多いファイル: `test-docs/failed-run-cleanup-guard/task0001.tests.yaml`（41）、`test-docs/llm-led-review/task0001.tests.yaml`（39）、`test-docs/abort-phase-terminal/task0001.tests.yaml`（38）、`test-docs/destructive-guard-command-name-substitution/task0002.tests.yaml`（35）、`test-docs/agent-separation/task0016.tests.yaml`（34）

  ## 再現手順 (必須)

  1. リポジトリルートで `test-docs/**/*.tests.yaml` を全部読み、各 AC の `tests` の ID を取り出す

  2. `tests/` を `sys.path` に入れ、各 ID を `unittest.TestLoader().loadTestsFromName()`
  で解決する

  3. 例外になる、`loader.errors` に記録される、またはテスト数が 0 になる ID を数える

  ## 期待する挙動 (必須)

  `{T}.tests.yaml` は verify / rework / retrospect が AC からテストを解決する SSOT なので、列挙された ID
  はすべて実在し、unittest で解決できること。テストのリネームや削除で記録と実装がずれたら検出できること。

  ## 完了の定義 (必須)

  - [ ] 再現手順で現象が起きない

  - [ ] 再発を検出するテストがある

  ## 該当箇所 (任意)

  - `test-docs/**/*.tests.yaml`（約 115 ファイル）

  - 記録を書く側: `em-workflow/references/implement-phase.md` の `{T}.tests.yaml` の規則、implementer
  エージェント

  ## 実害・発生条件 (任意)

  AC のカバレッジ主張が検証できない記録が多数残っている。原因は、テストのリネーム・削除・統合のあとに記録が更新されていないこと、ID の書式（`tests.`
  接頭辞の有無など）が揃っていないことと見られる（未確認）。

  出典: em-workflow feature `exit4-ac2-test-id-drift`（Notion タスク https://www.notion.so/3d53509ec8ee81bb8615d901df21168c
  ）の create-spec で見つけた。その feature は `test-docs/exit4-tip-argument/task0002.tests.yaml`
  の 1 件だけを直し、再発検出テストの対象もそのファイルに限定したため、残りはスコープ外とした。


  ## 追加指示（起動引数）

  - 実装完了後、integration ブランチを remote に push し、gh pr create で base_branch への PR を作成する。integration
  ブランチはローカル・リモートとも残す（base_branch へ自動マージしない）

  - 不明点は Codex に相談し、比較的良いと判断された案を採用する

  - その議論内容を Notion に記録する

  '
