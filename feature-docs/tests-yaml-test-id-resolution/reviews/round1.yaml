findings:
- stable_id: 7fc3218d8701bcd5
  severity: medium
  category: spec
  file: tests/test_tests_yaml_id_resolution.py
  line: 565
  title: 単独の `tests` が `tests.` 始まりの ID として検査を通る
  description: 'canonical_id_failure は先頭セグメントが tests かどうかしか確認しないため、セグメントが 1 個だけの `tests` も通してしまう。tests/ には __init__.py が無く名前空間パッケージとして扱われるので、構造判定はモジュールとして成功する。さらに loadTestsFromName(''tests'') は 0 件のスイートを返し、失敗にならない。その結果、何も選ばない `tests: [tests]` の記録が全件検査を通る。SPEC の FR1・FR6 は ID が `tests.` で始まることを求めている。test/README.md も「IDs start with `tests.`」と書いている一方、同じ README の Syntax gate は「one or more dot-separated segments」としており、記述が食い違っている。'
  suggestion: セグメント数を 2 以上に限る（len(parts) < 2 を不正とする）。README の Syntax gate を two or more segments に揃え、単独の tests を拒否するフィクスチャテストを足す。
  reproduction: null
  reproduction_alternates: []
  reproduction_overflow: false
  sources:
  - codex:spec
  confidence: 90
  resolution: unresolved
  resolution_reason: severity below auto-fix floor (critical/high only); handed to a follow-up task
- stable_id: 82aa58149e9c9219
  severity: medium
  category: spec
  file: tests/test_tests_yaml_id_resolution.py
  line: 408
  title: 抽出エラーがある AC では、読めた ID も解決判定されない
  description: parse_tests は、要素が 1 つでも未対応の表記だと clean=False になり None を返す。parse_acceptance は、誤りが 1 件でもある AC を bad に入れて acs から外す。check_record が解決判定するのは acs の ID だけなので、同じ AC にある正しく読めるスカラー ID は判定されない。存在しない ID が混ざっていても、失敗メッセージには出てこない。記録は抽出エラーで失敗するので見逃しにはならない。ただ、抽出エラーを直した後の実行で初めて解決エラーが出る 2 段階の修正になり、FR5 の「抽出エラーと解決エラーは途中で止めず全件集め」から外れる。check_record の docstring はこの動きを明記しているので意図した設計だが、SPEC の本文とは合わない。
  suggestion: 抽出できたスカラー ID を AC の誤りとは別に持っておき、抽出エラーのある AC でも読めた ID は解決判定して、両方の誤りを並べる。AC キーの重複のように ID がどの AC に属するか決まらない場合は、今どおり除外してよい。マッピング要素と存在しない ID を混ぜたフィクスチャテストを足す。
  reproduction: null
  reproduction_alternates: []
  reproduction_overflow: false
  sources:
  - codex:spec
  confidence: 80
  resolution: unresolved
  resolution_reason: severity below auto-fix floor (critical/high only); handed to a follow-up task
- stable_id: c29f59fbd73c0d7b
  severity: medium
  category: comprehensive
  file: tests/test_tests_yaml_id_resolution.py
  line: 92
  title: 読み取れない配下ディレクトリの記録が黙って検査から抜ける
  description: enumerate_records の os.walk に onerror が指定されていない。そのため、配下ディレクトリを一覧できないとき（PermissionError など）のエラーが黙って捨てられ、その下の記録は列挙も検査もされない。ほかに記録が 1 件でもあればゼロ件ガードも通る。FR8 は読み取りに失敗した記録を空扱いにしないことを求めているが、ディレクトリ単位の読み取り失敗はこの保証から漏れている。通常のチェックアウトで起きる条件ではない。
  suggestion: onerror で走査エラーを集め、対象パス付きの失敗として報告する（ゼロ件ガードと同じクラスで落とすなど）。onerror を模擬したテストを足す。
  reproduction: null
  reproduction_alternates: []
  reproduction_overflow: false
  sources:
  - codex:comprehensive
  confidence: 75
  resolution: unresolved
  resolution_reason: severity below auto-fix floor (critical/high only); handed to a follow-up task
- stable_id: e8a04df8de3b1661
  severity: low
  category: comprehensive
  file: tests/test_tests_yaml_id_resolution.py
  line: 700
  title: load_tests がスイート以外を返すと TypeError で記録の検査が止まる
  description: _loader_failure は loadTestsFromName の戻り値を _walk_suite で反復するが、この反復は try の外にある。対象モジュールの load_tests フックが None などスイート以外を返すと、resolve_id から TypeError が送出される。すると check_record が止まり、同じ記録の後続の ID が判定されない。記録のテストはエラーとして失敗するので、ずれの見逃しにはならない。この条件は load_tests フックを持つモジュールに限られる。
  suggestion: 戻り値が unittest.TestSuite であることを確認する。反復中の例外も、ID ごとの解決エラーとして返す。
  reproduction: null
