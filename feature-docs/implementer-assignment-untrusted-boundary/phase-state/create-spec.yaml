    normalized_answer: 信頼済みの欄の後に、未信頼データと明示したデータ節を置き、各値は 1 行の JSON 文字列（リストは文字列の JSON
      配列）で書く。実装者はコマンドを復号した文字列そのままで実行する
    resolution_note: 'policy create-spec.requirement-clarification: codex_consultation
      (harness: codex, 1 turn). Codex recommended json_string_values: one-line JSON
      escapes newlines so a value cannot forge the header / task_id / worktree_path
      lines the hooks match first (queue_launch_guard.py:71); decoded commands keep
      verbatim execution (worktree-task-workflow SKILL.md:117). Caveats recorded:
      JSON alone does not guarantee non-compliance, so the data-not-instructions rule
      must also be stated; bash_guard strips surrounding whitespace (bash_guard.py:152,179,208)
      so the spec must not claim raw byte equality beyond the existing rule. Not chosen:
      delimited_block (end-marker / newline breakout), instruction_only (no structural
      separation). Opus escalation not run.'
