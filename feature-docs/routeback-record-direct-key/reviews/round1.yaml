findings:
  - stable_id: 6ed302170de498f8
    severity: medium
    category: security
    file: em-workflow/hooks/queue_stop_guard.py
    line: 260
    title: "TM-1: 直下キーと同じ字下げの引用文字列継続行が記録として読まれる"
    description: "記録の読み取りは字下げだけで直下キーかどうかを判定している。そのため、notes の複数行ダブルクォート値で、継続行が直下キーと同じ 4 個の空白で字下げされていると、routeback_failed_journal_line: N の行がタスクの記録として採用される。PyYAML はこの形を受け付け、その行を notes の文字列として読む。(a) 直下キーの記録が無い pending/failed のタスクで偽の値が failed イベントの物理行と一致すると hook が exit 2 を返し、利用者の判断待ちを迂回する。(b) notes が記録より前にあるため、一致しない値が本物の記録を隠し、hook が exit 0 になる。YAML 1.2 の文法を厳密に適用するとこの継続行は 5 個以上の空白が要り、再現入力は厳密には不正な YAML で、SPEC A1 の前提の外にある。単一引用符の複数行スカラーや複数行のフロー形式コレクションにも同じ種類の穴がある。追加テスト notes_double_quoted は継続行を 6 個の空白で字下げしており、この境界を検証していない。"
    suggestion: "直下キーの行の値が引用符またはフロー形式の括弧で始まりその行で閉じない場合は、閉じるまで後続行を記録候補から外す（エスケープを考慮する）。continuation_indent=4 の偽造と隠蔽の回帰テストを足す。A1 のまま据え置くなら、この制限を hook の docstring と THREAT-MODEL の残存リスクに明記し、notes をブロックスカラーで書く書き手側の規則を別タスクとして起票する。"
    sources: [codex:security, codex:comprehensive]
    confidence: 85
    resolution: unresolved
    resolution_reason: "medium のため自動修正の対象外。SPEC A1（正しい YAML の前提）の外にあり、対策には仕様の拡張が要るため別タスクとして起票する"
