  title: printf -v scan breaks _read_word_as_written Tok contract by passing str
  description: _read_word_as_written(marked, tok) requires a Tok carrying span/substitution_only/trailing_cr plus MarkedText.top_regions to restore the word as written. The printf -v option loop passes text=str(t), a plain str whose span lookup is always None, so it unconditionally falls back to _read_plain_word() and never exercises the single/double/ANSI-C/backslash restoration the comment promises. The security decision (whether -v is present, whether quoting/expansion forces a stop) then depends on Tok.value formatting instead of the typed contract, so future lexer/value changes silently alter masking without a type error. The cmd_index loop also calls _read_word_as_written(marked, t) twice per token instead of caching the restored word.
