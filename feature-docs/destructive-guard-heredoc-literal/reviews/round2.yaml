  title: trap の実行文字列や printf -v の間接代入で python3 の実行先を差し替えても、リテラルを読まない扱いが止まらない
  description: '読解で再現を確認した。読まない扱いを止める判定（_masking_stop_reached() と _overrides_command_name()）は、文のコマンド語と各語の文字列しか見ない。(1) `trap ''hash -p /bin/bash python3'' DEBUG` はコマンド語が trap で、STOP_COMMAND_WORDS に無い。trap の実行文字列を文として読み直す処理もガードのどこにも無い（trap を扱う箇所が無い）。そのため、中の hash は差し替えとして検出されない。(2) `n=BASH_; n+=CMDS; printf -v "$n[python3]" /bin/bash` では、どの語にも BASH_CMDS が現れない（STOP_VARIABLE_NAMES の部分一致に掛からない）。`n+=CMDS` と printf も停止語ではない。どちらの形でも、続く `python3 -s <<''PY''` は短いオプション群の条件（c も m も含まない）を満たすので、本文のリテラルが隠されて allow になる。変更前は本文を丸ごと読んで deny だった。bash は単純コマンドの探索より前に DEBUG trap を実行し、BASH_CMDS への代入はハッシュ表に入る。そのため実際には /bin/bash が本文を実行する。THREAT-MODEL の TM-2・TM-8・TM-9 は「差し替えや状態変更の文はどこにあっても読まない扱いを止める」と主張しているが、それが成り立たない。補足: コマンドを操れる攻撃者には、SPEC A-3（os.system 経由）というもっと簡単な迂回がすでに受け入れ済み。このため実害の増分は限られる。ただし FR9 は同じ程度に作為的な形（波括弧展開やチルダのコマンド語）まで塞ぐ基準を取っているので、この基準に照らして high のままとした。'
  suggestion: '読まない扱いを止める文に次の 2 つを加える。(a) trap: 実行文字列をシェルの文として読み直すか、trap そのものを停止語にする。(b) 名前で変数に書き込む組み込み: printf -v、read、mapfile / readarray、getopts。printf を丸ごと停止語にすると誤爆が増えるので、-v のときに限る。FR9 (2) の列挙と TM-9 の更新を伴うので、SPEC で語彙の範囲を決めてから直す。2 つの形を deny 側のケースとして足す。'
  sources:
