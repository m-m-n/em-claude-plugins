  title: Python 本文の文頭にある識別子（source、set、hash、eval など）で、リテラルを読まない扱いが止まる
  description: 読解で確認した。Python 本文のチャンクで _masking_stop_reached() が免除するのは、静的に確定できない語だけ。停止語との照合と、statements() で OR される差し替えの読み方（7988〜7996 行）はそのまま適用される。そのため `source = "safe"`、`set([1, 2])`、`hash = hashlib.sha256()`、`eval(...)`、`local = ...`、`alias = ...` のような、Python としてありふれた文頭が停止語として読まれる。すると同じコマンドのすべての Python 本文で読まない扱いが止まり、deny に戻る。変更前（deny）より悪くはならない。しかし、機能の目的（無人 batch をここで止めない）が普通の Python 本文で効かなくなる。この挙動は SPEC どおりで、FR9 の最終段落は本文の読み直しに (3) だけを免除し、TM-10 も (1)(2) を全チャンクに適用すると定めている。直すには SPEC の判断が要る。round 1 の a27d22e16d633976（unresolved）と同じ指摘。
  suggestion: 引用符付き区切り語の Python 本文チャンク（PY_BODY）では、読まない扱いを止める判定に FR9 (1)(2) も適用しないよう SPEC を改める。FR7 の差し替えフラグは今のまま立てる。区切り語に引用符が無い本文の置換から作ったチャンクには、引き続き全項目を適用する。`source = "safe"` や `hash = 1` の後にリテラル内のバッククォートを置いた形を allow 側のケースとして足す。
