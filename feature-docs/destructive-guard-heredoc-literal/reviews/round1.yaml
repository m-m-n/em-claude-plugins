  title: 逆斜線で引用した数字（\0）を記述子番号と見なしている
  description: _tokenize_marked() の fd_prefix は quoted が偽であることを条件にしているが、quoted は引用符の領域（単一・二重・ANSI-C・ロケール）と shlex の引用状態だけを見ており、逆斜線のエスケープでは立たない。shlex は \0 を 0 として返すので、python3 \0<<'PY' で 0 に fd_prefix が付く。bash は逆斜線で引用した数字を記述子番号として扱わず、0 をスクリプトのオペランドとして python3 に渡すので、heredoc はスクリプト 0 の標準入力になる。ガードはこれを fd 0 の heredoc と読んでリテラルを隠し、変更前の deny が allow になる。python3 0 <<'PY' を deny で固定したケースと同じ不変条件が崩れている。読解で基盤を確認した。
  suggestion: fd_prefix は、トークンの元の範囲のテキストが ASCII 数字だけ（逆斜線を含まない）のときだけ立てる。python3 \0<<'PY' を deny 側のケースとして足す。
