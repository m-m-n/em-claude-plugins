  line: 5914
  title: 外側の文が printf -v / read だと、Python の出力が配列添字として bash に再評価されるのに本文のリテラルを隠す
  description: '_is_python_program_chain() は外側の文が DATA_COMMANDS の語で始まれば通す。DATA_COMMANDS は「標準入力や引数をプログラムとして実行しない」前提の一覧で、引数を再評価しないことまでは保証しない。printf は -v の代入先の配列添字を、read は代入先の名前の配列添字を bash が算術評価し、その中の $( ) を実行する。printf -v "$(python3 <<''PY''\nprint(''a[$(git branch -D example)]'')\nPY\n)" x は、変更前は本文の単一引用符内の $( ) が候補として queue されて deny、変更後はリテラルが _ で埋まり allow になる（コードを読んで確認: printf は DATA_COMMANDS に含まれ、外側の段に -v の扱いは無い）。実行するのは Python ではなく外側の bash なので SPEC A-3 の受け入れ範囲外で、FR2(c)（外側の文に sink が無い）の意図に反する。既存ケース opt=-v; printf "$opt" ''a[$(git branch -D example)]'' x が deny で固定している経路と同じもの。評価者の読解で、read "$(python3 …)" <<< x も同じ再評価を起こすことを足しておく。'
  suggestion: 外側の文の許可を DATA_COMMANDS 全体から、引数を名前や添字として評価しない語に絞る（read は外す。printf は -v を取りうる形、つまり先頭以外の引数位置も含めて静的に -v が無いと確かめられない形を外す）。配列添字への代入だけの文（a["$(python3 …)"]=1 など）も同じ再評価を起こしうるので、代入だけの文を通す条件も確かめる。printf -v と read の deny ケースを destructive-guard-cases.json に足す。
  sources:
