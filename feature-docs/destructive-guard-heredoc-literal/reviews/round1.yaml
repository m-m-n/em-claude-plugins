  title: 長い記述子番号の int() 変換で未処理例外になり、フックが判定を出さずに終わる
  description: '_python_program_redirects() は fd_prefix の付いた数字列を長さの制限なく int() に渡す。Python 3.11 以降は既定で 4300 桁を超える整数文字列の変換が ValueError になる（この環境は Python 3.14.4）。run() と _judge_under() は _Decided / LexBudgetExceeded / SystemExit しか捕捉しないので、例外はそのまま抜け、フックは判定を出さずに非 0 で終わる。PreToolUse フックの非 0 終了（2 以外）は実行を止めないため、同じコマンドの後続行（例: git reset --hard HEAD）がガードを通らずに実行される。変更前は deny。この経路は宛先判定の表を作る時点（_build_statement_table）で必ず通るので、python3 宛ての heredoc に数字列を付けるだけで届く。comprehensive#0 も同じ箇所を 0 の 4301 桁で報告している。偶発では起きない形だが、ガード全体が素通りになる失敗の仕方なので high にした。'
  suggestion: 'int() を使わず、記述子が 0 かどうかを文字列で判定する（例: 数字列が 0 だけでできているか）。0 と 9 の長い数字列のケースを deny 側で足す。'
  sources:
