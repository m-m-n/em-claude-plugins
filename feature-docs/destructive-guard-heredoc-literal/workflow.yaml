schema_version: 1
feature: destructive-guard-heredoc-literal
created: '2026-11-11'
base_branch: main
goal: '# destructive-guard が heredoc 本文の文字列リテラルを実行コマンドと誤認して拒否する


  種別: バグ


  ## 現象


  `destructive-guard.py` が heredoc 本文に書かれた文字列リテラルを実行コマンドとして誤認し、無害な書き込みを拒否する。


  heredoc-stdin-guard フィーチャーの batch 実行中、`phase-state/batch-audit.yaml` に監査記録を書き込む
  python heredoc の中で、引用として出てくる破壊的コマンドの語がマッチして拒否された。heredoc 本文はスクリプトの入力データであって実行されるコマンドではない。


  `.claude/rules/hook-tests.md` が allow 側のケースとして明記している誤爆の類型そのもの（「ヒアドキュメントの本文を 1 行ずつコマンドとして読む」）。


  ## 再現手順


  1. heredoc 本文の中に、destructive-guard のルールにマッチする文字列（削除系コマンドの語や `git branch` の強制削除フラグ等）を引用として含む
  Bash コマンドを組み立てる

  2. そのコマンドを実行する

  3. destructive-guard が deny する


  ## 期待する挙動


  heredoc 本文（`<<` の区切り語から終端行までの範囲）はコマンド列として解析せず、allow する。


  ## 完了の定義


  - 再現手順で現象が起きない

  - 再発を検出するテストがある（`em-workflow/hooks/tests/destructive-guard-cases.json` に allow 側ケースを追加）

  - 既存の deny / ask ケースが 1 件も緑から赤に変わっていない


  ## 該当箇所


  - `em-workflow/hooks/destructive-guard.py`

  - テスト: `em-workflow/hooks/tests/destructive-guard-cases.json` / `em-workflow/hooks/tests/run-destructive-guard.py`


  ## 実害・発生条件


  無人 batch では `ask` が `deny` に降格されるため、誤爆 1 件がその場で走行を止める。ログ断片や引用文を含む監査記録の書き込みで踏みやすい。

  '
