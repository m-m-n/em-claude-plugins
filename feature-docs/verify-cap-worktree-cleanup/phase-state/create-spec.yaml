answers:
  requirement.alignment-direction:
    packet_id: create-spec-q0001
    answered_at: '2026-10-29T22:46:00+09:00'
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids:
    - guard_exempts_cap_reached
    freeform: null
    normalized_answer: フック側で除外する。cap 到達で verify が failed のまま Step C に入った走行では failed-run-cleanup-guard
      が判定を出さず、SKILL.md の worktree 削除規定と cap 到達走行の detail 文言はそのまま残す
    resolution_note: 'Codex consulted (harness: codex, 1 turn); Opus escalation not
      run; options: guard_exempts_cap_reached / skill_keeps_worktree; chosen guard_exempts_cap_reached;
      key point: SKILL.md already specifies continuation to Step C and worktree removal,
      so a narrow hook exemption keeps the defined completion flow'
  requirement.exemption-condition:
    packet_id: create-spec-q0001
    answered_at: '2026-10-29T22:46:00+09:00'
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids:
    - status_plus_cap_counters
    freeform: null
    normalized_answer: status と cap の記録で判定する。failed のトップレベル step が verify だけで、retrospect
      が completed、他の step が completed か skipped、かつ batch.verify_rework が系譜 cap（failed_id_counts
      のいずれかの値が 2 以上）または hard cap（rounds が 3 以上）の到達を示すときだけ除外する。cap 記録が欠落・不正なら除外せず従来の
      failed 判定を維持する
    resolution_note: 'Codex consulted (harness: codex, 1 turn); Opus escalation not
      run; options: status_only / status_plus_cap_counters; chosen status_plus_cap_counters
      (Codex recommendation; analyst had recommended status_only); key point: a verify
      failure below the cap is outside the SKILL.md exception, so status alone is
      insufficient grounds to allow deletion of investigation state; missing/invalid
      counters keep the deny'
  requirement.exemption-shapes:
    packet_id: create-spec-q0001
    answered_at: '2026-10-29T22:46:00+09:00'
    source: batch-codex-consultation
    answer_mode: single_select
    selected_option_ids:
    - s1_and_s3
    freeform: null
    normalized_answer: S1（git worktree remove）と S3（gh pr create）だけを除外する。S2（git branch
      -d）は deny のまま残す。静的に解決できない対象の判定もコマンド形を区別し S2 の保護を保つ
    resolution_note: 'Codex consulted (harness: codex, 1 turn); Opus escalation not
      run; options: all_three_shapes / s1_and_s3 / s1_only; chosen s1_and_s3 (Codex
      recommendation; analyst had recommended all_three_shapes); key point: with --pr,
      S3 runs before S1 so both must pass, while batch Step C keeps the branch so
      S2 protection need not be relaxed'
  design-step.decision:
    packet_id: create-spec-q0001
    answered_at: '2026-10-29T22:46:00+09:00'
    source: batch-decision-table
    answer_mode: single_select
