schema_version: 1
feature: verify-cap-worktree-cleanup
created: '2026-10-29'
base_branch: main
goal: |
  # em-workflow: verify が rework 上限到達で failed のまま Step C に入ると、failed-run-cleanup-guard が worktree 削除を拒否して完了処理が止まる

  種別: バグ

  ## 現象

  batch の develop で、verify が rework 上限（系譜 cap）到達で `failed` のまま retrospect を終えて Step C（完了処理）に入ると、`git worktree remove` が failed-run-cleanup-guard フックに拒否され、`stop_reason: completion_aborted` で停止する。integration worktree が残る。

  develop の `skills/develop/SKILL.md` は、cap 到達で verify が `failed` のときも Step C に進み、いずれの分岐でも `git worktree remove` で integration worktree を削除すると定めている。一方 `hooks/failed-run-cleanup-guard.py` は、対象 feature の `workflow.yaml` に `status: failed` のステップがあれば `git worktree remove` を常に deny する（batch では ask も deny）。両者が食い違っている。

  観測: 別プロジェクトの feature、em-workflow 0.3.94。

  ## 再現手順

  1. batch の develop で、verify が系譜 cap に達して `failed` のまま retrospect まで完了する状態を作る
  2. 次の起動で Step C に入る
  3. `git worktree remove <integration worktree>` が failed-run-cleanup-guard に拒否され、completion_aborted で停止する

  ## 期待する挙動

  develop の Step C の規定とフックの判定が一致し、cap 到達で verify が `failed` のまま Step C に入った場合の扱い（worktree を削除するか残すか）がどちらか一方に揃っている。Step C が completion_aborted で止まらない。

  ## 完了の定義

  - 再現手順で現象が起きない
  - 再発を検出するテストがある

  ## 該当箇所

  - `em-workflow/skills/develop/SKILL.md` の「batch: verify の cap 到達に対する停止条件の例外」と「Step C: 完了処理」の 2.
  - `em-workflow/hooks/failed-run-cleanup-guard.py`（S1: `git worktree remove`）

  ## 実害・発生条件

  verify が cap 到達で `failed` のまま完了処理に入る batch 実行は、毎回 Step C で停止してタスクが「中断」になる。worktree の削除を人が手で行う必要がある。

  ## 実行時の追加指示

  - 不明点は Codex に相談し、比較的良いと判断した選択肢を採用する。
  - 相談内容は（オーケストレーターが）Notion のタスクページにコメントとして記録する。
