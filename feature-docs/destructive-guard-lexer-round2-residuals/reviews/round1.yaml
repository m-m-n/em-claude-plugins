  file: em-workflow/hooks/destructive-guard.py
  line: 1088
  title: time -p の後ろの 2 つめの -p をオプションとして読み続けるため、bash が引数として読む name[ を添字として読み、<< 演算子を落として後続行を隠す
  description: 'word_transition() は time_p が立っている間、何個目の -p でもオプションとして扱いコマンド位置を保つ。bash 5.3 では -p が TIMEOPT になるのは time の直後だけで、time -p の後ろでは -- だけが TIMEIGN になり、2 つめの -p はコマンド名になる。FR3 の添字読みは f.cmd が真の位置で name[ を添字として開くため、この食い違いの位置では bash が登録する << をガードは登録しない。評価者が確認した再現: time -p -p a[1<<2]=x\n''\n2]=x\nrm -rf /home/sakura/valuable\n'' は通常・CLAUDE_BATCH=1 とも allow。bash 5.3.9 では「-p: command not found」の後、2]=x 行で本文が閉じて次の行が実行される（echo で確認）。変更前も allow（別の経路）だったので新規の退行ではないが、SPEC の Edge Cases が time -p -p を「bash は 2 つめの -p を語として読む」と明記しており、FR2 で同じ分岐を直した今回の範囲に入る。'
  suggestion: 直す前に上の形を deny ケースとして足す。time の直後は -p（TIMEOPT）と --（TIMEIGN）、time -p の直後は -- だけをオプションとし、それ以外の語（2 つめの -p を含む）はコマンド名として扱いコマンド位置を終える。time -p -p に続く添字形のテストを COMMAND_POSITION_FORMS 相当の固定期待に足す。
