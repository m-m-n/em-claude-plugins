  title: '閉じ行の判定が前後の空白を許すため本文を bash より早く閉じ、残りの本文行の # コメントで bash が実行する命令置換を隠す（END-X 等で deny→allow の退行）'
  description: '_delimiter_line_word() は行の前後の空白・タブを取り除いて区切り語と比べる。bash 5.3 は << では行全体の完全一致、<<- では先頭タブの除去だけを行うので、空白付きの行では本文は閉じない。評価者が両版と bash 5.3.9 で確認した再現: cat <<END-X\n END-X\n# $(rm -rf /home/sakura/valuable)\nEND\nEND-X は変更前 deny → 変更後 allow（通常・CLAUDE_BATCH=1 とも）。bash では本文は最後の END-X まで続き、引用されていない本文の $( ) が実行される。同じ仕組みは英数字だけの区切り語でも元からあり（cat <<END\n END\n# $(rm -rf /home/sakura/valuable)\nEND は両版とも allow、bash は実行する）、今回の変更で非英数字の区切り語にも広がった。SPEC の Edge Cases は「広い側は本文を早く終える側なので維持してよい」としているが、早く閉じると残りの本文行がシェル文として読まれ、# や '' で後続を隠せるため安全側ではない（NFR6 に反する）。追加テスト test_close_line_is_the_delimiter_with_optional_blanks_only がこの規則を期待値として固定している。関連（low、R3b でゲート除外）: 空白を含む引用区切り語 cat <<E'' X'' は閉じ行が索引に載らず allow→deny の誤検知になる。'
  suggestion: '直す前に上の 2 形を deny ケースとして足す。閉じ行の比較を演算子ごとに bash と同じにする: << は行（末尾の改行を除く）と区切り語の完全一致、<<- は先頭のタブだけを除いて完全一致。_LexLines.word_to_lines() の索引もそれに合わせ（空白を含む区切り語も引けるようにする）、test_close_line_is_the_delimiter_with_optional_blanks_only を新しい規則に書き換える。既存の allow ケースで字下げした閉じ行に頼っているものがないか run-destructive-guard.py で確認する。'
