  title: Fragile snapshot coupling for in-pass reparen resume
  description: Non-adjacent-)) handling relies on in-place mutation of the shared reparen set plus a positional 9-tuple snapshot (lengths of regions/candidates/encountered/ops/hd_pending plus scalars) captured in push() and manually truncated/restored at close. The restore truncates both hd_pending and hd_seqs from len(hd_pending), assuming they stay lockstep; adding any new growing list or scalar requires updating capture and restore in two distant sites or state silently corrupts. Whole-text-restart reference path (whole_restart flag) doubles the control-flow variants of the same logic.
  suggestion: Replace the positional tuple with a named snapshot object with save/restore methods colocated in one place, and make reparen an explicit return value instead of in-place mutation.
