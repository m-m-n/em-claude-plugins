  title: '読み取れない区切り語の <<（演算子なし扱い）の後ろを通常のシェルとして字句解析するため、本文中の # や引用が bash の実行する行を隠す（<<E${x} は deny→allow の退行）'
  description: '_read_heredoc_delimiter() が None を返すと、1390 行付近で << は演算子を登録せず i+=2 で通常の字句解析を続ける。bash がヒアドキュメントとして読む本文を、ガードはシェル文として読み、本文中の # をコメント、'' を引用の開始として扱う。結果として bash が実行する行がコメント/引用の中に入り allow になる。評価者が両版のフックと bash 5.3.9（無害な echo に置換）で確認した再現: (1) cat <<E${x}\n# $(rm -rf /home/sakura/valuable)\nE\nE${x} は変更前 deny → 変更後 allow（通常・CLAUDE_BATCH=1 とも）。bash は E${x} を字面のまま区切り語にし、本文の $( ) を実行する（comprehensive#0 が報告した退行、ここに統合）。(2) cat <<E`x`\n''\nE`x`\nrm -rf /home/sakura/valuable\n'' は両版とも allow、bash は E`x` 行で本文を閉じて次の行を実行する。SPEC FR4・A3・NFR6 は「区切り語を読み切れない形では本文を取らず、後ろの行を検査から外さない」を求めているが、このフォールバックではその保証が成り立たない。'
  suggestion: 直す前に (1)(2) の形（# コメント版と引用版）を deny ケースとして destructive-guard-cases.json の末尾に足す。そのうえで、<<（<<< でない）の区切り語を読み切れないときは、その位置から後ろを P4 の tail と同じ読み方（引用・コメント・演算子の領域を開かない）にして後続行をすべてコマンドとして検査するか、scan-budget と同じ ask（batch では deny）にする。あわせて、bash 5.3 が字面のまま区切り語にする形（${x} など）は評価せずに字面で区切り語として読む案も検討する（形ごとに bash で確認する）。
