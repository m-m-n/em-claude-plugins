schema_version: 1
feature: destructive-guard-lexer-round2-deferred
created: '2026-10-06'
base_branch: main
goal: '# destructive-guard: lexer-round2-residuals の review round 2 で deferred になった回避経路を直す（high 5 件・medium 3 件）


  Notion task: https://www.notion.so/3f13509ec8ee8148a15ed1dcb2164c62


  ## 脆弱性の概要 (必須)

  `em-workflow/hooks/destructive-guard.py` の字句解析に、feature `destructive-guard-lexer-round2-residuals`（PR https://github.com/m-m-n/em-claude-plugins/pull/105 ）の review round 2 で見つかり、batch の review rework 上限で deferred になった回避経路が残っている。bash が実行する破壊的な行を、フックが本文として隠して allow を返す。

  ## 参照 (必須)

  - CVE / GHSA ID: 該当なし

  - アドバイザリ URL: 該当なし

  - severity: high

  - 該当パッケージ: 該当なし

  - 現在のバージョン: em-workflow（integration ブランチ `em-workflow/destructive-guard-lexer-round2-residuals/integration`）

  - 修正済みバージョン: 無し

  ## 攻撃シナリオ (必須)

  エージェントが生成する Bash コマンドが次のいずれかの形をとると、フックは allow を返し、bash は破壊的な行を実行する。

  - `5753be9288beab27`（high、基準版 deny → allow の退行）: 行をまたいで閉じる配列添字を「開いていない」扱いにした後、`<<` は演算子にしないのに引用と `${` は開くため、bash が実行する行を隠す

  - `52bfa0f59d1ea852`（high）: 読めない区切り語の後ろ（tail）でも `${` / `$((` / `$[` / `((` と case の状態が開き、bash が実行する行を隠す（`1baa909f9b288847` の修正が不十分）

  - `e959ba60bde865a4`（high）: `\r`・`\x0b`・`\x0c`・`\x85`・ などを区切り語の終わりと行の境界にしているため、bash（`\n` だけ）と本文の範囲がずれて実行行を読み飛ばす

  - `e25427e2a8b1dddf`（high、基準版 deny → allow の退行）: 識別子の途中の行継続（`a\<改行>[1<<2]=x`）を添字として読まず、語全体で読むようになった区切り語 `2]=x` が閉じ行に一致して後続行を本文に取り込む

  - `2b52be5874de85f4`（high）: 引用なしの区切り語の本文で bash が行う `\<改行>` の連結を閉じ行の判定が考慮せず、本文を早く閉じて `#` が命令置換を隠す

  - `aa735aa95be36542`（medium、既存）: `\r` を空白として扱うため、bash では語の一部になる `#` をコメントとして読み、同じ行の後続コマンドを隠す

  - `1fcae1f76f2a20f0`（medium、既存）: bash 5.3 の `${ cmd; }` / `${| cmd; }` をパラメータ展開として読むため、中の破壊的コマンドを検査しない

  - `c8c16caba82d6238`（medium、設計）: `_lex_pass` が約 800 行の 1 関数に添字・区切り語・閉じ行・非隣接の閉じの読み直し・tail を抱え、関心どうしの組み合わせで退行が出ている

  ## 影響範囲 (必須)

  無人実行（em-workflow の batch）を含め、hook が allow を返すので rm -rf や git reset --hard が確認なしで実行される。

  ## 完了の定義 (必須)

  - [ ] 攻撃シナリオが成立しない

  - [ ] 修正版に追随している（修正版が無い場合は暫定緩和策の欄に対応を記載）

  - [ ] 各再現入力を deny ケースとして `em-workflow/hooks/tests/destructive-guard-cases.json` に足す（直す前に足す）

  - [ ] 既存の deny / ask ケースが 1 件も消えていない

  ## 該当箇所 (任意)

  - `em-workflow/hooks/destructive-guard.py`（`_lex_pass`）

  - 詳細は integration ブランチの `feature-docs/destructive-guard-lexer-round2-residuals/reviews/round2.yaml`（stable_id で検索）

  ## 暫定緩和策 (任意)

  PR #105 は未マージのまま。マージ前に上の high 5 件（うち退行 2 件）を直す。

  '
