  file: em-workflow/hooks/destructive-guard.py
  line: 1207
  title: Unescaped-backtick index regex risks quadratic scan on backslash runs
  description: Pattern `(?<!\\)(?:\\\\)*`` executed with finditer over the whole text tries O(remaining) `\\` pairs at each start offset and then fails when no backtick follows, giving O(N^2) on a long backslash run. It is built lazily on the first backtick (backtick_extent), so one trailing backtick plus a 10-20k `\` run — plausible in generated scripts/heredocs — stalls this PreToolUse hot path. A single linear scan tracking backslash parity avoids backtracking entirely.
  suggestion: 'Replace the regex index with a linear scan: iterate once collecting backtick offsets whose preceding-backslash count is even, or find each ''`'' and walk back over `\` runs. Only build it when needed and never with nested-quantifier backtracking.'
