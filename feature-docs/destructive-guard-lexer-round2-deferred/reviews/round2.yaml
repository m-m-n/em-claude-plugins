  title: Redundant full lex pass per chunk via _unclosed_command_forms
  description: statements() already pays scan_structure plus _MarkedText lex_shell per chunk, but the new code adds another full lex_shell inside _unclosed_command_forms for every queued chunk, plus a second full lex per heredoc body in the needs_whole_body path. Cost is paid even when no `${` exists, roughly doubling/tripling per-Bash-call latency, and nested unclosed `${` forms queue near-full-length substrings that are each fully re-lexed (O(n*depth), bounded only by scan_budget). This is N+1 recomputation in the main pending loop.
