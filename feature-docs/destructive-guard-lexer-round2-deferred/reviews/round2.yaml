  title: tail 内の文で case を予約語として扱わないため、case 項目の中の破壊的コマンドを検査しない（deny→allow の回帰）
  description: 'このブランチは _shape_leading() の case 分岐（7055）に `not tail` を足し、_statements_in_tail()（5050）は LexMap の tail_start 以降に始まる文を tail とする。tail の文では `case` が開かれず、文全体がコマンド名 `case` の 1 文になり、`y)` の後ろのコマンドを検査しない。tail_start は読めない `<<`（tail source）だけでなく、バッククォート範囲内で確定した未閉鎖の `${x` / `$((x` / `$[x` や、破棄行の未閉鎖 `${y` でも立ち、bash がその影響を後続に持ち越さない位置でも効く。layout が無いとき（starts is None）は全文を tail とみなすので穴が広がる。評価者が再現を確認した入力（HEAD で通常実行・batch とも allow、base と main は deny、bash 5.3.9 は echo に置き換えた case 項目を実行）: ''echo `${x`; case y in y) rm -rf /home/sakura/valuable;; esac''、''echo `$((x`; case y in y) rm -rf /home/sakura/valuable;; esac''、''echo `$[x`; case y in y) rm -rf /home/sakura/valuable;; esac''、''a=(x;) ${y\ncase z in z) rm -rf /home/sakura/valuable;; esac''、''echo `${x`\ncase y in y) git reset --hard;; esac''、''cat <<E${x}\nE${x}\ncase y in y) rm -rf /home/sakura/valuable;; esac''、''case y in y) echo hi;; esac; echo `${x`; case y in y) rm -rf /home/sakura/valuable;; esac''。SPEC の FR2 は「tail より後ろでは `_shape_leading()`
    でも case のパターン状態に入らない」と書くが、FR2 の目的（52bfa0f59d1ea852: パターン状態が後続行を飲み込まない）は項目の検査を外すことを求めておらず、NFR6（bash と一致させられない形は後続行を検査から外さない側に倒す）に反する。_statements_in_tail() の docstring は「より多くを検査に残す読み」と書いているが、実際は逆に働く。reviewer の high から critical に引き上げた: base・main とも deny だった形を allow（batch でも allow）にする回帰で、round 1 とこの round で critical とされた迂回と同じ影響の種類。'
  suggestion: tail 内の `case` でも case 項目を検査できる形にする。(a) tail 内でも case 構文を開くが、case_stack をその物理行の終わりで打ち切り、後続の行をパターンとして飲み込まないようにする（FR2 の目的を保つ）。または (b) tail 内の `case` 文を、case として読んだ場合と普通のコマンドとして読んだ場合の両方で判定し、強いほうを採る。あわせて _statements_in_tail() の基準を tail source（読めない `<<`）に限り、バッククォート範囲内で確定した開始記号や破棄行の開始記号を tail の根拠にしない。上の形を deny ケースとして cases.json の末尾に足す。
