  file: em-workflow/hooks/destructive-guard.py
  line: 2285
  title: バッククォート範囲の中で P13 の破棄行が始まると end_discard() が backtick フレームと bt_end を捨て、閉じのバッククォート以降の破壊的コマンドが allow になる
  description: 'バッククォート置換の中に配列の構文エラー（`x=(a; b)` / `x=(a & b)` / `x=( <<EOF` / `a=(x;)`）があり、置換が次の行まで続くとき、begin_discard() が LIMIT を破棄行の改行に置き、end_discard()（2285-2287）が `del stack[1:]` と `state.bt_end = None` で backtick フレームと範囲をまとめて捨てる。以降は最上位として読まれ、bash が置換を閉じるバッククォートが新しい置換の開きになり、範囲内の `#` がトップレベルのコメントとして後続を隠す。bash 5.3.9 では置換の範囲が先に決まり、構文エラーは置換の中だけで起きるので、後続は実行される。評価者が再現を確認した入力（Python の文字列表記。HEAD で通常実行・CLAUDE_BATCH=1 とも allow。base・main も allow。bash は echo に置き換えた後続を実行）: ''echo `x=(a; b)\necho hi`#; rm -rf /home/sakura/valuable''、''echo `x=( <<EOF\n`#; git reset --hard''、''echo `x=(a & b)\n`#; rm -rf /home/sakura/valuable''、''echo `a=(x;)\necho #`; git reset --hard''。base から既存で回帰ではないが、task0006 が宣言した「範囲は開いた時点で確定し、中で開いたものは閉じのバッククォートを越えない」不変条件の例外で、e79128f331828941 と同じ種類（TB-1、NFR6）。逆方向の誤検知もある: ''cat <<E; echo `x=(a; b)`\nrm -rf /home/sakura/v\nE'' は bash ではヒアドキュメント本文で実行されないが deny になる（base から既存。comprehensive#fallback は begin_discard() が範囲の外で登録された hd_pending まで捨てることを原因に挙げている）。security#fallback（critical）と
    comprehensive#fallback（high）が同じ箇所を独立に報告した。'
  suggestion: bt_end が立っている間に始まった破棄行は範囲の中で完結させる。(a) end_discard() で巻き戻すのは最も内側の backtick フレームより上だけにし、bt_end を保ったまま set_limit() する。または (b) bt_end が開いている間は begin_discard() を呼ばず、配列の構文エラーは範囲の終わり（end_extent()）で閉じる扱いにする。begin_discard() で捨てる hd_pending も範囲内で登録したもの（hd_seqs が backtick の rseq 以上）に限る。上の 4 形を deny ケースとして、ヒアドキュメントの形を allow ケースとして cases.json の末尾に足す。
  sources:
