schema_version: 1
feature: exit4-version-baseline-refresh
created: '2026-10-05'
base_branch: main
goal: 'em-workflow: test_exit4_tip_argument_version_bump の BASELINE_PATCH=44 が古く version bump ガードが空振りする


  Notion: https://www.notion.so/3d53509ec8ee816dbc36f30bb64acffc  (種別: バグ)


  ## 現象 (必須)

  `tests/test_exit4_tip_argument_version_bump.py` の `BASELINE_PATCH = 44` が実 diff base より

  古く、version bump ガードが空振りする。

  diff base 02aff93 における `em-workflow/.claude-plugin/plugin.json` と

  `.claude-plugin/marketplace.json` の em-workflow エントリはともに 0.1.68。BASELINE_PATCH が 44 の

  ままなので `patch > 44` は bump 前のツリーでも成立し、0.1.69 を 0.1.68 に巻き戻してもテストは緑のまま通る。

  `TestValidationDetectsRegressions.FORGED_PRE_BUMP_VERSION = "0.1.44"` も、現実の pre-bump

  サンプルではなくなっている。

  ## 再現手順 (必須)

  1. ブランチ `em-workflow/exit4-tip-argument/integration` を checkout する

  2. `em-workflow/.claude-plugin/plugin.json` と `.claude-plugin/marketplace.json` の em-workflow の version
  を 0.1.69 から 0.1.68 に戻す

  3. `python3 -m unittest tests.test_exit4_tip_argument_version_bump` を実行する

  4. bump が無いにもかかわらず緑で通ることを確認する

  ## 期待する挙動 (必須)

  task0002 の AC-1 / AC-2 の中核である「em-workflow の version が上がっていること」を、この

  モジュールが実際にガードすること。bump が無いツリーでは red になること。

  ## 完了の定義 (必須)

  - [ ] 再現手順で現象が起きない

  - [ ] 再発を検出するテストがある

  ## 該当箇所 (任意)

  - `tests/test_exit4_tip_argument_version_bump.py:57` — `BASELINE_PATCH`

  - `tests/test_exit4_tip_argument_version_bump.py` — `TestValidationDetectsRegressions.FORGED_PRE_BUMP_VERSION`、docstring
  の「patch strictly greater than 44」「un-bumped 0.1.44 tree」

  - `test-docs/exit4-tip-argument/task0002.tests.yaml` — AC-1 / AC-2 / AC-3 の red_reason

  - `feature-docs/exit4-tip-argument/SPEC.md` — FR6 の「currently 0.1.44」

  ## 実害・発生条件 (任意)

  成果物の欠陥ではなくテストの検知力の欠落。実際の bump（0.1.69）自体は両レジストリで正しく

  揃っている。根因は SPEC.md FR6 が「currently 0.1.44」と書かれたまま、main のマージで実ベースが

  0.1.68 に進んだこと。

  出典: PR #17 (feature `exit4-tip-argument`) review round 2 の未解決 medium

  `9b01398d4f48c1e2`（confidence 85）。記録は `feature-docs/exit4-tip-argument/reviews/round2.yaml`。

  推奨対応: `BASELINE_PATCH` を 68 に、`FORGED_PRE_BUMP_VERSION` を "0.1.68" に更新する

  （0.1.69 は 68 より大きいので現ツリーは緑のまま）。docstring と AC の red_reason も新 baseline に揃える。

  '
