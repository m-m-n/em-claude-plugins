  title: 波括弧形式の本体で zsh の `always` 群と複数名の `function a b {` の `{` が深さに数えられず、群の `}` で文を早く閉じて誤拒否する（回帰）
  description: '深さが上がるのは、本体のリストのコマンド位置で読んだ単独の `{` と `function {` の特例（2824-2834 行）だけ。`{ :; } always { :; }` の `always` は RESERVED_WORDS に無いので普通の最初の語として読まれ、続く `{` は数えられない。その後の `}` はコマンド位置で深さ 0 なので 2876-2881 行で文を閉じ、後の項目のパターンの `)` で置換が閉じたと確定してしまう。例: `echo "$(case x { x) { :; } always { :; };; y) echo ''"; python3 -i; "'';; })"` は `python3 -i` が単引用符の中の文字列にすぎないのに両コピーとも deny を返す（基底は silent）。`function a b { :; }` でも同じ。NFR3 に反する誤った確定で、誤拒否の回帰。round 1 の 2c1d28dc62936d1a と同じ欠陥。'
  suggestion: 最小の対応は、波括弧形式の本体で (1) コマンド位置の `}` で群を閉じた直後の単独の `always`、(2) `function` の名前の後にさらに名前が続く形、を読んだら _Undecidable にする。正しく読むなら、それぞれの後の単独の `{` で深さに 1 足す。両コピーに上の例（silent）と `function a b { :; }` を含む行を足し、バイト単位で同一に保つ。
