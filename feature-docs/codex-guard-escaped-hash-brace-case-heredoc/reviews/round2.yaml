  action_rationale: critical / high は残っていない。残る 2 件の medium はどちらもレビュー実行が報告したもので、_skip_substitution の波括弧形式の読みの中に収まる小さな修正で済む。comprehensive の 1 件は誤拒否の回帰なので、今のうちに直す価値がある。security の 1 件を zsh の文法どおりに直すと、SPEC TS-16 のラベルと AC-5 の文言を変えることになる。自動修正で SPEC を変えられない場合は、この 1 件だけ人の確認か rework に回す。
