- stable_id: a20206a8e4ee3391
  severity: medium
  category: security
  file: em-workflow/scripts/codex-hook-interactive-guard.py
  line: 2873
  title: '区切りを省略した閉じ波括弧 `{ : }` が深さに数えられず、波括弧形式の case の後ろにある対話起動を拒否しない'
  description: '波括弧形式の本体の `{ }` 群の深さは、本体のリストのコマンド位置で読んだ単独の `}` でしか下がらない（2860-2883 行）。zsh の既定（IGNORE_BRACES と IGNORE_CLOSE_BRACES がどちらも無効）では、単独の `}` はどの位置でも閉じ波括弧として扱われるため `{ : }` は有効な群になるが、この読みでは `}` は `:` の引数になり深さが 1 のまま残る。続く `;;` で _Undecidable("item terminator in a brace group") になり、後ろの `python3 -i` は検査されず silent になる。基底（5c200f62）も silent なので回帰ではないが、SPEC の Objectives 2 が対象にしている形で fail-open が残る。SPEC TS-16 / AC-5 と docstring の「引数の位置の `}` は本体の普通の語」は zsh の文法と合わない前提（SPEC A3 も未実測）。em-review のコピーも同一。'
  suggestion: '波括弧形式の本体のリスト（top == "8" かつ braces[-1] is not None）では、引数の位置にある単独で引用もエスケープもされていない `}` をコマンド位置の `}` と同じに扱う。docstring と SPEC TS-16 / AC-5 の文言を zsh の文法に合わせて直す。両コピーに `echo "$(case x { x) { : };; })"; python3 -i` などの deny の行を足し、バイト単位で同一に保つ。'
  reproduction: '両コピーのスクリプトを python3 -B で実行し、標準入力に {"tool_input":{"command":"zsh -c ''echo \"$(case x { x) { : };; })\"; python3 -i''"}} を渡す。どちらも終了コード0、標準出力は空で、拒否されない。`{ : }` を `{ :; }` に変えると deny が返る。実際の対話起動を避けた到達確認として、zsh -f -c ''echo "$(case x { x) { : };; })"; printf REACHED'' を実行すると、終了コード0で REACHED が出力される。'
  reproduction_alternates: []
  reproduction_overflow: false
