- stable_id: 2c1d28dc62936d1a
  severity: medium
  category: comprehensive
  file: em-workflow/scripts/codex-hook-interactive-guard.py
  line: 2838
  title: "波括弧形式の case の本体で、zsh の always の後の { を深さに数えず、always 群の } で文を早く閉じる"
  description: |-
    波括弧形式の深さは、この読みのコマンド位置で読んだ単独の `{`（2838-2849 行）と、`function {` の `{`（2801-2811 行の特例）だけを数える。zsh の `{ ... } always { ... }` の 2 つ目の `{` はシェルの文法ではコマンド位置にある。しかしこの読みでは `always` が普通の最初の語になり（2878 行で at_command=False）、`{` は引数として読まれて数えられない。続く `:; }` の `}` はコマンド位置で深さが 0 なので、2853-2858 行で文を閉じる。zsh ではこの `}` は always 群を閉じるだけで、文は開いたまま。早く閉じた後は残りの本体を置換のコマンド列として読み、後の項目のパターンの `)` で置換が閉じたと確定してしまう。NFR3 の『閉じ位置が確定しないときは判定不能』に反する、誤った確定になる。zsh の複数名の関数定義 `function a b { :; }` も、2 つ目の名前 `b` が最初の語になるので同じことが起きる。基底ではどちらも case without in で silent だったので回帰ではない。
  suggestion: |-
    最小の対応は判定不能にすること。波括弧形式の本体（top == "8" かつ braces[-1] is not None）で、コマンド位置の単独の `always` を読んだら判定不能にする。`function` の名前の後にさらに名前が続く形も判定不能にする。読む方向で直すなら、`}` の直後の `always` の次の単独の `{` と、`function` の名前の並びの後の単独の `{` を、深さに 1 足す。CASES に該当する silent または deny の行を足し、両コピーをバイト単位で同一に保つ。
  reproduction: null
