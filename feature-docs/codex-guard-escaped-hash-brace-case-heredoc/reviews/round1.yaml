  title: "コメントがバックスラッシュで終わる行の次の行頭の # を語の文字と読み、基底では拒否していた起動を見逃す（回帰）"
  description: |-
    `_hash_starts_comment`（3250-3282 行、em-review のコピーも同一）は、`#` の直前の改行の前のバックスラッシュの並びが奇数なら、その改行を継続行として飛ばしてさらに前を見る（3279-3281 行）。しかしその改行がコメントを終える改行のとき、バックスラッシュはコメントの中の文字なので、改行は普通の改行になる。bash・zsh・dash ともコメントの中のバックスラッシュと改行は継続行にならない。この読み自身もコメントを `j = s.find("\n", j)` で最初の改行までとして扱っている。このため `: a #b` + バックスラッシュ + 改行の次の行頭の `#` は、本当はコメントの始まりなのに語の文字と判定され、その行の `'`・`"`・`)`・`$(` などがコードとして読まれる。基底（5c200f62）は `s[j-1]` が改行ならコメントと読んでいたので、この形を正しく読めていた。例として `echo "$(: a #b` + バックスラッシュ + 改行 + `# don't` + 改行 + `)"; python3 -i` がある。基底では deny だったが、変更後は `don't` の `'` が閉じない単引用符を開いて _Undecidable("quote") で silent になり、後ろの `python3 -i` を拒否しない（fail-open。この機能が塞ごうとしている TM-1 と同じ種類の見逃し）。行に `)` があると、置換の閉じ位置を早い位置に確定してしまう。判定する場所はすべてこの関数を共有しているので、同じ読み違いが p/8 の語の始まりの判定（2787 行）、一般のコメント分岐（3155 行）、case の待ちの段 1・3・4・5・7（2897 行）、パターン（3048 行）、語一覧 w の最も外側の項目（3149 行）で起きる。既存と追加の CASES にはこの形が無い（追加された『エスケープしたバックスラッシュの後の改行』の行は偶数の並びだけを扱っている）。
  suggestion: |-
    直前のコメントを終えた改行の位置（各コメント分岐の `s.find("\n", j)` の結果）を読みの状態として 1 つ持つ。`_hash_starts_comment` で k がその位置の改行に着いたら、バックスラッシュの並びに関わらずエスケープされていない改行として True を返す。仕事の増分は 1 文字あたり定数なので NFR1 は保たれる。位置は絶対値なので、算術の読み直しの後もそのまま使える。docstring の『It keeps no state』『The decision carries no state through the reading』の文と、それを固定する文言テストも合わせて直す。CASES に deny の行を足す。`echo "$(: a #b\\\n# don't\n)"; python3 -i` と、項目本体・パターン位置（段 4）・段 7（規則 3）・語一覧 w の最も外側の項目での同じ形。両コピーはバイト単位で同一に保つ。
  reproduction: |-
    入力は次の文字を順に並べた 1 つのコマンド文字列: `echo "$(: a #b`、バックスラッシュ 1 個、改行、`# don't`、改行、`)"; python3 -i`。(1) 3505 行の二重引用符の読み（_read_quoted_unit）が 2319 行で `$(` を _skip_substitution に渡す。(2) `: a ` の後の `#b` は直前が空白なのでコメントになり、3161 行で j は直後の改行に移る。(3) 改行で at_command が真になる（3189 行）。(4) 行頭の `#` で 2787 行が _hash_starts_comment(j) を呼ぶ。k=j-1 は改行で、その前のバックスラッシュの並びは 1 個（奇数）なので 3279 行で継続行として扱い、k -= 2 で `b` に着いて False を返す。`#` は語の始まりになる。(5) ` don` の後の `'` は 2999-3002 行で閉じの `'` を探すが、残り（`t`、改行、`)"; python3 -i`）に無いので _Undecidable("quote") になる。arith は空なのでそのまま上がり、判定不能で出力なし（silent）になる。基底では (4) の `#` は `s[j-1]` が改行なのでコメントになり、`)` で置換が閉じて `; python3 -i` を deny していた。シェル（bash・zsh・dash）では `#b` と行頭の `# don't` はどちらもコメントで、`python3 -i` は実行される。
