schema_version: 1
feature: merge-task-already-contained-symref-recheck
created: '2026-10-27'
base_branch: main
goal: |
  # merge-task.sh の already-contained 経路で、シンボリック参照の検査後に統合ブランチ参照を差し替えると、統合せずに merged が記録される

  種別: セキュリティ (severity: low)

  ## 脆弱性の概要
  `em-workflow/scripts/merge-task.sh` の already-contained 経路は update-ref を通らない。ロック取得後のシンボリック参照の検査（`git symbolic-ref --quiet "refs/heads/$PARENT_BRANCH"`）と、統合ブランチの値の取得（`git show-ref --verify --hash`）が別々の操作なので、その間に統合ブランチ参照をシンボリック参照へ差し替えられると、統合せずに `merged` が記録され exit 0 になる。

  ## 攻撃シナリオ
  同じリポジトリの参照を書き換えられる別プロセスが、merge-task.sh のシンボリック参照の検査（exit 1 で通過）の直後、統合ブランチの値の取得より前に `git symbolic-ref refs/heads/em-workflow/{feature}/integration refs/heads/em-workflow/{feature}/{taskNNNN}` を実行する。`show-ref --verify` は参照先をたどってタスクの先端を返すため、PARENT が HEAD_SHA と一致し、`merge-base --is-ancestor` が成功して already-contained 経路に入る。統合ブランチ参照はシンボリック参照のまま、journal に `merged` が追記され exit 0 になる。

  ## 影響範囲
  マージしていないタスクがマージ済みとして記録され、統合ブランチ参照がシンボリック参照のまま残る。主体は参照を直接書き換えられる権限を既に持つため、増えるのは迂回経路に限られる。悪用にはロック内の 2 つの git 呼び出しの間という短い隙間への割り込みが要る。

  ## 完了の定義
  - 攻撃シナリオが成立しない
  - 修正版に追随している（修正版が無い場合は暫定緩和策の欄に対応を記載）

  ## 該当箇所
  - `em-workflow/scripts/merge-task.sh:198`（シンボリック参照の検査）〜 `em-workflow/scripts/merge-task.sh:205`（統合ブランチの値の取得）、already-contained 経路の `merged` 記録
  - 修正案: シンボリック参照の判定と値の取得を 1 回の読み取りで行う、または `merged` を記録する直前に統合ブランチ参照が直接参照のままであることを再確認する。その隙間を突くテストを追加する
  - 由来: feature `merge-task-parent-symref-reject` のレビュー round1 で security 観点が medium として報告し、評価者が再現を確認したうえで low に下げた。同 feature の SPEC の Assumptions と THREAT-MODEL の Accepted residuals で範囲外として受容済み

  ## 追加指示
  - 実装完了後、integration ブランチを remote に push し、base_branch に対して gh pr create で PR を作る。integration ブランチはローカル・remote の両方に残す（base_branch への自動マージはしない）
  - 不明点は Codex に相談し、比較的良いと判断した案を採用する
  - その議論内容を Notion に記録する
