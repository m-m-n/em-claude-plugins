  title: "同名で多数のバージョンを持つ lockfile に対し、pip-audit の起動回数と一時ファイル数に上限がない"
  description: "_group_pip_pins は 1 つの正規化名が持つ異なるバージョンの数 K だけグループを作り、_scan_pip_lockfile はグループごとに pip-audit を順番に起動する。1 回の起動には timeout=300 秒があるが合計時間の上限はない。prepared_requirements_files は K 個の一時ファイルを最初にまとめて作る。同じ名前の別バージョンを大量に並べた lockfile で無人実行のレビューを長時間止められる。通常の lockfile では K は 1〜数個。"
  suggestion: "グループ数に固定の上限を設け、超えたら pip-audit を起動せず固定の skip reason（例: pip_lockfile_too_many_versions）で not_completed にする。一時ファイルはグループごとに作って消す。"
