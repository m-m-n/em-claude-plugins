schema_version: 1
feature: failed-run-cleanup-guard
created: '2026-09-03'
base_branch: main
goal: |
  誤爆回避について
  ```
    em-workflow の hooks.json にはもう PreToolUse(Bash) のガード列（kill-guard / bash_guard / destructive-guard）があるから、同じ形でもう 1 本足せば済む。

    - 判定: コマンドに git worktree remove があり、対象が .claude/worktrees/em-workflow/*/integration なら、その worktree 内の feature-docs/{feature}/workflow.yaml を読んで、status: failed の step があれば
      deny
    - 理由をツール結果で返すので、batch でもエージェントは「報告して停止」に戻れる（kill-guard と同じ設計）
    - gh pr create と git branch -d も同じ条件で塞げる

    制約は 1 つ。対象パスが $WT みたいな変数だと静的に解決できないから、その場合は batch では deny に倒す必要があるよ。
  ```
