  suggestion: head() の先頭スキップに複合コマンドキーワードを 1 セット足す。`{"if", "then", "elif", "else", "while", "until", "for", "do", "done", "fi", "esac", "!", "{", "}"}` の frozenset を用意し、代入トークンを飛ばすループと同じ位置で読み飛ばす。destructive-guard 側の strip_grouping_prefix() にも同じキーワード集合を足さないと superset 不変条件が破れる点に注意。tests/test_guard_deferral_parity.py の GROUPINGS に `if true; then {c}; fi` と `for x in 1; do {c}; done` を追加する。
