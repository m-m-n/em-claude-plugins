  title: FR7 の ask が「failed な worktree を列挙できたとき」に条件化され、US3 の受け入れ条件とテストが落ちる
  description: 'SPEC FR7:「When the target path or branch name contains variable expansion, command substitution or a glob and cannot be resolved statically, emit `ask`.」および Error Handling 表「Target unresolvable → `ask`, demoted to `deny` under `CLAUDE_BATCH`」、US3 AC「When the target path is written with a variable (e.g. `git worktree remove "$WT"`), the run becomes `deny` with `CLAUDE_BATCH` set and `ask` without it.」は、解決不能な対象に対して無条件の ask を要求している。実装は `_UNRESOLVABLE` の後に cwd 祖先を辿って em-workflow worktree を列挙し、`failed` を持つものが 1 つも見つからない場合は `if not found_failed: return` で無出力に落とす。結果として US3 AC / TS-4 が満たされず、SPEC Success Criteria「`python3 -m unittest discover -s tests` at the repository root passes in full, including the new tests」が破れている。実測: `python3 -m unittest discover -s tests` は 2870 tests / 5 errors で失敗し、落ちているのは `tests/test_failed_run_cleanup_guard.py` の `TestUnresolvableTargetDemotion` 全 5 件。これらの cwd は worktree を持たない一時ディレクトリなので、列挙ゲートに引っかかり stdout が空になる。運用面でも、failed 実行の integration worktree の外（リポジトリルート等）から
    `git worktree remove "$WT"` を撃つ経路では列挙が空振りして無出力になり、FR7 が守ろうとした保護がその経路で消える。'
  suggestion: "SPEC の FR7 を満たすなら、`_UNRESOLVABLE` 分岐の列挙ゲートを外し、解決不能な対象では無条件に `decide(\"ask\", ...)` を呼ぶ（`CLAUDE_BATCH` 下の deny 降格は既存の `decide()` がそのまま担う）。\n\n```\n     if target is _UNRESOLVABLE:\n-        found_any_worktree = False\n-        found_failed = False\n-        ... (cwd 祖先の列挙ブロックすべて) ...\n-        if not found_failed:\n-            return\n         decide(\n             \"ask\",\n             \"対象のパス/ブランチ名に変数展開・コマンド置換・グロブが含まれており、...\",\n         )\n         return\n```\n\nNFR1（誤爆コスト）を理由に列挙ゲートを残す判断をするなら、それは FR7 と US3 AC の変更なので SPEC 側（FR7・Error Handling 表・US3 AC・TS-4）を先に書き換え、`tests/test_failed_run_cleanup_guard.py` の 5 件も新しい契約に合わせて更新すること。コードだけを現状のまま残す選択肢は無い（今は SPEC・テスト・実装の三者が食い違っている）。"
