  description: 'SPEC US3 AC:「対象パスが変数で書かれている場合（例 `git worktree remove "$WT"`）、CLAUDE_BATCH 有りで `deny`、無しで `ask` になる」。FR7 と Error Codes 表（`Target unresolvable` → `ask`, demoted to `deny` under `CLAUDE_BATCH`）、Error Flow（`unresolvable → ask (deny under CLAUDE_BATCH)`）も条件を付けていない。


    実装は `if not any_failed_worktree(cwd): return` で ask を条件付きにしているため、cwd から辿れる em-workflow integration worktree が 1 つ以上あり全て健全な場合、判定が一切出ない。実測（`git worktree remove "$WT"`）:

    - 健全な worktree が 1 つある一時 root → 無出力（SPEC は ask）

    - 同上 + CLAUDE_BATCH=1 → 無出力（SPEC は deny）

    - failed を含む root → ask / worktree 皆無の root → ask


    加えて any_failed_worktree() は `.claude/worktrees/em-workflow` を listdir して到達可能な全 feature の workflow.yaml を読む。NFR3「`workflow.yaml` の読み込みは対象 feature の単一ファイルに限定する」、Performance Goals の同記述、および Caching Strategy「a single file read per evaluated command」に反する（_FAILED_SCAN_CACHE の存在自体がその逸脱の裏返し）。'
  suggestion: いずれか。(a) SPEC 準拠に戻す — evaluate() の `_UNRESOLVABLE` 分岐から any_failed_worktree() ゲートと _FAILED_SCAN_CACHE を外し、無条件に ask を出す（FR7・US3・NFR3・Caching Strategy が同時に揃う）。(b) NFR1（誤爆 1 件が無人実行を止めるコスト）を優先して現在の絞り込みを維持するなら、それは SPEC の明文と食い違うので US3 AC・FR7・Error Codes 表・NFR3 を先に改訂し、`ask` が条件付きであることと全 worktree 走査を仕様として書く。実装だけを黙って狭めた状態を残さない。
