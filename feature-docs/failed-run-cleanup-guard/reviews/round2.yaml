  title: シェル制御構文（if/for/while）の中に置かれた対象コマンドが分類されず、deny が出ない
  description: 'SPEC US1 AC:「`git worktree remove .claude/worktrees/em-workflow/{feature}/integration` は failed ステップを含む feature に対して deny される」。FR2 は評価対象を 3 コマンドと定め、コマンドがどのシェル構文の中にあるかで対象外になるとは書いていない。


    statements() は `;` で分割するため、制御構文の中の文は先頭に予約語が残り（`then git worktree remove …` / `do git worktree remove …`）、head() が予約語をスキップしないので classify() の word が `then` / `do` となり、対象外として素通りする。実測（failed fixture、CLAUDE_BATCH 未設定、いずれも無出力）:

    - `if true; then git worktree remove <integration>; fi`

    - `for x in 1; do git worktree remove <integration>; done`

    - `while false; do git worktree remove <integration>; done`

    - `echo <integration> | xargs git worktree remove`（xargs 経由も同様に無出力）


    サブシェル・ブレースグループ・関数定義・eval・here-doc・`bash -c` は D7 の grouping-construct 語彙として手当て済みなのに、より素朴な `if` / `for` だけが抜けている。複数 worktree をループで掃除する形は現実に書かれうる。'
  suggestion: head() の先頭スキップに、代入・ラッパーに続けてシェル予約語（`if` / `then` / `elif` / `else` / `do` / `while` / `until` / `for`… および `!`）を加え、予約語だけの文は (None, []) を返す。`for x in 1` のように予約語の後がコマンドでない文は classify() が None を返すので誤爆は増えない。xargs 経由まで拾うかは FR2 の解釈次第なので、拾わないなら SPEC 側に対象外として明記する。修正後は tests/test_failed_run_cleanup_guard.py に制御構文のケースを、tests/test_guard_deferral_parity.py の corpus に対応行を追加する（destructive-guard は現状これらに allow を返すので、新ガードが deny を出すようになると FR8 の留保も同時に必要になる）。
