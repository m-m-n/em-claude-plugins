  title: 'FR5: `status: failed` ステップに `id` が無いと deny が出ない（後続の失敗ステップも取りこぼす）'
  description: 'SPEC FR5:「identified worktree 内の `feature-docs/{feature}/workflow.yaml` を読み、少なくとも 1 つのステップが `status: failed` なら deny する」。条件は `status` のみで、`id` の有無は要件に無い。


    failed_step_id() は最初の failed ステップの `step.get("id")` を返し、evaluate() 側は `if step_id is None: return`（688-690 行）で無出力にするため、`id` を持たない failed ステップは deny にならない。さらに最初の failed ステップで return するので、`id` 無しの failed が先にあると、後続に `id` 付きの failed があってもまとめて取りこぼす。


    実測（`git worktree remove <integration>`、CLAUDE_BATCH 未設定）:

    - `workflow:\n  - status: failed` → 無出力（SPEC は deny）

    - `workflow:\n  - status: failed\n  - id: implement\n    status: failed` → 無出力（SPEC は deny）

    - `workflow:\n  - id: implement\n    status: failed` → deny（対照）


    NFR5 の「structured field only」方針とは無関係で、`id` 欠落は「failed が無い」ことを意味しない。workflow.yaml が途中で書き換わった／手で編集された場合に、守るべき失敗 run の worktree 削除が素通りする。'
  suggestion: "「failed が無い」と「failed はあるが id 不明」を区別する。例:\n\n--- a/em-workflow/hooks/failed-run-cleanup-guard.py\n+++ b/em-workflow/hooks/failed-run-cleanup-guard.py\n@@\n     for step in steps:\n         if isinstance(step, dict) and step.get(\"status\") == \"failed\":\n-            return step.get(\"id\")\n+            sid = step.get(\"id\")\n+            return str(sid) if sid else \"(id 未設定)\"\n     return None\n\nevaluate() の `step_id is None` は「failed ステップ無し」の意味だけになり、FR6 の理由文はプレースホルダを含む形でそのまま成立する。tests/test_failed_run_cleanup_guard.py に `id` 欠落 fixture のケースを 1 行足す。"
