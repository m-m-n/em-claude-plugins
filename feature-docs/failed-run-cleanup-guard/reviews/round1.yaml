  title: '`git -C <dir>` 付きの相対パス指定でガードが静かに素通りする（ask にも deny にもならない）'
  description: S1 の `resolve_worktree_remove()` は相対 operand を payload の `cwd` に対して解決する。しかし `git_subcommand()` は `-C` / `--git-dir=` / `--work-tree=` を読み飛ばすだけで、それらが git 側の基準ディレクトリを変えることを考慮しない。実際の git は `-C <dir>` 実行後のディレクトリを基準に worktree パスを解決するため、`git -C /repo worktree remove .claude/worktrees/em-workflow/<feature>/integration` をセッション cwd が /repo 以外の場所で実行すると、ガードは `<cwd>/.claude/worktrees/em-workflow/<feature>/integration` を見に行き、workflow.yaml が無いので read_workflow_steps() が None を返して no-decision になる。deny も ask も出ないまま、failed 状態の integration worktree の削除が通る。`cd /repo && git worktree remove <relative>` も同様。ガードの宣言モデルは「静的に確定できない場合は ask（無人実行では deny）」なので、この経路は fail-open 側に外れており、S1 は --force 無しの worktree 削除に対する唯一の防波堤である以上、実効的な回避手段になる。
  suggestion: '基準ディレクトリを変えうるオプションが付いた git 呼び出しでは、相対 operand を「静的に確定できない」側に倒す。実装案は 2 つ。

    (a) git_subcommand() に、-C / --git-dir / --work-tree（= 形式含む）を見たかどうかのフラグを返させ、classify() がそれを evaluate() まで伝える。resolve_worktree_remove() は os.path.isabs(operand) が偽かつそのフラグが真なら _UNRESOLVABLE を返す（既存の ask → 無人実行では deny の経路にそのまま乗る）。

    (b) -C の値自体が静的に解決できるなら、それを cwd の代わりの基準として join し（-C が相対なら cwd と合成）、動的トークンを含むなら _UNRESOLVABLE にする。

    どちらでも「相対パス + 基準変更オプション」で無言通過しなくなる。回帰テストとして `git -C <root> worktree remove <relative>` を cwd が別の場所のケースで追加し、no-decision ではなく ask（CLAUDE_BATCH 下では deny）になることを assert する。'
