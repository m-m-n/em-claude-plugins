  title: Untrusted workflow step IDs can suppress denial or inject instructions into the hook response
  description: The YAML is explicitly treated as untrusted, but a failed step's `id` is neither validated nor separated from the failure predicate. A failed entry with a missing or null `id` makes `failed_step_id()` return `None`, which is interpreted as no failed step and permits cleanup. A non-null attacker-controlled `id` is interpolated verbatim into `permissionDecisionReason`, creating a prompt-injection channel from repository content into Claude's hook feedback.
