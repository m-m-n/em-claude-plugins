  description: The new deferral depends on recognizing an exact parsed command head and argument shape. Valid Bash such as `if :; then git worktree remove <path>; fi` or `G=git; $G worktree remove <path>` is not recognized by either guard, leaving `defer_to_new_guard` false and reaching the trailing blanket `allow`. Valid CLI forms such as `gh -R owner/repo pr create` are likewise missed because the `-R` value is treated as a positional argument. An attacker or prompt injection controlling `tool_input.command` can therefore wrap a protected operation and delete failed-run evidence or create a PR despite the guard.
