  title: Git `-C` is discarded, causing the guard to inspect the wrong repository
  description: '`git_subcommand()` consumes `-C <path>` but discards its value, while worktree operands and branch targets are resolved using the payload''s original `cwd`. For example, `git -C /repo2 worktree remove .claude/worktrees/em-workflow/x/integration` executes relative to `/repo2`, but the guard checks the corresponding path under the payload cwd. `git -C /repo2 branch -d em-workflow/x/integration` similarly walks ancestors of the wrong repository. A prompt-controlled command can therefore make the guard inspect a benign or nonexistent workflow while Git operates on the failed run.'
  suggestion: Preserve and resolve Git's effective working directory, including repeated or dynamic `-C` options, and use it for both path and repository resolution. Treat dynamic or otherwise unverifiable effective directories as `ask`/batch `deny`. Apply equivalent handling to preceding shell `cd` operations.
