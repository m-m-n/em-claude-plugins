  title: 2 つのフックで S1/S2/S3 分類器が二重実装され、実際に食い違っている
  description: 'destructive-guard.py の matches_target_shape()（1187行〜）は「この 3 形状は failed-run-cleanup-guard.py が判定を持つので blanket allow を留保する」という契約を新設し、docstring で両者の等価性を明言している。しかし実装は完全に別物で、failed-run-cleanup-guard.py は独自の statements()（手書きの文字走査）と head()（VAR=value しかスキップしない）を持ち、destructive-guard.py 側の WRAPPERS スキップ（sudo/env/nohup/time/command/nice/ionice/doas）と extract_shell_payload() による `-c`/`eval`/`<<<` の再走査を持たない。実測（failed ステップを含む workflow.yaml を持つ integration worktree を用意して両フックに同一 payload を投入）:


    - `git worktree remove <wt>` → cleanup-guard: deny / destructive-guard: 無出力（想定どおり）

    - `sudo git worktree remove <wt>` → cleanup-guard: 無出力 / destructive-guard: 無出力

    - `env git worktree remove <wt>` → 同上

    - `bash -c "git worktree remove <wt>"` → 同上


    つまり wrapper 経由やシェルペイロード経由の綴りでは、destructive-guard は形状に一致したとみなして allow を留保する一方、cleanup-guard は分類自体をせず deny を出さない。保護がその綴りでは丸ごと効かず、同時に allow も失われるという両方向に外れた状態になる。契約が docstring 上の主張だけで支えられ、両者の一致を固定するテストも存在しないため、今後 S1/S2/S3 の定義が動けば片側だけ更新される shotgun surgery になる。'
  suggestion: 次のいずれかで、契約を主張ではなく構造で担保する。(a) 形状分類（head 相当の wrapper スキップ + git_subcommand + S1/S2/S3 判定）を hooks/ 配下の 1 モジュールに切り出し、両フックが import する。ここは両者が同一集合であることが正しさの前提なので重複を許容できない。(b) モジュール分割を避けるなら、failed-run-cleanup-guard.py の head() に destructive-guard.py と同じ WRAPPERS スキップを、statements() に `-c`/`eval` ペイロードの再走査を移植したうえで、『destructive-guard が allow を留保する ⇔ cleanup-guard が classify する』を代表コマンド集合（sudo/env 前置、bash -c、クォート内言及、ヒアドキュメント本文）で突き合わせるクロスフックテストを追加する。
  sources:
  - claude:architecture
  confidence: 60
  resolution: fixed
  resolution_reason: auto-applied loop 1 (wrapper skipping in head())
