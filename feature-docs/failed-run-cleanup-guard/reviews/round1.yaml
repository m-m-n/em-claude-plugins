  title: 2 本のガードの分類器が非対称で D2 の superset 性が崩れている（subshell / brace group で deny が blanket allow に打ち消される）
  description: 'IMPLEMENTATION.md の D2 は「新ガードが判定しうる全コマンドで destructive-guard の blanket allow を留保する（superset）」を必須条件に挙げている。loop 3 の修正で failed-run-cleanup-guard.py の statements() だけが subshell `( … )`・brace group `{ …; }`・コマンド置換・`sh|bash -c` へ再帰するようになった一方、destructive-guard.py の matches_target_shape() は destructive-guard 側の statements()/head() が返す先頭トークンで判定するため、`(` や `{` が先頭語になる形では git/gh にマッチしない。実測: `( git worktree remove <integration-wt> )` → 新ガード deny / destructive-guard allow。`{ git branch -d em-workflow/<feature>/integration; }` → 新ガード deny / destructive-guard allow。`( gh pr create --title x )`（cwd が integration worktree） → 新ガード deny / destructive-guard allow。この 3 形では D2 が守ろうとした「deny が生き残る」性質が失われる。逆向きのずれも同じ根で残っている: `mise exec -- git worktree remove <wt>`、`env -u FOO git worktree remove <wt>`、`bash <<''EOF'' … EOF` のヒアドキュメント本文（destructive-guard は allow を留保するのに新ガードは無判定）。根本原因は、同じ S1/S2/S3 契約を 2 つのスクリプトが別々のシェル字句解析スタックで二重実装していること。'
  suggestion: 'いずれか。(a) 最小修正: destructive-guard.py 側で先頭の `(` / `{` トークン（および対応する閉じトークン）を head() でスキップするか、statements() の区切り文字集合に `(`/`)`/`{`/`}` を加えて、matches_target_shape() が subshell / brace group 内の S1/S2/S3 にも到達するようにする。destructive-guard-cases.json に subshell / brace group 版の deny・allow ケースを足して回帰を確認すること。(b) 恒久修正: S1/S2/S3 の分類（statements / head / git_subcommand / gh positional）を em-workflow/hooks/ 配下の共有モジュール 1 本に抽出し、両フックがそれを import する形にして、パリティをコメントの約束ではなく構造で担保する。あわせて mise/asdf exec・wrapper のオプション値消費・シェルシンク向けヒアドキュメント本文の扱いも 1 箇所に集約する。どちらを採る場合も、D2 の superset 性を回帰テストとして固定する（同一コマンド集合に対し「新ガードが deny/ask を出すなら destructive-guard は allow を出さない」ことを両フックに流して突き合わせるテスト）。'
