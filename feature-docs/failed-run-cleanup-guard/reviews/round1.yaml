- stable_id: eab1bc5307462738
  severity: critical
  category: spec
  file: em-workflow/hooks/failed-run-cleanup-guard.py
  line: 271
  title: 動的パスの ask 判定が FR3 のスコープ判定より前に出て、正常ランの worktree 掃除を deny する
  description: '`resolve_worktree_remove()` は `is_dynamic(operand)` を最初に評価し、パスが integration worktree 形かどうかを一切見ずに `_UNRESOLVABLE` → `decide("ask")` を出す。`decide()` は `CLAUDE_BATCH` 下で `ask` を `deny` に降格するため、em-workflow 自身が implement フェーズの毎タスク後片付けとして規定している `git worktree remove "$WT_ROOT/{T}"`（`em-workflow/references/implement-phase.md:580`、および 288 行の `--force` 版）が、失敗していない正常ランでも batch 実行で拒否される。実測で確認済み: `{"command":"git worktree remove \"$WT_ROOT/task0001\""}` は素の実行で `ask`、`CLAUDE_BATCH=1` で `deny` を返す。


    SPEC 違反は 2 点。(1) NFR1「正常完了したランの後片付け（Step C の通常経路、および batch の worktree remove）は必ず素通りする」に真正面から反する。(2) FR3「`git worktree remove` は対象パスが `.claude/worktrees/em-workflow/{feature}/integration` に一致するときのみ判定対象とする」および同 FR のエッジケース表「対象外パス → 判定を出さない」に反する。`$WT_ROOT/task0001` は integration worktree ではなく task worktree であり、判定対象外でなければならない。


    FR7（静的に解決できない対象は ask）との衝突は見かけ上のもの。`$WT_ROOT/task0001` は末尾セグメント `task0001` が静的に確定しており、`integration` でないことが読むだけで分かる。つまり FR3 の形は静的に否定できるので、FR7 の ask を出す必要がそもそもない。同じ順序問題は `resolve_branch_delete()`（314 行）にもあり、`git branch -d "$BR"` は BRANCH_RE に照合される前に ask になる。'
  suggestion: 'FR3 のスコープ判定を FR7 の ask より前に置く。具体的には、静的に確定しているセグメントだけで integration worktree 形を否定できる場合は `None`（判定なし）を返し、否定できない場合に限って `_UNRESOLVABLE` を返す。


    例（`resolve_worktree_remove`）: 先に `os.path.normpath` してセグメント列を作り、末尾セグメントが dynamic でなく `integration` 以外なら即 `None`、末尾から 5 番目・4 番目・3 番目が dynamic でなく `.claude` / `worktrees` / `em-workflow` 以外なら即 `None`、それ以外（feature 位置が dynamic 等、形を否定できないケース）だけ `_UNRESOLVABLE` を返す。`resolve_branch_delete` も同様に、`em-workflow/` 始まりかつ `/integration` 終わりを静的に否定できるなら `None` を返し、feature 部分だけが dynamic のときに `_UNRESOLVABLE` とする。


    いずれの形にせよ、`em-workflow/references/implement-phase.md:580` の `git worktree remove "$WT_ROOT/{T}"` が無出力になることを回帰テストとして固定すること（NFR1 の誤爆コストがそのまま無人実行停止のコストになるため）。'
  sources:
