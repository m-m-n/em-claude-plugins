  description: '同じ「S1/S2/S3 とは何か」という契約が destructive-guard.py の `matches_target_shape()` と failed-run-cleanup-guard.py の `classify()` に独立実装で二重化しており、共有の定義元が無い。auto-fix loop 1 (5da4ce8) は `matches_target_shape()` の gh 分岐にだけ `-R`/`--repo` の値トークン読み飛ばしを追加し、`classify()` の同じ箇所には入れなかった。実測（cwd = failed step を持つ feature の integration worktree）: `gh pr create` → cleanup-guard=deny / destructive-guard=(silent)。`gh -R owner/repo pr create` / `gh --repo owner/repo pr create` → cleanup-guard=(silent) / destructive-guard=(silent)。後者では destructive-guard が blanket allow を留保しているのに cleanup-guard は shape として認識せず deny が出ない。D2 が前提にしていた「留保する側と判定する側が同じ集合を見る」という不変条件が崩れている。構造上の問題は 2 コピーが今後も別々に育つこと。'
  suggestion: "短期の穴埋めは `classify()` に同じ値トークン処理を入れる:\n\n--- a/em-workflow/hooks/failed-run-cleanup-guard.py\n+++ b/em-workflow/hooks/failed-run-cleanup-guard.py\n@@ -277,5 +277,20 @@\n     if word == \"gh\":\n-        non_flags = [a for a in args if not a.startswith(\"-\")]\n-        if non_flags[:2] == [\"pr\", \"create\"]:\n+        # `-R`/`--repo` take a value token of their own (`gh -R owner/repo pr\n+        # create`); without skipping it the repo spelling is mistaken for the\n+        # first positional and `pr create` is missed. Kept identical to\n+        # destructive-guard.py's matches_target_shape().\n+        non_flags = []\n+        skip_next = False\n+        for a in args:\n+            if skip_next:\n+                skip_next = False\n+                continue\n+            if a in (\"-R\", \"--repo\"):\n+                skip_next = True\n+                continue\n+            if a.startswith(\"--repo=\"):\n+                continue\n+            if a.startswith(\"-\"):\n\
    +                continue\n+            non_flags.append(a)\n+        if non_flags[:2] == [\"pr\", \"create\"]:\n             return (\"pr_create\", None)\n         return None\n\n構造側は、コピーを増やさない形にするのが本筋。(a) shape 判定を `em-workflow/hooks/cleanup_shapes.py` のような同階層モジュールに切り出し、両フックが import する（import 失敗時は destructive-guard 側を留保に倒す）。(b) 分離を維持するなら、両実装が同一集合を返すことを 1 本のテストで固定する — 代表コマンド列に対し `matches_target_shape()` の真偽と `classify()` の非 None が一致することを assert する。"
