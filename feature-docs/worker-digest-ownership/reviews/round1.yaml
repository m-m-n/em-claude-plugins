findings:
- stable_id: 2aacf42f2d74bcac
  severity: medium
  category: security
  file: em-workflow/scripts/artifact-digest.py
  line: 120
  title: 'TM-6: 親ディレクトリのシンボリックリンクを辿って作業ツリー外のファイルの digest を返す'
  description: THREAT-MODEL.md の TM-6 は緩和策を「follows no symlink」とし、脅威に「作業ツリー外のファイルを読む」を挙げている。しかし digest_of_path
    は os.lstat（120行目）と O_NOFOLLOW 付きの os.open（129行目）で末尾要素だけを守っており、途中のディレクトリ要素のシンボリックリンクは解決される。fstat（137行目）も種別しか確かめない。そのため親ディレクトリがリンクなら、作業ツリー外の通常ファイルの
    digest が成功として返る。スクリプトの docstring（45-46行目）と artifact-digest.md の not_a_regular_file の説明も末尾要素の拒否しか述べておらず、TM-6
    の緩和策を満たしていない。前提として、作業ツリー内にリンクにした親ディレクトリが要る。Bash を持たない worker はリンクを作れず、漏れるのは中身ではなくハッシュだけなので medium。
  suggestion: 相対パスの各要素を、カレントディレクトリを起点に dir_fd と O_DIRECTORY|O_NOFOLLOW で順に開き、最後のファイルも O_NOFOLLOW でその dir_fd
    基準で開く。途中の要素がリンクなら not_a_regular_file を返す。あわせて docstring・artifact-digest.md の error token の説明を直し、親ディレクトリがリンクの合成ツリーで
    not_a_regular_file・終了コード1になるテストを tests/test_artifact_digest_script.py に足す。
  reproduction: Linux で、作業ツリーから python3 -B em-workflow/scripts/artifact-digest.py '/proc/self/root/etc/hosts'
    '/etc/hosts' を実行する。引数は run → digest_of_path → os.lstat／os.open に渡される。/proc/self/root はシンボリックリンクだが、両方に同じ
    sha256 が返り、終了コードは0になることを確認した。一方、'/proc/self/root' 自体を渡すと not_a_regular_file／終了コード1になるため、拒否が末尾要素だけに限定されていると確認できる。ファイルの作成・変更は不要になる。
  reproduction_alternates: []
  reproduction_overflow: false
