  title: safe root 配下でクォート境界に置換がある形が allow から deny に変わり、理由文が「スクラッチ領域の外」と事実に反する
  description: '_mark_substitutions() が境界判定をやめて全マッチを UNRESOLVED_MARK にしたため、これまで空白に潰れていた「クォートに挟まれた置換」も隣接扱いになり、実テキスト側トークンに
    .unresolved が立つようになった。その結果 1101 行の `if not unresolved and safe_delete_target(normalized)` が safe 例外を塞ぎ、スクラッチ領域配下のパスにクォート境界の置換を続けた
    2 形（/tmp/x に $(date) を続ける形、/tmp/build に $(date) を続けて /out を足す形）が、旧 allow から新 deny (rm-recursive) に反転する。


    方向としては妥当な強化（置換結果に `..` が入りうる）だが、2 点問題がある。(1) 出力される理由文が「対象 /tmp/x はスクラッチ領域の外。mv で退避する」となり、対象は実際にはスクラッチ領域の中であり、提示された書き換え手順もこの入力に対して意味をなさない（NFR5「エージェントが読んで書き換えられる具体的な指示」を満たさない）。同じ未解決性を持つ変数展開の形が
    ask(rm-unresolvable) に落ちるのと非対称で、FR2 の「未解決の削除対象は rm-unresolvable に合流させる」方針とも食い違う。(2) allow が deny に反転する形が
    case table に 1 件も固定されていない。.claude/rules/hook-tests.md は誤爆 1 件を見逃し 1 件と同じコストとして扱い、変化を見つけたらケースを足すよう定めているが、この形は
    table にも unit test の ORIGINAL_VERDICT_BY_COMMAND にも無いため、次に誰かが境界判定を触っても気づけない。'
  suggestion: check_rm() で `.unresolved` が立っているトークンは（実テキストが残っていても）rm-unresolvable の ask 分岐に寄せ、deny/rm-recursive
    の理由文が safe root 配下のパスを「スクラッチ領域の外」と述べないようにする。加えてスクラッチ領域配下にクォート境界の置換を続けた形を期待判定つきで destructive-guard-cases.json
    に追加し、この反転を明示的に固定する。
