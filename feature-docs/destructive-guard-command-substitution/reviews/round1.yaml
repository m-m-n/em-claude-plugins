- stable_id: bd7710d1b20046e5
  severity: high
  category: security
  file: em-workflow/hooks/destructive-guard.py
  line: 638
  title: bash -c / sh -c / eval / here-string のペイロード内では、コマンド置換のみの削除対象が今も allow のまま（FR1 の穴が接頭辞 1 つで回避できる）
  description: "本フィーチャの目的は「削除対象がコマンド置換だけで構成された再帰削除を allow で素通しさせない」ことだが、シェルペイロード経由では閉じていない。実測（本ワークツリーのフックを\
    \ PreToolUse JSON で直接駆動）:\n\n  bash -c \"<recursive delete> $(cat list)\"                     -> allow（CLAUDE_BATCH\
    \ 有無を問わず allow）\n  bash -c \"<recursive delete> $(printf /home/sakura/valuable)\" -> allow（AC-1 のコマンドそのものを包んだ形）\n\
    \  sh -c '<recursive delete> `cat list`'                        -> allow\n  eval \"<recursive delete>\
    \ $(cat list)\"                        -> allow\n  bash <<< \"<recursive delete> $(cat list)\"   \
    \                 -> allow\n\n（上の <recursive delete> は再帰削除コマンドのプレースホルダ。実際の形は AC-1 と同じ。）\n\n対照として、置換以外の未解決形は同じ経路で正しく判定される:\
    \ bash -c で変数展開を渡した形は ask（無人時 deny）、実パスを渡した形は deny。つまりペイロード再走査自体は生きていて、コマンド置換の形だけが証拠を失う。\n\n原因は statements()\
    \ の順序。634 行で toks = _strip_unresolved_marks(toks) を先に適用するため、ペイロードトークンは末尾空白のみに縮退する（.unresolved はトークン属性として立つが文字列には残らない）。638\
    \ 行の extract_shell_payload() はその縮退後の文字列を返し、再走査される文は削除対象を持たない形になって check_rm() が targets 空で早期 return\
    \ する。今回 _strip_unresolved_marks() に入れた SUBSTITUTION_STANDIN の生成は「トークン全体がマーカーのみ」の場合だけで、ペイロードのように実テキストと混在するトークンでは置換の痕跡が文字列から消えるため、再走査先に何も渡らない。\n\
    \nこれは本 diff が新たに壊したものではない（変更前も同じく allow）。ただし SPEC の Objectives / FR1 / AC-1 / AC-3 が閉じたと宣言している穴と同一クラスであり、bash\
    \ -c を前置するだけで回避できる。無人実行では allow がそのまま自動承認になるため、回復不能な削除が確認なしで通る。"
  suggestion: 'statements() で、ペイロードの取り出しをマーカー除去の前に行う（例: marked_toks を保持し extract_shell_payload() には除去前のトークン列を渡す、あるいは
    .unresolved なペイロードトークンを pending に戻す際にマーカー付きの原文を積む）。マーカー付き文字列を再走査に回せば、再走査側の _strip_unresolved_marks()
    が SUBSTITUTION_STANDIN を生成し、既存の rm-unresolvable 分岐にそのまま合流する（NUL は SUBSTITUTION に再マッチしないので二重マークにはならない）。併せて
    destructive-guard-cases.json に bash -c / sh -c / eval でペイロード内にコマンド置換を置いた 3 形を ask で追加し、既存の allow ケース（クォート内の削除コマンド文字列・here-doc
    本文など）が落ちないことを同時に確認する。'
