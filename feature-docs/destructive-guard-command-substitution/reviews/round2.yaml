    title: "置換マーカーを載せたトークンを extract_shell_payload() に渡したため、シェル呼び出しの認識が外れて本文が検査されない"
    description: >-
      task0003 が statements() から marked トークン（UNRESOLVED_MARK 残留つき）を
      extract_shell_payload() に渡すようにした結果、コマンド語やオプションの完全一致判定
      （head()、SHELL_WORDS、`"-c" in args`）にマーカー入りトークンが流れ込み、`bash\x00` や
      `-c\x00` が一致しなくなる。ペイロードは再走査されず、破壊的な本文がそのまま allow になる。
      基準版 db5a4f86 と現行を同一入力で実行して確認した回帰（いずれも基準版 deny → 現行 allow、
      有人・無人の両方で allow）: `bash$(:) -c 'rm -rf ...'`、`bash -c$(:) '...'`、
      `bash -$(true)c '...'`、バッククォート形 `` bash`:` -c '...' ``、`eval$(:) '...'`、
      `bash -c $(printf %s) '...'`。実際の bash では空置換が消えて通常の `bash -c` として
      削除が実行される。SPEC の FR5/AC-5（既存 deny/ask verdict 不変）に反する。
    suggestion: >-
      シェル名・`-c`・ラッパー・リダイレクト演算子の照合はマーカー除去済みトークンで行い、
      再走査のために push する本文だけを対応する marked トークンから取り出す
      （判定用と抽出用でトークン列を分ける）。
    sources: [codex:security]
    confidence: 100
    resolution: fixed
    resolution_reason: >-
      auto-fix loop 1-3 で修正（コミット f459973 / fa9ffc1）。extract_shell_payload() を
      「判定用＝マーカー除去済み / 抽出用＝マーカー保持」の 2 列構成にし、-c の引数が
      置換のみのときは空展開で繰り上がる次の語をペイロードとして検査するようにした。
      here-string 側も同じ読み飛ばしを `_payload_index()` 経由で適用した。
      退行 6 形を destructive-guard-cases.json の deny ケースとして固定し、
      誤爆検知用の allow ケースも併せて追加した。
