schema_version: 1
feature: large-diff-review-coverage
created: '2026-11-07'
base_branch: main
goal: |
  em-workflow のレビューで、大きな差分だと観点が未実施のまま指摘なしとして完了する

  ## 現象 (必須)

  差分が大きいと em-workflow のレビューが一部の観点を実施しないまま完了する。feature subagent-report-write-block（差分 423 KB）で次の 2 つが同時に起きた。

  1. Codex のレビュアーが 540 秒でタイムアウト（exit 124）すると、findings: []、skipped: false の結果を返す。スキーマには合うので、手順どおりなら「指摘なしで完了」になる
  2. litellm のレビュアーは入力が 300,000 文字を超えると review_data_too_large でスキップする。この理由は再試行不可で Claude の代替も走らないので、performance / architecture / spec の 3 観点が誰にも見られないままレビューが完了する。unreviewed_perspectives にも載らない

  ## 再現手順 (必須)

  1. 差分が 300,000 文字を超える feature で review フェーズを実行する
  2. performance / architecture / spec が review_data_too_large でスキップされ、residual が 0 ならレビューは完了する
  3. Codex が 540 秒以内に終わらない観点は空の結果になる

  ## 期待する挙動 (必須)

  実施できなかった観点が「指摘なし」と区別され、差分を分割するなどして 3 観点も実施される。

  ## 完了の定義 (必須)

  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある

  ## 該当箇所 (任意)

  - em-workflow/agents/codex-reviewer.md（タイムアウトの扱い）
  - em-workflow/references/review-phase.md（Phase R2b、unreviewed_perspectives）
  - em-workflow/references/review-protocol.md（review_data_too_large）

  ## 実害・発生条件 (任意)

  今回は Codex のタイムアウトを失敗として扱い Claude レビュアーで代替した。3 観点は未実施のまま。
