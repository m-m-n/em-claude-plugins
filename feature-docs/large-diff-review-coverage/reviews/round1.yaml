  file: em-workflow/references/review-phase.md
  line: 261
  title: シャードの diff_cmd_quoted が literal pathspec でなく、計測した範囲と reviewer が取得する範囲がずれ得る
  description: 'review-shards.py は `--literal-pathspecs` 付きで 1 ファイルずつ計測する（review-shards.py 131-139 行）。一方、シャードの `diff_cmd_quoted` は Phase R0 step 3 と同じ形（48 行: `git -C {project_root} diff {base_commit} --
    <quoted paths>`）で組み立てると定めており（261-263 行）、`--literal-pathspecs` を含まない。R0 step 3 の検証は先頭 `-`・改行・CR・NUL・symlink しか拒否しないので、`*`・`?`・`[` を含む名前や `:` で始まる名前（例 `:!foo`、`:(exclude)a.txt`）は検証を通り、reviewer 側では Git
    の glob / magic pathspec として解釈される。glob は他シャードや excess シャードのファイルまで差分に引き込み、計測上 200,000 文字以下のシャードが膨らんで review_data_too_large の skip を招き得る。exclude magic はそのファイル自身を差分から外すため、run が completed になっても当該ファイルは reviewer
    に見えていないのに、review-coverage.py の coverage は reviewed と数える。この機能が塞ごうとしている「未レビューをクリーンと誤認する」経路が残る。printf %q はシェル向けの引用であり、Git の pathspec 解釈は防がない。R0 の形自体は既存だが、シャード化でその影響が計測とカバレッジの整合に及ぶようになった。'
  suggestion: Phase R0 step 3 の develop-駆動・standalone 両方のコマンド形に `--literal-pathspecs`（`git -C {project_root} --literal-pathspecs diff ...` / `git --literal-pathspecs diff HEAD -- ...`）を加え、シャード用も同じ形にする。codex-reviewer
    など diff_cmd_quoted の形を検査・固定しているテストやエージェント記述があれば合わせて直す。glob 文字や `:` 始まりの名前を含む一時リポジトリで、計測対象と取得対象が一致することをテストで確かめる。
  reproduction: null
