- stable_id: f2082ec775d1cd14
  severity: medium
  category: security
  file: em-workflow/scripts/review-shards.py
  line: 140
  title: 計測の git diff が設定済みの clean フィルターを起動する（既存の露出と同じ範囲）
  description: 再現手順を読解で追跡し、仕組みは reproduced と判断した。count_diff（462-468 行）は作業ツリーに対して `git diff <diff_base> -- <path>` を実行し、GIT_DIFF_OPTIONS（140-150 行）と GIT_PREFIX（131-139 行）は ext-diff・textconv・fsmonitor を止めるが、`filter.<driver>.clean`
    / `.process` は止めない。Git は stat が一致しない作業ツリーのファイルを差分のために読むとき clean フィルターを通すので、手順どおりの設定なら tools/clean.sh が走る。ただし重大度は high から medium に下げた。起動されるコマンドは Git 設定（コミットできない側）に依存し、`.gitattributes` だけではコマンドを定義できない。その前提が成り立つ環境では、同じ作業ツリーに対する同じ形の
    `git diff` を Phase R0 step 3 の diff_cmd_quoted（review-phase.md 48 行）として全 reviewer が既に実行しており、利用者の `git status` / `git add` でも同じフィルターが走る。develop-駆動では implementer がその worktree で任意のコマンドとテストを実行している。review-shards.py
    は新しい実行経路も権限境界の越境も加えていない。
  suggestion: 対処するなら review-shards.py だけでなく diff_cmd_quoted と揃えて扱う。develop-駆動（変更がすべてコミット済み）では tree 同士の比較（`git diff <base_commit> HEAD -- <path>`）にすれば作業ツリーを読まないのでフィルターは起動しない。standalone は作業ツリーとの比較が必須なので、既知の制約として
    review-phase.md か脅威モデルに記載する。
  reproduction: 検証用リポジトリで `.gitattributes` に `sample.txt filter=probe`、Git 設定に `filter.probe.clean=sh tools/clean.sh` を設定し、正常なファイルをコミットする。その後 tools/clean.sh を `touch probe-ran; cat` に変更し、sample.txt も変更する。このリポジトリを
    project_root とし、review_mode="diff"、diff_base="HEAD"、changed_files=["sample.txt","tools/clean.sh"]、perspective_count=1 の入力で review-shards.py を実行する。count_diff → git diff → clean フィルターの経路でスクリプトが実行され、probe-ran
    が作成されることで確認できる。
  reproduction_alternates: []
  reproduction_overflow: false
