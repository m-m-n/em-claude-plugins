  - stable_id: as16-plan-path-traversal
    severity: medium
    category: security
    file: em-workflow/scripts/validate-worker-output.py
    line: 1224
    title: "The task-plan path from an untrusted patch is joined to feature_dir without containment checks"
    description: >-
      The `plan` field arrives in the workflow patch, which is untrusted worker output,
      and is joined directly to feature_dir. An absolute value replaces the base path,
      `..` segments escape it, and is_file/read_text follow symlinks, so the validator
      can be steered into reading any regular file the orchestrator can reach. Parsed
      bullet text may then surface in validation error output, and a very large target
      can exhaust memory.
    suggestion: >-
