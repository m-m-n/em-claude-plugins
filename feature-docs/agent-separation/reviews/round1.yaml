      exclusion list or an extension filter. In a JavaScript or TypeScript project —
      exactly where design-system candidates exist — `**/tailwind.config.*`,
      `**/design-system/` and `**/tokens.json` match heavily inside node_modules, and
      an asset-heavy directory match enumerates images, fonts and build output. The cap
      is then reached on noise, and the documented behaviour at the cap is to abort in
      batch mode, so a cost problem becomes a functional stop.
    suggestion: >-
