    file: em-workflow/references/phase-state.md
    line: 164
    title: "NFR9's exclusion list and extension allowlist never reached any shipped protocol document"
    description: >-
      Of NFR9's three cost controls, only the 500-file / 5 MB cap was written into
      phase-state.md. The exclusions (node_modules/, vendor/, .git/, .claude/worktrees/,
