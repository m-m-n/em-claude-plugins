  - stable_id: as12-scope-hash-cost
    severity: high
    category: performance
    file: em-workflow/references/phases/create-spec-phase.md
    line: 356
    title: "Scope verification hashes the entire checkout twice per worker dispatch"
    description: >-
      The pre-dispatch snapshot enumerates every tracked path and hashes its content
      with git hash-object, and the post-dispatch comparison recomputes the same set,
      so each dispatch reads the repository roughly twice. The procedure applies to
      every dispatch of all five workers, so an analyst clarification loop multiplies
      it by the number of rounds. The pre-dispatch hashing is also redundant: the same
      document's clean-worktree precondition guarantees the tracked working tree
      matches the index, so the blob IDs already captured by `git ls-files -s -z` carry
      the same identity, and step 3 restores from those very blobs. NFR9 caps glob
      discovery at 500 files / 5 MB while this unbounded whole-tree hashing sits beside
      it, orders of magnitude larger on a big repository.
    suggestion: >-
      Drop the working-tree-content row from the snapshot and rely on the index blob
      IDs, then hash only the paths that `git status --porcelain -z -uall` and
      `git diff-files` report as changed. Deletions, mode changes and file/symlink kind
      changes stay detectable, and cost falls from O(repository bytes) to O(changed
      paths). design-input.md 5.11.3 needs the same correction.
    sources: [claude:performance, codex:performance]
    confidence: 95
    resolution: unresolved

  - stable_id: as13-discovery-rules-unshipped
