      policy key rather than deriving category from the suffix. Bind compound
      identifiers like license-conflict to license explicitly, and derive
      issuer and phase from dispatch context rather than packet-controlled
      fields.
    sources: [codex:security, claude:comprehensive]
    confidence: 95
    resolution: deferred
    resolution_reason: "batch mode: review rework cap reached"

  - stable_id: cs5-prior-analysis-digest-gate
    severity: high
    category: performance
    file: em-workflow/references/contracts/worker-envelope.md
    line: 98
    title: "The prior_analysis reuse is inert because the digest gate includes the answers, which change every clarification round"
    description: >-
      Reported independently by both models, cross-model confidence therefore
      high. The reuse of prior_analysis hinges on the previous
      dispatch's input_digest still matching, and rule R1's input_digest is
      the sha256 of the whole digest source whose top-level fields include the
      answers digest. Every clarification re-dispatch folds a new answer into
      the envelope, so from the second round onward the digest always differs
      from the one that produced content. The orchestrator's rule to omit
      prior_analysis when the digest no longer matches then omits it on every
      re-dispatch after the first, and the analyst falls back to performing the
      full investigation exactly as on the first dispatch. High-effort analyst
      runs continue to re-read the full input set — project instructions,
      licence, package manifests, test conventions, resolved end-to-end paths,
      up to 500 files or 5 MB of design-system candidates, existing
      requirements and specification documents — every round. The glob-cache
      half of bs5 is genuinely fixed; the analysis-reuse half was reworded
      rather than reduced.
    suggestion: >-
      Key the reuse on the digest of the analyst's file and value inputs only,
      excluding the answers digest and the write-policy digest, so a re-dispatch
      that only folds in new answers still resolves to a match; or drop the
      outer gate and give prior_analysis a per-input digest map so the analyst
      re-investigates only inputs whose per-file digest changed.
    sources: [claude:performance, codex:performance]
    confidence: 95
    resolution: deferred
    resolution_reason: "batch mode: review rework cap reached"

  - stable_id: cs6-prior-analysis-not-persisted
    severity: medium
    category: comprehensive
    file: em-workflow/references/phase-state.md
    line: 96
    title: "prior_analysis exists only in memory; a session that resumes between rounds forces a full analyst rebuild"
    description: >-
      bs5's envelope field is populated from the previous Task-call result and
      phase-state carries no persistent snapshot body — worker_runs stores only
      a digest, and size management explicitly states no worker output body
      lives in phase-state. So an interruption between two clarification rounds
      loses the snapshot; on resume the orchestrator can re-present the
      unanswered questions but has nothing to put into prior_analysis, so the
      analyst rebuilds. bs5's own suggestion asked for both the envelope field
      and its persistence; only the envelope half landed. Together with cs5,
      this makes prior_analysis effectively non-functional in every realistic
      case.
    suggestion: >-
      Add a phase-state field that persists the analyst's most recent
      analysis_snapshot keyed by the input_digest that produced it, with the
      same size bound the envelope carries, and populate prior_analysis from it
      on resume when the digest still matches.
    sources: [claude:comprehensive]
    confidence: 65
    resolution: deferred
    resolution_reason: "batch mode: review rework cap reached"

  - stable_id: cs7-artifact-overwrite-scope-overlap
    severity: medium
    category: architecture
    file: em-workflow/agents/implementation-planner.md
    line: 217
    title: "IMPLEMENTATION.md is claimed by both create-plan.existing-files and create-plan.artifact-overwrite, and their batch defaults disagree"
    description: >-
      Two source-of-truth documents describe the same case through two gates.
      The planner's questions table names create-plan.existing-files as
      covering IMPLEMENTATION.md or the tasks directory, and the policy file
      defaults it to merge. The spec-writer contract's action-selection
      procedure — which the planner contract defers to as the write-policy
      model — routes the same document to an orchestrator-raised
      create-plan.artifact-overwrite before dispatch, and the policy file
      defaults it to preserve_and_reuse. In batch, preserve_and_reuse
      re-dispatches with the read-only preserve action, so the planner's own
      merge gate never runs — but the two policies still disagree in writing
      on a case only one can win. Handling of the tasks directory is a
      legitimate use of existing-files; the overlap is specifically about
      IMPLEMENTATION.md.
    suggestion: >-
      Narrow the planner's step-seven scope to the tasks directory alone, add a
      line to the planner contract's write-policy section stating that
      IMPLEMENTATION.md and VERIFICATION.md may also arrive with
      replace_authorized or preserve from the artifact-overwrite resolution,
      and update the policy file's existing-files comment.
    sources: [claude:architecture]
    confidence: 60
    resolution: deferred
    resolution_reason: "batch mode: review rework cap reached"

