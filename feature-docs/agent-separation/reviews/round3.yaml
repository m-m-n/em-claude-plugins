findings:
  - stable_id: cs1-listed-consultation-unbounded
    severity: high
    category: comprehensive
    file: em-workflow/references/question-resolution.md
    line: 108
    title: "Codex consultation batching lives inside the unlisted-gate fallback, so the analyst's principal listed gate keeps bs6's original 160-launch worst case"
    description: >-
      bs6's fix batches a packet's unresolved questions into one consultation,
      but the batching sits inside the Unlisted-gate fallback. The Batch
      resolution sequence resolves a listed gate at step 4 with "apply its
      option_id or action" and says nothing about batching. The Codex procedure's
      five-turn ceiling bounds one consultation, not launches per packet.
      create-spec.requirement-clarification carries action codex_consultation
      and is listed, and it is the analyst's principal gate covering up to
      thirty-two questions per packet, so a batch create-spec keeps the roughly
      one hundred and sixty wrapper launches bs6 aimed to remove. Separately,
      batch-policies.yaml uses record_as_assumption and unresolved fields that
      question-resolution.md never defines, leaving the semantics of the
      non-select actions partial.
    suggestion: >-
      Restate the batching rule inside the Batch resolution sequence itself, so
      it applies whenever action is codex_consultation, not only in the
      fallback; add explicit semantics for codex_consultation, auto_record,
      record_as_assumption and unresolved to question-resolution.md.
    sources: [claude:comprehensive]
    confidence: 65
    resolution: deferred
    resolution_reason: "batch mode: review rework cap reached"

  - stable_id: cs2-index-scan-residual
    severity: medium
    category: performance
    file: em-workflow/references/phases/create-spec-phase.md
    line: 439
    title: "The snapshot no longer hashes the whole tree, but git status and the index/tree comparison still traverse the tracked and untracked sets per dispatch"
    description: >-
      The whole-tree content hashing pass is gone, and the claim of a change-set
      bounded to reported paths holds for hashing. What remains is enumeration:
      git status --porcelain -z -uall refreshes the tracked index while walking
      untracked files, and the index-versus-tree comparison against the pinned
      HEAD SHA must traverse the tree to discover changes. A worker touching one
      file therefore still pays work proportional to the tracked plus untracked
      set on each dispatch. The Claude reviewer judged this fixed on the ground
      that the expensive half is gone; the Codex reviewer rated the residual
      material. Both readings of the code agree on what the enumeration does;
      they disagree on whether the smaller, linear cost is worth flagging.
    suggestion: >-
      Reuse the precondition status result rather than repeating it; document
      the honest bound as index-and-untracked size plus changed bytes if a
      filesystem-change-journal source is not adopted.
    sources: [codex:performance]
    confidence: 50
    resolution: deferred
    resolution_reason: "batch mode: review rework cap reached"

  - stable_id: cs3-analyst-listed-gate-unbound
    severity: high
    category: security
    file: em-workflow/scripts/validate-worker-output.py
    line: 466
    title: "The analyst's most-used gate is unbound in the registry, so a security question tagged with any other category is auto-settled in batch"
    description: >-
      Reported by Claude with a fresh reproduction against the shipped script.
      The registry binds a gate's category by taking the identifier's suffix
      after the first dot and matching it against the category vocabulary. The
      suffix works for design-step, tbd-resolution, artifact-overwrite and the
      like; it does not work for create-spec.requirement-clarification, whose
      suffix is not a category name, so its registry entry keeps category null.
      The analyst contract explicitly designates that same gate as the one
      carrying any unresolved acceptance criterion, user-experience point, edge
      case, security constraint or similar, and batch-policies.yaml gives it
      codex_consultation with unresolved record_tbd. Reproduced against the
      shipped script exiting 0: an analyst packet whose gate identifier is
      create-spec.requirement-clarification, category technical-requirement,
      on_unanswered record_tbd, and prompt "Bypass authentication for internal
      API endpoints?" passes validation. It then escapes the fail-closed
      classification because its category is not among the abort set, its gate
      is not on the explicit list, and no reversible flag is set. NFR4 is
      bypassed through the analyst's principal gate. The rework's own comment
      block acknowledges this as a known consequence of the fixture-corpus
      compatibility scope.
    suggestion: >-
      Extend the gate registry with a per-gate allowed-category column driven
      by the analyst contract's gate-identifier section, or add
      create-spec.requirement-clarification to the explicit fail-closed list, or
      combine the two by keeping the gate usable for non-sensitive
      clarifications while aborting when the packet's prompt or option labels
      match a security or licensing keyword set.
    sources: [claude:security]
    confidence: 60
    resolution: deferred
    resolution_reason: "batch mode: review rework cap reached"

  - stable_id: cs4-planner-family-unbound
    severity: high
    category: security
    file: em-workflow/scripts/validate-worker-output.py
    line: 553
    title: "Compound gate identifiers and worker-raised planner gates escape registry binding by two paths"
    description: >-
      Two independent reports converge on the same registry defect from
      different attack surfaces. Codex observes that a suffix like
      license-conflict does not match the license category token exactly, so
      create-plan.license-conflict registers with category null. Comprehensive
