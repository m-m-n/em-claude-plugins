  - stable_id: bs6-codex-consultation-budget
    severity: high
    category: performance
    file: em-workflow/references/question-resolution.md
    line: 119
    title: "The newly written Codex consultation has no total budget and multiplies per question and per command"
    description: >-
      Introduced by the round-1 rework itself: one task wrote the consultation loop
      as substance and another made create-spec.requirement-clarification reachable,
      and that gate carries action codex_consultation and is the analyst's most
      frequent. The procedure runs once per question with a five-turn ceiling, so a
      batch create-spec of up to thirty-two questions can launch the wrapper up to a
      hundred and sixty times sequentially. Step 3 re-sends the entire prior exchange
      each turn, so tokens grow quadratically within one consultation. A second
      amplifier: the batch per-command approval fallback points at the same
      procedure, and unlike the interactive side it defines no literal-string cache,
      so each command string can cost five more launches. No total budget, no
      per-packet batching and no result reuse are defined anywhere.
    suggestion: >-
      Give the consultation a per-phase budget, or batch a packet's unresolved
      questions into one consultation; add the literal-string cache to the batch
      per-command fallback; and cap or summarize the re-sent history.
    sources: [claude:performance]
    confidence: 60
    resolution: unresolved

