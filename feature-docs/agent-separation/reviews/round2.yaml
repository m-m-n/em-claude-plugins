  - stable_id: bs1-payload-contract-collision
    severity: high
    category: comprehensive
    file: em-workflow/references/contracts/analyst-contract.md
    line: 61
    title: "The new payload prohibition contradicts the analyst contract, so every clarification round fails validation"
    description: >-
      as21's fix forbids a non-empty payload on any status except completed
      (validate-worker-output.py:1204-1208). analyst-contract.md:61-64 and
      agents/requirements-analyst.md:79 instruct the analyst to return
      payload.analysis_snapshot together with status needs_user_input. The two
      cannot both hold. Measured: adding analysis_snapshot to the
      valid-needs-user-input fixture yields exit 1 with "status
      'needs_user_input' forbids a non-empty payload". requirements-analyst is
      create-spec's principal worker and the clarification loop is the main
      success path, so a worker behaving exactly as its contract requires is
      rejected at every round. The existing fixtures use an empty payload, which
      is why 761 tests and the invariant checker both stay green. Related drift:
      create-spec-phase.md:181 refers to analysis_snapshot.design_system_candidates
      when describing the completed payload, whose key is design_system_candidates.
    suggestion: >-
      Decide which side is normative and make the other follow. Either treat the
      envelope's status table as SSOT and move the analyst's interim findings into
      the question packet's summary / confirmed_facts / assumptions, or record a
      per-worker exception in the envelope status table and make the validator's
      prohibition per-worker via the capability table. Fix the create-spec-phase.md
      reference either way, and add an analyst + needs_user_input + analysis_snapshot
      fixture.
    sources: [claude:comprehensive]
    confidence: 65
    resolution: unresolved

  - stable_id: bs2-fail-closed-listed-path
    severity: high
    category: security
    file: em-workflow/references/question-resolution.md
    line: 53
    title: "The fail-closed classification sits inside the unlisted-gate branch, so listed gates settle sensitive questions unchecked"
    description: >-
      Reported independently by four reviewers. The classification added for as8
      lives in the Unlisted-gate fallback section, which is entered only when the
      gate is absent from the policy file. The sibling Batch resolution sequence
      looks the gate up and applies its option without consulting category or the
      reversible flag. Two independent consequences follow. First, the analyst can
      raise only create-spec.requirement-clarification and create-spec.design-step,
      both listed, and the former is defined by analyst-contract.md:173 as the gate
      for any unresolved point including security constraints — so a security or
      licensing question in create-spec always takes the listed path and settles via
      codex_consultation or record_tbd, and NFR4 never applies there. Second,
      gate_id remains an unbound worker-chosen string (validate-worker-output.py:588
      checks non-empty only), so any sensitive question can be laundered through any
      permissive listed gate. Both spoofs were reproduced through the real validator
      and exit 0: a rework-planner packet with phase rework, category security and
      gate_id create-spec.design-step, and one with category spec-change and gate_id
      create-plan.tbd-resolution. The promise that leaving rework.spec-change
      unlisted forces an abort is bypassable by naming another gate. The
      category-to-blocking cross-check added by as8 is inert on the listed path,
      which never reads on_unanswered.
    suggestion: >-
      Hoist the classification above both branches — immediately after step 1 of the
      Batch resolution sequence — and have the fallback reference it rather than
      restate it. Independently, bind gate_id in the validator to a registry keyed by
      gate identifier giving the permitted worker, phase, category and option ids.
      Neither half suffices alone.
    sources: [claude:security, claude:comprehensive, claude:architecture, codex:security]
    confidence: 95
    resolution: unresolved

  - stable_id: bs3-gate-jurisdiction-criterion
    severity: high
    category: architecture
    file: em-workflow/references/batch-mode.md
    line: 38
    title: "The batch gate split used the wrong criterion, leaving one gate family in two SSOTs with no path to either"
    description: >-
      The rework divided gates by who presents them rather than by whether they
      carry a gate identifier, and the resulting text is false in both directions.
      batch-mode.md:38-40 claims none of its rows carries a gate identifier at its
      originating site, yet spec-writer-contract.md:118-124 has the orchestrator
      raise a question with gate_id {phase}.artifact-overwrite, and the two moved
      rows print a gate identifier and speak of the packet. The
      {phase}.artifact-overwrite family is now split, create-spec's policy in
      batch-policies.yaml and design's and create-plan's in the batch-mode table.
      Conversely batch-policies.yaml's header restricts it to packet-borne gates
      while five of its entries are orchestrator-presented, including
      create-spec.feature-identity, the very first gate of a batch run. The
      operative consequence is that question-resolution.md's batch sequence is the
      only procedure that resolves a gate identifier and it has no hop into the
      batch-mode table, so design and create-plan artifact-overwrite never reach the
      documented preserve_and_reuse and fall through to Codex consultation — which,
      if the suggestion maps to overwrite, produces exactly the silent overwrite the
      policy file promises never happens. The eight moved identifiers are also
      outside the invariant checker's scan, so they now receive no vocabulary check.
      The same wrong criterion is fixed in develop/SKILL.md:59-64's argument
      processing, which routes Step A.5 and every phase gate to the batch-mode table
      while that same file's Step A.5 was repointed to batch-policies.yaml, so an
      orchestrator following the entry rule loses auto_record and the refusal-pattern
      hard fail.
    suggestion: >-
      Restate the criterion as gate-identifier presence rather than presenter, apply
      it consistently across batch-mode.md, batch-policies.yaml's header,
      develop/SKILL.md's argument processing and question-resolution.md's batch
      sequence, and bring the artifact-overwrite family back under one SSOT. This
      orchestrator's own rework instruction recommended the wrong direction; the
      criterion above supersedes it.
    sources: [claude:architecture, claude:comprehensive]
    confidence: 75
    resolution: unresolved

