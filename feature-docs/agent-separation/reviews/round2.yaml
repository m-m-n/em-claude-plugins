  - stable_id: bs15-runtime-write-enforcement
    severity: medium
    category: security
    file: em-workflow/references/phases/create-spec-phase.md
    line: 368
    title: "Write containment is validated before dispatch but not enforced per tool call"
    description: >-
      The pre-dispatch control validates the declared targets and roots; it does not
      constrain each write the worker performs. A worker that ignores its policy and
      writes to an undeclared absolute path outside the worktree leaves a mutation
      the comparison cannot see and the snapshot cannot restore, as the protocol
      itself acknowledges. Recorded as a known limitation rather than a regression:
      as9's own suggestion stated that tool-call-time or operating-system enforcement
      is the complete fix and is outside this feature's scope.
    suggestion: >-
      Out of scope here. If it is taken up later, enforce the policy at tool-call
      time through a pre-use guard or a sandbox and keep the comparison as auditing.
    sources: [codex:security]
    confidence: 50
    resolution: deferred
    resolution_reason: >-
      Known limitation, explicitly scoped out when as9 was raised; the complete fix
      needs a mechanism this feature does not introduce.

