lessons_candidates:
- topic: orchestrator planning error — batch gate jurisdiction
  note: 'round-1 task0017 plan told the implementer to split batch gates by ''who presents them''; the correct criterion was ''gate_id presence''. Cost: two full review rounds. Rework via task0022 unified
    it. Retrospect: an orchestrator directive that supersedes the design''s own criterion should require a written justification and a cross-check pass.'
- topic: validator scope limits accumulate — gate registry
  note: 'task0023 explicitly scoped the gate registry to gates whose contract carries a Gate identifiers table (only analyst''s). Two independent round-3 reviewers found spoofs via other routes: category-suffix
    that isn''t a category name (requirement-clarification, license-conflict), and gate declarations in agents/*.md that were never scanned. Retrospect: enumeration-based defenses need an explicit ''and
    everything not enumerated defaults to deny'' rule, or they accumulate holes at every scope decision.'
- topic: rework 'envelope-only' fixes — bs5 prior_analysis
  note: 'bs5''s fix added the envelope field but left the digest gate keyed on the full input_digest (which includes answers_digest). Every clarification round changes answers, so the gate always fires
    and the field is omitted. The reword compiled and passed 865 tests but delivered zero cost reduction. Retrospect: ''add a field'' fixes should include a fixture that pins the field''s actual use, not
    just its schema presence.'
- topic: SPEC vs shipped-protocol drift after rework
  note: 'bs13 amended FR31 for the working-tree-hash row; task0025''s independent bs14 fix also removed the pre-dispatch index-listing pass but only from the shipped protocol. Round 3 caught the residual.
    Retrospect: when a rework changes what the shipped protocol does, the orchestrator should audit the SPEC.md line that mandated the old behaviour in the SAME turn, not the next round.'
- topic: deferred/limitation acknowledgement in task-plan output
  note: 'task0023 documented its own scope limit inline in the script (lines 427-452) and in tests.yaml. Round 3 reviewers cited that comment when confirming the finding was ''known scope limit not fresh
    regression''. Retrospect: explicit self-acknowledged limitations shortened round-3 attribution and should be a template for future partial fixes.'
