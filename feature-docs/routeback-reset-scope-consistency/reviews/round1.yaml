    description: >-
      cleanup の削除対象を「confirmed not merged」と書くが、その根拠は journal の
      last event と workflow.yaml status だけで、`git merge-base --is-ancestor` は
      「`merged` を主張したタスク」にしか適用されない。merge-task.sh は
      `git update-ref` の後で `append_merged_event` を呼び、append 失敗時は WARNING
      のまま exit 0 で続行する。update-ref 成功後・append 前に実装者が停止し report も
      欠落すると、queue_failure_net.py が `failed` を追記 → 再構成状態 `failed` →
      拡張後のゲートもブロックせず、マージ済みブランチが `git branch -D` される
      残余経路が残る。
    suggestion: >-
      (a) cleanup 直前に削除候補ごとの `git merge-base --is-ancestor` 検査を足して
      ancestor だったタスクを cleanup / reset の両方から外す、または (b) 「confirmed
      not merged」を実際の検証内容（reconciled state が `merged` でない）まで弱め、
      journal に `merged` が残らなかったマージ済みブランチはこのゲートでは検出できない
      残余状態であることを leftover-state 文と同じ体裁で明記する。
    sources: [claude:comprehensive]
