  - stable_id: 17011cf0d79a8023
    severity: medium
    category: spec
    file: em-workflow/agents/requirements-analyst.md
    line: 138
    title: "Six worker docs restate the criterion's full text instead of citing the SSOT, and a new test pins the restatement"
    description: >-
      SPEC FR2 asks the three agent prompts to carry the criterion "pointing at
      the FR1 SSOT rather than restating its full text"; FR3 asks the three
      contracts for "the same binding pointer as FR2"; NFR1 says "The criterion is
      defined once (FR1). Every other site cites it; no site restates it in a way
      that can drift"; assumption a2 says the six worker-facing documents "cite it
      rather than duplicating its full wording." The shipped diff instead copies
      FR1's full two-half sentence essentially byte-for-byte into all six
      documents (requirements-analyst.md:138-141, implementation-planner.md:256-259,
      rework-planner.md:103-106, analyst-contract.md:33-36, planner-contract.md:57-60,
      rework-planner-contract.md:206-209) plus a parenthetical pointer — seven
      copies of one normative sentence. The evaluator's own inspection added that
      the duplication is now locked in by the new suite: _cites_criterion in
      tests/test_assumptions_reversible_criterion.py:118 requires the full text
      plus the pointer, and test_cites_criterion_rejects_pointer_only_forged_text
      (line 438) asserts a pointer-only site FAILS — so the SSOT-compliant shape
      FR2/NFR1/a2 ask for is actively rejected by the tests. Counter-evidence: SPEC
      AC-5 requires the module to fail "when the criterion text is removed from any
      one of the seven documents" and TS-2/TS-3 say each file "carries the
      criterion", which read as text-present-per-file. The SPEC is internally
      inconsistent between these two readings.
    suggestion: >-
      Either (a) reduce the six citing sites to a pointer-only binding rule and
      relax _cites_criterion (plus rework test_cites_criterion_rejects_pointer_only_forged_text
      and the per-file real_vs_stripped proofs), or (b) amend SPEC FR2/FR3/NFR1 and
      assumption a2 so the shipped shape and the specification agree. Do not leave
      the two in conflict.
    sources: [litellm:muse-spark:spec]
    confidence: 60
    resolution: unresolved
    resolution_reason: >-
      Category spec is excluded from the R4 auto-fix candidate gate, and the
      remedy is a specification-reconciliation decision (the SPEC contradicts
      itself between FR2/NFR1/a2 and AC-5/TS-2/TS-3), not a mechanical edit.
      Medium severity, so it does not hold the completion gate. Left for a human
      decision; the loop-1 spec re-review reported no findings but that is not
      evidence of a fix.
