findings:
  - stable_id: 97745c0d0a62cafa
    severity: high
    category: comprehensive
    file: tests/test_assumptions_reversible_criteria_version_bump.py
    line: 119
    title: "Literal version pin makes the new test module fail on the next em-workflow bump"
    description: >-
      TestPluginManifestVersion.test_version_is_pinned_new_value asserted
      assertEqual(plugin.json version, NEW_VERSION="0.1.65"), comparing the live
      manifest against a frozen literal. .claude/rules/core-plugin-version-bump.md
      makes a bump mandatory for any change under em-workflow/, so the next
      feature moving the manifest to 0.1.66 would have failed this assertion with
      certainty and contaminated that unrelated feature's baseline failures. None
      of the 13 pre-existing tests/*_version_bump.py modules pins the version to a
      literal; every one routes through a major.minor-equal / patch-greater
      matcher. The module already defined that matcher
      (_assert_patch_bump_over_baseline) and applied it to the marketplace entry,
      so only this one class deviated. NEW_VERSION itself is kept — the
      non-vacuity companion still uses it as its sample.
    suggestion: >-
      Replace the literal assertion with the module's own baseline matcher:
      def test_version_is_past_baseline(self):
      _assert_patch_bump_over_baseline(self, self.data.get("version"))
      Keep the NEW_VERSION constant.
    sources: [claude:comprehensive]
    confidence: 80
    resolution: fixed
    resolution_reason: "auto-applied loop 1 (needs-judgment / Apply as-is, batch)"
