schema_version: 1
feature: tests-yaml-id-resolution-gaps
created: '2026-10-09'
base_branch: main
goal: '# tests_yaml_id_resolution の記録検査に残る穴 6 件（単独 tests の通過・抽出エラー時の解決判定漏れ・走査エラーの無視ほか）


  ## 現象 (必須)

  feature `tests-yaml-test-id-resolution` で追加した記録検査 `tests/test_tests_yaml_id_resolution.py` に、レビュー round 1 で medium 3 件・low 3 件の穴が見つかった（critical/high ではないため自動修正の対象外で残した）。

  - 単独の `tests` が `tests.` 始まりの ID として検査を通る（`tests/test_tests_yaml_id_resolution.py:565`）。`loadTestsFromName(''tests'')` は 0 件のスイートを返すので、何も選ばない `tests: [tests]` の記録が通る。README の Syntax gate も「one or more dot-separated segments」で、「IDs start with `tests.`」と食い違う（medium）

  - 抽出エラーが 1 件でもある AC は全体が解決判定から外れ、同じ AC の読めた ID の解決エラーが報告されない（`:408`）。SPEC FR5 の「抽出エラーと解決エラーは途中で止めず全件集め」から外れる（medium）

  - `enumerate_records` の `os.walk` に `onerror` が無く、読み取れない配下ディレクトリの記録が黙って検査から抜ける（`:92`）（medium）

  - `load_tests` フックがスイート以外を返すと `_walk_suite` が try の外で TypeError を送出し、同じ記録の後続 ID が判定されない（`:700`）（low）

  - ローダー確認で TestCase 派生クラスの独自 `__init__` が走る。構造判定は `...Cls.__init__` もメソッド ID として受け入れる。README と docstring の「解決したものを呼ばない」の記述と合わない（`:694`）（low）

  - モジュール ID のローダー確認で `load_tests` フックが呼ばれる。FR6 がローダー確認を求めているので避けられないが、保証の記述範囲を揃える必要がある（`:694`）（low）

  ## 再現手順 (必須)

  1. メモリ上の空の tests パッケージで `acceptance_tests: {AC-1: {tests: [tests]}}` を `check_record` に渡すとエラー一覧が空になる

  2. `tests: [tests.nope.A.b, {name: x}]` を渡すと、マッピング要素の抽出エラーだけが返り、`tests.nope.A.b` は報告されない

  3. `os.scandir` を模擬して配下ディレクトリで PermissionError を起こすと、`enumerate_records` は読めた分だけ返し、ゼロ件ガードも通る

  ## 期待する挙動 (必須)

  - `tests` 単独を含め、2 セグメント未満の ID を不正として拒否する

  - 抽出エラーのある AC でも、読めたスカラー ID は解決判定し、両方のエラーを並べる

  - 走査エラーは対象パス付きの検査失敗として報告する

  - ローダーの戻り値がスイートであることを確認し、反復中の例外も ID ごとの解決エラーとして返す

  - ダンダー名をメソッド ID として拒否し、README と docstring の非実行の保証を「テストメソッドの本体は実行しない。ローダー確認では通常の収集と同じくクラス生成と load_tests フックが動く」範囲に書き直す

  ## 完了の定義 (必須)

  - [ ] 再現手順で現象が起きない

  - [ ] 再発を検出するテストがある

  ## 該当箇所 (任意)

  - `tests/test_tests_yaml_id_resolution.py`（92, 408, 565, 694, 700 行付近）

  - `test/README.md`（Syntax gate と非実行の保証の記述）

  - レビュー記録: `feature-docs/tests-yaml-test-id-resolution/reviews/round1.yaml`（integration ブランチ `em-workflow/tests-yaml-test-id-resolution/integration`）

  ## 実害・発生条件 (任意)

  通常のチェックアウトと現在の記録では起きない。誤った記録の書き方や特殊なテストモジュールがあると、ずれの見逃しや検査の途中停止につながる。


  Notion: https://www.notion.so/3f33509ec8ee81fabf64d99c2c8572a5


  ## 追加指示（起動引数）


  - 実装完了後、integration ブランチを remote に push し、gh pr create で base_branch への PR を作成する。integration ブランチはローカル・リモートとも残す（base_branch へ自動マージしない）

  - 不明点は Codex に相談し、比較的良いと判断された案を採用する

  - その議論内容を Notion に記録する

  '
