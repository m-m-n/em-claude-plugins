  title: "tests の先頭項目にタブがあると、後続の読める ID が 1 件も解決判定されない"
  description: "parse_tests は、tests キー直後の最初の非空行がスペースの後にタブを含むと「tab in indentation」を報告し、すぐに [] を返す（539〜542 行）。呼び出し元の parse_ac は、次のダッシュ項目（インデント 6）をフィールドのインデント不一致として skip_deeper で読み飛ばす。このため、後続にある 1 行で完結した読める ID（例: tests.nope.good）は抽出されず、解決判定もされない。2 項目目以降のタブ行は報告したうえで読み続ける（563 行）ので、先頭項目だけ扱いが食い違っている。FR2 の「AC に抽出エラーがあっても、1 行で完結したスカラーとして読めた ID はすべて解決判定する」に反する。記録自体は抽出エラーで失敗するので見逃しにはならないが、抽出エラーと解決エラーを 1 回の失敗メッセージに並べるという FR2 の目的は、この経路では果たせない。"
  suggestion: "先頭行のタブを報告した後もリストの解析を続ける。たとえばタブ行を飛ばし、最初のタブなしダッシュ行から item_indent を決める。`tests:` / `      \\t- tests.nope.bad` / `      - tests.nope.good` の形の回帰テストを TestExtractionErrors に追加する。"
  reproduction: null
