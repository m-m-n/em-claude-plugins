    1 テストで相対パスと理由を並べて失敗させる。enumerate_records の戻り値は変えない。記録生成に使った走査のエラーを渡し、収集テストに専用クラスの確認を加える
  resolution_note: 'gate: create-spec.fr3-scan-error-shape (orchestrator-raised from
    analyst assumption A3); options: dedicated_scan_error_class / fold_into_zero_record_guard
    / change_return_shape; choice: dedicated_scan_error_class; codex_consulted: true
    (codex entry, 1 turn, converged); opus_escalation: false; key points: 専用クラスに分ける方が、既存の戻り値とゼロ件検査の意味を保てる。enumerate_recordsは整列したパス一覧を返し、os.walkにonerrorを渡していない（tests/test_tests_yaml_id_resolution.py:86-96）。既存のガードは記録がゼロ件の場合だけ失敗する（tests/test_tests_yaml_id_resolution.py:802-807）。収集テストは記録用クラスとガード用クラスの件数を個別に確認しており、全体の件数は固定していないため、別クラスの追加と両立する（tests/test_tests_yaml_id_resolution.py:1963-1967）。走査エラーを別経路で収集し、モジュール直下に生成した専用クラスの1テストで相対パスと理由をまとめて失敗させれば、記録が見つかった場合も通常実行で報告できる。既存クラスも同じ生成方式で公開されている（tests/test_tests_yaml_id_resolution.py:832-833）'
