  normalized_answer: include_duplicates — 重複 tests キー・重複 AC キーの両方で読めた ID を解決判定し、AC
    キー名で報告する
  resolution_note: 'gate: create-spec.fr2-duplicate-scope (orchestrator-raised from
    analyst assumption A2); options: include_duplicates / exclude_duplicate_ac_key;
    choice: include_duplicates; codex_consulted: true (codex entry, 1 turn, converged);
    opus_escalation: false; key points: 両方を対象にする方が、抽出エラーがあっても読み取れたIDを検査するというFR2に一貫している。現状は重複ACの本体も解析してから、そのAC全体を除外している（tests/test_tests_yaml_id_resolution.py:403-413）。重複testsも各値を解析するが、最初の値だけを保持している（tests/test_tests_yaml_id_resolution.py:450-455）。各出現の読み取れたIDを同名ACに集約し、重複エラーも残せば、既存のAC名付き表示と記録ごとの一括失敗を維持できる（tests/test_tests_yaml_id_resolution.py:729-750、test/README.md:61-63）。重複ACだけを除外すると、読み取れたIDが検査されない例外が残る'
