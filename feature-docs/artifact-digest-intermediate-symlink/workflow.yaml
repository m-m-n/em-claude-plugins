schema_version: 1
feature: artifact-digest-intermediate-symlink
created: '2026-10-21'
base_branch: main
goal: '# artifact-digest.py が途中のディレクトリ要素のシンボリックリンクを辿り、作業ツリー外のファイルの digest を返す（TM-6
  の緩和策が不完全）


  Notion task: <notion-url>



  ## 脆弱性の概要 (必須)


  `em-workflow/scripts/artifact-digest.py` の `digest_of_path` は、末尾要素のシンボリックリンクだけを拒否し（`os.lstat`
  と `O_NOFOLLOW`）、途中のディレクトリ要素のリンクは辿ってしまう。親ディレクトリがリンクだと、作業ツリー外の通常ファイルの digest が成功として返る。THREAT-MODEL.md
  の TM-6（follows no symlink）の緩和策を満たしていない。


  ## 参照 (必須)


  - CVE / GHSA ID: 該当なし

  - アドバイザリ URL: 該当なし

  - severity: medium

  - 該当パッケージ: 該当なし

  - 現在のバージョン: feature worker-digest-ownership の integration ブランチ（em-workflow/worker-digest-ownership/integration）

  - 修正済みバージョン: 無し


  ## 攻撃シナリオ (必須)


  作業ツリー内に、作業ツリー外を指すディレクトリのシンボリックリンク（例: リポジトリにコミットされたリンク）があると、その配下のパスを digest 計算に渡したとき、外部の通常ファイルを読み取って
  sha256 を返す。


  再現（review round 1 で確認済み）: Linux で、作業ツリーから `python3 -B em-workflow/scripts/artifact-digest.py
  ''/proc/self/root/etc/hosts'' ''/etc/hosts''` を実行すると、両方に同じ sha256 が返り終了コード 0 になる。`/proc/self/root`
  自体を渡すと `not_a_regular_file`・終了コード 1 になるので、拒否が末尾要素だけに限られている。


  ## 影響範囲 (必須)


  漏れるのはファイルの中身ではなくハッシュだけ。Bash を持たない worker はリンクを作れないため、前提としてリンクが既に作業ツリーにある必要がある。digest
  計算は write\_policy の決定時にも行われるため、後段の範囲検証だけでは読み取りを防げない。


  ## 完了の定義 (必須)


  - [ ] 攻撃シナリオが成立しない

  - [ ] 修正版に追随している（修正版が無い場合は暫定緩和策の欄に対応を記載）

  - [ ] 親ディレクトリがリンクの合成ツリーで `not_a_regular_file`・終了コード 1 になるテストが `tests/test_artifact_digest_script.py`
  にある


  ## 該当箇所 (任意)


  - `em-workflow/scripts/artifact-digest.py:120`（`os.lstat`）、`:129`（`O_NOFOLLOW` 付き
  `os.open`）、`:137`（`fstat`）、docstring `:45-46`

  - `em-workflow/references/artifact-digest.md` の `not_a_regular_file` の説明

  - review 記録: `feature-docs/worker-digest-ownership/reviews/round1.yaml`（stable\_id
  `2aacf42f2d74bcac`）


  ## 暫定緩和策 (任意)


  修正案: 相対パスの各要素をカレントディレクトリを起点に `dir_fd` と `O_DIRECTORY|O_NOFOLLOW` で順に開き、最後のファイルも
  `O_NOFOLLOW` でその `dir_fd` 基準で開く。途中の要素がリンクなら `not_a_regular_file` を返す。'
