  title: 2 つ目以降の関数名の後の case を case 文として読み、置換が判定不能になって対話起動を見逃す
  description: FR3 の実装（2991〜2998 行）は、2 つ目以降の名前を読んだ後も HEAD_FUNCTION_NAME とコマンド位置を保つ。そのため次の `case` を `_read_command_word` が case 文の開始として返す。zsh の par_funcdef は名前を incmdpos=0 で読むので、`case` も名前になり、`function f g case { :; }` は有効な定義になる。ガードは `case {` の後に `in` も単独の `{` も無いので、phase 3 で _Undecidable("case without in") になる。チェックポイントが無いので無出力になる。変更前は `g` を単純コマンドの最初の語（HEAD_FIRST）として読み、`case` は引数だった。置換は `)` で閉じ、後続の `python3 -i` を拒否していた。つまり変更前の deny が silent に変わる回帰になる。読解で確認した（実行はしていない）。最初の名前の直後の `case`（`function f case {`）は変更前から同じく判定不能になる。SPEC A-4 は予約語が名前になる形を対象外としているが、A-4 の理由（bash の `function f case ...` の読み）は 2 つ目以降の名前には当たらない。bash では `function f g` がそもそも構文エラーになるからだ。em-review のコピーはバイト単位で同一なので、同じ欠陥がある。
  suggestion: 最初の名前の直後は A-4 のまま残す。2 つ目以降の名前を読んだ後の状態を分け、単独の `{` / `}`、空の `()`、区切り以外の語はすべて名前として読む（予約語・頭部語・`case`・`[[` も含む）。`zsh -c 'echo "$(function f g case { :; })"; python3 -i'` が deny になる行を CASES に足し、両方のコピーに流す。
  reproduction: 'tool_input.command を `zsh -c ''echo "$(function f g case { :; })"; python3 -i''` とする JSON をフックの標準入力に渡す。変更後は出力が空になり、変更前は permissionDecision: deny を返す。python3 -i を `print -r -- REACHED` に置き換えて zsh 5.9 で実行すると、終了コード 0 で REACHED が出力され、後続コマンドへの到達を確認できる。'
