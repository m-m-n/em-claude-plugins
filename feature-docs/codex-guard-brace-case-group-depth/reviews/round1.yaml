- stable_id: c5da4b70ee651440
  severity: medium
  category: security
  file: em-workflow/scripts/codex-hook-interactive-guard.py
  line: 2887
  title: 匿名関数の本体を閉じた } の後の always を予約語と読み、置換の閉じを誤って対話起動を見逃す
  description: コマンド位置の `}` は、どの一覧でも HEAD_GROUP_CLOSED を立てる（2971 行）。そのため匿名関数（`function { :; }`、`function () { :; }`、`() { :; }`）の本体を閉じた `}` の後の `always` も、2887 行で予約語として読まれ、次の語がコマンド位置になる。zsh の par_funcdef は、匿名関数の `}` の後を incmdpos=0 で引数として読む。`always`、`{`、`case` はどれも STRING になる。報告の入力 `function { :; } always case x)` では、ガードが `case x` を開き、`)` で判定不能になって無出力になる。判定不能にならず、閉じの位置を誤る形もある。読解で確認した（実行はしていない）。(a) `echo "$(function { :; } always case x in x)"; python3 -i; ";; esac)"` (b) `echo "$(function { :; } always { case y in y) echo '"; python3 -i; "';; esac; })"` のどちらでも、zsh は最初の `x)` / `y)` で置換を閉じ、`python3 -i` を実行する。ガードはそれをパターンの `)` として読み、起動を項目本体の引用の中に入れて `;; esac` まで読み、最後の `)` を置換の閉じとする。その結果、無出力になる（SPEC TS-3 と同じ形の見逃し）。変更前は `always` が普通の語で、置換は最初の `)` で閉じ、どの形も拒否していた。SPEC A-5 は関数本体の `}` を区別しない読みを受け入れていたが、変更前の deny が silent に変わる。em-review のコピーも同一。
  suggestion: 匿名関数の本体を閉じた `}` では HEAD_GROUP_CLOSED を立てない。その後の語は zsh と同じく引数（at_command False）として読む。そのためには、各コマンド一覧で開いている `{ }` 群が匿名関数の本体かどうかを持つ必要がある（`saved` と rule 9 の読み直しの記録で戻す）。報告の入力と上の (a)(b) を deny の行として CASES に足し、両方のコピーに流す。既存の `{ :; } always { ... }` の silent の行は保つ。
  reproduction: 'tool_input.command を `zsh -c ''echo "$(function { :; } always case x)"; python3 -i''` とする JSON をフックの標準入力に渡す。変更後は出力が空になり、変更前は permissionDecision: deny を返す。python3 -i を `print -r -- REACHED` に置き換えて zsh 5.9 で実行すると、終了コード 0 で REACHED が出力される。'
  reproduction_alternates: []
