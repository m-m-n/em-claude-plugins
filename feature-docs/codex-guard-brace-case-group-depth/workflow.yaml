schema_version: 1
feature: codex-guard-brace-case-group-depth
created: '2026-10-24'
base_branch: main
goal: |
  # codex-hook-interactive-guard: 波括弧形式の case の項目本体で、区切りを省略した { : } を深さに数えず python3 -i を見逃し、always 群・複数名の function の { を数えず誤って deny する

  Notion: <notion-url>

  ## 現象 (必須)

  feature `codex-guard-escaped-hash-brace-case-heredoc` の review round 2 で出た medium 2 件。

  `codex-hook-interactive-guard.py`（em-workflow / em-review の両コピー）の置換の中の読みで、zsh の波括弧形式の case（`case x { ... }`）の項目本体の `{ }` 群の深さの数え方が zsh の文法と合わない。

  1. 区切りを省略した閉じ波括弧 `{ : }` を深さに数えない（拒否漏れ）
     - 深さはコマンド位置の単独の `}` でしか下がらない。zsh の既定では単独の `}` は引数の位置でも閉じ波括弧になるため、`{ : }` は有効な群になる
     - この読みでは `}` が `:` の引数になって深さが 1 のまま残り、続く `;;` で判定不能になる。後ろの `python3 -i` を検査しない
     - 基底（feature 着手前）も判定不能なので回帰ではない
  2. `always` 群と複数名の関数定義 `function a b { ... }` の `{` を深さに数えない（誤拒否の回帰）
     - `always` は予約語として扱われず、続く `{` が数えられない。その後の `}` で case を早く閉じ、後の項目のパターンの `)` で置換が閉じたと確定する
     - 単引用符の中の文字列にすぎない `python3 -i` を deny する。基底は判定不能（無出力）だった
     - round 1 の medium（stable\_id `2c1d28dc62936d1a`）と同じ欠陥

  ## 再現手順 (必須)

  1. `tool_input.command` に次を設定した PreToolUse(Bash) の JSON をフックの標準入力へ渡す（コマンド自体は実行しない）
  2. `zsh -c 'echo "$(case x { x) { : };; })"; python3 -i'` → 無出力（期待は deny）。`{ : }` を `{ :; }` に変えると deny になる
  3. `zsh -c` の本文を `echo "$(case x { x) { :; } always { :; };; y) echo '"; python3 -i; "';; })"` にする → deny（期待は無出力。`python3 -i` は文字列の中）
  4. 3 と同じ形で `function a b { :; }` を項目本体に書く → 同じく誤って deny

  ## 期待する挙動 (必須)

  - 波括弧形式の case の項目本体で、引数の位置にある単独で引用もエスケープもされていない `}` をコマンド位置の `}` と同じに扱い、再現手順 2 を deny にする
  - `always` 群と複数名の `function` の `{` を深さに数えるか、読めない形では判定不能にして、再現手順 3・4 で誤って deny しない
  - docstring の「a `}` at an argument position」の文を zsh の文法に合わせる

  ## 完了の定義 (必須)

  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある
  - [ ] `tests/test_codex_hook_interactive_guard.py` の `CASES` に再現入力を追加し、両コピーに流す
  - [ ] 両コピーがバイト単位で同一のまま

  ## 該当箇所 (任意)

  - `em-workflow/scripts/codex-hook-interactive-guard.py:2860`〜`:2883`（項目本体の `{ }` 群の深さ）、`:2824`〜`:2834`（`function {` の特例）、`:2901`（最初の語の後の at\_command）
  - `em-review/scripts/codex-hook-interactive-guard.py`（同一内容）
  - 記録: `feature-docs/codex-guard-escaped-hash-brace-case-heredoc/reviews/round2.yaml`（ブランチ `em-workflow/codex-guard-escaped-hash-brace-case-heredoc/integration`）の findings `a20206a8e4ee3391` / `e7001c69deb02603`
  - feature `codex-guard-escaped-hash-brace-case-heredoc` の SPEC の TS-16 / AC-5 は「引数の位置の `}` は本体の普通の語」としており、1 を直すときは扱いを見直す

  ## 実害・発生条件 (任意)

  `$( )` の中の波括弧形式の case の項目本体に、区切りを省略した `{ ... }`、`always` 群、複数名の関数定義を書いた場合だけ。1 は拒否漏れ（fail-open）で無人実行が入力待ちで止まりうる。2 は正当なコマンドの誤拒否。

  ## 追加指示（起動時）

  - 実装完了後、integration ブランチを remote に push し、base_branch へ gh pr create で PR を作成する。integration ブランチはローカル・リモートとも残す（base_branch へ自動マージしない）
  - 不明点は Codex に相談し、比較的良いと判断された選択肢を採用する
  - その議論内容を Notion に記録する
