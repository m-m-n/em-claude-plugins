schema_version: 1
feature: merge-tip-binding
created: '2026-11-03'
base_branch: main
goal: |
  merge スキルで、ロック後の再判定と取り込む先端が事前判定の integration_tip に結び付いていない

  ## 現象 (必須)

  merge スキル（`/em-workflow:merge`）で、integration ブランチの先端の扱いに 2 つの隙間がある。

  1. ロック取得後の再判定（手順 6 の 4、PR ルート）が、事前判定時の `integration_tip` を `merge-pr.py resolve --integration-tip` に渡している。ロック待ちの間に別の走行が base を取り込んで先端を進め、その先端で PR をマージしていると、resolve は none を返し、already_merged ではなく internal_error で終わる。
  2. 手順 2 の preflight が判定した先端（`integration_tip`）と、手順 7・8 で取り込み・検証・マージする先端（worktree の HEAD → `head_sha`）が照合されていない。preflight の後に integration ブランチが進むと、FR4/FR5 の判定を経ていない先端が検証・マージされる。また手順 6.4 の「先端は手順 4 / 5.2 と同じ integration_tip」という記述は、ローカルルートの `merge-git.py merged`（その時点の refs/heads を読む）の挙動と食い違う。

  ## 再現手順 (必須)

  1. 1: `merge-pr.py` の `cmd_resolve` に MERGED・headRefOid=T2 の PR 応答を与え、`--integration-tip T1` で呼ぶと none、`T2` で呼ぶと merged になる
  2. 2: preflight の後、手順 8 の前に integration ブランチへコミットを足すと、その先端が検証・マージされる（照合で止まらない）

  ## 期待する挙動 (必須)

  1. ロック取得後に integration ブランチの現在の先端を読み（検証した 40 桁の小文字 16 進だけを使う）、その値で再判定する
  2. 取り込み前の worktree HEAD が preflight の `integration_tip` と一致することを確かめ、異なれば止める（fail-closed）。手順 6.4 の記述を実際の挙動に合わせる

  ## 完了の定義 (必須)

  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある

  ## 該当箇所 (任意)

  - `em-workflow/skills/merge/SKILL.md:216`（手順 6 の 4）
  - `em-workflow/skills/merge/SKILL.md:279`、`SKILL.md:201`
  - `em-workflow/scripts/merge-git.py:479-484`（integrate）、`merge-git.py:350-359`（merged）
  - 詳細: integration ブランチ `em-workflow/unattended-merge-medium-fixes/integration` の `feature-docs/unattended-merge-medium-fixes/reviews/round1.yaml`（stable_id `08bb31da5c63385d`）と `round2.yaml`（stable_id `bbc1e5a40942e498`）

  ## 実害・発生条件 (任意)

  どちらも、同じ feature を並行して走らせるか、preflight の後に integration ブランチを動かす書き手がいるときだけ起きる。1 はマージ側には倒れない（internal_error で止まる）。2 は fail-closed に反する向きの隙間。
