lessons_candidates:
  - >-
    review round 1 の auto-fix が SPEC 違反を持ち込み、再レビューで spec 観点 2 本が
    独立に検出して revert に至った。batch 既定の "Apply as-is" は prose 指摘に対して
    スコープ外の変更を生みうる — 指摘が「既存欠陥」と述べている場合は auto-fix 候補から
    外す判定があってもよいかもしれない。
  - >-
