schema_version: 1
feature: self-write-exclusivity-window
created: '2026-10-24'
base_branch: main
goal: '# worker-envelope.md R1 の排他の前提の適用区間が、返却後の digest 再計算・self-write 置換・Layer 5 記録を覆っておらず、その間の外部の書き換えが置換で隠される


  種別: バグ

  Notion: <notion-url>


  ## 現象 (必須)


  <code>em-workflow/references/contracts/worker-envelope.md</code> の R1「Order」（246 行付近〜）は、scope verification（layer
  4）の後に現在の状態から digest\_source を再計算し、self-write set のパスを dispatch 時の値に置き換えて比較する。develop SKILL.md、create-plan-phase.md、rework-task-synthesis.md
  は、その後に Layer 5 記録を行う。


  一方、同じファイルの「Exclusivity assumption during dispatch」（376 行付近〜）と create-spec-phase.md の同じ節は、排他の前提を「scope
  snapshot の取得から scope verification の終了まで」に限っている。scope verification の後、再計算の前に別の主体が self-write set のパスを書き換えても検出されず、書き換え後の内容が
  Layer 5 で worker の成果物として記録される。


  ## 再現手順 (必須)


  1. designer を <code>extend_only</code> 付きで dispatch し、tokens.yaml にキーを追加させて戻らせる

  2. scope verification が終わった直後、digest 再計算の前に、別プロセスが tokens.yaml の既存キーを書き換える

  3. tokens.yaml は self-write set に入っているため dispatch 時の値に置き換わり、stale にならない。書き換え後の内容が Layer 5 で記録される


  ## 期待する挙動 (必須)


  scope verification の後に入った外部の書き換えが、self-write の置換で隠されない。


  ## 完了の定義 (必須)


  - [ ] 再現手順で現象が起きない

  - [ ] 再発を検出するテストがある


  ## 該当箇所 (任意)


  - <code>em-workflow/references/contracts/worker-envelope.md:246</code>（R1 Order、Known limit）

  - <code>em-workflow/references/contracts/worker-envelope.md:376</code>（Exclusivity assumption during
  dispatch）

  - <code>em-workflow/references/phases/create-spec-phase.md</code>（Exclusivity の同じ節）


  ## 実害・発生条件 (任意)


  feature worker-self-write-digest の review round 1（comprehensive 観点、medium）で見つかった。狭い区間で worktree に直接書き込む他のプロセスが要るため、起きやすさは低い。修正案は、排他の前提の適用区間を
  digest 再計算・置換・Layer 5 記録の終了まで延ばすか、置換するパスについて post-dispatch スナップショットと Layer 5 記録内容の一致を確かめる手順を R1 に足すこと。

  '
