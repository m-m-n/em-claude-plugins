  title: rework の再確認が step 3 のパッチ適用（workflow.yaml の書き込みとコミット）の後に置かれており、stale になっても適用済みの変更が残る
  description: §10 の追加文は『Step 3 validates and applies the patch ...』の後に『The orchestrator
    then runs the return-time recheck before the recording phase-state write』と置いている。workflow-patch.md
    の適用規則 15 は workflow.yaml への 1 回の Write、規則 16 は R2 のコミット列なので、再確認が走る時点では新しい rework
    タスクと implement: pending がもう integration ブランチにコミットされている。stale のときは create-spec-phase.md
    の Stale handling に従うが、これは出力を捨てて `reset --hard em-workflow/{feature}/integration`
    を行うだけで、ブランチの先端は適用済みのコミットを含んだままになる。そのため、stale として捨てたはずの結果がワークフローに残る。worker-envelope.md
    R1 の再確認が守るのは記録の phase-state 書き込みだけで、rework の場合はそれより前に、結果に効く書き込みが起きている。
  suggestion: §10 で、再確認を step 3 の検証（適用規則 1〜14）の後、規則 15 の workflow.yaml 書き込みより前に置く。または、step
    3 の書き込みとコミットは再確認が通った後にだけ行うと明記する。test_recheck_dispatch_sites_docs.py の順序の probe
    もそれに合わせる。create-plan-phase.md §8 にも同じ構造（パッチを適用してから再確認する）がないか確かめる。
