summary: R1 の Order（worker-envelope.md:252-263）は、scope verification（layer 4）の後に digest_source の再計算、self-write
  の置換、比較を行う。各 dispatch 箇所（develop SKILL.md の design step 5、create-plan-phase.md の §8、rework-task-synthesis.md
  の §10）は、その後に Layer 5 記録と self_write_set の記録を同じ phase-state 書き込みで行う。一方、排他の前提の適用区間は scope verification
  の終了で切れている（worker-envelope.md:389-392、create-spec-phase.md:545-548）。修正の方向は 2 案あり、入力からは 1 つに決められない。
confirmed_facts:
- fact_id: F1
  statement: worker-envelope.md の『Exclusivity assumption during dispatch』では、適用区間は『the start of the dispatch's
    scope snapshot capture through the end of that dispatch's scope verification』になっている。
  source: em-workflow/references/contracts/worker-envelope.md:389-392
- fact_id: F2
  statement: create-spec-phase.md の『Scope of applicability』では、適用区間は『from taking the scope snapshot through
    the end of verification』になっている。
  source: em-workflow/references/phases/create-spec-phase.md:545-548
- fact_id: F3
  statement: R1 の Order は 4 段で、scope verification が observed change set を出した後に、再計算、self-write スクリプト、比較の順に進む。
  source: em-workflow/references/contracts/worker-envelope.md:252-263
- fact_id: F4
  statement: 3 つの dispatch 箇所は、どれも比較で stale にならなかった後に Layer 5 記録と self_write_set の記録を行う。
  source: em-workflow/skills/develop/SKILL.md:770-788; em-workflow/references/phases/create-plan-phase.md:258-273;
    em-workflow/references/rework-task-synthesis.md:233-247
- fact_id: F5
  statement: artifact-digest.md の Layer 5 recording の『When』は『after layer 4 (scope verification) passes』と書いており、比較の後とは書いていない。
  source: em-workflow/references/artifact-digest.md:123-124
- fact_id: F6
  statement: scope verification は、変更された候補パスの新しい blob id を git hash-object で求める。一方、Layer 5 と digest_inputs
    は raw-byte の sha256 を使う（artifact-digest.md の Calculation）。
  source: em-workflow/references/phases/create-spec-phase.md:640-658; em-workflow/references/phases/create-spec-phase.md:630-633
- fact_id: F7
  statement: Known limit は、scope verification より前に worker と別の主体が同じパスを書く場合を排他の前提に委ねている。この部分は今回の不具合とは別に残る。
  source: em-workflow/references/contracts/worker-envelope.md:279-282
