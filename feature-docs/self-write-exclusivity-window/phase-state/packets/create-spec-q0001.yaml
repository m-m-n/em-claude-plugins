questions:
- question_id: requirement.fix-approach
  gate_id: create-spec.requirement-clarification
  category: technical-requirement
  priority: high
  blocking: true
  header: 修正方針
  prompt: scope verification の後に入った外部の書き換えを、どう扱う？
  answer_mode: single_select
  options:
  - option_id: detect_and_extend
    label: 検出を足し、区間も延ばす
    description: R1 の Order に手順を 1 つ足す。オーケストレーターは Layer 5 の Calculation の後、self-write set の各パスの現在の内容（git
      hash-object の blob id）が、scope verification で観測した内容と一致するかを確かめる。不一致なら stale にする。あわせて、排他の前提の適用区間を Layer
      5 記録（self_write_set を記録する phase-state 書き込み）の終了まで延ばし、確認の後に残るわずかな窓を覆う。再現手順の書き換えは stale として検出される。
    recommended: true
  - option_id: detect_only
    label: 検出だけを足す
    description: R1 に上と同じ確認の手順を足す。排他の前提の適用区間は scope verification の終了までのまま変えない。確認の後から Layer 5 記録までの窓は、どの規則にも覆われないまま残る。
    recommended: false
  - option_id: extend_interval_only
    label: 区間だけを延ばす
    description: worker-envelope.md と create-spec-phase.md の適用区間を、再計算・置換・比較・Layer 5 記録の終了まで延ばす。機構は足さない。再現手順の書き換えは前提違反として扱われ、置換で隠れたまま記録される（Known
      limit と同じ扱い）。
    recommended: false
  why_needed: 期待する挙動は『置換で隠されない』こと、完了の定義は『再現手順で現象が起きない』ことになっている。区間を延ばすだけだと、再現手順の書き換えは前提違反と宣言されるだけで、実際には隠れたまま
    Layer 5 に記録される。一方で、scope verification より前の同種の競合は、既存の設計（Known limit）が前提に委ねている。どちらに寄せるかは入力から決められない。
  evidence:
  - path: em-workflow/references/contracts/worker-envelope.md
    line: 389
    detail: 適用区間が scope verification の終了で切れている
  - path: em-workflow/references/contracts/worker-envelope.md
    line: 252
    detail: 'R1 Order: 再計算は scope verification の後'
  - path: em-workflow/references/contracts/worker-envelope.md
    line: 279
    detail: Known limit は排他の前提に委ねている
  - path: em-workflow/references/phases/create-spec-phase.md
    line: 545
    detail: 同じ区間を言い換えて書いている
