schema_version: 1
feature: cd-prefix-toplevel-operators
created: '2026-10-28'
base_branch: main
goal: '# bash_guard.py の cd 前置形の許可で、承認文字列のトップレベルに & / ; / || があると後続が元の cwd で動く


  種別: バグ


  ## 現象

  bash_guard.py の cd 前置形の許可（`cd "<worktree>" && <承認済みコマンド>`）で、承認文字列のトップレベルに `&` / `;` / `||` があると、後続のコマンドが cd 先ではなく元の cwd（通常はメイン作業ツリー）で動く。

  - `&&` は `&` / `;` より強く結びつくため、`cd "P" && A & B` では B が元の cwd で動く

  - `;` や `||` を含む承認文字列では、cd が失敗したときに後続が元の cwd で動く

  実装は SPEC の FR1 のとおりで、SPEC の設計の漏れから来ている。


  ## 再現手順

  1. トップレベルに `&` を含むコマンド `A & B` を承認済みにする

  2. implementer が `cd "<worktree>" && A & B` を実行する

  3. bash_guard.py は allow するが、B は元の cwd で動く


  ## 期待する挙動

  次のどちらかにする。フック・文書・試験を同じ変更で合わせる。

  - 承認文字列全体が cd 先で動く実行形にする

  - トップレベルに `&` / `;` / `||` を含む承認文字列は cd 前置形の対象外とし、そう手順書に書く


  ## 完了の定義

  - 再現手順で現象が起きない

  - 再発を検出するテストがある


  ## 該当箇所

  - em-workflow/hooks/bash_guard.py（is_cd_prefixed_approved 付近）

  - em-workflow/references/command-execution-protocol.md の cd 前置形の例外


  ## 実害・発生条件

  - feature implementer-cd-verbatim-conflict の review round 1 で未解決になった medium（stable_id b3582a48847b9e2f、comprehensive、confidence 80）

  '
