    freeform: null
    normalized_answer: '引用と転送を区別する。単一引用・二重引用・バックスラッシュエスケープの中の文字は数えない（単一引用内のバックスラッシュは通常文字、二重引用内のエスケープは
      Bash の規則に従う）。&&、|&、>&、<&、&>、&>> の一部の & は数えない（引用外で最長一致で認識）。それ以外の単独の &、;、||、改行は除外する。安全側の追加条件:
      閉じていない引用・末尾のバックスラッシュ・文字列内部の改行、$'' と $" と #（位置を問わず）、引用外の括弧・波括弧、$(...)・${...}・バッククォート、二重引用内の置換構文があれば除外する（入れ子は解析しない）。'
    resolution_note: 'gate: create-spec.requirement-clarification; policy: codex_consultation,
      record_as_assumption; codex_consulted: true (2 turns)。turn 1 で Codex は any_occurrence
      を推したが、turn 2 で「implementer は cd 前置形でしか承認コマンドを実行できず、any_occurrence では 2>&1 を含む承認コマンドが無人実行で動かなくなる」点を検討し
      quote_and_redirect_aware に収束。安全側の追加条件を採用'
