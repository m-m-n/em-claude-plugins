schema_version: 1
feature: codex-guard-subst-reading-regressions
created: '2026-10-21'
base_branch: main
goal: |
  # codex-hook-interactive-guard: $( ) の読み取りが for の語一覧のコメント・空括弧内の行継続・シェル固有の coproc/repeat を取り違える

  Notion: <notion-url>


  ## 現象 (必須)

  feature `codex-guard-case-reading-fixes`（`$( )` の中の case 文の読み取りの修正）で、`codex-hook-interactive-guard.py`（em-workflow / em-review の両コピー）の `_skip_substitution` がコマンドの位置を状態として追跡するようになった。review round 2 で、その読み取りに次の 3 種類の後退が見つかった（いずれも medium、deferred）。どれも基準コミットでは deny だった入力が、置換の読み違いで判定不能（`_Undecidable`）になり、後ろの `python3 -i` を拒否しない（拒否漏れ）。

  1. zsh の `for name (words)` の語一覧を、算術展開と同じ `a` のコンテキストとして積んでいる。`a` ではコメントを読み飛ばさないため、語一覧のコメントにある引用符が引用を開く（stable\_id `90560b3ee3ad0908`）。
  2. `_empty_parens_end` が空白とタブしか読み飛ばさず、`f(` と `)` の間のバックスラッシュと改行の対を扱わない。関数の頭を認識できず、本体の `case` を引数として読み、パターンの `)` で置換を早く閉じる（stable\_id `3ccce2e39b35b26b`。comprehensive と security の両方が報告）。
  3. FR11 の coproc の規則（`coproc WORD` の後の語をコマンドの位置にする）は bash の文法で、zsh の coproc は名前を取らない。また `repeat` は zsh だけの予約語。読み取りがシェルの種類を区別しないため、zsh の `coproc echo case x in x` や bash の `repeat x case y in y` で `case` を文の始まりと読み違える（stable\_id `4d83e42f2dca1178` / `d86a2ee0791fc83d`）。

  ## 再現手順 (必須)

  1. `tool_input.command` に次を設定した PreToolUse(Bash) の JSON をフックの標準入力へ渡す（コマンド自体は実行しない）
  2. 欠陥 1: `echo "$(for x (a # "` + 改行 + `) { :; })"; python3 -i` → 無出力になる（期待は deny）
  3. 欠陥 2: 内側の文字列 `echo "$(f(\` + 改行 + `) { case x in x) printf '%s' '"';; esac; }; f)"; python3 -i` を `bash -c ` + shlex.quote で包んだもの → 無出力になる（期待は deny）
  4. 欠陥 3: `zsh -c 'echo "$(coproc echo case x in x)"; python3 -i'` → 無出力になる（期待は deny）

  ## 期待する挙動 (必須)

  - 語一覧では語をコマンドの位置で読まない点だけを保ち、`#` のコメントと改行は `p` のコンテキストと同じに読む
  - `_empty_parens_end` は空白とタブに加えて、バックスラッシュと改行の対も読み飛ばす
  - coproc の NAME と repeat の予約語を、呼び出し元のシェル（`bash -c` / `zsh -c`）に合わせて扱う。シェルが分からない場合の扱いは SPEC（FR11）で決める（TS47 / TS50 の期待値と衝突しない形）
  - 読み取りの線形性（NFR1）を保つ

  ## 完了の定義 (必須)

  - [ ] 再現手順で現象が起きない
  - [ ] 再発を検出するテストがある
  - [ ] `tests/test_codex_hook_interactive_guard.py` の `CASES` に上の入力を追加し、両コピーに流す
  - [ ] 両コピーがバイト単位で同一のまま

  ## 該当箇所 (任意)

  - `em-review/scripts/codex-hook-interactive-guard.py:2389`（for の語一覧を `a` で積む箇所）
  - `em-review/scripts/codex-hook-interactive-guard.py:2476`（`_empty_parens_end`）
  - `em-review/scripts/codex-hook-interactive-guard.py:2225`（HEAD\_COPROC の後の扱い）
  - `em-workflow/scripts/codex-hook-interactive-guard.py`（同一内容）
  - 記録: `feature-docs/codex-guard-case-reading-fixes/reviews/round2.yaml`（ブランチ `em-workflow/codex-guard-case-reading-fixes/integration`）

  ## 実害・発生条件 (任意)

  `$( )` の中に、コメントを含む zsh の for の語一覧、括弧の間に行継続を挟んだ関数定義、zsh の coproc の後の引数や bash の `repeat` のいずれかを書いた場合だけ。いずれも拒否漏れ（fail-open）で、無人実行が入力待ちで止まりうる。
