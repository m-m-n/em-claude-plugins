    normalized_answer: シェルが分からない文字列は今の読み方（bash の coproc NAME の規則と zsh の repeat の規則の両方）で読み、判定不能（_Undecidable）になったときだけ、どちらの規則も使わない読み方で 1 回だけ読み直し、最後まで読めたときだけその結果を採用する。読み直しも失敗したら初回の例外と確定済みのコマンドを保つ。読み直しは parse
      の中で扱い、find_deny(command) の引数と _scan の中で parse を囲む 1 つの try を保つ
    resolution_note: 'batch policy create-spec.requirement-clarification codex_consultation（harness codex、1 turn）。Codex は reparse-fallback を推奨。両コピーで最上位の echo "$(coproc echo case x in x)"; python3 -i が silent、TS47/TS50
      が deny であることを実行で確認。union は確認済みの拒否漏れを残し、brace-only は今は正しく読める { 以外の形（coproc c while … / repeat N do … done）に読み違いを持ち込む。reparse-fallback は影響を初回が判定不能になる入力に限り、最大 2 回の読み取りでも線形を保つ。オーケストレーターが写像を判断し reparse-fallback
      を採用（worker 推奨 brace-only とは異なる）。Opus エスカレーションは不要。不採用: union, brace-only'
