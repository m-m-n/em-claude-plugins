  file: em-review/scripts/codex-hook-interactive-guard.py
  line: 2539
  title: 'zsh の for 語一覧の中の glob 修飾子 *(#qN) の # をコメントと読み、後ろの python3 -i を見逃す'
  description: '語一覧の中で開いた入れ子の w の entry（glob 修飾子）でも、2539 行の条件は直前が `(` の `#` をコメントの始まりと読む。`*(#qN)` の `#` は語の途中にあり、zsh ではコメントにならない。後ろに改行がなければ `_Undecidable` になる。zsh 種別の文字列は読み直さないので、置換の後ろの `python3 -i` は判定されない。基準コミットは語一覧を算術の文脈 a で読んでいて、`#` はただの文字だったので deny だった。読み取りで確認した: `zsh -c ''setopt extendedglob; echo "$(for x (*(#qN)) { :; })"; python3 -i''` は基準コミットで deny、変更後は None。最上位（種別不明）の同じ形でも、読み直しが同じ箇所で失敗するので None になる。em-workflow のコピーはバイト単位で同一なので、同じ挙動になる。p の文脈の `$(ls *(#qN))` は変更前から同じように読み違える。そちらは今回の差分の範囲外。'
  suggestion: 語一覧の中で開いた入れ子の `(` の entry（stack[-2] が w のもの）では、直前が `(` の `#` を語の文字として読む。コメントは一番外の語一覧の entry でだけ始まるようにする（TS8 の `for x (# c<NL>a)` の読み方は変えない）。CASES に `echo "$(for x (*(#qN)) { :; })"; python3 -i` と、その zsh -c 版を deny の行として足す。2つのコピーは同時に直す。
