  title: "二段目以降の parse で出る ValueError が走査全体を止め、後続の起動まで通してしまう"
  description: "_scan が二段目以降の文字列も parse するようになったため、_Parser._redirection（694 行目）の int(\"\".join(self.buf)) が、4300 桁を超える数字だけのファイル記述子で ValueError を出す経路に二段目以降から届くようになった。_scan が parse(inner) で捕まえるのは _Undecidable だけ（1040 行目）なので、ValueError は find_deny を抜け、main の except Exception: return が無出力で返す。その結果、後続の 0 段目の python3 -i も判定されない。docstring 手順 7 とも食い違う。変更前は二段目を parse しなかったので deny だった。0 段目・一段目では変更前から同じ ValueError が起きる。2 つのコピーは同一なので em-review 側も同じ。"
  suggestion: "_redirection で数字列を int に変換せず、fd が 0 かどうかを文字列で判定する。防御として _scan の parse(inner) で起きた想定外の例外も読み飛ばしにする。CASES に deny ケースを足し、2 つのコピーを同一に保つ。"
  reproduction: "cmd = ': ' + '9' * 5000 + '>/dev/null' を作り、cmd = 'bash -c ' + json.dumps(cmd) を2回実行して、cmd += '; python3 -i' を追加する。この cmd を tool_input.command に設定したJSONを各ガードの main に渡すと、標準出力が空になる。"
  reproduction_alternates: []
  reproduction_overflow: false
