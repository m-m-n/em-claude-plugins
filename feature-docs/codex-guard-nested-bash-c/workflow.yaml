base_branch: main
goal: '# codex-hook-interactive-guard: 二段目以降の bash -c の文字列を判定対象にするか決める


  Notion: <notion-url>


  ## やりたいこと (必須)

  `codex-hook-interactive-guard.py`（em-workflow / em-review の両コピー）で、二段目以降の `bash -c`
  の文字列も判定対象にするかを決め、対象にするなら実装する。

  ## 背景・なぜ (必須)

  `_scan` は `depth == 0` の `-c` 文字列しか解析しない。そのため `bash -c ''bash -O extglob -c "time
  /bin/true?()` + 改行 + `(python3 -i)"''` のような二重の `bash -c` の内側にある対話起動を検出しない（拒否を出さず、無人実行が対話プロセスで止まる経路が残る）。extglob
  に限らず `bash -c "bash -c ''python3 -i''"` でも同じ。

  この範囲の限界はガード導入時からあり、既存の `CASES`（「第 2 段の bash -c は評価しない」）が silent として固定している。feature
  `codex-guard-extglob-funcname` の review round 1 で確認し、同 feature の `THREAT-MODEL.md`
  の TM-1 に残存リスクとして記載した。

  ## 受け入れ条件 / 完了の定義 (必須)

  - [ ] 二段目以降の `bash -c` を判定対象にするかを決め、決定と理由を残す

  - [ ] 対象にする場合、二重以上の `bash -c` の内側の対話起動を deny するケースを `tests/test_codex_hook_interactive_guard.py`
  の `CASES` に足す

  - [ ] 既存の silent ケースの期待を変える場合は、その理由を SPEC に書く

  - [ ] 両コピーがバイト単位で同一のまま

  ## スコープ外 (任意)

  \<今回やらないこと。あれば\>

  ## 制約・前提 (任意)

  - 該当箇所: `em-workflow/scripts/codex-hook-interactive-guard.py:973`（`_scan`）、`em-review/scripts/codex-hook-interactive-guard.py`（同一内容）

  - 記録: ブランチ `em-workflow/codex-guard-extglob-funcname/integration` の `feature-docs/codex-guard-extglob-funcname/reviews/round1.yaml`


  ## 追加指示（起動時）

  - 実装完了後、integration ブランチを remote に push し、base_branch に対して gh pr create で PR を作る。integration
  ブランチはローカル・リモート両方に残す（base_branch へ自動マージしない）

  - 不明点は Codex に相談し、比較的良いと判断した選択肢を採用する

  - その議論内容を Notion に記録する

  '
