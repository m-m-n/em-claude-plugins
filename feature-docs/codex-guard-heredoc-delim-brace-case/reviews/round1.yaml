- stable_id: 8704f40d2d534c76
  severity: medium
  category: security
  file: em-workflow/scripts/codex-hook-interactive-guard.py
  line: 1897
  title: "区切り語の ${ } の中の $( ) にある << で判定不能になり、終端行の後の起動を見逃す"
  description: "今回の変更で、区切り語の `${ ... }` の範囲にある引用されていない `$(` は、`_remove_range_quotes`（1897-1903 行）から `_read_quoted_unit` を経て `_skip_substitution` に渡るようになった。`_skip_substitution` はコマンドリストの中で `<<` を見ると `_Undecidable(\"heredoc in a substitution\")` を投げる（2474-2475 行）。この例外は parse まで伝わり、checkpoint の規則で区切り語の行より後の `python3 -i` が判定されないため、出力なしになる。変更前は `_skip_parens`（`_scan_parens`）が括弧を数えるだけで `<<` を読まずに `$( ... )` を閉じていた。そのため `${v:-$(echo <<EOF)}` が区切り語に登録され、次の行で本文が閉じて deny が返っていた。em-review のコピーはバイト単位で同一なので、同じく該当する。"
  suggestion: "置換の中のヒアドキュメントを zsh がどう読むかを先に確かめる。そのうえで、`<<` があっても区切り語の終わりを zsh と同じ位置に置けるよう、共有スキップの読みを決める。変更前に deny だったこの入力を、両コピーに流す回帰の行として CASES に加える。"
  reproduction: "フックの標準入力に次の JSON を渡す: {\"tool_input\":{\"command\":\"zsh -c 'if false; then\\n: <<${v:-$(echo <<EOF)}\\n${v:-$(echo <<EOF)}\\nfi\\npython3 -i'\"}}。入力は _remove_range_quotes → _read_quoted_unit → _skip_substitution に到達し、変更後は標準出力が空になる。基準コミットでは permissionDecision: deny が返る。"
  reproduction_alternates: []
  reproduction_overflow: false
  sources: ["codex:security"]
  confidence: 85
  resolution: deferred
  resolution_reason: 'medium severity: outside the Phase R4 auto-fix gate and the residual critical/high completion gate; carried to a follow-up task'
