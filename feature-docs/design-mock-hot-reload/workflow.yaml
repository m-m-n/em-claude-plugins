schema_version: 1
feature: design-mock-hot-reload
created: '2026-11-14'
base_branch: main
goal: '# em-workflow の design スキルで、モックをホットリロードで確認しながら直せるようにする


  ## やりたいこと

  `/em-workflow:design` で、ブラウザでモックを確認 → チャットで指示 → 修正がホットリロードで即反映、の流れを回せるようにする。あわせて、モックの表示状態を
  URL で切り替えられるようにする。


  ## 背景・なぜ

  現状の Step 4（合意ループ）は「モックはブラウザで開いてもらう」とだけ書かれており、修正のたびにユーザーが手で開き直す必要がある。また SPEC の状態（空・エラー等）を確認するための切り替え手段が決まっていない。


  ## 受け入れ条件 / 完了の定義

  - `em-workflow/skills/design/SKILL.md` の合意ループに、モックを配信するローカルの開発用サーバー（例: `bun ./<mock>.html`）を起動し、URL
  をユーザーに案内する手順がある

  - サーバーは `run_in_background` で起動し、締め（Step 6）で `TaskStop` で止める手順になっている

  - モックを書き換えるとブラウザ側が自動で更新される

  - モックの表示状態を URL のクエリ（例: `?state=error`）で切り替えられることが、`em-workflow/agents/designer.md`
  のモック規律に入っている

  - モック規律（1 ファイルで完結・トークンの CSS 変数を使う・SPEC の状態を網羅）を崩していない

  - 開発用サーバーのコマンドが無い環境での扱いが決まっている


  ## スコープ外

  WebMCP への対応（モックが LLM 向けの道具を公開する）。使う側の対応が固まってから検討する。


  ## 制約・前提

  - プロセスを止めるシグナル送出コマンドを使わない。停止は `TaskStop` のみ

  - version は触らない（Actions が上げる）

  '
