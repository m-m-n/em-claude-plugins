# em-workflow batch policy SSOT.
#
# Scope: the jurisdiction split is by whether a gate carries a `gate_id`
# (references/question-packet-schema.md), never by who presents it. This
# file covers every gate that carries a `gate_id` — whether a worker
# returned it inside a `status: needs_user_input` question packet, or the
# orchestrator raised the question directly outside of any packet (e.g. the
# `{phase}.artifact-overwrite` family, raised per
# references/contracts/spec-writer-contract.md, "How the orchestrator
# chooses each target's action before dispatch"). Batch decisions for a
# gate that carries NO `gate_id` at all — git-setup failure, feature
# selection, the review diff-size gate, the command-approval hook fallback,
# and the six orchestrator-opened gates with no identifier at their
# originating site (implement.failed-task, review.auto-fix-conflict,
# review.auto-fix-judgment, review.residual-critical-high, verify.failed,
# develop.completion) — stay in `references/batch-mode.md`'s Non-packet
# gates table. They have no `gate_id` to key off, so there is nothing here
# to look up for them.
#
# `rework.spec-change` is intentionally NOT listed below, even though it
# does carry a `gate_id`. An unlisted `gate_id` falls through to the
# unlisted-gate fallback in `references/question-resolution.md`, whose
# fail-closed classification aborts a specification-change gate rather than
# guessing an answer for it.
#
# `preserve_and_reuse` (used by every `*.artifact-overwrite` gate — all
# three phases now live here as one source of truth:
# `create-spec.artifact-overwrite`, `design.artifact-overwrite` and
# `create-plan.artifact-overwrite`): on a digest mismatch against an
# existing artifact, re-dispatch the worker with that target's write_policy
# action set to `preserve` (the worker reads the existing file, it does not
# rewrite it) and let the worker continue from it. If the existing artifact
# fails the worker's postconditions, the worker reports `blocked` and the
# phase aborts. So `preserve_and_reuse` means "treat the existing artifact
# as authoritative" — it can end in either a successful continuation or an
# abort, never a silent overwrite.
#
# `on_unavailable: abort`: abort the phase when the packet does not
# actually offer the option this policy names (e.g. the worker never listed
# `preserve_and_reuse` among its options) — never fall back to a different
# option by guessing.
#
# See references/gate-option-vocabulary.md for the correspondence rule
# between a select gate's option_id below and the option_ids its issuing
# site offers, the canonical declaration format an issuing site uses to
# offer them, and the registry of gates that rule cannot be checked
# against mechanically.

gate_policies:
  create-spec.feature-identity:
    action: select
    option_id: derive_from_task_description
  create-spec.requirement-clarification:
    action: codex_consultation
    record_as_assumption: true
    unresolved: record_tbd
  create-spec.design-step:
    action: select
    option_id: decide_autonomously
  create-spec.design-system:
    action: select
    option_id: top_candidate_or_none    # candidate present -> project_native, none -> none
  design-system.reclassify:
    action: select
    option_id: em_workflow              # token exists, so "none" would be wrong
  create-spec.artifact-overwrite:
    action: select
    option_id: preserve_and_reuse
    on_unavailable: abort
  design.artifact-overwrite:
    action: select
    option_id: preserve_and_reuse
    on_unavailable: abort
  create-plan.artifact-overwrite:
    action: select
    option_id: preserve_and_reuse
    on_unavailable: abort
  create-spec.command-approval:
    action: auto_record
    refusal_patterns: hard_fail
  create-spec.stalled:
    action: select
    option_id: record_tbd
  create-plan.tbd-resolution:
    action: select
    option_id: assume
  create-plan.license-conflict:
    action: select
    option_id: compatible_alternative
    on_unavailable: abort
  create-plan.existing-files:
    action: select
    option_id: merge
