# tier-rules.yaml - Tier decision rules (em-workflow SSOT, FR1)
#
# The single place holding the Jev question set, the three threshold rows,
# the Codex pre-survey output schema, and the availability fallback matrix.
# Consumed by scripts/decide-tier.py, a deterministic evaluator that performs
# no model inference (NFR1) and no invocation of its own (the orchestrator
# collects the observations; this file and its evaluator only decide).
#
# This file references two external skills by path and reproduces no
# sentence from either (NFR5):
#   - ~/.claude/skills/jev       question wording + Jev invocation contract
#   - typesafe:typesafe-ai      model-behaviour guidance behind Jev
#
# Scope: this file answers ONLY "which tier". What each tier removes from a
# run is owned by skills/develop/SKILL.md, not here (IMPLEMENTATION.md D4).
# The persisted decision record's shape belongs to task0003, not this file.

# -----------------------------------------------------------------------
# 1. question_set - what is sent to the external judgement skill, plus
#    the four bucket descriptions (keys "0" to "3") passed to both Jev
#    calls: the description-only call and the final call. The bucket
#    descriptions are defined here, in this file; no external skill is
#    assigned ownership of that wording.
# -----------------------------------------------------------------------
question_set:
  skill: "~/.claude/skills/jev"
  invocation_flags: ["--json-input", "--json-output"]
  question_design_reference: "typesafe:typesafe-ai"
  bucket_descriptions:
    "0": >-
      Only a wording or rule-text change: no new logic, and no test
      change.
    "1": >-
      A rule addition combined with a test addition, or a small change
      spread across a few files together with a small test change.
    "2": >-
      New logic, a change reaching across several modules, or a change
      to an external contract.
    "3": >-
      A broad cross-cutting change: new files, new modules, a new
      dependency, or a change to the architecture.

# -----------------------------------------------------------------------
# 2. threshold_rows - evaluated in this fixed order; the first match wins.
#    Inputs come ONLY from the Jev score object's `probabilities` map
#    (bucket index -> probability) and its `expectation_clear` member. The
#    `confidence` member alone is never expressed as a threshold anywhere
#    in this file or in scripts/decide-tier.py (AC-4).
#
#    scripts/decide-tier.py reads each row by the threshold members it
#    declares (p0_floor, expectation_clear_floor, bucket_sum_floor), never
#    by its `id`. A row declaring no threshold member at all is the only
#    unconditional fallthrough; a row declaring at least one member always
#    has its comparisons evaluated, including a row whose `id` the
#    evaluator does not otherwise recognize. Every floor compared against
#    is read from the row itself -- the evaluator carries no numeric
#    default for any of them, so a renamed or removed member makes the row
#    not match rather than reverting to a stale literal.
# -----------------------------------------------------------------------
threshold_rows:
  - id: minimal
    order: 1
    tier: minimal
    p0_floor: 0.80
    expectation_clear_floor: 0.5
    description: >-
      P(0) at or above 0.80 AND expectation_clear at or above 0.5 -> the
      tier that removes the most.
  - id: reduced
    order: 2
    tier: reduced
    p0_floor: 0.40
    bucket_sum_floor: 0.85
    description: >-
      P(0) at or above 0.40 AND P(0)+P(1) at or above 0.85 -> the middle
      tier. The P(0) floor keeps a low first bucket carried by a high
      second bucket out of this tier.
  - id: full
    order: 3
    tier: full
    description: >-
      Otherwise -> the tier that removes nothing. Also reached when a row
      above needed a member that was absent from the input: the row does
      not match and evaluation falls through here (fail-safe, never
      fail-open).

# -----------------------------------------------------------------------
# 3. codex_output_schema - the Codex pre-survey's invocation route and
#    output contract. Codex reports observed facts only; it makes no
#    size judgment and no tier judgment of its own.
# -----------------------------------------------------------------------
codex_output_schema:
  role: >-
    Codex reports facts about the change under review; it makes no size
    judgment and no tier judgment.
  invocation:
    route: "em-workflow/scripts/run_codex_exec.sh readonly"
    forbidden: >-
      the raw `codex exec` subcommand is never invoked directly for this
      pre-survey -- always through run_codex_exec.sh
  fields:
    - files_expected
    - changed_lines_approx
    - new_functions_needed
    - new_files_needed
    - new_dependencies_needed
    - covering_tests_exist
    - spillover_modules
    - work_still_required
  fact_fields:
    test_change_kind:
      description: >-
        Whether the test change only extends existing checks with more
        cases one-to-one, or writes tests for new behavior.
      values: ["none", "extend_existing_one_to_one", "new_behavior_tests"]
    added_test_cases_approx:
      description: Approximate count of test cases the change adds.
      type: integer
      minimum: 0
    body_change_kind:
      description: >-
        Whether the body change is wording or a rule addition, or new
        logic.
      values: ["wording_or_rule_addition", "new_logic"]
    change_containment:
      description: How far the change reaches across the codebase.
      values: ["single_function", "single_module", "multiple_modules"]
    caller_and_dependency_count:
      description: >-
        Count of callers of, and dependencies of, the changed places.
      type: integer
      minimum: 0
    changes_external_contract:
      description: >-
        Whether an external contract -- arguments, return values, file
        formats, configuration keys and similar -- changes.
      type: boolean
    changes_behavior:
      description: Whether observable behavior changes.
      type: boolean

# -----------------------------------------------------------------------
# 4. fallback_matrix - tool availability degrades the decision, it never
#    crashes it (fail-safe, never fail-open). Any non-zero Jev exit status
#    counts as "judgement skill unusable" with no per-status distinction.
# -----------------------------------------------------------------------
fallback_matrix:
  - id: both_usable
    jev_usable: true
    codex_usable: true
    decision_basis: description_plus_code
    action: evaluate_threshold_rows
  - id: jev_only_usable
    jev_usable: true
    codex_usable: false
    decision_basis: description_only
    action: evaluate_threshold_rows
    note: >-
      if the description-only reading and the description-plus-code
      reading disagree, scripts/decide-tier.py resolves to the tier that
      removes nothing (full) -- enforced by the evaluator's two-reading
      input contract, not merely documented here
  - id: jev_unusable
    jev_usable: false
    codex_usable: any
    decision_basis: unavailable
    action: full
    reason: judgement skill unusable, regardless of Codex availability

# Every documented Jev exit status, and whether it counts as usable. Any
# status not listed here is still non-zero and therefore unusable -- this
# table documents the known codes, it does not exhaustively enumerate them.
jev_exit_codes:
  0: usable
  1: unusable
  2: unusable   # HTTP 401
  75: unusable  # HTTP 429 or HTTP 529
