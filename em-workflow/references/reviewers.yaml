# reviewers.yaml - Primary-reviewer registry (em-workflow SSOT)
#
# em-workflow dispatches ONE non-Claude reviewer per SELECTED perspective as
# that perspective's primary (main) review, and injects the perspective as a
# skill:
#   - codex   → em-workflow:codex-reviewer (Codex CLI via the wrapper script;
#               the model is Codex's own recommended default)
#   - litellm → vertex-review:vertex-reviewer (`codex exec -p litellm -m
#               <model>`; an independently-installed plugin that fronts
#               Vertex AI MaaS and Meta Muse behind one LiteLLM proxy)
#
# Responsibility split: the harness plugin owns WHICH MODELS EXIST and how to
# reach them; this registry owns WHICH MODEL EACH PERSPECTIVE GETS. The
# `model` value below is handed to the reviewer verbatim — the reviewer never
# picks one on its own. Valid litellm model names are defined by the
# vertex-review plugin's `litellm-harness` skill; of those, this registry
# assigns exactly one:
#   muse-spark
#
# The review phase reads this file to drive fan-out: for each SELECTED
# perspective (per review-rules.yaml + discretion), it dispatches exactly ONE
# reviewer, taken from the front of that perspective's `primary_chain`. See
# references/review-phase.md for the Claude-reviewer fallback used when no
# chain entry is available, and for the retryable chain walk a skip can
# trigger — neither rule is restated here.
#
# requires_spec: perspective only runs when a SPEC.md is available.
# primary_chain: ordered, non-empty list of {harness, model?} entries -- every
#   perspective must have one, since a perspective without a chain has no
#   primary reviewer at all.
#   Every chain holds the same two entries — codex and muse-spark — and
#   differs only in which one leads. security, comprehensive and license
#   lead with codex; performance, spec and architecture lead with
#   muse-spark. The trailing entry is always the other harness, so a
#   LiteLLM budget wipeout or a Codex rate-limit streak leaves every
#   perspective with a reachable primary reviewer.
#
# Contributor-tier pre-dispatch criteria (muse-spark read-mapping): when
# `muse-spark` is the chain entry the registry selected, reading it as the
# contributor tier is permitted only after two checks both pass: consent
# for this project is recorded — mechanical, decided by the consent store,
# not by prose — and this particular dispatch may use it — a per-dispatch
# judgment made by the dispatching LLM. The chain itself is never edited to
# reach the contributor tier; the registry defines exactly one permitted
# reading and no other.
#
# Per-dispatch: do not use
#   - A change whose core is an unpublished idea: a new feature whose
#     design or approach is the project's own differentiator. The
#     per-dispatch default is to use the contributor tier; this is not a
#     fail-closed gate, and the security perspective is not excluded from
#     it.
#
# Outside the scope of consent
#   - Secrets present in the diff (API keys, credentials, internal
#     endpoints, customer data).
#   - Third-party work (vendored code, externally supplied patches,
#     contributors' pull requests).
#   - If the repository is currently private, or its license is not the
#     one the consent was reasonable under, do not use the contributor
#     tier.

version: 3

perspectives:
  - perspective: security
    claude_skill: review-security
    requires_spec: false
    primary_chain:
      - {harness: codex}
      - {harness: litellm, model: muse-spark}
  - perspective: performance
    claude_skill: review-performance
    requires_spec: false
    primary_chain:
      - {harness: litellm, model: muse-spark}
      - {harness: codex}
  - perspective: architecture
    claude_skill: review-architecture
    requires_spec: false
    primary_chain:
      - {harness: litellm, model: muse-spark}
      - {harness: codex}
  - perspective: spec
    claude_skill: review-spec
    requires_spec: true
    primary_chain:
      - {harness: litellm, model: muse-spark}
      - {harness: codex}
  - perspective: comprehensive
    claude_skill: review-comprehensive
    requires_spec: false
    primary_chain:
      - {harness: codex}
      - {harness: litellm, model: muse-spark}
  - perspective: license
    # Layer-2-only: never selected by the mechanical floor (review-rules.yaml
    # has no manifest signal). Added by discretion when the diff touches
    # dependency manifests / lockfiles or adds vendored third-party code
    # (review-phase.md R1 Layer 2).
    claude_skill: review-license
    requires_spec: false
    primary_chain:
      - {harness: codex}
      - {harness: litellm, model: muse-spark}
