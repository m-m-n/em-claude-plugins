      independence-declaration sentence legitimately cites both labels
      once, so a bare-label exclusion is wrong even for the CORRECTLY fixed
      extraction. Root-caused via a standalone Python probe of both the
      buggy (bare-anchor) and fixed (heading-anchor) extractions, which
      showed both extractions contain the labels (buggy: 3x each via
      swallowed headings + the legitimate citation; fixed: 1x, the
      legitimate citation only) and that only the block-BODY content
      (the precedence block's exhaustiveness sentence, the verify-cap
      block's first bullet) discriminates cleanly (present in buggy,
      absent in fixed). Rewrote the exclusion assertions on that basis;
      re-ran and confirmed green (44/44) with the corrected anchor
      (NEW_BLOCK_HEADING_ANCHOR) and failing again when reverted to the
      bare NEW_BLOCK_ANCHOR (verified via test_non_vacuity_the_bare_anchor_superset_contains_both_bodies_and_extra_label_citations,
      which asserts the buggy extraction's own contrasting properties).
