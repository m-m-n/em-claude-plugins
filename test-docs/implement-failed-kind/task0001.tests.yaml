      through _failed_kind_section(). The two negative-proof tests operate
      on synthetic text only and were green throughout -- they prove the
      matcher's shape, not the AC itself, and ride along with the other
      tests in this group.
  AC-2:
    tests:
      - test_failed_kind_schema.TestFailedKindRequiredness.test_states_belongs_to_implement_step
      - test_failed_kind_schema.TestFailedKindRequiredness.test_states_required_on_every_failed_write
