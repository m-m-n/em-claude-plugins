      - test_failed_kind_schema.TestFailedKindLifecycle.test_states_held_for_duration_of_failed_status
      - test_failed_kind_schema.TestFailedKindLifecycle.test_states_cleared_by_same_write_set_leaving_failed
      - test_failed_kind_schema.TestFailedKindLifecycle.test_states_no_separate_write_or_commit
