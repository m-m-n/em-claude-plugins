      - test_failed_kind_schema.TestBatchInfraResumeRecord.test_negative_proof_partial_statement_fails_both_checks
    red_confirmed: true
    red_reason: >
      Before the `infra_resume` paragraph was added to the `## `batch`
      block` section, these tests failed with AssertionError (e.g.
      "'infra_resume' not found in ...", "'monotonic, never reset' not
      found in ...", "'`rounds: 0`' not found in ..."). The negative-proof
      test operates on a synthetic string only and was green throughout.
  AC-6:
    tests:
      - test_failed_kind_schema.TestFullStructurePointers.test_implement_step_entry_names_failed_kind
      - test_failed_kind_schema.TestFullStructurePointers.test_implement_step_entry_points_at_defining_section
      - test_failed_kind_schema.TestFullStructurePointers.test_implement_step_entry_does_not_restate_vocabulary
      - test_failed_kind_schema.TestFullStructurePointers.test_batch_mapping_names_infra_resume_record
      - test_failed_kind_schema.TestFullStructurePointers.test_batch_mapping_does_not_restate_vocabulary
    red_confirmed: true
    red_reason: >
      Before the implement step's `status` line gained its `failed_kind`
      comment and the `batch:` mapping gained `infra_resume:`,
      test_implement_step_entry_names_failed_kind and
      test_batch_mapping_names_infra_resume_record failed with
      AssertionError ("'failed_kind' not found in ...", "'infra_resume'
      not found in ..."); test_implement_step_entry_points_at_defining_section
      failed because the window contained no heading to point at.
      test_implement_step_entry_does_not_restate_vocabulary and
      test_batch_mapping_does_not_restate_vocabulary passed vacuously
      before the pointers existed (nothing to restate) and continue to
      pass after the pointers were added without vocabulary terms --
      recorded here as a non-vacuity companion of the two positive tests
      in the same group, not as an independently confirmed red.
  AC-7:
    tests:
      - test_failed_kind_schema.TestSectionIsCitable.test_heading_text_is_present_verbatim
      - test_failed_kind_schema.TestSectionIsCitable.test_section_is_well_formed_between_its_own_heading_boundaries
    red_confirmed: true
    red_reason: >
      Before implementation, test_heading_text_is_present_verbatim failed
      with AssertionError ("'## `failed_kind`' not found in ..." -- the
      full document text); test_section_is_well_formed_between_its_own_heading_boundaries
      raised the same "heading not found as its own line" ValueError as
      the AC-1..AC-4 groups.
  AC-8:
    tests: []
    red_confirmed: false
    red_reason: >
      AC-8's verifiable outcome is `python3 -m unittest discover -s
      tests` passing with the new module present and stdlib-only imports
      -- exercised by the whole suite, not a single test in this module
      (per the task plan's Test Notes). Not independently red/green-able
      as its own test: the new module either collects and runs (as part
      of `discover`) or the run fails outright. Confirmed by running the
      full suite before implementation (baseline) and after (final);
      both show only the one pre-existing unrelated failure
      (test_llm_led_review_user_docs), and `tests/test_failed_kind_schema.py`
      imports only `os`, `re`, and `unittest`.
