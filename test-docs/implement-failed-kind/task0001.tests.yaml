  AC-5:
    tests:
      - test_failed_kind_schema.TestBatchInfraResumeRecord.test_names_both_member_keys
      - test_failed_kind_schema.TestBatchInfraResumeRecord.test_states_rounds_is_monotonic_and_never_reset
      - test_failed_kind_schema.TestBatchInfraResumeRecord.test_states_unset_read_rule_rounds_default_independently
      - test_failed_kind_schema.TestBatchInfraResumeRecord.test_states_unset_read_rule_cap_default_independently
      - test_failed_kind_schema.TestBatchInfraResumeRecord.test_states_no_migration_runs_for_infra_resume
      - test_failed_kind_schema.TestBatchInfraResumeRecord.test_cites_develop_skill_as_judgment_owner_not_restated_here
