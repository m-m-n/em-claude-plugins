      paragraph did not exist prior to implementation.
  AC-4:
    tests:
      - test_failed_kind_schema.TestFailedKindMissingValueCompatibility.test_states_missing_value_reads_as_decision
      - test_failed_kind_schema.TestFailedKindMissingValueCompatibility.test_states_no_migration_runs
