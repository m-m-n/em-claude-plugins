    red_confirmed: true
    red_reason: >-
      Each of the eight matchers' literals was extracted into a single
      module-level constant referenced by both its positive test (listed
      above, already existing from task0001) and its new negative-proof
      test. To confirm the pairing is a genuine shared reference rather than
      two independently-spelled copies, the whole constants/samples block
      was temporarily removed and the suite re-run: 20 tests failed with
      NameError (e.g. "name 'RECONCILED_STATE_PHRASE' is not defined" for
      both test_reconciled_state_phrasing_present and its paired negative
      proof; "name 'PRE_CHANGE_I2A_HOOK_PARENTHETICAL_SAMPLE' is not
      defined" for the AC-6 group's negative proofs, etc.) -- both members
      of each pair failed together on the same missing name. Restoring the
      block made all 977 tests pass again.
  AC-2:
    tests:
      - tests.test_recycled_task_id_consistency.TestPreChangeSampleGuards.test_i2b_step3_sample_retains_merged_half
      - tests.test_recycled_task_id_consistency.TestPreChangeSampleGuards.test_i2c_routeback_sample_retains_merged_gate
      - tests.test_recycled_task_id_consistency.TestPreChangeSampleGuards.test_i2a_recycled_paragraph_sample_retains_in_flight_sentence
      - tests.test_recycled_task_id_consistency.TestPreChangeSampleGuards.test_i2a_hook_parenthetical_sample_retains_queue_launch_guard
    red_confirmed: true
    red_reason: >-
      These four guard tests, and the sample constants they read, did not
      exist before this task. During the same constants/samples-removal
      step used for AC-1's evidence, all four failed with NameError (e.g.
      "name 'PRE_CHANGE_I2B_STEP3_WRITE_BACK_SAMPLE' is not defined").
      After restoring the samples (each a verbatim excerpt of
      implement-phase.md at commit b73c6e69e4ee81519d0e6f7f8f6a03ec06b5db24,
      extracted programmatically via git show plus exact-index slicing to
      avoid transcription drift), all four pass, each asserting its group's
      retained anchor phrase is present in the sample.
  AC-3:
    tests:
      - tests.test_recycled_task_id_consistency.TestValidationDetectsRegressions.test_reconciled_state_phrase_matcher_flags_absence_in_pre_change_wording
      - tests.test_recycled_task_id_consistency.TestValidationDetectsRegressions.test_inapplicable_marker_and_implement_stays_failed_flag_pre_change_wording
      - tests.test_recycled_task_id_consistency.TestValidationDetectsRegressions.test_inapplicable_anchored_slice_cannot_be_taken_on_pre_change_wording
      - tests.test_recycled_task_id_consistency.TestValidationDetectsRegressions.test_no_partial_write_phrases_matcher_flags_pre_change_wording
      - tests.test_recycled_task_id_consistency.TestValidationDetectsRegressions.test_unreachability_opening_anchor_matcher_flags_absence_in_pre_change_wording
      - tests.test_recycled_task_id_consistency.TestValidationDetectsRegressions.test_four_hooks_conjunction_matcher_fails_on_pre_change_wording
      - tests.test_recycled_task_id_consistency.TestValidationDetectsRegressions.test_status_never_consulted_matcher_flags_absence_in_pre_change_wording
      - tests.test_recycled_task_id_consistency.TestValidationDetectsRegressions.test_orchestrator_only_scope_matcher_flags_absence_in_pre_change_wording
    red_confirmed: true
    red_reason: >-
      All eight negative-proof tests failed with NameError before the
      module-level constants/samples existed (same removal step as AC-1/
      AC-2). Per the Design's group-specific proof shapes:
      test_inapplicable_anchored_slice_cannot_be_taken_on_pre_change_wording
      and
      test_unreachability_opening_anchor_matcher_flags_absence_in_pre_change_wording
      each assert `sample.index(ANCHOR)` raises ValueError (the slice the
      real matcher relies on cannot be formed on pre-change wording), and
      test_four_hooks_conjunction_matcher_fails_on_pre_change_wording
      asserts the already-present `queue_launch_guard.py` name IS in the
      sample while the other three hook names are absent (the conjunction
      fails on the missing three, not vacuously on all four). The remaining
      five are plain assertNotIn checks of their matcher's constant against
      the normalized sample.
  AC-4:
