  AC-1:
    tests:
      - tests.test_codex_hook_interactive_guard.TestCasesTable.test_cases_run_against_both_copies
    red_confirmed: true
    red_reason: >-
      Added the three deny entries (`zsh -c '! function () { python3 -i; }'`,
      `zsh -c 'if true; then function () { python3 -i; }; fi'`,
      `zsh -c 'function () { python3 -i; }'`) to CASES and ran the unchanged
      guard: both copies printed nothing, and the six subtests errored with
      `json.decoder.JSONDecodeError: Expecting value: line 1 column 1 (char 0)`
      instead of reading a deny decision. The bare form on the outer command
      line (`function () { python3 -i; }`) and inside `bash -c` were fed on
      standard input to both unchanged copies as well and printed nothing;
      they are not CASES entries and are denied by both copies after the
      change.
  AC-2:
    tests:
      - tests.test_codex_hook_interactive_guard.TestCasesTable.test_cases_run_against_both_copies
    red_confirmed: false
    red_reason: >-
      Regression guard for behavior that pre-existed: the silent entry
      `zsh -c "'function' () { python3 -i; }"` already passed before the change
      (the unchanged guard read a quoted `function` as a function name) and
      still passes; no red state occurred for this criterion. It guards the
      new rule against being read too broadly. The double-quoted spelling
      `zsh -c '"function" () { python3 -i; }'` and the backslash-escaped
      spelling `zsh -c '\function () { python3 -i; }'` were fed on standard
      input to both copies and print nothing, before and after the change.
