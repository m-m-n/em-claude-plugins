notes: "Baseline failures were pre-declared in the task invocation (5 tests unrelated to this feature: test_batch_policies, test_planner_designer_worktree_docs, test_refitted_worker_agents x2, test_review_implement_develop_lock_contracts) and step 4a's run reproduced exactly that set before any edit; final run after implementation reproduces the identical set, so final_failures is equal to (a subset of) baseline_failures. AC-1's test required a fix mid-implementation: the naive assertNotIn on the raw sentence string falsely reported 'already passing' during red confirmation because SKILL.md hard-wraps the sentence across a line boundary without a space, so the exact substring never matched even though the sentence was present. Both the test and its whole-file text are now compared with all whitespace stripped, which correctly went red pre-edit and green post-edit."
