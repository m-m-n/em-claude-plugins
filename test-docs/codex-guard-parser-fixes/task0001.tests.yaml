task_id: task0001
baseline_failures: []
final_failures: []
acceptance_tests:
  AC-1:
    tests:
      - tests.test_codex_hook_interactive_guard.TestCasesTable.test_cases_run_against_both_copies
    red_confirmed: true
    red_reason: >-
      Run against the base guard, the table rows for the shell -c miss forms
      (bash -cx 'python3 -i', bash -ce 'python3 -i', bash -c -- 'python3 -i',
      bash -c - 'python3 -i', bash -ci 'python3', bash -c -i 'python3',
      bash -co pipefail 'python3 -i', bash -c -o pipefail 'python3 -i',
      sh -cx 'python3') expected deny and the base guard printed nothing, so the
      test errored with json.JSONDecodeError (Expecting value). The silent rows
      of this criterion (bash -c 'echo hi' -i, bash -cx 'echo hi',
      bash -c -- 'echo hi', bash -cx, echo | bash -cx python3,
      bash -cx 'python3' < f, and the existing python3 -ci row) already passed
      at base and are regression pins.
  AC-2:
    tests:
      - tests.test_codex_hook_interactive_guard.TestCasesTable.test_cases_run_against_both_copies
    red_confirmed: true
    red_reason: >-
      Run against the base guard, the rows bash -h, sh -h, zsh -h, zsh -V,
      dash -V and bash -V expected deny and the base guard printed nothing
      (INFO_LETTERS made -h / -V informational for the shells), so the test
      errored with json.JSONDecodeError. The silent rows (python3 -h, -V, -VV,
      node -v, perl -v, bash --version) are existing rows that passed at base
      and pin that non-shell verdicts do not change.
  AC-3:
    tests:
      - tests.test_codex_hook_interactive_guard.TestCasesTable.test_cases_run_against_both_copies
    red_confirmed: true
    red_reason: >-
      Run against the base guard, the row echo "$(echo "; python3 -i")"
      expected silent and the base guard printed a deny object (the quote inside
      the substitution closed the outer quote), so the table test failed on the
      empty-output assertion. The other rows of this criterion (backtick span,
      $((1+2)), $(python3 -i), the unclosed substitution, and the deny row
      echo "$(echo x)"; python3 -i) already passed at base and are regression
      pins.
  AC-4:
    tests:
      - tests.test_codex_hook_interactive_guard.TestCasesTable.test_cases_run_against_both_copies
    red_confirmed: true
    red_reason: >-
      Run against the base guard, the silent rows (python3) < /dev/null,
      printf ... | (echo ignored; python3), (python3) 0< f, the heredoc form,
      ( (python3) ) < f and the brace form printf ... | { echo ignored; python3; }
      got a deny object, and the deny rows { python3; } 2>/dev/null and
      { python3; } got no output (the base guard read { as a command word).
      The deny rows (python3) 2>/dev/null, (python3) > out, (python3) | cat,
      (python3 -i) < /dev/null, echo x | (python3 -i) and the silent row
      { python3; } < /dev/null already passed at base and are regression pins.
  AC-5:
    tests:
      - tests.test_codex_hook_interactive_guard.TestCasesTable.test_cases_run_against_both_copies
    red_confirmed: true
    red_reason: >-
      Run against the base guard, the silent rows "echo x |\npython3",
      "echo x |\n\npython3", "echo x | # c\npython3" and
      "cat <<EOF |\nbody\nEOF\npython3" got a deny object (a newline cleared the
      pending pipe). The deny rows echo x &&\npython3 and echo x ||\npython3
      already passed at base and are regression pins.
  AC-6:
    tests:
      - tests.test_codex_hook_interactive_guard.TestCasesTable.test_cases_run_against_both_copies
      - tests.test_codex_hook_interactive_guard.TestMalformedAndDeepInput.test_an_unclosed_group_is_answered
      - tests.test_codex_hook_interactive_guard.TestMalformedAndDeepInput.test_substitutions_nested_deeply_inside_double_quotes_are_answered
      - tests.test_codex_hook_interactive_guard.TestMalformedAndDeepInput.test_groups_nested_deeply_are_answered
      - tests.test_codex_hook_interactive_guard.TestMalformedAndDeepInput.test_a_pipe_followed_by_many_empty_lines_is_answered
    red_confirmed: true
    red_reason: >-
      Only the CASES row (python3 with an unclosed parenthesis) was watched
      failing at base: it expects silent and the base guard printed a deny
      object. The other parts passed at base because the reading paths they
      guard (group stack, double-quoted substitution chunk, pending pipe over
      empty lines) did not exist yet: the unclosed brace group row, the
      brace-in-a-larger-word row ({a,b}; python3, whose expected deny is the
      base verdict), and the TestMalformedAndDeepInput methods (6000-level
      nesting, unclosed groups, 6000 empty lines; each ends with exit status
      0, empty stderr and empty-or-one-deny stdout). They are guards on the
      new code and were not observed failing.
  AC-7:
    tests:
      - tests.test_codex_hook_interactive_guard.TestCasesTable.test_cases_are_unique
      - tests.test_codex_hook_interactive_guard.TestCasesTable.test_cases_run_against_both_copies
    red_confirmed: true
    red_reason: >-
      The rewritten row bash -cx 'python3 -i' (now expecting deny) failed
      against the base guard, which printed nothing (json.JSONDecodeError in
      test_cases_run_against_both_copies). test_cases_are_unique passed at
      base with the added rows because no command string is repeated; it pins
      the no-duplicate requirement and was not observed failing.
  AC-8:
    tests:
      - tests.test_codex_hook_interactive_guard.TestGuardDocumentation.test_the_docstring_describes_the_new_behaviour
      - tests.test_codex_hook_interactive_guard.TestGuardDocumentation.test_no_text_makes_h_and_V_information_options_of_every_interpreter
      - tests.test_codex_hook_interactive_guard.TestCopies.test_the_two_copies_are_byte_identical
      - tests.test_codex_hook_interactive_guard.TestStaticConstraints.test_each_copy_stays_within_the_constraints
    red_confirmed: true
    red_reason: >-
      Only the two TestGuardDocumentation tests were watched failing at base:
      the module docstring lacked each marker sentence (shell -c takes no
      value, shells have no information short options, command substitution
      inside double quotes, group, stdin redirect, pending pipe) and the source
      still held INFO_LETTERS. The byte-identity test, the static-constraint
      test, the full discover run, the invariants script and the
      no-plugin.json-change bullet passed at base and are regression pins; they
      were not observed failing.
