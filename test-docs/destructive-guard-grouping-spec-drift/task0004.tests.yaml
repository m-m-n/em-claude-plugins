      rows plus the hard-coded demotion case stayed green — matching the
      task's own Test Notes ("The base-verdict guards and the allow guards
      are expected to pass already. They stay in as regression guards and
      are not expected to go red").
  AC-2:
    tests:
      - tests.test_destructive_guard_command_substitution.TestCaseTableDiscipline.test_runner_reports_every_case_passing
    red_confirmed: true
    red_reason: >-
      The four deny rows are among the 23 red-run failures (each reported
      `got=allow`: the payload re-scan was reading the unshaped first token,
      not the shaped command word, so it never recognised `bash -c`/`eval`/
      the here-string sitting behind the subshell, if/then, brace group or
      for/do wrapper). The base-verdict guard `command <<< 'rm -rf
      /home/sakura/x' bash` and both allow guards already reported their
      target verdict on the pre-fix tree and continued to. After the
      implementation, run-destructive-guard.py reports `ok deny` for all
      five deny rows and `ok allow` for both allow guards.
  AC-3:
    tests:
      - tests.test_destructive_guard_command_substitution.TestCaseTableDiscipline.test_runner_reports_every_case_passing
    red_confirmed: true
    red_reason: >-
      6 of these 11 rows are among the 23 red-run failures: the standalone-
      line `;;` row (case state was never flipped because the old code only
      evaluated `ends_case_item` when the statement had at least one token),
      the `;&`/`;|` fallthrough rows (old code matched only `";;" in sep`),
      the quoted-`"case"` and wrapper(command)-`case` rows (old code opened
      a case construct regardless of quoting or a preceding wrapper), and
      the `esac`-after-`|`-alternative row (old code closed the case on any
      word spelled `esac` in pattern position, including a later `|`
      alternative). The other 5 rows — the mixed-terminator row, the
      `time`-prefixed real case, the pattern-text `esac` used as the whole
      pattern, the empty `case x in esac`, and the standalone-`;;`
      allow guard — already reported their target verdict on the pre-fix
      tree (the underlying single-line `;;` handling, and the fail-closed
      default when a leading `case` is left unrecognised, already covered
      those shapes) and are kept as regression guards, matching the task's
      Test Notes grouping ("R2 maps to AC-3"). After the implementation all
      11 rows report the verdict named in AC-3.
  AC-4:
    tests:
      - tests.test_destructive_guard_command_substitution.TestCaseTableDiscipline.test_runner_reports_every_case_passing
    red_confirmed: true
    red_reason: >-
      6 of these 7 rows are among the 23 red-run failures: the two case-
      pattern-closer-fused-to-subshell-opener rows and the two `cp`-
      destination `ask` rows (old `_split_fused_closer_redirects` did not
      generalise a run of `)` beyond a single fused pair, so a closer run
      of length > 1, or one immediately followed by an opener, was not
      fully unwrapped down to the real command), and the two redirect-
      fused-to-`))` allow rows (`got=ask`/`got=deny` on the pre-fix tree —
      the trailing `>/dev/null`/`>/dev/null 2>&1` was itself misread as part
      of the closer run, so the scratch target was never separated out as a
      plain redirect and the statement fell through as if it still carried
      an argument). The plain `( (rm -rf /home/sakura/x))` row already
      reported `ok deny` on the pre-fix tree (a simple doubled `)` already
      matched the pre-existing single-fused-pair handling) and is kept as a
      regression guard. After the implementation all 7 rows report the
      verdict named in AC-4.
  AC-5:
    tests:
      - tests.test_destructive_guard_command_substitution.TestCaseTableDiscipline.test_runner_reports_every_case_passing
    red_confirmed: true
    red_reason: >-
      5 of these 9 rows are among the 23 red-run failures — `sudo
      2>/dev/null -u root rm/git push --force/cp`, the same shape wrapped in
      a subshell, and `env 2>/dev/null -u X rm` (each reported `got=allow`:
      the old wrapper-option skip stopped at the first non-option-shaped
      token, so a redirect operator sitting between the wrapper and its
      `-u`/value option was never removed first, and the wrapper skip
      never resumed past it to reach `rm`/`git`/`cp`). The three base-
      verdict guards (`time ( rm -rf ... )`, `command > ~/.claude/
      settings.json true`, `command > ~/.claude/projects/a/b.jsonl true`)
      and the `sudo 2>/dev/null -u root ls /root` allow guard already
      reported their target verdict on the pre-fix tree and are kept as
      regression guards, per the task's own invariants list and Test Notes.
      After the implementation all 9 rows report the verdict named in AC-5.
  AC-6:
    tests:
      - tests.test_destructive_guard_command_substitution.TestCaseTableDiscipline.test_runner_reports_every_case_passing
    red_confirmed: true
    red_reason: >-
      Both fallback deny rows are among the 23 red-run failures (each
      reported `got=allow`: the parse-failure fallback path had no grouping
      recognition at all, so `if`/`then`/`fi` and a subshell `(`/`)` around
      an `rm -rf` target were left as ordinary words and the rm check never
      saw `rm` at command position). The scratch-target allow row already
      reported `ok allow` on the pre-fix tree (the fallback's word-based
      tokenization already left the closer-fused word `/tmp/x )`'s `)` out
      of the rm-target scan, since the target itself, `/tmp/x`, was already
      a separate token) and is kept as a regression guard. After the
      implementation all 3 rows report the verdict named in AC-6.
