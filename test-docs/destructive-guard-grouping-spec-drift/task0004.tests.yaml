      - "destructive-guard-cases.json: ラッパー(command)直後のヒアストリングペイロード: 対象は裸形と同じ deny(回帰ガード)"
      - "destructive-guard-cases.json: サブシェル内でヒアストリングがコマンドの引数として渡るだけなら data のまま allow"
