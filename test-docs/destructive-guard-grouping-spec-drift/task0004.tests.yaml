  AC-2:
    tests:
      - "destructive-guard-cases.json: グルーピング(サブシェル)内の bash -c ペイロード: 対象は裸形と同じ deny"
      - "destructive-guard-cases.json: グルーピング(if/then)内の eval ペイロード: 対象は裸形と同じ deny"
