      23 failed (log: /tmp/task0004-red-run.log). Every one of the 23
      failing labels is among the 37 newly added rows (4 of R1's 7, 6 of
      R2's 11, 6 of R3's 7, 5 of R4's 9, 2 of R5's 3 — so at least one row
      of each of R1 through R5 failed); the other 14 new rows (the R1 base-
