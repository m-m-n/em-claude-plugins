  AC-3:
    tests:
      - "destructive-guard-cases.json: case アイテムの単独行 ;; 終端子越しでも次アイテムの rm は deny"
      - "destructive-guard-cases.json: 同一行終端子と単独行終端子が混在する case: git push --force のアイテムも deny"
      - "destructive-guard-cases.json: case パターン内の `;&` フォールスルー越しでも次アイテムの rm は deny"
      - "destructive-guard-cases.json: case パターン内の `;|` フォールスルー越しでも次アイテムの rm は deny"
      - "destructive-guard-cases.json: クォートされた \"case\" は case 構文を開かず、`||` 以降の rm は素のコマンドとして deny"
      - "destructive-guard-cases.json: ラッパー(command)越しの case は case 構文を開かず、`||` 以降の rm は素のコマンドとして deny"
      - "destructive-guard-cases.json: time 越しの本物の case: パターン閉じ括弧の後の rm は裸形と同じ deny"
      - "destructive-guard-cases.json: case パターンの `|` 区切り選択肢中の 'esac' はパターンテキストのまま、閉じ括弧後の rm は deny"
      - "destructive-guard-cases.json: case パターン自体が 'esac' という文字列でも、閉じ括弧後の rm は deny"
      - "destructive-guard-cases.json: アイテムの無い空の case(`case x in esac`)は正しく閉じ、後続の rm は素のコマンドとして deny"
      - "destructive-guard-cases.json: 単独行の ;; の後の次パターンはコマンド語ではなくデータのまま allow"
    red_confirmed: true
    red_reason: >-
      6 of these 11 rows are among the 23 red-run failures: the standalone-
      line `;;` row (case state was never flipped because the old code only
      evaluated `ends_case_item` when the statement had at least one token),
      the `;&`/`;|` fallthrough rows (old code matched only `";;" in sep`),
      the quoted-`"case"` and wrapper(command)-`case` rows (old code opened
      a case construct regardless of quoting or a preceding wrapper), and
      the `esac`-after-`|`-alternative row (old code closed the case on any
      word spelled `esac` in pattern position, including a later `|`
      alternative). The other 5 rows — the mixed-terminator row, the
      `time`-prefixed real case, the pattern-text `esac` used as the whole
      pattern, the empty `case x in esac`, and the standalone-`;;`
      allow guard — already reported their target verdict on the pre-fix
      tree (the underlying single-line `;;` handling, and the fail-closed
      default when a leading `case` is left unrecognised, already covered
      those shapes) and are kept as regression guards, matching the task's
      Test Notes grouping ("R2 maps to AC-3"). After the implementation all
      11 rows report the verdict named in AC-3.
  AC-4:
    tests:
      - "destructive-guard-cases.json: case パターン閉じ括弧に融着したサブシェル開き(複数行): 中の rm は deny"
      - "destructive-guard-cases.json: case パターン閉じ括弧に融着したサブシェル開き(単一行): 中の rm は deny"
      - "destructive-guard-cases.json: 二重に融着した閉じ括弧(`))`)の中の rm は deny"
      - "destructive-guard-cases.json: 二重に融着した閉じ括弧(`))`)の中の cp 宛先は ask のまま"
      - "destructive-guard-cases.json: ネストしたサブシェル内の cp 宛先は ask のまま"
      - "destructive-guard-cases.json: 二重の閉じ括弧にリダイレクトが融着したスクラッチ削除は allow のまま"
      - "destructive-guard-cases.json: 二重の閉じ括弧にリダイレクトが融着したスクラッチ削除(単純形)は allow のまま"
    red_confirmed: true
    red_reason: >-
      6 of these 7 rows are among the 23 red-run failures: the two case-
      pattern-closer-fused-to-subshell-opener rows and the two `cp`-
      destination `ask` rows (old `_split_fused_closer_redirects` did not
