task_id: task0003
# This is a document-only task (no source code changed). Both project test
# commands were actually re-executed after every SPEC.md/REQUIREMENTS.md
# edit was made (see AC-7 below); they are unaffected by documentation
# content, so this run is also the baseline for the criteria those two
# commands check.
baseline_failures: []
final_failures: []
acceptance_tests:
  AC-1:
    tests:
      - "grep -c 'three sources' feature-docs/destructive-guard-write-target-scoping/SPEC.md"
      - "grep -c 'extract mode only' feature-docs/destructive-guard-write-target-scoping/SPEC.md"
    red_confirmed: true
    red_reason: >
      Before the edit (git show HEAD:feature-docs/destructive-guard-write-target-scoping/SPEC.md),
      FR2 read "The set is drawn from three sources" (1 occurrence of
      "three sources") and contained 0 occurrences of "extract mode only".
      After the edit, "three sources" has 0 occurrences and FR2 states "The
      set is drawn from four sources" with (a)-(d) matching
      IMPLEMENTATION.md's "Write-target sources" verbatim, including "tar
      `-C` / `--directory` in extract mode only".
  AC-2:
    tests:
      - "grep -c 'only the last one is the destination' feature-docs/destructive-guard-write-target-scoping/SPEC.md"
    red_confirmed: true
    red_reason: >
      Before the edit, SPEC.md's Edge Cases line read "`mv a b c dir/` with
      multiple sources: only the last one is the destination." (1
      occurrence via git show HEAD). After the edit that occurrence is 0,
      and the line reads "a, b, c and dir/ are all write targets (mv
      unlinks each source it names)"; no line in SPEC.md states only the
      last argument is the destination for mv.
  AC-3:
    tests:
      - "grep -c WRAPPER_VALUE_FLAGS feature-docs/destructive-guard-write-target-scoping/SPEC.md feature-docs/destructive-guard-write-target-scoping/REQUIREMENTS.md"
      - "manual stdin-JSON invocation of em-workflow/hooks/destructive-guard.py for 'sudo -u root rm -rf $HOME/x', \"bash -c 'rm -rf $HOME/x'\" and \"eval 'rm -rf $HOME/x'\", with and without CLAUDE_BATCH=1"
    red_confirmed: true
    red_reason: >
      Before the edit, neither document mentioned WRAPPER_VALUE_FLAGS or
      the three example commands (git show HEAD: 0 occurrences in both
      files); FR6 only stated rm had no false positives and was out of
      scope, with no input-shaping qualification. Directly invoking
      em-workflow/hooks/destructive-guard.py in this worktree (read-only,
      stdin JSON, no filesystem mutation) with CLAUDE_BATCH unset confirmed
      `sudo -u root rm -rf $HOME/x`, `bash -c 'rm -rf $HOME/x'` and `eval
      'rm -rf $HOME/x'` are judged `ask` (rule rm-unresolvable), and with
      CLAUDE_BATCH=1 the same command is judged `deny`; `rm /tmp/foo`, `rm
      -rf node_modules`, `rm -rf /tmp/x 2>/dev/null` and `grep -rn "rm -rf
      /" ~/.claude/hooks/` remain `allow`. After the edit, both documents'
      FR6 state the bodies of check_rm/SAFE_DELETE are unchanged, name both
      input-shaping changes (head()'s WRAPPER_VALUE_FLAGS consumption and
      statements()'s -c/eval/here-string re-scan), and state the three
      commands went from allow to ask (deny under CLAUDE_BATCH).
  AC-4:
    tests:
      - "grep -c 'is the only function changed' feature-docs/destructive-guard-write-target-scoping/SPEC.md"
      - "grep -n 'rm / mv / cp / ln / chmod / chown' feature-docs/destructive-guard-write-target-scoping/SPEC.md"
    red_confirmed: true
    red_reason: >
      Before the edit, SPEC.md's component diagram read
      "check_self_modification is the only function changed" (1
      occurrence), the architecture diagram's source (c) label grouped "rm
      / mv / cp / ln / chmod / chown args" as one bullet (1 occurrence),
      and the Dependencies bullet referred only to check_self_modification
      being rewritten. After the edit, 0 occurrences of "is the only
      function changed" and 0 occurrences of the rm/mv/cp/ln/chmod/chown
      single-bullet grouping remain in the architecture diagram, component
      diagram, Dependencies or Data Flow sections; all four now also note
      the statements()/head() input-shaping change to what check_rm
      receives (FR6).
  AC-5:
    tests:
      - "grep -c '3 つ' feature-docs/destructive-guard-write-target-scoping/REQUIREMENTS.md"
    red_confirmed: true
    red_reason: >
      Before the edit, REQUIREMENTS.md had 4 occurrences of "3 つ" across
      the FR2 description, 10.1 risk row and related text (git show HEAD).
      Each of the eight places named in the task plan (1.3 scope, 4.1 table
      FR2/FR6 rows, FR2 description and business rule, FR6 description,
      10.1 risk row, 12.1 boundary item, 13 glossary entry, 14.1 confirmed
      item) was edited individually. After the edit, 0 occurrences of "3
      つ" remain and the content agrees with the revised SPEC.md's (a)-(d)
      source list and mv/rm wording.
  AC-6:
    tests:
      - "grep -n 'three sources\\|3 つ\\|3つ\\|only the last one is the destination\\|最後の 1 つを宛先として扱い、rm\\|is the only function changed\\|唯一の関数' feature-docs/destructive-guard-write-target-scoping/SPEC.md feature-docs/destructive-guard-write-target-scoping/REQUIREMENTS.md"
      - "grep -n tar feature-docs/destructive-guard-write-target-scoping/SPEC.md feature-docs/destructive-guard-write-target-scoping/REQUIREMENTS.md"
    red_confirmed: true
    red_reason: >
      Run before any edit, the combined search matched multiple lines in
      both files (the three-source count, the mv-last-argument wording, the
      check_self_modification-only-function-changed wording). Run again
      after every edit above, the same combined search returns no matches
      in either file, and every remaining `tar` mention in both documents
      is qualified "extract mode only" / "extract モードのみ" with no
      unqualified all-mode statement.
  AC-7:
    tests: []
    red_confirmed: false
    red_reason: >
      No red state is possible for this criterion by construction: every
      change in this task was made with the Edit tool against only
      feature-docs/destructive-guard-write-target-scoping/SPEC.md and
      feature-docs/destructive-guard-write-target-scoping/REQUIREMENTS.md,
      so the diff could never contain another file, and neither test
      command reads document content, so a docs-only change cannot make
      them fail. Both commands were actually run after all edits and
      passed: `python3 em-workflow/hooks/tests/run-destructive-guard.py`
      reported "284/284 passed", `python3 -m unittest discover -s tests`
      reported "Ran 6188 tests ... OK", and `git status --porcelain` in the
      worktree shows only the two expected files modified.
