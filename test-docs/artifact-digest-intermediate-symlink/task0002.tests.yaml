      - tests.test_artifact_digest_docs.TestScriptDocstringIntermediateSymlink.test_ac1_entry_kinds_does_not_limit_the_rule_to_the_final_component
    red_confirmed: true
    red_reason: "Against the unedited docstring three of the four failed: the token line (not_a_regular_file ... a socket) gave False for the any-component matcher, the Entry kinds paragraph gave False for it too, and the Entry kinds limit check returned the sentence 'The final path component is never resolved through a symlink and nothing waits on a FIFO or a device.' The token-line limit check was already green before the change (the old token line never named the final component) and is a guard. The forged-text cases in TestIntermediateSymlinkMatchersFireOnForgedText prove the limit matcher fires."
  AC-2:
    tests:
      - tests.test_artifact_digest_docs.TestScriptDocstringIntermediateSymlink.test_ac2_exit_code_2_line_includes_the_missing_capability_case
      - tests.test_artifact_digest_docs.TestScriptDocstringIntermediateSymlink.test_ac2_exit_code_2_line_prints_no_array
