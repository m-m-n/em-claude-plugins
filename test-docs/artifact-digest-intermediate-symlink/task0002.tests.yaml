      - tests.test_artifact_digest_docs.TestOpenFlagsCommentIntermediateSymlink.test_ac2_comment_says_intermediate_components_are_opened_as_directories
      - tests.test_artifact_digest_docs.TestOpenFlagsCommentIntermediateSymlink.test_ac2_comment_still_covers_the_final_element
      - tests.test_artifact_digest_docs.TestOpenFlagsCommentIntermediateSymlink.test_ac2_comment_does_not_imply_only_the_final_component_is_protected
    red_confirmed: true
    red_reason: "Against the unedited script five of the six failed: the exit code 2 line had no 'platform ... lack' wording ('2 no argument (usage on stderr), an argument that is not valid UTF-8, or an unexpected internal failure; stdout carries no array'), and the OPEN_FLAGS comment ('never follow a symlink in the final component ... A flag the platform lacks is simply absent (0)') had no 'no component of the path is followed', no 'intermediate components ... as directories', no 'final element', and it carried the final-component-only wording. The no-array check on the exit code 2 line was already green (the old line already said 'stdout carries no array') and is a guard."
  AC-3:
    tests:
      - tests.test_artifact_digest_docs.TestCalculationIntermediateSymlink.test_ac3_not_a_regular_file_item_names_a_symlink_at_any_component
      - tests.test_artifact_digest_docs.TestCalculationIntermediateSymlink.test_ac3_exit_code_2_item_includes_the_missing_capability_case
