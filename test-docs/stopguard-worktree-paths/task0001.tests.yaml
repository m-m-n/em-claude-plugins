acceptance_tests:
  AC-1:
    tests:
      - tests.test_queue_stop_guard.TestQueueStopGuardBlocking.test_free_slots_and_unlaunched_tasks_blocks_with_bounded_ascending_ids
      - tests.test_queue_stop_guard.TestQueueStopGuardRealLayoutAncestorWalk.test_blocks_identically_from_fixture_root_and_integration_dir
      - tests.test_queue_stop_guard.TestQueueStopGuardRealLayoutAncestorWalk.test_blocks_from_a_deep_subdirectory_of_the_integration_worktree
    red_confirmed: true
    red_reason: >
      Against the pre-implementation hook (find_project_root + flat-layout
      active_features), all three returned exit 0 (AssertionError: 0 != 2):
      the migrated fixture writes workflow.yaml under the nested
      integration-worktree layout, which the old flat glob
      {root}/feature-docs/*/workflow.yaml never matches.
  AC-2:
    tests:
      - tests.test_queue_stop_guard.TestQueueStopGuardFreshness.test_stale_journal_mtime_excludes_despite_unlaunched_tasks
      - tests.test_queue_stop_guard.TestQueueStopGuardFreshness.test_fresh_journal_mtime_blocks
      - tests.test_queue_stop_guard.TestQueueStopGuardFreshness.test_no_journal_file_falls_back_to_stale_workflow_yaml_mtime_and_excludes
      - tests.test_queue_stop_guard.TestQueueStopGuardFreshness.test_no_journal_file_falls_back_to_fresh_workflow_yaml_mtime_and_blocks
    red_confirmed: true
    red_reason: >
      Two-step confirmation, because a single pre-implementation hook run
      does not discriminate the freshness filter from plain non-enumeration.
      (1) The two "blocks" tests (fresh mtime) returned 0 instead of 2
      against the original hook (nothing enumerated at all under the real
      layout). (2) The two "excludes" tests (stale mtime) returned 2 instead
      of 0 against an intermediate hook that had the new-layout enumeration
      and decomposition but with candidate_is_fresh's filter call removed —
      proving the freshness check itself, not mere non-enumeration, is what
      those two assertions exercise.
  AC-3:
    tests:
      - tests.test_queue_stop_guard.TestQueueStopGuardLayoutIsolation.test_flat_main_tree_workflow_yaml_is_never_enumerated
      - tests.test_queue_stop_guard.TestQueueStopGuardLayoutIsolation.test_no_worktrees_directory_anywhere_above_cwd_passes_silently
    red_confirmed: true
    red_reason: >
      test_flat_main_tree_workflow_yaml_is_never_enumerated returned 2
      instead of 0 against the original hook (a readable, empty journal was
      deliberately placed at the worktree-side directory so the old hook,
      which DOES enumerate the flat path via its cwd fallback, reaches an
      actual BLOCK rather than bailing out on an unrelated missing-journal
      reason — this makes the red a genuine statement about layout
      isolation). test_no_worktrees_directory_anywhere_above_cwd_passes_silently
      was already green pre-implementation (see unconfirmed_reds) — recorded
      honestly rather than misrepresented.
  AC-4:
