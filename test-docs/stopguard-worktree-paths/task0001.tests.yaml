notes: |
  Two acceptance-criterion sub-cases could not be made to fail first and are
  recorded honestly rather than fabricated as red-confirmed (see
  unconfirmed_reds in the final report): AC-3's "no worktrees directory
  anywhere above cwd" case and AC-4's "whole worktree-side feature directory
  absent" case. Both assert exit 0 / empty-ish stderr on a completely empty
  fixture directory tree; the pre-implementation hook's find_project_root()
  always falls back to cwd itself (it never fails), so it also reaches
  "nothing to enumerate -> exit 0" on an empty tree, for an unrelated
  reason. There is no way to construct an input on which the old
  cwd-fallback and the new ancestor-walk-with-None disagree when nothing
  exists on disk at all -- the scenario is inherently non-discriminating
  between the two implementations. Both tests remain valid forward-looking
  regression coverage for the new contract (verified to still exit 0 with
  no crash / no traceback post-implementation) even though they were not
  observed to fail first.
