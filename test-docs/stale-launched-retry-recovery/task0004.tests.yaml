      - tests.test_stale_launched_retry_reachability.TestRetryAfterStaleLaunchedFailure.test_per_task_replay_is_not_confused_by_a_second_tasks_events
    red_confirmed: true
    red_reason: >-
      queue_launch_guard.py is out of scope for this feature (AC-3) and is
      never edited, so there is no implementation-red state to watch for
      this criterion in the ordinary red-green sense; the plan's own Test
      Notes call AC-1/AC-2 "observable before the bump", not red-before-it.
      To still ground the claim in an observation rather than an assumption,
      ran both tests against a MUTATED COPY of the real script (never the
      real file, confirmed byte-identical afterward) with the retry branch
      broken to deny on a last event of "failed": both tests failed as
      expected (permissionDecision "deny" instead of an empty stdout /
      allow). Reverted to the real, unmodified hook path and both tests
      passed again -- the same result they gave before this observation.
  AC-2:
    tests:
      - tests.test_stale_launched_retry_reachability.TestDoubleLaunchPreventionUndiminished.test_last_event_launched_denies_and_appends_nothing
      - tests.test_stale_launched_retry_reachability.TestDoubleLaunchPreventionUndiminished.test_last_event_merged_denies_and_appends_nothing
    red_confirmed: true
    red_reason: >-
      Same situation as AC-1 (guard untouched, out of scope). Ran both
      tests against a mutated copy of the real script with both deny
      branches (launched, merged) removed: both tests failed (no deny
      decision was emitted; the mutated guard allowed and appended instead).
      Reverted to the real hook path and both passed again, matching their
      pre-observation result. The real hook file's bytes were confirmed
      unchanged throughout.
  AC-3:
    tests:
      - tests.test_stale_launched_retry_reachability.TestGuardSourceUntouched.test_module_never_imports_the_guard
      - tests.test_stale_launched_retry_reachability.TestGuardSourceUntouched.test_guard_source_bytes_unchanged_after_invocation
    red_confirmed: true
    red_reason: >-
      Both checks are structural/regression guards written alongside the
      constraint they enforce, so there is no pre-existing violation in this
      repository to observe red against. Instead, proved detection power
      directly: ran the import-check's ast logic against a forged source
      string containing "import queue_launch_guard" and it correctly failed
      (module name found where it must not be); ran the byte-comparison
      logic against a scratch file that was actually mutated between the
      before/after reads and it correctly failed (before != after). Both
      checks pass against this module's real, unmodified content.
