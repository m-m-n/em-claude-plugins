      workflow-schema.md, which shows only prose sentences added, no
      backtick-wrapped `.py`/`.sh` filename added or removed; the
      negative-proof tests
      (test_negative_proof_added_writer_is_detected,
      test_negative_proof_removed_writer_is_detected) demonstrate the
      matcher does reject a forged addition/removal.
