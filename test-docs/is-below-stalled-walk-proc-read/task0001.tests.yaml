task_id: task0001
baseline_failures: []          # before any edit: python3 -m unittest discover -s tests -> Ran 12223 tests, OK (skipped=1); no failing test
final_failures: []             # re-executed after the implementation and after writing this record: python3 -m unittest discover -s tests -> Ran 12262 tests, OK (skipped=1, the same single skip as the baseline); no failing test
acceptance_tests:
  AC-1:
    tests:
      - tests.test_bash_guard_cd_prefix.TestStalledWalkNeverReachesProc.test_ac1_a_stalled_form_that_climbs_to_proc_is_false
      - tests.test_bash_guard_cd_prefix.TestStalledWalkNeverReachesProc.test_ac1_a_stalled_form_that_climbs_to_dev_fd_is_false
      - tests.test_bash_guard_cd_prefix.TestStalledWalkNeverReachesProc.test_ac1_the_fixture_links_stall_at_an_absent_stage_or_a_regular_file
      - tests.test_bash_guard_cd_prefix.TestStalledWalkNeverReachesProc.test_ac1_the_fixture_lenient_realpath_lands_below_the_area
    red_confirmed: true
    red_reason: >-
      Run against the unchanged walk (new tests written first),
      test_ac1_a_stalled_form_that_climbs_to_proc_is_false_and_nothing_under_proc_is_touched
      failed in all five subtests (forms a, b, c, d and the physical-only
      variant of b) with AssertionError: Lists differ: [('probes', '/proc'),
      ('probes', '/proc/se...wd')] != [], and the dev/fd test failed with the
      same kind of difference listing probes of /dev/fd and /proc, because the
      old walk ended at the absent stage or the regular file and the realpath
      calls then probed and read under /proc and /dev/fd.
      test_ac1_a_refusal_of_either_walk_returns_false_before_any_realpath_call
      failed in all five subtests with AssertionError: realpath called after a
      refusal. The two fixture tests passed before the change by design: they
      guard that each link has a target that stalls first and then climbs to
      the root, and that the lenient realpath of each /proc form lands on an
      existing directory strictly below the area with the process in
      procdep/work.
  AC-2:
    tests:
      - tests.test_bash_guard_cd_prefix.TestStalledLogicalCorner.test_ac2_is_below_is_false
      - tests.test_bash_guard_cd_prefix.TestStalledLogicalCorner.test_ac2_the_hook_is_silent_from_the_main_worktree_and_from_a_git_worktree
      - tests.test_bash_guard_cd_prefix.TestStalledLogicalCorner.test_ac2_non_canonical_text_returns_false_before_any_realpath_call
      - tests.test_bash_guard_cd_prefix.TestStalledLogicalCorner.test_ac2_the_fixture_resolves_below_the_area_in_both_ways
    red_confirmed: true
    red_reason: >-
      Run against the unchanged walk, the old rule judged the corner form
      below the area: test_ac2_is_below_is_false_and_nothing_under_proc_is_touched
      and test_ac2_the_form_is_false_even_when_the_as_written_query_agrees
      failed with AssertionError: True is not False,
      test_ac2_the_hook_is_silent_from_the_main_worktree_and_from_a_git_worktree
      failed for both input cwds (repo1, wtree) with AssertionError: 'allow'
      != 'silent', test_ac2_the_logical_walk_refuses_and_the_physical_walk_does_not
      failed with AssertionError: False is not True, and
      test_ac2_the_logical_refusal_returns_false_before_any_realpath_call
      failed with AssertionError: realpath called after a refusal. The
      fixture guard test_ac2_the_fixture_makes_the_old_rule_judge_the_form_below_the_area
      passed before the change by design: it confirms that, with the process
      in procdep/work, the logical and physical realpaths are existing
      directories strictly below the area, the as-written resolution is a
      directory, and the rest of the rule says True once the stage walk is set
      not to refuse.
  AC-3:
    tests: []
    red_confirmed: false
    red_reason: >-
      The behavior pre-existed: this is the recorder guard test, which pins
      that the standard library's lenient realpath, called directly on a
      stalled form (a) or (b), makes the recorded probes and reads under
      /proc. It depends on the interpreter, not on the hook, so the test
      passed before any implementation and passes after it; no red state
      occurred.
  AC-4:
    tests:
      - tests.test_bash_guard_cd_prefix.TestRelativeLinkTarget
    red_confirmed: false
    red_reason: >-
      The behavior pre-existed: a dedicated new red state is out of scope
      because the criterion is that nothing existing changes, but the existing
      tests listed (the missing-stage and non-directory-stage test, the
      logical-walk test, the strict-mode test and all of TestRelativeLinkTarget)
      detect a wrongly added refusal, and the three new tests pin that neither
      walk refuses a missing stage then .. then sub, a regular file then ..
      then task0001, or the dangling link then .. then task0001, and that
      nothing under /proc or /dev/fd is probed for them. All of them passed
      before the change and pass after it; no red state occurred.
  AC-5:
    tests: []
    red_confirmed: true
    red_reason: >-
      Run against the unchanged walk,
      test_ac5_the_walk_refuses_when_the_total_is_41_and_not_when_it_is_40
      failed in the total=41 subtest with AssertionError: False is not True,
      and test_ac5_is_below_is_false_for_the_41_link_form_even_when_the_as_written_query_agrees
      failed with AssertionError: True is not False, because the old walk
      ended at the stall and never counted the chain after it. The error
      tests for stages and link reads after the stall failed because the
      walk never reached them (the injected error was not raised: Lists
      differ: [] != [<failing path>]), and the ValueError tests and
      test_ac5_a_name_whose_probe_failed_after_the_stall_is_an_ordinary_name
      failed with AssertionError: False is not True. The tests for the same
      error before the stall, the 40-total subtest, the logical walk and the
      two control tests without an injected error passed before the change by
      design: they pin the behavior that must not change.
  AC-6:
    tests:
      - tests.test_bash_guard_cd_prefix.TestPathConditionWording
    red_confirmed: true
    red_reason: >-
      Run before the four statements were changed,
      test_ac6_each_place_states_the_continuation failed in all four subtests
      (stage walk docstring, module docstring path item, protocol path item,
      is_below docstring paragraph) with AssertionError: False is not true,
      test_ac6_the_stage_walk_docstring_no_longer_says_the_walk_ends_without_refusal
      failed with the phrase 'ends the walk without refusal' unexpectedly
      found, test_ac6_the_two_path_items_carry_the_same_continuation_statement
      failed with the statement unexpectedly None for the module docstring
      path item, and
      test_ac6_the_statement_sits_inside_the_one_is_below_paragraph_that_names_dev_fd
      failed with AssertionError: False is not true. The matcher self-tests,
      the place-finding test and the no-/proc/self/root test passed before
      the change by design. The three existing wording classes listed are
      unmodified and passing before and after.
  AC-7:
    tests:
      - tests.test_bash_guard_cd_prefix.TestStalledWalkContract.test_ac7_the_path_check_starts_no_child_process_for_the_added_forms
      - tests.test_bash_guard_cd_prefix.TestProcessDependentPathContract
      - tests.test_bash_guard_cd_prefix.TestAc7StandardLibraryOnly
    red_confirmed: false
    red_reason: >-
      The behavior pre-existed: the criterion is about what the change leaves
      as it was. The signatures, FOLLOWED_LINK_LIMIT of 40, the order in which
      the first as-written query follows both realpath calls, and the absence
      of child processes held before the change, so the new contract tests and
      the existing TestProcessDependentPathContract and TestAc7StandardLibraryOnly
      (hook and test module import only the standard library; no `status`
      substring in the hook's executable text) passed before and after; no red
      state occurred. The full-suite run
      (python3 -m unittest discover -s tests) has no single test to name. That
      the change set contains no edit to em-workflow's plugin.json or the root
      marketplace.json has no executable check and was verified by reading
      git diff --name-only against the parent branch.
