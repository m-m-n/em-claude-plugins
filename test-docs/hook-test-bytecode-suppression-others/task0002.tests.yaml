    red_confirmed: true
    red_reason: >-
      With the loaders unchanged, the new classes were run in both modules.
      The flag-at-the-execution-step tests failed for starting=False in both
      plugins' copies (`Lists differ: [False] != [True]`), the raising-step
      tests failed the same way (`'guard body raised; flag=False' !=
