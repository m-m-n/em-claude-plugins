      `{'muse_guard.cpython-314.pyc': (...)} != {}` (a cache file appeared
      next to the hook) when the hook directories held no `__pycache__`.
  AC-2:
    tests:
      - tests.test_muse_guard.TestGuardLoadWritesNoBytecode.test_ac2_flag_holds_the_starting_value_after_the_load_returns
      - tests.test_muse_guard.TestGuardLoadWritesNoBytecode.test_ac2_the_load_still_returns_the_executed_guard_module
      - tests.test_consultation_harness_chain.TestGuardLoadWritesNoBytecode.test_ac2_flag_holds_the_starting_value_after_the_load_returns
      - tests.test_consultation_harness_chain.TestGuardLoadWritesNoBytecode.test_ac2_the_load_still_returns_the_executed_guard_module
    red_confirmed: false
    red_reason: >-
      The behavior pre-existed: the unchanged loaders never touched the flag,
      so it already equalled the starting value after the load and the tests
      passed before any implementation. The tests guard the new window against
      a loader that fails to restore. Checked against two hand-made faulty
      loaders in throwaway copies of both modules (one that never restores,
      one that restores only on a normal return): the restore test failed for
      the first, and the exception test for both.
  AC-3:
    tests:
      - tests.test_muse_guard.TestGuardLoadWritesNoBytecode.test_ac3_the_exception_propagates_and_the_flag_holds_the_starting_value
      - tests.test_consultation_harness_chain.TestGuardLoadWritesNoBytecode.test_ac3_the_exception_propagates_and_the_flag_holds_the_starting_value
    red_confirmed: false
    red_reason: >-
      The behavior pre-existed: the unchanged loaders let the exception
      propagate and never touched the flag, so the tests passed before any
      implementation. The tests guard the new window against a loader that
      swallows or replaces the exception or leaves the flag changed. Checked
      against the two hand-made faulty loaders described under AC-2: the test
      failed for starting=False in both plugins' copies, in both modules.
