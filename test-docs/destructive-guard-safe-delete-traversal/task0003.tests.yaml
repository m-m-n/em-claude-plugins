task_id: task0003
baseline_failures: []
final_failures: []
acceptance_tests:
  AC-1:
    tests:
      - tests.test_destructive_guard_command_substitution.TestCaseTableDiscipline.test_runner_reports_every_case_passing
    red_confirmed: true
    red_reason: >-
      Ran these 4 entries against the pre-fix destructive-guard.py (git HEAD
      copy): all 4 got "allow" ("破壊的なパターンに一致しない。") instead of
      "deny". Confirms the exact bug AC-1 targets — space-blanking a
      substitution adjacent to other text left indistinguishable literal
      residue (e.g. "$(pwd)/../tmp/scratch" -> residue "/../tmp/scratch"),
      which normalize_candidate() then folded into a safe-root match. The 4th
      entry ("residue on the right instead of the left") is the Test Notes
      edge case confirming the boundary check catches adjacency on either
      side of the substitution, not just the AC-1-example side.
  AC-2:
    tests:
      - tests.test_destructive_guard_command_substitution.TestCaseTableDiscipline.test_runner_reports_every_case_passing
    red_confirmed: false
    red_reason: >-
      AC-2 is the regression half, not new behavior — these pre-existing
      allow-side entries (task0001's pinned cases named in the task plan)
      were already green before this task and must stay green after it.
      Verified by running the FULL suite before touching any file (164/164
      passed, 0 failures — recorded as this task's baseline) and again after
      the fix (178/178 passed: the same 164 entries plus 14 new ones added by
      this task, 0 removed, 0 changed). No entry in this list, or any other
      pre-existing deny/ask entry, changed its expectation.

      Removed from tests (not a unittest ID): 既知の穴(未修正): 裸のコマンド置換 `$(mktemp -d)` は対象ゼロで早期returnし allow; 既知の穴(未修正): 裸のコマンド置換 `$(cat list)` は対象ゼロで早期returnし allow
  AC-3:
    tests:
      - tests.test_destructive_guard_command_substitution.TestCaseTableDiscipline.test_runner_reports_every_case_passing
    red_confirmed: true
    red_reason: >-
      Ran the first 5 entries against the pre-fix guard: all 5 got "allow"
      instead of "ask" — positional ($1), special ($@), and un-expanded
      tilde forms (~+, ~-, ~user) were not in the unresolvable vocabulary, so
      a following parent reference folded past them and the residue matched
      a safe root. Additionally ran each of these 5 commands directly with
      CLAUDE_BATCH=1 against the FIXED guard and confirmed all 5 demote from
      ask to deny (never allow) under batch, satisfying the "both modes"
      note — a dedicated batch-mode case-table entry was not added because
      the runner always clears CLAUDE_BATCH for array-based cases and there
      is no existing precedent for a per-case batch entry to follow (Test
      Notes: "worth its own entry where the existing table has a precedent
      for one"). The 2 "対照" (control) entries are the negative half named
      in Test Notes ("~/-leading and bare ~ targets, the false positive AC-3
      must not create") — both already passed before this task's change
      (bare ~ via the pre-existing rm-root check, ~/-leading via the
      pre-existing normalize+safe-root path) and still pass after; they are
      regression guards, not new-behavior tests, so red_confirmed does not
      apply to them individually — folded under this AC's true value since
      the AC's positive half (the 5 ask cases) is genuinely red-confirmed.
  AC-4:
    tests:
      - tests.test_destructive_guard_command_substitution.TestCaseTableDiscipline.test_runner_reports_every_case_passing
    red_confirmed: true
    red_reason: >-
      Ran the first and third entries against the pre-fix guard: both got
      "ask" (reason rm-unresolvable, naming only `tmp/$X`) instead of "deny"
      — the pre-fix check_rm() called decide() and exited on the first
      target's ask, so the second target/segment's deny on
      `/home/sakura/valuable` was never reached. This is the exact bug AC-4
      targets. The negative half ("a command whose unresolvable target is
      its only target still decides ask") is the pre-existing, unmodified
      entry `rm -rf tmp/$X` (line kept as-is in the case table) — already
      passing before and after, confirming D6 does not turn a lone ask into
      a deny.
  AC-5:
    tests: []
    red_reason: >-
      Not independently testable by a single case — it is a property of the
      case table plus the suite run as a whole. Verified directly: `git
      diff` on destructive-guard-cases.json shows only additions (14 new
      entries appended after the pre-existing 164; `git diff --stat`
      confirms 16 insertions/deletions total, all additions with 2 trivial
      context-line touches at the array boundary, 0 pre-existing lines
      removed or altered), and
      `python3 em-workflow/hooks/tests/run-destructive-guard.py` reports
      178/178 passing, including the trailing batch-demotion assertion.
  AC-6:
    tests:
      - tests.test_destructive_guard_command_substitution.TestCaseTableDiscipline.test_runner_reports_every_case_passing
    red_reason: >-
      Build/determinism outcome, not a single test. Verified: (1) no decision
      path in the diff calls os.path.realpath/os.stat/subprocess or any other
      filesystem/process API — the only additions are regex matching, string
      replacement, and pure comparisons; (2) ran the full suite twice back to
      back and diffed stdout byte-for-byte — identical; (3) the two listed
      pre-existing no-substitution entries (already in the 164-entry
      baseline, untouched by this task) still decide exactly as before,
      spot-checking the "commands without a substitution or expansion are
      unaffected" half directly, backed by the full 178/178 pass covering
      every other pre-existing entry too.
