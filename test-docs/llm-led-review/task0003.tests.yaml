      definition ... 0002, 0005"), referenced today only from
      feature-docs/llm-led-review/tasks/task0002.md and IMPLEMENTATION.md --
      files task0003 must never touch (worktree-task-workflow: never modify
      feature-docs/**) and does not own. Neither command's exit code moved
