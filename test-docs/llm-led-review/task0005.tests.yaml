      - tests.test_llm_led_review_user_docs.TestReadmeAgentTable.test_reviewer_row_is_fallback_only
      - tests.test_llm_led_review_user_docs.TestReadmeAgentTable.test_codex_reviewer_row_is_primary_reviewer
    red_confirmed: true
    red_reason: >-
      Before the edit: test_review_evaluator_row_names_opus_and_evaluation_role
      raised AssertionError "no table row found for cell 'review-evaluator'"
      (the row did not exist yet); test_reviewer_row_is_fallback_only failed
      because the reviewer row read "汎用 Claude レビュアー（観点はスキル注入）"
      with no フォールバック wording; test_codex_reviewer_row_is_primary_reviewer
      failed because the row read "クロスバリデーション用" with no "primary
      reviewer" wording.
  AC-4:
    tests:
      - tests.test_llm_led_review_user_docs.TestReadmeReviewSection.test_describes_one_primary_reviewer_dispatch
      - tests.test_llm_led_review_user_docs.TestReadmeReviewSection.test_describes_claude_fallback_on_full_chain_unavailability
      - tests.test_llm_led_review_user_docs.TestReadmeReviewSection.test_describes_evaluator_step
      - tests.test_llm_led_review_user_docs.TestReadmeReviewSection.test_describes_orchestrator_decision
      - tests.test_llm_led_review_user_docs.TestReadmeReviewSection.test_chain_table_lists_all_six_perspectives_with_pinned_chains
    red_confirmed: true
    red_reason: >-
      Before the edit, each "describes_*" assertion raised AssertionError
      for a missing substring (e.g. "primary_chain" / "Opus 評価者" /
      "決定は常にオーケストレーターが行う" were absent from the old review
