      Before the edit, review-protocol.md contained none of 'exactly one' /
      'main review' / 'fallback' / 'no available harness entry' / 'never
      dispatched together' (each assertIn failed: phrase not found), and
      still contained the forbidden phrase 'cross-model reviewer' 3x in the
      Skip Semantics section (assertNotIn failed: phrase found). Watched all
      6 fail with these exact AssertionErrors before adding the dispatch-rule
      paragraph and rewording the 3 Skip Semantics labels.
  AC-2:
    tests:
      - tests.test_reviewer_roles_protocol.TestFrozenInputFieldNames.test_every_documented_input_field_name_present
      - tests.test_reviewer_roles_protocol.TestFrozenSkipReasonStrings.test_every_skip_reason_string_present_verbatim
      - tests.test_reviewer_roles_protocol.TestFrozenSkipReasonStrings.test_retryable_set_statement_present
      - tests.test_reviewer_roles_protocol.TestFrozenSkipReasonStrings.test_exactly_three_retryable_reasons_named
