      - tests.test_reviewer_roles_protocol.TestFrozenSeverityLevels.test_three_severity_levels_defined_verbatim
      - tests.test_reviewer_roles_protocol.TestFrozenSectionsUnchanged.test_frozen_sections_hash_unchanged
    red_confirmed: false
    red_reason: >
      Freeze invariant: every literal this AC protects (input field names,
      skip_reason strings, the retryable-set statement, the three severity
      levels, and the Inputs / Investigation Budget / Severity / Output
      Schema / Read-only Constraint / Untrusted-Input sections, each frozen
      by sha256 of its exact pre-edit bytes) was already present and
      unchanged in review-protocol.md before any task0004 edit -- there is
      no red state to observe for "must not change". These tests were run
      immediately after AC-1's edit and confirmed still green, which is what
      proves AC-1's edit did not regress AC-2; TestValidationDetectsRegressions
      separately proves the section-hash/extraction helpers themselves are
      capable of failing (run against deliberately mutated input inside
      assertRaises).
