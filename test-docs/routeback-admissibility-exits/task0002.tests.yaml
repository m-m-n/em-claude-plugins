notes: >-
  Site B: adopted branch 1 (defined Agent-index lookup) rather than branch
  2 (no lookup) -- it reuses the document's existing Agent-index /
  stop-tool-recorder machinery with only a citation-level addition, and
  avoids the alternative's awkward "no live agent to stop, yet a stop
  mechanism still fires" framing that does not hold once the caveat's own
  premise ("no corresponding implementer in flight") is taken seriously.
  Site C: kept the I.2.c third conjunct unchanged (never narrowed) rather
  than narrowing it -- narrowing it would have reopened exactly the
  recycled-id-inherits-`merged` trap D1 was designed to close, since
  `queue_launch_guard.py` denies a `merged`-last-event launch
  unconditionally regardless of any orchestrator-side reclassification
  (verified against the document's own hook-classification prose; no hook
  source was read or modified). Instead, I.2.b step 1 now reconciles an
  ancestor-check failure as `failed` (folding it into the ordinary
  retry/route-back/abort menu), and choosing retry for that task reaches
  the pre-existing "Failure containment" harness-level-failure diagnostic
  path (a permission denial from the launch guard) -- an outcome distinct
  from both gate-rejected and abort, reached without selecting abort, as
  AC-4 requires.
