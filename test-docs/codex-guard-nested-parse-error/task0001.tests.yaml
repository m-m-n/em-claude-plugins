  AC-3:
    tests:
      - tests.test_codex_hook_interactive_guard.TestCasesTable.test_cases_run_against_both_copies
    red_confirmed: true
    red_reason: >-
      Added `python3 2147483648>/dev/null` as a silent row and ran it against
      the unchanged guard: both copies printed a deny decision (the word was
