acceptance_tests:
  AC-1:
    tests:
      - tests.test_codex_hook_interactive_guard.TestCasesTable.test_cases_run_against_both_copies
    red_confirmed: true
    red_reason: >-
      Added the six deny entries of AC-1 (`zsh -c 'function { python3 -i; }'`,
      `zsh -c 'function () { python3 -i; } arg'`,
      `zsh -c 'function { python3 -i; } arg'`,
      `zsh -c '! function { python3 -i; }'`, `zsh -c '() { python3 -i; } arg'`
      and `zsh -c 'function ()\n{ python3 -i; } arg'`) to CASES and ran the
      unchanged guard: both copies printed nothing for each of them, and the
      subtests errored with `json.decoder.JSONDecodeError: Expecting value:
      line 1 column 1 (char 0)` instead of reading a deny decision.
  AC-2:
    tests:
      - tests.test_codex_hook_interactive_guard.TestCasesTable.test_cases_run_against_both_copies
    red_confirmed: true
    red_reason: >-
      Added the AC-2 entries to CASES and ran the unchanged guard. The deny
      entry `zsh -c 'echo x | function { python3 -i; }'` printed nothing and
      errored with `JSONDecodeError: Expecting value: line 1 column 1 (char
      0)`. The silent entries `zsh -c 'echo x | function () { python3; }'` and
      `zsh -c 'echo x | () { python3; }'` failed on `assertEqual(out, "")`
      because the unchanged guard printed a deny object (the pipe connection
      was lost at the `function` / `()` head). Three entries of the criterion
      already passed before the change and only guard against reading the
      connection too broadly: the silent `echo x | function { python3; }` and
      `echo x | function { { python3; }; }` (the body was never opened as a
      group, so nothing was judged), and the deny `echo x | function { cat; };
      python3` (the program-less `python3` after `;` is not connected).
  AC-3:
    tests:
      - tests.test_codex_hook_interactive_guard.TestCasesTable.test_cases_run_against_both_copies
    red_confirmed: false
    red_reason: >-
      Regression guards for readings that pre-existed: every entry of this
      criterion (the silent `function { echo hi; } python3`, `function () {
      python3; } arg < f`, `function f { python3 -i; }`, `'function' {
      python3 -i; }`, `{ python3 -i; } arg`, `f() { python3 -i; } arg`,
      `function f () { python3 -i; } arg`, and the deny `function { :; } arg;
      python3 -i`) already passed on the unchanged guard, so no red state
      occurred. The deny `function { :; } arg; python3 -i` passed because the
      `{` was not yet opened as a group (the `}` was an ordinary word and the
      later `python3 -i` was judged); it guards a parser that opens the body
      but lets the argument span swallow the command after `;`.
  AC-4:
    tests:
      - tests.test_codex_hook_interactive_guard.TestCasesTable.test_cases_hold_both_a_deny_and_a_silent_case
      - tests.test_codex_hook_interactive_guard.TestCasesTable.test_cases_are_unique
      - tests.test_codex_hook_interactive_guard.TestCasesTable.test_cases_run_against_both_copies
    red_confirmed: true
    red_reason: >-
      With the 20 new entries (8 deny and 10 silent of FR7, plus the two extra
      commands of AC-3) in CASES and no parser change,
      `test_cases_run_against_both_copies` failed (14 errors and 4 failures
      over the two copies: see AC-1 and AC-2); the uniqueness and
      both-verdicts tests passed. That the entries are present and that no
      earlier entry changed is read from the diff, which only appends to
      CASES; no executable check fails when an entry is missing.
  AC-5:
