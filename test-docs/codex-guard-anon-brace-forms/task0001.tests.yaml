      - tests.test_codex_hook_interactive_guard.TestMalformedAndDeepInput.test_a_long_run_of_reserved_words_before_a_paren_is_answered
      - tests.test_codex_hook_interactive_guard.TestNoRecursion.test_no_function_calls_itself_and_no_functions_form_a_cycle
      - tests.test_codex_hook_interactive_guard.TestStaticConstraints.test_each_copy_stays_within_the_constraints
      - tests.test_codex_hook_interactive_guard.TestGuardDocumentation.test_the_names_function_docstring_states_the_extglob_rule
