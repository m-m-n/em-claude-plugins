acceptance_tests:
  AC-1:
    tests:
      - tests.test_codex_wrapper_model_flag.EffortOptionLaunchTest.test_readonly_effort_replaces_the_xhigh_pair
    red_confirmed: true
    red_reason: >-
      Before the wrapper edit, both plugin copies answered
      `readonly --effort high "prompt"` with exit 1 and
      "ERROR: Unknown flag '--effort'", so the test failed with
      AssertionError: 1 != 0 : ERROR: Unknown flag '--effort' for em-workflow
      and for em-review.
  AC-2:
    tests:
      - tests.test_codex_wrapper_model_flag.EffortDefaultUnchangedTest.test_readonly_without_effort_keeps_one_xhigh_pair_after_the_sandbox_pair
      - tests.test_codex_wrapper_model_flag.EffortDefaultUnchangedTest.test_readwrite_without_effort_has_no_effort_element
      - tests.test_codex_wrapper_model_flag.EffortDefaultUnchangedTest.test_litellm_route_without_effort_keeps_the_mode_default
      - tests.test_codex_hook_wrapper_args.TestConfigIsolationIsPreserved.test_reasoning_effort_override_is_still_present_in_readonly
      - tests.test_codex_hook_wrapper_args.TestStopRegistrationLeavesTheLaunchContractAlone.test_stop_ac5_isolation_flags_and_overrides_survive_next_to_the_stop_value
      - tests.test_codex_wrapper_single_invocation.TestArgumentHandlingSurfaceUnchanged.test_accepted_flag_set_on_the_launch_is_unchanged
    red_confirmed: false
    red_reason: >-
      The criterion is "the default argv does not move" (NFR1, D3), so the
      behavior pre-exists and no red state occurred: all six tests passed
      before the wrapper edit and were kept green through it. The three new
      tests pin the exact single xhigh pair directly after the sandbox pair,
      the absence of any effort element in readwrite, and both on the
      --litellm route; the three existing tests are the argv tests named in
      the criterion and their argv assertions are not edited.
      tests/test_codex_litellm_launch_home_location.py and
      tests/test_codex_repo_hook_trust.py (searched by relative path and by
      basename) carry no effort assertion; they read the same wrapper files
      and stayed green.
  AC-3:
    tests:
      - tests.test_codex_wrapper_model_flag.EffortOptionLaunchTest.test_readwrite_effort_adds_one_pair
      - tests.test_codex_wrapper_model_flag.EffortOptionLaunchTest.test_litellm_route_effort_replaces_the_xhigh_pair
      - tests.test_codex_wrapper_model_flag.EffortOptionLaunchTest.test_litellm_route_accepts_effort_before_litellm
      - tests.test_codex_wrapper_model_flag.EffortOptionLaunchTest.test_model_with_litellm_still_exits_1_when_effort_is_given
    red_confirmed: true
    red_reason: >-
      Before the wrapper edit every case failed on "ERROR: Unknown flag
      '--effort'" (AssertionError: 1 != 0 for the readwrite and the litellm
      launches; for the -m plus --litellm case the unknown-flag error came
      before the "-m and --litellm cannot be combined" error the test expects).
  AC-4:
    tests:
      - tests.test_codex_wrapper_model_flag.EffortValueRejectionTest.test_missing_value_is_rejected_with_one_fixed_line
      - tests.test_codex_wrapper_model_flag.EffortValueRejectionTest.test_non_matching_value_is_rejected_with_one_fixed_line
      - tests.test_codex_wrapper_model_flag.EffortValueRejectionTest.test_litellm_route_rejects_a_non_matching_value
      - tests.test_codex_wrapper_model_flag.EffortValueRejectionTest.test_the_rejected_value_is_never_echoed
    red_confirmed: true
    red_reason: >-
      Before the wrapper edit the missing-value and non-matching-value cases
      failed with AssertionError: "ERROR: Unknown flag '--effort'\n" !=
