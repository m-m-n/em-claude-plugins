      - tests.test_codex_wrapper_model_flag.EffortCombinationTest.test_the_last_effort_wins_on_the_litellm_route
    red_confirmed: true
    red_reason: >-
      Before the wrapper edit every order of the four option groups failed
      with the unknown-flag exit 1 ("AssertionError: 1 != 0 : ERROR: Unknown
      flag '--effort'"), and the repeated-option cases failed the same way.
  AC-6:
    tests:
      - tests.test_codex_hook_wrapper_args.TestWrapperContractIsUnchanged.test_usage_text_is_unchanged
      - tests.test_codex_wrapper_single_invocation.TestArgumentHandlingSurfaceUnchanged.test_missing_all_arguments_produces_usage_message
      - tests.test_codex_wrapper_single_invocation.TestArgumentHandlingSurfaceUnchanged.test_mode_only_with_no_further_args_produces_usage_message
      - tests.test_codex_wrapper_model_flag.EffortWrapperTextTest.test_each_wrapper_documents_the_effort_option_in_its_header
      - tests.test_codex_wrapper_model_flag.EffortWrapperTextTest.test_each_wrapper_has_codex_exec_once_in_non_comment_lines
    red_confirmed: true
    red_reason: >-
      With the three pinned usage literals refreshed and the wrappers not yet
      edited, test_usage_text_is_unchanged failed for both copies (the old
      usage line lacked "[--effort LEVEL]"), both usage-message tests in
      test_codex_wrapper_single_invocation failed the same way, and the header
