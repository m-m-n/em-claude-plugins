      The codex-exec-once test already held and stays green (D5).
  AC-7:
    tests:
      - tests.test_codex_wrapper_model_flag.EffortTestModuleIsStdlibOnlyTest.test_this_module_imports_only_the_standard_library
      - tests.test_codex_wrapper_model_flag.EffortTestModuleIsStdlibOnlyTest.test_the_import_reader_flags_a_third_party_import
    red_confirmed: false
    red_reason: >-
      The criterion constrains the new tests themselves (standard library and
