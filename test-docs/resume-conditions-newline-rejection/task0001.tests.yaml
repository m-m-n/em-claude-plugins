acceptance_tests:
  AC-1:
    tests:
      - test_batch_stop_contract.TestConsumerConstraints.test_own_rules_preamble_stated
      - test_batch_stop_contract.TestOwnRulesPreambleMatcherNegativeProof.test_forged_pre_change_preamble_is_otherwise_well_formed
      - test_batch_stop_contract.TestOwnRulesPreambleMatcherNegativeProof.test_forged_pre_change_preamble_is_rejected
    red_confirmed: true
    red_reason: >-
      test_own_rules_preamble_stated raised AssertionError: 'cannot fire'
      unexpectedly found in <own-rules text> -- the pre-change document
      still carried the blanket "Each of the four cannot fire ..." claim,
      so the new matcher correctly rejected it before the document was
      edited.

  AC-2:
    tests:
      - test_batch_stop_contract.TestConsumerConstraints.test_detail_own_rule_states_line_terminator_and_normalization_reason
    red_confirmed: true
    red_reason: >-
      AssertionError: '`detail` rejects a line terminator' not found in
      <own-rules text> -- the pre-change document only carried the shared
      "`detail` and `resume_conditions` each reject ..." bullet, not
      `detail`'s own bullet with the normalization reason.

  AC-3:
    tests:
      - test_batch_stop_contract.TestConsumerConstraints.test_resume_conditions_exemption_stated
      - test_batch_stop_contract.TestResumeConditionsExemptionMatcherNegativeProof.test_carried_over_text_alone_does_not_satisfy_the_matcher
      - test_batch_stop_contract.TestResumeConditionsExemptionMatcherNegativeProof.test_forged_pre_change_bullet_is_otherwise_well_formed
      - test_batch_stop_contract.TestResumeConditionsExemptionMatcherNegativeProof.test_forged_pre_change_bullet_is_rejected
    red_confirmed: true
    red_reason: >-
      test_resume_conditions_exemption_stated raised AssertionError:
      'CR (U+000D)' not found in <own-rules text> -- the pre-change
      document's shared bullet named no exempted code points at all.

  AC-4:
    tests:
      - test_batch_stop_contract.TestEscapingAndResultFormatByteIdentical.test_result_format_section_unchanged
      - test_batch_stop_contract.TestEscapingAndResultFormatByteIdentical.test_escaping_section_unchanged
      - test_batch_stop_contract.TestConsumerConstraints.test_five_carried_over_constraints_still_present_and_still_five
      - test_batch_stop_contract.TestFieldValuesBulletOrderAndDerivations.test_resume_conditions_bullet_states_normalization_not_applied
    red_confirmed: false
    red_reason: >-
      TDD-awkward per the task plan's Test Notes: these are pure
      regression guards over text this task deliberately leaves
      untouched (`## Result format`, `## Escaping`, the five
      carried-over numbered constraints, the `resume_conditions` bullet
      in `## Field values`). They already existed, already passed before
      this task's edit, and continue to pass after it -- a negative
      proof over retained wording would assert nothing new. Absence of
      cross-section contradiction was checked by re-reading `## Field
      values`, `## Escaping`, `## Result format` and the updated
      `## Consumer constraints` together after the edit; no dedicated
      test exists for that global property, only the itemised matchers
      above.

  AC-5:
    tests:
      - test_batch_stop_contract.TestConsumerConstraints.test_own_hardening_rules_stated
      - test_batch_stop_contract.TestOwnHardeningRulesMatcherNegativeProof.test_carried_over_text_alone_does_not_satisfy_the_matcher
      - test_batch_stop_contract.TestOwnHardeningRulesMatcherNegativeProof.test_forged_partial_rules_is_otherwise_well_formed
      - test_batch_stop_contract.TestOwnHardeningRulesMatcherNegativeProof.test_forged_partial_rules_missing_shape_checks_is_rejected
    red_confirmed: false
    red_reason: >-
      Per FR7/FR8 the existing matcher's assertions are unchanged and the
      forged sample is only mechanically reworded to the new two-bullet
      style; both the matcher (against the real document) and the
      updated forged sample's rejection point (missing shape defenses,
      not control-code-point wording) already held before this task's
      document edit and continued to hold after it -- there was no
      red state to observe for this compatibility requirement.

  AC-6:
    tests:
      - test_batch_stop_contract.TestOwnRulesPreambleMatcherNegativeProof.test_forged_pre_change_preamble_is_otherwise_well_formed
      - test_batch_stop_contract.TestOwnRulesPreambleMatcherNegativeProof.test_forged_pre_change_preamble_is_rejected
      - test_batch_stop_contract.TestConsumerConstraints.test_own_rules_preamble_stated
      - test_batch_stop_contract.TestResumeConditionsExemptionMatcherNegativeProof.test_carried_over_text_alone_does_not_satisfy_the_matcher
      - test_batch_stop_contract.TestResumeConditionsExemptionMatcherNegativeProof.test_forged_pre_change_bullet_is_otherwise_well_formed
      - test_batch_stop_contract.TestResumeConditionsExemptionMatcherNegativeProof.test_forged_pre_change_bullet_is_rejected
      - test_batch_stop_contract.TestConsumerConstraints.test_resume_conditions_exemption_stated
    red_confirmed: true
    red_reason: >-
      Both new matchers' positive assertions (against the real document)
      failed before the document edit (see AC-1/AC-3); both matchers'
      negative-proof tests were green from the start because they assert
      against a forged literal captured from the pre-change wording,
      independent of the real document file.

  AC-7:
    tests: []
    red_confirmed: false
    red_reason: >-
      Verifiable outcome is a full-suite regression check, not a single
      test: `python3 -m unittest discover -s tests` was run before any
      edit (4812 tests, 5 failures recorded as baseline_failures above)
      and again after this task's changes (4820 tests -- 8 new tests
      added by this task, 5 failures, identical set to
      baseline_failures). `git diff --stat` shows only
      `em-workflow/references/batch-terminal-line.md` and
      `tests/test_batch_stop_contract.py` changed -- no runtime script,
      hook or skill file. The added test code's only imports are `os`,
      `re`, `unittest` and `pathlib` (all standard library).

notes: >-
  AC-4 and AC-5 are compatibility/regression requirements with no
  observable red state (see their red_reason above); this mirrors the
  task plan's own "TDD-awkward item" callout for AC-4 and was found to
  apply equally to AC-5 (FR7/FR8), whose matcher code and rejection
  point were unchanged by this task -- only the forged sample's wording
  was updated to track the new document text.
