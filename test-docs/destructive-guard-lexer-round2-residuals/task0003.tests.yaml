    red_reason: "After the case-table commit 6901335b and before any hook commit, the runner reported 628/631 with FAIL on the three new cases: got=allow, expected deny (the old reading closed the body at the decoy END / E line and skipped the rm -rf line). The placement test reads the table by command text and label."
