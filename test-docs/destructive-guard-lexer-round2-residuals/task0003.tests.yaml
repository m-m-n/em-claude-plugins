      - TestHeredocDelimiterWords.test_whole_word_delimiter_forms_are_denied_with_and_without_batch
    red_confirmed: true
    red_reason: "Against the unchanged hook: AssertionError '<<END' != '<<END-X' (operator text), 'END' != 'END-X' (delimiter) and 'allow' != 'deny' for both batch off and on."
  AC-3:
    tests:
      - TestHeredocDelimiterWords.test_variant_delimiter_words
      - TestHeredocDelimiterWords.test_variant_delimiter_forms_are_denied
    red_confirmed: true
    red_reason: "Against the unchanged hook nine of the ten variants failed ('<<E' != '<<E\"X\"', '<<E' != '<<E$X', 0 != 1 operators for <<\\EOF, <<'E-X', <<'', ...). The word-only <<-EOF variant with a tab-indented close line was green before the change (its behavior pre-existed); the <<-END-X variant of the same shape went red."
  AC-4:
    tests:
      - TestHeredocDelimiterWords.test_unreadable_delimiter_words_take_no_body
      - TestHeredocDelimiterWords.test_a_quote_not_closed_on_the_operators_line_takes_no_body
      - TestHeredocDelimiterWords.test_a_later_readable_operator_is_read_after_an_unreadable_one
      - TestHeredocDelimiterWords.test_a_delimiter_holding_a_blank_finds_no_close_line
    red_confirmed: true
    red_reason: "Against the unchanged hook six unreadable forms failed (word holding $( , a backtick, ${, $((, $[, or a backslash-newline: AssertionError 12 is not None, an operator took a body, and the verdict was allow). The no-word forms (cat <<, cat <<-, cat << ;) and the unclosed-quote forms were green before the change: their expected map was recorded from the base before editing the hook and the test pins that it is unchanged."
  AC-5:
    tests:
      - TestHeredocDelimiterWords.test_close_line_is_the_delimiter_with_optional_blanks_only
      - TestHeredocDelimiterWords.test_close_line_index_accepts_non_word_values
      - TestHeredocDelimiterWords.test_word_delimiters_keep_their_reading
    red_confirmed: true
    red_reason: "Against the unchanged hook: delimiter 'END' != 'END-X' / 'E' != 'E.X' for the close-line test and KeyError 'END-X' for the line index. test_word_delimiters_keep_their_reading (word-only delimiters unchanged) was green before and after, as intended."
  AC-6:
    tests:
      - TestHeredocDelimiterWords.test_lexing_work_is_linear_for_non_word_delimiters
      - TestHeredocDelimiterWords.test_lexing_work_is_linear_for_unreadable_words
    red_confirmed: true
    red_reason: "The non-word test also asserts that every one of the 400 operators finds its close line (body_start is not None); against the unchanged hook that assertion failed, so the work bound is measured on the real close-line path. The unreadable-word linearity test was green before the change."
  AC-7:
