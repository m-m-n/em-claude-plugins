  AC-6:
    tests: []
    red_confirmed: false
    red_reason: "No executable check in the repository can be made to fail for this criterion: it asks for a manual confirmation of the five case commands on bash 5.3 (rm replaced by echo), and no existing test (searched tests/ and em-workflow/hooks/tests/ by the paths and basenames destructive-guard.py, destructive-guard-cases.json and destructive_guard) runs bash. Done by hand on GNU bash 5.3.9 with echo in place of rm: cat <<E${x} (body line expands the command substitution, the line after E${x} runs); cat <<E`x` (the ' line is body and the line after E`x` runs); cat <<END-X and cat <<END (the blank-indented line stays in the body, the body closes at the last line); cat <<E' X' (body 'hello', closes at E X). All five confirmed."
