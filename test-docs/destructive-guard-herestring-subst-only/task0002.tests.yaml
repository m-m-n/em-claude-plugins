acceptance_tests:
  AC-1:
    tests:
      - "tests.test_destructive_guard_command_substitution.TestRunnerTimeoutDerivation.test_runner_invocation_receives_the_derived_finite_timeout"
    red_confirmed: true
    red_reason: >
      実装前（呼び出しは固定 120 秒、導出関数は 120 を返す状態）に実行して失敗を観測した。
      AssertionError: 120 not greater than or equal to 457。subprocess.run の代役に記録させた
      timeout キーワード引数が、ケース数（457）を下回っていた。
  AC-2:
    tests:
      - "tests.test_destructive_guard_command_substitution.TestRunnerTimeoutDerivation.test_derived_timeout_is_finite_and_covers_every_case"
    red_confirmed: true
    red_reason: >
      実装前（導出が固定 120 秒）に実行して失敗を観測した。
      AssertionError: 120 not greater than or equal to 457 : 120 s cannot cover 457 cases at 1 s each。
      導出を固定 120 秒に戻すとこのテストが落ちることは、この観測そのもの。
  AC-3:
    tests:
      - "tests.test_destructive_guard_command_substitution.TestRunnerTimeoutDerivation.test_runner_invocation_arguments_unchanged"
      - "tests.test_destructive_guard_command_substitution.TestRunnerTimeoutDerivation.test_runner_test_still_fails_on_nonzero_exit_or_a_failing_case"
