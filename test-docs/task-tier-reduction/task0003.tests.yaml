acceptance_tests:
  AC-1:
    tests:
      - test_tier_decision_step_a.TestAC1PlacementAndInvocations
      - test_tier_decision_step_a.TestAC1MatchersCanFail
    red_confirmed: true
    red_reason: >-
      Before the implementation existed, the whole test module failed to
      even import: `_section(SKILL_TEXT, "### tier 決定", "## Step A.5")`
      raised `ValueError: substring not found` at module load time (the
      section did not exist), verified by stashing the two doc edits
      (`em-workflow/skills/develop/SKILL.md`,
      `em-workflow/references/phase-state.md`) with the new test file kept,
      and running `python3 -m unittest tests.test_tier_decision_step_a`.
      Every test in this module, including AC-1's, is collectively red for
      that reason before the implementation.
  AC-2:
    tests:
      - test_tier_decision_step_a.TestAC2AvailabilityAndThresholds
      - test_tier_decision_step_a.TestAC2MatchersCanFail
    red_confirmed: true
    red_reason: "Same module-import-level red as AC-1 (see AC-1's red_reason) -- the availability/threshold assertions read TIER_SECTION, which did not exist before the implementation."
  AC-3:
    tests:
      - test_tier_decision_step_a.TestAC3Persistence
      - test_tier_decision_step_a.TestAC3MatchersCanFail
    red_confirmed: true
    red_reason: "Same module-import-level red as AC-1. Additionally, `TIER_PERSISTENCE_SECTION` depends on `## tier decision persistence` in references/phase-state.md, which also did not exist before the implementation."
  AC-4:
    tests:
      - test_tier_decision_step_a.TestAC4NoWorkStop
      - test_tier_decision_step_a.TestAC4MatchersCanFail
    red_confirmed: true
    red_reason: >-
      Same module-import-level red as AC-1. This AC's implementation went
      through a second, narrower red-green cycle after the first green: the
      initial wording literally restated the `no-step` sentinel token
      (`結果は停止状態と no-step センチネルを持ち`), which is a
      whole-file-forbidden contract literal per
      tests/test_batch_quiet_output_skill_wiring.py's
      `_find_forbidden_literal_violations` (and two sibling guards in
      tests/test_batch_stop_contract_skill_wiring.py and
      tests/test_develop_once_option.py) -- observed as 4 concrete
      regressions (`test_no_violation_over_whole_file`,
      `test_replacement_names_no_state_value`,
      `test_guard_raises_no_violation_over_whole_skill_md`,
      `test_no_sc5_literal_anywhere_in_skill_md`), each reporting
      `AssertionError: Lists differ: ["sentinel value 'no-step' restated"]
      != []`. Fixed by rephrasing to describe the sentinel concept without
      the literal token, and this module's own matcher/test were updated to
      match; the whole suite was re-run and returned to exactly the 10
      baseline failures.
  AC-5:
    tests:
      - test_tier_decision_step_a.TestAC5RetrospectSignals
      - test_tier_decision_step_a.TestAC5MatchersCanFail
    red_confirmed: true
    red_reason: "Same module-import-level red as AC-1 (RETROSPECT_START/STEP_C_START slicing still succeeds pre-change since those headings pre-exist, but the module fails to import before any of its tests can run, per AC-1's red_reason); the retrospect-section content assertions (tier_decision key, fields, out-of-scope prose) target text this task added."
  AC-6:
    tests:
      - test_tier_decision_step_a.TestAC6StandaloneParityAndNoGate
      - test_tier_decision_step_a.TestAC6MatchersCanFail
    red_confirmed: true
    red_reason: "Same module-import-level red as AC-1 -- the standalone-parity and no-gate assertions read TIER_SECTION, which did not exist before the implementation."
  AC-7:
    tests:
      - test_tier_decision_step_a.TestOwnModuleStdlibOnly
      - test_tier_decision_step_a.TestRegionOwnershipRegression
      - test_tier_decision_step_a.TestRegionOwnershipMatchersCanFail
    red_confirmed: true
    red_reason: >-
      The module-discovery / stdlib-only outcome is a build-time property
      of the test file itself (verifiable outcome rather than a behavior
      red-green cycle): `python3 -m unittest discover -s tests` failing to
      import the module before the implementation (AC-1's red_reason) is
      the negative case; after the implementation, the module is discovered
      and every one of its 68 tests passes, and `ast`-based inspection
      confirms only stdlib imports (`ast`, `re`, `sys`, `unittest`,
      `pathlib`). The region-ownership regression tests were green from the
      start (they pin pre-existing, untouched anchor text) and are
      documentation-conformance style outcomes rather than red-green
      criteria; their non-vacuity is proven by
      TestRegionOwnershipMatchersCanFail instead.
