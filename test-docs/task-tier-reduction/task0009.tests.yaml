acceptance_tests:
  AC-1:
    tests:
      - test_tier_worktree_bootstrap.TestAC1Ordering.test_tier_section_exists
      - test_tier_worktree_bootstrap.TestAC1Ordering.test_securing_step_present
      - test_tier_worktree_bootstrap.TestAC1Ordering.test_securing_step_between_no_work_stop_and_persistence
      - test_tier_worktree_bootstrap.TestAC1Ordering.test_both_routes_converge_into_the_shared_procedure
