      - tests.test_tier_decision_record.TestMappingTableSingleOwnership.test_skill_tier_decision_procedure_cites_the_mapping_table_by_path
      - tests.test_tier_decision_record.TestMappingTableSingleOwnership.test_skill_retrospect_signal_cross_references_the_citing_procedure_step
