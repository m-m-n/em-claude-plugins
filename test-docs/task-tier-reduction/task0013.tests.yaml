      test_skill_procedure_uses_only_rules_file_values,
      test_skill_retrospect_signal_uses_only_rules_file_values and
      test_divergent_spelling_absent_from_the_whole_plugin_tree would all
      have failed their assertNotIn(DIVERGENT_BASIS, ...) / assertEqual([],
      offenders) checks pre-change.
  AC-4:
    tests:
      - tests.test_tier_decision_record.TestPersistedRecordPathConsistent.test_correct_path_appears_in_workflow_schema
      - tests.test_tier_decision_record.TestPersistedRecordPathConsistent.test_correct_path_appears_in_create_spec_phase
      - tests.test_tier_decision_record.TestPersistedRecordPathConsistent.test_correct_path_appears_in_phase_state
      - tests.test_tier_decision_record.TestPersistedRecordPathConsistent.test_correct_path_appears_in_skill
      - tests.test_tier_decision_record.TestPersistedRecordPathConsistent.test_wrong_order_path_absent_from_the_whole_plugin_tree
      - tests.test_tier_decision_record.TestPersistedRecordPathConsistent.test_negative_proof_forged_sample_with_wrong_order_is_detected
