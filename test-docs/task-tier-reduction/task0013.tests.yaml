      failed pre-change. tests.test_tier_workflow_schema's
      test_cites_persisted_state_locations was an existing pinned
      assertion on the old (wrong-order) path string; it was updated in
      this task per the task plan's Test Notes and is included here as the
      regression-guard half of AC-4, not a novel red.
  AC-5:
    tests:
      - tests.test_tier_decision_record.TestTwoReadingProcedureAttributesToEvaluatorContract.test_states_two_invocations
      - tests.test_tier_decision_record.TestTwoReadingProcedureAttributesToEvaluatorContract.test_states_the_basis_each_invocation_corresponds_to
      - tests.test_tier_decision_record.TestTwoReadingProcedureAttributesToEvaluatorContract.test_states_what_is_compared_between_the_two_readings
      - tests.test_tier_decision_record.TestTwoReadingProcedureAttributesToEvaluatorContract.test_states_disagreement_resolves_to_full
      - tests.test_tier_decision_record.TestTwoReadingProcedureAttributesToEvaluatorContract.test_attributes_the_resolution_to_the_evaluators_input_contract
      - tests.test_tier_decision_record.TestTwoReadingProcedureAttributesToEvaluatorContract.test_old_mixed_into_availability_fallback_phrasing_is_gone
      - tests.test_tier_decision_record.TestTwoReadingProcedureAttributesToEvaluatorContract.test_non_vacuity_old_phrase_would_be_found_in_a_forged_pre_change_copy
      - tests.test_tier_decision_record.TestTwoReadingProcedureAttributesToEvaluatorContract.test_negative_proof_synthetic_procedure_missing_attribution_is_detected
    red_confirmed: true
    red_reason: >-
      Confirmed against git HEAD's pre-change text: SKILL.md step 6 (the
      availability-fallback step) carried the sentence "判定スキルが使用
      不可、または Codex 事前調査が使用不可で 2 本の判定結果が割れた場合、
      あるいはフォールバック表が解決しないその他の条件は すべて、何も
      引かない tier（`full`）を採用する。" -- the two-reading disagreement
      rule folded into the availability paragraph with no mention of
      "評価器の入力契約" (the evaluator's input contract) anywhere in the
      tier-decision procedure. test_attributes_the_resolution_to_the_evaluators_input_contract
      and test_old_mixed_into_availability_fallback_phrasing_is_gone would
      both have failed pre-change (the phrase was present where the test
      now asserts absence, and the attribution phrase was absent where the
      test now asserts presence).
  AC-6:
    tests:
      - tests.test_tier_decision_record.TestModuleIsStdlibOnlyAndDiscoverable.test_only_standard_library_imports
      - tests.test_tier_decision_record.TestModuleIsStdlibOnlyAndDiscoverable.test_module_file_name_matches_discovery_convention
    red_confirmed: false
    red_reason: >-
      AC-6 describes a structural property of this new test module itself
      (every matcher paired with a negative proof and a non-vacuity guard;
      stdlib-only imports) rather than a behavior of the product documents.
      There is no red state to observe for "this test file has the shape
      the plan requires" -- the module was written to satisfy it directly.
      The AC's substance is verified by inspection of the test module's own
      structure (every TestCase above pairs a positive assertion with a
      test_negative_proof_* and a test_non_vacuity_* method) rather than by
      a red-to-green transition of its own.
  AC-7:
    tests: []
    red_confirmed: false
    red_reason: >-
      AC-7 is the whole-suite verification gate, not a single behavior with
      its own red state. Verified by running
      `python3 -m unittest discover -s tests` before any change (baseline:
      10 failures + 1 load error, recorded above) and after all changes
      (final: the identical 10 failures + 1 load error, plus the new
      test_tier_decision_record.py module's 43 tests and the updated
      test_tier_workflow_schema.py all green) -- final_failures is exactly
      equal to (a subset of) baseline_failures.
notes: >-
  A genuine regression was caught and fixed during implementation, not
  reported as a deviation: the first version of the SKILL.md retrospect-
  signal citation named `references/phases/create-spec-phase.md` directly
  inside the retrospect section, which made an existing pinned test
  (tests/test_retrospect_verification_handoff.py's
  TestCategoryDefinitionNotRedefined) fail -- that test forbids the
  `failed_items[].category` vocabulary word "spec" anywhere in the
  retrospect section, and "create-spec-phase.md" contains "spec" as an
  isolated token (hyphens are non-word characters, so `\bspec\b` matches
  inside "create-spec-phase"). Fixed by relocating the literal path
  citation to the tier-decision procedure's step 7 (outside the
  vocabulary-restricted retrospect section) and having the retrospect
  paragraph cross-reference that step instead of repeating the path. Full
  suite re-run confirmed the fix: final failing test set is exactly the
  11-item baseline, no more, no less.
