notes: >-
  Two issues were caught and fixed during implementation, before any merge
  attempt and during the one conflict-resolution cycle respectively:

  (1) Pre-merge: the first version of the SKILL.md retrospect-signal
  citation named `references/phases/create-spec-phase.md` directly inside
  the retrospect section, which made an existing pinned test
  (tests/test_retrospect_verification_handoff.py's
  TestCategoryDefinitionNotRedefined) fail -- that test forbids the
  `failed_items[].category` vocabulary word "spec" anywhere in the
  retrospect section, and "create-spec-phase.md" contains "spec" as an
  isolated token (hyphens are non-word characters, so `\bspec\b` matches
  inside "create-spec-phase"). Fixed by relocating the literal path
  citation to the tier-decision procedure's persistence step (outside the
  vocabulary-restricted retrospect section) and having the retrospect
  paragraph cross-reference that step instead of repeating the path.

  (2) During the merge conflict cycle (below): after adopting the parent's
  SKILL.md wholesale and re-implementing this task's steps 4/5 rewrite on
  top, task0009's own `tests/test_tier_worktree_bootstrap.py` (not in this
  task's `expected_files`) failed two tests --
  TestRegionOwnershipRegression.test_two_readings_step_unchanged and
  .test_evaluation_step_unchanged. That module pins the *exact pre-task0013
  text* of steps 4 and 5 as an anchor, with its own comment stating the
  intent is only to prove task0009's own diff left task0013's region
  untouched ("Pinned by anchor text so an unrelated future edit by
  task0013 to those regions does not spuriously fail this module once
  merged"). Since IMPLEMENTATION.md D3a explicitly assigns steps 4/5 to
  task0013, and this task's own plan (AC-5) mandates rewriting exactly
  that text, the two anchor constants (TWO_READINGS_ANCHOR,
  EVALUATION_ANCHOR) were updated to the new step 4/5 text -- the minimal
  change that keeps the anchors' stated intent (proving no *unrelated*
  drift) truthful. This is a deviation: the file is outside
  `expected_files` (it belongs to task0009).

  Conflict-resolution summary: one conflict cycle. `git merge
  em-workflow/task-tier-reduction/integration` conflicted only in
  em-workflow/skills/develop/SKILL.md (task0009 and task0012 had merged in
  the interim); em-workflow/references/phases/create-spec-phase.md and
  every other touched file auto-merged cleanly. Adopted the parent's
  SKILL.md wholesale, re-implemented this task's steps 4-6 rewrite and the
  retrospect-signal fixes on top (renumbered by task0009's inserted
  worktree-securing step: persistence is now step 8, not step 7 -- the
  SKILL.md cross-reference and this task's own test were both updated to
  name the step by its heading text, "永続化ステップ", rather than a
  fragile ordinal, to survive any future renumbering), fixed the
  test_tier_worktree_bootstrap.py region-ownership anchors above, then
  re-ran the full suite: final failing test set is exactly the original
  11-item baseline (test_tier_decision_step_a's load error plus the ten
  pre-existing failures), a strict subset of the refreshed 21-item
  baseline recorded above.
