    tests:
      - tests.test_tier_decision_record.TestMappingTableSingleOwnership.test_create_spec_phase_owns_the_mapping_table_heading
      - tests.test_tier_decision_record.TestMappingTableSingleOwnership.test_mapping_table_covers_every_persisted_record_field
