      - tests.test_tier_decision_record.TestBasisVocabularyUnified.test_phase_state_persistence_section_uses_only_rules_file_values
      - tests.test_tier_decision_record.TestBasisVocabularyUnified.test_skill_procedure_uses_only_rules_file_values
      - tests.test_tier_decision_record.TestBasisVocabularyUnified.test_skill_retrospect_signal_uses_only_rules_file_values
      - tests.test_tier_decision_record.TestBasisVocabularyUnified.test_divergent_spelling_absent_from_the_whole_plugin_tree
      - tests.test_tier_decision_record.TestBasisVocabularyUnified.test_negative_proof_forged_sample_with_divergent_spelling_is_detected
      - tests.test_tier_decision_record.TestBasisVocabularyUnified.test_non_vacuity_scan_actually_walks_plugin_files
    red_confirmed: true
    red_reason: >-
