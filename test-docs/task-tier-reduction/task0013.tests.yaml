      - tests.test_tier_decision_record.TestMappingTableSingleOwnership.test_non_vacuity_the_unique_phrase_would_be_found_if_present
    red_confirmed: true
    red_reason: >-
      Before this task, em-workflow/references/phases/create-spec-phase.md
      had no mapping table at all (no "**Tier-decision record mapping.**"
      heading), so test_create_spec_phase_owns_the_mapping_table_heading and
      every test that slices the section from it raised ValueError /
      assertion failures. Confirmed directly against git HEAD's pre-change
      copy of the four edited documents (extracted via `git show HEAD:...`
      to a scratch directory, since no commit had been made yet): the
      string "**Tier-decision record mapping.**" was absent from
      create-spec-phase.md.
  AC-2:
    tests:
      - tests.test_tier_decision_record.TestReductionsIsAProjectionNotAnEnumeration.test_tier_decision_still_carries_exactly_four_subfields_in_order
      - tests.test_tier_decision_record.TestReductionsIsAProjectionNotAnEnumeration.test_mapping_table_defines_reductions_as_a_projection_of_tier
      - tests.test_tier_decision_record.TestReductionsIsAProjectionNotAnEnumeration.test_reduction_table_enumeration_owned_solely_by_the_develop_skill
      - tests.test_tier_decision_record.TestReductionsIsAProjectionNotAnEnumeration.test_negative_proof_extra_subfield_is_detected
      - tests.test_tier_decision_record.TestReductionsIsAProjectionNotAnEnumeration.test_non_vacuity_enumeration_needle_would_be_found_if_duplicated
    red_confirmed: true
    red_reason: >-
      test_mapping_table_defines_reductions_as_a_projection_of_tier depends
      on the same not-yet-existing mapping table as AC-1 (ValueError before
      the edit: "**Tier-decision record mapping.**" not found in
      create-spec-phase.md's pre-change text). The exactly-four-subfields
      and reduction-table-ownership assertions were already true pre-change
      (task0002/task0005's prior work) and are carried here as regression
      guards for this task's own module, not novel reds; the AC's genuinely
      new claim -- that `reductions` is stated as a projection of `tier`
      through skills/develop/SKILL.md's reduction table -- is what
      test_mapping_table_defines_reductions_as_a_projection_of_tier proves
      red-to-green.
