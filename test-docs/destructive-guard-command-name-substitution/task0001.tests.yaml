acceptance_tests:
  AC-1:
    tests:
      - tests.test_destructive_guard_command_substitution.TestCaseTableDiscipline.test_runner_reports_every_case_passing
    red_confirmed: true
    red_reason: >-
      Added both case-table entries first and ran run-destructive-guard.py
      against the pre-implementation guard (after the case-table commit,
      before the analyzer commit): both FAILed with got=allow, reason
      "[destructive-guard] 破壊的なパターンに一致しない。" — head() was
      skipping the `.substitution_only` command-word token and landing on
      `-rf` as the "command word", which matched nothing. After the
      analyzer change both report got=deny with rule rm-recursive.
  AC-2:
    tests:
      - tests.test_destructive_guard_command_substitution.TestCaseTableDiscipline.test_runner_reports_every_case_passing
    red_confirmed: true
    red_reason: >-
      Same pre-implementation run as AC-1: both FAILed with got=allow
      (the substitution-headed `git` invocation was never routed to
      check_git() since head() landed on the bare subcommand word
      `reset`/`clean`, not `git`). After the analyzer change both report
      got=deny with rule git-reset-hard / git-clean respectively.
  AC-3:
    tests:
      - tests.test_destructive_guard_command_substitution.TestCaseTableDiscipline.test_runner_reports_every_case_passing
    red_confirmed: false
    red_reason: >-
      All eight already reported got=allow against the pre-implementation
      guard (none appear in its FAIL list — only TS-1..TS-4 and the FR6
      entry, AC-4/AC-5 below, failed). $(true) echo safe / env $(true) echo
      safe / git $(true) status were already correct pre-task (SPEC.md
      OBJ-4 baseline, unaffected by this task since their command word is
      found directly at position 0, no substitution skip). $(which ls) -la,
      $(which grep) -r pattern src, $(which rm) -rf dist and $(which rm)
      -rf /tmp/scratch/x are new command-word-substitution shapes, but they
      were ALREADY allow before this task too — not because the new routes
      ran and found nothing (they did not exist yet), but because the
      pre-task head() picked the dash-leading token itself (`-la`, `-r`,
      `-rf`) as a nonsensical "command word" that matched no existing check
      either. FR3's job here is to keep these allow AFTER the new routes
      exist (regression prevention, verified by the rm-route gate's
      dash+recursion+force+operand condition correctly excluding the first
      three, and check_rm()'s own pre-existing safe-route exception
      handling the last two via a structurally different path to the same
      verdict), not to flip them from red.
  AC-4:
    tests:
      - tests.test_destructive_guard_command_substitution.TestCaseTableDiscipline.test_runner_reports_every_case_passing
    red_confirmed: true
    red_reason: >-
      The first entry is the FR6 case-table flip (deny -> allow). Ran
      against the pre-implementation guard (after the case-table commit,
      before the analyzer commit): FAILed with
      got=deny "[destructive-guard/rm-recursive] `rm -r` の対象
      `/home/sakura/valuable` はスクラッチ領域の外。...". After the quote-aware
      extract_shell_payload() change it reports got=allow — the quoted
      `"$(cat script.sh)"` no longer promotes to the trailing
      `'rm -rf /home/sakura/valuable'` argument. The other four
      (eval x3, bash -c with no trailing argument) already reported
      got=allow pre-implementation and stay allow — eval's
      extract_shell_payload branch joins ALL of eval's own arguments
      regardless of quoting (matching real eval semantics), so there was
      no promotion bug for a single-argument eval payload, and a `-c`
      payload with nothing after it has nothing to promote TO either way;
      included here as regression-guard additions pinning "normal
      quoted-payload usage stays allow" for the same AC, not as a
      red->green demonstration in their own right — red_confirmed=true is
      earned by the FR6 entry, which is the one this AC's "with a
      rewritten label rather than being deleted" clause is actually about.
  AC-5:
    tests:
      - tests.test_destructive_guard_command_substitution.TestCaseTableDiscipline.test_runner_reports_every_case_passing
    red_confirmed: false
    red_reason: >-
      All four are pre-existing deny entries (unquoted promotion), untouched
      by this task per FR5's explicit "no behaviour change" requirement —
      TS-13 of VERIFICATION.md names these same four commands, already
      present verbatim before this task, so no new case-table entry was
      added for them. Verified they stayed deny across both the case-table
      commit and the analyzer commit (byte-identical got=deny both times),
      which is FR5's actual acceptance evidence — a regression guard, not a
      red->green test.
  AC-6:
    tests:
      - tests.test_destructive_guard_command_substitution.TestCaseTableDiscipline.test_runner_reports_every_case_passing
    red_confirmed: false
    red_reason: >-
      Verdict-only: the pre-existing entry's expected verdict (allow) never
      changes — only its label is rewritten, and extract_shell_payload()'s
      docstring gains the matching out-of-scope sentence ("a form whose
      substitution's expanded output itself becomes the script body is
      outside this hook's static analysis"). Confirmed by reading both
      changed locations side by side and confirming they state the same
      scope (not merely similar phrasing) — the Japanese label and the
      English docstring necessarily differ in wording, per VERIFICATION.md's
      own manual item M-1 ("a difference in scope, not merely in phrasing,
      is a failure"). Confirmed both mirror scripts
      (failed-run-cleanup-guard.py, muse_guard.py) are absent from `git
      status`/`git diff --stat` across every commit of this task, and that
      their own divergence-note docstrings were extended (head()'s and
      git_subcommand()'s "Mirrored in..." paragraphs) to name the new
      FR1/FR2 branches as equally local to this file. No test expresses
      "these two locations agree" or "the mirror scripts are byte-identical
      to their pre-change content" — a manual-inspection criterion per the
      task plan's Test Notes, not a red->green demonstration.
  AC-7:
    tests: []
    red_confirmed: false
    red_reason: >-
      Whole-suite/whole-table outcome, not a single test: ran
      `python3 em-workflow/hooks/tests/run-destructive-guard.py`
      (241/241 green — 228 pre-existing + 12 new entries + the FR6 flip +
      1 unattended-demotion) and `python3 -m unittest discover -s tests`
      (4596 tests, the same 6 pre-existing baseline failures and no others)
      after every commit of this task. Every pre-existing case keeps its
      expected verdict except the single FR6 entry — confirmed by the
      case-table diff (`git diff em-workflow/hooks/tests/destructive-guard-
      cases.json`): exactly one verdict field changed (FR6), plus two
      label-only rewrites (FR6's own label, and FR7's TS-12 label) with no
      other verdict field touched. The unattended-demotion case at the
      runner's tail ("無人実行では ask が deny に降格") still passes. Every
      scenario TS-1 through TS-13 exists in the case table in the
      three-element form (TS-1..TS-9, TS-11 newly added; TS-10/TS-12
      pre-existing entries retained with rewritten labels; TS-13's four
      commands already present verbatim, untouched) with no new runner file
      and no new import added to destructive-guard.py (verified: still only
      json/os/re/shlex/shutil/sys). `git diff --stat` across the whole task
      names only the four files in Scope. No unit test asserts this
      aggregate; verified by running both commands and reading their
      output/exit codes plus `git status`/`git diff --stat` after each
      commit.
  AC-8:
    tests: []
    red_confirmed: false
    red_reason: >-
      Version-bump criterion (FR10/NFR5): ran
      `python3 em-workflow/scripts/check-plugin-invariants.py .` before the
      version-bump commit (exit 0, green on the unbumped 0.1.79 state) and
      after (exit 0, still green) — the before/after pair the task plan's
      Test Notes specify as this criterion's equivalent of red-then-green,
      since the invariants script does not itself assert a specific version
      value. Compared the two version strings as parsed JSON values (not by
      trusting the edit): em-workflow/.claude-plugin/plugin.json and the
      em-workflow entry of .claude-plugin/marketplace.json both read equal
      values before the edit ("0.1.79" — no pre-existing mismatch to
      report) and both read "0.1.80" after, major/minor unchanged.
      em-review's marketplace entry stays "0.5.10", untouched. `git diff`
      for both files shows exactly the one version line each, no
      reformatting, no other field touched. No unit test exists for this
      criterion (none is added, per the task plan's own Test Notes: "AC-8
      has no unit test of its own and none is added").
