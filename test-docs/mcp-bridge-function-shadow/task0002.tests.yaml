      fourth form, the pin `$'mcp-bridge' <notion tail>` with no construct,
      gave allow before and gives allow after, so it is a pin and not a red.
      The unit test of the lifted ANSI-C command word, run against the
      unchanged hook, FAILed for all three subtests (plain spelling, hex
      escape, path) with AssertionError: 'inspected' != 'nothing'. After the
      change the three forms give deny and the unit tests pass.
  AC-2:
