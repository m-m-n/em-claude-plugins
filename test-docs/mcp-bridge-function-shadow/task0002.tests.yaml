    red_reason: >
      The criterion is a non-regression pin. The seven TS-27 runner cases
      (`$'mcp-bridge'` and `f() { :; }; $'mcp-bridge'` and `$'\x6dcp-bridge'`
      with the desktop-commander tail, `$"x" args`, `$"x" run --args-json ...`,
