    red_confirmed: true
    red_reason: >
      The four TS-21 runner cases were added to the case file before any hook
      change and run-destructive-guard.py (the runner that the first test
      executes over the whole table and asserts exits 0 with no FAIL line) was
      run directly against the unchanged hook: each of the three deny forms
