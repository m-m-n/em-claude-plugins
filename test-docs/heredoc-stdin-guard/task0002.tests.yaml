      - tests.test_heredoc_stdin_guard.TestRewriteOutputConformsToHookOutputSchema.test_conforms_to_the_hook_output_schema_fixture
    red_confirmed: true
    red_reason: >-
      Same run as AC-1: the guard emitted no hookEventName member at all
      (KeyError-equivalent -- the member-set assertion failed before the
      event-name value could even be checked), so the value assertion
      could not be reached until the member was added.
  AC-3:
    tests:
