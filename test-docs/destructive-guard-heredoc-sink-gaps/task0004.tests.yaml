  AC-5:
    tests: ["destructive-guard-cases.json lines 509-526 (b8fd289ca7750a04 task0004 AC-5), run by run-destructive-guard.py"]
    red_confirmed: true
    red_reason: "14 of 18 cases FAILed against the pre-change guard (expected deny, got allow): enable, standalone PATH, export PATH, space-before-parens definition, function NAME()( ... ), env PATH=, PATH+=, builtin alias, definitions inside a substitution (three spellings), alias inside a substitution, alias inside bash -c, alias in a sink heredoc body. Lines 509, 510, 511 and 516 (brace-bodied function definitions at the top level) already denied before the change, incidentally: the closing } is read as an unmatched group closer, which makes the whole chunk undetermined. The substitution-nested variants (lines 521-523) have no such closer in the outer chunk and are the red cases for the brace-bodied constructs."
  AC-6:
    tests: ["python3 em-workflow/hooks/tests/run-destructive-guard.py <pre-change guard copy> (against the guard at the task's start commit)"]
    red_confirmed: true
    red_reason: "The cases were committed before the guard change (commit 'task0004: add skipped-word sink and command-name override cases'). Run against the pre-change guard the runner reported 471/510: 39 FAIL, all of them added cases, including all five 511cd470522973d8 AC-7 forms and all five b8fd289ca7750a04 AC-8 forms. Per-case results are in added_cases below."
