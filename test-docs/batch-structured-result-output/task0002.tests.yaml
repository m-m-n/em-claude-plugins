      Non-packet gates table; fixed by requiring `key=`, a backtick-wrapped
      `key:`/`key=`, or the literal `key: "` form instead of a bare `key:`.
      The remaining whole-file SC5-absence tests and the two
      test_batch_stop_contract_skill_wiring tests are preventive/retained
