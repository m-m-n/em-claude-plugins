notes: >-
  Baseline was reconstructed AFTER edits had already begun (a process
  error: step 4a should have run before touching any file). Reconstruction
  method: `git stash push -u` on the four modified files, full-suite run,
  `git stash apply <sha>` to restore (not `git stash pop`, per the shared
  multi-worktree stash rule), stash entry left in place because `git stash
  drop` is blocked by this repository's destructive-guard hook (shared
  stash stack across worktrees) -- entry
  `stash@{0}: On em-workflow/batch-structured-result-output/task0002:
  task0002-baseline-check-20260920` is inert and can be dropped later by a
  human. That reconstructed 6-item set is preserved above as the tail of
  `baseline_failures` (it is also exactly `final_failures`, unchanged
  end-to-end). One merge conflict occurred on
  `tests/test_batch_quiet_output_discipline.py` against task0001's own
  deviation to the same file (task0001 had proactively retargeted
  `TestContractDocumentUnchangedExceptOneSentence` to its SC2 heading
  rewrite; this task's first pass had instead deleted that class, reasoning
  -- incorrectly -- that it was a stale D5-violating binding assertion).
  Resolved via the parent-side-adoption protocol: `git checkout --theirs`
  adopted task0001's file wholesale (commit 81927b2), which correctly kept
  `TestContractDocumentUnchangedExceptOneSentence` but also discarded this
  task's own retargeting of the same file; the refreshed post-adoption
  suite run (10 failures, the 4 conflict-induced ones now listed first in
  `baseline_failures` above, plus the same 6 pre-existing ones) is recorded
  as the new baseline per the protocol. This task's changes were then
  re-implemented on top of the adopted content (commit e071d9a) -- not
  diff-spliced back in -- discovering and fixing the `detail:` false
  positive documented under AC-1. The post-re-implementation run returned to
  exactly the same 6 pre-existing failures, a strict subset of the refreshed
  10-item baseline. One conflict cycle total (of the 3 allowed).
