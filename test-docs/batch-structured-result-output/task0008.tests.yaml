notes: >-
  This task rewrites the SSOT document's three sections ((a)-(h) of SC11)
  and its two owned guard modules together, so most new tests were
  authored against the finished document rather than in a strict
  per-assertion red/green loop performed live. Every NEW matcher's red
  state was instead confirmed retroactively, following the same method
  task0001's test record used for this same module: the finished matcher
  function was run directly against the pre-change document's text (saved
  via `git show HEAD:em-workflow/references/batch-terminal-line.md` to a
  scratch file before any edit, per Step 4a's baseline capture), and the
  resulting AssertionError and its message were captured (see each AC's
  red_reason above). AC-5 and AC-9 are the two criteria this task leaves
  substantively unchanged (regression guards, not new behavior), so they
  carry `red_confirmed: false` with the reason named rather than a
  fabricated red state.

  The task plan's baseline count differs slightly from what this
  implementer observed: AC-10 cites "the six that already fail at the
  implement base commit 95c23ed", but this worktree's actual Step 4a
  baseline run (before any edit) showed SEVEN pre-existing failures --
  test_batch_quiet_output_discipline.TestExceptions.test_step_c_exception_stated
  in addition to the six named in the plan. All seven are outside this
  task's file scope (none touch `references/batch-terminal-line.md`,
  `tests/test_batch_stop_contract.py`, or
  `tests/test_structured_result_derivation.py`) and are unchanged, in the
  same set, in the post-implementation full run -- the discrepancy is
  recorded here rather than silently reconciled, per the tdd-testing
  skill's "not yours to fix" rule for inherited failures.
