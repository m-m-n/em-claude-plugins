      - tests.test_merge_skill_doc.TestPostLockTipBinding.test_ac6_the_held_values_matcher_fires_when_integration_tip_is_not_tied_to_step_8
      - tests.test_merge_skill_doc.TestPostLockTipBinding.test_ac6_the_held_values_matcher_fires_when_locked_tip_may_reach_another_step
    red_confirmed: true
    red_reason: >-
      Watched the two rewritten tests (the option test and the three-form test) fail
      against the SKILL.md as it was before the change, with the failures quoted under
      AC-2. The forged-text matcher tests take a synthetic document built in the test,
      so they do not depend on the SKILL.md and passed on their first run together
      with the control document that every matcher accepts; each of them asserts that
      its matcher reports the forged defect (no read block, the read before the
      --wait verify, a resolve still carrying <integration_tip>, an item 4 still
      containing the old phrase, a held-values list without locked_tip, and the
      remaining variants), so a matcher that stopped firing fails its test. The
      earlier forged-form detections (the matchers-fire test of the PR bindings and
      the outcome-matcher test of the re-decision) are kept unchanged.
