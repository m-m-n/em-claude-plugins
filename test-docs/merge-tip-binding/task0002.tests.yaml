    red_confirmed: true
    red_reason: >-
      Watched the two new tests fail against the SKILL.md as it was before the change.
      The order test failed with "step 6 has no cd block in the order wait, merged, cd,
      read, resolve" (and the same for read and resolve); the local-route test failed
      with "unexpectedly None : no cd block after the merged block". The two existing
      TestPostLockMergedRedecision tests listed here passed before and after by design:
      they keep guarding the wait, merged, resolve order before step 7 and the
      separate timeout lines, which the new blocks must not break.
  AC-2:
    tests:
      - tests.test_merge_skill_doc.TestPostLockTipBinding.test_ac2_the_step_6_resolve_form_passes_the_locked_tip_and_is_otherwise_the_step_5_2_form
      - tests.test_merge_skill_doc.TestPostLockMergedRedecision.test_ac4_the_redecision_forms_pass_the_options_of_steps_4_and_5_2
      - tests.test_merge_skill_doc.TestPrDecisionBindings.test_ac6_every_resolve_form_in_the_skill_passes_an_integration_tip
      - tests.test_merge_skill_doc.TestPrDecisionBindings.test_ac6_step_5_2_resolve_passes_the_integration_tip_from_preflight
      - tests.test_merge_skill_doc.TestPrDecisionBindings.test_ac6_step_5_3_re_resolve_passes_the_integration_tip_from_preflight
      - tests.test_merge_skill_doc.TestPrDecisionBindings.test_ac6_step_13_2_post_merge_re_resolve_passes_the_merged_head
    red_confirmed: true
    red_reason: >-
      Watched the new test and the two rewritten tests fail against the SKILL.md as it
      was before the change. The new test reported "the step 6 resolve form does not
      pass --integration-tip <locked_tip>" and "still carries <integration_tip>"; the
      rewritten option test failed on its first differing token ('<integration_tip>' !=
      '<locked_tip>'); the rewritten three-form test failed with ['integration_tip',
      'integration_tip', 'head_sha'] != ['integration_tip', 'locked_tip', 'head_sha'].
      The step 5.2, 5.3 and 13.2 tests passed before and after by design: they pin
      the forms that must keep their tips.
  AC-3:
    tests:
      - tests.test_merge_skill_doc.TestPostLockTipBinding.test_ac3_item_4_states_the_read_value_rule_between_the_read_and_the_resolve
      - tests.test_merge_skill_doc.TestPostLockTipBinding.test_ac3_the_rule_adds_no_outcome_bullet_and_no_second_script_failure_line
      - tests.test_merge_skill_doc.TestPostLockMergedRedecision.test_ac4_each_outcome_is_handled_as_the_decision_table_says
      - tests.test_merge_skill_doc.TestPostLockMergedRedecision.test_ac4_the_hold_task_is_stopped_before_every_terminal_the_redecision_reaches
    red_confirmed: true
    red_reason: >-
      Watched the read-value rule test fail against the SKILL.md as it was before the
      change: "item 4 does not say that `integration_tip` is not overwritten" and "item
      4 does not hold exactly one line stating the 40-digit rule". The outcome-set and
      single-script-failure-line tests passed before and after by design: they keep
      the outcome bullets {merged, not_merged, open, stop, none} and the one
      スクリプトの失敗 line fixed while the rule is added as prose.
  AC-4:
