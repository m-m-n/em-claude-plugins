    red_confirmed: false
    red_reason: >
      The four existing Step A rule phrases were already present, verbatim,
      in batch-mode.md before this task touched the file (the task only
      appends a new sentence after them); C3's real-document check
      therefore already passed on the very first run of the new module,
      before batch-mode.md was edited, and never observed a red state
      caused by this task. The negative-proof (test_fails_when_each_phrase_removed)
      is a permanent regression pin, not evidence of a red-to-green
      transition. The second half of this criterion (SKILL.md has no diff
      against its content at the task's start) has no permanent test per
      the task plan's Test Notes; it was verified by running
      `git diff --stat -- em-workflow/skills/develop/SKILL.md` in the
      worktree, which produced no output.
