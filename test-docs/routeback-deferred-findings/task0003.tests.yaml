  AC-4:
    tests:
      - tests.test_stale_launched_missing_artifacts_doc_contract.TestR2R3R4OldWordingRemovedAndNewStatementsPresent.test_forbidden_phrases_absent_from_live_doc
      - tests.test_stale_launched_missing_artifacts_doc_contract.TestR2R3R4OldWordingRemovedAndNewStatementsPresent.test_negative_proof_forbidden_phrases_present_in_their_samples
