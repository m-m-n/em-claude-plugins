      the new tests were green on their first run; no red state occurred for
      this criterion. Sensitivity was checked by temporarily editing the
      scripts and restoring them before the commit: the test module fails
      when resolve-verified-findings.py stops rewriting the finding or when
      merge-preflight.py stops accepting fixed as resolved (see AC-2 and AC-3).
  AC-2:
