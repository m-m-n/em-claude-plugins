    red_confirmed: false
    red_reason: >-
      The behavior pre-existed in the unchanged resolve-verified-findings.py,
      so the new tests were green on their first run and no red state
      occurred. Temporary edits to the script, each restored before the
      commit, made test_ac2_resolve_verified_findings_reports_success_with_the_finding_fixed
