      - tests.test_retrospect_verification_handoff.TestRetrospectSectionRegression.test_declined_findings_item_shape_unchanged
      - tests.test_retrospect_verification_handoff.TestRetrospectSectionRegression.test_lessons_candidates_present_and_unchanged
