      - tests.test_retrospect_verification_handoff.TestGenerationPopulationStated.test_does_not_narrow_by_lineage_cap_touched_id
      - tests.test_retrospect_verification_handoff.TestGenerationPopulationStated.test_states_empty_population_when_cap_not_reached
    red_confirmed: true
    red_reason: "AssertionError: False is not true / assertIn failed — before the edit, the retrospect section never stated the 'cap 到達時点で未解決の failed_items 全件' population phrase, the 絞り込まない non-narrowing clause, or the empty-population-on-completed clause."
  AC-6:
