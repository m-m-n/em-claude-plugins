      subject is a pure Python function or the module's own import list, not
      SKILL.md content -- they were true (or false, for the "rejects"
      negative-proof cases, which is their PASSING assertion) from the moment
      the module was written, independent of the SKILL.md implementation
      order. test_continuation_matcher_accepts_the_real_clause is the one
      exception that did go red-to-green (it depends on the real clause
      existing) but is listed under AC-1/AC-3's red-confirmed set above via
      the shared setUpClass failure; grouped here because it is also part of
      the AC-8 matcher inventory. The genuinely red-confirmed member of this
      set is covered by AC-1's red_reason (setUpClass ValueError) since both
      draw on the same clause_section fixture.
notes: >-
  Deviation from AC-6's literal wording is intentional and load-bearing, not
  an oversight: writing the literal reason-code string
  "verify_rework_cap_reached" into SKILL.md (as AC-6's shorthand
  "reason=verify_rework_cap_reached" would require if taken as a literal
  string requirement) breaks two pre-existing, task0002-non-owned whole-file
  absence guards -- TestWholeFileForbiddenLiteralAbsence in
  tests/test_batch_quiet_output_skill_wiring.py and
  TestStateValueGuardWholeFileScope in
  tests/test_batch_stop_contract_skill_wiring.py -- both of which enforce
  NFR1 (the reason code is defined in exactly one place,
  references/batch-terminal-line.md, which NFR5 forbids this task from
  changing). Per D8's ownership table this task may only touch those two
  modules' STEP_C_HEADING constants, so the guards themselves could not be
  relaxed even if that were desirable. Confirmed empirically: temporarily
  writing "verify_rework_cap_reached" into the バッチ終端行 section during
  drafting reproduced exactly this failure before being reverted in favor of
  naming the stop point identifier `verify-rework-cap` instead (which
  `references/batch-terminal-line.md`'s Stop point coverage table already
  binds to that reason code, per IMPLEMENTATION.md D5) -- the same
  NFR1-preserving pattern this document already uses for every other
  terminal-line value (the `state` domain, the removed "2 つの終端状態"
  count). Full test suite run after implementation: 3139 tests, 12 failures,
  identical set (by name) to the 12-failure baseline recorded in 4a -- all
  concern an unrelated em-review marketplace-entry `version` key left over
  from a prior merged feature, not touched by this task.
