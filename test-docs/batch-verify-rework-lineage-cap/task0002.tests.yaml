  AC-7:
    tests: []
    red_reason: >-
      Verifiable outcome is a file-diff check, not a unit test: this task
      never wrote to em-workflow/references/batch-terminal-line.md (confirmed
      by `git status --short` showing no change to that path after
      implementation) and the file is absent from expected_files. No
      in-repo unit test can assert "this task's own git history never touched
      path X" from a single working-tree snapshot, so this criterion is
      verified by construction / by the git diff rather than by tests: []
      is intentional here, not an oversight.
