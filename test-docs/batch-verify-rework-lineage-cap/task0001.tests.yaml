acceptance_tests:
  AC-1:
    tests:
      - test_verify_rework_lineage_cap.TestSkillLineageCountingDefinition.test_lineage_counting_rule_is_stated
      - test_verify_rework_lineage_cap.TestSkillLineageCountingDefinition.test_lineage_counter_key_is_the_new_history_field
      - test_verify_rework_lineage_cap.TestSkillLineageCountingDefinition.test_old_thin_counter_key_is_gone
      - test_verify_rework_lineage_cap.TestBatchModeVerifyFailedRowSummary.test_row_summarizes_both_caps_without_a_numeral
      - test_verify_rework_lineage_cap.TestLineageCountingMatcherCanFail.test_matcher_rejects_old_wording
      - test_verify_rework_lineage_cap.TestLineageCountingMatcherCanFail.test_matcher_accepts_forged_new_wording
    red_confirmed: true
    red_reason: >-
      Before the SKILL.md edit: test_lineage_counting_rule_is_stated and
      test_hard-cap-shared test_row_summarizes_both_caps_without_a_numeral
      failed with "AssertionError: False is not true" (matcher found no
      failed_id_counts / 累積出現回数 / 系譜 cap / 値 1 / 新規予算を得る
      wording); test_lineage_counter_key_is_the_new_history_field and
      test_hard_cap_counter_key_is_the_new_history_field failed on
      assertIn("batch.verify_rework.failed_id_counts", ...) not found;
      test_old_thin_counter_key_is_gone failed with "'verify_rework_count'
      unexpectedly found" against the still-unedited SKILL.md.
  AC-2:
    tests:
      - test_verify_rework_lineage_cap.TestSkillHardCapDefinition.test_hard_cap_rule_is_stated
      - test_verify_rework_lineage_cap.TestSkillHardCapDefinition.test_hard_cap_counter_key_is_the_new_history_field
      - test_verify_rework_lineage_cap.TestBatchModeVerifyFailedRowSummary.test_row_summarizes_both_caps_without_a_numeral
      - test_verify_rework_lineage_cap.TestVerifyCapNumeralIsSkillOnly.test_skill_states_both_numerals
      - test_verify_rework_lineage_cap.TestHardCapMatcherCanFail.test_matcher_rejects_old_wording
      - test_verify_rework_lineage_cap.TestHardCapMatcherCanFail.test_matcher_accepts_forged_new_wording
    red_confirmed: true
    red_reason: >-
      test_hard_cap_rule_is_stated failed with "AssertionError: False is
      not true" (matcher found no hard-cap / rounds / 値 3 / 独立 wording
      in the still-unedited verify フェーズ section);
      test_hard_cap_counter_key_is_the_new_history_field failed on
      assertIn("batch.verify_rework.rounds", ...) not found;
      test_skill_states_both_numerals failed because neither "値 1" nor
      "値 3" existed in SKILL.md yet.
  AC-3:
    tests:
      - test_verify_rework_lineage_cap.TestSkillCapReachedOutcome.test_cap_reached_continues_to_retrospect
      - test_verify_rework_lineage_cap.TestSkillCapReachedOutcome.test_old_stop_and_report_wording_is_gone_from_whole_file
      - test_verify_rework_lineage_cap.TestSkillCapReachedOutcome.test_deferred_negation_sentence_is_present
      - test_verify_rework_lineage_cap.TestSkillCapReachedOutcome.test_no_deferred_assignment_for_verify_leftovers
      - test_verify_rework_lineage_cap.TestCapReachedOutcomeMatcherCanFail.test_matcher_rejects_old_wording
      - test_verify_rework_lineage_cap.TestCapReachedOutcomeMatcherCanFail.test_matcher_accepts_forged_new_wording
      - test_verify_rework_lineage_cap.TestDeferredAssignmentMatcherCanFail.test_matcher_rejects_section_that_assigns_deferred
      - test_verify_rework_lineage_cap.TestDeferredAssignmentMatcherCanFail.test_matcher_accepts_section_that_only_negates
    red_confirmed: true
    red_reason: >-
      test_cap_reached_continues_to_retrospect failed with
      "AssertionError: False is not true" (the still-unedited section had
      neither "停止しない" nor "停止せず" alongside verify.status/failed/
      retrospect フェーズ); test_old_stop_and_report_wording_is_gone_from_
      whole_file failed with the old phrase "`failed` のまま報告して停止"
      unexpectedly found; test_deferred_negation_sentence_is_present
      failed on assertIn("deferred", ...) not found (the negation
      sentence did not exist yet). test_no_deferred_assignment_for_verify_
      leftovers passed even before the edit (vacuously true, since
      "deferred" was entirely absent from the old section) -- it is a
      permanent regression guard from here on, backed by the genuine red
      of the negation-sentence test above and by
      TestDeferredAssignmentMatcherCanFail's negative proof.
  AC-4:
    tests:
      - test_verify_rework_lineage_cap.TestBatchYamlBlockStructure.test_new_structure_is_present
      - test_verify_rework_lineage_cap.TestBatchYamlBlockStructure.test_retired_key_is_gone_from_the_structure
      - test_verify_rework_lineage_cap.TestBatchYamlBlockStructure.test_retired_key_fallback_is_documented
      - test_verify_rework_lineage_cap.TestBatchYamlBlockStructure.test_batch_activation_independence_is_retained
      - test_verify_rework_lineage_cap.TestBatchYamlBlockMatcherCanFail.test_structure_matcher_rejects_old_block
      - test_verify_rework_lineage_cap.TestBatchYamlBlockMatcherCanFail.test_structure_matcher_accepts_new_block
      - test_verify_rework_lineage_cap.TestBatchYamlBlockMatcherCanFail.test_retired_key_matcher_rejects_old_block
      - test_verify_rework_lineage_cap.TestBatchYamlBlockMatcherCanFail.test_retired_key_matcher_accepts_new_block
    red_confirmed: true
    red_reason: >-
      First run of the module against the still-unedited workflow-
      schema.md errored in setUpClass: my own `_extract_batch_yaml_block`
      helper assumed a literal "batch:\n" opener, but the real file has a
      trailing inline comment on that line ("batch:                # ...
      \n"), so `text.index("batch:\n")` raised ValueError -- fixed the
      helper to match the "batch:" line by regex instead (unrelated to
      the doc content itself). After that fix, against the still-unedited
      file: test_new_structure_is_present and
      test_retired_key_is_gone_from_the_structure failed with
      "AssertionError: False is not true" (block still had the flat
      `verify_rework_count: 0` key, no nested verify_rework mapping);
      test_retired_key_fallback_is_documented failed because neither
      "未計上" nor "unset" existed anywhere in the file yet.
      test_batch_activation_independence_is_retained passed even before
      the edit (the pre-existing "activated ... by the --batch flag"
      sentence already satisfied it) -- retained, not newly introduced,
      by this task's restructure.
  AC-5:
    tests:
      - test_verify_rework_lineage_cap.TestVerifyCapNumeralIsSkillOnly.test_skill_states_both_numerals
      - test_verify_rework_lineage_cap.TestVerifyCapNumeralIsSkillOnly.test_batch_mode_has_no_verify_cap_numeral
      - test_verify_rework_lineage_cap.TestVerifyCapNumeralIsSkillOnly.test_workflow_schema_has_no_verify_cap_numeral
      - test_verify_rework_lineage_cap.TestCapNumeralNeighborhoodMatcherCanFail.test_matcher_rejects_numeral_near_keyword
      - test_verify_rework_lineage_cap.TestCapNumeralNeighborhoodMatcherCanFail.test_matcher_accepts_text_with_no_numeral_near_keyword
      - test_verify_rework_lineage_cap.TestCapNumeralNeighborhoodMatcherCanFail.test_matcher_ignores_zero_valued_initial_counters
      - test_verify_rework_lineage_cap.TestRowSummaryMatcherCanFail.test_matcher_rejects_new_row_wording_that_leaks_a_numeral
    red_confirmed: true
    red_reason: >-
      test_skill_states_both_numerals failed because SKILL.md had neither
      "値 1" nor "値 3" yet. test_batch_mode_has_no_verify_cap_numeral
      failed against the still-unedited batch-mode.md: the old
      Non-packet-gates row literally read "(`batch.verify_rework_count`
      cap 1)", and "verify_rework" is a substring of
      "verify_rework_count", so the keyword-neighborhood scan correctly
      found the digit 1 within the window -- this is exactly the SSOT
      violation the task removes.
      test_workflow_schema_has_no_verify_cap_numeral already passed
      before the edit (the old `verify_rework_count: 0` carried only a 0,
      never a 1 or 3) -- retained, not newly introduced.
  AC-6:
    tests:
      - test_develop_skill_rewiring.TestVerifyReworkBranchesReferenceSSOT.test_batch_counter_cap_is_retained
      - test_batch_quiet_output_skill_wiring.TestDesignVerifyRetrospectBatchClauses.test_verify_rework_cap_wording_unaltered
    red_confirmed: true
    red_reason: >-
      Both were rewritten to assert the new wording (系譜 cap / hard cap /
      batch.verify_rework / retrospect フェーズ / 停止せず) BEFORE SKILL.md
      was edited, and both failed with
      "AssertionError: '系譜 cap' not found in ..." against the
      still-unedited SKILL.md text (which still carried
      `batch.verify_rework_count == 0` / "カウンタを +1" / "`failed` のまま
      報告して停止"). After the SKILL.md edit both pass, together with
      every other test in their owning modules (123 tests, 0 failures).
  AC-7:
    tests:
      - test_verify_rework_lineage_cap.TestOwnModuleStdlibOnly.test_own_imports_are_all_stdlib
      - test_verify_rework_lineage_cap.TestLineageCountingMatcherCanFail.test_old_wording_is_genuinely_the_old_shape
      - test_verify_rework_lineage_cap.TestLineageCountingMatcherCanFail.test_matcher_rejects_old_wording
      - test_verify_rework_lineage_cap.TestHardCapMatcherCanFail.test_matcher_rejects_old_wording
      - test_verify_rework_lineage_cap.TestCapReachedOutcomeMatcherCanFail.test_matcher_rejects_old_wording
      - test_verify_rework_lineage_cap.TestRowSummaryMatcherCanFail.test_matcher_rejects_old_row
    red_confirmed: false
    red_reason: >-
      These assert properties of the test module itself (stdlib-only
      imports; each matcher's negative proof over a hand-forged synthetic
      string reproducing the old fixed-counter wording), not of the
      documentation files under change. There is no corresponding
      production edit whose absence would make them fail: the matcher
      functions were written once, alongside their negative-proof cases,
      and passed from their first run -- a red-then-green cycle was never
      observed for this specific criterion. The criterion's substance
      (that a matcher rejecting the old wording actually exists and is
      exercised) is nonetheless met, and is what backs the AC-1/AC-2/AC-3/
      AC-5 "negative proof" sub-claims listed under those entries above.
notes: >-
  AC-7's unconfirmed red is carried into the implementer report's
  unconfirmed_reds field with the same reasoning.
