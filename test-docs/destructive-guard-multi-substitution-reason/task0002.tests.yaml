    red_confirmed: true
    red_reason: >
      Observed in the baseline run before any edit, with the open-ended
      position selection still in both setUpClass methods (which also took
      the 96 cases the heredoc-literal feature appended). The six
      TestScenarioCasesPassAgainstTheHook.test_ac* methods errored with
      AttributeError: 'NoneType' object has no attribute 'group' in
      scenario_number (a heredoc-literal label that names no TS-N of this
      feature). TestCaseTable.test_each_scenario_has_its_case errored with
      IndexError: list index out of range (a later case with three
      elements). TestCaseTable.test_every_new_case_is_rule_pinned_and_named_after_the_feature
      failed 96 subtests, each AssertionError: 3 != 4 or a label that does
      not start with the feature name. After the label-based selection all
      eight pass, and the selection yields 33 cases. That the text
      `[PRE_EXISTING_CASE_COUNT:]` is gone from the file is checked by a
      text search (zero matches), not by a test.
  AC-2:
    tests:
      - tests.test_destructive_guard_mixed_rm_precedence.TestCaseTable.test_the_feature_cases_form_one_run_right_after_the_existing_cases
    red_confirmed: false
    red_reason: >
      The check is new and passes on the current case table the first time
      it runs, so no failing run of it occurred. It is not vacuous: with a
      temporary probe that is not committed (the positions of the selected
      cases replaced before the check runs), it fails with "condition 2
      failed" when the selected positions start one after
      PRE_EXISTING_CASE_COUNT (1209) or one before it (1207), with
      "condition 3 failed" and the offending position for a gap in the
      middle, a dropped case and a case moved to the end, and with
      "condition 1 failed" for an empty selection. It passes for the real
      positions 1208 to 1240 and for a single case at 1208. No existing test
      checks the contiguity of the selected run: the tests found by searching
      tests/ for destructive-guard-cases.json (by path and by file name) are
      test_destructive_guard_mixed_rm_precedence,
      test_destructive_guard_extglob_units,
      test_destructive_guard_lexer_agreement,
      test_destructive_guard_command_substitution,
      test_destructive_guard_merge_allow and test_muse_guard, and none of
      them asserts positions of a feature's cases.
