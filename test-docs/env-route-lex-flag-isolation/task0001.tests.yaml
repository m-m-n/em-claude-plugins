    # asserts exit 0 with no FAIL line, so it covers env-route-lex-flag-isolation
    # TS-1 and TS-2 of em-workflow/hooks/tests/destructive-guard-cases.json.
    tests:
      - tests.test_destructive_guard_command_substitution.TestCaseTableDiscipline.test_runner_reports_every_case_passing
      - tests.test_destructive_guard_env_route.TestJudgmentThroughRun.test_a_body_with_only_an_unreadable_delimiter_leaves_the_flag_down
      - tests.test_destructive_guard_env_route.TestStateRestored.test_flags_the_body_raises_do_not_stay_raised
    red_confirmed: true
    red_reason: >-
      The six cases (TS-1 to TS-6) were appended to the case file before any
      hook change and the real runner was run directly against the unchanged
      hook: 1660/1662 passed, and TS-1 and TS-2 FAILed with got=deny
      rule=unreadable-heredoc-delimiter where allow is required (the env route's
      lexing raised _lex_unreadable_met for the whole decision). The unit tests
      were run against the unchanged hook as well: the judgment-through-run test
      and the flags-the-body-raises test FAILed. After the change TS-1 and TS-2
      give allow and both unit tests pass.
  AC-2:
    tests:
      - tests.test_destructive_guard_command_substitution.TestCaseTableDiscipline.test_runner_reports_every_case_passing
      - tests.test_destructive_guard_env_route.TestStateRestored.test_flags_raised_before_the_reading_stay_raised
      - tests.test_destructive_guard_env_route.TestStateRestored.test_normal_return_one_reading
      - tests.test_destructive_guard_env_route.TestStateRestored.test_normal_return_without_a_lifted_notion_statement
    red_confirmed: false
    red_reason: >-
      TS-3 (plain bash -c, deny, unreadable-heredoc-delimiter) and TS-4 (a flag
      raised by a top-level heredoc outside the env route survives, deny) pin
      decisions the unchanged hook already gives, and the three unit tests
      (flags raised before the reading stay raised, whatever the entry values)
      also passed against the unchanged hook, so no red state occurred for this
      change. The checks were observed failing only against temporary variants
      of the implementation, none committed: a variant that restores the two
      flags to a fixed False instead of their entry values failed TS-4 in the
      runner (got=allow rule=None, 1661/1662) and 38 subtests of the unit
      module, among them these three tests.
  AC-3:
    tests:
      - tests.test_destructive_guard_command_substitution.TestCaseTableDiscipline.test_runner_reports_every_case_passing
      - tests.test_destructive_guard_env_route.TestBothReadings.test_the_value_only_one_reading_shows_is_returned
      - tests.test_destructive_guard_env_route.TestBothReadings.test_the_two_line_notion_pair_is_visible_only_under_extglob_on
      - tests.test_destructive_guard_env_route.TestBothReadings.test_the_one_line_notion_pair_is_visible_under_both_settings
      - tests.test_destructive_guard_env_route.TestStateRestored.test_second_reading_runs_under_the_opposite_setting_only_when_a_paren_was_met
    red_confirmed: true
    red_reason: >-
      TS-5 (a body with only an extended-pattern parenthesis, allow) and TS-6
      (the notion-pair call after the parenthesis on the same line, deny,
      rule git-branch-force-delete) passed against the unchanged hook, because
      the flag the env route leaked made run() re-read the whole command with
      extglob on; they are the decisions the change has to keep. The lexer
      fact TS-6 rests on was read directly: under the extglob-off reading the
      env route finds no notion value, under the extglob-on reading it finds
      the `git branch -D example` command (the two-line fact test). Against
      the unchanged hook the unit test of the second reading (the value only
      one reading shows is returned, entry setting off) and the test that the
      second reading runs under the opposite setting both FAILed, because
      the route made one reading only. A variant with the flag restoration but
      no second reading, not committed, failed TS-6 in the runner (got=allow
      rule=None, 1661/1662) and 19 subtests of the unit module.
  AC-4:
    tests:
      - tests.test_destructive_guard_env_route.TestStateRestored.test_normal_return_one_reading
      - tests.test_destructive_guard_env_route.TestStateRestored.test_normal_return_two_readings
      - tests.test_destructive_guard_env_route.TestStateRestored.test_normal_return_without_a_lifted_notion_statement
