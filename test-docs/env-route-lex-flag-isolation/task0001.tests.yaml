      - tests.test_destructive_guard_env_route.TestStateRestored.test_extglob_flag_the_body_raises_does_not_stay_raised
    red_confirmed: true
    red_reason: >-
      Run against the unchanged hook, the unit module failed 40 subtests, among
      them these: the early return when the payload chunk cannot be built (6 of
      the 8 entry states: a flag the lexing raised stayed raised), the exception
      raised in the first reading (6 of 8: the same), the normal return of a two
