      - tests.test_destructive_guard_env_route.TestBothReadings.test_identical_results_of_the_two_readings_count_once
      - tests.test_destructive_guard_env_route.TestBothReadings.test_overlapping_results_return_each_string_once
      - tests.test_destructive_guard_env_route.TestBothReadings.test_a_result_whose_strings_the_first_reading_already_returned_is_not_charged
      - tests.test_destructive_guard_env_route.TestBothReadings.test_duplicates_inside_one_reading_are_kept
      - tests.test_destructive_guard_env_route.TestBothReadings.test_overrun_raised_by_only_one_reading_is_reported
      - tests.test_destructive_guard_env_route.TestBothReadings.test_unrestorable_raised_by_only_one_reading_is_reported
      - tests.test_destructive_guard_env_route.TestBothReadings.test_flags_of_a_statement_that_has_no_value_are_reported
    red_confirmed: true
    red_reason: >-
      Against the unchanged hook (one reading only) the overrun test and the
      unrestorable test FAILed for the two subtests in which the second reading
