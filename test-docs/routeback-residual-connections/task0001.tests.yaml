    red_reason: >-
      FR1 is a pin (D3): the three positive assertions are green on the base
      document by design (the premise and the third conjunct already existed
      pre-task). The observed red is the discriminating power of the tight
      absence matcher itself: GATE_OR_CONJUNCT_FOLLOWED_BY_ABOVE_RE.search()
