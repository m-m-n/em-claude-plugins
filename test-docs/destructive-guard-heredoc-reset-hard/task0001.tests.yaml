notes: >-
  This is a retry on a kept worktree. A prior, orphaned implementer had
  already added all 23 new cases to
  em-workflow/hooks/tests/destructive-guard-cases.json, uncommitted; that
  addition was inspected against the task plan's Expectation-cases list
  (command text, newlines, and expected verdict all matched exactly) and
  kept as-is rather than redone. The 4a baseline was captured by
  git-stash-ing only destructive-guard.py (keeping the inherited
  cases.json addition in place, since that reflects the worktree's actual
  starting state) and running both `python3 -m unittest discover -s
  tests` and `python3 em-workflow/hooks/tests/run-destructive-guard.py`;
  the stash was then restored before implementation continued. Both
  suites were re-run after implementation (final_failures above) --
  neither run was skipped.
