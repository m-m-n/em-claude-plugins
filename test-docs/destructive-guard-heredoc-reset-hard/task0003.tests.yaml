acceptance_tests:
  AC-1:
    tests:
      - tests.test_destructive_guard_command_substitution.TestCaseTableDiscipline.test_runner_reports_every_case_passing
    red_confirmed: true
    red_reason: >
      All eight cases under "Expectation cases" (TS-47 to TS-51, plus the
      two Test Notes "recommended extra cases") were added to
      destructive-guard-cases.json before destructive-guard.py was
      touched -- 447 pre-existing cases (post-task0002 merge) became 455.
      Run against that unmodified (post-task0002, pre-task0003) guard:
      run-destructive-guard.py reported 449/456 passing, with 7 of the 8
      new cases mismatched (got=allow where deny was wanted, for the six
      new deny cases; got=deny/git-reset-hard where allow was wanted, for
      the "-c ... commit" allow case -- the pre-task0003 `-c`/`--config`/
      `--config-env`/GIT_CONFIG_* condition forced the git host word to
      None whenever a `-c`-shaped flag or GIT_CONFIG_* assignment was
      present, regardless of the actual subcommand, so the heredoc fell
      back to undetermined and its body was rescanned as a bare `git
      reset --hard HEAD` statement). The "-C ... commit -m" allow case
      (task plan's second TS-51 case) already passed unmodified, since
      `-C` was never one of the flagged options. `python3 -m unittest
      discover -s tests` exited non-zero in the same run, with
      test_runner_reports_every_case_passing as its one failure
      (asserting "N/N passed" against a runner that reported 449/456).
  AC-2:
    tests:
      - tests.test_destructive_guard_command_substitution.TestCaseTableDiscipline.test_runner_reports_every_case_passing
    red_confirmed: true
    red_reason: >
      Both cases (TS-47, TS-49) returned got=allow against the unmodified
      (post-task0002) guard in the same red run recorded under AC-1 -- the
      old GIT_CONFIG_*/`-c`/`--config`/`--config-env` flag-blocklist
      condition let a git subcommand outside that flag shape (an alias
      named `x`, whether defined via GIT_CONFIG_* or via a
      `.gitconfig`-style external definition) stay classified as a data
      command, since no recognized flag was present on the command line.
      After adding _git_is_data() (SC1's closed built-in-subcommand list,
      replacing the flag blocklist for `git`), an unlisted subcommand is
      undeterminable regardless of how the alias was defined, and both
      return deny via the (unchanged) undeterminable-heredoc fallback.
  AC-3:
    tests:
      - tests.test_destructive_guard_command_substitution.TestCaseTableDiscipline.test_runner_reports_every_case_passing
    red_confirmed: true
    red_reason: >
      TS-48 and TS-50 (the two new quote-split-sink-name cases) returned
      got=allow against the unmodified guard in the same red run recorded
      under AC-1 -- SC2's fallback only matched SHELL_SINK against the
      heredoc-stripped chunk as written, and a sink name split by `'`/`"`
      never matched that pattern there. After widening the fallback to
      also match the chunk with those characters (and `\`) stripped, both
      return deny. TS-25 (allow) and TS-15, TS-17, TS-21, TS-22, TS-26,
      TS-27 (deny) are pre-existing task0001/task0002 cases -- searched
      for and found still present, byte-identical, in destructive-guard-
      cases.json (identified here by their current Japanese labels, since
      the cases file itself carries no TS-N ids) -- that already passed in
      the AC-1 red run and continue to pass unchanged after this task's
      change; they are listed here as the regression guard for "the
      fallback is still per-heredoc" and "every existing fallback rescan
      is kept". No red was expected or observed for these seven; the
      absence of a pre-task0003 fallback-widening test for them is exactly
      what TM-3/AC-3's second-and-third bullets ask to be checked, not a
      criterion this task makes newly testable.
  AC-4:
    tests:
      - tests.test_destructive_guard_command_substitution.TestCaseTableDiscipline.test_runner_reports_every_case_passing
    red_confirmed: true
    red_reason: >
      TS-51's `-c` case (git host with a listed built-in subcommand behind
      a global option that the pre-task0003 flag-blocklist condition
      always forced to undeterminable) returned got=deny/git-reset-hard
      against the unmodified guard in the same red run recorded under
      AC-1. After the SC1 change, GIT_GLOBAL_VALUE_FLAGS/GIT_GLOBAL_
      BOOLEAN_FLAGS are skipped and the listed built-in subcommand behind
      them is read directly, so it returns allow. TS-51's `-C` case, and
      the pre-existing git-commit-message allow control, already passed in
      the AC-1 red run (git's `-C` was never one of the old condition's
      flagged options, and the commit-message control is not a heredoc-
      destination case at all -- git's DATA_COMMANDS membership for a
      statement's OWN command-word classification, used by check_rm() and
      friends outside the heredoc-destination path, is untouched by this
      task) and continue to pass unchanged; no red was expected or
      observed for those two.
  AC-5:
    tests:
      - tests.test_destructive_guard_command_substitution.TestCaseTableDiscipline.test_runner_reports_every_case_passing
      - tests.test_destructive_guard_command_substitution.TestCaseTableDiscipline.test_every_pre_task_command_preserved_with_only_named_changes
      - tests.test_destructive_guard_command_substitution.TestSourceHygieneAndDeterminism.test_module_uses_only_standard_library
      - tests.test_destructive_guard_command_substitution.TestSourceHygieneAndDeterminism.test_no_new_filesystem_or_subprocess_calls
    red_confirmed: true
    red_reason: >
      The suite-passing bullets were observed red in the same AC-1 red
