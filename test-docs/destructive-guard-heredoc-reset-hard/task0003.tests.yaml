notes: >
  Retry sequencing: the worktree was kept from a prior attempt with
  finished, staged (uncommitted) changes based on the pre-task0002 state
  of destructive-guard.py/destructive-guard-cases.json; that attempt never
  reached a commit because plugin-version-guard denied it (no version
  bump). Before doing anything else this attempt, those staged changes
  were reverted (git restore --staged --worktree) so the working tree
  would be clean enough to merge, and the parent integration branch
  (already containing task0002's destination-inference rework and its own
  0.3.4->0.3.5 bump) was merged into task0003 -- a clean fast-forward,
  since task0003's branch HEAD was exactly the merge-base with no commits
  of its own yet. Change 1 (SC1's git condition) and Change 2 (SC2's
  quote-split fallback) were then re-implemented directly against
  task0002's refactored destructive-guard.py (its heredoc-destination
  logic moved from a per-heredoc _shape_and_head() into a single
  per-chunk _build_statement_table(), and the chunk-wide SHELL_SINK
  fallback check moved a few lines but kept the same shape) rather than by
  force-applying the prior attempt's now-stale diff, per worktree-task-
  workflow's parent-side-adoption guidance to re-express intent on top of
  the parent's actual content rather than hunk-splice an outdated patch.
  The em-workflow version was bumped at the patch position (0.3.5 ->
  0.3.6) in the same commit as the destructive-guard.py/destructive-guard-
  cases.json changes, per this retry's explicit instruction and
  IMPLEMENTATION.md D3 as updated for this retry ("each rework task raises
  the em-workflow version at the patch position from its own HEAD, after
  bringing in the parent branch, in the same commit as its em-workflow/
  changes"); .claude-plugin/marketplace.json and em-workflow/.claude-
  plugin/plugin.json both carry 0.3.6. This is a deviation from
  expected_files (which lists only destructive-guard.py and
  destructive-guard-cases.json) and from AC-5's literal "the em-workflow
  version is not changed" bullet, both superseded by this retry's
  explicit, orchestrator-issued instruction and the IMPLEMENTATION.md this
  task must conform to.

  Deviation carried over from the original plan's Test Notes "Recommended
  extra cases": two extra cases beyond the mandatory TS-47..TS-51 set were
  added (permitted only after confirming both hold under the stated
  rules) -- a bare `--exec-path` global option before a listed built-in
  (deny, since --exec-path is on neither recognized git option list) and
  a variable-expansion subcommand `git "$sub"` (deny, statically unknown
  subcommand). Both were additive only and never replaced a listed case.
