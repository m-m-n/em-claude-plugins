      - "TS-4: 1 行に複数のヒアドキュメント演算子があっても、両方 cat 宛てなら allow"
      - "TS-9: 1 行に複数のヒアドキュメント演算子: 2 つ目が bash 宛てなら deny"
      - "TS-10: ヒアドキュメントの後に続く行は通常のコマンドとして deny"
    red_confirmed: true
    red_reason: >
      Against this task's base guard, all four of TS-39/40/41a/41b failed
      (opposite verdict; the base guard's position tracking used inline
      marker characters susceptible to control-character/comment
      confusion, per the task plan's rationale for replacing it).
      TS-4/9/10 are unchanged regression controls from task0001. This
      session additionally found and fixed two genuine defects surfaced by
      TS-39/TS-40 in code shared far beyond heredoc handling: (1)
      scan_structure()'s own comment-span end boundary excluded the
      terminating newline, desyncing _segment_index_at()'s separator count
      from lex_segments()'s actual statement split whenever a comment sits
      with nothing before it on its line; (2) more fundamentally, Python's
      shlex (via its default `commenters`) swallows a comment's own
      terminating newline without emitting a separator token for it, so
      ANY comment following real command text on the same line silently
      merged that statement with the next line's statement everywhere in
      the file, not just for heredocs (`echo hi # x\nrm -rf y` lexed as
      ONE statement, with `rm -rf y` read as mere arguments to `echo`).
      Fixed by adding `_blank_comments()` (a quote-aware pass that blanks
      comment TEXT but preserves the terminating newline) ahead of every
      lex_segments() call, with shlex's own `commenters` turned off since
      it is now redundant.

