      - "full suite: python3 -m unittest discover -s tests (6449 tests)"
    red_confirmed: true
    red_reason: >
      The run-destructive-guard.py suite was observed failing at session
      start (443/448; see baseline_failures) on the inherited, uncommitted
      guard, including a genuine regression against an EXISTING, pinned
      case ("引用符(rm-recursive): ...単一引用符で囲んでも裸形と同じ deny"
      went from the pinned "deny" to "ask") -- a direct violation of this
      criterion's "existing verdicts... are kept", confirmed red before
      this session's fix and green (448/448) after it. Root cause: the
      inherited rewrite's general (non-heredoc) substitution discovery in
      statements() had switched to scan_structure()'s quote-aware span
      list, which correctly excludes a single-quoted `$(` from being a
      real substitution for STRUCTURAL purposes (Component 1 postcondition
      2) but, used unmodified for the file-wide `.unresolved` marking
      check_rm() and friends read, also stopped marking a single-quoted
      `$(pwd)/../tmp/scratch` the way the pre-task0002 guard's quote-
      agnostic regex always had -- changing that ONE case's verdict.
      Fixed by adding scan_structure()'s HONOR_SINGLE_QUOTES parameter
      (default True, unchanged everywhere else) and computing a second,
      quote-agnostic span pass specifically for that general marking, so
      heredoc/case-state structural analysis (chunk_scan) keeps the
      quote-aware default while check_rm() and the rest of the per-token
      checks keep their pre-existing, quote-agnostic reach. The
      inspection-only clauses of this criterion (file scope, stdlib-only
      imports, no version bump) were checked by inspecting `git diff
      --stat` and `git status` (only em-workflow/hooks/destructive-guard.py
      and em-workflow/hooks/tests/destructive-guard-cases.json changed,
      the cases-file diff is append-only, `em-workflow/.claude-plugin/
      plugin.json` and `.claude-plugin/marketplace.json` are untouched)
      and the module's own `import` lines (bisect, json, os, re, shlex,
      shutil, sys -- all standard library); no executable check exists for
      these, so no red was or could be observed for them specifically.

notes: >
  This worktree held an uncommitted, near-complete implementation of this
  task when the session began (git status was dirty before any edit this
  session made; branch was already on task0002 with no prior commit). All
  5 baseline_failures above were diagnosed and fixed in place rather than
  reimplemented from scratch: 4 were incomplete new-case coverage (case
  quoting, pipeline blank-segment skip, comment-newline separator sync,
  and shlex's own comment/newline merge quirk fixed at its source in
  lex_segments()); 1 was a genuine regression against an existing pinned
  case, traced to the general (non-heredoc) substitution marking losing
  its pre-existing quote-agnostic reach when it started sharing
  scan_structure()'s correctly quote-aware span list. Two additional
  correctness/performance defects (_is_assignment_only() checking the
  wrong word list; _segment_index_at() re-scanning from position 0 on
  every call) were found via profiling while chasing AC-7's stress
  thresholds and fixed in the same session, since AC-7 explicitly failed
  without them. No test was weakened or removed at any point; every fix
  was made in destructive-guard.py itself.
