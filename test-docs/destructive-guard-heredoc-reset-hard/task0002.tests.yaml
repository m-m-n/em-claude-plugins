      - "TS-40: 2 つ目の演算子はコメント内にあるため、A の区切り後の reset 行は実コマンドとして deny"
      - "TS-41a: 制御文字 U+0003/U+0004 を挟んでも bash 宛てヒアドキュメントは deny"
