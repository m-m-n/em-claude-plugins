  AC-7:
    tests: []
    red_confirmed: true
    red_reason: >
      No named unit test exists for this criterion (NFR4: the stress
      generator is intentionally not committed). Verified with an ad-hoc
      timing script outside the repository, feeding each generated input
      to destructive-guard.py as a hook JSON payload via subprocess and
      timing the wall-clock call, per the task plan's Test Notes. Before
      this session's own fixes (still on the inherited, uncommitted
      rewrite), the actually-observed measurements were: Family A (N
      repetitions of `x="$(cat <<'EOF'\nhello\nEOF\n)"`) took 0.319s at
      N=800 and 1.011s at N=1600 (ratio 3.17x, over the 3x limit); Family B
      (N repetitions of `case x in x) cat <<'EOF'\nhello\nEOF\n;; esac`)
      took 0.541s at N=800 and 1.866s at N=1600 (ratio 3.45x, also over the
      limit) -- both genuine reds against AC-7's own "at most three times"
      threshold, confirmed by a finer N=100..3200 sweep on Family B showing
      near-quadratic growth. Root causes, both traced by profiling: (1)
      _segment_index_at() rescanned from position 0 on every call instead
      of reusing prior work, costing O(n) per heredoc and O(n^2) over a
      chunk whose heredoc count grows with its own length -- fixed by
      _segment_boundaries(), one O(n) pass per (text, memo_key) producing a
      sorted boundary list, queried per heredoc via bisect in O(log n); (2)
      _is_assignment_only() was checking the POST-_shape_leading()
      remainder, which is always empty for a statement that is nothing but
      an assignment (`x="$(...)"`), so that exemption could never apply,
      routing every such heredoc through the "undetermined" branch and its
      O(chunk-length) SHELL_SINK.search() fallback once per heredoc --
      fixed by checking the statement's own pre-skip word list instead.
      After both fixes, re-measured (this session, same methodology):
      Family A 0.133s/0.243s (N=800/1600, ratio 1.83x); Family B
      0.123s/0.222s (ratio 1.80x); both well under 2s and under the 3x
      ratio. TS-20's own shape (roughly 2,000/4,000 lines, several
      heredoc operators per line, some unterminated) was re-approximated
      the same way and measured at 0.180s/0.341s (ratio 1.89x), also
      holding. All timings recorded here per Test Notes.

