      - tests.test_destructive_guard_mixed_rm_precedence.TestLabelledRunCheckOnSmallTables.test_a_table_that_is_all_run_passes
    red_confirmed: true
    red_reason: >
      Run against the helper still holding the old end-of-table rule,
      test_unlabelled_cases_only_after_the_run_pass failed on the tables
      "Lo", "LLoo" and "Looo" (AssertionError: 'the cases are not one run at
      the end of the table' is not None), and
      test_unlabelled_cases_on_both_sides_of_the_run_pass failed on "oLo",
      "ooLLoo" and "oLLLo" the same way. The before-only test and the
      all-run test passed under the old rule (the old rule gives the same
      result there), so the red state is the after-run half of the criterion.
  AC-4:
