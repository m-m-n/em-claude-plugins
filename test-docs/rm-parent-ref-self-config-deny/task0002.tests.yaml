      - tests.test_destructive_guard_mixed_rm_precedence.TestLabelledRunCheckOnSmallTables.test_an_unlabelled_case_between_two_labelled_ones_fails
      - tests.test_destructive_guard_mixed_rm_precedence.TestLabelledRunCheckOnSmallTables.test_no_labelled_case_fails
    red_confirmed: false
    red_reason: >
      The two conditions these tests pin (no case without the label between
      two labelled cases, and at least one labelled case) are the half of the
      rule that does not change, and the old end-of-table rule gives the same
      result on their tables. They passed when first run against the helper
      still holding the old rule, so no red state occurred for them; they
      guard the new rule against dropping either condition.
  AC-3:
