acceptance_tests:
  AC-1:
    tests:
      - tests.test_codex_hook_interactive_guard.TestCasesTable.test_cases_run_against_both_copies
    red_confirmed: true
    red_reason: >-
      With the pre-change guard in both copies, the test failed on the new row TS1 (empty
      standard output, JSONDecodeError, where a deny object was expected): the double quote
      inside the word-list comment opened a quote in the arithmetic context, the chunk was
      never closed and the python3 -i after it was not judged. The row passes after the
      implementation.
  AC-2:
    tests:
      - tests.test_codex_hook_interactive_guard.TestCasesTable.test_cases_run_against_both_copies
    red_confirmed: true
    red_reason: >-
      With the pre-change guard in both copies, the test failed on TS5 (empty standard
      output where a deny object was expected): the `)` inside the word-list comment closed
      the list. TS7 and TS8 were already deny before the change (the arithmetic context read
      neither a comment nor a command position, so those two commands came out right by
      accident); they stay as regression guards against a word-list reading that treats the
      list as a command list, and were not observed red.
  AC-3:
    tests:
      - tests.test_codex_hook_interactive_guard.TestCasesTable.test_cases_run_against_both_copies
    red_confirmed: false
    red_reason: >-
      The test passed before the implementation: TS6 expects silent and the old reading was
      silent as well (the `'` inside the word-list comment opened a quote that never closed,
      so the chunk was undecidable and nothing was denied). The row is a guard against
      over-denial by the new reading (the python3 -i sits inside quotes in the case body and
      must stay unjudged); no state exists in which it is red on this code base, so it
      stays a regression pin and was not observed red.
  AC-4:
    tests:
      - tests.test_codex_hook_interactive_guard.TestCaseStatementsInASubstitution.test_ts26_commented_lines_in_a_for_word_list_are_read_in_time
    red_confirmed: true
    red_reason: >-
      With the pre-change guard in both copies, the DEPTH-lines shape of SPEC.md TS26 already
      returned deny in time (an even count of double quotes balances), so that shape was not
      observed red. The method also runs DEPTH + 1 lines, an odd count of double quotes; for
      that shape the test failed in both copies (empty standard output, JSONDecodeError)
      before the implementation. Both shapes pass after it within the 60 second limit.
  AC-5:
    tests:
      - tests.test_codex_hook_interactive_guard.TestCasesTable.test_cases_run_against_both_copies
    red_confirmed: false
    red_reason: >-
      The test passed before the implementation: TS28 is deny with the old reading as well
      (the arithmetic context never opened a case statement, and its nested parentheses
      balanced). The row pins the nested-entry clause of the word-list context (words
      inside a nested `(`...`)` are at no command position, reading goes on after its `)`)
      against a reading that would treat the nested parentheses as a command list; it was
      not observed red.
  AC-6:
