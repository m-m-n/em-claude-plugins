      missing "em-workflow" -> "no marketplace entry named
      'em-workflow'". This covers the exact three forged sample kinds
      task0003.md names (baseline-patch version, mismatched pair, altered
      em-review entry) plus two bonus cases (malformed shape, missing
      entry name). With assertRaises in place these tests are green
      because the raise is the expected/asserted outcome.
