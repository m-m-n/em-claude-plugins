  AC-5:
    tests:
      - "destructive-guard-cases.json: 変数解決: コマンド接頭辞代入は未解決のまま"
      - "destructive-guard-cases.json: 変数解決: サブシェル境界で未解決"
      - "destructive-guard-cases.json: 変数解決: shell -c 境界で未解決"
      - "destructive-guard-cases.json: 変数解決: 二重代入は未解決のまま"
    red_confirmed: false
    red_reason: >-
      The verdict (ask/rm-unresolvable) and reason text for the
      command-prefix, subshell, and shell -c sub-cases are byte-identical
      before and after this task: with no resolution stage at all, any
      `$X` reference was unconditionally unresolved, so these three already
      passed pre-implementation and a flip cannot be observed for them —
      the criterion is enforced by the resolution stage correctly
      EXCLUDING these shapes (non-qualifying statement shape / scope
      mismatch), verified by code review and by these entries staying
      green as regression guards, not by a red-to-green transition. The
      fourth sub-case (name assigned twice) DOES have a confirmed
      red-to-green delta in its reason text specifically: direct invocation
      pre-implementation showed the plain rm-unresolvable reason with no
      hint; post-implementation the same command's reason gains "同じ名前
      に2回代入されているのが原因で未解決になっている。値ごとに別の変数名
      へ分けて代入し直すと解決できる。" — confirmed via direct invocation,
      the verdict itself (ask) was already true before.
  AC-6:
    tests:
      - "destructive-guard-cases.json: 変数解決: 展開後もグロブが残る"
      - "destructive-guard-cases.json: 変数解決: 展開後もコマンド置換が残る"
    red_confirmed: false
    red_reason: >-
      Both sub-cases already returned ask/rm-unresolvable pre-implementation
      (no resolution stage existed, so `$X` was unconditionally
      unresolved) — the verdict cannot flip for a criterion whose whole
      point is "stays unresolved". Post-implementation the SAME verdict is
      now produced for a different, verified reason: resolve_target()
      substitutes the mapped literal value (confirmed via code
      inspection/tracing — e.g. `X=/home/sakura/*` maps to the literal
      value containing `*`) and then re-applies the pre-existing DYNAMIC
      regex to the substituted text, which still matches, so resolution
      correctly reports not-resolved and the original token stands.
