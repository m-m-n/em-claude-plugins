  description: >-
    The round-2 orchestrator_spot_check table, re-run against base_commit
    1fdb27fe51de6d20e9812027d3aee603cb584173 (tmp/oracle-destructive-guard.py,
    extracted via `git show`) and the current hook, via
    tmp/compare.py in this worktree.
  results:
    - {command: "rm -rf /tmp/", base: allow, current: allow, matches_base: true}
    - {command: "rm -rf tmp/", base: allow, current: allow, matches_base: true}
    - {command: "rm -rf build-debug", base: allow, current: allow, matches_base: true}
    - {command: "rm -rf $(mktemp -d)", base: allow, current: allow, matches_base: true}
    - {command: "find /home/sakura \\( -name '*.log' \\) -delete", base: "deny/find-delete", current: "deny/find-delete", matches_base: true}
    - {command: 'git push "(" --force origin main', base: "deny/git-force-push", current: "deny/git-force-push", matches_base: true}
    - {command: "HOME=/tmp/x; if true; then HOME=/home/sakura; fi; rm -rf $HOME", base: "deny/rm-root", current: "deny/rm-root", matches_base: true}
    - {command: "D=/tmp/scratch; D=$HOME/project; rm -rf $D", base: "ask/rm-unresolvable", current: "ask/rm-unresolvable", matches_base: true}
    - {command: "rm -rf /home/sakura/$DIR/../../../tmp/y", base: "ask/rm-unresolvable", current: "ask/rm-unresolvable", matches_base: true}
    - {command: 'D=/tmp/claude-1000/xyz/scratchpad/backup; rm -rf "$D"', base: "ask/rm-unresolvable", current: allow, matches_base: false, intended: true, note: "the one case round2 marked intended:true — resolution correctly resolves D into a scratch path base cannot see at all, since base has no resolution feature"}
