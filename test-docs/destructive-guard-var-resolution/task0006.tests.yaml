  ac2_item_c:
  - entry: over-ceiling assignment token (item C, 1st)
    command_excerpt: X=/tmp/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa...(4096 total)...; rm -rf $X
    decision: kept, relabeled
    measured_verdict: ask
    measured_rule: destructive-guard/rm-unresolvable
    new_label: '動的目標(rm-unresolvable): キロバイト級の代入値でもタイムアウトせず ask に到達'
    justification: No length-ceiling constant exists in the hook; the command actually pins that a kilobyte-scale
      $X token still reaches an ask verdict via DYNAMIC/rm-unresolvable rather than timing out (path 1).
  - entry: reason-sentinel claim (item C, 2nd = item D bare-substitution pair, 2nd of 2)
    command_excerpt: rm -rf $(cat list)
    decision: kept, relabeled, marked known-gap (also one of item D's 14)
    measured_verdict: allow
    measured_rule: destructive-guard
    new_label: '既知の穴(未修正): 裸のコマンド置換 `$(cat list)` は対象ゼロで早期returnし allow'
    justification: 'The runner compares only the verdict, never a reason string, so no sentinel is ever
      verified. The command actually pins path 5: the bare $(cat list) substitution is carved into its
      own segment, the outer rm reaches check_rm with zero positional targets, and the function returns
      before any decide() call -- the same lexer gap as rm -rf $(mktemp -d).'
  - entry: resolution-exempt-check claim (item C, 3rd)
    command_excerpt: D=--delete; rsync $D src dst
    decision: kept, relabeled
    measured_verdict: allow
    measured_rule: destructive-guard
    new_label: '対象外(判定なし): rsync の `--delete` は `$D` のまま展開されず検査されない'
    justification: With no resolution stage there is no resolved text to consume. check_file_destruction's
      rsync check does `has(args, "--delete", ...)`, an exact literal-token match; the arg actually passed
      is the literal string "$D", not "--delete", so the check never fires. This pins path 5 (a delete-style
      flag on a tool this hook does not recognise the flag spelling for), not a resolution-exemption.
