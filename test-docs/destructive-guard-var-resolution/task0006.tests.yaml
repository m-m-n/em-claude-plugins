      not contain (a resolved-value length ceiling, a reason-string sentinel check, and a resolution-exempt
      consumption check). Each was measured against the running hook and relabeled to state only the property
      its command actually pins; none pinned nothing, so all three are kept (0 dropped). See measurements.ac2_item_c
      for the three (command, measured verdict, justification) rows.
  AC-3:
    tests: []
    red_confirmed: true
    red_reason: 'grep -c ''既知の穴(未修正)'' returned 0 before this task and 16 after: the 14 entries item D
      names (bare command substitution x2, trailing-slash scratch roots x4, unanchored scratch-name prefix
      x8) plus the 2 item-E entries that ride the same unanchored-prefix gap (`rm -rf targets`, `rm -rf
      build/../src`). No entry outside those 16 carries the marker (verified by listing every entry whose
      label contains it).'
  AC-4:
    tests: []
    red_confirmed: true
    red_reason: The 7 paired counter-cases did not exist before this task (red = absent). Each was measured
      against the running (unmodified) hook before being written into the file; see measurements.ac4_paired_counter_cases
      for the (input, verdict, rule) rows taken pre-write. The written entries' verdict and command fields
      are asserted equal to these measurements by the generation script.
  AC-5:
    tests: []
    red_confirmed: true
    red_reason: 'Before this task (pretty-printed layout), the 58 pre-existing entries were logically
      preserved as a parsed prefix but NOT byte-identical to the base revision''s lines (git diff --unified=0
      <base> HEAD showed 58 non-added lines). After restoring the base layout: parsed equality `data[:58]
      == base` holds, and destructive-guard.py''s diff against the base revision is empty (byte-identical,
      hook untouched). All 73 added entries'' verdict and command elements were asserted unchanged against
      the pre-edit file before writing (0 mismatches).'
  AC-6:
    tests: []
    red_confirmed: true
    red_reason: 'Before this task: `git diff --unified=0 1fdb27fe51de6d20e9812027d3aee603cb584173 HEAD
      -- em-workflow/hooks/tests/destructive-guard-cases.json | grep -c ''^-[^-]''` = 58 (whole-file pretty-print
      rewrote every pre-existing line). After this task: the same command = 1, and that single removed
      line is the base file''s final entry, re-added identically plus a trailing comma (the sole permitted
      exception).'
  AC-7:
    tests: []
    red_confirmed: false
    red_reason: 'Both suites were already green before this task started (round 4''s orchestrator measured
      132/132 and 2830/2830; this task''s own 4a baseline run reproduced that: 132/132 and 2830/2830,
      0 failures). This criterion is a preservation invariant, not a behaviour this task introduces, so
