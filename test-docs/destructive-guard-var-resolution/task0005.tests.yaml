  AC-3:
    tests: []
    red_confirmed: true
    red_reason: >-
      After restoring the hook but before pruning cases.json,
      `run-destructive-guard.py` returned 131/151 with exactly 20 FAILs, all
      at index >=58 (e.g. "変数解決: スクラッチ領域への rm -rf" got
      allow-expected but restored hook gave ask/rm-unresolvable; "変数解決:
      変数経由の再帰フラグも再帰削除として扱われる" wanted deny but restored
