      ran each of the 92 added entries' command directly against the base
      hook copy and compared to the entry's recorded expectation; its 20
      DROP decisions were identical, index-for-index, to the runner's 20
      FAILs. Those 20 were removed; the other 72 added entries plus the 58
      base entries were left unedited. AC-3's four named examples were
      checked explicitly: "rm -rf /tmp/" (idx 112, KEEP, base=allow),
      "rm -rf build-debug" (idx 116, KEEP, base=allow), the escaped-paren
      find -delete (idx 107, KEEP, base=deny/find-delete), and the
      quoted-paren "git push \"(\" --force" (idx 108, KEEP,
      base=deny/git-force-push). The fifth named
      example, "rm -rf dist/*", had no existing case-list entry (verified by
      exhaustive grep/search over all 150 pre-prune entries) despite AC-3
      requiring it present afterward and Design section A naming it as one
      of "the exact regressions review found" worth retaining as coverage;
      one new entry was added for it (verdict allow, matching the base
      hook's directly-measured verdict) — recorded as a deviation from the
      Scope section's remove-only framing, justified by AC-3's explicit
      mandatory wording. After pruning + the one addition, re-run is
      132/132 green.
  AC-4:
    tests: []
    red_confirmed: true
    red_reason: >-
      Immediately after restoring the hook (before pruning cases.json),
      `python3 em-workflow/hooks/tests/run-destructive-guard.py` exited 1
