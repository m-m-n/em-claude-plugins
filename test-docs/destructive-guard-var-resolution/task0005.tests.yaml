      ask/rm-unresolvable, current deny/rm-recursive). After restoring
      em-workflow/hooks/destructive-guard.py to the 1fdb27f content and
      re-running the same harness over a 154-string corpus (131 final
      case-list commands + 23 round-3-sourced probes, including the 44KB/88KB
      timing shapes), 154/154 matched — zero mismatches on both verdict and
      the bracketed rule identifier.
  AC-2:
    tests: []
    red_confirmed: false
    red_reason: >-
      Never red for this task: the 58 pre-existing entries were already an
