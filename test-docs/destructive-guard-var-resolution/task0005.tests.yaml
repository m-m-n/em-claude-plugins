  AC-5:
    tests: []
    red_confirmed: false
    red_reason: >-
      This is an end-state performance property of the restored file, not a
      criterion this task's own work flips from red to green: the restored
      hook is byte-identical to the 1fdb27f revision by construction (`diff
      -q` returned no difference, exit 0), so it necessarily inherits base's
      cost profile regardless of input shape, and grep confirms
      invalidated_names()/collect_assignments()/RESOLVED_TEXT_MAX are absent
      from the restored file entirely. Measured directly (repeated-assignment
      shape continuing the 11/22/44KB doubling series round3.yaml's
      orchestrator_timing used, extended to 88KB): 44KB (45073B) base=0.051s
      current=0.051s, both "allow"; 88KB (90133B) base=0.079s current=0.082s,
      both "allow". Both current numbers are within 2x of base and under 1s;
      both produced a verdict, neither approached the 10s hook timeout. Note
      on rigor: an attempt to reproduce round3.yaml's own cited 44KB=9.85s
      figure by re-running the *pre-restore* (still-var-resolution) hook
      against this synthetic shape did not reproduce that magnitude (0.077s
      at 44KB with a plain `V{i}=val{i};` shape, 0.036s at 11KB with an
      `export V{i}=v;` shape) — the precise adversarial construction
      invalidated_names() is quadratic on was not independently rediscovered
      in the time available. AC-5's own requirement is about the restored
      hook's numbers, which are directly measured and recorded above;
      round3.yaml's orchestrator_timing (11KB=0.65s/22KB=2.48s/44KB=9.85s
      current vs 0.02s/0.03s/0.05s base) is relied on as the cited evidence
      for why the withdrawal was warranted, per the orchestrator's explicit
      instruction to treat that block as the evidence base.
