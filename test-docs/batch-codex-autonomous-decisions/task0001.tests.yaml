      exist pre-rewrite). The other three (no leaked provider name, no
      rate-limit description, no new gate_id) were ALREADY true before any
      implementation -- they assert an invariant this rewrite must not
      violate, not a new behaviour it introduces -- so those three were
      never observed red; see notes.
notes: >
  AC-7's three negative-only checks (test_no_fallback_provider_name_leaked,
  test_no_rate_limit_detection_description, test_no_new_gate_id_minted)
  passed vacuously against the pre-rewrite document too, since the forbidden
  terms were already absent there. They remain in the suite as regression
  guards against this rewrite (and future ones) introducing a provider name,
  a rate-limit description, or a new gate_id, but they do not themselves
  prove a red-to-green transition for AC-7 -- only
  test_wrapper_fallback_provider_fact_stated_once_no_name does that. The
  fix to tests/test_spec_change_origin_binding.py (outside this task's
  expected_files) is recorded as a deviation in the implementer report: its
  test_both_directions_marked_non_overridable pinned the same "final and
  non-overridable" phrase count (2) that AC-4/C5 changes to 1; it regressed
  when question-resolution.md was rewritten and was updated in the same
  change, per C5 ("counting pins are updated, not removed").
