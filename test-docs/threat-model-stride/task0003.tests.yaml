notes: >-
  All three edited documents (planner-contract.md, create-plan-phase.md,
  spec-writer-contract.md) were verified red-then-green by temporarily
  `git stash`-ing the three edits, running the new test module against the
  pre-edit revision (7 real failures/errors observed across AC-1/AC-2/AC-3/
  AC-4/AC-5-pointer, all failing for the expected missing-content reason),
  then restoring the edits and re-running to green.

  IMPORTANT operational finding: `git stash` is a repository-wide (not
  worktree-local) resource -- `.git/refs/stash` is shared across every
  worktree of this repository. While performing the red-check above, a
  concurrent implementer (task0002, also mid-flight in a sibling worktree)
  was independently using `git stash` for the same red-check technique at
  the same time. My unqualified `git stash pop` popped task0002's top-of-stack
  WIP entry (their edit to em-workflow/agents/implementation-planner.md
  plus an untracked test file) into my working tree instead of my own, and
  git's own stash-drop then discarded that entry from the shared stash
  list. I recovered it via `git fsck --unreachable` (the commit objects
  survive until garbage-collected) and restored it to the shared stash
  list with `git update-ref -m "<original message>" refs/stash <commit>
  <old-top>` before discarding it from my own working tree and restoring my
  own edits from my own dangling stash commit (found the same way). No data
  was lost, but this is a latent hazard for any future implementer tempted
  to use `git stash` (even scoped with `-- <pathspec>`) inside a
  worktree-based parallel-implementation workflow: the stash stack is
  shared, so a blind `pop`/`apply` (without pinning to a specific commit
  SHA) can silently grab another task's uncommitted work. Safer
  alternatives: never use bare `git stash push`/`git stash pop`; if a
  temporary set-aside is unavoidable, capture the commit SHA from `git
  stash create` immediately and apply/drop by that exact SHA rather than by
  stack position.
