      - test_stop_reason_coverage_version_bump.TestFr7VersionMatcherNegativeProofs.test_rejects_a_version_below_the_floor
      - test_stop_reason_coverage_version_bump.TestFr7VersionMatcherNegativeProofs.test_rejects_a_malformed_value
    red_confirmed: true
    red_reason: >-
      Two rounds of deliberate weakening, both reverted after observing
      the failures: (1) form+floor body stubbed to a no-op -- the two
