  AC-1:
    tests:
      - test_abort_terminal_commit_precedence.TestVersionBump.test_plugin_manifest_version_is_well_formed_and_at_least_0_2_2
      - test_abort_terminal_commit_precedence.TestVersionBump.test_marketplace_em_workflow_entry_version_is_well_formed_at_least_0_2_2_and_agrees_with_manifest
    red_confirmed: true
    red_reason: >-
      Captured in the 4a baseline run (repo at 0.2.3): the pre-change
      tests test_plugin_manifest_version_is_0_2_2 and
      test_marketplace_em_workflow_entry_version_is_0_2_2 both failed with
      AssertionError: '0.2.3' != '0.2.2' (string-equality against
      EXPECTED_VERSION). Renamed and rewritten to the form+floor+agreement
      matchers here, which pass against the same live files at 0.2.3.
  AC-2:
    tests:
      - test_abort_terminal_commit_precedence.TestFr6VersionMatcherNegativeProofs.test_accepts_a_forged_higher_version_in_both_registries
      - test_abort_terminal_commit_precedence.TestFr6VersionMatcherNegativeProofs.test_accepts_a_two_digit_patch_component_via_numeric_comparison
      - test_abort_terminal_commit_precedence.TestFr6VersionMatcherNegativeProofs.test_rejects_a_version_below_the_floor_in_both_registries
      - test_abort_terminal_commit_precedence.TestFr6VersionMatcherNegativeProofs.test_rejects_a_malformed_value_in_either_registry
      - test_abort_terminal_commit_precedence.TestFr6VersionMatcherNegativeProofs.test_rejects_disagreeing_registries
    red_confirmed: true
    red_reason: >-
      Two rounds of deliberate weakening, both reverted after observing
      the failures: (1) well-formed check stubbed to always True, floor
      and agreement comparisons stubbed to no-ops -- the three
      reject-verdict tests (below-floor, malformed, disagreeing) all
      failed with "AssertionError: AssertionError not raised". (2) floor
      comparison direction flipped (assertGreaterEqual -> assertLess) --
      the two accept-verdict tests (forged-higher, two-digit-patch) both
      failed since 99.0.0 / 0.2.10 no longer compared as >= the floor.
      Implementation restored after each round; full module re-run green.
