      value at all. Both passed before this task's version bump and
      continue to pass after it (now at 0.3.4 in both registries); there is
      no way to observe a red for "the version was raised from its own
      pre-task value" with the tests the repository has. Verified
      manually: em-workflow/.claude-plugin/plugin.json and
      .claude-plugin/marketplace.json both read 0.3.4 for em-workflow;
      .claude-plugin/marketplace.json's em-review entry is untouched
      (0.5.13).
