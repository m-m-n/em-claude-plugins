      - "destructive-guard-cases.json: ペイロード内評価(rm-unresolvable): bash -c ペイロード内のバッククォートのみの対象も同じ ask（両スペル対称性）"
      - "destructive-guard-cases.json: ペイロード内評価(rm-unresolvable): eval ペイロード内の $() のみの対象は直接書いた場合と同じ ask"
      - "destructive-guard-cases.json: ペイロード内評価(rm-unresolvable): eval ペイロード内のバッククォートのみの対象も同じ ask（両スペル対称性）"
      - "destructive-guard-cases.json: ペイロード内評価(rm-unresolvable): here-string ペイロード内の $() のみの対象は直接書いた場合と同じ ask"
      - "destructive-guard-cases.json: ペイロード内評価(rm-unresolvable): here-string ペイロード内のバッククォートのみの対象も同じ ask（両スペル対称性）"
    red_confirmed: true
    red_reason: >-
      Added the six case-table entries and the new
      TestPayloadCarriedSubstitutionMatchesDirectForm class first, then ran
      both against the pre-Part1 source (`git stash` of only
      destructive-guard.py, keeping the new test/table content): the case
      table reported 189/195 (6 FAIL, exactly the six new payload entries,
      each got=allow instead of the expected ask); the unit class failed on
      test_payload_forms_match_direct_form_attended
      (AssertionError: 'allow' != 'ask' for every one of the six shapes) and
      on the never-allow / unattended-demotion methods likewise. Root cause:
      extract_shell_payload() was reading the ALREADY flag-converted tokens,
      so a `-c`/`eval`/here-string payload whose whole argument mixed real
      text ("rm -rf ") with a substitution lost the substitution's marker
      before the payload string was captured, and the re-scanned payload
      became a targetless `rm -rf` (zero-target early return -> allow).
      After swapping statements() to extract from the marked-but-unstripped
      tokens, all six shapes reach ask/rm-unresolvable attended and
      deny unattended, matching the direct form exactly.
  AC-2:
    tests:
      - "tests.test_destructive_guard_command_substitution.TestCaseTableDiscipline.test_every_pre_task_command_preserved_with_only_named_changes"
      - "tests.test_destructive_guard_command_substitution.TestCaseTableDiscipline.test_runner_reports_every_case_passing"
      - "tests.test_destructive_guard_command_substitution.TestFR5PinnedVerdictsUnchanged.test_fr5_pinned_verdicts"
      - "tests.test_destructive_guard_command_substitution.TestNonDeletePositionsUnaffected.test_non_delete_positions_stay_allow"
    red_confirmed: false
    red_reason: >-
      AC-2 pins an invariant the ordering fix must NOT disturb (the whole
      `allow` half, the variable-expansion payload verdict, the literal-path
      payload deny); the task plan's own Test Notes list only AC-1, AC-3 and
      AC-6 as expected to fail before the change. These tests were green
      before Part 1 landed (nothing in scope for AC-2 was ever broken) and
      remain green after -- their job is to catch a regression the reorder
      could have caused (e.g. routing every marked token through the payload
      path, not just shell-invocation ones), not to prove a bug fix.
