    red_confirmed: true
    red_reason: "The AC-1 to AC-4 tests failed against the base script as recorded under those criteria. Of the operation-boundary tests, test_ac6_all_subcommands_use_only_read_operations_with_an_explicit_repository failed against the base script with the updated stub (AssertionError: 'stop' != 'github', then the per-test boundary check: unexpected gh repo view shape), and test_ac6_git_is_used_only_to_read_the_remote_url failed on the same boundary check. The other three listed tests passed against the base script and keep passing; the forged-call test was extended with the retired request shape, a wider field list and a four-segment --repo value, and it still rejects every write-shaped call. The per-test boundary check runs after every test of tests/test_merge_pr.py, which passes as a whole."
