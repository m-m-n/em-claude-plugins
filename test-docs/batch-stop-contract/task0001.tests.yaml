notes: >-
  Two bugs were found and fixed in the test module itself during
  implementation, both before any assertion was made about the contract
  document's content: (1) `_forged_coverage_table` omitted a header row,
  which the shared `_table_rows` helper always drops as the header --
  silently losing one real forged data row per sample; fixed by adding a
  header + separator line. (2) three prose substring assertions
  (`no external tool`, the `no `workflow.yaml` step is in effect` sentinel
  condition, and the two Responsibility-boundary phrases) initially failed
  against the freshly written contract document because the target phrase
  spanned a line wrap in the rendered Markdown; fixed by adding a
  `_normalize` whitespace-collapsing helper (matching the existing
  tests/test_batch_policies.py convention) and applying it to those
  specific multi-word phrase checks, keeping raw (newline-preserving) text
  for every table-extraction path.
