      - tests.test_sca_task_filing.TestTruncateUntrusted.test_never_splits_a_multibyte_utf8_sequence
    red_confirmed: true
    red_reason: >-
      All eight raised NotImplementedError against the stub
      (truncate_untrusted / format_reference_line / file_tasks /
      group_findings_by_package were stubs). All eight went green after
      restoring the real implementation.
      test_truncated_advisory_reaches_the_filed_reference_field is the
      end-to-end proof AC-6 names: a 5000-byte advisory id, recorded via
      the stand-in's --references-file-content capture, arrives truncated
