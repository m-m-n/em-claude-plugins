acceptance_tests:
  AC-1:
    tests:
      - tests.test_sca_task_filing.TestFileTasksBranches.test_entry_point_present_files_via_ntd
      - tests.test_sca_task_filing.TestFileTasksBranches.test_no_entry_point_writes_a_report
      - tests.test_sca_task_filing.TestFileTasksBranches.test_listing_failure_degrades_to_report_and_states_degradation
      - tests.test_sca_task_filing.TestFileTasksBranches.test_listing_unparsable_output_also_degrades
