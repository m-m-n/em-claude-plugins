      (post-merge: the integration branch's real `scan` survives a merge
      that also lands this task's `file-tasks`) is not independently
      testable from inside this worktree before task0001 has merged -- it
      is a property of the merge step itself, carried out per the
      co-ownership skeleton's symmetric merge duty and reported in the
      implementer's merge report, not by a unit test here.
