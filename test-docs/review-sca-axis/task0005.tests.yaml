    red_reason: >-
      Against the red-confirmation stub (every real function replaced with
      `raise NotImplementedError("stub")`, CLI reduced to a fixed
      "not implemented yet" stderr message and exit 2):
      test_entry_point_present_files_via_ntd and
      test_no_entry_point_writes_a_report raised NotImplementedError from
