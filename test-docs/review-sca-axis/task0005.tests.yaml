      - tests.test_sca_task_filing.TestSeverityPriorityAndTruncation.test_severity_recorded_as_fact_in_reference_line
      - tests.test_sca_task_filing.TestSeverityPriorityAndTruncation.test_long_advisory_sourced_string_is_truncated_with_visible_marker
