notes: >-
  Implementation was written before the test module (a single-pass
  design given the task plan's already-pinned contracts), so red
  confirmation was obtained by temporarily replacing
  em-workflow/scripts/scan-dependencies.py with a stub whose every real
  function raises NotImplementedError and whose CLI always exits 2 with a
  fixed message, running the full test module against that stub (31 of 32
  tests failed for exactly the reasons recorded above; the 32nd,
  test_script_never_uses_the_top_level_resolution_command, is a static
  source-text check that is trivially true regardless of implementation
  state), then restoring the real implementation and re-running (32/32
  green). This uncovered one real defect before it ever reached a
  committed state: the script's own module docstring named the banned git
  flag literally in prose, which the restored-implementation run caught as
  a genuine (if trivial) regression against that same static check; the
  wording was fixed in the same pass.

  notion-task-dispatch's installed CLI (0.3.0, scripts/ntd.ts) has no
  subcommand for listing existing tasks, no 参照 property in its task
  schema, and no セキュリティ value in its 種別 select (only
  機能/バグ/改善/調査) -- confirmed by reading scripts/args.ts and
  scripts/ntd.ts in the installed plugin cache. Per IMPLEMENTATION.md's
  Open Questions ("if the installed surface cannot support incomplete-task
  enumeration, D6's report branch is the standing fallback and the
  mismatch is a reportable plan deviation"), this is exactly that
  mismatch: against the REAL installed CLI, `list_security_tasks` will
  always fail (unrecognized `task list` subcommand) and every real
  invocation therefore takes D6's degraded report branch today. This is
  expected and out of scope for this task ("Any change to the external
  task system's own repository or templates" is explicitly excluded); the
  entry-point invocation surface this script calls (`task list --type
  セキュリティ --format json`, `task create --title <pkg> --type
  セキュリティ --priority 高 --references-file <path>`, `task update --id
  <id> --append-references-file <path>`) is this task's own designed
  contract for the entry point, exercised end-to-end by every test via a
  stand-in executable (Test Notes), and is ready for a future task to
  implement against once notion-task-dispatch grows the corresponding
  subcommands.
