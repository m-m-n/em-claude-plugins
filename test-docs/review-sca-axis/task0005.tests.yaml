      four went green immediately after restoring the real implementation
      (no further edits needed), confirming they exercise the branch logic
      and not an accidental tautology.
  AC-2:
    tests:
      - tests.test_sca_task_filing.TestReportDestinationResolution.test_resolves_to_main_repo_root_from_main_repo
      - tests.test_sca_task_filing.TestReportDestinationResolution.test_resolves_to_main_repo_root_from_linked_worktree
      - tests.test_sca_task_filing.TestReportDestinationResolution.test_report_destination_is_tmp_under_main_repo_root
      - tests.test_sca_task_filing.TestReportDestinationResolution.test_script_never_uses_the_top_level_resolution_command
    red_confirmed: true
    red_reason: >-
      test_resolves_to_main_repo_root_from_main_repo,
      test_resolves_to_main_repo_root_from_linked_worktree and
      test_report_destination_is_tmp_under_main_repo_root all raised
      NotImplementedError against the stub (resolve_main_worktree_root /
      report_destination were stubs). Restoring the real implementation
      turned all three green, including the linked-worktree case (the
      destination resolves to the main repo root even when invoked from the
      non-first, "integration"-named worktree -- exercised against a real
      disposable repository with `git worktree add`, per Test Notes).
      test_script_never_uses_the_top_level_resolution_command is a static
      source-text check (absence of a banned substring): it was
      trivially green against the stub too (the stub obviously does not
      call it either), so it carries no red-state evidence on its own --
      see `notes` below. One self-correction during implementation: the
      script's own explanatory docstring initially spelled out the banned
      git flag by name in prose, which this same test caught (green
      became red) after the real implementation was restored; the wording
      was rephrased to describe the banned command without embedding its
      literal flag string, after which the test passed.
  AC-3:
    tests:
      - tests.test_sca_task_filing.TestGroupingAndFiling.test_three_advisories_one_package_produce_one_task_with_three_lines
      - tests.test_sca_task_filing.TestGroupingAndFiling.test_two_packages_produce_two_tasks
