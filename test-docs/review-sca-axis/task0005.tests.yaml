      - tests.test_sca_task_filing.TestGroupingAndFiling.test_incomplete_task_present_appends_only_unrecorded_advisories
      - tests.test_sca_task_filing.TestGroupingAndFiling.test_only_complete_or_discarded_tasks_still_files_a_new_task
      - tests.test_sca_task_filing.TestGroupingAndFiling.test_idempotent_second_run_files_nothing_new
    red_confirmed: true
    red_reason: >-
      All three raised NotImplementedError against the stub (file_tasks
      itself). All three went green after restoring the real
      implementation. test_only_complete_or_discarded_tasks_still_files_a_new_task
