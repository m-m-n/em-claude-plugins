      reached because file_tasks/group_findings_by_package themselves are
      stubs). All five went green after restoring the real implementation,
      and the two monkeypatch tests specifically demonstrate that no call
      site composes a key or parses a title independently of the one
      designated function -- the requirement AC-5's second half states.
  AC-6:
