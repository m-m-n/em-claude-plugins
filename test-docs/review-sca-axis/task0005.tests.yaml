  AC-5:
    tests:
      - tests.test_sca_task_filing.TestBuildDedupKey.test_package_only_key_is_the_package_itself
      - tests.test_sca_task_filing.TestBuildDedupKey.test_package_and_advisory_key_combines_both
      - tests.test_sca_task_filing.TestBuildDedupKey.test_key_disambiguates_pairs_that_would_collide_under_naive_concatenation
      - tests.test_sca_task_filing.TestBuildDedupKey.test_no_call_site_composes_a_key_itself
      - tests.test_sca_task_filing.TestRecoverPackageAdvisory.test_no_call_site_parses_title_itself
    red_confirmed: true
    red_reason: >-
      The three direct build_dedup_key tests raised NotImplementedError
      against the stub. test_no_call_site_composes_a_key_itself and
      test_no_call_site_parses_title_itself failed differently: they
      monkeypatch build_dedup_key / recover_package_advisory to a
