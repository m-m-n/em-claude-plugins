      - tests.test_sca_scan_execution.TestReviewPhasePartialCoverageStatement.test_states_combined_reason_on_the_run_row
      - tests.test_sca_scan_execution.TestReviewPhasePartialCoverageStatement.test_states_findings_still_enter_the_evaluator_inputs
      - tests.test_sca_scan_execution.TestReviewPhasePartialCoverageStatement.test_existing_ordinary_skip_pin_still_present
