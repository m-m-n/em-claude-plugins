      - tests.test_muse_guard.TestBothCopiesShape.test_both_copies_are_executable
      - tests.test_muse_guard.TestBothCopiesShape.test_copies_differ_in_exactly_one_line_the_plugin_slug
      - tests.test_muse_guard.TestSourceHygiene.test_neither_plugins_hooks_tests_directory_gained_a_file
      - tests.test_muse_guard.TestSourceHygiene.test_no_third_party_imports
