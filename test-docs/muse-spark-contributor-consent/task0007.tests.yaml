      - tests.test_muse_guard.TestNoDecisionCases.test_unrelated_command_is_not_an_invocation
      - tests.test_muse_guard.TestNoDecisionCases.test_payload_whose_tool_is_not_bash_is_undecided
      - tests.test_muse_guard.TestNoDecisionCases.test_empty_command_is_undecided
      - tests.test_muse_guard.TestNoDecisionCases.test_unparseable_stdin_is_undecided
      - tests.test_muse_guard.TestNoDecisionCases.test_heredoc_header_look_alike_inside_a_quoted_string_does_not_hide_a_real_invocation
      - tests.test_muse_guard.TestNoDecisionCases.test_invocation_after_a_genuine_heredocs_terminator_still_denies
    red_confirmed: false
    red_reason: >
      This criterion states the no-misfire floor is UNCHANGED. All of these
