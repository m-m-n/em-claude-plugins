      this task's edit; none was expected to go red, and none did --
      verified by construction (baseline_failures is empty, and the full
      suite, including this class, stays green after the rebuild).
  AC-6:
    tests:
      - tests.test_muse_guard.TestSourceHygiene.test_no_ask_decision_literal
      - tests.test_muse_guard.TestSourceHygiene.test_no_allow_decision_literal
      - tests.test_muse_guard.TestSourceHygiene.test_the_only_subprocess_launched_is_the_git_call
      - tests.test_muse_guard.TestNonInvocationShortCircuit.test_non_invocation_never_derives_a_project_key_or_touches_the_store
      - tests.test_muse_guard.TestNonInvocationShortCircuit.test_an_invocation_does_derive_a_project_key_and_read_the_store
      - tests.test_muse_guard.TestLatencyStaysWellUnderTheRegisteredTimeout.test_a_representative_sample_of_hook_calls_completes_quickly
      - tests.test_muse_guard.TestVerifyReproductionsAndWideningTables.test_unterminated_quote_is_undecided_not_an_exception
    red_confirmed: false
    red_reason: >
      The hygiene/envelope invariants (no ask/allow literal, one subprocess
      call site, the pre-store-read short circuit, the latency budget) are
      pre-existing and this task must not change them; they were already
      green and stayed green. The unterminated-quote case was manually
      checked against the pre-edit implementation and ALSO already produced
      no decision there, but via a different, incidental mechanism (the old
      per-statement `shlex.split` raised ValueError on the unbalanced quote
      and that one segment was silently skipped) rather than the explicit,
      whole-string tolerance clause the rebuilt `_scan_statements` now
      raises for directly. The observable behavior did not change; the
      mechanism guaranteeing it now matches NFR2's wording precisely, so
      this test pins that behavior going forward rather than proving a red
      state.
