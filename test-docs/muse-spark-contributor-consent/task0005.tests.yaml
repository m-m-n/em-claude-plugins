      iter_document_files().
  AC-2:
    tests:
      - tests.test_muse_consent_no_new_questions.TestBaselineIsLiteral.test_baseline_is_a_plain_positive_int_literal_table
      - tests.test_muse_consent_no_new_questions.TestBaselineIsLiteral.test_baseline_and_excluded_files_are_disjoint
      - tests.test_muse_consent_no_new_questions.TestInteractiveQuestionBudgetIsNotExceeded.test_no_develop_or_review_document_exceeds_its_pinned_budget
    red_confirmed: true
    red_reason: >-
      Line-targeted mutation of the BASELINE_COUNTS entry for
      em-workflow/skills/review/SKILL.md from 1 to 0: both
      test_baseline_is_a_plain_positive_int_literal_table (assertGreater(count, 0)
      failed) and test_no_develop_or_review_document_exceeds_its_pinned_budget
      (measured count 1 > pinned 0) failed for the right reason, then reverted.
  AC-3:
    tests:
      - tests.test_muse_consent_no_new_questions.TestBudgetComparisonHelper.test_passes_when_measured_equals_baseline
      - tests.test_muse_consent_no_new_questions.TestBudgetComparisonHelper.test_passes_when_measured_is_lower_than_baseline
      - tests.test_muse_consent_no_new_questions.TestBudgetComparisonHelper.test_fails_when_measured_exceeds_baseline
