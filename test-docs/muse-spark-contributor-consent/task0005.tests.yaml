  AC-1:
    tests:
      - tests.test_muse_consent_no_new_questions.TestDocumentEnumeration.test_walks_only_references_and_skills_of_both_plugins
      - tests.test_muse_consent_no_new_questions.TestDocumentEnumeration.test_known_develop_and_review_documents_are_included
    red_confirmed: true
    red_reason: >-
      Mutated PLUGINS to drop "em-review" (line-targeted sed on the module
