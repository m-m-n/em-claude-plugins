      - tests.test_assumptions_reversible_criterion.TestNonVacuity.test_carries_criterion_rejects_unrelated_forged_text
      - tests.test_assumptions_reversible_criterion.TestNonVacuity.test_carries_criterion_rejects_field_token_alone
