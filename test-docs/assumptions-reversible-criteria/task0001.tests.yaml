      - tests.test_assumptions_reversible_criterion.TestNonVacuity.test_cites_criterion_rejects_forged_text_missing_pointer
      - tests.test_assumptions_reversible_criterion.TestNonVacuity.test_cites_criterion_rejects_pointer_only_forged_text
      - tests.test_assumptions_reversible_criterion.TestNonVacuity.test_gate_id_extractor_finds_nothing_in_unrelated_forged_text
      - tests.test_assumptions_reversible_criterion.TestNonVacuity.test_gate_id_extractor_detects_forged_new_gate_id
      - tests.test_assumptions_reversible_criterion.TestNonVacuity.test_gate_id_extractor_ignores_file_extension_shaped_tokens
      - tests.test_assumptions_reversible_criterion.TestNonVacuity.test_feature_attribution_checker_rejects_unrelated_forged_text
      - tests.test_assumptions_reversible_criterion.TestNonVacuity.test_feature_attribution_checker_detects_forged_feature_path
      - tests.test_assumptions_reversible_criterion.TestNonVacuity.test_feature_attribution_checker_detects_forged_task_plan_filename
      - tests.test_assumptions_reversible_criterion.TestNonVacuity.test_stdlib_checker_accepts_forged_stdlib_only_source
      - tests.test_assumptions_reversible_criterion.TestNonVacuity.test_stdlib_checker_detects_forged_non_stdlib_import
      - tests.test_assumptions_reversible_criterion.TestNonVacuity.test_consumption_retention_substrings_absent_from_forged_stripped_copy
    red_confirmed: false
    red_reason: >-
      Each matcher/extractor and its non-vacuity companion were authored
      together in this same new file, so there is no prior implementation
      state for the companion to have lagged behind -- correctness (accept
      on forged-with, reject on forged-without) was verified by construction
      on the very first run rather than by a red-then-green migration. This
      is a property of the test module's own design (every matcher is
      exercised against both an accepting and a rejecting forged sample),
      not of the seven documents' content.
  AC-7:
    tests:
      - tests.test_assumptions_reversible_criterion.TestNoNewGateId.test_no_document_gains_a_new_gate_id
      - tests.test_assumptions_reversible_criterion.TestNoFeatureAttribution.test_no_document_carries_feature_attribution
      - tests.test_assumptions_reversible_criterion.TestStandardLibraryOnlyImports.test_every_test_module_imports_only_stdlib
      - tests.test_assumptions_reversible_criterion.TestNonVacuity.test_gate_id_extractor_detects_forged_new_gate_id
      - tests.test_assumptions_reversible_criterion.TestNonVacuity.test_feature_attribution_checker_detects_forged_feature_path
      - tests.test_assumptions_reversible_criterion.TestNonVacuity.test_stdlib_checker_detects_forged_non_stdlib_import
    red_confirmed: false
    red_reason: >-
      All three absence/invariant checks were green from the first run:
      the six binding sentences added by this task introduce no new
      gate_id-shaped token, no attribution to this feature (its own
      feature-docs path or task-plan filenames), and the new test module
      imports only the standard library (verified all 95 pre-existing
      modules already did too, so no narrowing was needed). Each has a
      non-vacuity companion (listed above) that forges a genuine violation
      and confirms the underlying extractor/checker would catch it, proving
      the absence checks are not passing by vacuously matching nothing.
