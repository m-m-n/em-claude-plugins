      - tests.test_batch_stop_contract_skill_wiring.TestStateValueMatcherCanFail.test_matcher_rejects_forged_batch_mode_state_value_restatement
      - tests.test_batch_stop_contract_skill_wiring.TestOnceBoundaryBareLiteralMatcherCanFail.test_forged_bare_literal_excerpt_is_well_formed_and_found
      - tests.test_batch_stop_contract_skill_wiring.TestOnceBoundaryBareLiteralMatcherCanFail.test_matcher_rejects_bare_once_boundary_literal
    red_confirmed: true
    red_reason: >-
      The negative-proof tests and the matcher's state-value extension were
      authored together in the same edit, so after that edit they already
      passed. To confirm a genuine red observation rather than "correct by
      construction", the two new rule blocks (`state={value}` shape loop and
      the bare `ONCE_BOUNDARY_STATE_VALUE` check) were temporarily deleted
      from `_find_contract_literal_violations` and just this AC's two test
      classes were re-run: both
      test_matcher_rejects_forged_skill_state_value_restatement and
      test_matcher_rejects_forged_batch_mode_state_value_restatement failed
      with "AssertionError: [] is not true : matcher failed to detect the
      forged state-value restatement" (the reverted matcher returned an
      empty violations list for text containing `state=phase_done`), and
      test_matcher_rejects_bare_once_boundary_literal failed the same way
      for the bare `phase_done` literal. The matcher body was then restored
      verbatim and the full suite re-run to confirm 2425 tests OK (no
      regression from the round trip). The three
      `*_is_well_formed_and_found` non-vacuity tests confirm the slicer
      finds each forged excerpt and that it genuinely carries the literal
      being tested (`state=phase_done` for the first two, bare `phase_done`
      without the `state=` prefix for the third) -- true by construction of
      the fixture strings themselves, and unaffected by the matcher
      revert/restore since they never call the matcher.
  AC-6:
    tests:
      - tests.test_batch_stop_contract_skill_wiring.TestStateValueGuardWholeFileScope.test_step_status_words_actually_occur_in_the_real_files
      - tests.test_batch_stop_contract_skill_wiring.TestStateValueGuardWholeFileScope.test_guard_does_not_flag_bare_stopped_if_it_were_present
      - tests.test_batch_stop_contract_skill_wiring.TestStateValueGuardWholeFileScope.test_guard_raises_no_violation_over_whole_skill_md
      - tests.test_batch_stop_contract_skill_wiring.TestStateValueGuardWholeFileScope.test_guard_raises_no_violation_over_whole_batch_mode_md
    red_confirmed: false
    red_reason: >-
      Structural/textual non-vacuity and false-positive checks with no
      implementation-driven red-to-green transition: `completed` and
      `skipped` already occurred as ordinary `workflow.yaml` step-status
      vocabulary in both real files before this task's edits (verified by
      direct grep against the pre-edit worktree), and the extended guard
      never checks bare step-status words at all (only the `state={value}`
      shape and the bare `phase_done` literal), so it could not have
      flagged them before or after. `stopped` does NOT occur literally in
      either real pointer document (confirmed by grep against the pre-edit
      worktree) -- this is a discrepancy from IMPLEMENTATION.md D2's
      description of it as "ordinary step-status vocabulary in both
      pointer documents", noted in this task's report rather than silently
      reinterpreted; workflow.yaml's own step-status closed set (per
      SKILL.md's 「ターンを終わらせていい唯一の条件」) is `pending` /
      `in_progress` / `completed` / `skipped` / `failed` / `needs_update`,
      which never includes `stopped`. `stopped` is still whitelisted in the
      matcher for structural completeness (never flagged if it appears),
      verified against a synthetic sample since no real-file non-vacuity
      proof is possible for it.
  AC-7:
    tests:
      - tests.test_batch_stop_contract_skill_wiring.TestOwnModuleStdlibOnly.test_own_imports_are_all_stdlib
    red_confirmed: false
    red_reason: >-
      Structural/static check with no implementation-driven red-to-green
      transition: it inspects this module's own AST for non-stdlib
      imports, true the moment the file was written (no new import was
      added by this task's extension). Discovery and whole-suite-green are
      verified operationally instead: `python3 -m unittest discover -s
      tests` ran 2410 tests OK before this task's edits (4a baseline) and
      2425 tests OK after (2410 + 15 net new test methods this task adds:
      1 once-boundary occasion test in TestBatchTerminalLineSubsectionWiring
      + 1 in TestBatchModeTerminalLineWiring, the 3
      TestSkillMdNamesNoTerminalStateCount tests, the 6
      TestStateValueMatcherCanFail / TestOnceBoundaryBareLiteralMatcherCanFail
      matcher-proof tests, and the 4 TestStateValueGuardWholeFileScope tests
      -- 1 + 1 + 3 + 6 + 4 = 15). No regression: the diff between the
      pre-edit and post-edit full-suite runs is empty.
notes: >-
  Implementer note (not a file-scope deviation): IMPLEMENTATION.md D2
  states that `completed`, `stopped` and `skipped` are "ordinary
  step-status vocabulary in both pointer documents". This holds for
  `completed` and `skipped` (both occur repeatedly in SKILL.md as
  workflow.yaml step-status values) but NOT for `stopped`, which does not
  occur literally in either `skills/develop/SKILL.md` or
  `references/batch-mode.md` as of this task, and is not part of
  workflow.yaml's own step-status closed set at all (that vocabulary has no
  `stopped` value; `stopped` is exclusively the terminal-line contract's
  own `state` domain member). The guard still whitelists it correctly (it
  is never flagged by shape or bare-literal checks either way), so this
  does not affect AC-4/AC-5/AC-6's pass/fail outcome -- it only means the
  AC-6 false-positive proof for `stopped` specifically is demonstrated
  against a synthetic sample rather than real-file text, documented in
  TestStateValueGuardWholeFileScope's class docstring and reasserted here.
