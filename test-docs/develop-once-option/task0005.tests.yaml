      - tests.test_batch_stop_contract.TestNoneReservedRangeMatcherNegativeProofs.test_field_values_old_restrictive_phrasing_is_rejected
      - tests.test_batch_stop_contract.TestNoneReservedRangeMatcherNegativeProofs.test_field_values_forged_bullet_is_otherwise_well_formed
      - tests.test_batch_stop_contract.TestNoneReservedRangeMatcherNegativeProofs.test_stop_reason_codes_old_restrictive_phrasing_is_rejected
      - tests.test_batch_stop_contract.TestNoneReservedRangeMatcherNegativeProofs.test_stop_reason_codes_forged_prose_is_otherwise_well_formed
    red_confirmed: false
    red_reason: >-
      This AC is the negative-proof / non-vacuity-guard requirement for
      the AC-1/AC-2 matcher itself, not a new production-code behavior:
      the negative-proof tests assert AssertionError is raised for
      forged old-wording samples, and the matcher
      (_assert_none_reserved_for_non_stop_states_stated) they exercise
