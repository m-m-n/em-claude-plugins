      - tests.test_batch_stop_contract.TestContractDocumentStructure.test_field_values_step_c_asymmetry_stated
    red_confirmed: true
    red_reason: >-
      AssertionError: 'Step C is not a `workflow.yaml` step' not found
      in the `## Field values` section text -- the old `step` bullet
      never named Step C explicitly, so the value asymmetry between a
      normal-completion Step C turn (`retrospect`) and a `step-c-abort`
      turn (`no-step`) was left to be inferred rather than stated.
  AC-6:
