    red_confirmed: true
    red_reason: >-
      AssertionError: 'take precedence over the general rule' not found
      in the `## Field values` section text -- the `step` bullet stated
      the executed-step rule, the `no-step` sentinel and the
      `state=completed` rule as three unordered sentences with no
      explicit priority relation.
  AC-5:
