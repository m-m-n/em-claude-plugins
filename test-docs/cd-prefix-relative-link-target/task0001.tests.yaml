baseline_failures: []          # before any edit: python3 -m unittest discover -s tests -> Ran 12206 tests, OK (skipped=1); no failing test
final_failures: []             # re-executed after the implementation and after writing this record: python3 -m unittest discover -s tests -> Ran 12223 tests, OK (skipped=1, the same single skip as the baseline); no failing test
acceptance_tests:
  AC-1:
    tests:
      - tests.test_bash_guard_cd_prefix.TestRelativeLinkTarget.test_ac1_the_fixture_links_have_the_claimed_relative_targets
    red_confirmed: true
    red_reason: >-
      Run against the unchanged path check (new tests written first),
      test_ac1_a_link_with_a_relative_target_naming_an_in_area_directory_is_below
      failed in all three subtests (targets proc, ./proc, dev/fd) with
      AssertionError: False is not True, and
      test_ac1_the_hook_allows_the_cd_prefix_form_for_each_relative_link failed
      in all six subtests (input cwd repo1 and wtree, each of the three links)
      with AssertionError: 'silent' != 'allow', because the lexical check read
      the relative target text as under /proc or /dev/fd. The fixture test
      passed before the change by design: it guards that each link has the
      claimed relative target and names an existing directory strictly below
      the area.
  AC-2:
    tests: []
    red_confirmed: false
    red_reason: >-
      Control case: the three links whose absolute targets are <names>/proc,
      <names>/./proc and <names>/dev/fd were below the area before the change
      and stay below it, so the test passed before any implementation; no red
      state occurred. It pins that the change does not take away the True
      result for an absolute target that names an ordinary in-area directory.
  AC-3:
    tests:
      - tests.test_bash_guard_cd_prefix.TestRelativeLinkTarget.test_ac3_a_relative_target_climbing_to_the_root_and_naming_proc_is_false
      - tests.test_bash_guard_cd_prefix.TestRelativeLinkTarget.test_ac3_the_hook_is_silent_for_the_climbing_link
      - tests.test_bash_guard_cd_prefix.TestRelativeLinkTarget.test_ac3_the_climbing_link_has_a_relative_target_with_enough_dotdot
    red_confirmed: false
    red_reason: >-
      The behavior pre-existed: the target text of the climbing link starts
      with `..`, so the lexical check never matched it, and the stage checks
      (the per-stage check and the check after each `..`) already refused the
      stage /proc. The tests passed before the change by design; they pin that
      removing the lexical check of relative targets does not lose the refusal.
      The fixture guard inside the first test asserts that the path otherwise
      names an existing directory strictly below the area. No red state
      occurred.
  AC-4:
    tests: []
    red_confirmed: false
    red_reason: >-
      The behavior pre-existed: the walk already checks each stage before it
      probes it, so nothing under /proc or /dev/fd was probed or read before
      the change either. The tests passed before the change by design and pin
      NFR2 for the new flow. The second test guards the recording itself (a
      probe and a link read under /proc are seen), so the first cannot pass
      because the recording is empty; the first also asserts that the climbing
      link was read. No red state occurred.
  AC-5:
    tests:
      - tests.test_bash_guard_cd_prefix.TestProcessDependentPathCheck.test_ac3_a_link_to_the_process_cwd_is_false
      - tests.test_bash_guard_cd_prefix.TestProcessDependentPathCheck.test_ac3_a_link_to_proc_self_followed_by_cwd_is_false
      - tests.test_bash_guard_cd_prefix.TestProcessDependentPathCheck.test_ac3_a_link_to_a_dev_fd_entry_is_false
      - tests.test_bash_guard_cd_prefix.TestProcessDependentPathNotAllowed.test_ac3_a_link_to_the_process_cwd_inside_the_area_is_silent
    red_confirmed: false
    red_reason: >-
      A dedicated new module is out of scope, but the existing tests listed
      detect the absolute-target links to /proc/self/cwd, to /proc/self
      followed by cwd/<name>, and to /dev/fd/<N> being refused; they are
      unmodified and passed before and after the change; no red state occurred
      for this change.
  AC-6:
    tests:
      - tests.test_bash_guard_cd_prefix.TestAc7StandardLibraryOnly.test_ac7_this_test_module_imports_only_standard_library_modules
    red_confirmed: false
    red_reason: >-
      The verifiable outcome is the project test command,
      python3 -m unittest discover -s tests, ending with no failure and the
      same single skip as the baseline, with no existing assertion removed or
