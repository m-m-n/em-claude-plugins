      - tests.test_codex_hook_interactive_guard.TestNestedReadLimit.test_a_launch_before_an_over_limit_string_is_denied
      - tests.test_codex_hook_interactive_guard.TestNestedReadLimit.test_first_level_strings_are_never_counted
      - tests.test_codex_hook_interactive_guard.TestNestedReadLimit.test_a_level_zero_launch_after_the_limit_is_reached_is_denied
      - tests.test_codex_hook_interactive_guard.TestNestedReadLimit.test_a_first_level_launch_after_the_limit_is_reached_is_denied
    red_confirmed: true
    red_reason: >-
      Ran against the unchanged guard: the constant test failed on both copies
      with `0 != 1 : the constant is assigned exactly once`; the exact-limit
      test (a second-level `python3 -i` string of 1,000,000 characters)
      failed with 'silent' != 'deny' because the second level was never read;
