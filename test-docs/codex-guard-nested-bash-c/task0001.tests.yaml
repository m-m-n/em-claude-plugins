      standard output instead of a deny decision. The table comment is pinned
      by the comment test: with the old text `one level of literals` put back
      it failed with `literal shell -c strings are judged at every level` not
      found in the comment line.
  AC-2:
    tests:
      - tests.test_codex_hook_interactive_guard.TestCasesTable.test_cases_run_against_both_copies
    red_confirmed: false
    red_reason: >-
      Regression guard for behavior that pre-existed: the seven new silent
      rows (outer pipe and stdin reach the second level, a pipe inside it, a
      dynamic operand, a harmless string, an unbalanced quote, a function body)
      and every pre-existing row other than the three changed ones passed
      before the traversal changed, because a second-level string was never
      read; no red state occurred. The existing TestCasesTable test detects a
      changed verdict on any row.
