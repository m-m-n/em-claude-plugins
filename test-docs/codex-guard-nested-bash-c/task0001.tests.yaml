      - tests.test_codex_hook_interactive_guard.TestMalformedAndDeepInput.test_nesting_one_level_deeper_than_the_limit_admits_is_answered
      - tests.test_codex_hook_interactive_guard.TestMalformedAndDeepInput.test_many_sibling_second_level_strings_over_the_limit_are_answered
    red_confirmed: true
    red_reason: >-
      Ran against the unchanged guard: the deepest-nesting test (depth 13,
