    red_confirmed: true
    red_reason: >-
      Changed the three rows (`bash -c "bash -c 'python3 -i'"`,
      `sh -c 'bash -lc "python3 -i"'`, `bash -cx "bash -c 'python3 -i'"`) to
      deny and added the seven new deny rows, then ran the unchanged guard:
