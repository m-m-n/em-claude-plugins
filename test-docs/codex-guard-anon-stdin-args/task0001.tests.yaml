  AC-4:
    tests:
      - tests.test_codex_hook_interactive_guard.TestCasesTable.test_cases_run_against_both_copies
    red_confirmed: false
    red_reason: >-
      TS16, TS17, TS18 (deny) and TS19 (silent) describe the pre-change
      reading that must be kept, so they passed against the base revision and
      no red state occurred. Two more CASES entries (unclosed paren among the
      arguments, silent; stray close paren among the arguments, deny) and one
      for a stray close paren that closes an enclosing subshell (silent) also
      passed on the base. Base-vs-changed comparison (verdicts base / changed):
      zsh -c 'function { python3 -i; } foo(' silent / silent;
      zsh -c 'function { python3; } foo(' silent / silent;
      zsh -c 'function { :; } foo) python3' deny / deny;
      zsh -c 'function { python3; } foo) < f' deny / deny;
      zsh -c '( function { python3; } foo) < f' silent / silent;
      and, where the scan cannot place the close paren because a comment hides
      an open paren from the group reading (the scan does not read comments),
      the fallback to the pre-change reading keeps the base verdict: the
      string "function { :; } foo(# (" followed by a newline and
      "); python3 -i", given to zsh -c, is deny / deny.
  AC-5:
