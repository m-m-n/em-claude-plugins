  AC-2:
    tests:
      - tests.test_codex_hook_interactive_guard.TestCasesTable.test_cases_run_against_both_copies
    red_confirmed: false
    red_reason: >-
      TS7, TS8 and TS9 are deny cases that guard against over-correction; the
      base revision already denies all three, so they passed before any
      implementation and no red state occurred for them. Base-vs-changed
      comparison for the SPEC Out-of-Scope forms (same input to the script at
      base commit 11f27966 and to the changed script, verdicts base / changed):
      zsh -c '() < f { python3; }' deny / deny; zsh -c '< f { python3; }'
      deny / deny; zsh -c '< f ( python3 )' deny / deny. A differential run of
      the two scripts over about 554,000 generated head, form, body, argument
      and tail combinations plus 600,000 random structured commands found no
      verdict change outside the forms with a head stdin redirect or a
      parenthesis range among the arguments, and no deny-to-silent change for
      a plain brace group, a subshell or a function definition.
  AC-3:
    tests:
      - tests.test_codex_hook_interactive_guard.TestCasesTable.test_cases_run_against_both_copies
    red_confirmed: true
    red_reason: >-
      Against the base revision's script installed as both copies, the silent
