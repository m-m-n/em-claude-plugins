    red_confirmed: true
    red_reason: "Against the unchanged hook (final tests, old hook copied into a scratch tree): AssertionError 'EOF' != 'EOF\\r' (three subtests: \\r, \\x0b, U+2028), 'E' != 'E\\rX', and the case 4, 5 and 7 assertions on the body and close extents failed; every FR3 case 1 to 7 verdict was allow in both modes. The cache-clearing determinism test is a guard that was green before and after."
  AC-3:
    tests:
      - tests.test_destructive_guard_lexer_agreement.TestHeredocLineSeparatorsAndJoinedCloseLines.test_every_other_line_break_character_is_a_word_character
      - tests.test_destructive_guard_lexer_agreement.TestHeredocLineSeparatorsAndJoinedCloseLines.test_a_quote_and_an_escape_see_only_the_newline_as_a_line_break
      - tests.test_destructive_guard_lexer_agreement.TestHeredocLineSeparatorsAndJoinedCloseLines.test_the_line_index_splits_at_the_newline_only
      - tests.test_destructive_guard_lexer_agreement.TestHeredocLineSeparatorsAndJoinedCloseLines.test_crlf_here_document_is_allowed
    red_confirmed: true
    red_reason: "Against the unchanged hook: nine subtests failed in the word-character test (one per character of SPEC.md FR3), 27 in the quote / escape test, and the line-index test failed because the old index started lines after \\r and the other characters. test_crlf_here_document_is_allowed went red on its delimiter assertion ('EOF' != 'EOF\\r'); the allow verdict of FR3 case 8 itself was already allow before the change."
  AC-4:
    tests:
      - tests.test_destructive_guard_lexer_agreement.TestHeredocLineSeparatorsAndJoinedCloseLines.test_a_continued_body_line_does_not_close_an_unquoted_body_early
      - tests.test_destructive_guard_lexer_agreement.TestHeredocLineSeparatorsAndJoinedCloseLines.test_even_backslashes_and_quoted_delimiters_join_nothing
      - tests.test_destructive_guard_lexer_agreement.TestHeredocLineSeparatorsAndJoinedCloseLines.test_a_joined_body_line_followed_by_a_plain_close_line_is_allowed
    red_confirmed: true
    red_reason: "FR5 cases 1 and 2 (the first test, two subtests) failed against the unchanged hook: the body closed at the line END after foo\\ and the substitution line was outside the body, verdict allow. FR5 cases 3, 4 and 5 (the other two tests) were green before the change, as the plan states (deny today / allow today); they are regression guards, no red state occurred for them."
  AC-5:
    tests:
      - tests.test_destructive_guard_lexer_agreement.TestHeredocLineSeparatorsAndJoinedCloseLines.test_planner_found_forms_close_at_the_joined_line_and_are_denied
      - tests.test_destructive_guard_lexer_agreement.TestHeredocLineSeparatorsAndJoinedCloseLines.test_the_first_line_of_a_body_is_a_candidate_whatever_precedes_it
      - tests.test_destructive_guard_lexer_agreement.TestHeredocLineSeparatorsAndJoinedCloseLines.test_first_line_forms_that_close_are_denied
      - tests.test_destructive_guard_lexer_agreement.TestHeredocLineSeparatorsAndJoinedCloseLines.test_a_close_line_continued_with_an_odd_run_of_backslashes_only
      - tests.test_destructive_guard_lexer_agreement.TestHeredocLineSeparatorsAndJoinedCloseLines.test_a_close_line_continued_into_the_end_of_the_text
    red_confirmed: true
    red_reason: "Against the unchanged hook the EN\\ / D forms (planner forms 1 and 2) failed: the body ran on to the last line END and the rm line was inside the body. The third planner form (the quoted-then-unquoted first line B) was already deny and already closed at its first line before the change, as the plan states; it is a guard against a regression of the first-line rule. Five of the six extra first-line forms (joined with the following empty line, tab-only continued lines under <<-, three backslashes) failed against the unchanged hook too; the sixth (a tab-indented first line B under <<-) already held."
  AC-6:
    tests:
      - tests.test_destructive_guard_lexer_agreement.TestHeredocLineSeparatorsAndJoinedCloseLines.test_lexing_work_is_linear_for_every_case_repeated
      - tests.test_destructive_guard_lexer_agreement.TestHeredocLineSeparatorsAndJoinedCloseLines.test_lexing_work_is_linear_for_a_body_of_continued_lines
      - tests.test_destructive_guard_lexer_agreement.TestHeredocLineSeparatorsAndJoinedCloseLines.test_lexing_work_is_linear_when_every_body_starts_on_a_backslash_line
      - tests.test_destructive_guard_lexer_agreement.TestHeredocLineSeparatorsAndJoinedCloseLines.test_a_backslash_line_run_is_read_in_time
    red_confirmed: false
    red_reason: "These tests guard a property the unchanged hook already has: it joins nothing, so it is linear on every one of these inputs and all four passed against it before the change; no executable check of this criterion can fail without a joining implementation. Their sensitivity was shown on a deliberately naive lookup (a walk over the continuation run for each body's first line, patched in for one run only): test_a_backslash_line_run_is_read_in_time failed in both operator flavours (26 s not less than 3). The work counter does not include the close-line lookup, so the time test is the one that catches a rescan."
  AC-7:
