      - tests.test_destructive_guard_command_substitution.TestCaseTableDiscipline.test_runner_reports_every_case_passing
      - tests.test_destructive_guard_lexer_agreement.TestHeredocDelimiterWords
      - tests.test_destructive_guard_lexer_agreement.TestHeredocFallbackAndCloseLines
      - tests.test_destructive_guard_lexer_agreement.TestDelimiterWordStageAgreement
      - tests.test_destructive_guard_lexer_agreement.TestResumeSnapshot
      - tests.test_destructive_guard_lexer_agreement.TestModuleContract
    red_confirmed: false
    red_reason: "A dedicated new red is out of scope, but the existing tests detect the behavior: test_the_physical_close_line_index_is_unchanged (new) compares the one-argument close_lines() with a splitlines-based reference over 68 texts without the characters of SPEC.md FR3, the runner keeps every pre-existing case's verdict, and the existing classes read the delimiter words, close lines, resume snapshot and module contract; they were green before the change and are green after, so no red state occurred for this change. A differential run of the old and the new lexer over 50000 random texts (no FR3 character, no line ending in a backslash) gave identical maps."
