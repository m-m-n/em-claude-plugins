      contained a table, so their own construction is independent of
      live-document state and was green from first write (they assert
      behavior of the parser/comparator functions directly, not the live
      document). The three test_bash_guard_reads_workflow_yaml_but_not_task_status
      / test_bare_workflow_yaml_mention_without_status_accessor_is_false /
      test_removing_the_status_carveout_flips_observation_to_false tests
