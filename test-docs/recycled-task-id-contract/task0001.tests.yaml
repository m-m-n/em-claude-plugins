      tests/test_hook_classification_pin.py, reads_per_task_status was
      temporarily replaced with its pre-auto-fix definition from commit
      48386b9^ (a bare "workflow.yaml" in docstring-stripped-source check,
      without the AND'd per-task-status-accessor condition the auto-fix
      added), and only these three tests were run against it. All three
      FAIL: test_bash_guard_reads_workflow_yaml_but_not_task_status FAILS
      with "AssertionError: True is not false" (bash_guard.py's source
      contains "workflow.yaml" in executable code, so the pre-auto-fix rule
      reports it as reading per-task status even though it never derives one);
      test_bare_workflow_yaml_mention_without_status_accessor_is_false FAILS
      with "AssertionError: True is not false" (the synthetic source's bare
      "workflow.yaml" string literal alone satisfies the pre-auto-fix rule);
      test_removing_the_status_carveout_flips_observation_to_false FAILS
      with "AssertionError: True is not false", raised at its second
      assertion (the without_carveout source, which still contains the
      "workflow.yaml" glob-pattern string after the status accessor is
      deleted, is still observed True by the pre-auto-fix rule where False
      is expected); its first assertion (the with_carveout source, expected
      True) also evaluates True under the pre-auto-fix rule and does not
      raise. tests/test_hook_classification_pin.py was restored to its task
      base afterward with no diff.
