notes: >-
  AC-1 through AC-5's tests, and AC-6's four pre-existing tests, had their
  red state reconfirmed by temporarily restoring
  em-workflow/references/implement-phase.md to its pre-task base commit
  (b28a7166e8dce876075fc550ada7fdd7027211fa), re-running the affected test
  modules to observe the expected failures, then restoring the post-edit
  document and re-running the full suite to confirm it returned to green
  (1493 passed). This was done retroactively because the document edit and
  the new test module were authored together rather than strictly
  test-first; the task plan's own Test Notes flag this exact site
  ("TDD-awkward: the document edit itself cannot be driven test-first
  without first choosing the exact post-change phrases") as expected.
  AC-6's three tests added in feature recycled-test-docs-drift were
  re-observed separately, against a temporarily reverted
  reads_per_task_status rather than the restored document (see AC-6's own
  red_reason). AC-7's red_confirmed is false, not reconfirmed: the state it
  claims as "red" is a pre-implementation empty git diff, which is trivially
  true rather than an observed failure (see AC-7's own red_reason). No claim
  here extends to those two cases.
