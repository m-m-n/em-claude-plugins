      - test_sca_absolute_executable_resolution.TestAC2DefaultSearchPath.test_ac2_a_default_search_path_with_only_relative_entries_finds_nothing
      - test_sca_absolute_executable_resolution.TestAC2DefaultSearchPath.test_ac2_an_empty_path_counts_as_present_and_yields_no_entries
