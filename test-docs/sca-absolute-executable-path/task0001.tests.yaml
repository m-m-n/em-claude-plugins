      - test_sca_absolute_executable_resolution.TestAC3OnlyRelativeEntries.test_ac3_planning_reports_the_existing_tool_not_found_reason_once
    red_confirmed: true
    red_reason: >-
      Before the change: "AssertionError: 'tools/npm' is not None" and
      build_scan_jobs returned one ScanPlan with executable='tools/npm' instead
      of ([], ['npm_tool_not_found']).
  AC-4:
    tests:
      - test_sca_absolute_executable_resolution.TestAC4ExecutableTest.test_ac4_a_directory_and_a_non_executable_file_are_passed_over
      - test_sca_absolute_executable_resolution.TestAC4ExecutableTest.test_ac4_an_absent_name_in_every_absolute_entry_returns_none
    red_confirmed: false
    red_reason: >-
      The behavior pre-existed: the previous resolution (shutil.which) applied
      the same executable test (existing, non-directory, executable by the
      current user), so both tests passed before the change. The existing
      test_sca_go_govulncheck_real_output.py (TS-10) exercises resolution under
      a stub-only PATH but not a directory or a non-executable file, so no
      existing test covers this criterion.
  AC-5:
    tests:
      - test_sca_absolute_executable_resolution.TestAC5AttackScenario.test_ac5_npm_is_launched_by_the_stubs_absolute_path_and_no_planted_file_runs
      - test_sca_absolute_executable_resolution.TestAC5AttackScenario.test_ac5_go_in_the_attacked_directory_never_runs_the_planted_file
    red_confirmed: true
    red_reason: >-
      Before the change the npm test failed with "AssertionError: 0 != 1 :
      expected one npm launch, got []" (the relative tools/npm was never
      launched through the stub), and the go test failed with "AssertionError:
      True is not false" because the planted services/api/tools/govulncheck
      was launched and left its marker.
  AC-6:
    tests:
      - test_sca_absolute_executable_resolution.TestAC6LaunchPathIsTheResolvedAbsolutePath.test_ac6_a_nested_go_project_is_launched_by_the_absolute_path
      - test_sca_absolute_executable_resolution.TestAC6LaunchPathIsTheResolvedAbsolutePath.test_ac6_a_root_go_project_is_launched_by_the_absolute_path
      - test_sca_absolute_executable_resolution.TestAC6LaunchPathIsTheResolvedAbsolutePath.test_ac6_a_pip_requirements_file_is_launched_by_the_absolute_path
      - test_sca_absolute_executable_resolution.TestAC6LaunchPathIsTheResolvedAbsolutePath.test_ac6_an_npm_project_is_launched_by_the_absolute_path_from_its_isolation_directory
      - test_sca_absolute_executable_resolution.TestAC6LaunchPathIsTheResolvedAbsolutePath.test_ac6_a_cargo_project_is_launched_by_the_absolute_path_from_its_isolation_directory
    red_confirmed: true
    red_reason: >-
      Before the change all five failed with "AssertionError: 0 != 1 :
      expected one <tool> launch, got []": with PATH `tools:<stub dir>` the
      resolver returned the relative tools/<tool>, so the recording stub was
      not the file launched.
  AC-7:
    tests:
      - test_sca_absolute_executable_resolution.TestAC7ExplanationsStateTheAbsoluteOnlyRule.test_ac7_each_states_that_only_absolute_entries_are_searched
      - test_sca_absolute_executable_resolution.TestAC7ExplanationsStateTheAbsoluteOnlyRule.test_ac7_each_names_the_default_search_path_for_an_unset_path
      - test_sca_absolute_executable_resolution.TestAC7ExplanationsStateTheAbsoluteOnlyRule.test_ac7_each_names_the_existing_tool_not_found_reason
      - test_sca_absolute_executable_resolution.TestAC7ExplanationsStateTheAbsoluteOnlyRule.test_ac7_none_describes_resolution_as_a_plain_path_lookup
    red_confirmed: true
    red_reason: >-
      Run against the pre-change text of scan-dependencies.py (restored from
      git HEAD for that run), all four tests failed: the resolve_executable
