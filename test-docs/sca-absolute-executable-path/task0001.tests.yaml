      is reviewed by inspection.
  AC-8:
    tests:
      - test_sca_absolute_executable_resolution.TestAC8StandardLibraryOnly.test_ac8_the_script_adds_no_import_beyond_the_standard_library
      - test_sca_absolute_executable_resolution.TestAC8StandardLibraryOnly.test_ac8_this_module_imports_only_the_standard_library
      - test_sca_scan_invocation (ALLOWED_EXECUTABLES checks)
      - test_sca_scan_unchanged_surfaces (ECOSYSTEM_ENV_PINS, pass-through keys)
    red_confirmed: false
    red_reason: >-
      The outcome is the full-suite run (python3 -m unittest discover -s tests,
      and check-plugin-invariants.py), and the new import checks describe
      surfaces this task leaves unchanged, so they passed before the change; no
