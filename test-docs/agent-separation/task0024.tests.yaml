acceptance_tests:
  AC-1:
    tests:
      - tests.test_worker_contract_docs.TestWorkerEnvelopeStatusTablePayloadCorrection.test_needs_user_input_forbidden_set_matches_design_exactly
      - tests.test_worker_contract_docs.TestWorkerEnvelopeStatusTablePayloadCorrection.test_needs_user_input_no_longer_forbids_payload
      - tests.test_worker_contract_docs.TestWorkerEnvelopeStatusTablePayloadCorrection.test_needs_user_input_still_forbids_artifacts_patch_and_blocking_reason
    red_confirmed: true
    red_reason: >-
      Before the fix, worker-envelope.md's needs_user_input row still listed
      `payload` in Forbidden. test_needs_user_input_forbidden_set_matches_design_exactly
      failed with a set mismatch (rendered set included 'payload', design-derived
      set did not) and test_needs_user_input_no_longer_forbids_payload failed with
      "'payload' unexpectedly found". The third test (artifacts/patch/blocking_reason
      still forbidden) was already true before and after -- it guards the half of
      AC-1 that must NOT change.
  AC-2:
    tests:
      - tests.test_worker_contract_docs.TestWorkerEnvelopeStatusTablePayloadCorrection.test_other_non_completed_statuses_still_forbid_payload
      - tests.test_worker_contract_docs.TestWorkerEnvelopeStatusTablePayloadCorrection.test_completed_status_unchanged
    red_confirmed: false
    red_reason: >-
      This criterion asserts an invariant that must NOT change (payload stays
      forbidden for blocked/invalid_input/stale_input/failed, and completed is
      unaffected). Both tests passed before this task's edits too, since the
      envelope's rows for those four statuses were never touched -- there is no
      observable behavior change to watch go red. Verified by inspection that the
      corresponding table rows are byte-for-byte unchanged (git diff shows only the
      needs_user_input row and the Source paragraph changed).
  AC-3:
    tests:
      - tests.test_worker_contract_docs.TestWorkerEnvelopePriorAnalysisField.test_documents_prior_analysis_with_both_members
      - tests.test_worker_contract_docs.TestWorkerEnvelopePriorAnalysisField.test_states_a_numeric_size_bound
      - tests.test_worker_contract_docs.TestWorkerEnvelopePriorAnalysisField.test_states_requirements_analyst_only
    red_confirmed: true
    red_reason: >-
      Before the fix, worker-envelope.md had no `### \`prior_analysis\`` heading at
      all: test_documents_prior_analysis_with_both_members failed with "substring
      not found", and test_states_a_numeric_size_bound / test_states_requirements_analyst_only
      errored (ValueError from text.index) since the anchor heading did not exist.
  AC-4:
