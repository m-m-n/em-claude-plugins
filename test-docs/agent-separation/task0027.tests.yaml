  AC-2:
    tests: [tests.test_check_plugin_invariants.TestGateIdCoverage.test_mention_inside_the_checkers_own_file_does_not_count_as_a_reference]
    red_confirmed: true
    red_reason: >-
      Before the fix: AssertionError: True is not false (result.passed was
      True) -- a synthetic policy key named only inside a copy of the
      checker's own file at em-workflow/scripts/check-plugin-invariants.py
      was wrongly reported as referenced.
  AC-3:
    tests: [tests.test_check_plugin_invariants.TestGateIdCoverage.test_real_repository_gate_ids_named_in_the_checkers_comments_are_still_referenced]
    red_confirmed: false
    red_reason: >-
      This test already passed before the implementation change: measured
      directly (script run against the real repository comparing the
      reference direction with and without the checker's own file included)
      that `create-spec.design-system` and `design-system.reclassify` --
      the two policy keys the checker's own comments name as examples --
      already have genuine references elsewhere in the plugin today, so
      removing the self-match does not flip them. The criterion is a
      regression guard (the self-exclusion must not remove a genuine
      reference), not a behavior that was broken pre-fix; AC-2's synthetic
      test is what proves the removal actually happened.
  AC-4:
    tests: [tests.test_check_plugin_invariants.TestGateIdCoverage, tests.test_check_plugin_invariants.TestStaleReferences, tests.test_check_plugin_invariants.TestAgentDispatchParity]
