      to red first; all pre-existing cases for both directions (and the
      sibling stale-reference/dispatch-parity checks sharing the same
      exclusion-set convention) continued to pass unmodified after the
      change.
  AC-5:
    tests: [tests.test_check_plugin_invariants.TestRepositoryLevelInvariant.test_checker_exits_cleanly_against_the_repository_root]
    red_confirmed: false
    red_reason: >-
      Pre-existing test (task0021), asserts CLI exit 0 against the real
      repository root; passed before and after this task's change (also
      confirmed by manually running `check-plugin-invariants.py .`, exit 0).
