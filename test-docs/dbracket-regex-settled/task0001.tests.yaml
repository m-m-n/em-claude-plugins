    red_confirmed: true
    red_reason: >-
      The class was written before the hook was changed and run against the
      unchanged hook. The scan test failed for every form with
      "AssertionError: True is not false", the notion-call test with "Lists
      differ: ['nothing'] != ['inspected']", and the whole-judgment test with
      "Tuples differ: ('allow', None) != ('deny', 'git-branch-force-delete')".
      Two forms of this criterion, `[[ x =~ ^(ab)$ ]]` and (AC-4)
      `[[ a == b && true =~ ^(ab)$ ]]`, read false in the per-chunk scan after
      the change, but their notion call is still inspected (and the decision
      deny) because _args_json_shadow_scan() item 3, a reading outside this
      change, splits the same statement at every parenthesis and cannot
      restore the leftover `$ ]]` command name. The notion-call and decision
      parts of this criterion are therefore checked on the `$`-free twin
      `[[ x =~ ^(ab)c ]]`; the `$` forms are checked for the scan answer only.
  AC-2:
    tests:
      - tests.test_destructive_guard_args_json.TestDbracketRegexSettled.test_a_closer_inside_the_pattern_is_not_the_closer
    red_confirmed: false
    red_reason: >-
      The behavior pre-existed: on the unchanged hook both forms already read
      uncertain (any `=~` or extended-pattern prefix did), so the notion call
      was inspected and the decision deny before the implementation. The test
      guards a fix that closes at the first `]]` or drops the depth; no red
      state occurred for this change.
