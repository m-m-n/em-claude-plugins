acceptance_tests:
  AC-1:
    tests:
      - tests.test_queue_launch_guard_linked_layout.TestLinkedLayoutMainWorktreeLaunch.test_launch_from_main_worktree_is_allowed_and_recorded_in_every_placement
    red_confirmed: false
    red_reason: >-
      The launch from the main worktree was already allowed before the change,
      because a worktree path without the segment left the project root
      undetermined and the cwd check was skipped (fail-open); the test passed
      against the unchanged hook. It pins that the new derivation does not turn
      that allow into a false deny: deriving the root as the git common dir
      itself instead of its parent made it fail for all three link placements
      (mutation run, not a red state of this change).
  AC-2:
    tests:
      - tests.test_queue_launch_guard_linked_layout.TestLinkedLayoutOtherWorktreeLaunch.test_launch_from_integration_worktree_is_denied_naming_the_main_worktree
      - tests.test_queue_launch_guard_linked_layout.TestLinkedLayoutOtherWorktreeLaunch.test_denied_launch_leaves_no_launched_event_and_no_journal
      - tests.test_queue_launch_guard_linked_layout.TestLinkedLayoutOtherWorktreeLaunch.test_launch_from_the_task_worktree_itself_is_also_denied
    red_confirmed: true
    red_reason: >-
      Run against the unchanged hook (tests written first), the two
      per-placement tests failed for each of the three link placements and the
      task-worktree test failed, all with AssertionError: '' == '' : expected a
      deny decision, got no output, because the hook skipped the cwd check and
      appended a launched event.
  AC-3:
    tests:
      - tests.test_queue_launch_guard_linked_layout.TestSegmentAbsentFailOpen.test_existing_directory_inside_a_non_repository_fails_open
      - tests.test_queue_launch_guard_linked_layout.TestSegmentAbsentFailOpen.test_nonexistent_absolute_path_fails_open
      - tests.test_queue_launch_guard.TestCwdOutsideProjectRoot.test_worktree_path_outside_layout_fails_open
    red_confirmed: false
    red_reason: >-
      These cases were fail-open before the change (a path without the segment
      had no project root) and stay fail-open: the two new tests and the
      existing test_worktree_path_outside_layout_fails_open, which is not
      modified, all passed against the unchanged hook. No red state occurred
      for this change; they pin that the new fallback adds no denial when git
      cannot resolve a common dir.
  AC-4:
    tests:
      - tests.test_queue_launch_guard_linked_layout.TestFallbackCallShape.test_path_with_the_segment_triggers_no_process_at_all
      - tests.test_queue_launch_guard_linked_layout.TestFallbackCallShape.test_path_with_the_segment_triggers_no_git_common_dir_call_in_the_cwd_check
      - tests.test_queue_launch_guard_linked_layout.TestFallbackCallShape.test_last_occurrence_of_the_segment_gives_the_root
      - tests.test_queue_launch_guard_linked_layout.TestFallbackCallShape.test_segment_at_the_start_of_the_path_is_undetermined_without_fallback
      - tests.test_queue_launch_guard_linked_layout.TestFallbackCallShape.test_path_without_the_segment_triggers_exactly_one_git_common_dir_call
      - tests.test_queue_launch_guard_linked_layout.TestFallbackCallShape.test_the_fallback_timeout_is_the_existing_bounded_constant
      - tests.test_queue_launch_guard_linked_layout.TestFallbackCallShape.test_cwd_check_without_the_segment_makes_one_common_dir_call
      - tests.test_queue_launch_guard_linked_layout.TestFallbackCallShape.test_root_is_the_parent_directory_of_the_normalized_output
      - tests.test_queue_launch_guard_linked_layout.TestFallbackCallShape.test_missing_or_non_string_cwd_skips_the_check_before_any_git_call
    red_confirmed: true
    red_reason: >-
      Run against the unchanged hook (tests written first),
      test_path_without_the_segment_triggers_exactly_one_git_common_dir_call
      failed with AssertionError: None != '/proj' (no fallback ran),
      test_cwd_check_without_the_segment_makes_one_common_dir_call failed with
      AssertionError: 0 != 1, and
      test_root_is_the_parent_directory_of_the_normalized_output failed for
      each scripted output. The segment-present, segment-at-start and
      missing-cwd tests describe behavior that already held (no git call) and
      passed before the change.
  AC-5:
    tests:
      - tests.test_queue_launch_guard_linked_layout.TestFallbackFailures.test_each_failure_leaves_the_project_root_undetermined
      - tests.test_queue_launch_guard_linked_layout.TestFallbackFailures.test_each_failure_yields_no_denial_although_the_cwd_toplevel_resolves
      - tests.test_queue_launch_guard_linked_layout.TestFallbackFailures.test_a_resolved_common_dir_with_another_toplevel_is_a_denial
      - tests.test_queue_launch_guard_linked_layout.TestFallbackFailures.test_the_hook_exits_zero_with_no_output_and_records_the_launch
    red_confirmed: true
    red_reason: >-
      Run against the unchanged hook (tests written first), every failure
      case (fails to start, times out, exits non-zero, whitespace-only output,
      empty output, relative output) failed with AssertionError: 0 != 1,
      because each case asserts that the one git-common-dir call was actually
      attempted before the root is judged undetermined; the control
      test_a_resolved_common_dir_with_another_toplevel_is_a_denial failed
      with AssertionError: None != '/proj'. The invalid-value case
      (ValueError) was added after the red run and was not itself observed
      failing before the implementation.
