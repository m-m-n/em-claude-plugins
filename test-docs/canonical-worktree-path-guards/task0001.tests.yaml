      - tests.test_queue_launch_guard_linked_layout.TestStdlibAndDeterminism.test_the_fixture_environment_drops_the_repository_selecting_variables
      - tests.test_queue_launch_guard.TestStdlibOnly.test_imports_are_all_stdlib
    red_confirmed: false
    red_reason: >-
      A dedicated new module is out of scope for the hook's stdlib property,
      but the existing test_queue_launch_guard.TestStdlibOnly detects a
