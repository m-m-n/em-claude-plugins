      - tests.test_queue_launch_guard_linked_layout.TestHookDocstring.test_the_presence_search_is_not_defeated_by_line_wrapping
      - tests.test_queue_launch_guard_linked_layout.TestHookDocstring.test_the_outside_layout_skip_statement_is_absent
      - tests.test_queue_launch_guard_linked_layout.TestHookDocstring.test_the_absence_search_finds_the_statement_in_the_pre_change_excerpt
      - tests.test_queue_launch_guard_linked_layout.TestHookDocstring.test_the_absence_search_finds_the_statement_in_a_forged_docstring
    red_confirmed: true
    red_reason: >-
      Run against the unchanged hook (tests written first),
      test_each_current_statement_is_present failed for each of the three
