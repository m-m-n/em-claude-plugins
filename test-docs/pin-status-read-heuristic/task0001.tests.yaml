      S1/S2/S4 (assertTrue) went red against the removed name/call rule
      before this task's implementation existed: `AssertionError: False is
      not true` (reads_per_task_status returned False because no defined
      function name matched the old task+status identifier pattern). The
      False-otherwise half of AC-1's rule is pinned by AC-4's S3 test
      (recorded separately below, red_confirmed: false there because it is
      green under both rules). The removal half of AC-1 (no
      `_TASK_STATUS_NAME_RE` / `task_status_fn_names` / `called_names`, no
      import left unused) is not a unit-testable property of the module
      itself; per the task plan's Test Notes it is checked by source
      inspection (grep confirms none of the three names remain, and
      `ast`/`tempfile`/`unittest`/`Path` are all still referenced after
      `re` was dropped).
  AC-2:
    tests:
      - tests.test_hook_classification_pin.TestNameIndependentStatusObservation.test_s1_helper_reads_indented_status_key_without_task_status_name_is_true
      - tests.test_hook_classification_pin.TestNameIndependentStatusObservation.test_s1_mismatched_classification_row_produces_one_disagreement
    red_confirmed: true
    red_reason: >-
      Both S1 tests went red against the removed rule: the observation test
      raised `AssertionError: False is not true` (no function name in S1
      matched the old task+status pattern), and the comparator test failed
      with `AssertionError: Lists differ: [] != [(...)]` (compare_table_to_
