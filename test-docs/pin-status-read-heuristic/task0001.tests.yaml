      - tests.test_hook_classification_pin.TestNameIndependentStatusObservation.test_s1_helper_reads_indented_status_key_without_task_status_name_is_true
      - tests.test_hook_classification_pin.TestNameIndependentStatusObservation.test_s2_helper_renamed_off_the_task_status_pattern_is_still_true
      - tests.test_hook_classification_pin.TestNameIndependentStatusObservation.test_s4_uncalled_status_helper_is_still_true
