      already agreed with the tampered DOES_NOT_READ_STATUS row under the
      old rule).
  AC-3:
    tests:
      - tests.test_hook_classification_pin.TestNameIndependentStatusObservation.test_s2_helper_renamed_off_the_task_status_pattern_is_still_true
    red_confirmed: true
    red_reason: "assertion failed: AssertionError: False is not true (statuses_from_workflow does not match the removed task+status name pattern)"
  AC-4:
    tests:
      - tests.test_hook_classification_pin.TestNameIndependentStatusObservation.test_s3_uppercase_only_status_is_false
    red_confirmed: false
    red_reason: >-
      Green under both the removed and the new rule (task plan Test Notes:
      "AC-4 is green under both rules; it pins the case-sensitivity
      decision rather than reproducing the bug"). Under the removed rule
      S3 also returns False because no function name matches the old
      task+status pattern, so this test does not distinguish the two
      rules on its own; its purpose is pinning the case-sensitive
      "status" match going forward, which the test's own precondition
      assertions (stripped text contains "workflow.yaml", does not contain
      lowercase "status") make attributable.
  AC-5:
