  AC-7:
    tests: []
    red_confirmed: false
    red_reason: >-
      Verifiable only by reading the docstrings and comments (task plan
      Test Notes: "AC-7 is checked by reading the docstrings and
      comments"), not by a unit test. The `reads_per_task_status` docstring
