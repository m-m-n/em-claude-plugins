acceptance_tests:
  AC-1:
    tests:
      - tests.test_abort_terminal_write_resume.TestImplementPhaseAbortExceptionNamedAndScoped.test_names_the_exception
      - tests.test_abort_terminal_write_resume.TestImplementPhaseAbortExceptionNamedAndScoped.test_names_the_call_site
      - tests.test_abort_terminal_write_resume.TestImplementPhaseAbortExceptionNamedAndScoped.test_states_the_uncommitted_write_fact
