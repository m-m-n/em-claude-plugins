      helper accepted ANY dict carrying a non-empty spec_change record
      regardless of phase/feature/consumed, so assertFalse/exit-1 assertions
      got assertTrue/exit-0 instead.
      test_missing_reentry_signal_defaults_to_initial_planning already
      existed pre-task0017 and continues to pass (it needed no code change);
      kept in this AC's set because it is the "signal absent" direction AC-2
      itself enumerates.
