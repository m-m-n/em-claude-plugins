      - test_validate_worker_output.TestReplaceAllCreatePlanEntryStatus.test_create_plan_in_progress_rejected_for_exactly_one_reason
      - test_validate_worker_output.TestReplaceAllCreatePlanEntryStatus.test_create_plan_needs_update_passes
