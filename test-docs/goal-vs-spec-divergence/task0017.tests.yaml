      - test_validate_worker_output.TestReplanningMandatoryPreserveAndTaskIdAllocation.test_corrected_replanning_merged_tasks_fixture_passes
    red_confirmed: true
    red_reason: >-
      Ran the NEW validator code (task0017's implementation) against the
      pre-task0017 HEAD content of
      valid-replace-all-replanning-merged-tasks/{input,phase-state}.json
      directly via the CLI: exit code 1 (replace-all-not-permitted) instead
      of 0 -- the old phase-state.json carried no `phase`/`feature` keys, so
      the new resolve_rework_phase_state() no longer recognized it as a
      rework-phase mapping, and the merged task0009 then failed the
      initial-planning floor. This is the exact regression the task plan
      names ("the valid- fixture ... pins the counter-example of what the
      document declares mandatory") and confirms the fixture correction
      (phase/feature/preserve/entries) was necessary, not cosmetic.
