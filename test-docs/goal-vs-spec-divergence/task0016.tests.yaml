  AC-1:
    tests:
      - tests.test_validate_worker_output.TestReplaceAllCreatePlanEntryStatus.test_replanning_reentry_with_merged_task_passes
      - tests.test_validate_worker_output.TestReplanningReentrySignalHelper.test_spec_change_record_with_base_commit_is_a_reentry
      - tests.test_validate_worker_output.TestReplanningReentrySignalHelper.test_spec_change_record_without_base_commit_is_not_a_reentry
    red_confirmed: true
    red_reason: >-
      Ran the CLI against the new valid-replace-all-replanning-merged-tasks
      fixture with the pre-task0016 validator (git show HEAD of
      em-workflow/scripts/validate-worker-output.py): exit 1, code
      replace-all-not-permitted, "replace_all requires tasks to be empty or
      all pending (implementation has started)" -- a merged task on the
      create-plan:pending re-entry path was rejected. The direct helper
      tests failed with AttributeError (workflow_replace_all_spec_change_
      reentry did not exist) before the implementation.
  AC-2:
    tests:
      - tests.test_validate_worker_output.TestReplaceAllCreatePlanEntryStatus.test_initial_planning_with_merged_task_still_rejected
    red_confirmed: false
    red_reason: >-
      Retention/negative proof, not new behaviour: the old code's task-status
      test ran independently of create-plan's status, so a merged task was
      already rejected regardless of path before this task. Verified by
      running the pre-task0016 validator (git show HEAD) against this exact
      fixture: identical exit 1 / replace-all-not-permitted output as after
      the change. AC-2's contribution is proving the NEW path-aware
      implementation still rejects this shape, not that it newly starts to.
  AC-3:
    tests:
      - tests.test_validate_worker_output.TestReplaceAllCreatePlanEntryStatus.test_after_implementation_started_rejected_on_replanning_path_too
    red_confirmed: true
    red_reason: >-
      The error code (replace-all-not-permitted) was already produced by the
      pre-task0016 code for this fixture, but its message text was "replace_all
      requires tasks to be empty or all pending (implementation has started)"
      -- it does not contain the substring "in_progress". This test's
      assertIn("in_progress", messages) failed against the pre-implementation
      code (verified via git show HEAD) and passes against the new message
      "replace_all requires no task to be in_progress or failed
      (implementation has started)".
  AC-4:
    tests:
      - tests.test_validate_worker_output.TestReplaceAllCreatePlanEntryStatus.test_create_plan_needs_update_passes
      - tests.test_validate_worker_output.TestReplaceAllCreatePlanEntryStatus.test_create_plan_pending_passes
      - tests.test_validate_worker_output.TestReplaceAllCreatePlanEntryStatus.test_create_plan_in_progress_rejected_with_replace_all_not_permitted
      - tests.test_validate_worker_output.TestReplaceAllCreatePlanEntryStatus.test_create_plan_in_progress_rejected_for_exactly_one_reason
