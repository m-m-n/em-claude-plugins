      - test_guardrail_hooks_migration.TestRepositoryRulesAreInPlace.test_existence_check_fails_for_a_rule_that_does_not_exist
    red_confirmed: true
    red_reason: >-
      test_every_repository_rule_exists failed in the baseline with
      "AssertionError: Lists differ: ['plugin-version-bump.md'] != []".
      The negative-proof test failed with "NameError: name
      '_missing_rule_files' is not defined" before the helper function was
      written; after implementing it, the test asserts that a synthetic
      name 'does-not-exist.md' is reported missing.
  AC-3:
    tests:
      - test_guardrail_hooks_migration.TestRepositoryRulesAreInPlace.test_existence_check_fails_against_an_empty_rules_directory
      - test_guardrail_hooks_migration.TestRepositoryRulesAreInPlace.test_repository_rule_list_is_not_empty
    red_confirmed: true
    red_reason: >-
      test_existence_check_fails_against_an_empty_rules_directory failed
      with "NameError: name '_missing_rule_files' is not defined" before
      the helper existed; after implementing it, a synthetic empty temp
      directory is asserted to report every named rule missing.
      test_repository_rule_list_is_not_empty itself passed immediately
      (the pre-existing REPO_RULE_FILES tuple was already non-empty), so
      it did not independently go red -- the non-vacuity property is what
      the empty-directory case demonstrates.
  AC-4:
    tests:
      - test_guardrail_hooks_migration.TestRepositoryRulesAreInPlace.test_every_repository_rule_file_is_non_empty
      - test_guardrail_hooks_migration.TestRepositoryRulesAreInPlace.test_non_empty_check_fails_for_an_empty_file
      - test_guardrail_hooks_migration.TestRepositoryRulesAreInPlace.test_every_repository_rule_file_names_what_it_governs
      - test_guardrail_hooks_migration.TestRepositoryRulesAreInPlace.test_heading_check_fails_for_a_file_without_a_level_1_heading
    red_confirmed: true
    red_reason: >-
      All four failed with NameError (`_empty_rule_files` /
      `_rule_files_without_a_level1_heading` not yet defined) before the
      helpers were written. After implementing them: the two production
      tests assert every real rule file is non-empty and opens on a
      level-1 heading; the two negative-proof tests assert a synthetic
      empty file and a synthetic headless file are each flagged. The
      class's test count grew from 3 (pre-task) to 9, so it did not
      shrink, and no other class in the module lost a case.
  AC-5:
