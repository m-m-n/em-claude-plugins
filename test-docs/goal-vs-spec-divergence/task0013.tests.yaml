notes: >-
  Deviation: tests/test_gate_option_vocabulary.py (outside expected_files)
  required a one-line SHA-256 refresh in
  TestFrozenMachineReadSurface.WORKFLOW_PATCH_SHA256. That constant pins
  workflow-patch.md's exact bytes and was last refreshed by this same
  feature's task0002 (its own comment documents the refresh-not-remove
  convention for whoever next intentionally edits workflow-patch.md); this
  task is the next such edit, so the constant and its comment were updated
  to the new byte-identity hash and to name task0013 alongside task0002.
