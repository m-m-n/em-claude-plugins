      drafting -- all three transition documents state identically that
      the SPEC-change transition sets `create-spec` to `needs_update` and
      `create-plan`/`implement`/`review` to `pending` (never
      `create-plan: needs_update`), which is exactly the state
      workflow-patch.md's widened Re-planning path now names.
