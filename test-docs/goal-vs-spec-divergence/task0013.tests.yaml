      - test_routeback_reset_scope_consistency.TestI2aRecursionInvariantPresent.test_carve_out_still_scoped_to_failed_only
      - test_routeback_reset_scope_consistency.TestI2aRecursionInvariantPresent.test_retained_in_flight_sentence_survives
      - test_recycled_task_id_consistency.TestUnreachablePendingLaunchedCombination.test_retained_in_flight_sentence_survives
      - test_recycled_task_id_consistency.TestRecycledTaskIdRuleScopedToOrchestrator.test_does_not_read_group_is_non_empty
      - test_recycled_task_id_consistency.TestRecycledTaskIdRuleScopedToOrchestrator.test_reads_group_is_non_empty
