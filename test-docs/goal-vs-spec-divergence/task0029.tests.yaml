      - tests.test_spec_change_replan_authorization.TestOneConsumptionProcedureDocument.test_application_rule_count_is_updated_in_the_same_edit
      - tests.test_spec_change_replan_authorization.TestOneConsumptionProcedureDocument.test_phase_state_cites_but_does_not_restate_the_procedure
